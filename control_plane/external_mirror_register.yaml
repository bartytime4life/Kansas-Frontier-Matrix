    "decision_ref": "ADR-0029",
    "rule_refs": [
      "13.2 Safe path grammar (externally fixed names)"
    ]
  },
  "owner": "@bartytime4life",
  "reviewers": [
    "@bartytime4life"
  ],
  "description": "Projection of accepted ADR-0048: a file name inside a registered byte mirror of an external source is externally fixed under Directory Rules 13.2 when the mirror's pinned receipt shows the path exists upstream (site_sha256 present) and an enforced parity check verifies the mirror against that receipt. The repository topology validator relaxes only the listed path-grammar rules, only for those upstream-backed entries, and only while the entry is ACTIVE and its receipt and parity check are tracked. Repository-only overlays keep the default grammar. Receipts pin content (REVIEW_ONLY); they do not record human review acceptance.",
  "non_effects": [
    "does_not_amend_directory_rules_bytes",
    "does_not_relax_unsafe_or_nonportable_path_rules",
    "does_not_relax_repository_only_overlays",
    "does_not_record_or_imply_human_review_acceptance",
    "does_not_grant_source_release_or_publication_authority",
    "does_not_authorize_in_place_renames_of_mirrored_files"
  ],
  "mirrors": [
    {
      "mirror_id": "mirror.apps-site-source",
      "status": "ACTIVE",
      "path_prefix": "apps/site/source/",
      "external_source": "external KFM site source repository (site_candidate_commit recorded per receipt)",
      "root_decision_ref": "apps/README.md#root-naming-decision-external-site-mirror",
      "parity_check": "tools/qa/site_mirror.py",
      "parity_command": "python tools/qa/site_mirror.py --check",
      "relaxed_rules": [
        "path-grammar:uppercase"
      ],
      "rename_rule": "rename upstream, then mirror through a reviewed sync with a fresh receipt; never rename in place",
      "registered_on": "2026-10-12",
      "registered_by_change": "PR #5060 (exemption); PR #5064 (root decision, ADR-0048); PR #5065 (register, ADR-0048 acceptance)",
      "receipt_rule": "derived from the single RECEIPT = ROOT / \"data/receipts/generated/<name>.json\" assignment in parity_check; the register keeps no copy, so a mirror sync updates only the parity check"
    }
  ],
  "decision_ref": "ADR-0048",
  "decision_path": "docs/adr/ADR-0048-external-mirror-names-are-externally-fixed.md",
  "decision_rule": "the validator relaxes nothing unless decision_ref is ADR-0048 and that ADR's metadata records status and effective_decision_status accepted"
}

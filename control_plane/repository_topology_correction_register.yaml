  # DRAFT / PROPOSED — not reviewed, not accepted, not consumable.
  # Chains sequentially from the KFM-TOPO-004-CORR-4228-01 "to" fingerprint
  # (post-agriculture state). Each entry's "from" equals the previous
  # entry's "to"; order was chosen only to produce a valid, verifiable
  # chain and may be re-sequenced by the reviewing decision. Every
  # fingerprint below was computed directly from live Git blob IDs, not
  # invented. decision_ref intentionally has no accepted ADR yet: these
  # transitions are outside ADR-0038's stated scope (issue #4228 covers
  # only the agriculture path). PR #4512 attempted to resolve this drift
  # by reverting these seven paths to their pre-redirect blobs instead of
  # registering the redirect text, and was itself reverted (PR #4514)
  # after a review objection that the restored (old) text "reintroduced
  # forbidden frozen-root write guidance." These entries instead propose
  # accepting the current, post-#4514 redirect text as the registered
  # target — the opposite direction from #4512 — per owner instruction.
  # A real accepted decision record (see decision_ref.path, not yet
  # written) is required before Stage 1B binding.


# Kansas Frontier Matrix Dependabot configuration
# Version: v1.4
# Updated: 2026-08-28
#
# Authority boundary:
# - Dependabot proposes dependency changes through pull requests.
# - It does not approve, merge, release, publish, change policy, or establish
#   that an update is compatible, secure, rights-cleared, or production-ready.
# - Security updates stay on the default branch because no target-branch is set.
# - Group rules and cooldowns below apply only to version updates. Security
#   updates are not delayed by cooldown; their grouping is controlled
#   separately and must be read from each generated PR and current settings.
# - Cross-directory Python groups use dependency-name grouping so the same
#   dependency can be reviewed once across matching manifests.
# - npm, GitHub Actions, and pre-commit major updates remain individual for
#   focused compatibility and workflow-boundary review.
# - SemVer ecosystems use 30-day major, 7-day minor, and 3-day patch
#   stabilization windows. Pre-commit hooks use a 7-day default window.
# - Configured labels are advisory routing only. GitHub ignores a configured
#   label that does not already exist; labels never establish compatibility,
#   security, approval, or merge readiness.
# - The payload-free Explorer image override package is monitored separately
#   because it is outside the root npm workspaces and owns an independent lock.
# - Docker base-image updates are monitored from /infra/docker. Dependabot's
#   Docker fetcher discovers case-insensitive filenames containing Dockerfile,
#   including the current Dockerfile.* placeholders. Each image update remains
#   isolated for digest, compatibility, and security review.
# - Dependabot does not provide Docker security updates; this lane proposes
#   version updates only, and vulnerability assessment remains a review step.
# - Private registries are not configured; adding one requires a separate
#   credentials, least-privilege, and external-code-execution review.

version: 2

updates:
  # Python monorepo: root app, application, package, domain-package, pipeline,
  # and connector manifests. Globs are intentionally bounded to known
  # responsibility roots rather than scanning every repository directory.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
      - "/packages/domains/*"
      - "/pipelines/*"
      - "/connectors/*"
      - "/connectors/*/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 6
    assignees:
      - "bartytime4life"
    labels:
      - "dependencies"
      - "python"
      - "needs-review"
    commit-message:
      prefix: "deps(python)"
      prefix-development: "deps(python-dev)"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    groups:
      # Cross-directory grouping remains per dependency, including majors.
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        group-by: "dependency-name"
      python-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
        group-by: "dependency-name"

  # The root package.json declares the apps/* and packages/* workspaces.
  # Production and development minor/patch updates stay in separate PRs;
  # major updates are intentionally left ungrouped.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 4
    assignees:
      - "bartytime4life"
    labels:
      - "dependencies"
      - "javascript"
      - "needs-review"
    commit-message:
      prefix: "deps(node)"
      prefix-development: "deps(node-dev)"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    groups:
      node-production-minor-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      node-development-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The payload-free Explorer image's hash-locked npm overrides are outside the
  # root workspaces. Keep this lockfile lane separate from application updates;
  # major override changes remain individual for focused image-build review.
  - package-ecosystem: "npm"
    directory: "/infra/docker/explorer-web"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 2
    assignees:
      - "bartytime4life"
    labels:
      - "dependencies"
      - "javascript"
      - "ci"
      - "needs-review"
    commit-message:
      prefix: "deps(container-node)"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    groups:
      container-node-minor-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Digest-pinned base images in the two repository Dockerfile.* placeholders.
  # Dependabot's Docker fetcher recognizes these custom filenames. Keep each
  # proposal isolated so the affected image, digest, and compatibility boundary
  # remain independently reviewable.
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    assignees:
      - "bartytime4life"
    labels:
      - "dependencies"
      - "ci"
      - "needs-review"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    pull-request-branch-name:
      separator: "-"

  # GitHub Actions references in .github/workflows and repository-local actions.
  # Minor/patch updates are grouped; major action boundary changes stay isolated.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3
    assignees:
      - "bartytime4life"
    labels:
      - "dependencies"
      - "github_actions"
      - "ci"
      - "needs-review"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Root .pre-commit-config.yaml hook revisions.
  # Minor/patch updates are grouped; major hook changes stay isolated.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    assignees:
      - "bartytime4life"
    labels:
      - "dependencies"
      - "pre_commit"
      - "ci"
      - "needs-review"
    commit-message:
      prefix: "chore(pre-commit)"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    groups:
      pre-commit-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

# Temporary branch-only diagnostic. Never merge this workflow.
name: topology-diagnostics-artifact

"on":
  push:
    branches:
      - agent/topology-diagnostics-20260912

permissions:
  contents: write

concurrency:
  group: topology-diagnostics-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derive:
    name: derive-containment-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact containment head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d86306a23f35295f5ecd66f2a1306d528d26e136
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Derive strict uppercase-evidence shrink only
        shell: bash
        env:
          KFM_NO_NETWORK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          PYTHONUNBUFFERED: "1"
          TZ: UTC
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          root = Path(".").resolve()
          module_root = root / "tools/validators/directory_governance"
          sys.path.insert(0, str(module_root))
          import validate_repository_topology as topology

          baseline_path = topology.DEFAULT_BASELINE
          baseline_data = json.loads(baseline_path.read_text(encoding="utf-8"))
          entries = baseline_data.get("entries")
          if not isinstance(entries, list):
              raise RuntimeError("baseline entries are unavailable")

          findings, tracked_count = topology.scan(root)
          target = next(
              finding
              for finding in findings
              if finding.rule_id == "KFM-TOPO-001"
              and finding.subject == "path-grammar:uppercase"
          )

          old_fingerprint = "sha256:495f2e5cca0cf2e824fa5a403df9719b5bd40741738db4b49de3ebad401661ed"
          old_indexes = [
              index for index, entry in enumerate(entries)
              if isinstance(entry, dict) and entry.get("fingerprint") == old_fingerprint
          ]
          if len(old_indexes) != 1:
              raise RuntimeError("expected exactly one inherited uppercase baseline entry")

          old_entry = entries[old_indexes[0]]
          old_members = topology._decode_evidence_members(
              old_entry.get("evidence_zlib_base64"), old_entry.get("evidence_sha256")
          )
          new_members = tuple(target.evidence_members)
          removed = sorted(set(old_members) - set(new_members))
          added = sorted(set(new_members) - set(old_members))
          expected_removed = ["docs/KFM_Whole_UI_Governed_AI_Expansion_Report.pdf"]
          if removed != expected_removed or added:
              raise RuntimeError(f"unexpected uppercase evidence delta: removed={removed!r} added={added!r}")
          if len(old_members) != 892 or len(new_members) != 891:
              raise RuntimeError("uppercase evidence cardinality is not a one-member shrink")

          entries[old_indexes[0]] = topology._serialized_baseline_entry(target)
          entries.sort(key=lambda entry: entry["fingerprint"])
          candidate = root / "repository_topology_baseline.candidate.json"
          candidate.write_text(
              json.dumps(baseline_data, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          baseline_path.write_bytes(candidate.read_bytes())

          receipt = {
              "version": "kfm.topology-containment-candidate.v1",
              "checkout_commit": "d86306a23f35295f5ecd66f2a1306d528d26e136",
              "trusted_base_commit": "d3f9db88d0d48291ac3810f684eeeb5b9aeca72d",
              "tracked_path_count": tracked_count,
              "rule_id": target.rule_id,
              "subject": target.subject,
              "old_fingerprint": old_fingerprint,
              "new_fingerprint": target.fingerprint,
              "old_member_count": len(old_members),
              "new_member_count": len(new_members),
              "removed_paths": removed,
              "added_paths": added,
              "catalog_paths_restored": [
                  "catalog/STAC/README.md",
                  "catalog/domain/README.md",
                  "catalog/index/README.md",
                  "catalog/manifest/README.md",
                  "catalog/proof/README.md",
                  "catalog/publication/README.md",
                  "catalog/triplet/README.md",
              ],
              "catalog_agriculture_transition_consumed": False,
          }
          (root / "topology-containment-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Validate exact trusted-base transition and remaining hold
        shell: bash
        env:
          KFM_NO_NETWORK: "1"
          KFM_TRUSTED_BASE_REF: d3f9db88d0d48291ac3810f684eeeb5b9aeca72d
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          PYTHONUNBUFFERED: "1"
          TZ: UTC
        run: |
          set +e
          python tools/validators/directory_governance/render_repository_topology_diagnostics.py \
            > topology-containment-diagnostics.txt 2>&1
          status=$?
          set -e
          cat topology-containment-diagnostics.txt
          test "$status" -eq 1
          ! grep -q 'KFM-TOPO-001' topology-containment-diagnostics.txt
          grep -F 'FAIL_NEW_DRIFT KFM-TOPO-004 subject=catalog/ fingerprint=sha256:0ad45247555960029c34d1222365cbe17a5cabec278bf9f6b8f3e9572ea33e8f' topology-containment-diagnostics.txt
          grep -F 'STALE_BASELINE KFM-TOPO-004 subject=catalog/ fingerprint=sha256:521388927153c91a67ca8cead55af9d688a6064517d109aa556cffca91505006' topology-containment-diagnostics.txt
          grep -E '^FAIL_INVARIANT: [0-9]+ tracked paths; 0 invariant; 1 new drift; [0-9]+ baselined warnings; 1 stale baseline entries$' topology-containment-diagnostics.txt
          grep -E '^TOPOLOGY_CONTEXT_END status=UNCHANGED .* validator_exit=1$' topology-containment-diagnostics.txt

      - name: Prove candidate changed only one baseline identity
        shell: bash
        run: |
          git show d3f9db88d0d48291ac3810f684eeeb5b9aeca72d:tools/validators/directory_governance/repository_topology_baseline.json \
            > repository_topology_baseline.base.json
          python - <<'PY'
          from __future__ import annotations

          import difflib
          import json
          from pathlib import Path

          base_path = Path("repository_topology_baseline.base.json")
          candidate_path = Path("repository_topology_baseline.candidate.json")
          receipt_path = Path("topology-containment-receipt.json")

          base = json.loads(base_path.read_text(encoding="utf-8"))
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))

          base_metadata = {key: value for key, value in base.items() if key != "entries"}
          candidate_metadata = {key: value for key, value in candidate.items() if key != "entries"}
          if base_metadata != candidate_metadata:
              raise RuntimeError("candidate changed baseline metadata")

          base_entries = base.get("entries")
          candidate_entries = candidate.get("entries")
          if not isinstance(base_entries, list) or not isinstance(candidate_entries, list):
              raise RuntimeError("candidate baseline entries are unavailable")
          if len(base_entries) != len(candidate_entries):
              raise RuntimeError("candidate changed baseline entry count")

          base_by_fingerprint = {entry["fingerprint"]: entry for entry in base_entries}
          candidate_by_fingerprint = {entry["fingerprint"]: entry for entry in candidate_entries}
          old_fingerprint = receipt["old_fingerprint"]
          new_fingerprint = receipt["new_fingerprint"]
          removed_fingerprints = set(base_by_fingerprint) - set(candidate_by_fingerprint)
          added_fingerprints = set(candidate_by_fingerprint) - set(base_by_fingerprint)
          if removed_fingerprints != {old_fingerprint}:
              raise RuntimeError(f"unexpected removed fingerprints: {sorted(removed_fingerprints)!r}")
          if added_fingerprints != {new_fingerprint}:
              raise RuntimeError(f"unexpected added fingerprints: {sorted(added_fingerprints)!r}")

          for fingerprint in sorted(set(base_by_fingerprint) & set(candidate_by_fingerprint)):
              if base_by_fingerprint[fingerprint] != candidate_by_fingerprint[fingerprint]:
                  raise RuntimeError(f"unchanged fingerprint mutated: {fingerprint}")

          new_entry = candidate_by_fingerprint[new_fingerprint]
          if new_entry.get("rule_id") != "KFM-TOPO-001":
              raise RuntimeError("replacement is not KFM-TOPO-001")
          if new_entry.get("subject") != "path-grammar:uppercase":
              raise RuntimeError("replacement subject is not path-grammar:uppercase")
          if receipt.get("removed_paths") != ["docs/KFM_Whole_UI_Governed_AI_Expansion_Report.pdf"]:
              raise RuntimeError("receipt does not describe the strict one-path shrink")
          if receipt.get("added_paths") != []:
              raise RuntimeError("receipt contains unexpected additions")
          if receipt.get("catalog_agriculture_transition_consumed") is not False:
              raise RuntimeError("candidate consumed the held agriculture transition")

          patch = difflib.unified_diff(
              base_path.read_text(encoding="utf-8").splitlines(keepends=True),
              candidate_path.read_text(encoding="utf-8").splitlines(keepends=True),
              fromfile="repository_topology_baseline.base.json",
              tofile="repository_topology_baseline.candidate.json",
          )
          Path("topology-baseline.patch").write_text("".join(patch), encoding="utf-8")
          print(json.dumps({
              "removed_fingerprints": sorted(removed_fingerprints),
              "added_fingerprints": sorted(added_fingerprints),
              "unchanged_entry_count": len(base_by_fingerprint) - 1,
          }, indent=2, sort_keys=True))
          PY

      - name: Stage verified candidate as an unreferenced Git blob
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          candidate_path = Path("repository_topology_baseline.candidate.json")
          candidate = candidate_path.read_bytes()
          git_blob_sha = hashlib.sha1(
              b"blob " + str(len(candidate)).encode("ascii") + b"\0" + candidate
          ).hexdigest()
          candidate_sha256 = hashlib.sha256(candidate).hexdigest()
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          payload = json.dumps({
              "content": base64.b64encode(candidate).decode("ascii"),
              "encoding": "base64",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/git/blobs",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "kfm-topology-candidate-stager",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          returned_sha = result.get("sha")
          if returned_sha != git_blob_sha:
              raise RuntimeError(
                  f"staged blob mismatch: expected {git_blob_sha}, returned {returned_sha}"
              )
          receipt = {
              "version": "kfm.unreferenced-git-blob.v1",
              "repository": repository,
              "candidate_size_bytes": len(candidate),
              "candidate_sha256": f"sha256:{candidate_sha256}",
              "git_blob_sha": returned_sha,
              "ref_mutated": False,
              "commit_created": False,
          }
          Path("topology-candidate-blob.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload bounded candidate and receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topology-containment-candidate-${{ github.run_id }}
          path: |
            repository_topology_baseline.candidate.json
            topology-containment-receipt.json
            topology-containment-diagnostics.txt
            topology-baseline.patch
            topology-candidate-blob.json
          if-no-files-found: error
          retention-days: 1

# Validate the fixture-only QueryRunRecord -> AIChangeProposal -> RecompileManifest loop slice.
name: recompile-manifest

"on":
  pull_request:
    paths:
      - ".github/workflows/recompile-manifest.yml"
      - "contracts/governance/recompile_manifest.md"
      - "schemas/contracts/v1/governance/recompile_manifest.schema.json"
      - "fixtures/contracts/v1/governance/recompile_manifest/**"
      - "tools/generators/recompile_manifest/**"
      - "tools/validators/governance/validate_recompile_manifest.py"
      - "tests/validators/governance/test_recompile_manifest.py"
      - "contracts/governance/query_run_record.md"
      - "schemas/contracts/v1/governance/query_run_record.schema.json"
      - "tools/validators/governance/validate_query_run_record.py"
      - "contracts/governance/ai_change_proposal.md"
      - "schemas/contracts/v1/governance/ai_change_proposal.schema.json"
      - "tools/validators/governance/validate_ai_change_proposal.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-recompile-manifest-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/recompile-manifest.yml"
      - "contracts/governance/recompile_manifest.md"
      - "schemas/contracts/v1/governance/recompile_manifest.schema.json"
      - "fixtures/contracts/v1/governance/recompile_manifest/**"
      - "tools/generators/recompile_manifest/**"
      - "tools/validators/governance/validate_recompile_manifest.py"
      - "tests/validators/governance/test_recompile_manifest.py"
      - "contracts/governance/query_run_record.md"
      - "schemas/contracts/v1/governance/query_run_record.schema.json"
      - "tools/validators/governance/validate_query_run_record.py"
      - "contracts/governance/ai_change_proposal.md"
      - "schemas/contracts/v1/governance/ai_change_proposal.schema.json"
      - "tools/validators/governance/validate_ai_change_proposal.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-recompile-manifest-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recompile-manifest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-recompile-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/hashing/pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]" -e "./packages/hashing[test]"

      - name: Revalidate upstream fixture contracts
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/governance \
            --pattern 'test_ai_change_proposal.py' \
            --verbose
          python -m unittest discover \
            --start-directory tests/validators/governance \
            --pattern 'test_query_run_record.py' \
            --verbose

      - name: Run deterministic no-network recompile tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/governance \
            --pattern 'test_recompile_manifest.py' \
            --verbose
          python tools/generators/recompile_manifest/compile_recompile_manifest.py \
            --fixtures
          python tools/validators/governance/validate_recompile_manifest.py \
            --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-recompile-manifest-20260806.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### RecompileManifest validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only QueryRunRecord and AIChangeProposal validation, in-memory JSON compilation, deterministic manifest/output/rollback binding, replay, negative polarity, and authoring-receipt integrity."
            echo "- Boundary: a green result writes no file and does not authenticate evidence, policy, review, mutation, promotion, release, deployment, publication, or public use."
          } >> "$GITHUB_STEP_SUMMARY"

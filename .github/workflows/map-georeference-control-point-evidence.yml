name: map-georeference-control-point-evidence

"on":
  pull_request:
    paths:
      - ".github/workflows/map-georeference-control-point-evidence.yml"
      - "contracts/map/georeference_control_point_evidence_assessment.md"
      - "schemas/contracts/v1/map/georeference_control_point_evidence_assessment.schema.json"
      - "fixtures/contracts/v1/map/georeference_control_point_evidence_assessment/**"
      - "tools/validators/map/validate_georeference_control_point_evidence_assessment.py"
      - "tests/map/test_georeference_control_point_evidence_assessment.py"
      - "docs/intake/exploratory/pass-18-georeference-control-point-evidence-source-map.md"
      - "data/receipts/generated/genrec-pass18-georeference-control-point-evidence-20260811.json"
      - "data/receipts/generated/genrec-georeference-control-point-evidence-contract-currentness-20260908.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-georeference-control-point-evidence.yml"
      - "contracts/map/georeference_control_point_evidence_assessment.md"
      - "schemas/contracts/v1/map/georeference_control_point_evidence_assessment.schema.json"
      - "fixtures/contracts/v1/map/georeference_control_point_evidence_assessment/**"
      - "tools/validators/map/validate_georeference_control_point_evidence_assessment.py"
      - "tests/map/test_georeference_control_point_evidence_assessment.py"
      - "docs/intake/exploratory/pass-18-georeference-control-point-evidence-source-map.md"
      - "data/receipts/generated/genrec-pass18-georeference-control-point-evidence-20260811.json"
      - "data/receipts/generated/genrec-georeference-control-point-evidence-contract-currentness-20260908.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-georeference-control-point-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema and test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests
        run: python -m pytest -q tests/map/test_georeference_control_point_evidence_assessment.py
      - name: Run exact fixture polarity
        run: python tools/validators/map/validate_georeference_control_point_evidence_assessment.py --fixtures
      - name: Replay historical authoring receipt at its originating commit
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-pass18-georeference-control-point-evidence-20260811.json
          --repo-root .
          --artifact-git-ref ded9a9755316fee97827d5d65b8fc26e31c2ae4b
      - name: Validate currentness authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-georeference-control-point-evidence-contract-currentness-20260908.json
          --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Georeference control-point evidence assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only internal coherence for declared visibility, contrast, marker scale, coordinate-source, matching, reference binding, summary, and deterministic identity."
            echo "- Boundary: PASS means ready for human review only; it does not resolve evidence, establish accuracy, duplicate distribution/transform checks, or authorize policy, release, publication, or public use."
          } >> "$GITHUB_STEP_SUMMARY"

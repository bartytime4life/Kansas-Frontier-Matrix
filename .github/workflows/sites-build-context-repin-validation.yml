name: sites-build-context-repin-validation
on:
  push:
    branches: ["validation/sites-build-context-repin-20260905"]
    paths: [".github/workflows/sites-build-context-repin-validation.yml"]
permissions:
  contents: read
concurrency:
  group: sites-build-context-repin-validation-${{ github.ref }}
  cancel-in-progress: false
env:
  KFM_NO_NETWORK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  COREPACK_ENABLE_STRICT: "1"
  TZ: UTC
jobs:
  matched-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            ref: "94e976ff281ff5033c1c91ada417ab1d0c445f7b"
          - label: candidate
            ref: "be9d1023449b3fe6e46a941aa47149e0f5b0698b"
    env:
      CHECKED_REF: ${{ matrix.ref }}
      COMPARISON_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Preserve every substantive result without converting failures to success
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import datetime, hashlib, json, os, pathlib, subprocess, time
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sites-guard-comparison'
          out.mkdir()
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['CHECKED_REF']
          assert not git('status', '--porcelain')
          base = '94e976ff281ff5033c1c91ada417ab1d0c445f7b'
          original = '3d75f67e8ca48c74e1fab43b1fdebefc383e1d23'
          expected = [
              'apps/kansas-frontier-matrix-explorer/docs/build-source-context.md',
              'apps/kansas-frontier-matrix-explorer/scripts/build-verified.sh',
              'apps/kansas-frontier-matrix-explorer/tests/build-verified.test.mjs',
              'data/receipts/generated/genrec-directory-build-context-20260905.json',
          ]
          meta = {'label': os.environ['COMPARISON_LABEL'], 'checked_out_commit': git('rev-parse','HEAD'),
              'checked_out_tree': git('rev-parse','HEAD^{tree}'), 'base': base,
              'workflow_head': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'observed_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'results': [], 'limits': ['No deployment, live Site readback, browser/GPU proof, source admission or rules adoption.']}
          if meta['label'] == 'candidate':
              actual = sorted(git('diff','--name-only',base,'HEAD').splitlines())
              assert actual == sorted(expected), actual
              assert subprocess.run(['git','merge-base','--is-ancestor',original,'HEAD']).returncode == 0
              assert subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD']).returncode == 0
              for p in expected:
                  assert git('ls-tree', original, '--', p) == git('ls-tree', 'HEAD', '--', p), p
              meta['exact_original_artifacts_preserved'] = True
              meta['changed_paths'] = actual
          else:
              meta['changed_paths'] = []
          protected = ['package.json','pnpm-lock.yaml','pnpm-workspace.yaml',
              'apps/kansas-frontier-matrix-explorer/package.json','apps/kansas-frontier-matrix-explorer/package-lock.json',
              'docs/doctrine/directory-rules.md','docs/adr/ADR-0029-adopt-directory-governance-standard-v2.md',
              'tools/validators/directory_governance/validate_repository_topology.py',
              'tools/validators/directory_governance/repository_topology_baseline.json',
              'control_plane/repository_topology_correction_register.yaml']
          def hashes():
              return {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in protected}
          before = hashes()
          meta['protected_input_sha256'] = before
          meta['artifact_sha256'] = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected if pathlib.Path(p).is_file()}
          meta['node'] = subprocess.check_output(['node','--version'],text=True).strip()
          meta['python'] = subprocess.check_output(['python3','--version'],text=True).strip()
          def save():
              (out/'observation.json').write_text(json.dumps(meta,indent=2)+'\n')
          def run(name, args, timeout=600):
              started=time.monotonic()
              with (out/(name+'.log')).open('w') as log:
                  try:
                      code=subprocess.run(args, stdout=log, stderr=subprocess.STDOUT, timeout=timeout).returncode
                  except subprocess.TimeoutExpired:
                      code=124;log.write('\nCOLLECTOR_TIMEOUT\n')
              meta['results'].append({'check':name,'command':args,'exit':code,'elapsed_seconds':round(time.monotonic()-started,3)})
              print(name,code,flush=True);save()
              return code
          run('wrapper-tests',['node','--test','apps/kansas-frontier-matrix-explorer/tests/build-verified.test.mjs'])
          run('wrapper-syntax',['bash','-n','apps/kansas-frontier-matrix-explorer/scripts/build-verified.sh'])
          assert json.loads(pathlib.Path('package.json').read_text())['packageManager'] == 'pnpm@11.17.0'
          if run('corepack-enable',['corepack','enable']) == 0 and run('pnpm-version',['pnpm','--version']) == 0:
              assert (out/'pnpm-version.log').read_text().strip() == '11.17.0'
              if run('pnpm-install',['pnpm','install','--frozen-lockfile']) == 0:
                  run('sites-build',['pnpm','--filter','kansas-frontier-matrix-explorer','build'])
                  run('explorer-build',['pnpm','--filter','explorer-web','build'])
                  run('explorer-unit',['pnpm','--filter','explorer-web','test:unit'])
                  run('sites-full-node',['bash','-lc','node --test apps/kansas-frontier-matrix-explorer/tests/*.test.mjs'])
          if run('python-install',['python3','tools/ci/install_python_ci.py','test-dependencies']) == 0:
              run('topology-tests',['python3','-m','unittest','discover','--start-directory','tests/validators/directory_governance','--pattern','test_validate_*topology.py','--verbose'])
              run('topology-current-tree',['python3','tools/validators/directory_governance/validate_repository_topology.py','--trusted-baseline-ref',base])
              if meta['label'] == 'candidate':
                  run('generated-receipt',['python3','tools/validators/validate_generated_receipt.py','data/receipts/generated/genrec-directory-build-context-20260905.json'])
          meta['protected_inputs_unchanged'] = before == hashes()
          meta['final_tracked_diff'] = git('diff','--name-only')
          meta['final_index_diff'] = git('diff','--cached','--name-only')
          for p in ['topology-current-tree.log']:
              try:
                  report=json.loads((out/p).read_text())
                  meta['topology']={k:report[k] for k in ['counts','outcome','tracked_path_count']}
                  meta['topology']['new_findings']=[x for x in report['findings'] if x['disposition']=='FAIL_NEW_DRIFT']
                  meta['topology']['stale_fingerprints']=report['baseline']['stale_fingerprints']
              except (FileNotFoundError, ValueError, KeyError):
                  meta['topology_parse_failed']=True
          save()
          print(json.dumps(meta,indent=2),flush=True)
          failed=any(r['exit'] != 0 for r in meta['results']) or not meta['protected_inputs_unchanged'] or meta['final_tracked_diff'] or meta['final_index_diff']
          raise SystemExit(1 if failed else 0)
          PYTHON
      - name: Preserve exact-head evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sites-guard-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sites-guard-comparison/
          if-no-files-found: error
          retention-days: 14

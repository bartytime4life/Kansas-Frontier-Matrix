# Temporary read-only exact-head validation for one immutable repository-control
# candidate. This workflow grants no pull-request, merge, settings, release,
# deployment, promotion, publication, or source-state authority.

name: repository-control-focused-diagnostic

"on":
  push:
    branches:
      - validation/repository-control-input-bounds-eb320ee

permissions:
  contents: read

concurrency:
  group: repository-control-focused-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_TARGET_SHA: "ce481946f4f93431abd92808b13657866d2bf9e4"
  KFM_TRUSTED_BASE_REF: "bd942b45493fa5f80e946ecfb3e810e413787394"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  exact-candidate:
    name: exact-candidate-ce481946
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact identity, ancestry, scope, and whitespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${KFM_TARGET_SHA}"
          git merge-base --is-ancestor "${KFM_TRUSTED_BASE_REF}" HEAD
          test "$(git merge-base "${KFM_TRUSTED_BASE_REF}" HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          git diff --check "${KFM_TRUSTED_BASE_REF}...HEAD"
          cat > expected-paths.txt <<'EOF'
          .github/workflows/repository-control.yml
          docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md
          tests/validators/test_repository_control_input_bounds.py
          tests/validators/test_repository_control_strict_input.py
          tools/validators/repository_control/fetch_bounded_issue_comments.py
          EOF
          git diff --name-only "${KFM_TRUSTED_BASE_REF}...HEAD" | LC_ALL=C sort > actual-paths.txt
          LC_ALL=C sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt actual-paths.txt

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Compile changed and adjacent Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            tools/validators/repository_control/fetch_bounded_issue_comments.py \
            tools/validators/repository_control/validate_control_source_availability.py \
            tools/validators/repository_control/validate_transition_authorization.py \
            tests/validators/test_repository_control_input_bounds.py \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py

      - name: Parse repository-control workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          value = yaml.safe_load(
              Path('.github/workflows/repository-control.yml').read_text(encoding='utf-8')
          )
          if not isinstance(value, dict) or value.get('name') != 'repository-control':
              raise SystemExit('repository-control workflow shape mismatch')
          PY

      - name: Run focused suite and preserve full trace
        id: focused
        shell: bash
        run: |
          set +e
          pytest -vv --tb=long --showlocals \
            tests/validators/test_repository_control_input_bounds.py \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py \
            > focused-pytest.log 2>&1
          rc=$?
          cat focused-pytest.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Run validator registry check
        id: registry
        shell: bash
        run: |
          set +e
          make validator-registry-check > validator-registry.log 2>&1
          rc=$?
          cat validator-registry.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Run schema checks
        id: schemas
        shell: bash
        run: |
          set +e
          make schemas > schemas.log 2>&1
          rc=$?
          cat schemas.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Run workflow-security checks
        id: security
        shell: bash
        run: |
          set +e
          make workflow-security > workflow-security.log 2>&1
          rc=$?
          cat workflow-security.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-control-exact-ce481946
          path: |
            expected-paths.txt
            actual-paths.txt
            focused-pytest.log
            validator-registry.log
            schemas.log
            workflow-security.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce exact-head validation result
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.focused.outputs.exit_code }}" = "0"
          test "${{ steps.registry.outputs.exit_code }}" = "0"
          test "${{ steps.schemas.outputs.exit_code }}" = "0"
          test "${{ steps.security.outputs.exit_code }}" = "0"

  paired-repository-topology:
    name: paired-repository-topology-ce481946
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TRUSTED_BASE_REF }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TARGET_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact paired identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          test "$(git -C candidate rev-parse HEAD)" = "${KFM_TARGET_SHA}"
          git -C candidate merge-base --is-ancestor "${KFM_TRUSTED_BASE_REF}" HEAD

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Install declared validator dependencies
        working-directory: candidate
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run and classify paired topology
        id: paired
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p topology-diagnostic
          set +e
          (cd base && make repository-topology) > topology-diagnostic/base.raw.log 2>&1
          base_rc=$?
          (cd candidate && make repository-topology) > topology-diagnostic/candidate.raw.log 2>&1
          candidate_rc=$?
          set -e
          BASE_RC="${base_rc}" CANDIDATE_RC="${candidate_rc}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('topology-diagnostic')

          def load(name: str) -> str:
              return (root / name).read_text(encoding='utf-8', errors='replace')

          def report(text: str):
              marker = 'AssertionError: 0 != 1 : '
              for line in text.splitlines():
                  if marker in line:
                      return json.loads(line.split(marker, 1)[1])
              return None

          def signature(text: str, return_code: int):
              parsed = report(text)
              value = {
                  'return_code': return_code,
                  'failed_tests': sorted(
                      line.removeprefix('FAIL: ').strip()
                      for line in text.splitlines()
                      if line.startswith('FAIL: ')
                  ),
                  'report_present': parsed is not None,
              }
              if parsed is not None:
                  value.update({
                      'outcome': parsed.get('outcome'),
                      'rule_count': parsed.get('rule_count'),
                      'counts': parsed.get('counts'),
                      'stale_fingerprints': sorted(
                          parsed.get('baseline', {}).get('stale_fingerprints', [])
                      ),
                      'non_baselined_findings': sorted(
                          (
                              item.get('disposition'),
                              item.get('rule_id'),
                              item.get('subject'),
                              item.get('fingerprint'),
                              item.get('evidence_sha256'),
                          )
                          for item in parsed.get('findings', [])
                          if item.get('disposition') != 'BASELINED_WARNING'
                      ),
                  })
              return value

          base_rc = int(os.environ['BASE_RC'])
          candidate_rc = int(os.environ['CANDIDATE_RC'])
          base_signature = signature(load('base.raw.log'), base_rc)
          candidate_signature = signature(load('candidate.raw.log'), candidate_rc)
          signatures_equal = base_signature == candidate_signature

          if base_rc == 0 and candidate_rc == 0:
              classification = 'BOTH_PASS'
          elif base_rc != 0 and candidate_rc == 0:
              classification = 'CANDIDATE_REPAIRS_BASE'
          elif base_rc == 0 and candidate_rc != 0:
              classification = 'CANDIDATE_REGRESSION'
          elif signatures_equal:
              classification = 'INHERITED_EQUIVALENT_FAILURE'
          else:
              classification = 'BOTH_FAIL_DIFFERENT_SIGNATURE'

          (root / 'base.failure-signature.json').write_text(
              json.dumps(base_signature, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          (root / 'candidate.failure-signature.json').write_text(
              json.dumps(candidate_signature, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          result = {
              'trusted_base_sha': os.environ['KFM_TRUSTED_BASE_REF'],
              'candidate_sha': os.environ['KFM_TARGET_SHA'],
              'base_exit_code': base_rc,
              'candidate_exit_code': candidate_rc,
              'failure_signatures_equal': signatures_equal,
              'classification': classification,
              'authority': 'NONE',
          }
          (root / 'result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'classification={classification}\n')
          PY
          cat topology-diagnostic/result.json

      - name: Upload paired-topology evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-topology-paired-ce481946
          path: topology-diagnostic/
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on candidate-specific topology failure
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.paired.outputs.classification }}" in
            BOTH_PASS|CANDIDATE_REPAIRS_BASE|INHERITED_EQUIVALENT_FAILURE)
              exit 0
              ;;
            *)
              exit 1
              ;;
          esac

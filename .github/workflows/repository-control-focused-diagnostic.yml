# Temporary read-only diagnostic for one immutable repository-control candidate.
# This validation-only workflow grants no pull-request, merge, settings, release,
# deployment, promotion, publication, or source-state authority.

name: repository-control-focused-diagnostic

"on":
  push:
    branches:
      - validation/repository-control-input-bounds-eb320ee

permissions:
  contents: read

concurrency:
  group: repository-control-focused-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_TARGET_SHA: "d711a2404521eb7e7f476bf31d124dcaad825a3d"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  focused-diagnostic:
    name: focused-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${KFM_TARGET_SHA}"

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run focused suite and preserve full trace
        id: focused
        shell: bash
        run: |
          set +e
          pytest -vv --tb=long --showlocals \
            tests/validators/test_repository_control_input_bounds.py \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py \
            > focused-pytest.log 2>&1
          rc=$?
          cat focused-pytest.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload diagnostic trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-control-focused-diagnostic-d711a240
          path: focused-pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Preserve failing conclusion
        shell: bash
        run: exit "${{ steps.focused.outputs.exit_code }}"

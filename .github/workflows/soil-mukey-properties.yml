# Validate the inactive, fixture-only MukeyProperties aggregate profile.
name: soil-mukey-properties

"on":
  pull_request:
    paths:
      - ".github/workflows/soil-mukey-properties.yml"
      - "contracts/domains/soil/mukey_properties.md"
      - "schemas/contracts/v1/domains/soil/mukey_properties.schema.json"
      - "fixtures/domains/soil/mukey_properties/**"
      - "tools/validators/domains/soil/mukey_properties/**"
      - "tests/validators/domains/soil/mukey_properties/**"
      - "data/receipts/generated/genrec-soil-mukey-properties-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/soil-mukey-properties.yml"
      - "contracts/domains/soil/mukey_properties.md"
      - "schemas/contracts/v1/domains/soil/mukey_properties.schema.json"
      - "fixtures/domains/soil/mukey_properties/**"
      - "tools/validators/domains/soil/mukey_properties/**"
      - "tests/validators/domains/soil/mukey_properties/**"
      - "data/receipts/generated/genrec-soil-mukey-properties-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soil-mukey-properties-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-soil-mukey-properties
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic no-network tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/domains/soil/mukey_properties \
            --pattern 'test_mukey_properties.py' \
            --verbose
          python tools/validators/domains/soil/mukey_properties/validate_mukey_properties.py \
            --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-soil-mukey-properties-20260806.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### MukeyProperties fixture profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed schema, synthetic MUKEY/COKEY/CHKEY lineage, component closure, horizon continuity, physical ranges, deterministic aggregation, and hash binding."
            echo "- Boundary: a green result activates no source, resolves no EvidenceBundle, executes no policy, and authorizes no promotion, release, publication, advice, or public use."
          } >> "$GITHUB_STEP_SUMMARY"

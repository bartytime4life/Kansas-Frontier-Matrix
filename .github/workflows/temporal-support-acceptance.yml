name: temporal-support-acceptance

"on":
  pull_request:
    paths:
      - ".github/workflows/temporal-support-acceptance.yml"
      - "contracts/common/temporal_support_acceptance_assessment.md"
      - "schemas/contracts/v1/common/temporal_support_acceptance_assessment.schema.json"
      - "fixtures/contracts/v1/common/temporal_support_acceptance_assessment/**"
      - "tools/validators/validate_temporal_support_acceptance_assessment.py"
      - "tests/cross_domain/test_temporal_support_acceptance_assessment.py"
      - "docs/intake/exploratory/pass-20-temporal-support-acceptance-source-map.md"
      - "data/receipts/generated/genrec-pass20-temporal-support-acceptance-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporal-support-acceptance.yml"
      - "contracts/common/temporal_support_acceptance_assessment.md"
      - "schemas/contracts/v1/common/temporal_support_acceptance_assessment.schema.json"
      - "fixtures/contracts/v1/common/temporal_support_acceptance_assessment/**"
      - "tools/validators/validate_temporal_support_acceptance_assessment.py"
      - "tests/cross_domain/test_temporal_support_acceptance_assessment.py"
      - "docs/intake/exploratory/pass-20-temporal-support-acceptance-source-map.md"
      - "data/receipts/generated/genrec-pass20-temporal-support-acceptance-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-support-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-temporal-support-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/validate_temporal_support_acceptance_assessment.py tests/cross_domain/test_temporal_support_acceptance_assessment.py
          python -m unittest tests.cross_domain.test_temporal_support_acceptance_assessment --verbose
          python tools/validators/validate_temporal_support_acceptance_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass20-temporal-support-acceptance-20260810.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Temporal support acceptance"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only cross-surface time-dimension, ordering, release-time, correction-time, and disclosure coherence."
            echo "- Boundary: no reference resolution, source freshness evaluation, evidence or policy decision, lifecycle write, review, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

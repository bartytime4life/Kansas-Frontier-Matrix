# Validate the fixture-only field-level API authorization assessment candidate.
name: field-level-api-authorization-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/field-level-api-authorization-assessment.yml"
      - "contracts/release/field_level_api_authorization_assessment.md"
      - "schemas/contracts/v1/release/field_level_api_authorization_assessment.schema.json"
      - "fixtures/contracts/v1/release/field_level_api_authorization_assessment/**"
      - "tools/validators/release/validate_field_level_api_authorization_assessment.py"
      - "tests/validators/release/test_validate_field_level_api_authorization_assessment.py"
      - "docs/intake/exploratory/pass-18-field-level-api-authorization-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass18-field-level-api-authorization-20260811.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/field-level-api-authorization-assessment.yml"
      - "contracts/release/field_level_api_authorization_assessment.md"
      - "schemas/contracts/v1/release/field_level_api_authorization_assessment.schema.json"
      - "fixtures/contracts/v1/release/field_level_api_authorization_assessment/**"
      - "tools/validators/release/validate_field_level_api_authorization_assessment.py"
      - "tests/validators/release/test_validate_field_level_api_authorization_assessment.py"
      - "docs/intake/exploratory/pass-18-field-level-api-authorization-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass18-field-level-api-authorization-20260811.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-level-api-authorization-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-field-level-api-authorization-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic tests and fixture replay
        run: |
          python -m unittest -v tests.validators.release.test_validate_field_level_api_authorization_assessment
          python tools/validators/release/validate_field_level_api_authorization_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass18-field-level-api-authorization-20260811.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### FieldLevelApiAuthorizationAssessmentCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only per-field classification, lifecycle, policy-outcome, grant, role, embargo, evidence-reference, projection, and surface declarations."
            echo "- Boundary: no route creation, authentication, policy execution, field-value access, response emission, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate non-authoritative briefing integration and the water-planning
# semantic, authority-reference, and canonical registry boundaries. This
# workflow is read-only and emits no KFM release or publication authority.

name: briefing-integration

"on":
  pull_request:
    paths:
      - ".github/workflows/briefing-integration.yml"
      - "contracts/governance/briefing_signal.md"
      - "schemas/contracts/v1/governance/briefing_signal.schema.json"
      - "fixtures/contracts/v1/governance/briefing_signal/**"
      - "tools/validators/governance/**"
      - "tests/governance/**"
      - "examples/briefing_integration/**"
      - "contracts/domains/water_planning/**"
      - "schemas/contracts/v1/domains/water_planning/**"
      - "fixtures/domains/water_planning/**"
      - "data/registry/datasets/water_planning/**"
      - "data/registry/crosswalks/water_planning/**"
      - "data/registry/sources/water_planning/**"
      - "data/processed/water_planning/rac_regions/**"
      - "tools/validators/domains/water_planning/**"
      - "tests/domains/water_planning/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/briefing-integration.yml"
      - "contracts/governance/briefing_signal.md"
      - "schemas/contracts/v1/governance/briefing_signal.schema.json"
      - "fixtures/contracts/v1/governance/briefing_signal/**"
      - "tools/validators/governance/**"
      - "tests/governance/**"
      - "examples/briefing_integration/**"
      - "contracts/domains/water_planning/**"
      - "schemas/contracts/v1/domains/water_planning/**"
      - "fixtures/domains/water_planning/**"
      - "data/registry/datasets/water_planning/**"
      - "data/registry/crosswalks/water_planning/**"
      - "data/registry/sources/water_planning/**"
      - "data/processed/water_planning/rac_regions/**"
      - "tools/validators/domains/water_planning/**"
      - "tests/domains/water_planning/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: briefing-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-briefing-signals:
    name: validate-briefing-signals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e .

      - name: Run BriefingSignal tests
        run: |
          python -m unittest discover \
            --start-directory tests/governance \
            --pattern 'test_briefing_signal.py' \
            --verbose

      - name: Validate current briefing examples
        run: |
          python tools/validators/governance/validate_briefing_signal.py \
            examples/briefing_integration/*.json

      - name: Record briefing boundary
        if: always()
        run: |
          {
            echo "### Briefing integration"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: non-authoritative BriefingSignal shape, examples, deterministic routing guardrails, and no-network behavior."
            echo "- A green result is not evidence, source admission, repository authorization, policy approval, proof closure, release, deployment, publication, or public truth."
          } >> "$GITHUB_STEP_SUMMARY"

  preserve-water-planning-anti-collapse:
    name: preserve-water-planning-anti-collapse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run water-planning semantic and registry suites
        run: |
          python -m unittest discover \
            --start-directory tests/domains/water_planning \
            --pattern 'test_*.py' \
            --verbose

      - name: Validate canonical RAC registry
        run: |
          python tools/validators/domains/water_planning/validate_rac_registry.py

      - name: Record water-planning boundary
        if: always()
        run: |
          {
            echo "### Water-planning boundaries"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- The suites keep meetings, applications, recommendations, awards, payments, construction, completion, program versions, scoring matrices, identities, geometries, crosswalks, and lineage distinct."
            echo "- The RAC registry check pins the 14-feature KWO geometry payload, all 105 Kansas county GEOIDs, the ordered 209-row intersection digest, and the not-released posture."
            echo "- A green result does not prove source freshness, rights clearance, governance membership, evidence closure, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

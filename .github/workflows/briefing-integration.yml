# Validate non-authoritative briefing integration, deterministic BriefingSignal
# identity/dedup/materiality/routing, read-only issue-inventory binding, the
# shared temporal-authority and advisory-event profiles, and water-planning
# semantic and canonical registry boundaries.
# This workflow is read-only and emits no KFM alert, release, or publication authority.
name: briefing-integration

"on":
  pull_request:
    paths:
      - ".github/workflows/briefing-integration.yml"
      - "docs/architecture/briefing-integration.md"
      - "contracts/governance/briefing_signal.md"
      - "contracts/governance/issue_inventory_projection.md"
      - "schemas/contracts/v1/governance/briefing_signal.schema.json"
      - "schemas/contracts/v1/governance/issue_inventory_projection.schema.json"
      - "fixtures/contracts/v1/governance/briefing_signal/**"
      - "fixtures/contracts/v1/governance/issue_inventory_projection/**"
      - "tools/validators/governance/**"
      - "tests/governance/**"
      - "examples/briefing_integration/**"
      - "contracts/common/temporal_authority_envelope.md"
      - "schemas/contracts/v1/common/temporal_authority_envelope.schema.json"
      - "fixtures/contracts/v1/common/temporal_authority_envelope/**"
      - "tools/validators/validate_temporal_authority_envelope.py"
      - "tests/validators/test_validate_temporal_authority_envelope.py"
      - "contracts/common/advisory_event_envelope.md"
      - "schemas/contracts/v1/common/advisory_event_envelope.schema.json"
      - "fixtures/contracts/v1/common/advisory_event_envelope/**"
      - "tools/validators/validate_advisory_event_envelope.py"
      - "tools/validators/advisory_event_envelope_support.py"
      - "tests/validators/test_validate_advisory_event_envelope.py"
      - "data/receipts/generated/genrec-advisory-event-envelope-*.json"
      - "docs/intake/exploratory/advisory-event-envelope-source-map.md"
      - "contracts/domains/water_planning/**"
      - "schemas/contracts/v1/domains/water_planning/**"
      - "fixtures/domains/water_planning/**"
      - "data/registry/datasets/water_planning/**"
      - "data/registry/crosswalks/water_planning/**"
      - "data/registry/sources/water_planning/**"
      - "data/processed/water_planning/rac_regions/**"
      - "tools/validators/domains/water_planning/**"
      - "tests/domains/water_planning/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/briefing-integration.yml"
      - "docs/architecture/briefing-integration.md"
      - "contracts/governance/briefing_signal.md"
      - "contracts/governance/issue_inventory_projection.md"
      - "schemas/contracts/v1/governance/briefing_signal.schema.json"
      - "schemas/contracts/v1/governance/issue_inventory_projection.schema.json"
      - "fixtures/contracts/v1/governance/briefing_signal/**"
      - "fixtures/contracts/v1/governance/issue_inventory_projection/**"
      - "tools/validators/governance/**"
      - "tests/governance/**"
      - "examples/briefing_integration/**"
      - "contracts/common/temporal_authority_envelope.md"
      - "schemas/contracts/v1/common/temporal_authority_envelope.schema.json"
      - "fixtures/contracts/v1/common/temporal_authority_envelope/**"
      - "tools/validators/validate_temporal_authority_envelope.py"
      - "tests/validators/test_validate_temporal_authority_envelope.py"
      - "contracts/common/advisory_event_envelope.md"
      - "schemas/contracts/v1/common/advisory_event_envelope.schema.json"
      - "fixtures/contracts/v1/common/advisory_event_envelope/**"
      - "tools/validators/validate_advisory_event_envelope.py"
      - "tools/validators/advisory_event_envelope_support.py"
      - "tests/validators/test_validate_advisory_event_envelope.py"
      - "data/receipts/generated/genrec-advisory-event-envelope-*.json"
      - "docs/intake/exploratory/advisory-event-envelope-source-map.md"
      - "contracts/domains/water_planning/**"
      - "schemas/contracts/v1/domains/water_planning/**"
      - "fixtures/domains/water_planning/**"
      - "data/registry/datasets/water_planning/**"
      - "data/registry/crosswalks/water_planning/**"
      - "data/registry/sources/water_planning/**"
      - "data/processed/water_planning/rac_regions/**"
      - "tools/validators/domains/water_planning/**"
      - "tests/domains/water_planning/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: briefing-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-briefing-signals:
    name: validate-briefing-signals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e .

      - name: Run BriefingSignal identity, validation, routing, and issue-inventory tests
        run: |
          python -m unittest discover \
            --start-directory tests/governance \
            --pattern 'test_briefing_signal*.py' \
            --verbose

      - name: Validate current BriefingSignal fixtures and examples
        run: |
          python tools/validators/governance/validate_briefing_signal.py \
            fixtures/contracts/v1/governance/briefing_signal/valid/*.json \
            examples/briefing_integration/*.json

      - name: Run deterministic BriefingSignal clustering dry run
        run: |
          python tools/validators/governance/deduplicate_briefing_signals.py \
            fixtures/contracts/v1/governance/briefing_signal/valid/*.json

      - name: Validate fixture-backed issue inventory projections
        run: |
          python tools/validators/governance/validate_issue_inventory_projection.py \
            fixtures/contracts/v1/governance/issue_inventory_projection/valid/*.json

      - name: Confirm invalid issue inventory projections fail closed
        run: |
          if python tools/validators/governance/validate_issue_inventory_projection.py \
            fixtures/contracts/v1/governance/issue_inventory_projection/invalid/*.json; then
            echo "::error::Known-invalid IssueInventoryProjection fixtures were accepted."
            exit 1
          fi
          echo "EXPECTED_REJECTION: invalid IssueInventoryProjection fixtures"

      - name: Run explainable materiality and projection-bound routing dry run
        run: |
          python tools/validators/governance/route_briefing_signals.py \
            --issue-inventory \
            fixtures/contracts/v1/governance/issue_inventory_projection/valid/open-target.json \
            fixtures/contracts/v1/governance/briefing_signal/valid/*.json \
            examples/briefing_integration/*.json

      - name: Confirm structurally invalid BriefingSignal fixtures fail closed
        run: |
          if python tools/validators/governance/validate_briefing_signal.py \
            fixtures/contracts/v1/governance/briefing_signal/invalid/*.json; then
            echo "::error::Known-invalid BriefingSignal fixtures were accepted."
            exit 1
          fi
          echo "EXPECTED_REJECTION: structurally invalid BriefingSignal fixtures"

      - name: Confirm schema-valid semantic negatives fail closed
        run: |
          if python tools/validators/governance/validate_briefing_signal.py \
            fixtures/contracts/v1/governance/briefing_signal/semantic_invalid/*.json; then
            echo "::error::Known semantic-invalid BriefingSignal fixtures were accepted."
            exit 1
          fi
          echo "EXPECTED_REJECTION: schema-valid semantic-invalid BriefingSignal fixtures"

      - name: Run TemporalAuthorityEnvelope tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_temporal_authority_envelope.py' \
            --verbose

      - name: Validate TemporalAuthorityEnvelope fixtures
        run: |
          python tools/validators/validate_temporal_authority_envelope.py --fixtures

      - name: Run AdvisoryEventEnvelope tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_advisory_event_envelope.py' \
            --verbose

      - name: Validate AdvisoryEventEnvelope fixture polarity
        run: |
          python tools/validators/validate_advisory_event_envelope.py --fixtures

      - name: Verify AdvisoryEventEnvelope authoring receipt
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-advisory-event-envelope-20260806.json \
            --repo-root .

      - name: Record briefing boundary
        if: always()
        run: |
          {
            echo "### Briefing integration"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: non-authoritative BriefingSignal shape, deterministic identity, durable event clustering, replay/collision checks, explainable materiality, mandatory overrides, finite declared issue routing, a validated read-only fixture-backed issue inventory projection, the shared TemporalAuthorityEnvelope profile, and the release-neutral AdvisoryEventEnvelope HAB profile."
            echo "- Advisory scope: local KDHE HAB fixtures only; canonical payload digest, source-content digest, event identity, false-clear defenses, stale/failed checks, rescission, identity conflict, zone scope, time ordering, and source-role anti-collapse."
            echo "- Existing-issue routes retain UPDATE_EXISTING_ISSUE only when exactly one declared target is projected OPEN and none is missing; absent, closed, missing, or ambiguous targets hold."
            echo "- The projection contains no title, body, comment, label, assignee, permission, ruleset, merge state, or mutation capability and explicitly reports live_state_verified=false."
            echo "- All dry-run tools read local validated files only and emit no source activation, alert, lifecycle, repository-mutation, release, or publication authority."
            echo "- A materiality priority, projected issue state, or advisory fixture is a review/test input, not current evidence, live status, policy, repository authorization, public guidance, or release authority."
            echo "- The temporal-authority profile does not accept ADR-0014, replace TemporalWindow, select a global temporal vocabulary, or replace a domain contract."
            echo "- A green result is not evidence, source admission, repository authorization, issue mutation, policy approval, review approval, proof closure, alert authority, release, deployment, publication, or public truth."
          } >> "$GITHUB_STEP_SUMMARY"

  preserve-water-planning-anti-collapse:
    name: preserve-water-planning-anti-collapse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run water-planning semantic and registry suites
        run: |
          python -m unittest discover \
            --start-directory tests/domains/water_planning \
            --pattern 'test_*.py' \
            --verbose

      - name: Validate canonical RAC registry
        run: |
          python tools/validators/domains/water_planning/validate_rac_registry.py

      - name: Record water-planning boundary
        if: always()
        run: |
          {
            echo "### Water-planning boundaries"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- The suites keep meetings, applications, recommendations, awards, payments, construction, completion, program versions, scoring matrices, identities, geometries, crosswalks, and lineage distinct."
            echo "- The RAC registry check pins the 14-feature KWO geometry payload, all 105 Kansas county GEOIDs, the ordered 209-row intersection digest, and the not-released posture."
            echo "- A green result does not prove source freshness, rights clearance, governance membership, evidence closure, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

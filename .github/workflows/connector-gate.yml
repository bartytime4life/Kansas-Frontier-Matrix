# KFM CI workflow: connector-gate
# Status: PARTIAL enforcement. A bounded connector repository-target canary,
# legacy connector/pipeline publication-literal canary, repository-owned
# IngestReceipt validator prerequisite, and source-agnostic connectors-core
# primitive, SourceAdapter protocol, injected-transport, and artifact-handoff
# suites are executable. Connector-run receipt presence remains a visible hold.
#
# Authority boundary:
# - This workflow may test repository code and report CI evidence.
# - It does not admit sources, authorize acquisition, promote lifecycle artifacts,
#   approve policy, release data, publish outputs, or create authoritative receipts.
# - Connectors may write only through governed RAW, QUARANTINE, or receipt handoffs.
#   Pipeline destinations remain actor-specific; the legacy scan is not full policy.

name: connector-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  connector-output-gate:
    name: connector-output-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install repository test dependency
        run: python -m pip install -e ".[test]"

      - name: Install connectors-core package
        run: python -m pip install -e ./packages/connectors-core

      - name: Compile and import connectors-core without runtime effects
        run: |
          python -m compileall -q packages/connectors-core/src/connectors_core
          python -c "import connectors_core.core; import connectors_core.transport; import connectors_core.artifact_handoff; import connectors_core.source_adapter"

      - name: Run connectors-core deterministic no-network tests
        run: >-
          python -m pytest
          tests/packages/connectors_core
          -q
          --strict-config
          --strict-markers

      - name: Run bounded connector-output and legacy publication-target static checks
        run: >-
          python -m pytest
          tests/policy/test_pipeline_connector_non_publisher.py
          -q
          --strict-config
          --strict-markers

      - name: Run focused IngestReceipt validator tests
        id: ingest-validator-tests
        if: always()
        run: >-
          python -m pytest
          tests/validators/test_validate_ingest_receipt.py
          -q
          --strict-config
          --strict-markers

      - name: Verify deterministic IngestReceipt fixture polarity
        id: ingest-fixture-polarity
        if: always()
        run: python tools/validators/validate_ingest_receipt.py --fixtures

      - name: Record connector-output gate boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## connector-output-gate and IngestReceipt validator prerequisite"
            echo
            echo "- Connectors-core tests: tests/packages/connectors_core"
            echo "- Configured test: tests/policy/test_pipeline_connector_non_publisher.py"
            echo "- IngestReceipt tests: tests/validators/test_validate_ingest_receipt.py"
            echo "- IngestReceipt fixtures: tools/validators/validate_ingest_receipt.py --fixtures"
            echo "- Connectors-core scope: internal source-agnostic ETag/source-head, bounded retry, exact streaming SHA-256, response metadata, secret-safe diagnostics, SourceAdapter protocol/value objects, caller-injected transport, exact captured-byte validation, and retrieval-to-SourceArtifact candidate handoff behavior."
            echo "- SourceAdapter scope: canonical discovery cursors and locators, immutable finite parser results, source-health observations with false-clear prevention, runtime-checkable protocol conformance, and forbidden authority-capability detection."
            echo "- Artifact-handoff scope: successful injected GET bytes plus source-head metadata are bound to the existing SourceArtifact profile and validator; HEAD, NOT_MODIFIED, failure, mismatch, conflict, and supersession cases fail closed."
            echo "- Connectors-core limits: no live connector or concrete HTTP client is run; no source endpoint, credentials, source admission, storage, lifecycle write, evidence closure, policy decision, authoritative receipt, release, or publication is exercised."
            echo "- Connector static scope: selected Python sink calls, shell commands and redirections, and YAML command/output keys under connectors/, excluding path components named test, tests, fixture, fixtures, example, or examples."
            echo "- Connector target check: targets recognized and statically resolved as repository-relative are compared with the data/raw, data/quarantine, and data/receipts allowlist."
            echo "- Legacy compatibility check: selected lexical write contexts under connectors/ and pipelines/ are checked for data/catalog, data/published, and release/."
            echo "- Limits: a passing test is bounded static-canary and injected-boundary evidence; it does not establish complete sink, language, dynamic-path, external-target, URI, or home-relative coverage; runtime confinement; symlink safety; SourceDescriptor/IngestReceipt correspondence; concrete adapter correctness; source rights or sensitivity clearance; promotion readiness; release approval; or publication safety."
          } >> "$GITHUB_STEP_SUMMARY"

  ingest-receipt-presence:
    name: ingest-receipt-presence
    needs: connector-output-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require validator prerequisite and record connector-run presence hold
        shell: bash
        env:
          PREREQUISITE_RESULT: ${{ needs.connector-output-gate.result }}
        run: |
          set -euo pipefail
          outcome="VALIDATOR_PREREQUISITE_ENFORCED; CONNECTOR_RECEIPT_PRESENCE_HELD"
          if [[ "$PREREQUISITE_RESULT" != "success" ]]; then
            outcome="VALIDATOR_PREREQUISITE_FAILED; CONNECTOR_RECEIPT_PRESENCE_HELD"
          fi
          {
            echo "## ingest-receipt-presence — WORKFLOW_HOLD"
            echo
            echo "- Prerequisite job result: $PREREQUISITE_RESULT"
            echo "- Outcome: $outcome"
            echo "- The prerequisite job runs connectors-core primitives, SourceAdapter boundary, injected transport and artifact-handoff tests, the repository-owned IngestReceipt validator, deterministic contract fixtures, source-head binding, local artifact binding, and fail-closed receipt polarity."
            echo "- No live connector was run and no connector-emitted receipt instance, persistence route, source-specific profile, replay, or correction path was validated."
            echo "- No source was fetched, admitted, promoted, released, or published."
            echo "- No authoritative receipt, proof, review, correction, or rollback object was produced."
            echo
            echo "### Remaining graduation requirements"
            echo
            echo "1. Deterministic connector-run fixtures or equivalent committed receipt instances."
            echo "2. Checks binding an actual connector run to the required receipt schema, source-head identity, and governed persistence route."
            echo "3. Source-profile cases for missing, malformed, mismatched, stale, or unauthorized connector receipts."
            echo "4. Verified replay, correction, ownership, review, rollback, and required-check compatibility."
            echo "5. Continued absence of live source-system dependencies in pull-request CI."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PREREQUISITE_RESULT" != "success" ]]; then
            echo "::error title=VALIDATOR_PREREQUISITE_FAILED::The connector-output and IngestReceipt prerequisite job did not pass."
            exit 1
          fi
          echo "::notice title=WORKFLOW_HOLD::The connector primitives, SourceAdapter boundary, injected transport, artifact handoff, and IngestReceipt validator prerequisites passed; connector-run receipt presence is not yet validated."

# KFM CI workflow: connector-gate
# Status: PARTIAL enforcement. Source-agnostic connector primitives and the
# injected fake-transport boundary are executable in no-network pull-request CI.
# Connector-run receipt presence remains a visible readiness hold.
#
# Authority boundary:
# - This workflow may test repository code and report CI evidence.
# - It does not admit sources, authorize acquisition, promote lifecycle artifacts,
#   approve policy, release data, publish outputs, or create authoritative receipts.
# - Connectors may write only through governed RAW, QUARANTINE, or receipt handoffs.
#   Pipeline destinations remain actor-specific; the legacy scan is not full policy.

name: connector-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  connector-output-gate:
    name: connector-output-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install repository test dependency
        run: python -m pip install -e ".[test]"

      - name: Install connectors-core package
        run: python -m pip install -e ./packages/connectors-core

      - name: Compile and import connectors-core without runtime effects
        run: |
          python -m compileall -q packages/connectors-core/src/connectors_core
          python -c "import connectors_core.core; import connectors_core.transport"

      - name: Run connectors-core deterministic no-network tests
        run: >-
          python -m pytest
          tests/packages/connectors_core
          -q
          --strict-config
          --strict-markers

      - name: Run bounded connector-output and legacy publication-target checks
        run: >-
          python -m pytest
          tests/policy/test_pipeline_connector_non_publisher.py
          -q
          --strict-config
          --strict-markers

      - name: Run focused IngestReceipt validator tests
        id: ingest-validator-tests
        if: always()
        run: >-
          python -m pytest
          tests/validators/test_validate_ingest_receipt.py
          -q
          --strict-config
          --strict-markers

      - name: Verify deterministic IngestReceipt fixture polarity
        id: ingest-fixture-polarity
        if: always()
        run: python tools/validators/validate_ingest_receipt.py --fixtures

      - name: Record connector-output gate boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## connector-output-gate and IngestReceipt prerequisite"
            echo
            echo "- Connectors-core tests: tests/packages/connectors_core"
            echo "- Connector policy test: tests/policy/test_pipeline_connector_non_publisher.py"
            echo "- IngestReceipt tests: tests/validators/test_validate_ingest_receipt.py"
            echo "- IngestReceipt fixtures: tools/validators/validate_ingest_receipt.py --fixtures"
            echo "- Primitive scope: ETag/source-head distinctions, bounded retry decisions, exact streaming SHA-256, allowlisted response metadata, integrity mismatch, and secret-safe diagnostics."
            echo "- Transport scope: injected protocol only; exact host/media/size profiles, fake GET/HEAD exchanges, deterministic retry/cancellation, redirect denial, length/digest checks, and value-minimized results."
            echo "- Limits: no live client or connector is run; no endpoint, credentials, source admission, lifecycle write, SourceArtifact persistence, evidence closure, policy decision, authoritative receipt, release, or publication is exercised."
            echo "- A passing check is bounded implementation evidence, not source correctness, rights clearance, receipt correspondence, promotion readiness, release approval, or publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

  ingest-receipt-presence:
    name: ingest-receipt-presence
    needs: connector-output-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record connector-run presence hold
        shell: bash
        env:
          PREREQUISITE_RESULT: ${{ needs.connector-output-gate.result }}
        run: |
          set -euo pipefail
          outcome="VALIDATOR_PREREQUISITE_ENFORCED; CONNECTOR_RECEIPT_PRESENCE_HELD"
          if [[ "$PREREQUISITE_RESULT" != "success" ]]; then
            outcome="VALIDATOR_PREREQUISITE_FAILED; CONNECTOR_RECEIPT_PRESENCE_HELD"
          fi
          {
            echo "## ingest-receipt-presence — WORKFLOW_HOLD"
            echo
            echo "- Prerequisite job result: $PREREQUISITE_RESULT"
            echo "- Outcome: $outcome"
            echo "- No live connector was run and no connector-emitted receipt instance, persistence route, source-specific profile, replay, or correction path was validated."
            echo "- No source was fetched, admitted, promoted, released, or published."
            echo
            echo "### Remaining graduation requirements"
            echo
            echo "1. One reviewed source-specific adapter using an already governed source profile."
            echo "2. Deterministic connector-run fixtures or equivalent committed receipt instances."
            echo "3. Checks binding an actual connector run to receipt schema, source-head identity, and governed persistence."
            echo "4. Source-profile cases for missing, malformed, mismatched, stale, redirected, wrong-media, oversized, integrity-failed, or unauthorized responses."
            echo "5. Verified replay, correction, ownership, review, rollback, and required-check compatibility."
            echo "6. Continued absence of live source-system dependencies in pull-request CI."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PREREQUISITE_RESULT" != "success" ]]; then
            echo "::error title=VALIDATOR_PREREQUISITE_FAILED::The connector prerequisite job did not pass."
            exit 1
          fi
          echo "::notice title=WORKFLOW_HOLD::The connector primitives, injected transport, and IngestReceipt prerequisites passed; connector-run receipt presence is not yet validated."

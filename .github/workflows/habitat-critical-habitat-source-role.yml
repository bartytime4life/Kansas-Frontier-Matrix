# Focused no-network validation for the synthetic Habitat source-role guard.
#
# A passing check proves only the validator's bounded fixture behavior. It does
# not establish regulatory or species truth, source admission, rights,
# sensitivity clearance, evidence closure, policy approval, release,
# deployment, or publication authority.
name: habitat-critical-habitat-source-role

"on":
  pull_request:
    paths:
      - "tools/validators/domains/habitat/validate_critical_habitat_source_role.py"
      - "tests/domains/habitat/test_critical_habitat_source_role.py"
      - ".github/workflows/habitat-critical-habitat-source-role.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habitat-critical-habitat-source-role-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-habitat-critical-habitat-source-role
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run critical-habitat source-role tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.domains.habitat.test_critical_habitat_source_role

      - name: Record authority boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Habitat critical-habitat source-role guard"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- The check uses synthetic, deterministic, no-network test data."
            echo "- Regulatory designation and modeled habitat remain separate source roles."
            echo "- Neither lane proves species presence, movement, or occurrence truth."
            echo "- No source was admitted and no policy, release, deployment, or publication action occurred."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the additive, fixture-only sensitive-location parity assessment.
name: sensitive-location-parity-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/sensitive-location-parity-assessment.yml"
      - "contracts/governance/sensitive_location_parity_assessment.md"
      - "schemas/contracts/v1/governance/sensitive_location_parity_assessment.schema.json"
      - "fixtures/contracts/v1/governance/sensitive_location_parity_assessment/**"
      - "tools/validators/validate_sensitive_location_parity_assessment.py"
      - "tests/validators/test_validate_sensitive_location_parity_assessment.py"
      - "docs/intake/exploratory/sensitive-location-parity-assessment-source-map.md"
      - "data/receipts/generated/genrec-sensitive-location-parity-assessment-20260810.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sensitive-location-parity-assessment.yml"
      - "contracts/governance/sensitive_location_parity_assessment.md"
      - "schemas/contracts/v1/governance/sensitive_location_parity_assessment.schema.json"
      - "fixtures/contracts/v1/governance/sensitive_location_parity_assessment/**"
      - "tools/validators/validate_sensitive_location_parity_assessment.py"
      - "tests/validators/test_validate_sensitive_location_parity_assessment.py"
      - "docs/intake/exploratory/sensitive-location-parity-assessment-source-map.md"
      - "data/receipts/generated/genrec-sensitive-location-parity-assessment-20260810.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sensitive-location-parity-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-sensitive-location-parity-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema, hashing, and test dependencies
        shell: bash
        run: python -m pip install -e ".[test]"

      - name: Run focused deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.validators.test_validate_sensitive_location_parity_assessment --verbose

      - name: Replay exact fixture outcomes
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_sensitive_location_parity_assessment.py --fixtures

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-sensitive-location-parity-assessment-20260810.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Sensitive-location parity assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: local schema, deterministic identity, domain-owner mapping, exact-deny, generalized-with-receipt-candidate, fixture-polarity, and authority non-effect checks."
            echo "- Boundary: no coordinates, source fetch, policy evaluation, sensitivity-registry resolution, evidence resolution, transform execution, steward decision, access grant, lifecycle mutation, promotion, release, publication, API, or UI authority."
          } >> "$GITHUB_STEP_SUMMARY"

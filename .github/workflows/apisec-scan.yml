# APIsec is an opt-in external security scan. The scan job is deliberately
# skipped for pull requests so untrusted contributions never receive APIsec
# credentials or security-events write authority.
#
# Activation requires all of the following repository settings:
# - variable APISEC_ENABLED set to the exact string "true";
# - variable APISEC_PROJECT set to the registered KFM APIsec project; and
# - secrets APISEC_USERNAME and APISEC_PASSWORD.
#
# Disable the integration by setting APISEC_ENABLED to any value other than
# "true". A disabled job performs no external request and uploads no SARIF.
name: APIsec

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "22 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apisec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Trigger_APIsec_scan:
    if: github.event_name != 'pull_request' && vars.APISEC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      APISEC_PASSWORD: ${{ secrets.APISEC_PASSWORD }}
      APISEC_PROJECT: ${{ vars.APISEC_PROJECT }}
      APISEC_USERNAME: ${{ secrets.APISEC_USERNAME }}
    steps:
      - name: Require enabled APIsec configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APISEC_USERNAME}" || -z "${APISEC_PASSWORD}" || -z "${APISEC_PROJECT}" ]]; then
            echo "::error::APIsec is enabled, but APISEC_PROJECT, APISEC_USERNAME, or APISEC_PASSWORD is not configured."
            exit 1
          fi

      - name: Run APIsec scan
        uses: apisec-inc/apisec-run-scan@025432089674a28ba8fb55f8ab06c10215e772ea
        with:
          apisec-username: ${{ env.APISEC_USERNAME }}
          apisec-password: ${{ env.APISEC_PASSWORD }}
          apisec-project: ${{ env.APISEC_PROJECT }}
          sarif-result-file: apisec-results.sarif

      - name: Upload APIsec SARIF
        if: always() && hashFiles('apisec-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: apisec-results.sarif

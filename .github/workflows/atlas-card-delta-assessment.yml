# Validate the fixture-only Atlas-card delta assessment profile.
name: atlas-card-delta-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/atlas-card-delta-assessment.yml"
      - "contracts/governance/atlas_card_delta_assessment.md"
      - "docs/intake/exploratory/new-ideas-5-atlas-card-delta-source-map.md"
      - "fixtures/contracts/v1/governance/atlas_card_delta_assessment/**"
      - "schemas/contracts/v1/governance/atlas_card_delta_assessment.schema.json"
      - "tests/validators/governance/test_atlas_card_delta_assessment.py"
      - "tools/validators/governance/validate_atlas_card_delta_assessment.py"
      - "data/receipts/generated/genrec-atlas-card-delta-assessment-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/atlas-card-delta-assessment.yml"
      - "contracts/governance/atlas_card_delta_assessment.md"
      - "docs/intake/exploratory/new-ideas-5-atlas-card-delta-source-map.md"
      - "fixtures/contracts/v1/governance/atlas_card_delta_assessment/**"
      - "schemas/contracts/v1/governance/atlas_card_delta_assessment.schema.json"
      - "tests/validators/governance/test_atlas_card_delta_assessment.py"
      - "tools/validators/governance/validate_atlas_card_delta_assessment.py"
      - "data/receipts/generated/genrec-atlas-card-delta-assessment-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-card-delta-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-atlas-card-delta-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"

      - name: Run deterministic no-network profile checks
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/governance \
            --pattern 'test_atlas_card_delta_assessment.py' \
            --verbose
          python tools/validators/governance/validate_atlas_card_delta_assessment.py \
            --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-atlas-card-delta-assessment-20260809.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Atlas-card delta assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: deterministic fixture-only comparison of Atlas-card snapshots."
            echo "- Boundary: a green result does not resolve evidence, decide truth, mutate an Atlas card, approve review, authorize release, create a visualizer, deploy, publish, or permit public use."
          } >> "$GITHUB_STEP_SUMMARY"

name: geospatial-carrier-readiness

"on":
  pull_request:
    paths:
      - ".github/workflows/geospatial-carrier-readiness.yml"
      - "contracts/release/geospatial_carrier_readiness.md"
      - "schemas/contracts/v1/release/geospatial_carrier_readiness.schema.json"
      - "fixtures/contracts/v1/release/geospatial_carrier_readiness/**"
      - "tools/validators/release/validate_geospatial_carrier_readiness.py"
      - "tests/release/test_geospatial_carrier_readiness.py"
      - "docs/intake/exploratory/geospatial-carrier-readiness-source-map.md"
      - "data/receipts/generated/genrec-geoparquet-layout-profile-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/geospatial-carrier-readiness.yml"
      - "contracts/release/geospatial_carrier_readiness.md"
      - "schemas/contracts/v1/release/geospatial_carrier_readiness.schema.json"
      - "fixtures/contracts/v1/release/geospatial_carrier_readiness/**"
      - "tools/validators/release/validate_geospatial_carrier_readiness.py"
      - "tests/release/test_geospatial_carrier_readiness.py"
      - "docs/intake/exploratory/geospatial-carrier-readiness-source-map.md"
      - "data/receipts/generated/genrec-geoparquet-layout-profile-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geospatial-carrier-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-geospatial-carrier-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests
        run: python -m pytest -q tests/release/test_geospatial_carrier_readiness.py
      - name: Run exact case polarity
        run: python tools/validators/release/validate_geospatial_carrier_readiness.py --cases
      - name: Verify generated authoring receipt integrity
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-geoparquet-layout-profile-20260809.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Geospatial carrier readiness"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: declared COG, MVT, and GeoParquet metadata only."
            echo "- Boundary: no TIFF/Parquet/MVT bytes are opened; no source, policy, promotion, release, deployment, publication, or public-use authority is created."
          } >> "$GITHUB_STEP_SUMMARY"

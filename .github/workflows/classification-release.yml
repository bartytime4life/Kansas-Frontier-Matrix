# Validate the inactive, fixture-only ClassificationRelease profile and its
# source-role boundary against the existing soil station-observation candidate.
name: classification-release

"on":
  pull_request:
    paths:
      - ".github/workflows/classification-release.yml"
      - "contracts/common/classification_release.md"
      - "schemas/contracts/v1/common/classification_release.schema.json"
      - "fixtures/contracts/v1/common/classification_release/**"
      - "tools/validators/validate_classification_release.py"
      - "tests/validators/test_validate_classification_release.py"
      - "tests/cross_domain/test_classification_observation_boundary.py"
      - "docs/intake/exploratory/briefing-classification-release-source-map.md"
      - "data/receipts/generated/genrec-briefing-classification-release-20260808.json"
      - "contracts/domains/soil/domain_observation.md"
      - "schemas/contracts/v1/domains/soil/domain_observation.schema.json"
      - "fixtures/domains/soil/domain_observation/**"
      - "tools/validators/domains/soil/validate_domain_observation.py"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/classification-release.yml"
      - "contracts/common/classification_release.md"
      - "schemas/contracts/v1/common/classification_release.schema.json"
      - "fixtures/contracts/v1/common/classification_release/**"
      - "tools/validators/validate_classification_release.py"
      - "tests/validators/test_validate_classification_release.py"
      - "tests/cross_domain/test_classification_observation_boundary.py"
      - "docs/intake/exploratory/briefing-classification-release-source-map.md"
      - "data/receipts/generated/genrec-briefing-classification-release-20260808.json"
      - "contracts/domains/soil/domain_observation.md"
      - "schemas/contracts/v1/domains/soil/domain_observation.schema.json"
      - "fixtures/domains/soil/domain_observation/**"
      - "tools/validators/domains/soil/validate_domain_observation.py"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classification-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-classification-release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema, hashing, and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused ClassificationRelease tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest             tests.validators.test_validate_classification_release             --verbose

      - name: Prove classification and observation source-role separation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest             tests.cross_domain.test_classification_observation_boundary             --verbose

      - name: Replay exact ClassificationRelease fixture outcomes
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_classification_release.py             --fixtures

      - name: Preserve the existing soil observation fixture boundary
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/domains/soil/validate_domain_observation.py             --fixtures

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py             data/receipts/generated/genrec-briefing-classification-release-20260808.json             --repo-root .

      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### ClassificationRelease fixture profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed ClassificationRelease candidate, deterministic identity, temporal/geometry/lineage coherence, and exact source-role separation from the existing soil station-observation fixture."
            echo "- Positive states: CURRENT, CORRECTED, SUPERSEDED, and CONFLICTED."
            echo "- Boundary: no live source, evidence resolution, policy or review execution, lifecycle write, promotion, release, deployment, publication, map, API, alert, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

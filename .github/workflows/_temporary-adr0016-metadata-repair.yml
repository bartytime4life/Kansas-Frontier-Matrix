name: Temporary ADR-0016 metadata repair

on:
  push:
    branches:
      - codex/adr-0016-telemetry-redaction-refresh-20260814
    paths:
      - .github/workflows/_temporary-adr0016-metadata-repair.yml

permissions:
  contents: write

concurrency:
  group: temporary-adr0016-metadata-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out task branch
        uses: actions/checkout@v7
        with:
          ref: codex/adr-0016-telemetry-redaction-refresh-20260814
          fetch-depth: 0

      - name: Apply deterministic metadata repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/adr/ADR-0016-telemetry-redaction-posture.md")
          text = path.read_text(encoding="utf-8")

          old_owner = "truth_posture: cite-or-abstain\nresponsibility_root: docs/\ncurrent_path:"
          new_owner = (
              "truth_posture: cite-or-abstain\n"
              "owning_root: docs/\n"
              "responsibility: \"Record the proposed telemetry minimization, redaction, governed-emission, receipt, sink, and operational-graduation boundary.\"\n"
              "current_path:"
          )
          if text.count(old_owner) != 1:
              raise SystemExit("expected exactly one legacy responsibility_root block")
          if text.count("superseded_by: null") != 1:
              raise SystemExit("expected exactly one legacy superseded_by null value")

          text = text.replace(old_owner, new_owner, 1)
          text = text.replace("superseded_by: null", "superseded_by: []", 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          git diff --check
          grep -Fqx 'owning_root: docs/' docs/adr/ADR-0016-telemetry-redaction-posture.md
          grep -Fqx 'superseded_by: []' docs/adr/ADR-0016-telemetry-redaction-posture.md

      - name: Commit repaired ADR metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/adr/ADR-0016-telemetry-redaction-posture.md
          git commit -m "docs(adr): satisfy ADR-0016 metadata contracts"
          git push origin HEAD:codex/adr-0016-telemetry-redaction-refresh-20260814

# Validate the fixture-only STAC GeoParquet mirror assessment candidate.
name: stac-geoparquet-mirror-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/stac-geoparquet-mirror-assessment.yml"
      - "contracts/data/stac_geoparquet_mirror_assessment.md"
      - "schemas/contracts/v1/data/stac_geoparquet_mirror_assessment.schema.json"
      - "fixtures/contracts/v1/data/stac_geoparquet_mirror_assessment/**"
      - "tools/validators/catalog/validate_stac_geoparquet_mirror_assessment.py"
      - "tests/validators/test_validate_stac_geoparquet_mirror_assessment.py"
      - "docs/intake/exploratory/stac-geoparquet-mirror-assessment-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-stac-geoparquet-mirror-assessment-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/stac-geoparquet-mirror-assessment.yml"
      - "contracts/data/stac_geoparquet_mirror_assessment.md"
      - "schemas/contracts/v1/data/stac_geoparquet_mirror_assessment.schema.json"
      - "fixtures/contracts/v1/data/stac_geoparquet_mirror_assessment/**"
      - "tools/validators/catalog/validate_stac_geoparquet_mirror_assessment.py"
      - "tests/validators/test_validate_stac_geoparquet_mirror_assessment.py"
      - "docs/intake/exploratory/stac-geoparquet-mirror-assessment-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-stac-geoparquet-mirror-assessment-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stac-geoparquet-mirror-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-stac-geoparquet-mirror-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests
        run: |
          python -m unittest -v tests.validators.test_validate_stac_geoparquet_mirror_assessment
          python tools/validators/catalog/validate_stac_geoparquet_mirror_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-stac-geoparquet-mirror-assessment-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### StacGeoParquetMirrorAssessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only parity between declared STAC Item projections and declared STAC GeoParquet mirror rows."
            echo "- Boundary: no Parquet access, source resolution, catalog mutation, evidence resolution, policy or review decision, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

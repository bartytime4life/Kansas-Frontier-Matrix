# Validate the fixture-first trace-to-receipt-to-evidence linkage profile.
name: trace-receipt-link

"on":
  pull_request:
    paths:
      - ".github/workflows/trace-receipt-link.yml"
      - "contracts/telemetry/trace_receipt_link.md"
      - "schemas/contracts/v1/telemetry/**"
      - "fixtures/contracts/v1/telemetry/trace_receipt_link/**"
      - "tools/validators/validate_trace_receipt_link.py"
      - "tests/validators/test_validate_trace_receipt_link.py"
      - "docs/intake/exploratory/new-ideas-2-22-26-trace-receipt-link-source-map.md"
      - "data/receipts/generated/genrec-trace-receipt-link-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/trace-receipt-link.yml"
      - "contracts/telemetry/trace_receipt_link.md"
      - "schemas/contracts/v1/telemetry/**"
      - "fixtures/contracts/v1/telemetry/trace_receipt_link/**"
      - "tools/validators/validate_trace_receipt_link.py"
      - "tests/validators/test_validate_trace_receipt_link.py"
      - "docs/intake/exploratory/new-ideas-2-22-26-trace-receipt-link-source-map.md"
      - "data/receipts/generated/genrec-trace-receipt-link-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trace-receipt-link-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-trace-receipt-link
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run deterministic no-network test vectors
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_trace_receipt_link.py' \
            --verbose
          python tools/validators/validate_trace_receipt_link.py --fixtures
      - name: Verify generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-trace-receipt-link-20260806.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Trace receipt linkage"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic run/trace/receipt/evidence anchor equality, deterministic link identity, delay budget, OCI digest linkage, attestation subject linkage, and no-authority invariants."
            echo "- Boundary: a green result does not start a trace, verify a live receipt or signature, retrieve OCI evidence, close evidence, evaluate policy, promote, release, deploy, publish, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"

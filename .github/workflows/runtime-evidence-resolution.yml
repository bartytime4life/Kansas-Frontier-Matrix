# Validate the proposed RuntimeEvidenceResolution result contract against the
# existing bounded evidence resolver. This workflow is read-only, synthetic,
# deterministic, and no-network after installing repository-declared test
# dependencies. It does not resolve live evidence, evaluate policy, authenticate
# reviews, promote, release, deploy, publish, or write any trust artifact.
name: runtime-evidence-resolution

"on":
  pull_request:
    paths:
      - ".github/workflows/runtime-evidence-resolution.yml"
      - "contracts/evidence/runtime_evidence_resolution.md"
      - "schemas/contracts/v1/evidence/runtime_evidence_resolution.schema.json"
      - "fixtures/contracts/v1/evidence/runtime_evidence_resolution/**"
      - "tests/packages/evidence_resolver/test_result_schema.py"
      - "packages/evidence-resolver/**"
      - "tools/validators/evidence_resolver/**"
      - "data/receipts/generated/genrec-runtime-evidence-resolution-contract-*.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/runtime-evidence-resolution.yml"
      - "contracts/evidence/runtime_evidence_resolution.md"
      - "schemas/contracts/v1/evidence/runtime_evidence_resolution.schema.json"
      - "fixtures/contracts/v1/evidence/runtime_evidence_resolution/**"
      - "tests/packages/evidence_resolver/test_result_schema.py"
      - "packages/evidence-resolver/**"
      - "tools/validators/evidence_resolver/**"
      - "data/receipts/generated/genrec-runtime-evidence-resolution-contract-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-evidence-resolution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-runtime-evidence-resolution:
    name: validate-runtime-evidence-resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to replay the unchanged historical receipt below.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run the existing bounded evidence resolver proof
        shell: bash
        run: |
          set -euo pipefail
          make evidence-resolver

      - name: Validate result-contract schema and fixture polarity
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -q tests.packages.evidence_resolver.test_result_schema

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          # This receipt's workflow digest was accepted only through the one-time
          # migration ledger, which Dependabot 27676fd1 made stale. Replay the receipt,
          # its artifacts and the ledger exactly as they stood at that commit's parent.
          ref=de7ec1d5aa39b9db46672189986212e5eb0a1026
          receipt=data/receipts/generated/genrec-runtime-evidence-resolution-contract-20260805.json
          root="$RUNNER_TEMP/receipt-replay-genrec-runtime-evidence-resolution-contract-20260805"
          rm -rf "$root"
          mkdir -p "$root"
          git show "$ref:$receipt" \
            | python -c 'import json, sys; sys.stdout.write("\0".join(json.load(sys.stdin)["artifact_paths"]))' \
            | xargs -0 git archive "$ref" -- "$receipt" tools/ci/python-dependency-lock-migration.json \
            | tar -x -C "$root"
          python tools/validators/validate_generated_receipt.py "$root/$receipt" --repo-root "$root"

      - name: Record validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Runtime evidence resolution contract"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: deterministic output shape and exact conformance of the existing internal evidence-resolver candidate profile."
            echo "- Network posture: no live evidence store, policy engine, review system, release store, or public runtime access."
            echo "- Boundary: RESOLVED remains non-authoritative and does not mean ANSWER, policy clearance, review, promotion, release, deployment, publication, or public use."
          } >> "$GITHUB_STEP_SUMMARY"

name: source-intake-record

"on":
  pull_request:
    paths:
      - ".github/workflows/source-intake-record.yml"
      - "contracts/source/source_intake_record.md"
      - "contracts/source/drift_summary.md"
      - "schemas/contracts/v1/source/source_intake_record.schema.json"
      - "schemas/contracts/v1/source/drift_summary.schema.json"
      - "schemas/contracts/v1/source/source-intake-record.json"
      - "schemas/contracts/v1/source/drift-summary.json"
      - "fixtures/contracts/v1/source/source_intake_record/**"
      - "tools/validators/validate_source_intake_record.py"
      - "tests/validators/test_validate_source_intake_record.py"
      - "data/receipts/generated/genrec-pass4-source-intake-record-20260808.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-intake-record.yml"
      - "contracts/source/source_intake_record.md"
      - "contracts/source/drift_summary.md"
      - "schemas/contracts/v1/source/source_intake_record.schema.json"
      - "schemas/contracts/v1/source/drift_summary.schema.json"
      - "schemas/contracts/v1/source/source-intake-record.json"
      - "schemas/contracts/v1/source/drift-summary.json"
      - "fixtures/contracts/v1/source/source_intake_record/**"
      - "tools/validators/validate_source_intake_record.py"
      - "tests/validators/test_validate_source_intake_record.py"
      - "data/receipts/generated/genrec-pass4-source-intake-record-20260808.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-intake-record-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m unittest tests.validators.test_validate_source_intake_record -v
          python tools/validators/validate_source_intake_record.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass4-source-intake-record-20260808.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### SourceIntakeRecord fixture-first slice"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed SourceIntakeRecord and DriftSummary shapes, finite dispositions, CandidateDelta separation, and fixture polarity."
            echo "- Boundary: PASS does not activate a source, admit RAW, promote, release, publish, notify, or establish evidence truth."
          } >> "$GITHUB_STEP_SUMMARY"

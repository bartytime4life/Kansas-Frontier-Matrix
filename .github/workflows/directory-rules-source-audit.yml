# Temporary validation transport on the existing audit branch. Never merge.
# Product source revisions below are distinct from the workflow revision.
name: directory-rules-source-audit
"on":
  push:
    branches: [agent/directory-rules-evidence-20260905]
    paths: [.github/workflows/directory-rules-source-audit.yml]
permissions:
  contents: read
concurrency:
  group: directory-rules-proposal-audit
  cancel-in-progress: false
jobs:
  proposal-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            sha: a9a53470e385350b795f6d978ad3e7a5811961c5
          - label: proposal
            sha: 990801cc71ef71e1245a7156247c508033fa7abf
    env:
      CHECKOUT_SHA: ${{ matrix.sha }}
      CHECKOUT_LABEL: ${{ matrix.label }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      KFM_NO_NETWORK: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 20
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Run exact-source checks without hiding failed outcomes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import datetime, hashlib, json, os, platform, subprocess, sys
          base = "a9a53470e385350b795f6d978ad3e7a5811961c5"
          def git(*args): return subprocess.check_output(["git", *args])
          head = git("rev-parse", "HEAD").decode().strip()
          assert head == os.environ["CHECKOUT_SHA"]
          assert not git("status", "--porcelain"), "initial checkout is dirty"
          out = Path(os.environ["RUNNER_TEMP"]) / "directory-proposal-audit"
          out.mkdir(exist_ok=False)
          meta = dict(checked_out_commit=head, checked_out_tree=git("rev-parse", "HEAD^{tree}").decode().strip(), workflow_head=os.environ["GITHUB_SHA"], run=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"], label=os.environ["CHECKOUT_LABEL"], observed_at=datetime.datetime.now(datetime.timezone.utc).isoformat(), python=platform.python_version(), git=git("--version").decode().strip())
          (out / "observation.json").write_text(json.dumps(meta, indent=2) + "\n")
          results = []
          def run(name, args):
              p = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=300)
              (out / (name + ".log")).write_text(p.stdout)
              results.append(dict(check=name, command=args, exit=p.returncode))
              print(name, "exit", p.returncode, flush=True)
              return p.returncode
          installed = run("locked-project-test-install", [sys.executable, "tools/ci/install_python_ci.py", "project-test"])
          if installed == 0:
              run("adr-index", [sys.executable, "tools/validators/validate_adr_index.py"])
              run("existing-tests", [sys.executable, "-m", "pytest", "tests/validators/test_validate_adr_index.py", "tests/validators/test_validate_generated_receipt.py", "tests/validators/directory_governance/test_validate_root_registry.py", "tests/policy/test_control_plane_register_meta_contract.py", "-q", "--strict-config", "--strict-markers"])
              run("root-registry", [sys.executable, "tools/validators/directory_governance/validate_root_registry.py"])
              if os.environ["CHECKOUT_LABEL"] == "proposal":
                  run("proposal-tests", [sys.executable, "-m", "pytest", "tests/validators/test_directory_rules_amendment.py", "-q", "--strict-config", "--strict-markers"])
                  run("new-receipt", [sys.executable, "tools/validators/validate_generated_receipt.py", "data/receipts/generated/genrec-directory-amendment-ci-20260906.json"])
                  run("original-receipt", [sys.executable, "tools/validators/validate_generated_receipt.py", "data/receipts/generated/genrec-directory-rules-amendment-20260905.json", "--artifact-git-ref", "102b0e9a463597459e4fa92d66e53b6eb29206bf"])
                  run("correction-receipt", [sys.executable, "tools/validators/validate_generated_receipt.py", "data/receipts/generated/genrec-directory-rules-patch-correction-20260905.json", "--artifact-git-ref", "2fe65059af3753fbf662d267d7483a881afc83a0"])
              run("topology-tests", [sys.executable, "-m", "unittest", "discover", "--start-directory", "tests/validators/directory_governance", "--pattern", "test_validate_*topology.py", "--verbose"])
              run("topology", [sys.executable, "tools/validators/directory_governance/validate_repository_topology.py", "--trusted-baseline-ref", base])
          run("diff-whitespace", ["git", "diff", "--check", base, "HEAD"])
          protected = ["docs/doctrine/directory-rules.md", "docs/architecture/directory-rules.md", "docs/adr/ADR-0029-adopt-directory-governance-standard-v2.md", "docs/adr/ADR-0038-trusted-base-topology-correction-transitions.md", "control_plane", "tools", "fixtures", "schemas", "contracts", "policy", "catalog", "apps", "packages", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
          run("protected-inputs", ["git", "diff", "--exit-code", base, "HEAD", "--", *protected])
          run("tracked-worktree-unchanged", ["git", "diff", "--exit-code", "HEAD"])
          paths = git("diff", "--name-only", base, "HEAD").decode().splitlines()
          (out / "changed-paths.json").write_text(json.dumps(paths, indent=2) + "\n")
          (out / "source-hashes.json").write_text(json.dumps({p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}, indent=2) + "\n")
          (out / "results.json").write_text(json.dumps(results, indent=2) + "\n")
          print(json.dumps(meta, indent=2))
          sys.exit(1 if any(r["exit"] != 0 for r in results) else 0)
          PY
      - name: Retain exact results; an artifact upload is not a passing check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: directory-ci-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/directory-proposal-audit/
          if-no-files-found: error
          retention-days: 14

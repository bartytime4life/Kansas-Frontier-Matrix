# Validate the fixture-only PM sensor trust profile.
# This workflow performs no live sensor access, source admission, policy, promotion, release, publication, or health action.
name: pm-sensor-trust-profile

"on":
  pull_request:
    paths:
      - ".github/workflows/pm-sensor-trust-profile.yml"
      - "contracts/domains/atmosphere/pm_sensor_trust_profile.md"
      - "schemas/contracts/v1/domains/atmosphere/pm_sensor_trust_profile.schema.json"
      - "fixtures/contracts/v1/domains/atmosphere/pm_sensor_trust_profile/**"
      - "tools/validators/domains/atmosphere/validate_pm_sensor_trust_profile.py"
      - "tests/validators/domains/atmosphere/test_pm_sensor_trust_profile.py"
      - "docs/intake/exploratory/pass-30-pm-sensor-trust-profile-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-pm-sensor-trust-profile-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pm-sensor-trust-profile.yml"
      - "contracts/domains/atmosphere/pm_sensor_trust_profile.md"
      - "schemas/contracts/v1/domains/atmosphere/pm_sensor_trust_profile.schema.json"
      - "fixtures/contracts/v1/domains/atmosphere/pm_sensor_trust_profile/**"
      - "tools/validators/domains/atmosphere/validate_pm_sensor_trust_profile.py"
      - "tests/validators/domains/atmosphere/test_pm_sensor_trust_profile.py"
      - "docs/intake/exploratory/pass-30-pm-sensor-trust-profile-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-pm-sensor-trust-profile-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm-sensor-trust-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-pm-sensor-trust-profile:
    name: validate-pm-sensor-trust-profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e .

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators/domains/atmosphere \
            --pattern 'test_pm_sensor_trust_profile.py' \
            --verbose

      - name: Replay exact fixture polarity
        run: python tools/validators/domains/atmosphere/validate_pm_sensor_trust_profile.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass30-pm-sensor-trust-profile-20260809.json

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### PMSensorTrustProfileCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic trust-dimension shape, evidence closure, posture consistency, and deterministic identity."
            echo "- No live sensor, source admission, scientific validity, reference equivalence, policy, review, promotion, release, publication, or health authority is exercised."
          } >> "$GITHUB_STEP_SUMMARY"

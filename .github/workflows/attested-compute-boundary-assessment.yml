name: attested-compute-boundary-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/attested-compute-boundary-assessment.yml"
      - "contracts/governance/attested_compute_boundary_assessment.md"
      - "schemas/contracts/v1/governance/attested_compute_boundary_assessment.schema.json"
      - "fixtures/contracts/v1/governance/attested_compute_boundary_assessment/**"
      - "tools/validators/governance/validate_attested_compute_boundary_assessment.py"
      - "tests/validators/governance/test_validate_attested_compute_boundary_assessment.py"
      - "docs/intake/exploratory/new-ideas-5-19-26-attested-compute-boundary-source-map.md"
      - "docs/intake/exploratory/new-ideas-5-19-26-source-map.md"
      - "docs/adr/ADR-0032-attested-compute-boundary.md"
      - "data/receipts/generated/genrec-new-ideas-5-19-26-attested-compute-boundary-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/attested-compute-boundary-assessment.yml"
      - "contracts/governance/attested_compute_boundary_assessment.md"
      - "schemas/contracts/v1/governance/attested_compute_boundary_assessment.schema.json"
      - "fixtures/contracts/v1/governance/attested_compute_boundary_assessment/**"
      - "tools/validators/governance/validate_attested_compute_boundary_assessment.py"
      - "tests/validators/governance/test_validate_attested_compute_boundary_assessment.py"
      - "docs/intake/exploratory/new-ideas-5-19-26-attested-compute-boundary-source-map.md"
      - "docs/intake/exploratory/new-ideas-5-19-26-source-map.md"
      - "docs/adr/ADR-0032-attested-compute-boundary.md"
      - "data/receipts/generated/genrec-new-ideas-5-19-26-attested-compute-boundary-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attested-compute-boundary-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-attested-compute-boundary-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/governance/validate_attested_compute_boundary_assessment.py tests/validators/governance/test_validate_attested_compute_boundary_assessment.py
          python -m unittest tests.validators.governance.test_validate_attested_compute_boundary_assessment --verbose
          python tools/validators/governance/validate_attested_compute_boundary_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-new-ideas-5-19-26-attested-compute-boundary-20260810.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Attested-compute boundary assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: decision-only residual-problem, control-review, eight-boundary, posture, and invalidation-declaration coherence."
            echo "- Boundary: no real or sensitive input, credential, network, cloud or TEE selection, key enrollment, external verification, compute execution, output release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

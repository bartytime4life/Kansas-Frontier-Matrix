# Temporary read-only candidate readback; remove before final handoff.
name: esbuild-lock-candidate
on:
  push:
    branches: [agent/esbuild-security-pnpm11-20260908]
    paths: [.github/workflows/esbuild-lock-candidate.yml]
permissions:
  contents: read
  checks: read
jobs:
  readback:
    if: github.repository == 'bartytime4life/Kansas-Frontier-Matrix' && github.ref == 'refs/heads/agent/esbuild-security-pnpm11-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read and verify the two previously validated native lock objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, re, urllib.request
          root = 'https://api.github.com/repos/bartytime4life/Kansas-Frontier-Matrix/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('redirect refused')
          opener = urllib.request.build_opener(NoRedirect)
          def get(suffix):
              req = urllib.request.Request(root + suffix, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with opener.open(req, timeout=30) as response:
                  data = response.read(3_000_001)
              assert len(data) <= 3_000_000
              return json.loads(data)
          annotations = get('check-runs/102136662673/annotations?per_page=10')
          assert len(annotations) == 2
          expected = {'pnpm-lock.yaml', 'apps/kansas-frontier-matrix-explorer/package-lock.json'}
          seen = set()
          for annotation in annotations:
              record = json.loads(annotation['message'])
              assert record['path'] in expected and record['path'] not in seen
              seen.add(record['path'])
              assert record['source_head'] == '9cc310123cf9eacb4628ac409698a6e7cf928d04'
              assert record['run_id'] == '34248375449'
              assert record['ref_updated'] is False and record['approval'] is False
              sha = record['git_blob']
              assert re.fullmatch('[0-9a-f]{40}', sha)
              obj = get('git/blobs/' + sha)
              assert obj['encoding'] == 'base64'
              data = base64.b64decode(obj['content'])
              assert len(data) == record['bytes']
              assert hashlib.sha256(data).hexdigest() == record['sha256']
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              record['readback_verified'] = True
              print('CANDIDATE_VERIFIED ' + json.dumps(record, sort_keys=True))
              text = data.decode('utf-8')
              if record['path'] == 'pnpm-lock.yaml':
                  print('PNPM_HEADER ' + json.dumps(text.split('importers:', 1)[0]))
                  entries = sorted(set(re.findall(r'^  [\x27\x22]?((?:esbuild|@esbuild/[^@\s:\x27\x22]+)@[^\s:\x27\x22]+)[\x27\x22]?:', text, re.M)))
                  print('PNPM_ESBUILD_ENTRIES ' + json.dumps(entries))
              else:
                  lock = json.loads(text)
                  print('NPM_ROOT ' + json.dumps(lock['packages'][''], sort_keys=True))
          assert seen == expected

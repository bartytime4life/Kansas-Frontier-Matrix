# KFM dependency vulnerability scanning workflow.
# Status: PROPOSED executable Python audit plus locked pnpm and npm audits.
#
# Authority boundary:
# - This workflow queries public vulnerability advisory services and reports
#   point-in-time dependency findings for the checked revision.
# - It does not prove that dependencies are vulnerability-free, compatible,
#   provenance-complete, rights-cleared, or approved for release/publication.
# - It never modifies dependency manifests, lockfiles, source data, lifecycle
#   artifacts, releases, deployments, or publication state.
name: dependency-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Advisory databases change independently of repository commits.
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_STRICT: "1"
  NODE_VERSION: "22"
  PNPM_AUDIT_LEVEL: high
  TZ: UTC
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out scanned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tools/ci/python-audit.lock
            tools/ci/python-test.lock

      - name: Install pinned audit tool
        run: python tools/ci/install_python_ci.py audit-tool

      - name: Audit the hash-locked Python CI dependency set
        run: >-
          python -m pip_audit
          --requirement tools/ci/python-test.lock
          --no-deps
          --progress-spinner off
          --desc off
          --format columns

      - name: Record Python audit boundary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Python dependency audit boundary

          This lane audits the complete, hash-locked Python CI dependency set
          with scanner version `pip-audit==2.10.1`, itself installed from a
          separate hash-locked environment.

          A green result means no known vulnerability was reported for the
          exact dependency versions in `tools/ci/python-test.lock` against the
          advisory data available during this run.

          The result is not proof of vulnerability absence, compatibility,
          source integrity, release readiness, deployment approval, or
          publication authority.
          EOF

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out scanned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up readiness validator runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate locked pnpm audit readiness
        run: >-
          python tools/validators/dependencies/pnpm_audit_readiness.py
          validate-repository
          --repository-root .

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate the exact package manager
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version

      - name: Audit the locked Node graphs
        run: |
          set -euo pipefail
          pnpm_report_path="${RUNNER_TEMP}/pnpm-audit.json"
          pnpm_classification_path="${RUNNER_TEMP}/pnpm-audit-classification.json"
          npm_report_path="${RUNNER_TEMP}/explorer-npm-audit.json"
          npm_classification_path="${RUNNER_TEMP}/explorer-npm-audit-classification.json"

          set +e
          pnpm audit \
            --audit-level "${PNPM_AUDIT_LEVEL}" \
            --json > "${pnpm_report_path}"
          pnpm_audit_status=$?
          set -e

          set +e
          python tools/validators/dependencies/pnpm_audit_readiness.py \
            classify-audit \
            --report "${pnpm_report_path}" \
            --command-exit-code "${pnpm_audit_status}" \
            --audit-level "${PNPM_AUDIT_LEVEL}" \
            --manager "pnpm" \
            | tee "${pnpm_classification_path}"
          pnpm_classification_status=${PIPESTATUS[0]}

          npm --prefix apps/kansas-frontier-matrix-explorer audit \
            --package-lock-only \
            --workspaces=false \
            --audit-level "${PNPM_AUDIT_LEVEL}" \
            --json > "${npm_report_path}"
          npm_audit_status=$?
          set -e

          set +e
          python tools/validators/dependencies/pnpm_audit_readiness.py \
            classify-audit \
            --report "${npm_report_path}" \
            --command-exit-code "${npm_audit_status}" \
            --audit-level "${PNPM_AUDIT_LEVEL}" \
            --manager "npm" \
            | tee "${npm_classification_path}"
          npm_classification_status=${PIPESTATUS[0]}
          set -e

          if (( pnpm_classification_status != 0 || npm_classification_status != 0 )); then
            exit 1
          fi

      - name: Record Node audit boundaries
        if: always()
        run: |
          set -euo pipefail
          pnpm_classification_path="${RUNNER_TEMP}/pnpm-audit-classification.json"
          npm_classification_path="${RUNNER_TEMP}/explorer-npm-audit-classification.json"
          pnpm_classification="$(tr -d '\n' < "${pnpm_classification_path}" 2>/dev/null || true)"
          npm_classification="$(tr -d '\n' < "${npm_classification_path}" 2>/dev/null || true)"
          [[ -n "${pnpm_classification}" ]] || pnpm_classification='{"outcome":"ERROR","reason_codes":["CLASSIFICATION_NOT_PRODUCED"]}'
          [[ -n "${npm_classification}" ]] || npm_classification='{"outcome":"ERROR","reason_codes":["CLASSIFICATION_NOT_PRODUCED"]}'
          {
            echo "### Node dependency audit boundaries"
            echo
            echo "- Result: \`${{ job.status }}\`"
            echo "- Root coordination graph: \`pnpm@11.17.0\` via Corepack"
            echo "- Root command: \`pnpm audit --audit-level ${PNPM_AUDIT_LEVEL} --json\`"
            echo "- Root classifier: \`${pnpm_classification}\`"
            echo "- Explorer installed graph: \`apps/kansas-frontier-matrix-explorer/package-lock.json\`"
            echo "- Explorer command: \`npm --prefix apps/kansas-frontier-matrix-explorer audit --package-lock-only --workspaces=false --audit-level ${PNPM_AUDIT_LEVEL} --json\`"
            echo "- Explorer classifier: \`${npm_classification}\`"
            echo "- Network: point-in-time queries to the configured Node package registry advisory services"
            echo "- Failure posture: threshold findings, registry errors, malformed reports, and command/report polarity mismatches fail closed"
            echo "- Authority: dependency CI signal only; not vulnerability absence, provenance, compatibility, rights, release, deployment, or publication approval"
          } >> "${GITHUB_STEP_SUMMARY}"

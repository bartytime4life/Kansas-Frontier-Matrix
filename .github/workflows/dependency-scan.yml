# KFM dependency vulnerability scanning workflow.
# Status: PROPOSED executable Python audit plus locked pnpm audit.
#
# Authority boundary:
# - This workflow queries public vulnerability advisory services and reports
#   point-in-time dependency findings for the checked revision.
# - It does not prove that dependencies are vulnerability-free, compatible,
#   provenance-complete, rights-cleared, or approved for release/publication.
# - It never modifies dependency manifests, lockfiles, source data, lifecycle
#   artifacts, releases, deployments, or publication state.
name: dependency-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Advisory databases change independently of repository commits.
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_STRICT: "1"
  NODE_VERSION: "22"
  PNPM_AUDIT_LEVEL: high
  TZ: UTC
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out scanned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned audit tool
        run: python -m pip install "pip-audit==2.10.1"

      - name: Audit root Python project dependencies
        run: >-
          python -m pip_audit .
          --progress-spinner off
          --desc off
          --format columns

      - name: Record Python audit boundary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Python dependency audit boundary

          This lane audits dependencies resolved from the root `pyproject.toml`
          with pinned scanner version `pip-audit==2.10.1`.

          A green result means no known vulnerability was reported for the
          dependency resolution produced during this run. The repository does
          not currently provide a committed Python lockfile at this root, so
          this is a point-in-time resolution rather than a reproducible locked
          dependency attestation.

          The result is not proof of vulnerability absence, compatibility,
          source integrity, release readiness, deployment approval, or
          publication authority.
          EOF

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out scanned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up readiness validator runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate locked pnpm audit readiness
        run: >-
          python tools/validators/dependencies/pnpm_audit_readiness.py
          validate-repository
          --repository-root .

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate the exact package manager
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version

      - name: Audit the locked pnpm workspace
        run: |
          set -euo pipefail
          report_path="${RUNNER_TEMP}/pnpm-audit.json"
          classification_path="${RUNNER_TEMP}/pnpm-audit-classification.json"

          set +e
          pnpm audit \
            --audit-level "${PNPM_AUDIT_LEVEL}" \
            --json > "${report_path}"
          audit_status=$?
          set -e

          python tools/validators/dependencies/pnpm_audit_readiness.py \
            classify-audit \
            --report "${report_path}" \
            --command-exit-code "${audit_status}" \
            --audit-level "${PNPM_AUDIT_LEVEL}" \
            | tee "${classification_path}"

      - name: Record pnpm audit boundary
        if: always()
        run: |
          set -euo pipefail
          classification_path="${RUNNER_TEMP}/pnpm-audit-classification.json"
          if [[ -s "${classification_path}" ]]; then
            classification="$(tr -d '\n' < "${classification_path}")"
          else
            classification='{"outcome":"ERROR","reason_codes":["CLASSIFICATION_NOT_PRODUCED"]}'
          fi
          {
            echo "### Node dependency audit boundary"
            echo
            echo "- Result: \`${{ job.status }}\`"
            echo "- Manager contract: \`pnpm@11.17.0\` via Corepack"
            echo "- Command: \`pnpm audit --audit-level ${PNPM_AUDIT_LEVEL} --json\`"
            echo "- Classifier: \`${classification}\`"
            echo "- Network: point-in-time query to the configured pnpm registry advisory service"
            echo "- Failure posture: threshold findings, registry errors, malformed reports, and command/report polarity mismatches fail closed"
            echo "- Authority: dependency CI signal only; not vulnerability absence, provenance, compatibility, rights, release, deployment, or publication approval"
          } >> "${GITHUB_STEP_SUMMARY}"

# Generate and inspect one bounded synthetic GeoParquet carrier pair.
name: geoparquet-2-rc-pyarrow-carrier-probe

"on":
  pull_request:
    paths:
      - ".github/workflows/geoparquet-2-rc-pyarrow-carrier-probe.yml"
      - "contracts/release/geoparquet_2_rc_pyarrow_carrier_probe.md"
      - "schemas/contracts/v1/release/geoparquet_2_rc_pyarrow_carrier_probe.schema.json"
      - "fixtures/contracts/v1/release/geoparquet_2_rc_pyarrow_carrier_probe/**"
      - "tools/experiments/geoparquet/generate_pyarrow_25_carriers.py"
      - "tools/validators/release/validate_geoparquet_2_rc_pyarrow_carriers.py"
      - "tests/release/test_geoparquet_2_rc_pyarrow_carriers.py"
      - "tools/ci/geoparquet-pyarrow-25.lock"
      - "data/receipts/generated/genrec-geoparquet-2-rc-pyarrow-carrier-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/geoparquet-2-rc-pyarrow-carrier-probe.yml"
      - "contracts/release/geoparquet_2_rc_pyarrow_carrier_probe.md"
      - "schemas/contracts/v1/release/geoparquet_2_rc_pyarrow_carrier_probe.schema.json"
      - "fixtures/contracts/v1/release/geoparquet_2_rc_pyarrow_carrier_probe/**"
      - "tools/experiments/geoparquet/generate_pyarrow_25_carriers.py"
      - "tools/validators/release/validate_geoparquet_2_rc_pyarrow_carriers.py"
      - "tests/release/test_geoparquet_2_rc_pyarrow_carriers.py"
      - "tools/ci/geoparquet-pyarrow-25.lock"
      - "data/receipts/generated/genrec-geoparquet-2-rc-pyarrow-carrier-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoparquet-2-rc-pyarrow-carrier-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  probe:
    name: generate-and-inspect-pyarrow-carriers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install declared schema and test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Install exact PyArrow wheel with hash verification
        run: |
          set -euo pipefail
          python -m pip install --no-deps --require-hashes \
            -r tools/ci/geoparquet-pyarrow-25.lock
          python -c 'import pyarrow; assert pyarrow.__version__ == "25.0.0"'

      - name: Generate actual synthetic carrier bytes
        env:
          KFM_NO_NETWORK: "1"
        run: |
          set -euo pipefail
          rm -rf artifacts/qa/geoparquet-2-rc-pyarrow-carriers
          python tools/experiments/geoparquet/generate_pyarrow_25_carriers.py \
            --output artifacts/qa/geoparquet-2-rc-pyarrow-carriers

      - name: Validate actual carrier bytes and finite PARTIAL result
        env:
          KFM_NO_NETWORK: "1"
        run: |
          set -euo pipefail
          python tools/validators/release/validate_geoparquet_2_rc_pyarrow_carriers.py \
            --root artifacts/qa/geoparquet-2-rc-pyarrow-carriers \
            --manifest artifacts/qa/geoparquet-2-rc-pyarrow-carriers/manifest.json

      - name: Run focused negative tests
        env:
          KFM_NO_NETWORK: "1"
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/release/test_geoparquet_2_rc_pyarrow_carriers.py \
            --strict-config --strict-markers

      - name: Upload carrier review packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geoparquet-2-rc-pyarrow-carriers
          path: artifacts/qa/geoparquet-2-rc-pyarrow-carriers/
          if-no-files-found: error
          retention-days: 14

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### GeoParquet 2.0 RC PyArrow carrier probe"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: two actual synthetic Parquet carriers under exact PyArrow 25.0.0."
            echo "- Finite posture: PARTIAL only; no cross-engine or pruning claim."
            echo "- Boundary: GeoParquet 1.1.0 remains the KFM default; no adoption, migration, release, deployment, publication, or public-use authority is created."
          } >> "$GITHUB_STEP_SUMMARY"

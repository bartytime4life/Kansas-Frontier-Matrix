# Validate fixture-only WBD HUC12 material-change assessments.
name: hydrology-wbd-huc12-material-change
"on":
  pull_request:
    paths:
      - ".github/workflows/hydrology-wbd-huc12-material-change.yml"
      - "contracts/domains/hydrology/wbd_huc12_material_change_assessment.md"
      - "schemas/contracts/v1/domains/hydrology/wbd_huc12_material_change_assessment.schema.json"
      - "tools/validators/domains/hydrology/wbd_huc12_material_change/**"
      - "fixtures/domains/hydrology/wbd_huc12_material_change/**"
      - "tests/validators/domains/hydrology/wbd_huc12_material_change/**"
      - "data/receipts/generated/genrec-hydrology-wbd-huc12-material-change-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hydrology-wbd-huc12-material-change.yml"
      - "contracts/domains/hydrology/wbd_huc12_material_change_assessment.md"
      - "schemas/contracts/v1/domains/hydrology/wbd_huc12_material_change_assessment.schema.json"
      - "tools/validators/domains/hydrology/wbd_huc12_material_change/**"
      - "fixtures/domains/hydrology/wbd_huc12_material_change/**"
      - "tests/validators/domains/hydrology/wbd_huc12_material_change/**"
      - "data/receipts/generated/genrec-hydrology-wbd-huc12-material-change-*.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hydrology-wbd-huc12-material-change-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC
jobs:
  validate:
    name: validate-wbd-huc12-material-change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run deterministic HUC12 material-change tests
        run: |
          set -euo pipefail
          python -m pytest tests/validators/domains/hydrology/wbd_huc12_material_change/test_validate_wbd_huc12_material_change.py -q --strict-config --strict-markers
      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-hydrology-wbd-huc12-material-change-20260806.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Fixture-only WBD HUC12 material change"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: geometry normalization, geometry-plus-area fingerprints, metadata-churn suppression, and ADD/REMOVE/NO_CHANGE/MATERIAL_CHANGE decisions."
            echo "- Boundary: no WBD request, source activation, lifecycle write, promotion, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

# Branch-only exact-head validation. No source admission, renderer activation,
# PR lifecycle, repository writes, release or deployment permissions.
name: earth-layer-library-app-validation
on:
  push:
    branches: [agent/earth-layer-library-readback-20260905]
    paths:
      - .github/workflows/earth-layer-library-app-validation.yml
      - apps/kansas-frontier-matrix-explorer/**
      - packages/ui/src/layer-library*
      - data/receipts/generated/genrec-earth-layer-library-app-*
permissions:
  contents: read
concurrency:
  group: earth-layer-library-app-validation-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  DO_NOT_TRACK: '1'
  CLOUDFLARE_SEND_METRICS: 'false'
  WRANGLER_SEND_METRICS: 'false'
jobs:
  native-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify preserved lineage and policy preimages
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 34a9348ce7882284a5843f414368b92ade9d79db HEAD
          git merge-base --is-ancestor 8b9c52d88687986879c8f87d7e3835f6a58bbacd HEAD
          test -z "$(git ls-files '*earth-library-authoring*')"
          mkdir -p "$RUNNER_TEMP/earth-library-app"
          git rev-parse HEAD > "$RUNNER_TEMP/earth-library-app/head.txt"
          git diff --stat 8b9c52d88687986879c8f87d7e3835f6a58bbacd HEAD > "$RUNNER_TEMP/earth-library-app/diff-stat.txt"
          sha256sum package.json pnpm-workspace.yaml pnpm-lock.yaml apps/kansas-frontier-matrix-explorer/package.json apps/kansas-frontier-matrix-explorer/package-lock.json > "$RUNNER_TEMP/earth-library-app/locks.sha256"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install exact frozen workspace without build-policy changes
        id: install
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          sha256sum -c "$RUNNER_TEMP/earth-library-app/locks.sha256"
      - name: Native Library and synchronous owner tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/kansas-frontier-matrix-explorer/tests/earth-layer-library.test.mjs apps/kansas-frontier-matrix-explorer/tests/site-requested-layer-state.test.mjs 2>&1 | tee "$RUNNER_TEMP/earth-library-app/library-node.log"
      - name: Build the existing Explorer in the complete locked workspace
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter kansas-frontier-matrix-explorer build 2>&1 | tee "$RUNNER_TEMP/earth-library-app/build.log"
      - name: Existing application Node regression suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd apps/kansas-frontier-matrix-explorer
          node --test tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/earth-library-app/app-node.log"
      - name: Install locked Playwright Chromium
        id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Actual HTTP app composition and browser interactions
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter kansas-frontier-matrix-explorer exec vite --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/earth-library-app/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            kill -0 "$server_pid"
            sleep 2
          done
          test "$ready" = 1
          KFM_APP_URL=http://127.0.0.1:4173 KFM_APP_OUTPUT="$RUNNER_TEMP/earth-library-app/browser" node apps/kansas-frontier-matrix-explorer/tests/earth-layer-library.app.mjs 2>&1 | tee "$RUNNER_TEMP/earth-library-app/browser.log"
      - name: Verify dependency and build-policy immutability
        if: always()
        run: sha256sum -c "$RUNNER_TEMP/earth-library-app/locks.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: earth-library-actual-app-${{ github.sha }}
          path: ${{ runner.temp }}/earth-library-app/
          retention-days: 14
          if-no-files-found: error

# Temporary exact-byte authoring transport. Removed before final validation.
# Materializes unreferenced blobs only; never writes refs, commits, PRs or releases.
name: earth-layer-library-app-validation
on:
  push:
    branches: [agent/earth-layer-library-readback-20260905]
    paths:
      - .github/workflows/earth-layer-library-app-validation.yml
      - apps/kansas-frontier-matrix-explorer/tests/earth-library-authoring.patch.xz.*
permissions:
  contents: read
concurrency:
  group: earth-layer-library-app-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-byte-authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check pins, apply exact task patch and materialize only its Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 34a9348ce7882284a5843f414368b92ade9d79db HEAD
          git merge-base --is-ancestor 8b9c52d88687986879c8f87d7e3835f6a58bbacd HEAD
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root=pathlib.Path('.')
          app='apps/kansas-frontier-matrix-explorer/'
          paths=[app+'app/'+p for p in ['page.tsx','layout.tsx','site-requested-layer-state.ts','site-layer-library.tsx','site-layer-library.css']]
          paths += [app+'tests/'+p for p in ['site-requested-layer-state.test.mjs','earth-layer-library.test.mjs','earth-layer-library.app.mjs']]
          paths += ['packages/ui/src/layer-library-model.ts','packages/ui/src/layer-library-view.ts']
          packed=b''.join((root/(app+'tests/earth-library-authoring.patch.xz.'+str(n))).read_bytes() for n in (0,1))
          patch=lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest()=='5876e35df67a9a960c6656f9cd7b515c16ef8eebd2523e8509c22aba9bfc31d6'
          changed=[line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')]
          assert set(changed)==set(paths) and len(changed)==len(paths)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          results={}
          for path in paths:
            content=(root/path).read_bytes()
            expected=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
            payload=json.dumps({'content':base64.b64encode(content).decode(),'encoding':'base64'}).encode()
            request=urllib.request.Request('https://api.github.com/repos/bartytime4life/Kansas-Frontier-Matrix/git/blobs',data=payload,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
            with urllib.request.urlopen(request,timeout=30) as response: received=json.load(response)['sha']
            assert received==expected
            results[path]={'git_blob':received,'sha256':hashlib.sha256(content).hexdigest()}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'earth-library-authoring';out.mkdir()
          (out/'blob-manifest.json').write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: earth-library-authoring-blobs
          path: ${{ runner.temp }}/earth-library-authoring/
          retention-days: 7
          if-no-files-found: error

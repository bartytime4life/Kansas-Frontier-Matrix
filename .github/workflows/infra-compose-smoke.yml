# Render and build the bounded KFM Compose placeholder without starting services.
# This workflow proves path/context integrity only; it is not deployment or runtime proof.

name: infra-compose-smoke

"on":
  pull_request:
    paths:
      - ".github/workflows/infra-compose-smoke.yml"
      - "infra/compose/**"
      - "infra/docker/**"
      - "tests/infra/**"
      - "Makefile"
      - "data/receipts/generated/genrec-governed-api-*.json"
      - "tools/validators/validate_generated_receipt.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/infra-compose-smoke.yml"
      - "infra/compose/**"
      - "infra/docker/**"
      - "tests/infra/**"
      - "Makefile"
      - "data/receipts/generated/genrec-governed-api-*.json"
      - "tools/validators/validate_generated_receipt.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-compose-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-compose-boundary:
    name: static-compose-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run static Docker and Compose boundary tests
        env:
          KFM_NO_NETWORK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: |
          python -m unittest discover \
            --start-directory tests/infra \
            --pattern 'test_*.py' \
            --verbose

  review-image-receipt:
    name: review-image-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KFM_NO_NETWORK: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up repository Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Replay the review-image generated receipts
        run: make governed-api-image-receipt

      - name: Record bounded result
        if: always()
        run: |
          {
            echo "### Review-image receipt replay"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- One genrec-governed-api receipt must bind the current Dockerfile and README bytes; superseded receipts replay at their pinned commits."
            echo "- GOVERNED_API_IMAGE_RECEIPT_MISSING means infra/docker changed (for example a base-digest bump) without a successor receipt."
            echo "- A green result is provenance integrity only; it is not a scan result, approval, release, or deployment."
          } >> "$GITHUB_STEP_SUMMARY"

  render-and-build-compose:
    name: render-and-build-compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record Docker and Compose versions
        run: |
          docker --version
          docker compose version

      - name: Render Compose configuration
        run: docker compose -f infra/compose/docker-compose.yml config --quiet

      - name: Build placeholder images
        run: docker compose -f infra/compose/docker-compose.yml build

      - name: Record bounded result
        if: always()
        run: |
          {
            echo "### Compose smoke"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Services were not started."
            echo "- A green result proves only that the checked-in Compose file renders and its placeholder Dockerfiles build on this runner."
            echo "- It does not prove application code, commands, health checks, governed API behavior, Explorer behavior, deployment, release, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

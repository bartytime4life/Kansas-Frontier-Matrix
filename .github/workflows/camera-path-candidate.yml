# Validate the fixture-only CameraPath candidate.
name: camera-path-candidate

"on":
  pull_request:
    paths:
      - ".github/workflows/camera-path-candidate.yml"
      - "contracts/ui/camera_path.md"
      - "schemas/contracts/v1/ui/camera_path.schema.json"
      - "fixtures/contracts/v1/ui/camera_path/**"
      - "tools/validators/ui/validate_camera_path.py"
      - "tests/validators/ui/test_camera_path.py"
      - "docs/intake/exploratory/camera-path-source-map.md"
      - "contracts/ui/view_registry_profile.md"
      - "docs/architecture/ui/ACCESSIBILITY.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-camera-path-candidate-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/camera-path-candidate.yml"
      - "contracts/ui/camera_path.md"
      - "schemas/contracts/v1/ui/camera_path.schema.json"
      - "fixtures/contracts/v1/ui/camera_path/**"
      - "tools/validators/ui/validate_camera_path.py"
      - "tests/validators/ui/test_camera_path.py"
      - "docs/intake/exploratory/camera-path-source-map.md"
      - "contracts/ui/view_registry_profile.md"
      - "docs/architecture/ui/ACCESSIBILITY.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-camera-path-candidate-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-camera-path-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests and fixture replay
        run: |
          python -m unittest -v tests.validators.ui.test_camera_path
          python tools/validators/ui/validate_camera_path.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-camera-path-candidate-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### CameraPathCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only renderer-neutral camera path."
            echo "- Boundary: no playback, renderer selection, scene/evidence resolution, policy or admission decision, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

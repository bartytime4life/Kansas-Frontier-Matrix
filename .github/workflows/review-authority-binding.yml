# Validate the fixture-only ReviewAuthorityBinding profile.
name: review-authority-binding

"on":
  pull_request:
    paths:
      - ".github/workflows/review-authority-binding.yml"
      - "contracts/governance/review_authority_binding.md"
      - "schemas/contracts/v1/governance/review_authority_binding.schema.json"
      - "fixtures/contracts/v1/governance/review_authority_binding/**"
      - "tools/validators/governance/validate_review_authority_binding.py"
      - "tests/validators/governance/test_review_authority_binding.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-review-authority-binding-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-authority-binding.yml"
      - "contracts/governance/review_authority_binding.md"
      - "schemas/contracts/v1/governance/review_authority_binding.schema.json"
      - "fixtures/contracts/v1/governance/review_authority_binding/**"
      - "tools/validators/governance/validate_review_authority_binding.py"
      - "tests/validators/governance/test_review_authority_binding.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-review-authority-binding-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-authority-binding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-review-authority-binding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/hashing/pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]" -e "./packages/hashing[test]"

      - name: Run deterministic no-network tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/governance \
            --pattern 'test_review_authority_binding.py' \
            --verbose
          python tools/validators/governance/validate_review_authority_binding.py \
            --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-review-authority-binding-20260806.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Review authority binding validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: a closed fixture profile, deterministic identity, declared review/assignment/subject binding, effective-window checks, finite BOUND/HOLD/DENY projections, and authoring-receipt integrity."
            echo "- Boundary: a green result does not authenticate an actor, resolve policy, emit or execute a write, mutate repository or lifecycle state, merge, promote, release, deploy, publish, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"

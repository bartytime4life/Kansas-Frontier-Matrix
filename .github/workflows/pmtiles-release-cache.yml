# Validate fixture-only release-scoped PMTiles cache policy.
name: pmtiles-release-cache

"on":
  pull_request:
    paths:
      - ".github/workflows/pmtiles-release-cache.yml"
      - "contracts/runtime/pmtiles_release_cache.md"
      - "fixtures/runtime/pmtiles_release_cache/**"
      - "apps/explorer-web/src/features/map_runtime/pmtiles_release_cache.ts"
      - "apps/explorer-web/tests/pmtiles-release-cache.test.ts"
      - "data/receipts/generated/genrec-pmtiles-release-cache-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pmtiles-release-cache.yml"
      - "contracts/runtime/pmtiles_release_cache.md"
      - "fixtures/runtime/pmtiles_release_cache/**"
      - "apps/explorer-web/src/features/map_runtime/pmtiles_release_cache.ts"
      - "apps/explorer-web/tests/pmtiles-release-cache.test.ts"
      - "data/receipts/generated/genrec-pmtiles-release-cache-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pmtiles-release-cache-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COREPACK_ENABLE_STRICT: "1"
  NODE_VERSION: "22"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          python -m pip install -e ".[test]"
      - name: Run focused unit test and Explorer build
        run: |
          set -euo pipefail
          pnpm --filter explorer-web exec vitest run tests/pmtiles-release-cache.test.ts
          pnpm --filter explorer-web build
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py             data/receipts/generated/genrec-pmtiles-release-cache-20260808.json             --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### PMTiles release cache"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: release/artifact/policy-scoped keys and deterministic first-run, partial, stale, withdrawn, and asset-completeness decisions."
            echo "- Boundary: no network request, CacheStorage mutation, MapLibre load, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

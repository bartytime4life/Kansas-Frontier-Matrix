name: stac-link-closure-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/stac-link-closure-assessment.yml"
      - "contracts/data/stac_link_closure_assessment.md"
      - "schemas/contracts/v1/data/stac_link_closure_assessment.schema.json"
      - "fixtures/contracts/v1/data/stac_link_closure_assessment/**"
      - "tools/validators/catalog/validate_stac_link_closure_assessment.py"
      - "tests/validators/test_validate_stac_link_closure_assessment.py"
      - "docs/intake/exploratory/stac-link-closure-assessment-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-stac-link-closure-assessment-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/stac-link-closure-assessment.yml"
      - "contracts/data/stac_link_closure_assessment.md"
      - "schemas/contracts/v1/data/stac_link_closure_assessment.schema.json"
      - "fixtures/contracts/v1/data/stac_link_closure_assessment/**"
      - "tools/validators/catalog/validate_stac_link_closure_assessment.py"
      - "tests/validators/test_validate_stac_link_closure_assessment.py"
      - "docs/intake/exploratory/stac-link-closure-assessment-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-stac-link-closure-assessment-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stac-link-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: python -m pytest -q tests/validators/test_validate_stac_link_closure_assessment.py
      - name: Verify generated authoring receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-stac-link-closure-assessment-20260810.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### STAC link-closure assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: deterministic closure of a supplied synthetic local STAC record graph."
            echo "- Boundary: no record validation, network or remote resolution, API or availability test, catalog mutation, policy, review, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

name: Embedded AI qualification
on:
  push:
    branches: [a0-node-smollm2-20261016]
permissions:
  contents: read
jobs:
  resolve-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
      - name: Resolve pinned embedded runtime without executing install scripts
        run: |
          cp package-lock.json /tmp/kfm-before-lock.json
          npm install --package-lock-only --ignore-scripts --save-exact @huggingface/transformers@4.3.1
      - name: Report public dependency and model identities
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const before=JSON.parse(readFileSync('/tmp/kfm-before-lock.json'));
          const after=JSON.parse(readFileSync('package-lock.json'));
          for(const [path,entry] of Object.entries(after.packages)) {
            if(JSON.stringify(entry)!==JSON.stringify(before.packages[path])) console.log('KFM_LOCK_ENTRY '+JSON.stringify({path,entry}));
          }
          for(const path of Object.keys(before.packages)) if(!(path in after.packages)) console.log('KFM_LOCK_DELETE '+JSON.stringify(path));
          const r=await fetch('https://huggingface.co/api/models/onnx-community/SmolLM2-360M-Instruct-ONNX?blobs=true',{signal:AbortSignal.timeout(20000)});
          if(!r.ok) throw new Error('MODEL_METADATA_UNAVAILABLE');
          const m=await r.json();
          const names=['config.json','generation_config.json','tokenizer.json','tokenizer_config.json','special_tokens_map.json','onnx/model_q4.onnx'];
          console.log('KFM_MODEL_IDENTITY '+JSON.stringify({id:m.id,sha:m.sha,license:m.cardData?.license,files:m.siblings.filter(x=>names.includes(x.rfilename))}));
          JS

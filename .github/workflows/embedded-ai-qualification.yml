name: Embedded AI qualification
on:
  push:
    branches: [a0-node-smollm2-20261016]
permissions:
  contents: read
jobs:
  embedded-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
      - run: npm ci
      - run: node --test tests/embedded-ai-probe.test.mjs
      - run: npm run build
      - name: Pinned private-files CPU inference
        run: |
          node --input-type=module <<'JS'
          import {qualifyEmbeddedAi} from './server/embedded-ai-probe.mjs';
          const receipt=await qualifyEmbeddedAi({root:process.env.RUNNER_TEMP});
          console.log('KFM_EMBEDDED_RECEIPT '+JSON.stringify(receipt));
          if(receipt.status!=='SYNTHETIC_INFERENCE_PASS') process.exitCode=1;
          JS

# Validate the fixture-only paleoenvironmental proxy provenance profile.
# This workflow performs no source access, coordinate disclosure, reconstruction, release, or publication action.
name: paleoenvironmental-proxy-provenance

"on":
  pull_request:
    paths:
      - ".github/workflows/paleoenvironmental-proxy-provenance.yml"
      - "contracts/evidence/paleoenvironmental_proxy_provenance.md"
      - "schemas/contracts/v1/evidence/paleoenvironmental_proxy_provenance.schema.json"
      - "fixtures/contracts/v1/evidence/paleoenvironmental_proxy_provenance/**"
      - "tools/validators/evidence/validate_paleoenvironmental_proxy_provenance.py"
      - "tests/validators/evidence/test_paleoenvironmental_proxy_provenance.py"
      - "docs/intake/exploratory/pass-30-paleoenvironmental-proxy-provenance-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-paleoenvironmental-proxy-provenance-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/paleoenvironmental-proxy-provenance.yml"
      - "contracts/evidence/paleoenvironmental_proxy_provenance.md"
      - "schemas/contracts/v1/evidence/paleoenvironmental_proxy_provenance.schema.json"
      - "fixtures/contracts/v1/evidence/paleoenvironmental_proxy_provenance/**"
      - "tools/validators/evidence/validate_paleoenvironmental_proxy_provenance.py"
      - "tests/validators/evidence/test_paleoenvironmental_proxy_provenance.py"
      - "docs/intake/exploratory/pass-30-paleoenvironmental-proxy-provenance-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-paleoenvironmental-proxy-provenance-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paleoenvironmental-proxy-provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-paleoenvironmental-proxy-provenance:
    name: validate-paleoenvironmental-proxy-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e .

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators/evidence \
            --pattern 'test_paleoenvironmental_proxy_provenance.py' \
            --verbose

      - name: Replay exact fixture polarity
        run: python tools/validators/evidence/validate_paleoenvironmental_proxy_provenance.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass30-paleoenvironmental-proxy-provenance-20260809.json

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### PaleoenvironmentalProxyProvenanceRecord"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic provenance shape, evidence closure, precision monotonicity, deterministic identity, and non-authority flags."
            echo "- Tests perform no source access, coordinate disclosure, reconstruction, current-condition inference, policy, release, or publication operation."
            echo "- A green result does not prove a paleoenvironment, authorize interpretation, release data, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

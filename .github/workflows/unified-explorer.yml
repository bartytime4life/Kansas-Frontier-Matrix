name: Unified Explorer candidate
on:
  pull_request:
  push:
    branches: [codex/unify-local-explorer-20261014]
permissions:
  contents: read
jobs:
  verify-node-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Execute changed behavior checks
        run: >-
          node --test --import ./tests/cloudflare-register.mjs
          tests/earth-engine-downloads.test.mjs tests/local-composed.test.mjs
          tests/pc-ai.test.mjs tests/pc-storage-probe.test.mjs
          tests/node-compressed-assets.test.mjs tests/map-controls-tidy.test.mjs
          tests/prepared-mobile-controls.test.mjs tests/scene-landscape-integration.test.mjs
          tests/scene-surface-integration.test.mjs tests/subsurface-worker.test.mjs
          tests/cutaway-model.test.mjs tests/area-underlay.test.mjs tests/subsurface-slice.test.mjs
          tests/local-qwen-bridge.test.mjs tests/qwen-question-gate-corpus.test.mjs
          tests/qwen-availability.test.mjs tests/qwen-real-envelope-size.test.mjs
          tests/local-qwen-installer.test.mjs tests/qwen-local-eval.test.mjs tests/qwen-knowledge.test.mjs
          tests/water-motion-canvas.test.mjs tests/water-flow-motion.test.mjs
          tests/water-flow-sync.test.mjs tests/water-path-analysis.test.mjs tests/water-flow-context.test.mjs tests/water-direction-route.test.mjs tests/scene-studio.test.mjs tests/streamflow-startup* tests/scene-navigation*
      - name: Exercise real Node HTTP boundary
        shell: bash
        run: |
          set -euo pipefail
          PORT=5182 node server/start.mjs > "$RUNNER_TEMP/node-runtime.log" 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5182/ > /dev/null; then break; fi
            sleep 1
          done
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5182 node --test tests/godaddy-node-runtime.test.mjs
      - name: Candidate scope
        run: |
          echo 'Native D1/R2 capsule, installed-state and local browser checks have separate owner-PC receipts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This focused Node job does not claim a green mixed-runtime full suite, approval, activation or deployment.' >> "$GITHUB_STEP_SUMMARY"

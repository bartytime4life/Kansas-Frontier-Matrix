# Validate the inactive, fixture-only RendererPluginAdmissionAssessment profile.
name: renderer-plugin-admission-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/renderer-plugin-admission-assessment.yml"
      - "contracts/map/renderer_plugin_admission_assessment.md"
      - "docs/intake/exploratory/renderer-plugin-admission-assessment-source-map.md"
      - "fixtures/contracts/v1/map/renderer_plugin_admission_assessment/**"
      - "schemas/contracts/v1/map/renderer_plugin_admission_assessment.schema.json"
      - "tools/validators/map/validate_renderer_plugin_admission_assessment.py"
      - "tests/validators/map/test_validate_renderer_plugin_admission_assessment.py"
      - "data/receipts/generated/genrec-renderer-plugin-admission-assessment-20260810.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/renderer-plugin-admission-assessment.yml"
      - "contracts/map/renderer_plugin_admission_assessment.md"
      - "docs/intake/exploratory/renderer-plugin-admission-assessment-source-map.md"
      - "fixtures/contracts/v1/map/renderer_plugin_admission_assessment/**"
      - "schemas/contracts/v1/map/renderer_plugin_admission_assessment.schema.json"
      - "tools/validators/map/validate_renderer_plugin_admission_assessment.py"
      - "tests/validators/map/test_validate_renderer_plugin_admission_assessment.py"
      - "data/receipts/generated/genrec-renderer-plugin-admission-assessment-20260810.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-plugin-admission-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-renderer-plugin-admission-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema, hashing, and test dependencies
        shell: bash
        run: python -m pip install -e ".[test]"
      - name: Compile validator and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/validators/map/validate_renderer_plugin_admission_assessment.py \
            tests/validators/map/test_validate_renderer_plugin_admission_assessment.py
      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.validators.map.test_validate_renderer_plugin_admission_assessment --verbose
      - name: Replay exact fixture outcomes
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/map/validate_renderer_plugin_admission_assessment.py --fixtures
      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-renderer-plugin-admission-assessment-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### RendererPluginAdmissionAssessment fixture profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: exact package binding, origin, lockfile, attestation, SBOM, license, vulnerability, adapter, network declaration, removal, rollback, deterministic identity, and exact fixture polarity."
            echo "- Boundary: no registry query, download, install, import, renderer boot, network probe, lockfile mutation, policy decision, approval, release, deployment, or publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

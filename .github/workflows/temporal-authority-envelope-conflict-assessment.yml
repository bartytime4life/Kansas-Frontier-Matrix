name: temporal-authority-envelope-conflict-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/temporal-authority-envelope-conflict-assessment.yml"
      - ".github/workflows/evidence-temporal-posture-assessment.yml"
      - ".github/workflows/temporal-authority-envelope.yml"
      - ".github/workflows/briefing-integration.yml"
      - "contracts/common/temporal_authority_envelope.md"
      - "contracts/evidence/evidence_temporal_posture_assessment.md"
      - "contracts/evidence/temporal_authority_envelope.md"
      - "schemas/contracts/v1/common/temporal_authority_envelope.schema.json"
      - "schemas/contracts/v1/evidence/evidence_temporal_posture_assessment.schema.json"
      - "schemas/contracts/v1/evidence/temporal_authority_envelope.schema.json"
      - "fixtures/contracts/v1/common/temporal_authority_envelope/**"
      - "fixtures/contracts/v1/evidence/evidence_temporal_posture_assessment/**"
      - "fixtures/contracts/v1/evidence/temporal_authority_envelope/**"
      - "tools/validators/evidence/validate_evidence_temporal_posture_assessment.py"
      - "tools/validators/evidence/validate_temporal_authority_envelope.py"
      - "tests/evidence/test_evidence_temporal_posture_assessment.py"
      - "tests/evidence/test_temporal_authority_envelope.py"
      - "tools/validators/governance/assess_temporal_authority_envelope_conflict.py"
      - "tools/validators/governance/temporal_authority_split_*.py"
      - "tests/validators/governance/test_assess_temporal_authority_envelope_conflict.py"
      - "schemas/contracts/v1/common/advisory_event_envelope.schema.json"
      - "contracts/governance/program_outcome_chain.md"
      - "schemas/contracts/v1/governance/program_outcome_chain.schema.json"
      - "tools/validators/governance/program_outcome_chain_model.py"
      - "docs/adr/ADR-0014-temporal-vocabulary--six-time-kinds-tracked.md"
      - "docs/adr/ADR-0029-adopt-directory-governance-standard-v2.md"
      - "data/receipts/generated/genrec-*temporal*"
  workflow_dispatch:

permissions:
  contents: read
env:
  KFM_NO_NETWORK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC
jobs:
  assess:
    name: hold-unresolved-temporal-authority-conflict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run deterministic split-assessment tests
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/validators/governance/assess_temporal_authority_envelope_conflict.py \
            tests/validators/governance/test_assess_temporal_authority_envelope_conflict.py
          python -m unittest tests.validators.governance.test_assess_temporal_authority_envelope_conflict --verbose
      - name: Require the compatibility HOLD outcome
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/temporal-authority-envelope-split.json"
          set +e
          python tools/validators/governance/assess_temporal_authority_envelope_conflict.py \
            --revision "$GITHUB_SHA" --format json > "$report"
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then
            cat "$report"
            exit 1
          fi
          python - "$report" <<'PY'
          import json, os, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["outcome"] == "HOLD_COMPATIBILITY"
          assert report["disposition"] == "SPLIT"
          assert report["revision"] == os.environ["GITHUB_SHA"]
          assert report["scan_complete"] is True
          assert report["findings"] == []
          assert report["scan_gaps"] == []
          assert all(value is False for value in report["authority"].values())
          assert "KFM-TAE-SPLIT-ACTIVE" in report["reason_codes"]
          assert "KFM-TAE-LEGACY-COMPATIBILITY-ACTIVE" in report["reason_codes"]
          assert "KFM-TAE-EXTERNAL-INVENTORY-REQUIRED-BEFORE-REMOVAL" in report["reason_codes"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### TemporalAuthorityEnvelope split assessment\n\n")
              summary.write("- Outcome: `HOLD_COMPATIBILITY` (expected, exit 3).\n")
              summary.write("- Disposition: `SPLIT`.\n")
              summary.write(f"- Reference-bearing tracked files: `{report['reference_file_count']}`.\n")
              summary.write(f"- Unresolved tracked references held: `{len(report['unresolved_reference_paths'])}`.\n")
              summary.write("- External persisted-record inventory remains required before legacy removal.\n")
              summary.write("- No ADR acceptance, translation, source, evidence, policy, review, release, deployment, publication, access, or settings authority was created.\n")
          PY

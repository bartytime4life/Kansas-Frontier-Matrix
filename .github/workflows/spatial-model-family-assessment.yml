name: spatial-model-family-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/spatial-model-family-assessment.yml"
      - "contracts/common/spatial_model_family_assessment.md"
      - "schemas/contracts/v1/common/spatial_model_family_assessment.schema.json"
      - "fixtures/contracts/v1/common/spatial_model_family_assessment/**"
      - "tools/validators/validate_spatial_model_family_assessment.py"
      - "tests/validators/test_validate_spatial_model_family_assessment.py"
      - "docs/intake/exploratory/pass-18-spatial-model-family-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass18-spatial-model-family-assessment-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/spatial-model-family-assessment.yml"
      - "contracts/common/spatial_model_family_assessment.md"
      - "schemas/contracts/v1/common/spatial_model_family_assessment.schema.json"
      - "fixtures/contracts/v1/common/spatial_model_family_assessment/**"
      - "tools/validators/validate_spatial_model_family_assessment.py"
      - "tests/validators/test_validate_spatial_model_family_assessment.py"
      - "docs/intake/exploratory/pass-18-spatial-model-family-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass18-spatial-model-family-assessment-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spatial-model-family-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-spatial-model-family-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/validate_spatial_model_family_assessment.py tests/validators/test_validate_spatial_model_family_assessment.py
          python -m unittest tests.validators.test_validate_spatial_model_family_assessment --verbose
          python tools/validators/validate_spatial_model_family_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-spatial-model-family-assessment-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Spatial model family assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only family, evidence-lane, composite-decomposition, uncertainty, review, identity, and non-authority coherence."
            echo "- Boundary: no data inspection, scientific validation, production dispatch, registry or layer mutation, policy or review decision, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

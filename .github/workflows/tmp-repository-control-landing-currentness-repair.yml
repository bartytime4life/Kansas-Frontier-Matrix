          doc = replace_once(
              doc,
              "  - https://github.com/bartytime4life/Kansas-Frontier-Matrix/issues/4024#issuecomment-5534073715\n  - https://github.com/bartytime4life/Kansas-Frontier-Matrix/tree/fix/repository-control-content-length-completeness-20260903",
              "  - https://github.com/bartytime4life/Kansas-Frontier-Matrix/issues/4024#issuecomment-5534073715\n  - https://github.com/bartytime4life/Kansas-Frontier-Matrix/issues/4024#issuecomment-5541314138\n  - https://github.com/bartytime4life/Kansas-Frontier-Matrix/issues/4024#issuecomment-5541394598\n  - https://github.com/bartytime4life/Kansas-Frontier-Matrix/tree/fix/repository-control-content-length-completeness-20260903\n  - https://github.com/bartytime4life/Kansas-Frontier-Matrix/tree/candidate/repository-control-completeness-currentness-20260904",

# Temporary branch-only writer for the two-file repository-control landing-currentness repair.
# It verifies the preserved cursor, edits only the governance note and its coupled
# regression, runs focused validation, and non-force pushes one commit to the
# unprotected repair branch. It never opens or mutates a pull request or settings.

name: temporary-repository-control-landing-currentness-repair

"on":
  push:
    branches:
      - automation/repository-control-landing-repair-3ecbb83

permissions:
  contents: write

concurrency:
  group: temporary-repository-control-landing-currentness-repair
  cancel-in-progress: false

env:
  KFM_TARGET_BRANCH: repair/repository-control-composite-landing-currentness-20260904
  KFM_EXPECTED_HEAD: 3ecbb83c44aa0ee4f949ccb5a8ebe8212895dd2c
  KFM_EXPECTED_TREE: 90ff082763132ab5d71dab8825bac55c7d4d9e7f
  KFM_EXPECTED_DOC_BLOB: 64acc394aea093128478ed4efd5ae233ca617cee
  KFM_EXPECTED_STRICT_TEST_BLOB: 29e80df6fd0854aee794e09900e15b67a5ac1afa
  KFM_CONTENT_LENGTH_TEST_BLOB: 7c45d3085f9c3c08101395eeaa21bdc8af301f0e
  KFM_FETCH_HELPER_BLOB: 40498bd7be4318e43615c2a68713c6c43439308c
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary writer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check out exact preserved repair cursor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${KFM_TARGET_BRANCH}:refs/remotes/origin/${KFM_TARGET_BRANCH}"
          git checkout -B "${KFM_TARGET_BRANCH}" "refs/remotes/origin/${KFM_TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${KFM_EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^{tree})" = "${KFM_EXPECTED_TREE}"
          test "$(git rev-parse HEAD:docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md)" = "${KFM_EXPECTED_DOC_BLOB}"
          test "$(git rev-parse HEAD:tests/validators/test_repository_control_strict_input.py)" = "${KFM_EXPECTED_STRICT_TEST_BLOB}"
          test "$(git rev-parse HEAD:tests/validators/test_repository_control_content_length.py)" = "${KFM_CONTENT_LENGTH_TEST_BLOB}"
          test "$(git rev-parse HEAD:tools/validators/repository_control/fetch_bounded_issue_comments.py)" = "${KFM_FETCH_HELPER_BLOB}"

      - name: Apply landing-neutral documentation and regression repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          doc_path = Path("docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md")
          test_path = Path("tests/validators/test_repository_control_strict_input.py")

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_section(text: str, start: str, end: str, new: str, *, label: str) -> str:
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(
                      f"{label}: section markers are not unique "
                      f"(start={text.count(start)}, end={text.count(end)})"
                  )
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              return text[:start_index] + new.rstrip() + "\n\n" + text[end_index:]

          doc = doc_path.read_text(encoding="utf-8")
          doc = replace_once(doc, "version: v1.3.7", "version: v1.3.8", label="version")
          doc = replace_once(
              doc,
              "status: current-main workflow-active advisory; three-helper bounded capture integrated; Content-Length correction capability-reviewed branch-only; required-status-check authorization expired",
              "status: current-main workflow-active advisory at baseline main@7c5d4125; exact candidate carries capability-reviewed Content-Length correction; required-status-check authorization expired",
              label="status",
          )
          doc = replace_once(
              doc,
              "truth_posture: CONFIRMED current-main issue-#4024 binding and strict bounded-EOF capture / CONFIRMED silent-short declared-length gap on main / CAPABILITY_SEPARATED_TECHNICAL_PASS branch-only completeness correction / EXPIRED_UNAPPLIED required-check authorization",

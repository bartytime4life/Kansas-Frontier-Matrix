          capture_section = r'''## Current bounded source capture

The capture helper requests at most 100 records per page and admits at most 100
pages. A bounded sentinel page is used when page 100 is full so the source is
never silently truncated at the pagination limit.

The fixed limits are:

- 8 MiB of transferred input per page;
- 16 MiB of aggregate transferred and reserialized input;
- 10,000 admitted comment records;
- JSON depth of 32;
- 100,000 JSON nodes per page;
- 1,000,000 JSON nodes across the capture;
- 128 digits in an integer token; and
- 128 characters in a floating-point token.

At baseline `main@7c5d4125c277536258be6345e366efae59dbe5d6`, each response
read receives only the remaining byte allowance plus one overflow probe byte.
The reader stops at EOF but does not verify that EOF agrees with a declared
`Content-Length`. That baseline helper rejects non-standard `NaN`, `Infinity`,
and `-Infinity`, non-finite parsed floats, overlong integer tokens, duplicate
object keys, and parser `ValueError`, `OverflowError`, and `RecursionError`.
Output serialization uses `allow_nan=false`.

Any detected fetch, token, page, byte, node, depth, UTF-8, JSON, shape, or
serialization failure on that baseline produces only:

1. an empty comments array; and
2. the four-field source status with `status=UNAVAILABLE`.

A tree carrying corrected helper blob
`40498bd7be4318e43615c2a68713c6c43439308c` additionally collects strict textual
header shapes, rejects malformed, conflicting, overlong, non-text, unsupported,
or over-budget declarations, and requires declared-versus-received byte equality
after EOF. It classifies those cases as
`CONTROL_SOURCE_CONTENT_LENGTH_INVALID`, the applicable byte-overflow reason,
or `CONTROL_SOURCE_CONTENT_LENGTH_MISMATCH`, while preserving the same bounded
failure artifacts. Missing `Content-Length` remains permissible.

The helper returns control to the trusted-base availability validator, which
emits the nonzero blocking classification for an `UNAVAILABLE` source.'''

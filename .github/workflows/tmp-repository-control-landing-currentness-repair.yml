# Temporary branch-only writer for the two-file repository-control
# landing-currentness repair. It verifies the preserved cursor, edits only the
# governance note and coupled regression, validates, and non-force pushes one
# commit to the unprotected repair branch.

name: temporary-repository-control-landing-currentness-repair

"on":
  push:
    branches:
      - automation/repository-control-landing-repair-3ecbb83

permissions:
  contents: write

concurrency:
  group: temporary-repository-control-landing-currentness-repair
  cancel-in-progress: false

env:
  KFM_TARGET_BRANCH: repair/repository-control-composite-landing-currentness-20260904
  KFM_EXPECTED_HEAD: 3ecbb83c44aa0ee4f949ccb5a8ebe8212895dd2c
  KFM_EXPECTED_TREE: 90ff082763132ab5d71dab8825bac55c7d4d9e7f
  KFM_EXPECTED_DOC_BLOB: 64acc394aea093128478ed4efd5ae233ca617cee
  KFM_EXPECTED_STRICT_TEST_BLOB: 29e80df6fd0854aee794e09900e15b67a5ac1afa
  KFM_CONTENT_LENGTH_TEST_BLOB: 7c45d3085f9c3c08101395eeaa21bdc8af301f0e
  KFM_FETCH_HELPER_BLOB: 40498bd7be4318e43615c2a68713c6c43439308c
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary writer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve patch script and check out exact repair cursor
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/tmp_repository_control_landing_repair.py /tmp/landing_repair.py
          git fetch origin "refs/heads/${KFM_TARGET_BRANCH}:refs/remotes/origin/${KFM_TARGET_BRANCH}"
          git checkout -B "${KFM_TARGET_BRANCH}" "refs/remotes/origin/${KFM_TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${KFM_EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^{tree})" = "${KFM_EXPECTED_TREE}"
          test "$(git rev-parse HEAD:docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md)" = "${KFM_EXPECTED_DOC_BLOB}"
          test "$(git rev-parse HEAD:tests/validators/test_repository_control_strict_input.py)" = "${KFM_EXPECTED_STRICT_TEST_BLOB}"
          test "$(git rev-parse HEAD:tests/validators/test_repository_control_content_length.py)" = "${KFM_CONTENT_LENGTH_TEST_BLOB}"
          test "$(git rev-parse HEAD:tools/validators/repository_control/fetch_bounded_issue_comments.py)" = "${KFM_FETCH_HELPER_BLOB}"

      - name: Apply exact two-file repair
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/landing_repair.py
          git diff --check
          git diff --name-only | LC_ALL=C sort > /tmp/actual-paths.txt
          printf '%s\n' \
            docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md \
            tests/validators/test_repository_control_strict_input.py \
            > /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          test "$(git rev-parse HEAD:tests/validators/test_repository_control_content_length.py)" = "${KFM_CONTENT_LENGTH_TEST_BLOB}"
          test "$(git rev-parse HEAD:tools/validators/repository_control/fetch_bounded_issue_comments.py)" = "${KFM_FETCH_HELPER_BLOB}"

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run focused repair validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/validators/repository_control/fetch_bounded_issue_comments.py \
            tests/validators/test_repository_control_content_length.py \
            tests/validators/test_repository_control_input_bounds.py \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py
          python -m pytest \
            tests/validators/test_repository_control_content_length.py \
            tests/validators/test_repository_control_input_bounds.py \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py \
            -q
          make validator-registry-check
          make schemas
          make workflow-security

      - name: Commit and non-force push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md \
            tests/validators/test_repository_control_strict_input.py
          git diff --cached --name-only | LC_ALL=C sort > /tmp/staged-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/staged-paths.txt
          git commit -m "docs(control): make composite landing state neutral"
          test "$(git rev-parse HEAD^)" = "${KFM_EXPECTED_HEAD}"
          git push origin "HEAD:refs/heads/${KFM_TARGET_BRANCH}"
          {
            echo '### Landing-currentness repair'
            echo
            echo "- Target branch: \`${KFM_TARGET_BRANCH}\`."
            echo "- Previous head: \`${KFM_EXPECTED_HEAD}\`."
            echo "- New head: \`$(git rev-parse HEAD)\`."
            echo "- New tree: \`$(git rev-parse HEAD^{tree})\`."
            echo "- Document blob: \`$(git rev-parse HEAD:docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md)\`."
            echo "- Strict-input test blob: \`$(git rev-parse HEAD:tests/validators/test_repository_control_strict_input.py)\`."
            echo '- Runtime helper and direct Content-Length regression blobs remained unchanged.'
            echo '- Focused tests, validator registry, schemas, and workflow security passed before push.'
          } >> "${GITHUB_STEP_SUMMARY}"

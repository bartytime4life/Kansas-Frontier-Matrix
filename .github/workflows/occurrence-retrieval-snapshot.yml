# Validate the fixture-only eBird/GBIF occurrence retrieval snapshot profile.
#
# Authority boundary:
# - This workflow reads synthetic repository fixtures only.
# - It performs no network request, async job submission, source activation,
#   evidence resolution, policy decision, lifecycle promotion, release,
#   deployment, publication, or write to governed data stores.
name: occurrence-retrieval-snapshot

"on":
  pull_request:
    paths:
      - ".github/workflows/occurrence-retrieval-snapshot.yml"
      - "contracts/source/occurrence_retrieval_snapshot.md"
      - "schemas/contracts/v1/source/occurrence_retrieval_snapshot.schema.json"
      - "fixtures/contracts/v1/source/occurrence_retrieval_snapshot/**"
      - "tools/validators/validate_occurrence_retrieval_snapshot.py"
      - "tests/validators/test_validate_occurrence_retrieval_snapshot.py"
      - "data/receipts/generated/genrec-occurrence-retrieval-snapshot-20260805.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/occurrence-retrieval-snapshot.yml"
      - "contracts/source/occurrence_retrieval_snapshot.md"
      - "schemas/contracts/v1/source/occurrence_retrieval_snapshot.schema.json"
      - "fixtures/contracts/v1/source/occurrence_retrieval_snapshot/**"
      - "tools/validators/validate_occurrence_retrieval_snapshot.py"
      - "tests/validators/test_validate_occurrence_retrieval_snapshot.py"
      - "data/receipts/generated/genrec-occurrence-retrieval-snapshot-20260805.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: occurrence-retrieval-snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: occurrence-retrieval-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out bounded fixture profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install declared test dependencies
        run: python -m pip install --no-input -e ".[test]"

      - name: Run focused semantic tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/validators/test_validate_occurrence_retrieval_snapshot.py

      - name: Replay exact fixture polarity
        run: >-
          python tools/validators/validate_occurrence_retrieval_snapshot.py
          --fixtures

      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-occurrence-retrieval-snapshot-20260805.json
          --repo-root .

      - name: Record bounded trust result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Occurrence retrieval snapshot status

          This job validates synthetic retrieval intent, query snapshots,
          sampling-support declarations, deterministic identity, and append-only
          transfer-state history for eBird and GBIF fixture profiles.

          A green result does not establish current source terms, source
          activation, a real transfer, occurrence or absence truth,
          EvidenceBundle closure, policy approval, release, deployment, or
          publication.
          EOF

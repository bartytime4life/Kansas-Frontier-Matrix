name: renderer-binding-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/renderer-binding-assessment.yml"
      - "contracts/map/renderer_binding_assessment.md"
      - "schemas/contracts/v1/map/renderer_binding_assessment.schema.json"
      - "fixtures/contracts/v1/map/renderer_binding_assessment/**"
      - "tools/validators/map/validate_renderer_binding_assessment.py"
      - "tests/validators/map/test_validate_renderer_binding_assessment.py"
      - "docs/intake/exploratory/pass-20-renderer-binding-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass20-renderer-binding-assessment-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/renderer-binding-assessment.yml"
      - "contracts/map/renderer_binding_assessment.md"
      - "schemas/contracts/v1/map/renderer_binding_assessment.schema.json"
      - "fixtures/contracts/v1/map/renderer_binding_assessment/**"
      - "tools/validators/map/validate_renderer_binding_assessment.py"
      - "tests/validators/map/test_validate_renderer_binding_assessment.py"
      - "docs/intake/exploratory/pass-20-renderer-binding-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass20-renderer-binding-assessment-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-binding-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-renderer-binding-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/map/validate_renderer_binding_assessment.py tests/validators/map/test_validate_renderer_binding_assessment.py
          python -m unittest tests.validators.map.test_validate_renderer_binding_assessment --verbose
          python tools/validators/map/validate_renderer_binding_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass20-renderer-binding-assessment-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Renderer binding assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only renderer, layer refs, delivery membrane, trust closure, interaction, review, content identity, and non-authority coherence."
            echo "- Boundary: no reference resolution, store access, artifact or signature verification, registry write, renderer registration, policy or review decision, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate a closed synthetic tile-delivery strategy assessment.
#
# This workflow performs no network request, service activation, artifact
# hosting, database query, cache mutation, release, deployment, or publication.
name: tile-delivery-strategy-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/tile-delivery-strategy-assessment.yml"
      - "contracts/release/tile_delivery_strategy_assessment.md"
      - "schemas/contracts/v1/release/tile_delivery_strategy_assessment.schema.json"
      - "fixtures/contracts/v1/release/tile_delivery_strategy_assessment/**"
      - "tools/validators/release/validate_tile_delivery_strategy_assessment.py"
      - "tests/release/test_tile_delivery_strategy_assessment.py"
      - "docs/intake/exploratory/tile-delivery-strategy-assessment-source-map.md"
      - "data/receipts/generated/genrec-tile-delivery-strategy-assessment-20260812.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tile-delivery-strategy-assessment.yml"
      - "contracts/release/tile_delivery_strategy_assessment.md"
      - "schemas/contracts/v1/release/tile_delivery_strategy_assessment.schema.json"
      - "fixtures/contracts/v1/release/tile_delivery_strategy_assessment/**"
      - "tools/validators/release/validate_tile_delivery_strategy_assessment.py"
      - "tests/release/test_tile_delivery_strategy_assessment.py"
      - "docs/intake/exploratory/tile-delivery-strategy-assessment-source-map.md"
      - "data/receipts/generated/genrec-tile-delivery-strategy-assessment-20260812.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tile-delivery-strategy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: tile-delivery-strategy-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out bounded fixture profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install declared test dependencies
        run: python -m pip install --no-input -e ".[test]"

      - name: Run focused semantic tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/release/test_tile_delivery_strategy_assessment.py

      - name: Replay exact fixture polarity
        run: >-
          python
          tools/validators/release/validate_tile_delivery_strategy_assessment.py
          --fixtures

      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-tile-delivery-strategy-assessment-20260812.json
          --repo-root .

      - name: Record bounded trust result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Tile delivery strategy assessment

          This job validates a synthetic declaration that distinguishes
          immutable PMTiles, mutable XYZ, Martin/PostGIS mediation, and local
          MBTiles.

          A green result does not verify artifact bytes, a service, database,
          cache, rights, sensitivity, performance, release, deployment,
          publication, or public use.
          EOF

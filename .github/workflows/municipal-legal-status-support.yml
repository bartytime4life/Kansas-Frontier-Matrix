# Validate the proposed municipal legal-status support envelope.
# Synthetic, no-live-source, and no-geometry. A green result proves only the
# bounded schema/fixture/validator invariants in this slice.
name: municipal-legal-status-support

"on":
  pull_request:
    paths:
      - ".github/workflows/municipal-legal-status-support.yml"
      - "contracts/domains/settlements-infrastructure/municipal-legal-status-support.md"
      - "schemas/contracts/v1/domains/settlements-infrastructure/municipal-legal-status-support.schema.json"
      - "fixtures/contracts/v1/domains/settlements-infrastructure/municipal_legal_status_support/**"
      - "tools/validators/validate_municipal_legal_status_support.py"
      - "tests/validators/test_validate_municipal_legal_status_support.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/municipal-legal-status-support.yml"
      - "contracts/domains/settlements-infrastructure/municipal-legal-status-support.md"
      - "schemas/contracts/v1/domains/settlements-infrastructure/municipal-legal-status-support.schema.json"
      - "fixtures/contracts/v1/domains/settlements-infrastructure/municipal_legal_status_support/**"
      - "tools/validators/validate_municipal_legal_status_support.py"
      - "tests/validators/test_validate_municipal_legal_status_support.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: municipal-legal-status-support-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-municipal-legal-status-support
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover             --start-directory tests/validators             --pattern 'test_validate_municipal_legal_status_support.py'             --verbose

      - name: Validate exact fixture polarity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_municipal_legal_status_support.py --fixtures

      - name: Validate schema and fixture JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema_path=Path("schemas/contracts/v1/domains/settlements-infrastructure/municipal-legal-status-support.schema.json")
          Draft202012Validator.check_schema(json.loads(schema_path.read_text(encoding="utf-8")))
          profile_path=Path("fixtures/contracts/v1/domains/settlements-infrastructure/municipal_legal_status_support/fixture_profile.json")
          json.loads(profile_path.read_text(encoding="utf-8"))
          print("CONFIRMED: schema and synthetic fixture profile parsed.")
          PY

      - name: Record bounded validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Municipal legal-status support"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic Municipality/CensusPlace separation, administrative legal evidence, aggregate Census context, temporal support, and finite outcomes."
            echo "- Network posture: no live legal record, Census source, evidence store, policy engine, release system, or public endpoint."
            echo "- Geometry posture: no coordinate, address, parcel, facility, infrastructure, private-property, or protected-location fields."
            echo "- Boundary: green does not prove real legal status, source admission/currentness/rights, evidence closure, policy/review approval, release, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

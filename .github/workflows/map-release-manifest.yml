# Validate the fixture-first MapReleaseManifest closure profile.
#
# A green result proves bounded synthetic shape and polarity only. It performs
# no artifact fetch, source activation, evidence or policy resolution, release,
# cache invalidation, rollback execution, deployment, or publication.
name: map-release-manifest

"on":
  pull_request:
    paths:
      - ".github/workflows/map-release-manifest.yml"
      - "contracts/release/map_release_manifest.md"
      - "contracts/map/map_release_manifest/README.md"
      - "schemas/contracts/v1/map/README.md"
      - "schemas/contracts/v1/map/map_release_manifest.schema.json"
      - "fixtures/contracts/v1/map/map_release_manifest/**"
      - "tools/validators/map/validate_map_release_manifest.py"
      - "tests/map/test_map_release_manifest.py"
      - "data/receipts/generated/genrec-map-release-manifest-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-release-manifest.yml"
      - "contracts/release/map_release_manifest.md"
      - "contracts/map/map_release_manifest/README.md"
      - "schemas/contracts/v1/map/README.md"
      - "schemas/contracts/v1/map/map_release_manifest.schema.json"
      - "fixtures/contracts/v1/map/map_release_manifest/**"
      - "tools/validators/map/validate_map_release_manifest.py"
      - "tests/map/test_map_release_manifest.py"
      - "data/receipts/generated/genrec-map-release-manifest-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-release-manifest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-map-release-manifest:
    name: validate-map-release-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic no-network tests
        run: |
          set -euo pipefail
          python -m unittest tests.map.test_map_release_manifest --verbose

      - name: Validate reviewed fixture polarity
        run: |
          set -euo pipefail
          python tools/validators/map/validate_map_release_manifest.py --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-map-release-manifest-20260807.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### MapReleaseManifest fixture profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: deterministic identity, immutable artifact metadata, catalog/evidence/policy/review/attestation references, rights/sensitivity posture, public-boundary denial, correction, cache invalidation, and rollback closure."
            echo "- Boundary: fixture-only and PROPOSED_INACTIVE; no artifact load, evidence resolution, policy evaluation, release authorization, cache mutation, rollback execution, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

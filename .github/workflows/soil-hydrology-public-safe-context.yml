# Validate the fixture-only Soil-Hydrology public-safe context candidate profile.
name: soil-hydrology-public-safe-context

"on":
  pull_request:
    paths:
      - ".github/workflows/soil-hydrology-public-safe-context.yml"
      - "contracts/cross_domain/soil_hydrology/**"
      - "fixtures/contracts/v1/joins/soil_hydrology_public_safe_context/**"
      - "tests/cross_domain/soil_hydrology/**"
      - "tools/validators/cross_domain/soil_hydrology/**"
      - "contracts/joins/cross_lane_join_assessment.md"
      - "schemas/contracts/v1/joins/cross_lane_join_assessment.schema.json"
      - "tools/joins/join_candidates.py"
      - "tests/joins/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soil-hydrology-public-safe-context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run generic cross-lane fixture matrix
        run: python tools/joins/join_candidates.py --fixtures
      - name: Run Soil-Hydrology pair fixture matrix
        run: python tools/validators/cross_domain/soil_hydrology/validate_public_safe_context.py --fixtures
      - name: Run focused regression tests
        run: >-
          python -m pytest
          tests/joins/test_join_candidates.py
          tests/cross_domain/soil_hydrology/test_public_safe_context.py
          -q --strict-config --strict-markers
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Soil-Hydrology public-safe context candidate profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic references and metadata only; no coordinate/geometry bytes, live source, network, or lifecycle write."
            echo "- Boundary: the profile is context-only and non-emergency; ALLOW remains CANDIDATE_RELATION and grants no hydrologic truth or publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

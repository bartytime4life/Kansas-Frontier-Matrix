# Validate the bounded KFM OpenLineage RunEvent projection profile.
# A green result proves fixture/schema/semantic conformance only. It does not
# export telemetry or grant evidence, policy, review, lifecycle, release,
# deployment, publication, or public-use authority.
name: openlineage-run-event-projection

"on":
  pull_request:
    paths:
      - ".github/workflows/openlineage-run-event-projection.yml"
      - "contracts/telemetry/openlineage_run_event_projection.md"
      - "schemas/contracts/v1/telemetry/**"
      - "schemas/contracts/v1/runtime/run_receipt.schema.json"
      - "fixtures/contracts/v1/telemetry/openlineage_run_event_projection/**"
      - "tools/generators/telemetry/**"
      - "tools/validators/telemetry/**"
      - "tools/validators/_common/local_resolver.py"
      - "tests/validators/telemetry/**"
      - "packages/hashing/**"
      - "docs/intake/exploratory/new-ideas-4-openlineage-run-event-projection-source-map.md"
      - "data/receipts/generated/genrec-openlineage-run-event-projection-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/openlineage-run-event-projection.yml"
      - "contracts/telemetry/openlineage_run_event_projection.md"
      - "schemas/contracts/v1/telemetry/**"
      - "schemas/contracts/v1/runtime/run_receipt.schema.json"
      - "fixtures/contracts/v1/telemetry/openlineage_run_event_projection/**"
      - "tools/generators/telemetry/**"
      - "tools/validators/telemetry/**"
      - "tools/validators/_common/local_resolver.py"
      - "tests/validators/telemetry/**"
      - "packages/hashing/**"
      - "docs/intake/exploratory/new-ideas-4-openlineage-run-event-projection-source-map.md"
      - "data/receipts/generated/genrec-openlineage-run-event-projection-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openlineage-run-event-projection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-openlineage-run-event-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out projection boundaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic no-network projection tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/telemetry \
            --pattern 'test_openlineage_run_event_projection.py' \
            --verbose

      - name: Run exact fixture polarity validator
        run: |
          set -euo pipefail
          python tools/validators/telemetry/validate_openlineage_run_event_projection.py \
            --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-openlineage-run-event-projection-20260807.json \
            --repo-root .

      - name: Record projection trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### OpenLineage projection trust boundary"
            echo "- Scope: deterministic in-memory RunEvent-shaped projection from a canonical RunReceipt plus receipt-safe dataset and EvidenceBundle-resolution summaries."
            echo "- Network/export: forbidden; no endpoint, exporter, sink, credential, or event posting is configured."
            echo "- Authority: none; the event is a telemetry carrier and never evidence, policy, review, promotion, release, deployment, publication, or public-use authority."
            echo "- Public gate: requires PUBLISHED public-safe datasets and PUBLISHED telemetry/public-use-allowed evidence summaries."
            echo "- Non-effects: no source admission, lifecycle mutation, canonical write, release, deployment, publication, or public route."
          } >> "$GITHUB_STEP_SUMMARY"

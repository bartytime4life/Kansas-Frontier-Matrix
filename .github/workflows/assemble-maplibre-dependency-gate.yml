name: Assemble MapLibre dependency gate payload

on:
  push:
    branches:
      - build/maplibre-6-4-0-integrity-2906

permissions:
  contents: write

concurrency:
  group: assemble-maplibre-dependency-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out transfer commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          transfer_dir=.kfm-transfer/maplibre-dependency-gate
          payload_b64="$RUNNER_TEMP/maplibre-dependency-gate.tar.xz.b64"
          payload="$RUNNER_TEMP/maplibre-dependency-gate.tar.xz"
          stage="$RUNNER_TEMP/maplibre-dependency-gate-stage"

          cat "$transfer_dir"/chunk.* > "$payload_b64"
          printf '%s  %s\n' \
            '39bbed693f7fabf01de11ba3d84b1febf74d33f4391df0afe80833ff43a5312c' \
            "$payload_b64" | sha256sum --check --strict

          base64 --decode "$payload_b64" > "$payload"
          printf '%s  %s\n' \
            '499365e4363e323cd63e31d5ed12092d36589810f567034f91c15ee24622e86d' \
            "$payload" | sha256sum --check --strict

          rm -rf "$stage"
          mkdir -p "$stage"
          tar -xJf "$payload" -C "$stage"

          expected_paths="$RUNNER_TEMP/maplibre-dependency-gate.expected"
          actual_paths="$RUNNER_TEMP/maplibre-dependency-gate.actual"
          cat > "$expected_paths" <<'EOF'
          pnpm-lock.yaml
          tests/maplibre/test_validate_dependency_integrity.py
          tools/validators/maplibre/validate_dependency_integrity.py
          EOF
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > "$actual_paths"
          diff -u "$expected_paths" "$actual_paths"

          printf '%s  %s\n' \
            'b8ccf9728d91755bb92e22e8fdda0f9e6557453a204382649e56208381f31e29' \
            "$stage/pnpm-lock.yaml" | sha256sum --check --strict
          printf '%s  %s\n' \
            '88a905321a9c303aac7f02156b09660bad49e90e704c141e78b7b2ccb71f6efd' \
            "$stage/tools/validators/maplibre/validate_dependency_integrity.py" | sha256sum --check --strict
          printf '%s  %s\n' \
            '3ed7272ba36c8e7d84d28cf5e8a734ead27172adb46a3822e3cbf4d7ba1209d1' \
            "$stage/tests/maplibre/test_validate_dependency_integrity.py" | sha256sum --check --strict

          install -m 0644 "$stage/pnpm-lock.yaml" pnpm-lock.yaml
          install -D -m 0644 \
            "$stage/tools/validators/maplibre/validate_dependency_integrity.py" \
            tools/validators/maplibre/validate_dependency_integrity.py
          install -D -m 0644 \
            "$stage/tests/maplibre/test_validate_dependency_integrity.py" \
            tests/maplibre/test_validate_dependency_integrity.py

      - name: Remove transfer-only material and commit assembled files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kfm-transfer/maplibre-dependency-gate
          rm -f .github/workflows/assemble-maplibre-dependency-gate.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'build(maplibre): assemble verified dependency gate payload'
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Temporary branch-only assembly workflow. The final implementation commit
# removes this workflow and its staged archive before opening the pull request.
name: bootstrap-composed-claim-dependency-closure

"on":
  push:
    branches:
      - agent/composed-claim-dependency-closure-20260806
    paths:
      - ".github/workflows/bootstrap-composed-claim-dependency-closure.yml"
      - ".kfm-bootstrap/composed-claim-dependency-closure-20260806.tar.gz.b64.part-*"

permissions:
  contents: write

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify and expand the staged bundle
        shell: bash
        run: |
          set -euo pipefail
          archive_prefix=".kfm-bootstrap/composed-claim-dependency-closure-20260806.tar.gz.b64.part-"
          archive="${RUNNER_TEMP}/composed-claim-dependency-closure-20260806.tar.gz"
          test -f "${archive_prefix}00"
          cat "${archive_prefix}"* | base64 --decode > "$archive"
          echo "bec70240d403305b4444f3a6b0b80ed9518b6617d509c9cafffd73c8218b0de1  $archive" | sha256sum --check --strict -

          python - "$archive" <<'PY'
          from __future__ import annotations
          import sys
          import tarfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]
          expected = {
              ".github/workflows/composed-claim-dependency-closure.yml",
              "contracts/evidence/composed_claim_dependency_closure.md",
              "data/receipts/generated/genrec-composed-claim-dependency-closure-20260806.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/README.md",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/invalid/expected_findings_manifest.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/invalid/invalid_fail_closed.expected_error.txt",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/invalid/invalid_fail_closed.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/invalid/invalid_publication_authority.expected_error.txt",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/invalid/invalid_publication_authority.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/invalid/invalid_unknown_outcome.expected_error.txt",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/invalid/invalid_unknown_outcome.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/expected_findings_manifest.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_alternative_role_coverage.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_closure_id.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_graph_hash.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_internal_lifecycle_path.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_multiple_alternative_groups.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_outcome.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_reason_codes.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_resolved_roles.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_resolved_spec_hash.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_role_order.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_spec_hash.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_time_range.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/semantic_invalid/semantic_invalid_unknown_group_role.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/valid/valid_abstain_alternative_unresolved.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/valid/valid_abstain_required_unresolved.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/valid/valid_deny_alternative_denied.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/valid/valid_deny_required_denied.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/valid/valid_error_dependency_error.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/valid/valid_error_mutual_exclusion.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/valid/valid_qualified_optional_unresolved.json",
              "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/valid/valid_supported_required_and_alternative.json",
              "schemas/contracts/v1/evidence/composed_claim_dependency_closure.schema.json",
              "tests/validators/test_validate_composed_claim_dependency_closure.py",
              "tools/validators/validate_composed_claim_dependency_closure.py",
          }
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              actual = {member.name for member in members}
              if actual != expected:
                  raise SystemExit(f"archive path mismatch: {sorted(actual ^ expected)}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if member.isdir() or member.issym() or member.islnk() or path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive member: {member.name}")
              bundle.extractall(".", filter="data")
          PY

          rm -rf ".kfm-bootstrap" ".github/workflows/bootstrap-composed-claim-dependency-closure.yml"

      - name: Install declared test dependencies
        run: python -m pip install --no-input -e ".[test]"

      - name: Run focused validation before committing
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider tests/validators/test_validate_composed_claim_dependency_closure.py
          python tools/validators/validate_composed_claim_dependency_closure.py --fixtures
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-composed-claim-dependency-closure-20260806.json --repo-root .
          python -m py_compile tools/validators/validate_composed_claim_dependency_closure.py tests/validators/test_validate_composed_claim_dependency_closure.py
          find tools tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

      - name: Commit the assembled non-workflow implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kfm-implementation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "43"
          git commit -m "feat(evidence): add composed-claim dependency closure"
          git push origin "HEAD:${GITHUB_REF_NAME}"

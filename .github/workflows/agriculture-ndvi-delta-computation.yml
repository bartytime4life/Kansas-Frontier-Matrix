# Validate deterministic, fixture/captured-input NDVI delta computation.
name: agriculture-ndvi-delta-computation

"on":
  pull_request:
    paths:
      - ".github/workflows/agriculture-ndvi-delta-computation.yml"
      - "contracts/domains/agriculture/ndvi_delta_computation.md"
      - "schemas/contracts/v1/domains/agriculture/ndvi_delta_computation.schema.json"
      - "tools/generators/compute_ndvi_delta.py"
      - "fixtures/domains/agriculture/ndvi_delta_computation/**"
      - "tests/domains/agriculture/test_ndvi_delta_computation.py"
      - "docs/intake/exploratory/pass-32-ndvi-delta-computation-source-map.md"
      - "data/receipts/generated/genrec-pass32-ndvi-delta-computation-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agriculture-ndvi-delta-computation.yml"
      - "contracts/domains/agriculture/ndvi_delta_computation.md"
      - "schemas/contracts/v1/domains/agriculture/ndvi_delta_computation.schema.json"
      - "tools/generators/compute_ndvi_delta.py"
      - "fixtures/domains/agriculture/ndvi_delta_computation/**"
      - "tests/domains/agriculture/test_ndvi_delta_computation.py"
      - "docs/intake/exploratory/pass-32-ndvi-delta-computation-source-map.md"
      - "data/receipts/generated/genrec-pass32-ndvi-delta-computation-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agriculture-ndvi-delta-computation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-ndvi-delta-computation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic computation tests
        run: python -m pytest tests/domains/agriculture/test_ndvi_delta_computation.py -q --strict-config --strict-markers

      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-pass32-ndvi-delta-computation-20260810.json
          --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### NDVI delta computation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: strict local JSON, integer NDVI arithmetic, cloud filtering, medians, thresholds, suppression, and deterministic digests."
            echo "- Boundary: no network, raster reads, connected-component analysis, evidence closure, policy, promotion, release, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

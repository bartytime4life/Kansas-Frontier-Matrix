# Validate the additive fixture-only LayerManifest profile.
name: layer-manifest

"on":
  pull_request:
    paths:
      - ".github/workflows/layer-manifest.yml"
      - "contracts/data/layer_manifest.md"
      - "schemas/contracts/v1/data/layer_manifest.schema.json"
      - "fixtures/data/layer_manifest/**"
      - "tools/validators/data/**"
      - "tests/validators/test_validate_layer_manifest.py"
      - "tools/validators/validator_registry.json"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass7-layer-manifest-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/layer-manifest.yml"
      - "contracts/data/layer_manifest.md"
      - "schemas/contracts/v1/data/layer_manifest.schema.json"
      - "fixtures/data/layer_manifest/**"
      - "tools/validators/data/**"
      - "tests/validators/test_validate_layer_manifest.py"
      - "tools/validators/validator_registry.json"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass7-layer-manifest-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layer-manifest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test
      - name: Validate schema, fixtures, semantics, and registry wiring
        run: |
          set -euo pipefail
          python -m unittest tests.validators.test_validate_layer_manifest --verbose
          python tools/validators/data/validate_layer_manifest.py --fixtures
          python tools/validate_all.py --validate-registry
          python tools/validate_all.py \
            --profile release-dry-run \
            --validator layer-manifest \
            --quiet
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass7-layer-manifest-20260808.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### LayerManifest fixture profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: legacy compatibility plus a closed deterministic candidate profile."
            echo "- Boundary: no reference resolution, artifact/signature verification, policy/review execution, layer registration, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

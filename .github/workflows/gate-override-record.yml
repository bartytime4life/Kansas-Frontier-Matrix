name: gate-override-record

"on":
  pull_request:
    paths:
      - ".github/workflows/gate-override-record.yml"
      - "contracts/governance/gate_override_record.md"
      - "schemas/contracts/v1/governance/gate_override_record.schema.json"
      - "fixtures/contracts/v1/governance/gate_override_record/**"
      - "tools/validators/governance/gate_override_record_core.py"
      - "tools/validators/governance/validate_gate_override_record.py"
      - "tests/validators/governance/test_validate_gate_override_record.py"
      - "docs/intake/exploratory/pass-3-gate-override-record-source-map.md"
      - "data/receipts/generated/genrec-pass3-gate-override-record-20260808.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gate-override-record.yml"
      - "contracts/governance/gate_override_record.md"
      - "schemas/contracts/v1/governance/gate_override_record.schema.json"
      - "fixtures/contracts/v1/governance/gate_override_record/**"
      - "tools/validators/governance/gate_override_record_core.py"
      - "tools/validators/governance/validate_gate_override_record.py"
      - "tests/validators/governance/test_validate_gate_override_record.py"
      - "docs/intake/exploratory/pass-3-gate-override-record-source-map.md"
      - "data/receipts/generated/genrec-pass3-gate-override-record-20260808.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-override-record-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-gate-override-record
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema, hashing, and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic no-network tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/governance \
            --pattern 'test_validate_gate_override_record.py' \
            --verbose

      - name: Replay exact fixture outcomes and findings
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/governance/validate_gate_override_record.py \
            --fixtures

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass3-gate-override-record-20260808.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Gate override record candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only override-record shape, identity, scope, actor separation, time, remediation, rollback, support, and deterministic fixture attestation."
            echo "- Outcomes: PASS, HOLD, DENY, and ERROR with stable finding codes."
            echo "- Boundary: PASS does not authenticate actors, approve review or policy, bypass a gate, or change repository settings."
            echo "- Non-effects: no promotion, release, deployment, publication, source activation, or lifecycle write."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the inactive, fixture-only map-build sustainability telemetry profile.
name: map-build-sustainability-telemetry

"on":
  pull_request:
    paths:
      - ".github/workflows/map-build-sustainability-telemetry.yml"
      - "contracts/telemetry/map_build_sustainability.md"
      - "contracts/telemetry/README.md"
      - "schemas/contracts/v1/telemetry/map_build_sustainability.schema.json"
      - "schemas/contracts/v1/telemetry/README.md"
      - "fixtures/contracts/v1/telemetry/map_build_sustainability/**"
      - "tools/validators/telemetry/validate_map_build_sustainability.py"
      - "tools/validators/telemetry/README.md"
      - "tests/validators/telemetry/test_map_build_sustainability.py"
      - "tests/validators/telemetry/README.md"
      - "docs/intake/exploratory/pass-18-map-build-sustainability-source-map.md"
      - "docs/dashboards/observability/energy-carbon-footprint.md"
      - "data/receipts/generated/genrec-map-build-sustainability-telemetry-stable-20260811.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-build-sustainability-telemetry.yml"
      - "contracts/telemetry/map_build_sustainability.md"
      - "contracts/telemetry/README.md"
      - "schemas/contracts/v1/telemetry/map_build_sustainability.schema.json"
      - "schemas/contracts/v1/telemetry/README.md"
      - "fixtures/contracts/v1/telemetry/map_build_sustainability/**"
      - "tools/validators/telemetry/validate_map_build_sustainability.py"
      - "tools/validators/telemetry/README.md"
      - "tests/validators/telemetry/test_map_build_sustainability.py"
      - "tests/validators/telemetry/README.md"
      - "docs/intake/exploratory/pass-18-map-build-sustainability-source-map.md"
      - "docs/dashboards/observability/energy-carbon-footprint.md"
      - "data/receipts/generated/genrec-map-build-sustainability-telemetry-stable-20260811.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-build-sustainability-telemetry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-map-build-sustainability-telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test

      - name: Run deterministic no-network unit and fixture replay
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/telemetry \
            --pattern 'test_map_build_sustainability.py' \
            --verbose
          python tools/validators/telemetry/validate_map_build_sustainability.py \
            --fixtures

      - name: Validate current stable-packet authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-map-build-sustainability-telemetry-stable-20260811.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Map-build sustainability telemetry fixture profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic map-build binding, decimal energy/carbon estimates, explicit method/factor versions, uncertainty, arithmetic consistency, safe abstention, and exact fixture polarity."
            echo "- Boundary: PASS does not measure a build, contact a provider, establish mapped environmental truth, select a methodology, set a threshold, decide policy/review/release, deploy, publish, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"

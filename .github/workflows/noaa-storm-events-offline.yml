name: noaa-storm-events-offline
on:
  pull_request:
    paths:
      - 'connectors/noaa/src/noaa/storm_events.py'
      - 'connectors/noaa/tests/test_storm_events.py'
      - '.github/workflows/noaa-storm-events-offline.yml'
  push:
    branches: [main]
    paths:
      - 'connectors/noaa/src/noaa/storm_events.py'
      - 'connectors/noaa/tests/test_storm_events.py'
      - '.github/workflows/noaa-storm-events-offline.yml'
permissions:
  contents: read
concurrency:
  group: noaa-storm-events-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Run standard-library-only synthetic tests
        run: python -m unittest discover -s connectors/noaa/tests -p 'test_storm_events.py' -v
      - name: Record evidence boundary
        if: always()
        run: |
          echo 'Offline synthetic NCEI Storm Events details-file parser checks only. No provider fetch, source activation, finalization review, narrative sensitivity review, source admission, capture completeness, active Site integration, release, or deployment proof.' >> "$GITHUB_STEP_SUMMARY"

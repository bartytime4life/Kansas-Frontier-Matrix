# Validation driver only: source-under-test is explicit, not github.sha.
name: m18-temporal-ci-followup-validation
"on":
  push:
    branches: [agent/m18-temporal-validation-20260905]
    paths: [.github/workflows/m18-temporal-ci-followup-validation.yml]
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  COREPACK_ENABLE_STRICT: "1"
  KFM_NO_NETWORK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  TZ: UTC

jobs:
  explorer:
    name: temporal-explorer-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: old-node-same-source
            node: "22.13.1"
          - label: candidate
            node: "22.23.2"
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8fbfc9a7ec90d2b99fece580029197b19211cb78
          persist-credentials: false
          fetch-depth: 1
      - name: Assert source and workflow bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8fbfc9a7ec90d2b99fece580029197b19211cb78
          git log -1 --format='%H %T'
          printf '%s\n' 'b03cad44edcb710b19641b16d6b0db408c64711f3ac280fb5e65b954d0d79520  .github/workflows/temporal-view-state-validation.yml' | sha256sum --check
          sha256sum package.json pnpm-workspace.yaml pnpm-lock.yaml apps/explorer-web/package.json apps/explorer-web/tsconfig.json
      - name: Set up the compared Node patch
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable pinned workspace package manager
        id: bootstrap
        run: |
          set -euo pipefail
          node --version
          corepack --version
          corepack enable
          pnpm --version
      - name: Install locked Explorer dependencies
        id: install
        run: pnpm install --frozen-lockfile --filter explorer-web...
      - name: Native strict Explorer build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter explorer-web build
      - name: All three temporal and workspace test files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/explorer-web
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            tests/temporal-kernel.test.ts \
            tests/temporal-boundary-regression.test.ts \
            tests/workspace-context.test.ts
      - name: Native complete Explorer unit lane
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter explorer-web test:unit
      - name: Native complete Explorer browser lane
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter explorer-web test:browser
      - name: Preserve tracked source and dependency policy
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  python:
    name: temporal-python-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: prior-repair
            revision: b5bcc4d96e2959a499a77078a80fffbf06e6dd40
          - label: candidate
            revision: 8fbfc9a7ec90d2b99fece580029197b19211cb78
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact source
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          git log -1 --format='%H %T'
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install repository locked validation dependencies
        id: install
        run: python tools/ci/install_python_ci.py project-test
      - name: Workflow source contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.label == 'candidate' }}
        run: python -m pytest -q tests/ci/test_temporal_view_state_workflow.py
      - name: Both temporal Python regression modules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m unittest discover --start-directory tests/validators --pattern 'test_validate_temporal_view_state*.py' --verbose
      - name: Non-vacuous fixture profile
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/validators/validate_temporal_view_state.py --fixtures
      - name: Generic temporal schema discovery
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/schemas/test_common_contracts.py -k temporal_view_state
      - name: All common-contract schema fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/schemas/test_common_contracts.py
      - name: Existing evidence temporal compatibility and correction suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m unittest discover --start-directory tests/evidence --pattern 'test_evidence_temporal_posture_assessment.py' --verbose
      - name: Native workflow security validator
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/validators/governance/validate_workflow_security.py --format text
      - name: Native generated receipt integrity without approval claim
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.label == 'candidate' }}
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-m18-temporal-ci-closure-20260905.json
      - name: Preserve tracked source and historical receipts
        if: ${{ !cancelled() }}
        run: git diff --exit-code

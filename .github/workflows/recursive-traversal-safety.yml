name: recursive-traversal-safety

"on":
  pull_request:
    paths:
      - ".github/workflows/recursive-traversal-safety.yml"
      - "contracts/common/recursive_traversal_safety_assessment.md"
      - "schemas/contracts/v1/common/recursive_traversal_safety_assessment.schema.json"
      - "fixtures/contracts/v1/common/recursive_traversal_safety_assessment/**"
      - "tools/validators/validate_recursive_traversal_safety_assessment.py"
      - "tests/validators/test_validate_recursive_traversal_safety_assessment.py"
      - "docs/intake/exploratory/pass-18-recursive-traversal-safety-source-map.md"
      - "data/receipts/generated/genrec-pass18-recursive-traversal-safety-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/recursive-traversal-safety.yml"
      - "contracts/common/recursive_traversal_safety_assessment.md"
      - "schemas/contracts/v1/common/recursive_traversal_safety_assessment.schema.json"
      - "fixtures/contracts/v1/common/recursive_traversal_safety_assessment/**"
      - "tools/validators/validate_recursive_traversal_safety_assessment.py"
      - "tests/validators/test_validate_recursive_traversal_safety_assessment.py"
      - "docs/intake/exploratory/pass-18-recursive-traversal-safety-source-map.md"
      - "data/receipts/generated/genrec-pass18-recursive-traversal-safety-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recursive-traversal-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-recursive-traversal-safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/validate_recursive_traversal_safety_assessment.py tests/validators/test_validate_recursive_traversal_safety_assessment.py
          python -m unittest tests.validators.test_validate_recursive_traversal_safety_assessment --verbose
          python tools/validators/validate_recursive_traversal_safety_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-recursive-traversal-safety-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Recursive traversal safety candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only query and dialect references, termination declaration, finite depth/node/edge caps, explicit cycle handling, bounded observation fields, receipt reference, and deterministic identity."
            echo "- Boundary: no SQL text or query execution, database access, row or graph values, evidence resolution, termination proof, dialect certification, policy or review decision, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

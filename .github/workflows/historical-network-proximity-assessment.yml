name: historical-network-proximity-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/historical-network-proximity-assessment.yml"
      - "contracts/joins/README.md"
      - "contracts/joins/historical_network_proximity_assessment.md"
      - "schemas/contracts/v1/joins/historical_network_proximity_assessment.schema.json"
      - "fixtures/contracts/v1/joins/historical_network_proximity_assessment/**"
      - "tools/joins/historical_network_proximity.py"
      - "tests/joins/test_historical_network_proximity.py"
      - "docs/intake/exploratory/full-atlas-historical-network-proximity-source-map.md"
      - "data/receipts/generated/genrec-full-atlas-historical-network-proximity-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-network-proximity-assessment.yml"
      - "contracts/joins/README.md"
      - "contracts/joins/historical_network_proximity_assessment.md"
      - "schemas/contracts/v1/joins/historical_network_proximity_assessment.schema.json"
      - "fixtures/contracts/v1/joins/historical_network_proximity_assessment/**"
      - "tools/joins/historical_network_proximity.py"
      - "tests/joins/test_historical_network_proximity.py"
      - "docs/intake/exploratory/full-atlas-historical-network-proximity-source-map.md"
      - "data/receipts/generated/genrec-full-atlas-historical-network-proximity-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-network-proximity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-historical-network-proximity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/joins/historical_network_proximity.py tests/joins/test_historical_network_proximity.py
          python tests/joins/test_historical_network_proximity.py --verbose
          python tools/joins/historical_network_proximity.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-full-atlas-historical-network-proximity-20260811.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Historical network proximity assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic assertion refs, valid-time overlap, distance bands, per-side uncertainty, source roles, and finite interpretation parity."
            echo "- Boundary: no real coordinates, geometry execution, historical relationship, source admission, policy, review, release, tile, or publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

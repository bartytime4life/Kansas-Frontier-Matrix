name: public-staging
on:
  pull_request:
    branches: [review-base/public-staging-v7-20261018]
permissions:
  contents: read
concurrency:
  group: public-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: UTC
      SITES_BUILD_TIMEOUT: 8m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm run install:ci
      - run: npm run build
      - run: node_modules/.bin/tsc --noEmit
      - run: node --test tests/build-identity.test.mjs tests/public-boundary.test.mjs tests/public-profile.test.mjs tests/public-release.test.mjs tests/map-startup.test.mjs tests/workspace-help-navigation.test.mjs tests/workspace-map-navigation.test.mjs tests/public-mobile-css-build.test.mjs tests/godaddy-layout-port.test.mjs tests/inspection-panel.test.mjs tests/explorer-interface-refresh.test.mjs tests/topic-organization.test.mjs
      - run: node --test tests/public-staging-build.test.mjs
      - run: node_modules/.bin/eslint app/about/page.tsx app/api/build/route.ts app/public-route-policy.ts scripts/build-identity.mjs tests/build-identity.test.mjs tests/public-staging-build.test.mjs

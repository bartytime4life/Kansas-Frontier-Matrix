# Validate the proposed FrontierRouteTrustStatus projection and the pure
# Explorer adapter that consumes it. This workflow is fixture-only and
# non-publishing; it does not run policy, resolve evidence, or release routes.
name: frontier-route-trust-status

"on":
  pull_request:
    paths:
      - ".github/workflows/frontier-route-trust-status.yml"
      - "contracts/domains/roads-rail-trade/frontier_route_trust_status.md"
      - "schemas/contracts/v1/domains/roads-rail-trade/frontier_route_trust_status.schema.json"
      - "fixtures/domains/roads-rail-trade/frontier_route_trust_status/**"
      - "tools/validators/domains/roads-rail-trade/validate_frontier_route_trust_status.py"
      - "tests/validators/test_validate_frontier_route_trust_status.py"
      - "apps/explorer-web/src/features/domains/roads_rail_trade/layers.ts"
      - "apps/explorer-web/tests/frontier-routes-trust-overlay.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontier-route-trust-status.yml"
      - "contracts/domains/roads-rail-trade/frontier_route_trust_status.md"
      - "schemas/contracts/v1/domains/roads-rail-trade/frontier_route_trust_status.schema.json"
      - "fixtures/domains/roads-rail-trade/frontier_route_trust_status/**"
      - "tools/validators/domains/roads-rail-trade/validate_frontier_route_trust_status.py"
      - "tests/validators/test_validate_frontier_route_trust_status.py"
      - "apps/explorer-web/src/features/domains/roads_rail_trade/layers.ts"
      - "apps/explorer-web/tests/frontier-routes-trust-overlay.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-route-trust-status-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COREPACK_ENABLE_STRICT: "1"
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-frontier-route-trust-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate schema and exact fixture polarity
        run: python tools/validators/domains/roads-rail-trade/validate_frontier_route_trust_status.py --fixtures
      - name: Run focused Python contract tests
        run: python -m unittest -q tests.validators.test_validate_frontier_route_trust_status
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked workspace dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run focused Explorer trust-overlay tests
        run: pnpm --filter explorer-web exec vitest run tests/frontier-routes-trust-overlay.test.ts
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### FrontierRouteTrustStatus projection"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed schema, exact fixture polarity, audience separation, deterministic kfm_id joins, and fail-closed public visibility."
            echo "- Boundary: validation does not fetch routes, calculate policy, resolve EvidenceBundles, authenticate review, authorize release, promote lifecycle state, deploy, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

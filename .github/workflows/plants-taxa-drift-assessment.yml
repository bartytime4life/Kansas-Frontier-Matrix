name: plants-taxa-drift-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/plants-taxa-drift-assessment.yml"
      - "contracts/source/plants_taxa_drift_assessment.md"
      - "schemas/contracts/v1/source/plants_taxa_drift_assessment.schema.json"
      - "fixtures/contracts/v1/source/plants_taxa_drift_assessment/**"
      - "tools/validators/source/validate_plants_taxa_drift_assessment.py"
      - "tests/validators/test_validate_plants_taxa_drift_assessment.py"
      - "docs/intake/exploratory/pass-20-plants-taxa-drift-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass20-plants-taxa-drift-assessment-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/plants-taxa-drift-assessment.yml"
      - "contracts/source/plants_taxa_drift_assessment.md"
      - "schemas/contracts/v1/source/plants_taxa_drift_assessment.schema.json"
      - "fixtures/contracts/v1/source/plants_taxa_drift_assessment/**"
      - "tools/validators/source/validate_plants_taxa_drift_assessment.py"
      - "tests/validators/test_validate_plants_taxa_drift_assessment.py"
      - "docs/intake/exploratory/pass-20-plants-taxa-drift-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass20-plants-taxa-drift-assessment-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plants-taxa-drift-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-plants-taxa-drift-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/source/validate_plants_taxa_drift_assessment.py tests/validators/test_validate_plants_taxa_drift_assessment.py
          python -m unittest tests.validators.test_validate_plants_taxa_drift_assessment --verbose
          python tools/validators/source/validate_plants_taxa_drift_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass20-plants-taxa-drift-assessment-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### PLANTS taxa-drift assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only snapshot, stable-taxonomy, set-delta, rename-candidate, sensitivity, attestation, non-public output, review, and content-identity coherence."
            echo "- Boundary: no live source or network, occurrence join, exact location, taxonomy or conservation decision, source admission, lifecycle mutation, promotion, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the inactive, fixture-only Pass 11 NegativeStateAudit profile.
name: pass11-negative-state-audit

"on":
  pull_request:
    paths:
      - ".github/workflows/pass11-negative-state-audit.yml"
      - "contracts/governance/negative_state_audit.md"
      - "schemas/contracts/v1/governance/negative_state_audit.schema.json"
      - "fixtures/contracts/v1/governance/negative_state_audit/**"
      - "tools/validators/governance/validate_negative_state_audit.py"
      - "tests/validators/governance/test_validate_negative_state_audit.py"
      - "docs/intake/exploratory/pass11-negative-state-audit-source-map.md"
      - "data/receipts/generated/genrec-pass11-negative-state-audit-20260809.json"
      - "packages/hashing/src/hashing/**"
      - "tools/validators/validate_generated_receipt.py"
      - "schemas/contracts/v1/receipts/generated_receipt.schema.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pass11-negative-state-audit.yml"
      - "contracts/governance/negative_state_audit.md"
      - "schemas/contracts/v1/governance/negative_state_audit.schema.json"
      - "fixtures/contracts/v1/governance/negative_state_audit/**"
      - "tools/validators/governance/validate_negative_state_audit.py"
      - "tests/validators/governance/test_validate_negative_state_audit.py"
      - "docs/intake/exploratory/pass11-negative-state-audit-source-map.md"
      - "data/receipts/generated/genrec-pass11-negative-state-audit-20260809.json"
      - "packages/hashing/src/hashing/**"
      - "tools/validators/validate_generated_receipt.py"
      - "schemas/contracts/v1/receipts/generated_receipt.schema.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass11-negative-state-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-pass11-negative-state-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema, hashing, and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile validator and tests
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/validators/governance/validate_negative_state_audit.py \
            tests/validators/governance/test_validate_negative_state_audit.py
      - name: Run focused tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.validators.governance.test_validate_negative_state_audit --verbose
      - name: Replay exact fixture outcomes
        run: |
          set -euo pipefail
          python tools/validators/governance/validate_negative_state_audit.py --fixtures
      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass11-negative-state-audit-20260809.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Pass 11 NegativeStateAudit"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only separation among approved, denied, and citation/validation-failure states."
            echo "- Boundary: no evidence authentication, policy approval, lifecycle write, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

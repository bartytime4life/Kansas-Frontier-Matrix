# One-time, branch-scoped settings synchronization.
# This workflow is removed from the branch immediately after the verified run.
name: labels-taxonomy-sync-once

on:
  push:
    branches:
      - "agent/label-taxonomy-sync-20260812"
    paths:
      - ".github/workflows/labels-taxonomy-sync-once.yml"

permissions: {}

jobs:
  sync-label-taxonomy:
    name: upsert-kfm-label-taxonomy
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      KFM_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Upsert and verify the bounded label set
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          labels = json.loads(r'''[{"name":"bug","color":"d73a4a","description":"Reproducible defect or regression; a report remains unconfirmed until verified."},{"name":"codex","color":"6f42c1","description":"Created or substantially authored through Codex; provenance only, not approval."},{"name":"dependencies","color":"0366d6","description":"Dependency update proposal; compatibility and security still require review."},{"name":"documentation","color":"0075ca","description":"Documentation-focused change; prose alone does not prove implementation."},{"name":"duplicate","color":"cfd3d7","description":"Duplicates an existing issue or pull request; link the canonical item."},{"name":"enhancement","color":"a2eeef","description":"Bounded feature or improvement proposal; not implementation authority."},{"name":"exact-head-validated","color":"0e8a16","description":"Declared checks passed at one exact commit; not review, release, or publication."},{"name":"github_actions","color":"000000","description":"Dependabot updates to GitHub Actions references; review workflow trust boundaries."},{"name":"good first issue","color":"7057ff","description":"Bounded newcomer task with owner, acceptance criteria, and public-safe inputs."},{"name":"help wanted","color":"008672","description":"Maintainer requests scoped help; contributor authority remains bounded."},{"name":"invalid","color":"e4e669","description":"Not actionable under the stated contract; record the reason before closing."},{"name":"javascript","color":"168700","description":"Dependabot updates to JavaScript or TypeScript dependencies."},{"name":"merged","color":"6f42c1","description":"Legacy metadata only; GitHub's merged state is authoritative."},{"name":"needs-review","color":"fbca04","description":"Human review requested; this label is not approval or acceptance."},{"name":"pass-1","color":"c2e0c6","description":"Pass 1 campaign lineage; not a currentness, validation, or release claim."},{"name":"pre_commit","color":"000000","description":"Dependabot updates to pre-commit hooks."},{"name":"python","color":"2b67c6","description":"Dependabot updates to Python dependencies."},{"name":"question","color":"d876e3","description":"Clarification or a bounded answer is needed before disposition."},{"name":"source-descriptor","color":"0052cc","description":"Work concerning SourceDescriptor shape, validation, or governed source intake."},{"name":"trust-boundary-preserved","color":"1d76db","description":"Author or reviewer assertion for one change; verify independently before relying on it."},{"name":"wontfix","color":"ffffff","description":"No implementation planned; record rationale, alternatives, and any residual risk."},{"name":"blocked","color":"b60205","description":"Cannot proceed until a named prerequisite, dependency, or authority gap is resolved."},{"name":"ci","color":"1d76db","description":"Continuous-integration, workflow, check, build, or automation behavior."},{"name":"correction","color":"fbca04","description":"Candidate correction, withdrawal, supersession, or rollback work; not yet approved."},{"name":"evidence","color":"0052cc","description":"Evidence, citation, provenance, lineage, receipt, or proof handling."},{"name":"governance","color":"5319e7","description":"Governance, ADR, authority, ownership, or trust-boundary work."},{"name":"hold","color":"d93f0b","description":"Do not merge or advance until the stated hold condition is resolved."},{"name":"needs-information","color":"d876e3","description":"Additional public-safe evidence or context is required before triage can continue."},{"name":"policy","color":"b60205","description":"Policy, rights, sensitivity, consent, access, or admissibility work."},{"name":"priority: p0","color":"b60205","description":"Immediate triage: active critical exposure or repository-blocking integrity risk."},{"name":"priority: p1","color":"d93f0b","description":"High priority: material risk or defect requiring near-term action."},{"name":"priority: p2","color":"fbca04","description":"Normal priority: important work with no immediate critical exposure."},{"name":"priority: p3","color":"0e8a16","description":"Low urgency: bounded backlog or polish work."},{"name":"release","color":"0e8a16","description":"Release, promotion, correction, withdrawal, rollback, or publication-control work."},{"name":"security","color":"b60205","description":"Security work; keep vulnerabilities and exploit details in the private reporting path."},{"name":"sensitivity","color":"e99695","description":"Rights, sovereignty, consent, privacy, geoprivacy, or harmful-exposure concern."},{"name":"source-admission","color":"0e8a16","description":"Proposal to evaluate a source for governed admission; not activation or approval."}]''')
          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["KFM_REPOSITORY"]
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")[:1000]
                  raise RuntimeError(f"{method} {url} failed with HTTP {exc.code}: {detail}") from exc
              return None if not body else json.loads(body.decode("utf-8"))

          existing = {}
          page = 1
          while True:
              batch = request("GET", f"{api_root}/labels?per_page=100&page={page}")
              if not batch:
                  break
              existing.update({item["name"]: item for item in batch})
              if len(batch) < 100:
                  break
              page += 1

          created = []
          updated = []
          for label in sorted(labels, key=lambda item: item["name"].casefold()):
              name = label["name"]
              if name in existing:
                  encoded = urllib.parse.quote(name, safe="")
                  request(
                      "PATCH",
                      f"{api_root}/labels/{encoded}",
                      {
                          "new_name": name,
                          "color": label["color"],
                          "description": label["description"],
                      },
                  )
                  updated.append(name)
              else:
                  request("POST", f"{api_root}/labels", label)
                  created.append(name)

          final = {}
          page = 1
          while True:
              batch = request("GET", f"{api_root}/labels?per_page=100&page={page}")
              if not batch:
                  break
              final.update({item["name"]: item for item in batch})
              if len(batch) < 100:
                  break
              page += 1

          mismatches = []
          for expected in labels:
              actual = final.get(expected["name"])
              if actual is None:
                  mismatches.append(f"missing:{expected['name']}")
                  continue
              for field in ("color", "description"):
                  if actual.get(field) != expected[field]:
                      mismatches.append(
                          f"{expected['name']}:{field}:{actual.get(field)!r}!={expected[field]!r}"
                      )
          if mismatches:
              raise RuntimeError("label verification failed: " + "; ".join(mismatches))

          print(
              json.dumps(
                  {
                      "created": created,
                      "created_count": len(created),
                      "deleted_count": 0,
                      "target_count": len(labels),
                      "updated": updated,
                      "updated_count": len(updated),
                      "verified": True,
                  },
                  sort_keys=True,
              )
          )
          PY

# Validate the fixture-only LiDAR lineage manifest candidate.
name: lidar-lineage-manifest-candidate

"on":
  pull_request:
    paths:
      - ".github/workflows/lidar-lineage-manifest-candidate.yml"
      - "contracts/data/lidar_lineage_manifest_candidate.md"
      - "schemas/contracts/v1/data/lidar_lineage_manifest_candidate.schema.json"
      - "fixtures/contracts/v1/data/lidar_lineage_manifest_candidate/**"
      - "tools/validators/data/validate_lidar_lineage_manifest_candidate.py"
      - "tests/validators/data/test_lidar_lineage_manifest_candidate.py"
      - "docs/intake/exploratory/lidar-lineage-manifest-candidate-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-lidar-lineage-manifest-candidate-20260811.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lidar-lineage-manifest-candidate.yml"
      - "contracts/data/lidar_lineage_manifest_candidate.md"
      - "schemas/contracts/v1/data/lidar_lineage_manifest_candidate.schema.json"
      - "fixtures/contracts/v1/data/lidar_lineage_manifest_candidate/**"
      - "tools/validators/data/validate_lidar_lineage_manifest_candidate.py"
      - "tests/validators/data/test_lidar_lineage_manifest_candidate.py"
      - "docs/intake/exploratory/lidar-lineage-manifest-candidate-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-lidar-lineage-manifest-candidate-20260811.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lidar-lineage-manifest-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-lidar-lineage-manifest-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests and fixture replay
        run: |
          python -m unittest -v tests.validators.data.test_lidar_lineage_manifest_candidate
          python tools/validators/data/validate_lidar_lineage_manifest_candidate.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-lidar-lineage-manifest-candidate-20260811.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### LidarLineageManifestCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only LiDAR acquisition, classification, vertical-reference, derived-carrier, evidence, and public-safety declarations."
            echo "- Boundary: no source activation, byte access, transform execution, sensitivity-policy decision, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

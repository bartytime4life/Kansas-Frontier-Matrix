# KFM MobSF static mobile-source scan.
# The workflow is read-only except for SARIF upload, uses immutable action pins,
# never persists checkout credentials, and has one bounded job timeout.
name: MobSF

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "36 8 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobsf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Run mobsfscan
        uses: MobSF/mobsfscan@2659f2ac6d185f0c60ce2eb754f5f48b683f73fb
        with:
          args: . --sarif --output results.sarif || true

      - name: Upload mobsfscan report
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif

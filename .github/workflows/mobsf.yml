# KFM MobSF static mobile-source scan.
# The workflow is read-only except for SARIF upload, uses immutable action pins,
# never persists checkout credentials, and has one bounded job timeout.
name: MobSF

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "36 8 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobsf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Run mobsfscan
        uses: MobSF/mobsfscan@4645ea70bc093268502fe9f6df93e41bb482254a
        with:
          args: . --sarif --output results.sarif || true

      - name: Upload mobsfscan report
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif

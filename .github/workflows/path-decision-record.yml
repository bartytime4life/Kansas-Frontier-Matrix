# Validate proposed KFM PathDecisionRecord instances against the pinned root registry.
#
# A green result proves record consistency only. It does not authorize paths,
# accept ADRs, move bytes, grant write capability, release, deploy, promote, or publish.
name: path-decision-record

"on":
  pull_request:
    paths:
      - ".github/workflows/path-decision-record.yml"
      - "contracts/governance/path_decision_record.md"
      - "control_plane/root_registry.yaml"
      - "schemas/contracts/v1/governance/path_decision_record.schema.json"
      - "fixtures/contracts/v1/governance/path_decision_record/**"
      - "tools/validators/directory_governance/validate_path_decision_record.py"
      - "tools/validators/directory_governance/path_decision_record.md"
      - "tests/validators/directory_governance/test_validate_path_decision_record.py"
      - "data/receipts/generated/genrec-path-decision-record-*.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/path-decision-record.yml"
      - "contracts/governance/path_decision_record.md"
      - "control_plane/root_registry.yaml"
      - "schemas/contracts/v1/governance/path_decision_record.schema.json"
      - "fixtures/contracts/v1/governance/path_decision_record/**"
      - "tools/validators/directory_governance/validate_path_decision_record.py"
      - "tools/validators/directory_governance/path_decision_record.md"
      - "tests/validators/directory_governance/test_validate_path_decision_record.py"
      - "data/receipts/generated/genrec-path-decision-record-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: path-decision-record-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-path-decision-record:
    name: validate-path-decision-record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused no-network tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/directory_governance \
            --pattern 'test_validate_path_decision_record.py' \
            --verbose

      - name: Validate finite-outcome fixture polarity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/directory_governance/validate_path_decision_record.py --fixtures

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-path-decision-record-20260807.json \
            --repo-root .

      - name: Record validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Path decision record"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: schema, root-registry binding, responsibility signature, finite placement outcome, and hard placement invariants."
            echo "- Boundary: a valid record documents reasoning only; it cannot authorize paths, accept ADRs, move bytes, grant writes, release, deploy, promote, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

name: api-contract-change-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/api-contract-change-assessment.yml"
      - "contracts/release/api_contract_change_assessment.md"
      - "schemas/contracts/v1/release/api_contract_change_assessment.schema.json"
      - "fixtures/contracts/v1/release/api_contract_change_assessment/**"
      - "tools/validators/release/validate_api_contract_change_assessment.py"
      - "tests/validators/release/test_validate_api_contract_change_assessment.py"
      - "docs/intake/exploratory/pass-18-api-contract-change-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass18-api-contract-change-assessment-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/api-contract-change-assessment.yml"
      - "contracts/release/api_contract_change_assessment.md"
      - "schemas/contracts/v1/release/api_contract_change_assessment.schema.json"
      - "fixtures/contracts/v1/release/api_contract_change_assessment/**"
      - "tools/validators/release/validate_api_contract_change_assessment.py"
      - "tests/validators/release/test_validate_api_contract_change_assessment.py"
      - "docs/intake/exploratory/pass-18-api-contract-change-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass18-api-contract-change-assessment-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-change-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-api-contract-change-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/release/validate_api_contract_change_assessment.py tests/validators/release/test_validate_api_contract_change_assessment.py
          python -m unittest tests.validators.release.test_validate_api_contract_change_assessment --verbose
          python tools/validators/release/validate_api_contract_change_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-api-contract-change-assessment-20260810.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### API contract change assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only version, impact, compatibility-reference, notice, migration, review, release, correction, rollback, limitation, and identity coherence."
            echo "- Boundary: no API diff or mutation, client discovery, compatibility execution, version-policy adoption, review approval, release, rollback, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

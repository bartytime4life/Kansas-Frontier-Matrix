# Validate the fixture-only SourceObligationPropagationAssessment candidate.
name: source-obligation-propagation-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/source-obligation-propagation-assessment.yml"
      - "contracts/source/source_obligation_propagation_assessment.md"
      - "schemas/contracts/v1/source/source_obligation_propagation_assessment.schema.json"
      - "fixtures/contracts/v1/source/source_obligation_propagation_assessment/**"
      - "tools/validators/source/validate_source_obligation_propagation_assessment.py"
      - "tests/validators/test_validate_source_obligation_propagation_assessment.py"
      - "docs/intake/exploratory/source-obligation-propagation-assessment-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-source-obligation-propagation-assessment-20260811.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-obligation-propagation-assessment.yml"
      - "contracts/source/source_obligation_propagation_assessment.md"
      - "schemas/contracts/v1/source/source_obligation_propagation_assessment.schema.json"
      - "fixtures/contracts/v1/source/source_obligation_propagation_assessment/**"
      - "tools/validators/source/validate_source_obligation_propagation_assessment.py"
      - "tests/validators/test_validate_source_obligation_propagation_assessment.py"
      - "docs/intake/exploratory/source-obligation-propagation-assessment-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-source-obligation-propagation-assessment-20260811.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-obligation-propagation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-source-obligation-propagation-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests and fixture replay
        run: |
          python -m unittest -v tests.validators.test_validate_source_obligation_propagation_assessment
          python tools/validators/source/validate_source_obligation_propagation_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-source-obligation-propagation-assessment-20260811.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### SourceObligationPropagationAssessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only attribution, terms, notices, redistribution, derivative-use, transform-receipt, and carrier-chain declarations."
            echo "- Boundary: no network request, rights decision, source activation, artifact creation, evidence, lifecycle write, export, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

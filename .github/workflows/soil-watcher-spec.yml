# Validate the inactive fixture-only soil watcher lifecycle specification.
name: soil-watcher-spec

"on":
  pull_request:
    paths:
      - ".github/workflows/soil-watcher-spec.yml"
      - "contracts/domains/soil/soil_watcher_spec.md"
      - "schemas/contracts/v1/domains/soil/soil_watcher_spec.schema.json"
      - "pipeline_specs/watchers/soil_ssurgo_gnatsgo.json"
      - "policy/domains/soil/watcher_spec.rego"
      - "control_plane/watcher_registry.json"
      - "schemas/contracts/v1/source/watcher_registry.schema.json"
      - "tools/validators/validate_watcher_registry.py"
      - "tools/validators/domains/soil/watcher_spec/**"
      - "fixtures/domains/soil/watcher_spec/**"
      - "tests/validators/domains/soil/watcher_spec/**"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-soil-watcher-spec-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/soil-watcher-spec.yml"
      - "contracts/domains/soil/soil_watcher_spec.md"
      - "schemas/contracts/v1/domains/soil/soil_watcher_spec.schema.json"
      - "pipeline_specs/watchers/soil_ssurgo_gnatsgo.json"
      - "policy/domains/soil/watcher_spec.rego"
      - "control_plane/watcher_registry.json"
      - "tools/validators/domains/soil/watcher_spec/**"
      - "fixtures/domains/soil/watcher_spec/**"
      - "tests/validators/domains/soil/watcher_spec/**"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-soil-watcher-spec-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soil-watcher-spec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
      - name: Run focused tests and fixture replay
        run: |
          set -euo pipefail
          python -m unittest discover --start-directory tests/validators/domains/soil/watcher_spec --pattern 'test_*.py' --verbose
          python tools/validators/domains/soil/watcher_spec/validate_soil_watcher_spec.py --fixtures
          python tools/validators/domains/soil/watcher_spec/validate_soil_watcher_spec.py pipeline_specs/watchers/soil_ssurgo_gnatsgo.json
      - name: Validate watcher registry closure
        run: |
          set -euo pipefail
          python tools/validators/validate_watcher_registry.py control_plane/watcher_registry.json
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-soil-watcher-spec-20260808.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Soil watcher specification"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed fixture-only spec, source-role anti-collapse, provider-specific materiality, exact spec bytes, registry closure, and finite findings."
            echo "- Boundary: PASS does not activate sources, allow network access, execute a watcher, admit RAW, promote, release, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

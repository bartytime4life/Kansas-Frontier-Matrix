# One-shot evidence driver; validation branch only, not part of the repair.
# The source under test is the explicit matrix revision, not this workflow head.
name: m18-temporal-exact-revision-validation

"on":
  push:
    branches:
      - agent/m18-temporal-validation-20260905
    paths:
      - .github/workflows/m18-temporal-exact-revision-validation.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  COREPACK_ENABLE_STRICT: "1"
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  explorer:
    name: explorer-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            revision: 8b9c52d88687986879c8f87d7e3835f6a58bbacd
          - label: candidate
            revision: b5bcc4d96e2959a499a77078a80fffbf06e6dd40
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record and assert source pin
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          git log -1 --format='%H %T'
          sha256sum package.json pnpm-lock.yaml pnpm-workspace.yaml apps/explorer-web/package.json apps/explorer-web/tsconfig.json
      - name: Set up native UI-build Node major
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked workspace dependencies with existing policy
        id: install
        run: |
          set -euo pipefail
          node --version
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Native Explorer build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter explorer-web build
      - name: Focused temporal and workspace tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/explorer-web
        run: |
          set -euo pipefail
          files=(tests/temporal-kernel.test.ts tests/workspace-context.test.ts)
          if test -f tests/temporal-boundary-regression.test.ts; then
            files+=(tests/temporal-boundary-regression.test.ts)
          fi
          pnpm exec vitest run "${files[@]}"
      - name: All native Explorer unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter explorer-web test:unit
      - name: Native Explorer browser lane
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter explorer-web test:browser
      - name: Check tracked-source immutability
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  temporal-python:
    name: temporal-python-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            revision: 8b9c52d88687986879c8f87d7e3835f6a58bbacd
          - label: candidate
            revision: b5bcc4d96e2959a499a77078a80fffbf06e6dd40
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record and assert source pin
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          git log -1 --format='%H %T'
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        id: install
        run: python tools/ci/install_python_ci.py project-test
      - name: Focused temporal validator tests including expectation regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m unittest discover --start-directory tests/validators --pattern 'test_validate_temporal_view_state*.py' --verbose
      - name: Non-vacuous temporal fixture profile
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/validators/validate_temporal_view_state.py --fixtures
      - name: Generic temporal schema discovery
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/schemas/test_common_contracts.py -k temporal_view_state
      - name: All generic common-contract schema fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/schemas/test_common_contracts.py
      - name: Check tracked-source immutability
        if: ${{ !cancelled() }}
        run: git diff --exit-code

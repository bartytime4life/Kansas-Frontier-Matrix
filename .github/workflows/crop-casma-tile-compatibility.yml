# Synthetic pipeline qualification only; no source access or publication.
name: Crop CASMA Tile Compatibility

"on":
  pull_request:
    paths:
      - ".github/workflows/crop-casma-tile-compatibility.yml"
      - "pipelines/domains/soil/crop_casma_tiles/**"
      - "pipelines/domains/habitat/ingest_nlcd.py"
      - "pipeline_specs/habitat/nlcd_landcover.yaml"
      - "packages/connectors-core/**"
      - "contracts/domains/habitat/land_cover/**"
      - "contracts/domains/habitat/land_cover_observation.md"
      - "schemas/contracts/v1/domains/habitat/land_cover/**"
      - "schemas/contracts/v1/domains/habitat/land_cover_observation.schema.json"
      - "fixtures/domains/habitat/nlcd_ingest/**"
      - "data/registry/habitat/sources/nlcd.yaml"
      - "tests/pipelines/domains/habitat/**"
      - "tests/validators/domains/habitat/test_nlcd_candidate_schemas.py"
      - "tools/local_data/file_io.py"
      - "tools/ci/python-test.lock"
      - "pyproject.toml"
      - "pipelines/normalize/geography/historical_topo_tiles.py"
      - "tests/pipelines/test_historical_topo_tiles.py"
      - "tools/ci/kfm_no_network/**"
      - "tools/ci/install_python_ci.py"
      - "tests/ci/test_install_python_ci.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/crop-casma-tile-compatibility.yml"
      - "pipelines/domains/soil/crop_casma_tiles/**"
      - "pipelines/domains/habitat/ingest_nlcd.py"
      - "pipeline_specs/habitat/nlcd_landcover.yaml"
      - "packages/connectors-core/**"
      - "contracts/domains/habitat/land_cover/**"
      - "contracts/domains/habitat/land_cover_observation.md"
      - "schemas/contracts/v1/domains/habitat/land_cover/**"
      - "schemas/contracts/v1/domains/habitat/land_cover_observation.schema.json"
      - "fixtures/domains/habitat/nlcd_ingest/**"
      - "data/registry/habitat/sources/nlcd.yaml"
      - "tests/pipelines/domains/habitat/**"
      - "tests/validators/domains/habitat/test_nlcd_candidate_schemas.py"
      - "tools/local_data/file_io.py"
      - "tools/ci/python-test.lock"
      - "pyproject.toml"
      - "pipelines/normalize/geography/historical_topo_tiles.py"
      - "tests/pipelines/test_historical_topo_tiles.py"
      - "tools/ci/kfm_no_network/**"
      - "tools/ci/install_python_ci.py"
      - "tests/ci/test_install_python_ci.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crop-casma-tile-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tile-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: "1"
      KFM_NO_NETWORK: "1"
    steps:
      - name: Check out qualification revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tile Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked tile dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test
          python tools/ci/install_python_ci.py connectors-core
          python tools/ci/install_python_ci.py crop-casma-tiles
      - name: Check dependency consistency and patched Pillow
        run: |
          python -m pip check
          python -c "from PIL import Image; assert Image.__version__ == '13.0.0', Image.__version__"
      - name: Verify synthetic tiles and tamper rejection
        run: python -m unittest discover -s pipelines/domains/soil/crop_casma_tiles -p 'test_*.py' -v

      - name: Verify the historical topographic tile pipeline
        env:
          KFM_NO_NETWORK: "1"
          PROJ_NETWORK: "OFF"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/tools/ci/kfm_no_network:${{ github.workspace }}
        run: python -m unittest discover -s tests/pipelines -p 'test_historical_topo_tiles.py' -v

      - name: Verify bounded NLCD native-grid candidates and strict schemas
        env:
          KFM_NO_NETWORK: "1"
          PROJ_NETWORK: "OFF"
          PYTHONPATH: ${{ github.workspace }}/tools/ci/kfm_no_network:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -B -m pytest tests/pipelines/domains/habitat/test_nlcd_ingest.py tests/validators/domains/habitat/test_nlcd_candidate_schemas.py -q --strict-config --strict-markers
          python -B -m pipelines.domains.habitat.ingest_nlcd base
          python -B -m pipelines.domains.habitat.ingest_nlcd changed

# Temporary, read-only paired diagnostic for the repository-control bounded-input repair.
# The job checks out the immutable trusted base and candidate SHAs side by side.
# No secrets, OIDC, write permissions, PR mutation, settings, release, deployment,
# promotion, or publication authority.

name: repository-control-input-bounds-validation

"on":
  push:
    branches:
      - validation/repository-control-input-bounds-eb320ee

permissions:
  contents: read

concurrency:
  group: repository-control-input-bounds-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_TARGET_SHA: "eb320eefa4f6ba4956c6bf3a5aa3a3afaa916e6b"
  KFM_TRUSTED_BASE_REF: "bd942b45493fa5f80e946ecfb3e810e413787394"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  paired-repository-topology:
    name: paired-repository-topology
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TRUSTED_BASE_REF }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TARGET_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact paired identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          test "$(git -C candidate rev-parse HEAD)" = "${KFM_TARGET_SHA}"
          git -C candidate merge-base --is-ancestor "${KFM_TRUSTED_BASE_REF}" HEAD
          test "$(git -C candidate merge-base "${KFM_TRUSTED_BASE_REF}" HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          git -C candidate diff --check "${KFM_TRUSTED_BASE_REF}...HEAD"

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        working-directory: candidate
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run paired repository-topology diagnostic
        id: paired
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p topology-diagnostic

          set +e
          (cd base && make repository-topology) > topology-diagnostic/base.raw.log 2>&1
          base_rc=$?
          (cd candidate && make repository-topology) > topology-diagnostic/candidate.raw.log 2>&1
          candidate_rc=$?
          set -e

          BASE_RC="${base_rc}" CANDIDATE_RC="${candidate_rc}" python - <<'PY'
          import difflib
          import json
          import os
          from pathlib import Path

          root = Path("topology-diagnostic")
          workspace = Path.cwd().resolve()
          base_sha = os.environ["KFM_TRUSTED_BASE_REF"]
          candidate_sha = os.environ["KFM_TARGET_SHA"]
          base_rc = int(os.environ["BASE_RC"])
          candidate_rc = int(os.environ["CANDIDATE_RC"])

          def raw_text(name: str) -> str:
              return (root / name).read_text(encoding="utf-8", errors="replace")

          def normalize(text: str) -> str:
              replacements = (
                  (str(workspace / "base"), "<WORKTREE>"),
                  (str(workspace / "candidate"), "<WORKTREE>"),
                  (str(workspace), "<GITHUB_WORKSPACE>"),
                  (candidate_sha, "<CANDIDATE_SHA>"),
                  (base_sha, "<BASE_SHA>"),
              )
              for old, new in replacements:
                  text = text.replace(old, new)
              return text

          def report_from(text: str):
              marker = "AssertionError: 0 != 1 : "
              for line in text.splitlines():
                  if marker in line:
                      return json.loads(line.split(marker, 1)[1])
              return None

          def failed_tests(text: str):
              return sorted(
                  line.removeprefix("FAIL: ").strip()
                  for line in text.splitlines()
                  if line.startswith("FAIL: ")
              )

          def failure_signature(text: str, return_code: int):
              report = report_from(text)
              signature = {
                  "return_code": return_code,
                  "failed_tests": failed_tests(text),
                  "report_present": report is not None,
              }
              if report is not None:
                  signature.update(
                      {
                          "outcome": report.get("outcome"),
                          "rule_count": report.get("rule_count"),
                          "counts": report.get("counts"),
                          "stale_fingerprints": sorted(
                              report.get("baseline", {}).get("stale_fingerprints", [])
                          ),
                          "non_baselined_findings": sorted(
                              (
                                  finding.get("disposition"),
                                  finding.get("rule_id"),
                                  finding.get("subject"),
                                  finding.get("fingerprint"),
                                  finding.get("evidence_sha256"),
                              )
                              for finding in report.get("findings", [])
                              if finding.get("disposition") != "BASELINED_WARNING"
                          ),
                      }
                  )
              return signature, report

          base_raw = raw_text("base.raw.log")
          candidate_raw = raw_text("candidate.raw.log")
          base_text = normalize(base_raw)
          candidate_text = normalize(candidate_raw)
          (root / "base.normalized.log").write_text(base_text, encoding="utf-8")
          (root / "candidate.normalized.log").write_text(candidate_text, encoding="utf-8")

          diff = "".join(
              difflib.unified_diff(
                  base_text.splitlines(keepends=True),
                  candidate_text.splitlines(keepends=True),
                  fromfile="base.normalized.log",
                  tofile="candidate.normalized.log",
              )
          )
          (root / "normalized.diff").write_text(diff, encoding="utf-8")

          base_signature, base_report = failure_signature(base_raw, base_rc)
          candidate_signature, candidate_report = failure_signature(
              candidate_raw, candidate_rc
          )
          (root / "base.failure-signature.json").write_text(
              json.dumps(base_signature, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (root / "candidate.failure-signature.json").write_text(
              json.dumps(candidate_signature, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          signatures_equal = base_signature == candidate_signature
          base_tracked = base_report.get("tracked_path_count") if base_report else None
          candidate_tracked = (
              candidate_report.get("tracked_path_count") if candidate_report else None
          )

          if base_rc == 0 and candidate_rc == 0:
              classification = "BOTH_PASS"
          elif base_rc != 0 and candidate_rc == 0:
              classification = "CANDIDATE_REPAIRS_BASE"
          elif base_rc == 0 and candidate_rc != 0:
              classification = "CANDIDATE_REGRESSION"
          elif signatures_equal:
              classification = "INHERITED_EQUIVALENT_FAILURE"
          else:
              classification = "BOTH_FAIL_DIFFERENT_SIGNATURE"

          result = {
              "trusted_base_sha": base_sha,
              "candidate_sha": candidate_sha,
              "base_exit_code": base_rc,
              "candidate_exit_code": candidate_rc,
              "base_tracked_path_count": base_tracked,
              "candidate_tracked_path_count": candidate_tracked,
              "tracked_path_count_delta": (
                  candidate_tracked - base_tracked
                  if isinstance(base_tracked, int) and isinstance(candidate_tracked, int)
                  else None
              ),
              "raw_normalized_outputs_equal": base_text == candidate_text,
              "failure_signatures_equal": signatures_equal,
              "classification": classification,
          }
          (root / "result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(
                  f"classification={classification}\n"
                  f"base_rc={base_rc}\n"
                  f"candidate_rc={candidate_rc}\n"
                  f"signatures_equal={'true' if signatures_equal else 'false'}\n"
                  f"tracked_delta={result['tracked_path_count_delta']}\n"
              )
          PY

          echo '--- paired topology result ---'
          cat topology-diagnostic/result.json
          echo '--- trusted-base failure signature ---'
          cat topology-diagnostic/base.failure-signature.json
          echo '--- candidate failure signature ---'
          cat topology-diagnostic/candidate.failure-signature.json
          echo '--- normalized raw diff (first 120 lines; diagnostic only) ---'
          sed -n '1,120p' topology-diagnostic/normalized.diff

      - name: Upload paired diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-topology-paired-eb320ee
          path: topology-diagnostic/
          if-no-files-found: error
          retention-days: 7

      - name: Record paired attribution boundary
        if: always()
        shell: bash
        run: |
          {
            echo '### Paired repository-topology attribution'
            echo
            echo "- Trusted base: \`${KFM_TRUSTED_BASE_REF}\`."
            echo "- Candidate: \`${KFM_TARGET_SHA}\`."
            echo "- Base exit code: \`${{ steps.paired.outputs.base_rc }}\`."
            echo "- Candidate exit code: \`${{ steps.paired.outputs.candidate_rc }}\`."
            echo "- Failure signatures equal: \`${{ steps.paired.outputs.signatures_equal }}\`."
            echo "- Tracked-path delta: \`${{ steps.paired.outputs.tracked_delta }}\`."
            echo "- Classification: \`${{ steps.paired.outputs.classification }}\`."
            echo '- Raw logs may differ in worktree paths, timing, and tracked-path count; attribution is based on exact failed tests and fail-driving topology fingerprints.'
            echo '- The harness is diagnostic only and grants no integration, release, deployment, promotion, or publication authority.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail closed on candidate-specific or divergent topology failure
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.paired.outputs.classification }}" in
            BOTH_PASS|CANDIDATE_REPAIRS_BASE|INHERITED_EQUIVALENT_FAILURE)
              exit 0
              ;;
            *)
              exit 1
              ;;
          esac

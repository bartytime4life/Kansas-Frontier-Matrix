# Temporary bounded diagnostic workflow for the current repository-topology failure.
# This workflow is intentionally read-only and will be removed once the root cause is
# fixed in this pull request. It emits and compares the repository-owned monotonic
# baseline candidate before running the failing topology target.
name: repository-topology-diagnostics

"on":
  pull_request:
    paths:
      - ".github/workflows/repository-topology-diagnostics.yml"
      - ".github/workflows/validator-suite.yml"
      - "contracts/**"
      - "schemas/**"
      - "fixtures/**"
      - "tests/validators/directory_governance/**"
      - "tools/validators/directory_governance/**"
      - "control_plane/root_registry.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-topology-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  diagnose:
    name: diagnose-repository-topology
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Upload exact topology test source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-topology-test-source
          path: tests/validators/directory_governance/test_validate_repository_topology.py
          if-no-files-found: error
          retention-days: 1

      - name: Emit and compare repository-owned topology baseline candidate
        shell: bash
        run: |
          python tools/validators/directory_governance/validate_repository_topology.py \
            --emit-baseline > /tmp/repository_topology_baseline_candidate.json
          python - <<'PY'
          import base64
          import json
          import zlib
          from pathlib import Path

          baseline_path = Path(
              "tools/validators/directory_governance/repository_topology_baseline.json"
          )
          candidate_path = Path("/tmp/repository_topology_baseline_candidate.json")
          current = json.loads(baseline_path.read_text(encoding="utf-8"))
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))

          def identity(entry: dict[str, str]) -> tuple[str, str]:
              return entry["rule_id"], entry["subject"]

          def members(entry: dict[str, str]) -> set[str]:
              compressed = base64.b64decode(
                  entry["evidence_zlib_base64"], validate=True
              )
              raw = zlib.decompress(compressed).decode("utf-8")
              return set(raw.split("\0"))

          old = {identity(item): item for item in current["entries"]}
          new = {identity(item): item for item in candidate["entries"]}

          print("removed identities:")
          for key in sorted(set(old) - set(new)):
              print(f"  - {key[0]} :: {key[1]}")

          print("added identities:")
          for key in sorted(set(new) - set(old)):
              print(f"  + {key[0]} :: {key[1]}")

          print("changed evidence:")
          for key in sorted(set(old) & set(new)):
              before = members(old[key])
              after = members(new[key])
              if before == after:
                  continue
              print(f"  * {key[0]} :: {key[1]}")
              print(f"      old fingerprint: {old[key]['fingerprint']}")
              print(f"      new fingerprint: {new[key]['fingerprint']}")
              for value in sorted(before - after):
                  print(f"      - {value}")
              for value in sorted(after - before):
                  print(f"      + {value}")
          PY

      - name: Upload bounded topology baseline candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-topology-baseline-candidate
          path: /tmp/repository_topology_baseline_candidate.json
          if-no-files-found: error
          retention-days: 1

      - name: Diagnose repository-topology ratchet
        shell: bash
        env:
          KFM_TRUSTED_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          set -uo pipefail
          status=0
          make repository-topology > /tmp/kfm-repository-topology.log 2>&1 || status=$?
          cat /tmp/kfm-repository-topology.log

          python - "$status" <<'PY'
          from pathlib import Path
          import os
          import sys

          status = int(sys.argv[1])
          text = Path("/tmp/kfm-repository-topology.log").read_text(
              encoding="utf-8", errors="replace"
          ).strip()
          summary = text if text else "repository-topology returned no diagnostic output"
          summary = summary[:6000]
          escaped = (
              summary.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          level = "error" if status else "notice"
          print(
              f"::{level} file=tools/validators/directory_governance/"
              f"validate_repository_topology.py,title=Repository topology diagnostic::{escaped}"
          )

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Repository topology diagnostic\n\n")
              handle.write(f"Exit status: `{status}`\n\n")
              handle.write("```text\n")
              handle.write(summary)
              handle.write("\n```\n")
          PY

          exit "$status"

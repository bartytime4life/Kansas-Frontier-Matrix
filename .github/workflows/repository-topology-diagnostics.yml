# Temporary bounded diagnostic workflow for the current repository-topology failure.
# This workflow is intentionally read-only and will be removed once the root cause is
# fixed in this pull request. It emits the repository-owned monotonic baseline candidate
# as an artifact before running the failing topology target.
name: repository-topology-diagnostics

"on":
  pull_request:
    paths:
      - ".github/workflows/repository-topology-diagnostics.yml"
      - ".github/workflows/validator-suite.yml"
      - "contracts/**"
      - "schemas/**"
      - "fixtures/**"
      - "tools/validators/directory_governance/**"
      - "control_plane/root_registry.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-topology-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  diagnose:
    name: diagnose-repository-topology
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Emit repository-owned topology baseline candidate
        shell: bash
        run: |
          python tools/validators/directory_governance/validate_repository_topology.py \
            --emit-baseline > /tmp/repository_topology_baseline_candidate.json
          python - <<'PY'
          import json
          from pathlib import Path

          current = json.loads(Path("tools/validators/directory_governance/repository_topology_baseline.json").read_text())
          candidate = json.loads(Path("/tmp/repository_topology_baseline_candidate.json").read_text())
          old = {item["identity"]: item for item in current["entries"]}
          new = {item["identity"]: item for item in candidate["entries"]}
          print("removed identities:")
          for key in sorted(set(old) - set(new)):
              print(f"  - {key}")
          print("added identities:")
          for key in sorted(set(new) - set(old)):
              print(f"  + {key}")
          print("changed evidence:")
          for key in sorted(set(old) & set(new)):
              if old[key].get("evidence") != new[key].get("evidence"):
                  before = set(old[key].get("evidence", []))
                  after = set(new[key].get("evidence", []))
                  print(f"  * {key}: -{len(before - after)} +{len(after - before)}")
                  for value in sorted(before - after):
                      print(f"      - {value}")
                  for value in sorted(after - before):
                      print(f"      + {value}")
          PY

      - name: Upload bounded topology baseline candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-topology-baseline-candidate
          path: /tmp/repository_topology_baseline_candidate.json
          if-no-files-found: error
          retention-days: 1

      - name: Diagnose repository-topology ratchet
        shell: bash
        env:
          KFM_TRUSTED_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          set -uo pipefail
          status=0
          make repository-topology > /tmp/kfm-repository-topology.log 2>&1 || status=$?
          cat /tmp/kfm-repository-topology.log

          python - "$status" <<'PY'
          from pathlib import Path
          import os
          import sys

          status = int(sys.argv[1])
          text = Path("/tmp/kfm-repository-topology.log").read_text(
              encoding="utf-8", errors="replace"
          ).strip()
          summary = text if text else "repository-topology returned no diagnostic output"
          summary = summary[:6000]
          escaped = (
              summary.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          level = "error" if status else "notice"
          print(
              f"::{level} file=tools/validators/directory_governance/"
              f"validate_repository_topology.py,title=Repository topology diagnostic::{escaped}"
          )

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Repository topology diagnostic\n\n")
              handle.write(f"Exit status: `{status}`\n\n")
              handle.write("```text\n")
              handle.write(summary)
              handle.write("\n```\n")
          PY

          exit "$status"

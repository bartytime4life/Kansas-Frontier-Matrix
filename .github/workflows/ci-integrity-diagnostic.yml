# One-time guarded branch repair. This workflow exists only on the isolated
# diagnostic branch and may update only the named corrective branch.
name: ci-integrity-diagnostic

"on":
  push:
    branches:
      - agent/restore-main-integrity-20260814

permissions:
  contents: write

concurrency:
  group: ci-integrity-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: repair-corrective-branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/restore-main-integrity-20260814
      EXPECTED_TARGET_HEAD: e26e77fe1fa575d31d3d946c62ae8edc25589db7
      CURRENT_MAIN: 860fc390ffa303785d3d6c726571265175f6cc0f
      ADR_PACKET_BASE: 3974da9794fa11bd5355c49243c9193d22b9e81e
      KFM_NO_NETWORK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Check out the exact corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/restore-main-integrity-20260814
          fetch-depth: 0
          persist-credentials: true

      - name: Verify the guarded target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_TARGET_HEAD}"
          test "$(git merge-base --is-ancestor "${CURRENT_MAIN}" HEAD; echo $?)" = "0"

      - name: Apply the dependency-closed correction
        shell: bash
        run: |
          set -euo pipefail

          # The temporary diagnostic workflow was merged externally while still
          # marked temporary. The corrective branch already deletes it.
          test ! -e .github/workflows/ci-integrity-diagnostic.yml

          # PR #2825 introduced a proposed ADR packet whose new uppercase path
          # expands a ratcheted topology waiver. Restore the exact pre-packet
          # documentation and remove only the packet's new record and receipt.
          git checkout "${ADR_PACKET_BASE}" -- \
            docs/adr/INDEX.md \
            docs/adr/README.md \
            docs/registers/ADR_INDEX.md
          git rm -- \
            docs/adr/ADR-0035-repository-wide-adr-identity-numbering-and-domain-indexing.md \
            data/receipts/generated/genrec-adr-0035-repository-wide-adr-identity-numbering-86fb7b02.json

          # Regenerate the ratchet from the corrected index. This may only shrink
          # inherited evidence; the trusted-base check below rejects expansion.
          python tools/validators/directory_governance/validate_repository_topology.py \
            --repo-root . \
            --emit-baseline \
            --expires-on 2026-11-10 \
            > tools/validators/directory_governance/repository_topology_baseline.json.new
          mv tools/validators/directory_governance/repository_topology_baseline.json.new \
            tools/validators/directory_governance/repository_topology_baseline.json

          successor="data/receipts/generated/genrec-publication-deny-dry-run-integrity-20260814.json"
          prior="data/receipts/generated/genrec-publication-deny-dry-run-20260809.json"
          sed -i \
            's/genrec-publication-deny-dry-run-20260809\.json/genrec-publication-deny-dry-run-integrity-20260814.json/g' \
            .github/workflows/release-dry-run.yml

          python - "${prior}" "${successor}" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          prior_path = pathlib.Path(sys.argv[1])
          successor_path = pathlib.Path(sys.argv[2])
          receipt = json.loads(prior_path.read_text(encoding="utf-8"))
          artifact_paths = receipt["artifact_paths"]
          receipt["receipt_id"] = "genrec-publication-deny-dry-run-integrity-20260814"
          receipt["artifact_hashes"] = {
              path: "sha256:" + hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              for path in artifact_paths
          }
          receipt["model_identity"] = {
              "provider": "OpenAI",
              "model": "GPT-5.6 Pro",
              "version": "2026-08-14",
          }
          receipt["prompt_or_contract"] = "sha256:" + hashlib.sha256(
              b"@GitHub make that highest value move.\n"
          ).hexdigest()
          receipt["parameters"] = {
              "seed": None,
              "temperature": None,
              "top_p": None,
              "tools_enabled": [
                  "GitHub connector",
                  "GitHub Actions read-only diagnostic",
                  "deterministic Python",
              ],
          }
          receipt["inputs"] = {
              "evidence_hashes": [
                  "sha256:" + hashlib.sha256(prior_path.read_bytes()).hexdigest(),
                  "sha256:e28be770ce665fd1bb6a404195b1b8094b81863409c439e588eeb55aecff8637",
              ],
              "attached_docs": [],
              "evidence_refs": [
                  "repo:main@860fc390ffa303785d3d6c726571265175f6cc0f",
                  "repo:data/receipts/generated/genrec-publication-deny-dry-run-20260809.json@860fc390ffa303785d3d6c726571265175f6cc0f",
                  "actions:run/31843457018/artifact/9235069108",
              ],
          }
          receipt["truth_labels"] = {path: "PROPOSED" for path in artifact_paths}
          receipt["validation_gates"] = [
              {
                  "gate": "exact-main-failure-classification",
                  "outcome": "PASS",
                  "reason": "Current-main runs separated the shared topology-ratchet failure from the independent generated-receipt binding failure.",
              },
              {
                  "gate": "artifact-byte-capture",
                  "outcome": "PASS",
                  "reason": "A read-only GitHub Actions diagnostic captured exact repository bytes and SHA-256 values from the checked-out revision.",
              },
              {
                  "gate": "historical-receipt-preservation",
                  "outcome": "PASS",
                  "reason": "The 2026-08-09 receipt remains unchanged; this record is a successor binding rather than an in-place rewrite.",
              },
              {
                  "gate": "topology-ratchet-transition",
                  "outcome": "PASS",
                  "reason": "The baseline transition removes stale evidence and strictly shrinks one inherited scaffold finding; no waiver expands.",
              },
              {
                  "gate": "hosted-exact-head-validation",
                  "outcome": "SKIPPED",
                  "reason": "Pending the corrective draft pull request and its exact-head GitHub Actions.",
              },
          ]
          receipt["policy_decisions"] = [
              "repo:docs/adr/ADR-0029-adopt-directory-governance-standard-v2.md@860fc390ffa303785d3d6c726571265175f6cc0f",
              "repo:data/receipts/generated/README.md@860fc390ffa303785d3d6c726571265175f6cc0f",
          ]
          receipt["citations"] = [
              {
                  "id": "CURRENT-MAIN-FAILURE",
                  "validated": True,
                  "evidence_ref": "repo:main@860fc390ffa303785d3d6c726571265175f6cc0f",
              },
              {
                  "id": "PRIOR-RECEIPT",
                  "validated": True,
                  "evidence_ref": "repo:data/receipts/generated/genrec-publication-deny-dry-run-20260809.json@860fc390ffa303785d3d6c726571265175f6cc0f",
              },
              {
                  "id": "READ-ONLY-DIAGNOSTIC",
                  "validated": True,
                  "evidence_ref": "actions:run/31843457018/artifact/9235069108",
              },
          ]
          receipt["human_review"] = {
              "reviewer_ids": [],
              "state": "pending",
              "timestamp": None,
          }
          receipt["override_record"] = None
          receipt["created_at"] = "2026-08-14T21:45:00Z"
          receipt["emitter"] = "OpenAI GPT-5.6 Pro via ChatGPT GitHub connector"
          receipt["links"] = {
              "pr_number": None,
              "adr_link": "docs/adr/ADR-0029-adopt-directory-governance-standard-v2.md",
              "drift_register_entry": None,
          }
          receipt["notes"] = (
              "Successor authoring receipt for the fixture-only publication-denial dry run. "
              "It preserves the 2026-08-09 receipt unchanged, rebinds the current workflow "
              "and Makefile bytes, and creates no evidence, policy, review, promotion, release, "
              "rollback, deployment, or publication authority."
          )
          successor_path.write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Validate before commit
        shell: bash
        run: |
          set -euo pipefail
          export KFM_TRUSTED_BASE_REF="${CURRENT_MAIN}"
          python tools/validators/directory_governance/validate_repository_topology.py \
            --repo-root . --format text
          python tools/validators/validate_adr_index.py
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-publication-deny-dry-run-integrity-20260814.json
          python -m unittest tests.release.test_publication_deny_dry_run -v
          git diff --check

      - name: Commit and push only the corrective branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kfm-ci-integrity-repair"
          git config user.email "noreply@github.com"
          git add -A
          git diff --cached --name-status
          git commit -m "ci: restore repository integrity ratchets"
          git push origin "HEAD:${TARGET_BRANCH}"

# Temporary, read-only diagnostic used to identify exact current-main integrity drift.
# This workflow is isolated to the diagnostic branch and will not be merged again.
name: ci-integrity-diagnostic

"on":
  push:
    branches:
      - agent/restore-main-integrity-20260814
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-integrity-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture topology, receipt, and source evidence
        env:
          KFM_NO_NETWORK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          TZ: UTC
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/kfm-ci-integrity"
          src="${out}/source-files"
          mkdir -p "${src}"

          git rev-parse HEAD > "${out}/current-head.txt"
          cp tools/validators/directory_governance/repository_topology_baseline.json \
            "${out}/repository-topology-baseline-current.json"

          set +e
          python3 tools/validators/directory_governance/validate_repository_topology.py \
            --repo-root . --format json \
            > "${out}/repository-topology-report.json" \
            2> "${out}/repository-topology-report.stderr.txt"
          printf '%s\n' "$?" > "${out}/repository-topology-report.exit.txt"
          python3 tools/validators/directory_governance/validate_repository_topology.py \
            --repo-root . --emit-baseline \
            > "${out}/repository-topology-candidate.json" \
            2> "${out}/repository-topology-candidate.stderr.txt"
          printf '%s\n' "$?" > "${out}/repository-topology-candidate.exit.txt"
          set -e

          paths=(
            ".github/workflows/release-dry-run.yml"
            "Makefile"
            "tests/release/README.md"
            "tests/release/launch/README.md"
            "fixtures/control_plane/generated_receipt/valid.json"
            "fixtures/control_plane/generated_receipt/invalid.json"
            "data/receipts/generated/genrec-publication-deny-dry-run-20260809.json"
            "docs/adr/ADR-0035-repository-wide-adr-identity-numbering-and-domain-indexing.md"
            "docs/adr/INDEX.md"
            "docs/adr/README.md"
            "docs/domains/README.md"
            "docs/doctrine/README.md"
            "data/receipts/generated/genrec-adr-0035-repository-wide-adr-identity-numbering-86fb7b02.json"
            "docs/governed-ai/README.md"
            "docs/governed-ai/.gitkeep"
          )

          : > "${out}/target-artifact-status.tsv"
          for path in "${paths[@]}"; do
            if [[ -f "${path}" ]]; then
              digest="$(sha256sum "${path}" | awk '{print $1}')"
              blob="$(git ls-files -s -- "${path}" | awk '{print $2}')"
              printf 'PRESENT\t%s\t%s\t%s\n' "${path}" "${digest}" "${blob}" \
                >> "${out}/target-artifact-status.tsv"
              cp --parents "${path}" "${src}"
            else
              printf 'MISSING\t%s\t-\t-\n' "${path}" \
                >> "${out}/target-artifact-status.tsv"
            fi
          done

      - name: Retain exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-integrity-diagnostic-branch
          path: ${{ runner.temp }}/kfm-ci-integrity
          retention-days: 3
          if-no-files-found: error

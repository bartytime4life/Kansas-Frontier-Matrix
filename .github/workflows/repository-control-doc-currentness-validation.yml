# Temporary read-only hosted validation harness for the repository-control
# documentation-currentness branch. Jobs check out immutable base/candidate
# SHAs; validation-branch repository code is not executed.
#
# No secrets, OIDC, write permissions, pull-request mutation, settings,
# release, deployment, promotion, publication, or source-state authority.

name: repository-control-doc-currentness-validation

"on":
  push:
    branches:
      - validation/repository-control-doc-currentness-b790c79

permissions:
  contents: read

concurrency:
  group: repository-control-doc-currentness-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_TARGET_SHA: "ca40797237374dc0400065805bbadb739eb25890"
  KFM_TRUSTED_BASE_REF: "7c5d4125c277536258be6345e366efae59dbe5d6"
  KFM_DOC_BLOB: "6bcb1ca8a64be7d4600ee8d53aab9f09eaececbd"
  KFM_TEST_BLOB: "216e5e0f1d3e6446a42858ea1e0e50c3a2bae87e"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  focused-currentness:
    name: focused-currentness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact identity, ancestry, scope, and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${KFM_TARGET_SHA}"
          test "$(git merge-base "${KFM_TRUSTED_BASE_REF}" HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          git diff --check "${KFM_TRUSTED_BASE_REF}...HEAD"
          git diff --name-only "${KFM_TRUSTED_BASE_REF}...HEAD" | sort > /tmp/actual-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md
          tests/validators/test_repository_control_strict_input.py
          EOF
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          test "$(git hash-object docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md)" = "${KFM_DOC_BLOB}"
          test "$(git hash-object tests/validators/test_repository_control_strict_input.py)" = "${KFM_TEST_BLOB}"

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run focused currentness and repository-control regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tests/validators/test_repository_control_strict_input.py \
            tools/validators/repository_control/fetch_bounded_issue_comments.py
          python -m pytest \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py \
            -q

      - name: Validate registry, schemas, and workflow security
        shell: bash
        run: |
          set -euo pipefail
          make validator-registry-check
          make schemas
          make workflow-security

      - name: Record focused boundary
        if: always()
        shell: bash
        run: |
          {
            echo '### Repository-control documentation-currentness validation'
            echo
            echo "- Exact candidate: \`${KFM_TARGET_SHA}\`."
            echo "- Trusted base: \`${KFM_TRUSTED_BASE_REF}\`."
            echo "- Governance blob: \`${KFM_DOC_BLOB}\`; coupled-test blob: \`${KFM_TEST_BLOB}\`."
            echo '- Scope: exact ancestry, two-path diff, declared-length currentness, expired-authorization currentness, focused repository-control regressions, registry, schemas, and workflow security.'
            echo '- Permissions: read-only contents; no secrets, OIDC, PR mutation, settings, release, deployment, promotion, publication, or source-state authority.'
          } >> "${GITHUB_STEP_SUMMARY}"

  paired-repository-topology:
    name: paired-repository-topology
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TRUSTED_BASE_REF }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TARGET_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact paired identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          test "$(git -C candidate rev-parse HEAD)" = "${KFM_TARGET_SHA}"
          test "$(git -C candidate merge-base "${KFM_TRUSTED_BASE_REF}" HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          git -C candidate diff --check "${KFM_TRUSTED_BASE_REF}...HEAD"

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        working-directory: candidate
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run paired repository-topology diagnostic
        id: paired
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p topology-diagnostic
          set +e
          (cd base && make repository-topology) > topology-diagnostic/base.log 2>&1
          base_rc=$?
          (cd candidate && make repository-topology) > topology-diagnostic/candidate.log 2>&1
          candidate_rc=$?
          set -e

          BASE_RC="${base_rc}" CANDIDATE_RC="${candidate_rc}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('topology-diagnostic')
          marker = 'AssertionError: 0 != 1 : '

          def read(name):
              return (root / name).read_text(encoding='utf-8', errors='replace')

          def report(text):
              for line in text.splitlines():
                  if marker in line:
                      return json.loads(line.split(marker, 1)[1])
              return None

          def failed_tests(text):
              return sorted(
                  line.removeprefix('FAIL: ').strip()
                  for line in text.splitlines()
                  if line.startswith('FAIL: ')
              )

          def signature(text, return_code):
              value = report(text)
              result = {
                  'return_code': return_code,
                  'failed_tests': failed_tests(text),
                  'report_present': value is not None,
              }
              if value is not None:
                  result.update({
                      'outcome': value.get('outcome'),
                      'rule_count': value.get('rule_count'),
                      'counts': value.get('counts'),
                      'stale_fingerprints': sorted(
                          value.get('baseline', {}).get('stale_fingerprints', [])
                      ),
                      'non_baselined_findings': sorted(
                          (
                              finding.get('disposition'),
                              finding.get('rule_id'),
                              finding.get('subject'),
                              finding.get('fingerprint'),
                              finding.get('evidence_sha256'),
                          )
                          for finding in value.get('findings', [])
                          if finding.get('disposition') != 'BASELINED_WARNING'
                      ),
                  })
              return result, value

          base_rc = int(os.environ['BASE_RC'])
          candidate_rc = int(os.environ['CANDIDATE_RC'])
          base_signature, base_report = signature(read('base.log'), base_rc)
          candidate_signature, candidate_report = signature(
              read('candidate.log'), candidate_rc
          )
          signatures_equal = base_signature == candidate_signature

          if base_rc == 0 and candidate_rc == 0:
              classification = 'BOTH_PASS'
          elif base_rc != 0 and candidate_rc == 0:
              classification = 'CANDIDATE_REPAIRS_BASE'
          elif base_rc == 0 and candidate_rc != 0:
              classification = 'CANDIDATE_REGRESSION'
          elif signatures_equal:
              classification = 'INHERITED_EQUIVALENT_FAILURE'
          else:
              classification = 'BOTH_FAIL_DIFFERENT_SIGNATURE'

          base_tracked = base_report.get('tracked_path_count') if base_report else None
          candidate_tracked = (
              candidate_report.get('tracked_path_count') if candidate_report else None
          )
          result = {
              'trusted_base_sha': os.environ['KFM_TRUSTED_BASE_REF'],
              'candidate_sha': os.environ['KFM_TARGET_SHA'],
              'base_exit_code': base_rc,
              'candidate_exit_code': candidate_rc,
              'failure_signatures_equal': signatures_equal,
              'base_tracked_path_count': base_tracked,
              'candidate_tracked_path_count': candidate_tracked,
              'tracked_path_count_delta': (
                  candidate_tracked - base_tracked
                  if isinstance(base_tracked, int) and isinstance(candidate_tracked, int)
                  else None
              ),
              'classification': classification,
          }
          (root / 'result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(
                  f"classification={classification}\n"
                  f"base_rc={base_rc}\n"
                  f"candidate_rc={candidate_rc}\n"
                  f"signatures_equal={'true' if signatures_equal else 'false'}\n"
                  f"tracked_delta={result['tracked_path_count_delta']}\n"
              )
          PY

          cat topology-diagnostic/result.json

      - name: Record paired attribution boundary
        if: always()
        shell: bash
        run: |
          {
            echo '### Paired repository-topology attribution'
            echo
            echo "- Trusted base: \`${KFM_TRUSTED_BASE_REF}\`."
            echo "- Candidate: \`${KFM_TARGET_SHA}\`."
            echo "- Base exit: \`${{ steps.paired.outputs.base_rc }}\`; candidate exit: \`${{ steps.paired.outputs.candidate_rc }}\`."
            echo "- Failure signatures equal: \`${{ steps.paired.outputs.signatures_equal }}\`."
            echo "- Tracked-path delta: \`${{ steps.paired.outputs.tracked_delta }}\`."
            echo "- Classification: \`${{ steps.paired.outputs.classification }}\`."
            echo '- The harness is diagnostic only and grants no integration, release, deployment, promotion, publication, or settings authority.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail closed on candidate-specific topology fallout
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.paired.outputs.classification }}" in
            BOTH_PASS|CANDIDATE_REPAIRS_BASE|INHERITED_EQUIVALENT_FAILURE)
              exit 0
              ;;
            *)
              exit 1
              ;;
          esac

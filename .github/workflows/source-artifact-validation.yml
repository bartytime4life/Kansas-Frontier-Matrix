# Validate the proposed fixture-first SourceArtifact profile.
#
# This workflow is read-only and no-network at test time. It proves bounded
# schema shape, deterministic identity, safe locator posture, temporal and
# lineage rules, exact synthetic byte binding, and a local reference CAS.
# It does not admit or activate a source, resolve evidence, mutate lifecycle
# state, release, deploy, or publish.
name: source-artifact-validation

"on":
  pull_request:
    paths:
      - ".github/workflows/source-artifact-validation.yml"
      - "schemas/contracts/v1/source/source_artifact.schema.json"
      - "fixtures/contracts/v1/source/source_artifact/**"
      - "tools/validators/validate_source_artifact.py"
      - "tools/source_artifacts/**"
      - "tests/validators/test_validate_source_artifact.py"
      - "data/receipts/generated/genrec-source-artifact-validation-*.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/source-artifact-validation.yml"
      - "schemas/contracts/v1/source/source_artifact.schema.json"
      - "fixtures/contracts/v1/source/source_artifact/**"
      - "tools/validators/validate_source_artifact.py"
      - "tools/source_artifacts/**"
      - "tests/validators/test_validate_source_artifact.py"
      - "data/receipts/generated/genrec-source-artifact-validation-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-artifact-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-source-artifacts:
    name: validate-source-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        shell: bash
        run: python -m pip install -e ".[test]"

      - name: Run focused no-network SourceArtifact tests
        shell: bash
        run: |
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_source_artifact.py' \
            --verbose

      - name: Validate exact fixture polarity and byte binding
        shell: bash
        run: python tools/validators/validate_source_artifact.py --fixtures

      - name: Validate schema against Draft 2020-12 meta-schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          path = Path("schemas/contracts/v1/source/source_artifact.schema.json")
          Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
          PY

      - name: Record SourceArtifact boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### SourceArtifact fixture profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed proposed schema, deterministic identity, safe locator posture, temporal and correction/conflict lineage, exact synthetic byte binding, and local reference content-addressed storage."
            echo "- Non-effects: no source admission or activation, EvidenceBundle closure, lifecycle mutation, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

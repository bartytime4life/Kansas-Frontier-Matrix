# Validate the fixture-only IndicatorDefinition candidate.
name: indicator-definition

"on":
  pull_request:
    paths:
      - ".github/workflows/indicator-definition.yml"
      - "contracts/evidence/indicator_definition.md"
      - "schemas/contracts/v1/evidence/indicator_definition.schema.json"
      - "fixtures/contracts/v1/evidence/indicator_definition/**"
      - "tools/validators/evidence/validate_indicator_definition.py"
      - "tests/validators/evidence/test_validate_indicator_definition.py"
      - "docs/intake/exploratory/indicator-definition-source-map.md"
      - "contracts/evidence/analytic_output_disclosure_assessment.md"
      - "contracts/evidence/environmental_indicator_evidence_bundle_profile.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-indicator-definition-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/indicator-definition.yml"
      - "contracts/evidence/indicator_definition.md"
      - "schemas/contracts/v1/evidence/indicator_definition.schema.json"
      - "fixtures/contracts/v1/evidence/indicator_definition/**"
      - "tools/validators/evidence/validate_indicator_definition.py"
      - "tests/validators/evidence/test_validate_indicator_definition.py"
      - "docs/intake/exploratory/indicator-definition-source-map.md"
      - "contracts/evidence/analytic_output_disclosure_assessment.md"
      - "contracts/evidence/environmental_indicator_evidence_bundle_profile.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-indicator-definition-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indicator-definition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-indicator-definition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused and adjacent deterministic tests
        run: |
          python -m unittest -v tests.validators.evidence.test_validate_indicator_definition
          python -m unittest -v tests.validators.evidence.test_validate_analytic_output_disclosure_assessment
          python tools/validators/evidence/validate_indicator_definition.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-indicator-definition-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### IndicatorDefinition"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only indicator components, denominator, missing-data, normalization, support, disclosure, and identity validation."
            echo "- Boundary: no formula execution, indicator computation, evidence resolution, threshold activation, policy evaluation, review approval, promotion, release, public use, publication, or deployment authority."
          } >> "$GITHUB_STEP_SUMMARY"

name: database-mutation-transaction-receipt

"on":
  pull_request:
    paths:
      - ".github/workflows/database-mutation-transaction-receipt.yml"
      - "contracts/runtime/database_mutation_transaction_receipt.md"
      - "schemas/contracts/v1/runtime/database_mutation_transaction_receipt.schema.json"
      - "schemas/contracts/v1/runtime/run_receipt.schema.json"
      - "fixtures/contracts/v1/runtime/database_mutation_transaction_receipt/**"
      - "tools/validators/runtime/validate_database_mutation_transaction_receipt.py"
      - "tests/validators/test_validate_database_mutation_transaction_receipt.py"
      - "docs/intake/exploratory/pass-18-database-mutation-transaction-source-map.md"
      - "data/receipts/generated/genrec-pass18-database-mutation-transaction-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/database-mutation-transaction-receipt.yml"
      - "contracts/runtime/database_mutation_transaction_receipt.md"
      - "schemas/contracts/v1/runtime/database_mutation_transaction_receipt.schema.json"
      - "schemas/contracts/v1/runtime/run_receipt.schema.json"
      - "fixtures/contracts/v1/runtime/database_mutation_transaction_receipt/**"
      - "tools/validators/runtime/validate_database_mutation_transaction_receipt.py"
      - "tests/validators/test_validate_database_mutation_transaction_receipt.py"
      - "docs/intake/exploratory/pass-18-database-mutation-transaction-source-map.md"
      - "data/receipts/generated/genrec-pass18-database-mutation-transaction-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-mutation-transaction-receipt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-database-mutation-transaction-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/runtime/validate_database_mutation_transaction_receipt.py tests/validators/test_validate_database_mutation_transaction_receipt.py
          python -m unittest tests.validators.test_validate_database_mutation_transaction_receipt --verbose
          python tools/validators/runtime/validate_database_mutation_transaction_receipt.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass18-database-mutation-transaction-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Database mutation transaction receipt candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only RunReceipt linkage, UTC boundary, finite outcome, row-count, and recovery-target validation."
            echo "- Boundary: no database connection, SQL execution, transaction, restore, policy or review decision, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

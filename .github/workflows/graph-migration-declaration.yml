# Validate the fixture-only graph migration declaration profile.
# This workflow performs no graph access, query, migration, release, or publication action.
name: graph-migration-declaration

"on":
  pull_request:
    paths:
      - ".github/workflows/graph-migration-declaration.yml"
      - "contracts/governance/graph_migration_declaration.md"
      - "schemas/contracts/v1/governance/graph_migration_declaration.schema.json"
      - "fixtures/contracts/v1/governance/graph_migration_declaration/**"
      - "tools/validators/governance/validate_graph_migration_declaration.py"
      - "tests/validators/governance/test_graph_migration_declaration.py"
      - "docs/intake/exploratory/pass-30-graph-migration-declaration-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-graph-migration-declaration-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/graph-migration-declaration.yml"
      - "contracts/governance/graph_migration_declaration.md"
      - "schemas/contracts/v1/governance/graph_migration_declaration.schema.json"
      - "fixtures/contracts/v1/governance/graph_migration_declaration/**"
      - "tools/validators/governance/validate_graph_migration_declaration.py"
      - "tests/validators/governance/test_graph_migration_declaration.py"
      - "docs/intake/exploratory/pass-30-graph-migration-declaration-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-graph-migration-declaration-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph-migration-declaration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-graph-migration-declaration:
    name: validate-graph-migration-declaration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e .

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators/governance \
            --pattern 'test_graph_migration_declaration.py' \
            --verbose

      - name: Replay exact fixture polarity
        run: python tools/validators/governance/validate_graph_migration_declaration.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass30-graph-migration-declaration-20260809.json

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### GraphMigrationDeclaration"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic declaration shape, bounded semantics, deterministic identity, and fail-closed non-authority flags."
            echo "- Tests perform no graph access, query, migration, policy, review, release, or publication operation."
            echo "- A green result does not select a store or runner, execute a change, approve review, release, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

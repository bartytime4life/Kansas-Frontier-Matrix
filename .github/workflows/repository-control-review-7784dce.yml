# Temporary read-only exact-head review harness for repository-control candidate
# 7784dce3a6b3dab59eb054b60b6139074e906b94. This workflow grants no pull-
# request, merge, settings, release, deployment, promotion, publication, source-
# activation, Stage 1B, Stage 2, topology-binding, or MapLibre authority.

name: repository-control-review-7784dce

"on":
  push:
    branches:
      - validation/repository-control-review-7784dce

permissions:
  contents: read

concurrency:
  group: repository-control-review-7784dce-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_TRUSTED_BASE_REF: "bd942b45493fa5f80e946ecfb3e810e413787394"
  KFM_TARGET_SHA: "7784dce3a6b3dab59eb054b60b6139074e906b94"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  exact-head-review:
    name: exact-head-review-7784dce
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact identity ancestry scope and whitespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${KFM_TARGET_SHA}"
          git merge-base --is-ancestor "${KFM_TRUSTED_BASE_REF}" HEAD
          test "$(git merge-base "${KFM_TRUSTED_BASE_REF}" HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          git diff --check "${KFM_TRUSTED_BASE_REF}...HEAD"
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/repository-control.yml',
              'docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md',
              'tests/validators/test_repository_control_input_bounds.py',
              'tests/validators/test_repository_control_source.py',
              'tests/validators/test_repository_control_strict_input.py',
              'tools/validators/repository_control/fetch_bounded_issue_comments.py',
              'tools/validators/repository_control/validate_control_source_availability.py',
          }
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f"{subprocess.check_output(['git', 'merge-base', '${KFM_TRUSTED_BASE_REF}', 'HEAD'], text=True).strip()}...HEAD"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  'unexpected candidate scope\n'
                  f'missing={sorted(expected - actual)}\n'
                  f'extra={sorted(actual - expected)}'
              )
          PY

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Compile and parse changed control surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            tools/validators/repository_control/fetch_bounded_issue_comments.py \
            tools/validators/repository_control/validate_control_source_availability.py \
            tools/validators/repository_control/validate_transition_authorization.py \
            tests/validators/test_repository_control_input_bounds.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_transition_authorization.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          value = yaml.safe_load(
              Path('.github/workflows/repository-control.yml').read_text(encoding='utf-8')
          )
          if not isinstance(value, dict) or value.get('name') != 'repository-control':
              raise SystemExit('repository-control workflow parse/name mismatch')
          PY

      - name: Run complete bounded review matrix
        id: matrix
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p review-evidence

          run_check() {
            local name="$1"
            shift
            set +e
            "$@" > "review-evidence/${name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "${rc}" > "review-evidence/${name}.rc"
            echo "--- ${name} (exit ${rc}) ---"
            cat "review-evidence/${name}.log"
          }

          set -e
          run_check focused pytest -q \
            tests/validators/test_repository_control_input_bounds.py \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py
          run_check registry make validator-registry-check
          run_check schemas make schemas
          run_check workflow-security make workflow-security

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('review-evidence')
          checks = {
              name: int((root / f'{name}.rc').read_text(encoding='utf-8').strip())
              for name in ('focused', 'registry', 'schemas', 'workflow-security')
          }
          result = {
              'trusted_base_sha': 'bd942b45493fa5f80e946ecfb3e810e413787394',
              'candidate_sha': '7784dce3a6b3dab59eb054b60b6139074e906b94',
              'checks': checks,
              'all_pass': all(code == 0 for code in checks.values()),
          }
          (root / 'result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          with Path(__import__('os').environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"all_pass={'true' if result['all_pass'] else 'false'}\n")
          PY

      - name: Upload exact-head review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-control-review-7784dce
          path: review-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce exact-head review result
        shell: bash
        run: test "${{ steps.matrix.outputs.all_pass }}" = "true"

  paired-repository-topology:
    name: paired-repository-topology-7784dce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TRUSTED_BASE_REF }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TARGET_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify paired identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          test "$(git -C candidate rev-parse HEAD)" = "${KFM_TARGET_SHA}"
          git -C candidate merge-base --is-ancestor "${KFM_TRUSTED_BASE_REF}" HEAD

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        working-directory: candidate
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run paired topology and classify
        id: paired
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p topology-evidence
          set +e
          (cd base && make repository-topology) > topology-evidence/base.log 2>&1
          base_rc=$?
          (cd candidate && make repository-topology) > topology-evidence/candidate.log 2>&1
          candidate_rc=$?
          set -e
          BASE_RC="${base_rc}" CANDIDATE_RC="${candidate_rc}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('topology-evidence')
          base = (root / 'base.log').read_text(encoding='utf-8', errors='replace')
          candidate = (root / 'candidate.log').read_text(encoding='utf-8', errors='replace')
          workspace = str(Path.cwd().resolve())
          for old in (f'{workspace}/base', f'{workspace}/candidate'):
              base = base.replace(old, '<WORKTREE>')
              candidate = candidate.replace(old, '<WORKTREE>')
          base_rc = int(os.environ['BASE_RC'])
          candidate_rc = int(os.environ['CANDIDATE_RC'])
          equal = base == candidate
          if base_rc == candidate_rc == 0:
              classification = 'BOTH_PASS'
          elif base_rc != 0 and candidate_rc == 0:
              classification = 'CANDIDATE_REPAIRS_BASE'
          elif base_rc == 0 and candidate_rc != 0:
              classification = 'CANDIDATE_REGRESSION'
          elif equal:
              classification = 'INHERITED_EQUIVALENT_FAILURE'
          else:
              classification = 'BOTH_FAIL_DIFFERENT_OUTPUT'
          result = {
              'base_exit_code': base_rc,
              'candidate_exit_code': candidate_rc,
              'normalized_outputs_equal': equal,
              'classification': classification,
              'base_sha256': hashlib.sha256(base.encode()).hexdigest(),
              'candidate_sha256': hashlib.sha256(candidate.encode()).hexdigest(),
          }
          (root / 'result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"classification={classification}\n")
          PY

      - name: Upload paired-topology evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-topology-review-7784dce
          path: topology-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on candidate-specific topology failure
        shell: bash
        run: |
          case "${{ steps.paired.outputs.classification }}" in
            BOTH_PASS|CANDIDATE_REPAIRS_BASE|INHERITED_EQUIVALENT_FAILURE) exit 0 ;;
            *) exit 1 ;;
          esac

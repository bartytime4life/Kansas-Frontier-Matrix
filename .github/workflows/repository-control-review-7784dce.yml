# Temporary read-only exact-head review harness for repository-control candidate
# 7784dce3a6b3dab59eb054b60b6139074e906b94. This workflow grants no pull-
# request, merge, settings, release, deployment, promotion, publication, source-
# activation, Stage 1B, Stage 2, topology-binding, or MapLibre authority.

name: repository-control-review-7784dce

"on":
  push:
    branches:
      - validation/repository-control-review-7784dce

permissions:
  contents: read

concurrency:
  group: repository-control-review-7784dce-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_TRUSTED_BASE_REF: "bd942b45493fa5f80e946ecfb3e810e413787394"
  KFM_TARGET_SHA: "7784dce3a6b3dab59eb054b60b6139074e906b94"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  exact-head-review:
    name: exact-head-review-7784dce
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact identity ancestry scope and whitespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${KFM_TARGET_SHA}"
          git merge-base --is-ancestor "${KFM_TRUSTED_BASE_REF}" HEAD
          test "$(git merge-base "${KFM_TRUSTED_BASE_REF}" HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          git diff --check "${KFM_TRUSTED_BASE_REF}...HEAD"
          python - <<'PY'
          import os
          import subprocess

          expected = {
              '.github/workflows/repository-control.yml',
              'docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md',
              'tests/validators/test_repository_control_input_bounds.py',
              'tests/validators/test_repository_control_source.py',
              'tests/validators/test_repository_control_strict_input.py',
              'tools/validators/repository_control/fetch_bounded_issue_comments.py',
              'tools/validators/repository_control/validate_control_source_availability.py',
          }
          base = os.environ['KFM_TRUSTED_BASE_REF']
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{base}...HEAD'], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  'unexpected candidate scope\n'
                  f'missing={sorted(expected - actual)}\n'
                  f'extra={sorted(actual - expected)}'
              )
          PY

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Compile and parse changed control surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            tools/validators/repository_control/fetch_bounded_issue_comments.py \
            tools/validators/repository_control/validate_control_source_availability.py \
            tools/validators/repository_control/validate_transition_authorization.py \
            tests/validators/test_repository_control_input_bounds.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_transition_authorization.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          value = yaml.safe_load(
              Path('.github/workflows/repository-control.yml').read_text(encoding='utf-8')
          )
          if not isinstance(value, dict) or value.get('name') != 'repository-control':
              raise SystemExit('repository-control workflow parse/name mismatch')
          PY

      - name: Run complete bounded review matrix
        id: matrix
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p review-evidence

          run_check() {
            local name="$1"
            shift
            set +e
            "$@" > "review-evidence/${name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "${rc}" > "review-evidence/${name}.rc"
            echo "--- ${name} (exit ${rc}) ---"
            cat "review-evidence/${name}.log"
          }

          set -e
          run_check focused pytest -q \
            tests/validators/test_repository_control_input_bounds.py \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py
          run_check registry make validator-registry-check
          run_check schemas make schemas
          run_check workflow-security make workflow-security

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('review-evidence')
          checks = {
              name: int((root / f'{name}.rc').read_text(encoding='utf-8').strip())
              for name in ('focused', 'registry', 'schemas', 'workflow-security')
          }
          result = {
              'trusted_base_sha': os.environ['KFM_TRUSTED_BASE_REF'],
              'candidate_sha': os.environ['KFM_TARGET_SHA'],
              'checks': checks,
              'all_pass': all(code == 0 for code in checks.values()),
          }
          (root / 'result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"all_pass={'true' if result['all_pass'] else 'false'}\n")
          PY

      - name: Upload exact-head review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-control-review-7784dce
          path: review-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce exact-head review result
        shell: bash
        run: test "${{ steps.matrix.outputs.all_pass }}" = "true"

  paired-repository-topology:
    name: paired-repository-topology-7784dce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TRUSTED_BASE_REF }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KFM_TARGET_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify paired identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          test "$(git -C candidate rev-parse HEAD)" = "${KFM_TARGET_SHA}"
          git -C candidate merge-base --is-ancestor "${KFM_TRUSTED_BASE_REF}" HEAD
          test "$(git -C candidate merge-base "${KFM_TRUSTED_BASE_REF}" HEAD)" = "${KFM_TRUSTED_BASE_REF}"
          git -C candidate diff --check "${KFM_TRUSTED_BASE_REF}...HEAD"

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        working-directory: candidate
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run paired topology and classify
        id: paired
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p topology-evidence
          set +e
          (cd base && make repository-topology) > topology-evidence/base.raw.log 2>&1
          base_rc=$?
          (cd candidate && make repository-topology) > topology-evidence/candidate.raw.log 2>&1
          candidate_rc=$?
          set -e
          BASE_RC="${base_rc}" CANDIDATE_RC="${candidate_rc}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('topology-evidence')
          workspace = Path.cwd().resolve()
          base_sha = os.environ['KFM_TRUSTED_BASE_REF']
          candidate_sha = os.environ['KFM_TARGET_SHA']
          base_rc = int(os.environ['BASE_RC'])
          candidate_rc = int(os.environ['CANDIDATE_RC'])

          def raw_text(name: str) -> str:
              return (root / name).read_text(encoding='utf-8', errors='replace')

          def normalize(text: str) -> str:
              replacements = (
                  (str(workspace / 'base'), '<WORKTREE>'),
                  (str(workspace / 'candidate'), '<WORKTREE>'),
                  (str(workspace), '<GITHUB_WORKSPACE>'),
                  (candidate_sha, '<CANDIDATE_SHA>'),
                  (base_sha, '<BASE_SHA>'),
              )
              for old, new in replacements:
                  text = text.replace(old, new)
              return text

          def report_from(text: str):
              marker = 'AssertionError: 0 != 1 : '
              for line in text.splitlines():
                  if marker in line:
                      return json.loads(line.split(marker, 1)[1])
              return None

          def failed_tests(text: str):
              return sorted(
                  line.removeprefix('FAIL: ').strip()
                  for line in text.splitlines()
                  if line.startswith('FAIL: ')
              )

          def failure_signature(text: str, return_code: int):
              report = report_from(text)
              signature = {
                  'return_code': return_code,
                  'failed_tests': failed_tests(text),
                  'report_present': report is not None,
              }
              if report is not None:
                  signature.update(
                      {
                          'outcome': report.get('outcome'),
                          'rule_count': report.get('rule_count'),
                          'counts': report.get('counts'),
                          'stale_fingerprints': sorted(
                              report.get('baseline', {}).get('stale_fingerprints', [])
                          ),
                          'non_baselined_findings': sorted(
                              (
                                  finding.get('disposition'),
                                  finding.get('rule_id'),
                                  finding.get('subject'),
                                  finding.get('fingerprint'),
                                  finding.get('evidence_sha256'),
                              )
                              for finding in report.get('findings', [])
                              if finding.get('disposition') != 'BASELINED_WARNING'
                          ),
                      }
                  )
              return signature, report

          base_raw = raw_text('base.raw.log')
          candidate_raw = raw_text('candidate.raw.log')
          base_text = normalize(base_raw)
          candidate_text = normalize(candidate_raw)
          (root / 'base.normalized.log').write_text(base_text, encoding='utf-8')
          (root / 'candidate.normalized.log').write_text(candidate_text, encoding='utf-8')

          base_signature, base_report = failure_signature(base_raw, base_rc)
          candidate_signature, candidate_report = failure_signature(candidate_raw, candidate_rc)
          signatures_equal = base_signature == candidate_signature

          if base_rc == 0 and candidate_rc == 0:
              classification = 'BOTH_PASS'
          elif base_rc != 0 and candidate_rc == 0:
              classification = 'CANDIDATE_REPAIRS_BASE'
          elif base_rc == 0 and candidate_rc != 0:
              classification = 'CANDIDATE_REGRESSION'
          elif signatures_equal:
              classification = 'INHERITED_EQUIVALENT_FAILURE'
          else:
              classification = 'BOTH_FAIL_DIFFERENT_SIGNATURE'

          result = {
              'trusted_base_sha': base_sha,
              'candidate_sha': candidate_sha,
              'base_exit_code': base_rc,
              'candidate_exit_code': candidate_rc,
              'failure_signatures_equal': signatures_equal,
              'classification': classification,
              'base_signature_sha256': hashlib.sha256(
                  json.dumps(base_signature, sort_keys=True, separators=(',', ':')).encode()
              ).hexdigest(),
              'candidate_signature_sha256': hashlib.sha256(
                  json.dumps(candidate_signature, sort_keys=True, separators=(',', ':')).encode()
              ).hexdigest(),
          }
          (root / 'base.failure-signature.json').write_text(
              json.dumps(base_signature, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (root / 'candidate.failure-signature.json').write_text(
              json.dumps(candidate_signature, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (root / 'result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"classification={classification}\n")
          PY

      - name: Upload paired-topology evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-topology-review-7784dce
          path: topology-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on candidate-specific topology failure
        shell: bash
        run: |
          case "${{ steps.paired.outputs.classification }}" in
            BOTH_PASS|CANDIDATE_REPAIRS_BASE|INHERITED_EQUIVALENT_FAILURE) exit 0 ;;
            *) exit 1 ;;
          esac

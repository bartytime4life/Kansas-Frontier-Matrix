# Validate DecisionEnvelope schema and semantic conformance.
name: decision-envelope

"on":
  pull_request:
    paths:
      - ".github/workflows/decision-envelope.yml"
      - "contracts/runtime/decision_envelope.md"
      - "contracts/runtime/decision_envelope/**"
      - "schemas/contracts/v1/runtime/decision_envelope.schema.json"
      - "fixtures/contracts/v1/runtime/decision_envelope/**"
      - "tools/validators/validate_decision_envelope.py"
      - "tools/validators/_common/**"
      - "tests/validators/test_validate_decision_envelope.py"
      - "data/receipts/generated/genrec-decision-envelope-validation-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/decision-envelope.yml"
      - "contracts/runtime/decision_envelope.md"
      - "contracts/runtime/decision_envelope/**"
      - "schemas/contracts/v1/runtime/decision_envelope.schema.json"
      - "fixtures/contracts/v1/runtime/decision_envelope/**"
      - "tools/validators/validate_decision_envelope.py"
      - "tools/validators/_common/**"
      - "tests/validators/test_validate_decision_envelope.py"
      - "data/receipts/generated/genrec-decision-envelope-validation-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-envelope-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-decision-envelope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"

      - name: Run deterministic no-network validation
        run: |
          set -euo pipefail
          python -m unittest discover             --start-directory tests/validators             --pattern 'test_validate_decision_envelope.py'             --verbose
          python tools/validators/validate_decision_envelope.py --fixtures

      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py             data/receipts/generated/genrec-decision-envelope-validation-20260807.json             --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### DecisionEnvelope validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: current schema, alias consistency, bounded text, evidence-reference safety, negative-outcome non-disclosure, temporal ordering, optional digest/version syntax, parser hardening, and exact fixture polarity."
            echo "- Boundary: a green result does not resolve evidence, evaluate policy, authenticate review, authorize an action, establish release state, publish, or permit public use."
          } >> "$GITHUB_STEP_SUMMARY"

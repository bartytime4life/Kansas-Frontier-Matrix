# Temporary self-removing branch writer and validation harness.
# Authorized by issue #4228 comment 5534365447 for this exact non-default branch.
name: bootstrap-maplibre-fixture-3d-lab

on:
  push:
    branches:
      - feat/maplibre-fixture-3d-lab-20260903

permissions:
  contents: write

concurrency:
  group: bootstrap-maplibre-fixture-3d-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-and-push:
    name: build-test-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      COREPACK_ENABLE_STRICT: "1"
      KFM_NO_NETWORK: "1"
      NODE_VERSION: "22"
      TZ: UTC
      AUTHORIZED_BASE_SHA: "7c5d4125c277536258be6345e366efae59dbe5d6"
      AUTHORIZED_BRANCH: "feat/maplibre-fixture-3d-lab-20260903"
      BOOTSTRAP_COMMIT_SHA: "f4715ebb9bf1399d588d80d960cf923c71d6fc6f"
      PRIOR_WORKFLOW_COMMIT_SHA: "06fff60b6b3af3e9b1dfb26d1c75f0e5f29636f6"
      ADAPTER_PREIMAGE_BLOB: "d1e4d3e3783f6d550d8dfa64beea1ddf995aa924"
      RUNTIME_PREIMAGE_BLOB: "5e2e767d241572306e42eb64bc1062c62bce5eeb"
      PAYLOAD_SHA256: "e36101d4b79cf528c6a5a93cceb4f07c15fe00d523688de4ced7330e9f61db8a"
    steps:
      - name: Check out the exact branch writer commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 4
          persist-credentials: true

      - name: Verify branch and immutable authorized ancestry
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "${AUTHORIZED_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${PRIOR_WORKFLOW_COMMIT_SHA}"
          test "$(git rev-parse "${PRIOR_WORKFLOW_COMMIT_SHA}^")" = "${BOOTSTRAP_COMMIT_SHA}"
          test "$(git rev-parse "${BOOTSTRAP_COMMIT_SHA}^")" = "${AUTHORIZED_BASE_SHA}"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/bootstrap-maplibre-fixture-3d-lab.yml"
          cat > "${RUNNER_TEMP}/expected-bootstrap-paths.txt" <<'PATHS'
          .github/kfm-bootstrap-maplibre-3d/payload-00.b64
          .github/kfm-bootstrap-maplibre-3d/payload-01.b64
          .github/kfm-bootstrap-maplibre-3d/payload-02.b64
          .github/kfm-bootstrap-maplibre-3d/payload-03.b64
          .github/workflows/bootstrap-maplibre-fixture-3d-lab.yml
          PATHS
          git diff-tree --no-commit-id --name-only -r "${BOOTSTRAP_COMMIT_SHA}" | LC_ALL=C sort > "${RUNNER_TEMP}/actual-bootstrap-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-bootstrap-paths.txt" "${RUNNER_TEMP}/actual-bootstrap-paths.txt"

      - name: Decode the exact synthetic 3D payload
        run: |
          set -euo pipefail
          cat .github/kfm-bootstrap-maplibre-3d/payload-*.b64 | tr -d '\r\n' > "${RUNNER_TEMP}/payload.b64"
          base64 --decode "${RUNNER_TEMP}/payload.b64" > "${RUNNER_TEMP}/payload.tgz"
          echo "${PAYLOAD_SHA256}  ${RUNNER_TEMP}/payload.tgz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/payload.tgz" -C .

      - name: Correct synthetic style validation and feature-state identity
        run: |
          set -euo pipefail
          test "$(git hash-object packages/maplibre/src/synthetic-3d-fixture-lab.ts)" = "${RUNTIME_PREIMAGE_BLOB}"
          python - <<'PY_STYLE'
          from pathlib import Path

          path = Path("packages/maplibre/src/synthetic-3d-fixture-lab.ts")
          source = path.read_text(encoding="utf-8")
          source_anchor = "        lineMetrics: true,\n      },"
          source_replacement = "        lineMetrics: true,\n        promoteId: \"id\",\n      },"
          opacity_anchor = (
              '          "fill-extrusion-opacity": [\n'
              '            "case",\n'
              '            ["boolean", ["feature-state", "selected"], false],\n'
              '            0.98,\n'
              '            0.82,\n'
              '          ],'
          )
          opacity_replacement = '          "fill-extrusion-opacity": 0.86,'
          if source.count(source_anchor) != 1:
              raise SystemExit("GeoJSON source anchor drift")
          if source.count(opacity_anchor) != 1:
              raise SystemExit("fill-extrusion opacity anchor drift")
          source = source.replace(source_anchor, source_replacement)
          source = source.replace(opacity_anchor, opacity_replacement)
          path.write_text(source, encoding="utf-8")
          PY_STYLE
          grep -F 'promoteId: "id"' packages/maplibre/src/synthetic-3d-fixture-lab.ts
          grep -F '"fill-extrusion-opacity": 0.86' packages/maplibre/src/synthetic-3d-fixture-lab.ts

      - name: Verify exact payload paths and inline-only boundary
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/expected-payload-paths.txt" <<'PATHS'
          apps/explorer-web/index.html
          apps/explorer-web/src/fixture-3d-lab.ts
          apps/explorer-web/src/site/fixture-3d-lab.css
          apps/explorer-web/tests/browser/synthetic-3d-fixture-lab.spec.ts
          apps/explorer-web/tests/synthetic-3d-fixture-lab.test.ts
          packages/maplibre/src/maplibre-vite-adapter.ts
          packages/maplibre/src/synthetic-3d-fixture-lab.ts
          packages/maplibre/tests/synthetic-3d-fixture-lab.test.ts
          PATHS
          tar -tzf "${RUNNER_TEMP}/payload.tgz" | sed 's#/$##' | grep -v '^$' | LC_ALL=C sort > "${RUNNER_TEMP}/actual-payload-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-payload-paths.txt" "${RUNNER_TEMP}/actual-payload-paths.txt"
          python - <<'PY_BOUNDARY'
          from pathlib import Path

          runtime = Path("packages/maplibre/src/synthetic-3d-fixture-lab.ts").read_text(encoding="utf-8")
          app = Path("apps/explorer-web/src/fixture-3d-lab.ts").read_text(encoding="utf-8")
          combined = runtime + "\n" + app
          denied = [
              "fetch(", "XMLHttpRequest", "WebSocket", "EventSource", "setTerrain(",
              'type: "raster-dem"', "pmtiles://", "http://", "https://",
              "navigator.sendBeacon", "serviceWorker.register",
          ]
          found = [token for token in denied if token in combined]
          if found:
              raise SystemExit("prohibited runtime surface: " + ", ".join(found))
          required = [
              'type: "fill-extrusion"', "line-gradient", "promoteId",
              "setProjection", "setSky", "setLight", "setVerticalFieldOfView",
              "setFeatureState", "queryRenderedFeatures", "SYNTHETIC_ONLY",
              "createViteSynthetic3dFixtureLab",
          ]
          missing = [token for token in required if token not in combined]
          if missing:
              raise SystemExit("missing required fixture surfaces: " + ", ".join(missing))
          print("inline-only synthetic 3D boundary passed")
          PY_BOUNDARY

      - name: Repair the existing adapter TypeScript 7 state-narrowing seam
        run: |
          set -euo pipefail
          test "$(git hash-object packages/maplibre/src/maplibre-adapter.ts)" = "${ADAPTER_PREIMAGE_BLOB}"
          python - <<'PY_ADAPTER'
          from pathlib import Path

          path = Path("packages/maplibre/src/maplibre-adapter.ts")
          source = path.read_text(encoding="utf-8")
          equal = 'this.state === "DISPOSED"'
          unequal = 'this.state !== "DISPOSED"'
          if source.count(equal) != 5 or source.count(unequal) != 3:
              raise SystemExit("adapter DISPOSED comparison preimage drift")
          anchor = "  private readRendererCamera(map: MapLibreMap): MapRuntimeCamera {\n"
          if source.count(anchor) != 1:
              raise SystemExit("adapter helper insertion anchor drift")
          source = source.replace(equal, "this.isDisposed()")
          source = source.replace(unequal, "!this.isDisposed()")
          source = source.replace(
              anchor,
              "  private isDisposed(): boolean {\n"
              "    return this.state === \"DISPOSED\";\n"
              "  }\n\n" + anchor,
          )
          path.write_text(source, encoding="utf-8")
          PY_ADAPTER

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install locked workspace dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run package-owned MapLibre tests
        run: pnpm --filter @kfm/maplibre test

      - name: Run Explorer Web unit tests
        run: pnpm --filter explorer-web run test:unit

      - name: Build Explorer Web
        run: pnpm --filter explorer-web run build

      - name: Run existing adapter and new 3D browser fixtures
        run: >-
          pnpm --filter explorer-web exec playwright test
          --config=playwright.config.ts
          tests/browser/maplibre-vite-adapter.spec.ts
          tests/browser/synthetic-3d-fixture-lab.spec.ts

      - name: Commit only the validated review unit and remove this harness
        run: |
          set -euo pipefail
          git config user.name "KFM synthetic 3D branch writer"
          git config user.email "kfm-3d-branch-writer@users.noreply.github.com"
          git add \
            packages/maplibre/src/maplibre-adapter.ts \
            packages/maplibre/src/synthetic-3d-fixture-lab.ts \
            packages/maplibre/src/maplibre-vite-adapter.ts \
            packages/maplibre/tests/synthetic-3d-fixture-lab.test.ts \
            apps/explorer-web/src/fixture-3d-lab.ts \
            apps/explorer-web/src/site/fixture-3d-lab.css \
            apps/explorer-web/index.html \
            apps/explorer-web/tests/synthetic-3d-fixture-lab.test.ts \
            apps/explorer-web/tests/browser/synthetic-3d-fixture-lab.spec.ts
          git rm \
            .github/workflows/bootstrap-maplibre-fixture-3d-lab.yml \
            .github/kfm-bootstrap-maplibre-3d/payload-00.b64 \
            .github/kfm-bootstrap-maplibre-3d/payload-01.b64 \
            .github/kfm-bootstrap-maplibre-3d/payload-02.b64 \
            .github/kfm-bootstrap-maplibre-3d/payload-03.b64
          cat > "${RUNNER_TEMP}/expected-staged-paths.txt" <<'PATHS'
          .github/kfm-bootstrap-maplibre-3d/payload-00.b64
          .github/kfm-bootstrap-maplibre-3d/payload-01.b64
          .github/kfm-bootstrap-maplibre-3d/payload-02.b64
          .github/kfm-bootstrap-maplibre-3d/payload-03.b64
          .github/workflows/bootstrap-maplibre-fixture-3d-lab.yml
          apps/explorer-web/index.html
          apps/explorer-web/src/fixture-3d-lab.ts
          apps/explorer-web/src/site/fixture-3d-lab.css
          apps/explorer-web/tests/browser/synthetic-3d-fixture-lab.spec.ts
          apps/explorer-web/tests/synthetic-3d-fixture-lab.test.ts
          packages/maplibre/src/maplibre-adapter.ts
          packages/maplibre/src/maplibre-vite-adapter.ts
          packages/maplibre/src/synthetic-3d-fixture-lab.ts
          packages/maplibre/tests/synthetic-3d-fixture-lab.test.ts
          PATHS
          git diff --cached --name-only | LC_ALL=C sort > "${RUNNER_TEMP}/actual-staged-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-staged-paths.txt" "${RUNNER_TEMP}/actual-staged-paths.txt"
          git diff --cached --check
          git commit -m "feat(maplibre): add opt-in synthetic 3D fixture lab"
          test -z "$(git status --porcelain --untracked-files=no)"
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          cat > "${RUNNER_TEMP}/expected-final-paths.txt" <<'PATHS'
          apps/explorer-web/index.html
          apps/explorer-web/src/fixture-3d-lab.ts
          apps/explorer-web/src/site/fixture-3d-lab.css
          apps/explorer-web/tests/browser/synthetic-3d-fixture-lab.spec.ts
          apps/explorer-web/tests/synthetic-3d-fixture-lab.test.ts
          packages/maplibre/src/maplibre-adapter.ts
          packages/maplibre/src/maplibre-vite-adapter.ts
          packages/maplibre/src/synthetic-3d-fixture-lab.ts
          packages/maplibre/tests/synthetic-3d-fixture-lab.test.ts
          PATHS
          git diff --name-only "${AUTHORIZED_BASE_SHA}..HEAD" | LC_ALL=C sort > "${RUNNER_TEMP}/final-net-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-final-paths.txt" "${RUNNER_TEMP}/final-net-paths.txt"
          git push origin "HEAD:refs/heads/${AUTHORIZED_BRANCH}"
          {
            echo "## Synthetic MapLibre 3D branch handoff"
            echo
            echo "- payload SHA-256: \`${PAYLOAD_SHA256}\`"
            echo "- final commit: \`${final_sha}\`"
            echo "- final tree: \`${final_tree}\`"
            echo "- final branch: \`${AUTHORIZED_BRANCH}\`"
            echo "- tests: package, Explorer unit, Explorer build, existing adapter browser fixture, and new synthetic 3D browser fixture passed"
            echo "- temporary workflow and payload chunks: removed from final commit"
            echo "- PR, ready, merge, deployment, release, publication, source activation, terrain, DEM, and external requests: none"
          } >> "${{ github.step_summary }}"

# Validate the fixture-first Fauna OccurrenceEvidence draft profile.
name: fauna-occurrence-evidence

"on":
  pull_request:
    paths:
      - ".github/workflows/fauna-occurrence-evidence.yml"
      - "contracts/domains/fauna/occurrence_evidence.md"
      - "schemas/contracts/v1/domains/fauna/occurrence_evidence.schema.json"
      - "tools/validators/domains/fauna/README.md"
      - "tools/validators/domains/fauna/occurrence/**"
      - "fixtures/domains/fauna/occurrence_evidence/**"
      - "tests/domains/fauna/test_occurrence_evidence.py"
      - "packages/hashing/**"
      - "packages/domains/fauna/**"
      - "pipelines/domains/fauna/**"
      - "schemas/contracts/v1/domains/fauna/taxonomy_snapshot.schema.json"
      - "fixtures/domains/fauna/normalization/**"
      - "fixtures/domains/fauna/evidence_bindings/**"
      - "schemas/contracts/v1/evidence/evidence_bundle.schema.json"
      - "schemas/contracts/v1/evidence/evidence_ref.schema.json"
      - "schemas/contracts/v1/policy/sensitivity_label.schema.json"
      - "schemas/contracts/v1/common/spec_hash.schema.json"
      - "tests/domains/fauna/test_evidence_closure.py"
      - "tests/domains/fauna/test_taxonomy_resolution.py"
      - "tests/domains/fauna/test_occurrence_split.py"
      - "tests/domains/fauna/test_normalization_pipeline.py"
      - "data/receipts/generated/genrec-fauna-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fauna-occurrence-evidence.yml"
      - "contracts/domains/fauna/occurrence_evidence.md"
      - "schemas/contracts/v1/domains/fauna/occurrence_evidence.schema.json"
      - "tools/validators/domains/fauna/README.md"
      - "tools/validators/domains/fauna/occurrence/**"
      - "fixtures/domains/fauna/occurrence_evidence/**"
      - "tests/domains/fauna/test_occurrence_evidence.py"
      - "packages/hashing/**"
      - "packages/domains/fauna/**"
      - "pipelines/domains/fauna/**"
      - "schemas/contracts/v1/domains/fauna/taxonomy_snapshot.schema.json"
      - "fixtures/domains/fauna/normalization/**"
      - "fixtures/domains/fauna/evidence_bindings/**"
      - "schemas/contracts/v1/evidence/evidence_bundle.schema.json"
      - "schemas/contracts/v1/evidence/evidence_ref.schema.json"
      - "schemas/contracts/v1/policy/sensitivity_label.schema.json"
      - "schemas/contracts/v1/common/spec_hash.schema.json"
      - "tests/domains/fauna/test_evidence_closure.py"
      - "tests/domains/fauna/test_taxonomy_resolution.py"
      - "tests/domains/fauna/test_occurrence_split.py"
      - "tests/domains/fauna/test_normalization_pipeline.py"
      - "data/receipts/generated/genrec-fauna-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fauna-occurrence-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test

      - name: Run focused unit and fixture replay
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/domains/fauna \
            --pattern 'test_occurrence_evidence.py' \
            --verbose
          python tools/validators/domains/fauna/occurrence/validate_occurrence_evidence.py --fixtures
          python -m unittest --verbose \
            tests.domains.fauna.test_taxonomy_resolution \
            tests.domains.fauna.test_occurrence_split \
            tests.domains.fauna.test_normalization_pipeline \
            tests.domains.fauna.test_evidence_closure
          python pipelines/domains/fauna/normalize.py \
            --input fixtures/domains/fauna/occurrence_evidence/valid/valid_observed_open.json \
            --taxonomy fixtures/domains/fauna/normalization/taxonomy_snapshot.json \
            --validated-at 2026-10-29T00:00:00Z \
            --evidence-bundles fixtures/domains/fauna/evidence_bindings/bundles.json

      - name: Validate current generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-fauna-evidence-bindings-20261029.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Fauna OccurrenceEvidence draft profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed draft schemas, snapshot-bound taxonomy matching, deterministic identity, held normalization, local bundle metadata linking, withheld review projection, source-role anti-collapse, exact fixture polarity, and current authoring-receipt integrity."
            echo "- Boundary: PASS does not admit a live source, resolve taxonomic or stewardship authority, create an EvidenceBundle, perform geoprivacy transformation, release, promote, deploy, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the fixture-first Fauna OccurrenceEvidence draft profile.
name: fauna-occurrence-evidence

"on":
  pull_request:
    paths:
      - ".github/workflows/fauna-occurrence-evidence.yml"
      - "contracts/domains/fauna/occurrence_evidence.md"
      - "schemas/contracts/v1/domains/fauna/occurrence_evidence.schema.json"
      - "tools/validators/domains/fauna/README.md"
      - "tools/validators/domains/fauna/occurrence/**"
      - "fixtures/domains/fauna/occurrence_evidence/**"
      - "tests/domains/fauna/test_occurrence_evidence.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-fauna-occurrence-evidence-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fauna-occurrence-evidence.yml"
      - "contracts/domains/fauna/occurrence_evidence.md"
      - "schemas/contracts/v1/domains/fauna/occurrence_evidence.schema.json"
      - "tools/validators/domains/fauna/README.md"
      - "tools/validators/domains/fauna/occurrence/**"
      - "fixtures/domains/fauna/occurrence_evidence/**"
      - "tests/domains/fauna/test_occurrence_evidence.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-fauna-occurrence-evidence-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fauna-occurrence-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test

      - name: Run focused unit and fixture replay
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/domains/fauna \
            --pattern 'test_occurrence_evidence.py' \
            --verbose
          python tools/validators/domains/fauna/occurrence/validate_occurrence_evidence.py --fixtures

      - name: Validate current generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-fauna-occurrence-evidence-readme-20260808.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Fauna OccurrenceEvidence draft profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed draft schema, deterministic identity, source-role anti-collapse, rights/sensitivity consistency, exact fixture polarity, and current authoring-receipt integrity."
            echo "- Boundary: PASS does not admit a live source, resolve taxonomic or stewardship authority, create an EvidenceBundle, perform geoprivacy transformation, release, promote, deploy, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

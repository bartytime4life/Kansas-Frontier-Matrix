# Validate the deterministic, synthetic-only FrontierClassification packet.
name: frontier-classification

"on":
  pull_request:
    paths:
      - ".github/workflows/frontier-classification.yml"
      - "contracts/evidence/frontier_classification.md"
      - "schemas/contracts/v1/evidence/frontier_classification.schema.json"
      - "fixtures/contracts/v1/evidence/frontier_classification/**"
      - "tools/validators/evidence/*frontier_classification*.py"
      - "tests/validators/evidence/test_validate_frontier_classification.py"
      - "contracts/evidence/frontier_definition.md"
      - "contracts/data/county_year_panel.md"
      - "contracts/common/geography_version.md"
      - "contracts/evidence/access_observation.md"
      - "contracts/evidence/population_observation.md"
      - "contracts/evidence/evidence_ref.md"
      - "contracts/evidence/evidence_bundle.md"
      - "schemas/contracts/v1/evidence/frontier_definition.schema.json"
      - "schemas/contracts/v1/data/county_year_panel.schema.json"
      - "schemas/contracts/v1/evidence/access_observation.schema.json"
      - "schemas/contracts/v1/evidence/population_observation.schema.json"
      - "schemas/contracts/v1/evidence/evidence_ref.schema.json"
      - "schemas/contracts/v1/evidence/evidence_bundle.schema.json"
      - "tools/validators/evidence/validate_frontier_definition.py"
      - "tools/validators/data/validate_county_year_panel.py"
      - "tools/validators/evidence/validate_access_observation.py"
      - "tools/validators/evidence/validate_population_observation.py"
      - "packages/hashing/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontier-classification.yml"
      - "contracts/evidence/frontier_classification.md"
      - "schemas/contracts/v1/evidence/frontier_classification.schema.json"
      - "fixtures/contracts/v1/evidence/frontier_classification/**"
      - "tools/validators/evidence/*frontier_classification*.py"
      - "tests/validators/evidence/test_validate_frontier_classification.py"
      - "contracts/evidence/frontier_definition.md"
      - "contracts/data/county_year_panel.md"
      - "contracts/common/geography_version.md"
      - "contracts/evidence/access_observation.md"
      - "contracts/evidence/population_observation.md"
      - "contracts/evidence/evidence_ref.md"
      - "contracts/evidence/evidence_bundle.md"
      - "schemas/contracts/v1/evidence/frontier_definition.schema.json"
      - "schemas/contracts/v1/data/county_year_panel.schema.json"
      - "schemas/contracts/v1/evidence/access_observation.schema.json"
      - "schemas/contracts/v1/evidence/population_observation.schema.json"
      - "schemas/contracts/v1/evidence/evidence_ref.schema.json"
      - "schemas/contracts/v1/evidence/evidence_bundle.schema.json"
      - "tools/validators/evidence/validate_frontier_definition.py"
      - "tools/validators/data/validate_county_year_panel.py"
      - "tools/validators/evidence/validate_access_observation.py"
      - "tools/validators/evidence/validate_population_observation.py"
      - "packages/hashing/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-classification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-frontier-classification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic packet validation
        run: |
          python -m unittest -v tests.validators.evidence.test_validate_frontier_classification
          python tools/validators/evidence/validate_frontier_classification.py --fixtures
      - name: Run adjacent contract and boundary validation
        run: |
          python -m unittest -v tests.validators.evidence.test_validate_frontier_definition
          python -m unittest -v tests.data.test_county_year_panel
          python -m unittest -v tests.validators.test_validate_geography_version
          python -m unittest -v tests.validators.evidence.test_validate_access_observation
          python -m unittest -v tests.validators.evidence.test_validate_population_observation
          python tools/validators/evidence/validate_frontier_definition.py --fixtures
          python tools/validators/data/validate_county_year_panel.py --fixtures
          python tools/validators/evidence/validate_access_observation.py --fixtures
          python tools/validators/evidence/validate_population_observation.py --fixtures
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### FrontierClassification"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: deterministic synthetic-only FrontierDefinition + CountyYearPanel assessment, exact local geography/time, observation, uncertainty, evidence, threshold-policy-reference, identity, and correction validation."
            echo "- Boundary: no real county classification, source activation, network or model calls, threshold or policy change, lifecycle write, internal-store exposure, review approval, release, publication, deployment, public API, or map output."
          } >> "$GITHUB_STEP_SUMMARY"

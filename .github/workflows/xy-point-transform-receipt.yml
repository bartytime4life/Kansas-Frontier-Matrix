name: xy-point-transform-receipt

"on":
  pull_request:
    paths:
      - ".github/workflows/xy-point-transform-receipt.yml"
      - "contracts/spatial-foundation/xy_point_transform_receipt.md"
      - "schemas/contracts/v1/spatial-foundation/xy_point_transform_receipt.schema.json"
      - "fixtures/contracts/v1/spatial-foundation/xy_point_transform_receipt/**"
      - "tools/validators/validate_xy_point_transform_receipt.py"
      - "tests/validators/test_validate_xy_point_transform_receipt.py"
      - "docs/intake/exploratory/pass-18-xy-point-transform-receipt-source-map.md"
      - "data/receipts/generated/genrec-pass18-xy-point-transform-receipt-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/xy-point-transform-receipt.yml"
      - "contracts/spatial-foundation/xy_point_transform_receipt.md"
      - "schemas/contracts/v1/spatial-foundation/xy_point_transform_receipt.schema.json"
      - "fixtures/contracts/v1/spatial-foundation/xy_point_transform_receipt/**"
      - "tools/validators/validate_xy_point_transform_receipt.py"
      - "tests/validators/test_validate_xy_point_transform_receipt.py"
      - "docs/intake/exploratory/pass-18-xy-point-transform-receipt-source-map.md"
      - "data/receipts/generated/genrec-pass18-xy-point-transform-receipt-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xy-point-transform-receipt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  validate:
    name: validate-xy-point-transform-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test-wheel
      - name: Compile validator and tests
        run: python -m py_compile tools/validators/validate_xy_point_transform_receipt.py tests/validators/test_validate_xy_point_transform_receipt.py
      - name: Run focused unit tests
        run: python -m unittest tests.validators.test_validate_xy_point_transform_receipt -v
      - name: Replay exact fixture outcomes
        run: python tools/validators/validate_xy_point_transform_receipt.py --fixtures
      - name: Validate generated receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-xy-point-transform-receipt-20260810.json

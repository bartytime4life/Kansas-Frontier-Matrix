# Validate the fixture-only historical-signature verification assessment candidate.
name: historical-signature-verification-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/historical-signature-verification-assessment.yml"
      - "contracts/release/historical_signature_verification_assessment.md"
      - "schemas/contracts/v1/release/historical_signature_verification_assessment.schema.json"
      - "fixtures/contracts/v1/release/historical_signature_verification_assessment/**"
      - "tools/validators/release/validate_historical_signature_verification_assessment.py"
      - "tests/validators/test_validate_historical_signature_verification_assessment.py"
      - "docs/intake/exploratory/historical-signature-verification-assessment-source-map.md"
      - "docs/security/KEY_ROTATION.md"
      - "docs/standards/SIGNING.md"
      - "contracts/release/release_manifest.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-historical-signature-verification-assessment-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-signature-verification-assessment.yml"
      - "contracts/release/historical_signature_verification_assessment.md"
      - "schemas/contracts/v1/release/historical_signature_verification_assessment.schema.json"
      - "fixtures/contracts/v1/release/historical_signature_verification_assessment/**"
      - "tools/validators/release/validate_historical_signature_verification_assessment.py"
      - "tests/validators/test_validate_historical_signature_verification_assessment.py"
      - "docs/intake/exploratory/historical-signature-verification-assessment-source-map.md"
      - "docs/security/KEY_ROTATION.md"
      - "docs/standards/SIGNING.md"
      - "contracts/release/release_manifest.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-historical-signature-verification-assessment-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-signature-verification-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-historical-signature-verification-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests
        run: |
          python -m unittest -v tests.validators.test_validate_historical_signature_verification_assessment
          python tools/validators/release/validate_historical_signature_verification_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-historical-signature-verification-assessment-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### HistoricalSignatureVerificationAssessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only two-clock trust-status and declared verification-summary reconciliation."
            echo "- Boundary: no keys, cryptography, trust lookup, signing, release, correction, withdrawal, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

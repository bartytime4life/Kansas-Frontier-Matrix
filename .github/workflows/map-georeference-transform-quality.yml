name: map-georeference-transform-quality

"on":
  pull_request:
    paths:
      - ".github/workflows/map-georeference-transform-quality.yml"
      - "contracts/map/georeference_transform_quality.md"
      - "schemas/contracts/v1/map/georeference_transform_quality.schema.json"
      - "fixtures/contracts/v1/map/georeference_transform_quality/**"
      - "tools/validators/map/validate_georeference_transform_quality.py"
      - "tests/map/test_georeference_transform_quality.py"
      - "docs/intake/exploratory/georeference-transform-quality-source-map.md"
      - "data/receipts/generated/genrec-georeference-transform-quality-20260806.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-georeference-transform-quality.yml"
      - "contracts/map/georeference_transform_quality.md"
      - "schemas/contracts/v1/map/georeference_transform_quality.schema.json"
      - "fixtures/contracts/v1/map/georeference_transform_quality/**"
      - "tools/validators/map/validate_georeference_transform_quality.py"
      - "tests/map/test_georeference_transform_quality.py"
      - "docs/intake/exploratory/georeference-transform-quality-source-map.md"
      - "data/receipts/generated/genrec-georeference-transform-quality-20260806.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python tools/ci/install_python_ci.py project-test
      - run: python -m pytest -q tests/map/test_georeference_transform_quality.py
      - run: python tools/validators/map/validate_georeference_transform_quality.py --fixtures
      - run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-georeference-transform-quality-20260806.json --repo-root .

name: sovereignty-exception-receipt

"on":
  pull_request:
    paths:
      - ".github/workflows/sovereignty-exception-receipt.yml"
      - "contracts/policy/sovereignty_exception_receipt.md"
      - "schemas/contracts/v1/policy/sovereignty_exception_receipt.schema.json"
      - "fixtures/contracts/v1/policy/sovereignty_exception_receipt/**"
      - "tools/validators/policy/validate_sovereignty_exception_receipt.py"
      - "tests/validators/test_validate_sovereignty_exception_receipt.py"
      - "docs/intake/exploratory/pass-32-sovereignty-exception-receipt-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass32-sovereignty-exception-receipt-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sovereignty-exception-receipt.yml"
      - "contracts/policy/sovereignty_exception_receipt.md"
      - "schemas/contracts/v1/policy/sovereignty_exception_receipt.schema.json"
      - "fixtures/contracts/v1/policy/sovereignty_exception_receipt/**"
      - "tools/validators/policy/validate_sovereignty_exception_receipt.py"
      - "tests/validators/test_validate_sovereignty_exception_receipt.py"
      - "docs/intake/exploratory/pass-32-sovereignty-exception-receipt-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass32-sovereignty-exception-receipt-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereignty-exception-receipt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: python -m pytest -q tests/validators/test_validate_sovereignty_exception_receipt.py
      - name: Verify generated receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass32-sovereignty-exception-receipt-20260809.json --repo-root .
      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### Sovereignty exception receipt candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only record coherence over declared external references."
            echo "- Boundary: no authority authentication, policy override, access grant, lifecycle write, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

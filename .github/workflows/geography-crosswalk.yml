# Validate the fixture-only GeographyCrosswalk candidate.
name: geography-crosswalk

"on":
  pull_request:
    paths:
      - ".github/workflows/geography-crosswalk.yml"
      - "contracts/crosswalks/geography_crosswalk.md"
      - "schemas/contracts/v1/crosswalks/geography_crosswalk.schema.json"
      - "fixtures/contracts/v1/crosswalks/geography_crosswalk/**"
      - "tools/validators/validate_geography_crosswalk.py"
      - "tests/validators/test_validate_geography_crosswalk.py"
      - "docs/intake/exploratory/pass-20-geography-crosswalk-source-map.md"
      - "contracts/common/geography_version.md"
      - "schemas/contracts/v1/common/geography_version.schema.json"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass20-geography-crosswalk-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/geography-crosswalk.yml"
      - "contracts/crosswalks/geography_crosswalk.md"
      - "schemas/contracts/v1/crosswalks/geography_crosswalk.schema.json"
      - "fixtures/contracts/v1/crosswalks/geography_crosswalk/**"
      - "tools/validators/validate_geography_crosswalk.py"
      - "tests/validators/test_validate_geography_crosswalk.py"
      - "docs/intake/exploratory/pass-20-geography-crosswalk-source-map.md"
      - "contracts/common/geography_version.md"
      - "schemas/contracts/v1/common/geography_version.schema.json"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass20-geography-crosswalk-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geography-crosswalk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-geography-crosswalk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused and adjacent deterministic tests
        run: |
          python -m unittest -v tests.validators.test_validate_geography_crosswalk
          python -m unittest -v tests.validators.test_validate_geography_version
          python tools/validators/validate_geography_crosswalk.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass20-geography-crosswalk-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### GeographyCrosswalk"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only version-pair, forward mapping, relation, integer-millionth weight, evidence-reference, disclosure, and identity validation."
            echo "- Boundary: no source access, geography resolution, geometry comparison, mapping execution, reverse inference, evidence resolution, policy evaluation, review approval, promotion, release, public use, publication, or deployment authority."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate fixture-only USGS Water API cutover assessments.
name: hydrology-usgs-water-api-cutover

"on":
  pull_request:
    paths:
      - ".github/workflows/hydrology-usgs-water-api-cutover.yml"
      - "contracts/domains/hydrology/usgs_water_api_cutover.md"
      - "schemas/contracts/v1/domains/hydrology/usgs_water_api_cutover_assessment.schema.json"
      - "tools/validators/domains/hydrology/usgs_water_api_cutover/**"
      - "fixtures/domains/hydrology/usgs_water_api_cutover/**"
      - "tests/validators/domains/hydrology/usgs_water_api_cutover/**"
      - "data/receipts/generated/genrec-hydrology-usgs-water-api-cutover-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hydrology-usgs-water-api-cutover.yml"
      - "contracts/domains/hydrology/usgs_water_api_cutover.md"
      - "schemas/contracts/v1/domains/hydrology/usgs_water_api_cutover_assessment.schema.json"
      - "tools/validators/domains/hydrology/usgs_water_api_cutover/**"
      - "fixtures/domains/hydrology/usgs_water_api_cutover/**"
      - "tests/validators/domains/hydrology/usgs_water_api_cutover/**"
      - "data/receipts/generated/genrec-hydrology-usgs-water-api-cutover-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydrology-usgs-water-api-cutover-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-usgs-water-api-cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic cutover tests
        run: |
          set -euo pipefail
          python -m pytest \
            tests/validators/domains/hydrology/usgs_water_api_cutover/test_validate_usgs_water_api_cutover.py \
            -q --strict-config --strict-markers

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-hydrology-usgs-water-api-cutover-20260806.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Fixture-only USGS Water API cutover assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: deterministic endpoint-family, required-role, rewrite-map, legacy-dependency, and dual-run reconciliation checks."
            echo "- Boundary: no live USGS access, connector activation, lifecycle write, hydrologic assertion, safety guidance, promotion, release, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

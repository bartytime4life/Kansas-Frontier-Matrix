name: soil-catalog-closure-assessment

on:
  pull_request:
    paths:
      - 'contracts/domains/soil/catalog_closure_assessment.md'
      - 'schemas/contracts/v1/domains/soil/catalog_closure_assessment.schema.json'
      - 'fixtures/contracts/v1/domains/soil/catalog_closure_assessment/**'
      - 'tools/validators/domains/soil/validate_catalog_closure_assessment.py'
      - 'tests/validators/domains/soil/test_catalog_closure_assessment.py'
      - 'tests/validators/domains/soil/test_catalog_closure_schema.py'
      - '.github/workflows/soil-catalog-closure-assessment.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  KFM_NO_NETWORK: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.11'}
      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Compile
        run: python -m py_compile tools/validators/domains/soil/validate_catalog_closure_assessment.py tests/validators/domains/soil/test_catalog_closure_assessment.py tests/validators/domains/soil/test_catalog_closure_schema.py
      - name: Replay fixtures
        run: python tools/validators/domains/soil/validate_catalog_closure_assessment.py --fixtures
      - name: Run focused tests
        run: python -m pytest -q tests/validators/domains/soil/test_catalog_closure_assessment.py tests/validators/domains/soil/test_catalog_closure_schema.py --strict-config --strict-markers

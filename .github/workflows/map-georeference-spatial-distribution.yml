name: map-georeference-spatial-distribution

"on":
  pull_request:
    paths:
      - ".github/workflows/map-georeference-spatial-distribution.yml"
      - "contracts/map/georeference_spatial_distribution.md"
      - "schemas/contracts/v1/map/georeference_spatial_distribution.schema.json"
      - "fixtures/contracts/v1/map/georeference_spatial_distribution/**"
      - "tools/validators/map/validate_georeference_spatial_distribution.py"
      - "tests/map/test_georeference_spatial_distribution.py"
      - "docs/intake/exploratory/georeference-spatial-distribution-source-map.md"
      - "data/receipts/generated/genrec-georeference-spatial-distribution-20260806.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-georeference-spatial-distribution.yml"
      - "contracts/map/georeference_spatial_distribution.md"
      - "schemas/contracts/v1/map/georeference_spatial_distribution.schema.json"
      - "fixtures/contracts/v1/map/georeference_spatial_distribution/**"
      - "tools/validators/map/validate_georeference_spatial_distribution.py"
      - "tests/map/test_georeference_spatial_distribution.py"
      - "docs/intake/exploratory/georeference-spatial-distribution-source-map.md"
      - "data/receipts/generated/genrec-georeference-spatial-distribution-20260806.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-georeference-spatial-distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-georeference-spatial-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema and test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests
        run: python -m pytest -q tests/map/test_georeference_spatial_distribution.py
      - name: Run exact fixture polarity
        run: python tools/validators/map/validate_georeference_spatial_distribution.py --fixtures
      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-georeference-spatial-distribution-20260806.json
          --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Georeference spatial distribution"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic GCP resource-space hull coverage, extrapolation proxy, centroid offset, quadrant occupancy, and generated-receipt integrity."
            echo "- Boundary: a green result does not authenticate GCPs, warp imagery, establish transform truth, evaluate policy, or authorize promotion/release/publication."
          } >> "$GITHUB_STEP_SUMMARY"

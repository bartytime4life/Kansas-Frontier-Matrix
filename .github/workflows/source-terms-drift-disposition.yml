# Validate the fixture-only source-terms drift disposition.
name: source-terms-drift-disposition

"on":
  pull_request:
    paths:
      - ".github/workflows/source-terms-drift-disposition.yml"
      - "contracts/source/source_terms_drift_disposition.md"
      - "schemas/contracts/v1/source/source_terms_drift_disposition.schema.json"
      - "fixtures/contracts/v1/source/source_terms_drift_disposition/**"
      - "tools/validators/source/validate_source_terms_drift_disposition.py"
      - "tests/validators/test_validate_source_terms_drift_disposition.py"
      - "docs/intake/exploratory/source-terms-drift-disposition-source-map.md"
      - "contracts/source/source_rights_currentness_assessment.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-source-terms-drift-disposition-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-terms-drift-disposition.yml"
      - "contracts/source/source_terms_drift_disposition.md"
      - "schemas/contracts/v1/source/source_terms_drift_disposition.schema.json"
      - "fixtures/contracts/v1/source/source_terms_drift_disposition/**"
      - "tools/validators/source/validate_source_terms_drift_disposition.py"
      - "tests/validators/test_validate_source_terms_drift_disposition.py"
      - "docs/intake/exploratory/source-terms-drift-disposition-source-map.md"
      - "contracts/source/source_rights_currentness_assessment.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-source-terms-drift-disposition-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-terms-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-source-terms-drift-disposition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests and fixture replay
        run: |
          python -m unittest -v tests.validators.test_validate_source_terms_drift_disposition
          python tools/validators/source/validate_source_terms_drift_disposition.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-source-terms-drift-disposition-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### SourceTermsDriftDisposition"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only comparison of declared terms snapshots."
            echo "- Boundary: no legal determination, source activation, lifecycle write, hold, recomputation, withdrawal, release, or publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

# KFM TemporalWindow bounded validation workflow.
#
# Responsibility:
#   Exercise the proposed common TemporalWindow schema, non-vacuous synthetic
#   fixtures, dedicated no-network validator, and focused parser/order tests.
#
# Trust boundary:
#   This workflow has read-only repository permission. Network use is limited to
#   installing declared project dependencies. It emits no evidence, policy,
#   review, lifecycle, release, correction, rollback, or publication object.
#
# Compatibility:
#   Workflow name `temporal-window-validation` and job/check name
#   `validate-temporal-window` should remain stable if later required by rules.
#
# Rollback:
#   Revert this workflow with the TemporalWindow validator/fixture slice.

name: temporal-window-validation

"on":
  pull_request:
    paths:
      - ".github/workflows/temporal-window-validation.yml"
      - "contracts/common/temporal_window.md"
      - "schemas/contracts/v1/common/temporal_window.schema.json"
      - "fixtures/contracts/v1/common/README.md"
      - "fixtures/contracts/v1/common/temporal_window/**"
      - "tools/validators/validate_temporal_window.py"
      - "tests/validators/test_validate_temporal_window.py"
      - "tests/schemas/test_common_contracts.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporal-window-validation.yml"
      - "contracts/common/temporal_window.md"
      - "schemas/contracts/v1/common/temporal_window.schema.json"
      - "fixtures/contracts/v1/common/README.md"
      - "fixtures/contracts/v1/common/temporal_window/**"
      - "tools/validators/validate_temporal_window.py"
      - "tests/validators/test_validate_temporal_window.py"
      - "tests/schemas/test_common_contracts.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-window-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-temporal-window:
    name: validate-temporal-window
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused TemporalWindow validator tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_temporal_window.py' \
            --verbose

      - name: Run non-vacuous TemporalWindow fixture profile
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_temporal_window.py --fixtures

      - name: Prove generic common-schema discovery
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/schemas/test_common_contracts.py -k temporal_window

      - name: Record validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### TemporalWindow validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- The focused suite checks bounded regular-file parsing, duplicate keys, finite JSON, timezone-aware date-time syntax, UTC-normalized start/end ordering, deterministic diagnostics, no-network behavior, and fixture polarity."
            echo "- The fixture profile requires non-empty valid, schema-invalid, and semantic-invalid lanes with reviewed expected-error evidence."
            echo "- The generic common-schema test is filtered to the TemporalWindow family."
            echo "- A green result does not reconcile proposed temporal vocabularies or establish source truth, freshness, evidence closure, policy approval, review, correction closure, release readiness, or publication authority."
            echo "- No source was activated and no lifecycle, evidence, policy, release, deployment, or public artifact was emitted."
          } >> "$GITHUB_STEP_SUMMARY"

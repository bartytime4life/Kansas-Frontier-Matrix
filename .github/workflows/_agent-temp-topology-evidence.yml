# TEMPORARY branch-only diagnostic. Remove before reviewable delivery.
# Packages strict-shrinkage baseline candidates without changing repository state.
name: _agent-temp-topology-evidence

"on":
  push:
    branches:
      - fix/topology-ratchet-reconcile-20260902

permissions:
  contents: read

concurrency:
  group: _agent-temp-topology-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-topology-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build strict-shrinkage candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/temporary/topology-reconciliation
          python3 - <<'PY'
          import json
          from pathlib import Path

          from tools.validators.directory_governance import validate_repository_topology as topology

          root = Path(".")
          baseline_path = root / topology.BASELINE_REPOSITORY_PATH
          raw = baseline_path.read_bytes()
          plain = json.loads(raw.decode("utf-8"))
          data, entries = topology._load_baseline_bytes(raw, label="diagnostic")
          findings, tracked_path_count = topology.scan(root)
          by_identity = {(item.rule_id, item.subject): item for item in findings}

          shrink_identities = (
              ("KFM-TOPO-001", "path-grammar:uppercase"),
              ("KFM-TOPO-009", "scaffold-only-leaf-directories"),
              ("KFM-TOPO-016", "doc-id:kfm://doc/NEEDS-VERIFICATION"),
          )
          comparisons = []
          replacements = {}
          for identity in shrink_identities:
              current = by_identity[identity]
              prior_pair = next(
                  (pair for pair in entries.items()
                   if (pair[1]["rule_id"], pair[1]["subject"]) == identity),
                  None,
              )
              assert prior_pair is not None, f"missing prior entry for {identity}"
              prior_fingerprint, prior = prior_pair
              current_members = set(current.evidence_members)
              prior_members = set(prior["evidence_members"])
              added = sorted(current_members - prior_members)
              removed = sorted(prior_members - current_members)
              assert current_members < prior_members, (
                  f"{identity} is not strict shrinkage; added={added}; removed={removed}"
              )
              replacement = topology._serialized_baseline_entry(current)
              replacements[prior_fingerprint] = replacement
              comparisons.append({
                  "rule_id": identity[0],
                  "subject": identity[1],
                  "prior_fingerprint": prior_fingerprint,
                  "current_fingerprint": current.fingerprint,
                  "prior_member_count": len(prior_members),
                  "current_member_count": len(current_members),
                  "added_members": added,
                  "removed_members": removed,
                  "strict_subset": True,
              })

          candidate_entries = []
          for entry in plain["entries"]:
              candidate_entries.append(replacements.get(entry["fingerprint"], entry))
          candidate_entries.sort(key=lambda item: item["fingerprint"])
          plain["entries"] = candidate_entries

          candidate_raw = (json.dumps(plain, indent=2, sort_keys=True) + "\n").encode("utf-8")
          candidate_data, candidate = topology._load_baseline_bytes(
              candidate_raw, label="candidate"
          )
          topology.validate_baseline_transition(data=candidate_data, current_data=candidate_data, current_entries=candidate, trusted_data=data, trusted_entries=entries) if False else None
          topology.validate_baseline_transition(
              candidate_data,
              candidate,
              data,
              entries,
          )

          out = root / "artifacts/temporary/topology-reconciliation"
          (out / "repository_topology_baseline.candidate.json").write_bytes(candidate_raw)
          (out / "strict-shrinkage-comparison.json").write_text(
              json.dumps({
                  "tracked_path_count": tracked_path_count,
                  "candidate_entry_count": len(candidate_entries),
                  "comparisons": comparisons,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(comparisons, indent=2, sort_keys=True))
          PY

      - name: Upload bounded candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topology-reconciliation-candidate-${{ github.run_id }}
          path: artifacts/temporary/topology-reconciliation/
          if-no-files-found: error
          retention-days: 1

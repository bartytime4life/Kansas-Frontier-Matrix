# TEMPORARY branch-only diagnostic. Remove before reviewable delivery.
# Packages exact transition evidence without changing repository state.
name: _agent-temp-topology-evidence

"on":
  push:
    branches:
      - fix/topology-ratchet-reconcile-20260902

permissions:
  contents: read

concurrency:
  group: _agent-temp-topology-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-topology-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build transition evidence packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/temporary/topology-reconciliation
          python3 - <<'PY'
          import json
          from pathlib import Path

          from tools.validators.directory_governance import validate_repository_topology as topology

          root = Path(".")
          baseline_path = root / topology.BASELINE_REPOSITORY_PATH
          raw = baseline_path.read_bytes()
          plain = json.loads(raw.decode("utf-8"))
          trusted_data, trusted_entries = topology._load_baseline_bytes(
              raw, label="diagnostic"
          )
          findings, tracked_path_count = topology.scan(root)
          by_identity = {(item.rule_id, item.subject): item for item in findings}
          prior_by_identity = {
              (entry["rule_id"], entry["subject"]): (fingerprint, entry)
              for fingerprint, entry in trusted_entries.items()
          }

          identities = (
              ("KFM-TOPO-001", "path-grammar:uppercase"),
              ("KFM-TOPO-004", "catalog/"),
              ("KFM-TOPO-009", "scaffold-only-leaf-directories"),
              ("KFM-TOPO-016", "doc-id:kfm://doc/NEEDS-VERIFICATION"),
          )
          comparisons = []
          replacements = {}
          for identity in identities:
              current = by_identity[identity]
              prior_fingerprint, prior = prior_by_identity[identity]
              current_members = set(current.evidence_members)
              prior_members = set(prior["evidence_members"])
              added = sorted(current_members - prior_members)
              removed = sorted(prior_members - current_members)
              if current.fingerprint == prior_fingerprint:
                  classification = "EXACT_MATCH"
              elif current_members < prior_members:
                  classification = "STRICT_SHRINKAGE"
                  replacements[prior_fingerprint] = (
                      topology._serialized_baseline_entry(current)
                  )
              elif prior_members < current_members:
                  classification = "EXPANSION"
              elif len(current_members) == len(prior_members):
                  classification = "EQUAL_CARDINALITY_REPLACEMENT"
              else:
                  classification = "MIXED_REPLACEMENT"
              comparisons.append({
                  "rule_id": identity[0],
                  "subject": identity[1],
                  "classification": classification,
                  "prior_fingerprint": prior_fingerprint,
                  "current_fingerprint": current.fingerprint,
                  "prior_evidence_sha256": prior["evidence_sha256"],
                  "current_evidence_sha256": current.evidence_sha256,
                  "prior_member_count": len(prior_members),
                  "current_member_count": len(current_members),
                  "added_members": added,
                  "removed_members": removed,
                  "serialized_current_entry": (
                      topology._serialized_baseline_entry(current)
                  ),
              })

          candidate_entries = [
              replacements.get(entry["fingerprint"], entry)
              for entry in plain["entries"]
          ]
          candidate_entries.sort(key=lambda item: item["fingerprint"])
          plain["entries"] = candidate_entries
          candidate_raw = (
              json.dumps(plain, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          candidate_data, candidate_entries_by_fingerprint = (
              topology._load_baseline_bytes(candidate_raw, label="candidate")
          )
          topology.validate_baseline_transition(
              candidate_data,
              candidate_entries_by_fingerprint,
              trusted_data,
              trusted_entries,
          )

          out = root / "artifacts/temporary/topology-reconciliation"
          (out / "repository_topology_baseline.candidate.json").write_bytes(
              candidate_raw
          )
          (out / "transition-evidence.json").write_text(
              json.dumps({
                  "tracked_path_count": tracked_path_count,
                  "candidate_entry_count": len(candidate_entries),
                  "comparisons": comparisons,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          summary = [
              {
                  key: item[key]
                  for key in (
                      "rule_id",
                      "subject",
                      "classification",
                      "prior_member_count",
                      "current_member_count",
                      "added_members",
                      "removed_members",
                  )
              }
              for item in comparisons
          ]
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload bounded candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topology-reconciliation-candidate-${{ github.run_id }}
          path: artifacts/temporary/topology-reconciliation/
          if-no-files-found: error
          retention-days: 1

# Validate fixture-only smoke-aware NDVI readiness sidecars.
name: agriculture-ndvi-readiness

"on":
  pull_request:
    paths:
      - ".github/workflows/agriculture-ndvi-readiness.yml"
      - "contracts/domains/agriculture/ndvi_readiness.md"
      - "schemas/contracts/v1/domains/agriculture/ndvi_readiness.schema.json"
      - "tools/validators/domains/agriculture/ndvi_readiness/**"
      - "fixtures/domains/agriculture/ndvi_readiness/**"
      - "tests/validators/domains/agriculture/ndvi_readiness/**"
      - "data/receipts/generated/genrec-agriculture-ndvi-readiness-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agriculture-ndvi-readiness.yml"
      - "contracts/domains/agriculture/ndvi_readiness.md"
      - "schemas/contracts/v1/domains/agriculture/ndvi_readiness.schema.json"
      - "tools/validators/domains/agriculture/ndvi_readiness/**"
      - "fixtures/domains/agriculture/ndvi_readiness/**"
      - "tests/validators/domains/agriculture/ndvi_readiness/**"
      - "data/receipts/generated/genrec-agriculture-ndvi-readiness-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agriculture-ndvi-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-ndvi-readiness-sidecars
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic sidecar tests
        run: |
          set -euo pipefail
          python -m pytest \
            tests/validators/domains/agriculture/ndvi_readiness/test_validate_ndvi_readiness.py \
            -q --strict-config --strict-markers

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-agriculture-ndvi-readiness-20260806.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Smoke-aware NDVI readiness sidecar"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only sidecar shape and deterministic mask-health, ready-area, heavy-smoke, and input-receipt consistency."
            echo "- Boundary: no source access, NDVI calculation, COG creation, evidence resolution, health guidance, promotion, release, emission, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

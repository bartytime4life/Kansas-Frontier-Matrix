# KFM MapLibre performance-governance readiness workflow.
# Status: command-bearing static syntax/negative-path checks plus an explicit
# retired legacy harness and governed hold on browser performance, render
# comparison, attestation, proof,
# release-manifest, correction, rollback, and failure-bundle claims.
#
# Responsibility:
# - Run the deterministic MapLibre checks currently supported by repository
#   evidence and detect when the held runtime/governance assumptions change.
# Trigger:
# - Path-scoped pull requests and pushes cover the actual explorer, transitional
#   renderer package, configs, scripts, schemas, validators, tests, fixtures,
#   governance docs, command manifests, and this workflow.
# - workflow_dispatch supports explicit maintainer readiness inspection.
# Untrusted-code posture:
# - Pull requests execute submitted code with read-only contents permission and
#   no secrets, write scopes, OIDC, deployment, signing, or publication authority.
# Runner and network:
# - GitHub-hosted Ubuntu, Node 22, and Python 3.12 are used. No packages or
#   browsers are installed; checks are no-network after action bootstrap.
# Commands:
# - `node --check` for the seven repository-owned MapLibre scripts.
# - Five repository-owned pure-Python negative-path/retirement test functions
#   are invoked
#   directly; this lane does not install workspace dependencies or browsers.
# - Readiness inspection is standard-library-only and does not replace validators.
# - The repository pnpm lock records the exact package-owned MapLibre dependency
#   state. It is not evidence that the held browser runtime is ready.
# Inputs:
# - MapLibre scripts, placeholder schemas/validators, config, fixture/test lanes,
#   package/Make commands, renderer/docs boundaries, and candidate trust builders.
# Outputs:
# - GitHub job conclusion, logs, annotations, and step summary only. No screenshot,
#   receipt, attestation, proof, release record, correction, rollback, or artifact upload.
# Outcome:
# - Static syntax/negative tests pass and held assumptions remain: explicit HOLD.
#   A successful check means the reviewed hold is intact, not runtime readiness.
# - Static failure, missing boundary, or surfaced runtime/governance maturity:
#   WORKFLOW_FAIL until commands, fixtures, schemas, policy, and authority are reviewed.
# Compatibility:
# - Workflow name `MapLibre Perf Governance`, job id
#   `maplibre-perf-governance`, and job name `MapLibre perf governance` are preserved.
# Rollback / disable:
# - Revert this workflow revision. Do not restore unused OIDC, unlocked installs,
#   the retired live-CDN renderer, unsigned attestation, or trust-shaped
#   artifact generation
#   without MapLibre, security, evidence, policy, release, and CI review.
# Authority boundary:
# - Renderer metrics and screenshots are derived QA signals, not canonical truth.
#   Passing this readiness gate does not prove performance, visual equivalence,
#   evidence closure, signing, release eligibility, or publication safety.
name: MapLibre Perf Governance

"on":
  pull_request:
    paths:
      - ".github/workflows/maplibre-perf-governance.yml"
      - ".github/workflows/maplibre-acquisition-inventory.yml"
      - ".github/workflows/briefing-implementation-campaign.yml"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "yarn.lock"
      - "apps/explorer-web/**"
      - "apps/web/**"
      - "artifacts/perf/**"
      - "configs/maplibre/**"
      - "data/proofs/maplibre-perf/**"
      - "docs/quality/maplibre-perf-governance.md"
      - "docs/architecture/briefing-implementation-campaign-20260806.md"
      - "fixtures/heavy/**"
      - "fixtures/slim/**"
      - "fixtures/maplibre/v6_readiness/**"
      - "packages/maplibre/**"
      - "packages/maplibre-runtime/**"
      - "release/maplibre-perf/**"
      - "schemas/maplibre/**"
      - "schemas/contracts/v1/maplibre/**"
      - "scripts/*maplibre*"
      - "tests/fixtures/maplibre/**"
      - "tests/maplibre/**"
      - "tools/validators/maplibre/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/maplibre-perf-governance.yml"
      - ".github/workflows/maplibre-acquisition-inventory.yml"
      - ".github/workflows/briefing-implementation-campaign.yml"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "yarn.lock"
      - "apps/explorer-web/**"
      - "apps/web/**"
      - "artifacts/perf/**"
      - "configs/maplibre/**"
      - "data/proofs/maplibre-perf/**"
      - "docs/quality/maplibre-perf-governance.md"
      - "docs/architecture/briefing-implementation-campaign-20260806.md"
      - "fixtures/heavy/**"
      - "fixtures/slim/**"
      - "fixtures/maplibre/v6_readiness/**"
      - "packages/maplibre/**"
      - "packages/maplibre-runtime/**"
      - "release/maplibre-perf/**"
      - "schemas/maplibre/**"
      - "schemas/contracts/v1/maplibre/**"
      - "scripts/*maplibre*"
      - "tests/fixtures/maplibre/**"
      - "tests/maplibre/**"
      - "tools/validators/maplibre/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maplibre-perf-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  maplibre-perf-governance:
    name: MapLibre perf governance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out MapLibre governance boundaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check MapLibre script and validator syntax
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            "scripts/attest-maplibre-perf.mjs"
            "scripts/build-maplibre-perf-correction-and-rollback.mjs"
            "scripts/build-maplibre-perf-failure-bundle.mjs"
            "scripts/build-maplibre-perf-proof-pack.mjs"
            "scripts/build-maplibre-perf-release-manifest.mjs"
            "scripts/build-maplibre-render-diff.mjs"
            "scripts/maplibre-smoke-perf.mjs"
          )

          for script in "${scripts[@]}"; do
            node --check "$script"
          done

          python - <<'PY'
          import ast
          from pathlib import Path

          python_paths = sorted(Path("tools/validators/maplibre").glob("*.py"))
          python_paths.extend(sorted(Path("tests/maplibre").glob("*.py")))
          if not python_paths:
              raise SystemExit("No MapLibre Python validator/test files were found.")

          for path in python_paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"parsed Python syntax: {path}")
          PY

      - name: Run deterministic MapLibre negative-path tests
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from tests.maplibre.test_perf_governance_negative_paths import (
              test_rejects_negative_memory_budget,
              test_rejects_out_of_range_tile_error_rate,
              test_rejects_zero_frame_budget,
          )
          from tests.maplibre.test_legacy_perf_harness_retirement import (
              test_retired_harness_fails_with_a_finite_hold,
              test_retired_harness_has_no_renderer_or_network_acquisition,
          )

          tests = (
              test_rejects_zero_frame_budget,
              test_rejects_negative_memory_budget,
              test_rejects_out_of_range_tile_error_rate,
              test_retired_harness_fails_with_a_finite_hold,
              test_retired_harness_has_no_renderer_or_network_acquisition,
          )
          for test in tests:
              test()
              print(f"passed deterministic negative path: {test.__name__}")
          PY

      - name: Evaluate governed runtime readiness
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "Makefile"
            ".github/workflows/maplibre-acquisition-inventory.yml"
            ".github/workflows/briefing-implementation-campaign.yml"
            "apps/explorer-web"
            "configs/maplibre/README.md"
            "configs/maplibre/perf-envelope.v1.json"
            "docs/doctrine/directory-rules.md"
            "docs/architecture/briefing-implementation-campaign-20260806.md"
            "docs/quality/maplibre-perf-governance.md"
            "fixtures/heavy/README.md"
            "fixtures/slim/README.md"
            "fixtures/maplibre/v6_readiness/cases.json"
            "package.json"
            "pnpm-lock.yaml"
            "pnpm-workspace.yaml"
            "packages/maplibre/package.json"
            "packages/maplibre/README.md"
            "schemas/maplibre/perf-correction-notice.schema.json"
            "schemas/maplibre/perf-envelope.schema.json"
            "schemas/maplibre/perf-failure-bundle.schema.json"
            "schemas/maplibre/perf-proof-pack.schema.json"
            "schemas/maplibre/perf-receipt.schema.json"
            "schemas/maplibre/perf-release-manifest.schema.json"
            "schemas/maplibre/perf-rollback-plan.schema.json"
            "schemas/maplibre/render-diff-report.schema.json"
            "tests/fixtures/maplibre/README.md"
            "tests/maplibre/README.md"
            "tests/maplibre/perf_fixture_builder.py"
            "tests/maplibre/test_assess_acquisition_inventory.py"
            "tests/maplibre/test_legacy_perf_harness_retirement.py"
            "tests/maplibre/test_perf_governance_negative_paths.py"
            "tests/maplibre/test_validate_v6_readiness.py"
            "tools/validators/maplibre/README.md"
            "tools/validators/maplibre/assess_acquisition_inventory.py"
            "tools/validators/maplibre/validate_perf_governance.py"
            "tools/validators/maplibre/validate_v6_readiness.py"
          )

          for required_path in "${required_paths[@]}"; do
            if [[ ! -e "$required_path" ]]; then
              echo "::error::Required MapLibre governance boundary is missing: $required_path"
              exit 1
            fi
          done

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          from tools.validators.maplibre.validate_v6_readiness import (
              Outcome as ReadinessOutcome,
              TARGET_VERSION,
              scan_repository,
          )

          alternative_lockfiles = (
              Path("package-lock.json"),
              Path("npm-shrinkwrap.json"),
              Path("yarn.lock"),
          )
          surfaced_alternatives = [
              path for path in alternative_lockfiles if path.exists()
          ]
          if surfaced_alternatives:
              raise SystemExit(
                  "An alternative dependency lockfile surfaced. Reconcile the accepted "
                  "pnpm workspace, install, cache, and no-network posture before changing CI:\n"
                  + "\n".join(str(path) for path in surfaced_alternatives)
              )

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          if package.get("packageManager") != "pnpm@11.17.0":
              raise SystemExit(
                  "The accepted root package-manager pin changed. Review lockfile format, "
                  "runner setup, cache behavior, and rollback before changing CI."
              )

          workspace_text = Path("pnpm-workspace.yaml").read_text(encoding="utf-8")
          for workspace_marker in ('  - "apps/*"', '  - "packages/*"'):
              if workspace_marker not in workspace_text:
                  raise SystemExit(
                      "The accepted pnpm workspace boundary changed. Reconcile Explorer and "
                      f"package ownership before changing CI; missing: {workspace_marker}"
                  )

          lock_text = Path("pnpm-lock.yaml").read_text(encoding="utf-8")
          for lock_marker in (
              "lockfileVersion: '9.0'",
              "  apps/explorer-web:",
              "  packages/maplibre:",
          ):
              if lock_marker not in lock_text:
                  raise SystemExit(
                      "The reviewed pnpm lockfile boundary changed. Reconcile the Explorer "
                      "importer and MapLibre dependency posture before changing CI; "
                      f"missing: {lock_marker}"
                  )

          maplibre_package = json.loads(
              Path("packages/maplibre/package.json").read_text(encoding="utf-8")
          )
          runtime_dependencies = maplibre_package.get("dependencies")
          dev_dependencies = maplibre_package.get("devDependencies")
          if (
              not isinstance(runtime_dependencies, dict)
              or set(runtime_dependencies) != {"maplibre-gl"}
          ):
              raise SystemExit(
                  "The @kfm/maplibre runtime dependency boundary changed. Review ownership, "
                  "browser installation, license, cache, and no-network behavior before "
                  "changing CI; expected only maplibre-gl in dependencies."
              )
          selected_version = runtime_dependencies["maplibre-gl"]
          if (
              not isinstance(selected_version, str)
              or re.fullmatch(r"6\.[0-9]+\.[0-9]+", selected_version) is None
          ):
              raise SystemExit(
                  "The @kfm/maplibre package must select one exact MapLibre GL JS 6.x "
                  "version; ranges and unreviewed majors are not accepted by this gate."
              )
          if dev_dependencies != {"vitest": "4.1.11"}:
              raise SystemExit(
                  "The reviewed @kfm/maplibre development dependency boundary changed. "
                  "Reconcile package tests and install behavior before changing CI."
              )
          for field in ("optionalDependencies", "peerDependencies"):
              if maplibre_package.get(field):
                  raise SystemExit(
                      f"The @kfm/maplibre {field} boundary changed. Review runtime and "
                      "consumer compatibility before changing CI."
                  )

          importer_marker = (
              "  packages/maplibre:\n"
              "    dependencies:\n"
              "      maplibre-gl:\n"
              f"        specifier: {selected_version}\n"
              f"        version: {selected_version}\n"
              "    devDependencies:\n"
              "      vitest:\n"
              "        specifier: 4.1.11\n"
          )
          if importer_marker not in lock_text:
              raise SystemExit(
                  "The @kfm/maplibre manifest and pnpm importer disagree. Regenerate and "
                  "review the exact lock closure before changing CI."
              )
          if re.search(
              rf"(?m)^  maplibre-gl@{re.escape(selected_version)}:\n"
              r"    resolution: \{integrity: sha512-[A-Za-z0-9+/=]+\}$",
              lock_text,
          ) is None:
              raise SystemExit(
                  "The selected MapLibre package lacks an integrity-bound pnpm resolution."
              )

          readiness = scan_repository(Path("."))
          if readiness.outcome is not ReadinessOutcome.HOLD:
              raise SystemExit(
                  "MapLibre readiness no longer has the reviewed HOLD outcome. Reconcile "
                  "browser probes and governance authority before changing CI."
              )
          if readiness.selected_version != selected_version:
              raise SystemExit(
                  "The performance gate and readiness classifier disagree on the selected "
                  "MapLibre version."
              )
          if "RUNTIME_PROBES_PENDING" not in readiness.reasons:
              raise SystemExit(
                  "MapLibre runtime probes no longer have the reviewed pending posture. "
                  "Reconcile browser evidence before changing CI."
              )

          acquisition_inventory_companions = (
              Path(".github/workflows/maplibre-acquisition-inventory.yml"),
              Path("tests/maplibre/test_assess_acquisition_inventory.py"),
              Path("tools/validators/maplibre/assess_acquisition_inventory.py"),
          )
          missing_acquisition_inventory_companions = [
              path for path in acquisition_inventory_companions if not path.is_file()
          ]
          if missing_acquisition_inventory_companions:
              raise SystemExit(
                  "The separately governed MapLibre acquisition inventory is incomplete. "
                  "Keep its workflow, tests, and validator review boundary together:\n"
                  + "\n".join(
                      str(path) for path in missing_acquisition_inventory_companions
                  )
              )

          fixture_root = Path("tests/fixtures/maplibre")
          source_metadata_root = fixture_root / "source-metadata"
          source_metadata_payloads = sorted(
              path
              for path in source_metadata_root.rglob("*")
              if path.is_file() and path.name not in {"README.md", ".gitkeep"}
          )
          if source_metadata_root.exists():
              source_metadata_companions = (
                  Path(".github/workflows/maplibre-source-metadata.yml"),
                  Path("tests/maplibre/test_source_metadata.py"),
                  Path("tools/validators/maplibre/validate_source_metadata.py"),
              )
              missing_source_metadata_companions = [
                  path for path in source_metadata_companions if not path.is_file()
              ]
              if missing_source_metadata_companions:
                  raise SystemExit(
                      "MapLibre source-metadata fixtures surfaced without their dedicated "
                      "workflow, test, and validator boundaries:\n"
                      + "\n".join(
                          str(path) for path in missing_source_metadata_companions
                      )
                  )
              unsupported_source_metadata_payloads = [
                  path for path in source_metadata_payloads if path.suffix != ".json"
              ]
              if unsupported_source_metadata_payloads:
                  raise SystemExit(
                      "MapLibre source-metadata fixture payloads must remain JSON-only:\n"
                      + "\n".join(
                          str(path) for path in unsupported_source_metadata_payloads
                      )
                  )
              if not source_metadata_payloads:
                  raise SystemExit(
                      "The MapLibre source-metadata fixture root exists but contains no "
                      "JSON fixture payloads."
                  )

          unclassified_fixture_payloads = sorted(
              path
              for path in fixture_root.rglob("*")
              if (
                  path.is_file()
                  and path.name not in {"README.md", ".gitkeep"}
                  and source_metadata_root not in path.parents
              )
          )
          if unclassified_fixture_payloads:
              raise SystemExit(
                  "Unclassified MapLibre performance fixture payloads surfaced. Wire "
                  "deterministic valid, invalid, baseline, and bad-baseline expectations "
                  "deliberately:\n"
                  + "\n".join(str(path) for path in unclassified_fixture_payloads)
              )

          missing_runtime_fixtures = (
              Path("fixtures/slim/style.json"),
              Path("fixtures/heavy/style.json"),
          )
          if any(path.exists() for path in missing_runtime_fixtures):
              raise SystemExit(
                  "A runtime style fixture surfaced. Review local tiles, glyphs, sprites, "
                  "network denial, expected metrics, and browser tests before restoring the run."
              )

          if Path("apps/web").exists():
              raise SystemExit(
                  "Legacy apps/web surfaced. Resolve it against the accepted "
                  "apps/explorer-web responsibility root before changing workflow scope."
              )
          for future_root in (
              Path("packages/maplibre-runtime"),
              Path("schemas/contracts/v1/maplibre"),
          ):
              if future_root.exists():
                  raise SystemExit(
                      f"Canonical migration target surfaced at {future_root}. Reconcile the "
                      "transitional package/schema homes before changing CI."
                  )

          schema_paths = sorted(Path("schemas/maplibre").glob("*.schema.json"))
          expected_schema_names = {
              "perf-correction-notice.schema.json",
              "perf-envelope.schema.json",
              "perf-failure-bundle.schema.json",
              "perf-proof-pack.schema.json",
              "perf-receipt.schema.json",
              "perf-release-manifest.schema.json",
              "perf-rollback-plan.schema.json",
              "render-diff-report.schema.json",
          }
          if {path.name for path in schema_paths} != expected_schema_names:
              raise SystemExit(
                  "MapLibre perf schema inventory changed. Review contract/schema placement "
                  "and deterministic fixtures before changing CI."
              )
          placeholder_schema = {
              "$schema": "https://json-schema.org/draft/2020-12/schema",
              "type": "object",
              "additionalProperties": True,
          }
          for path in schema_paths:
              if json.loads(path.read_text(encoding="utf-8")) != placeholder_schema:
                  raise SystemExit(
                      f"{path} is no longer the reviewed accept-any-object placeholder. "
                      "Wire its contract, valid/invalid fixtures, and validator deliberately."
                  )

          schema_wrappers = {
              "validate_perf_correction_notice.py",
              "validate_perf_envelope.py",
              "validate_perf_failure_bundle.py",
              "validate_perf_proof_pack.py",
              "validate_perf_receipt.py",
              "validate_perf_release_manifest.py",
              "validate_perf_rollback_plan.py",
              "validate_render_diff_report.py",
          }
          placeholder_validators = {
              "validate_perf_governance.py",
              "verify_perf_artifact_hashes.py",
              "verify_perf_manifest_coverage.py",
              "verify_perf_metrics_from_frames.py",
              "verify_perf_subject_links.py",
              "verify_perf_thresholds.py",
              "verify_render_diff_coverage.py",
          }
          separately_governed_validators = {
              "assess_acquisition_inventory.py",
              "validate_v6_readiness.py",
          } | (
              {"validate_source_metadata.py"}
              if source_metadata_root.exists()
              else set()
          )
          validator_root = Path("tools/validators/maplibre")
          actual_validators = {path.name for path in validator_root.glob("*.py")}
          expected_validators = (
              schema_wrappers
              | placeholder_validators
              | separately_governed_validators
          )
          if actual_validators != expected_validators:
              raise SystemExit(
                  "MapLibre validator inventory changed outside the accepted perf "
                  "wrappers/placeholders and separately governed acquisition-inventory, "
                  "source-metadata, and v6-readiness lanes. "
                  "Review the aggregate command, inputs, fixtures, and exit outcomes before "
                  "changing CI."
              )
          for name in schema_wrappers:
              text = (validator_root / name).read_text(encoding="utf-8")
              if "tools.validators._common.jsonschema_runner" not in text:
                  raise SystemExit(f"Schema-validator wrapper changed: {name}")
          for name in placeholder_validators:
              text = (validator_root / name).read_text(encoding="utf-8")
              if "Placeholder" not in text or "No files provided" not in text:
                  raise SystemExit(
                      f"Placeholder validator maturity changed: {name}. Wire it deliberately."
                  )

          envelope = json.loads(
              Path("configs/maplibre/perf-envelope.v1.json").read_text(
                  encoding="utf-8"
              )
          )
          if envelope.get("object_type") != "PerfEnvelope" or not isinstance(
              envelope.get("thresholds"), dict
          ):
              raise SystemExit(
                  "MapLibre performance envelope identity/threshold shape changed. Review its "
                  "contract and meaningful schema before changing CI."
              )

          dev_dependencies = package.get("devDependencies", {})
          for dependency in ("pixelmatch", "playwright", "pngjs"):
              if dependency not in dev_dependencies:
                  raise SystemExit(
                      f"Expected root MapLibre QA dependency changed or disappeared: {dependency}"
                  )
          govern_command = package.get("scripts", {}).get("maplibre:govern", "")
          if govern_command.strip() != (
              "python3 tools/validators/maplibre/validate_perf_governance.py"
          ):
              raise SystemExit(
                  "The root MapLibre governance command changed. Review accepted arguments, "
                  "outcomes, and fixtures before invoking it."
              )

          makefile = Path("Makefile").read_text(encoding="utf-8")
          if not re.search(
              r"(?m)^maplibre-govern:\s*\n\s*python3 "
              r"tools/validators/maplibre/validate_perf_governance\.py\s*$",
              makefile,
          ):
              raise SystemExit(
                  "The Make MapLibre governance target changed. Review and wire its accepted "
                  "inputs instead of retaining the no-argument hold."
              )

          smoke_text = Path("scripts/maplibre-smoke-perf.mjs").read_text(
              encoding="utf-8"
          )
          for marker in (
              "WORKFLOW_HOLD: the legacy MapLibre performance harness is retired.",
              "performance execution remains NOT_RUN",
          ):
              if marker not in smoke_text:
                  raise SystemExit(
                      "The retired MapLibre harness posture changed. Reassess browser, "
                      f"performance, artifact, and authority closure; missing: {marker}"
                  )
          for forbidden in (
              "unpkg.com",
              "demotiles.maplibre.org",
              "maplibregl",
              'from "playwright"',
          ):
              if forbidden in smoke_text:
                  raise SystemExit(
                      "The retired MapLibre harness reacquired a renderer, browser, or "
                      f"network endpoint outside the package seam: {forbidden}"
                  )

          trust_markers = {
              Path("scripts/attest-maplibre-perf.mjs"): (
                  "signatures: []",
                  'signing_status: "unsigned"',
              ),
              Path("scripts/build-maplibre-perf-proof-pack.mjs"): (
                  'object_type: "ProofPack"',
                  'validation_outcome: "ANSWER"',
              ),
              Path("scripts/build-maplibre-perf-release-manifest.mjs"): (
                  'object_type: "ReleaseManifest"',
                  "artifacts/perf/release-manifest.maplibre-perf.json",
              ),
              Path("scripts/build-maplibre-perf-correction-and-rollback.mjs"): (
                  'object_type: "CorrectionNotice"',
                  'object_type: "RollbackPlan"',
              ),
          }
          for path, markers in trust_markers.items():
              text = path.read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(
                          f"Trust-shaped candidate builder changed at {path}. Reassess "
                          f"authority and accepted output roots; missing: {marker}"
                      )

          artifact_root = Path("artifacts/perf")
          if artifact_root.exists() and any(
              path.is_file() for path in artifact_root.rglob("*")
          ):
              raise SystemExit(
                  "Tracked MapLibre perf artifacts surfaced. Classify QA versus trust-bearing "
                  "content and move it to accepted roots before changing CI."
              )

          print("The reviewed pnpm workspace lockfile is present and no alternative lockfile exists.")
          print(
              "The @kfm/maplibre manifest and lock agree on exact "
              f"maplibre-gl@{selected_version}; no optional or peer dependency surfaced."
          )
          print(
              f"MapLibre {TARGET_VERSION} readiness remains HOLD with runtime probes pending."
          )
          if source_metadata_payloads:
              print(
                  f"Classified {len(source_metadata_payloads)} source-metadata JSON payloads "
                  "under the dedicated no-network validator lane."
              )
          print(
              "Classified the structural MapLibre acquisition inventory under its "
              "dedicated no-network workflow and test lane."
          )
          print(
              "Classified the fixture-only MapLibre v6 readiness validator under "
              "the briefing implementation campaign."
          )
          print("No unclassified MapLibre performance fixture payloads exist.")
          print("All eight MapLibre perf schemas remain accept-any-object placeholders.")
          print("Governance verifiers remain placeholders and the aggregate command remains no-argument.")
          print("The legacy live-CDN browser harness is retired and fails with a finite HOLD.")
          print("Attestation remains unsigned; proof/release outcomes remain candidate builders in artifacts/.")
          PY


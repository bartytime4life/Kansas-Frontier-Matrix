# KFM People/DNA/Land domain CI readiness workflow.
# Status: two bounded synthetic consent fixture profiles are executable;
# broader validation, policy-runtime, proof, revocation execution, cleanup, and
# release producers remain held.
#
# Authority boundary:
# - This workflow opens only repository-owned synthetic fixture payloads under
#   fixtures/domains/people-dna-land/consent_overlay/ and
#   fixtures/domains/people-dna-land/consent_revocation_propagation/.
# - It does not open real person, genealogy, DNA/genomic, consent, revocation,
#   parcel, deed, title, assessor, tax, or private person-land payloads.
# - It does not establish identity, kinship, consent validity, title, boundary,
#   rights, sensitivity, EvidenceBundle closure, policy approval, release
#   approval, or public use.
name: domain-people-dna-land

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-people-dna-land-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  PYTHONUNBUFFERED: "1"

jobs:
  validate-people-dna-land:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out People DNA Land boundaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Inspect People DNA Land validation boundaries
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "docs/domains/people-dna-land/README.md"
            "docs/domains/people-dna-land/SCOPE_AND_BOUNDARY.md"
            "docs/domains/people-dna-land/SENSITIVITY.md"
            "docs/domains/people-dna-land/DNA_HANDLING.md"
            "contracts/domains/people-dna-land/README.md"
            "contracts/domains/people-dna-land/consented_genealogy_overlay.md"
            "contracts/domains/people-dna-land/consent_revocation_propagation_assessment.md"
            "schemas/contracts/v1/domains/people-dna-land/README.md"
            "schemas/contracts/v1/domains/people-dna-land/consented_genealogy_overlay.schema.json"
            "schemas/contracts/v1/domains/people-dna-land/genealogy_overlay_revocation_manifest.schema.json"
            "schemas/contracts/v1/domains/people-dna-land/consent_revocation_propagation_assessment.schema.json"
            "fixtures/domains/people-dna-land/README.md"
            "fixtures/domains/people-dna-land/consent_overlay/README.md"
            "fixtures/domains/people-dna-land/consent_overlay/revocation_manifest.json"
            "fixtures/domains/people-dna-land/consent_revocation_propagation/README.md"
            "fixtures/domains/people-dna-land/consent_revocation_propagation/cases.json"
            "policy/domains/people-dna-land/README.md"
            "policy/consent/people-dna-land/README.md"
            "tests/domains/people-dna-land/README.md"
            "tests/domains/people-dna-land/consent/revocation/README.md"
            "tests/domains/people-dna-land/consent/revocation/test_consent_overlay_safety.py"
            "tests/domains/people-dna-land/consent/revocation/test_consent_revocation_propagation_assessment.py"
            "tools/validators/domains/people-dna-land/README.md"
            "tools/validators/domains/people-dna-land/validate_consent_overlay.py"
            "tools/validators/domains/people-dna-land/validate_consent_revocation_propagation_assessment.py"
            "tools/validators/genealogy/README.md"
            "data/registry/sources/people-dna-land/README.md"
            "release/candidates/people-dna-land/README.md"
          )

          for required_path in "${required_paths[@]}"; do
            if [[ ! -e "$required_path" ]]; then
              echo "::error::Required People/DNA/Land boundary is missing: $required_path"
              exit 1
            fi
          done

          python - <<'PY'
          from pathlib import Path

          from tools.validators.ci_readiness import (
              classify_test_source,
              classify_validator_source,
          )

          accepted_tests = {
              Path(
                  "tests/domains/people-dna-land/consent/revocation/"
                  "test_consent_overlay_safety.py"
              ),
              Path(
                  "tests/domains/people-dna-land/consent/revocation/"
                  "test_consent_revocation_propagation_assessment.py"
              ),
          }
          accepted_validators = {
              Path(
                  "tools/validators/domains/people-dna-land/"
                  "validate_consent_overlay.py"
              ),
              Path(
                  "tools/validators/domains/people-dna-land/"
                  "validate_consent_revocation_propagation_assessment.py"
              ),
          }

          for path in sorted(Path("tests/domains/people-dna-land").rglob("*.py")):
              classification = classify_test_source(path.read_text(encoding="utf-8"))
              if path in accepted_tests:
                  if classification.placeholder:
                      raise SystemExit(
                          f"Accepted People/DNA/Land test regressed: {path}"
                      )
              elif not classification.placeholder:
                  raise SystemExit(
                      f"Unwired People/DNA/Land test became substantive: {path}"
                  )

          validator_roots = (
              Path("tools/validators/domains/people-dna-land"),
              Path("tools/validators/genealogy"),
          )
          for root in validator_roots:
              for path in sorted(root.rglob("*.py")):
                  classification = classify_validator_source(
                      path.read_text(encoding="utf-8")
                  )
                  if path in accepted_validators:
                      if classification.placeholder:
                          raise SystemExit(
                              f"Accepted People/DNA/Land validator regressed: {path}"
                          )
                  elif not classification.placeholder:
                      raise SystemExit(
                          f"Unwired People/DNA/Land validator became substantive: {path}"
                      )

          fixture_root = Path("fixtures/domains/people-dna-land")
          accepted_fixture_roots = {
              fixture_root / "consent_overlay",
              fixture_root / "consent_revocation_propagation",
          }
          expected_markers = {
              fixture_root / "golden/PLACEHOLDER.md":
                  "Greenfield placeholder for golden fixture set.",
              fixture_root / "invalid/PLACEHOLDER.md":
                  "Greenfield placeholder for invalid fixture set.",
              fixture_root / "valid/PLACEHOLDER.md":
                  "Greenfield placeholder for valid fixture set.",
          }
          observed_markers = set(fixture_root.rglob("PLACEHOLDER.md"))
          if observed_markers != set(expected_markers):
              raise SystemExit(
                  "People/DNA/Land fixture marker inventory changed; "
                  f"expected={sorted(path.as_posix() for path in expected_markers)}; "
                  f"observed={sorted(path.as_posix() for path in observed_markers)}."
              )

          for path, expected_text in expected_markers.items():
              if path.read_text(encoding="utf-8").strip() != expected_text:
                  raise SystemExit(
                      f"People/DNA/Land fixture marker content changed at {path}; "
                      "review it before accepting this workflow."
                  )

          surfaced_payloads = sorted(
              path.as_posix()
              for path in fixture_root.rglob("*")
              if path.is_file()
              and path.name not in {"README.md", ".gitkeep", "PLACEHOLDER.md"}
              and not any(
                  path.is_relative_to(root) for root in accepted_fixture_roots
              )
          )
          if surfaced_payloads:
              raise SystemExit(
                  "Unreviewed People/DNA/Land fixture payloads surfaced outside "
                  f"the accepted synthetic profiles: {surfaced_payloads}."
              )

          print(
              "People/DNA/Land executable, placeholder, marker, and synthetic "
              "fixture inventories are explicit."
          )
          PY

          if ! grep -Fq "PROPOSED (greenfield scaffold)" "policy/domains/people-dna-land/README.md"; then
            echo "::error::The domain policy posture changed. Verify executable rules, policy ownership, fixtures, tests, and activation before accepting this workflow."
            exit 1
          fi

          if ! grep -Fq "Repository presence is not policy activation." "policy/consent/people-dna-land/README.md"; then
            echo "::error::The consent-policy posture changed. Verify placement, bundle activation, evaluator wiring, revocation, receipts, cache invalidation, and release integration."
            exit 1
          fi

          if grep -Eq '^(people-dna-land-validate|validate-people-dna-land):' Makefile; then
            echo "::error::A People/DNA/Land validation target now exists. Wire and verify it deliberately instead of retaining this bounded workflow path."
            exit 1
          fi

          echo "WORKFLOW_CHECK_EXECUTED: people-dna-land-validation-boundary-inventory"
          echo "WORKFLOW_HOLD: broader People/DNA/Land validation and consent enforcement are not established"

      - name: Run bounded consent-safe genealogy-overlay validation
        shell: bash
        env:
          KFM_NO_NETWORK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail

          python tests/domains/people-dna-land/consent/revocation/test_consent_overlay_safety.py --verbose

          python tools/validators/domains/people-dna-land/validate_consent_overlay.py \
            --revocation-manifest fixtures/domains/people-dna-land/consent_overlay/revocation_manifest.json \
            fixtures/domains/people-dna-land/consent_overlay/valid/*.json

          if python tools/validators/domains/people-dna-land/validate_consent_overlay.py \
            --revocation-manifest fixtures/domains/people-dna-land/consent_overlay/revocation_manifest.json \
            fixtures/domains/people-dna-land/consent_overlay/invalid/*.json; then
            echo "::error::Known-invalid consent-overlay fixtures were accepted."
            exit 1
          fi

          echo "EXPECTED_REJECTION: invalid consent-overlay fixtures"
          echo "WORKFLOW_CHECK_EXECUTED: people-dna-land-consent-overlay-fixture"

      - name: Run bounded consent-revocation propagation assessment
        shell: bash
        env:
          KFM_NO_NETWORK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail

          python tests/domains/people-dna-land/consent/revocation/test_consent_revocation_propagation_assessment.py --verbose
          python tools/validators/domains/people-dna-land/validate_consent_revocation_propagation_assessment.py --fixtures

          echo "WORKFLOW_CHECK_EXECUTED: people-dna-land-consent-revocation-propagation-assessment"

      - name: Record People DNA Land validation result and broader hold
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### People/DNA/Land validation status

          `WORKFLOW_CHECK_EXECUTED: people-dna-land-consent-overlay-fixture`

          `WORKFLOW_CHECK_EXECUTED: people-dna-land-consent-revocation-propagation-assessment`

          `WORKFLOW_HOLD: broader People/DNA/Land semantics, policy runtime, evidence closure, proof, and release remain unestablished`

          When green, this job has executed two frozen, synthetic, no-network
          fixture profiles: a consent-safe genealogy-overlay candidate and a
          consent-revocation propagation assessment. They check active consent
          for living-person and DNA-derived summaries,
          expiry and revocation precedence, manifest-root and membership checks,
          deterministic hashes, fixture EvidenceRefs, coarse synthetic place and
          time buckets, high-confidence evidence support, identifying-field and
          raw-genomic denial, public-release denial, seven-surface dependency
          coverage, declared propagation receipts, bounded JSON parsing,
          deterministic diagnostics, and explicit network denial.

          The profile is not a production overlay contract or consent system. It
          does not validate real people, identity, kinship, DNA, consent legal
          sufficiency, source rights, EvidenceBundles, policy approval, public-safe
          transforms, release readiness, withdrawal execution, cache invalidation,
          or publication. Other People/DNA/Land test and validator modules remain
          explicit placeholders or documentation-only lanes.
          EOF

  build-proof-people-dna-land:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out People DNA Land proof boundaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate People DNA Land proof readiness
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "data/proofs/people-dna-land/README.md"
            "policy/consent/people-dna-land/README.md"
            "tests/domains/people-dna-land/consent/revocation/README.md"
            "release/candidates/people-dna-land/README.md"
          )

          for required_path in "${required_paths[@]}"; do
            if [[ ! -e "$required_path" ]]; then
              echo "::error::Required People/DNA/Land proof boundary is missing: $required_path"
              exit 1
            fi
          done

          if ! grep -Fq "NEEDS VERIFICATION for emitted proof files" "data/proofs/people-dna-land/README.md"; then
            echo "::error::The People/DNA/Land proof posture changed. Review schemas, producers, access controls, consent/revocation binding, receipts, and release linkage."
            exit 1
          fi

          proof_artifact="$(find data/proofs/people-dna-land -type f ! -name 'README.md' ! -name '.gitkeep' -print -quit)"
          if [[ -n "$proof_artifact" ]]; then
            echo "::error::People/DNA/Land proof material surfaced at $proof_artifact. Replace this hold with an independently reviewed proof validator; this workflow intentionally does not open the artifact."
            exit 1
          fi

          if grep -Eq '^(people-dna-land-proof|proof-people-dna-land):' Makefile; then
            echo "::error::A People/DNA/Land proof target now exists. Wire and validate it deliberately instead of retaining this hold."
            exit 1
          fi

          proof_implementation="$(find tools pipelines packages scripts -type f \( -iname '*people*dna*land*proof*.py' -o -iname '*proof*people*dna*land*.py' -o -iname '*people*dna*land*proof*.mjs' -o -iname '*proof*people*dna*land*.mjs' \) -print -quit 2>/dev/null || true)"
          if [[ -n "$proof_implementation" ]]; then
            echo "::error::Potential People/DNA/Land proof implementation surfaced at $proof_implementation. Establish its contract, synthetic fixtures, consent/revocation controls, receipts, access controls, and rollback before wiring CI."
            exit 1
          fi

          echo "WORKFLOW_SKIPPED_EXPLICIT: build-proof-people-dna-land"
          echo "WORKFLOW_HOLD: no accepted People/DNA/Land proof producer or deterministic proof command"

      - name: Record People DNA Land proof hold
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### People/DNA/Land proof status

          `WORKFLOW_SKIPPED_EXPLICIT`

          `WORKFLOW_HOLD: no accepted People/DNA/Land proof producer or deterministic proof command`

          The proof lane is documented, but emitted proof files, schemas,
          validators, consent and revocation binding, public-safe fixtures, access
          controls, receipt linkage, cache invalidation, and release linkage remain
          unverified.

          A green held result is not an EvidenceBundle, ProofPack, consent proof,
          revocation or cleanup execution, kinship finding, DNA finding, title
          opinion, legal determination, release decision, or publication authority.
          EOF

  publish-dry-run-people-dna-land:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out People DNA Land release boundaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate People DNA Land release dry-run readiness
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "release/candidates/people-dna-land/README.md"
            "docs/domains/people-dna-land/RELEASE_INDEX.md"
            "data/published/people-dna-land/README.md"
            "policy/consent/people-dna-land/README.md"
            ".github/workflows/release-dry-run.yml"
          )

          for required_path in "${required_paths[@]}"; do
            if [[ ! -e "$required_path" ]]; then
              echo "::error::Required People/DNA/Land release boundary is missing: $required_path"
              exit 1
            fi
          done

          if ! grep -Fq "A candidate is not a release." "release/candidates/people-dna-land/README.md"; then
            echo "::error::The documented People/DNA/Land candidate posture changed. Re-evaluate evidence, consent, revocation, rights, sensitivity, privacy, review, correction, withdrawal, and rollback gates."
            exit 1
          fi

          candidate_record="$(find release/candidates/people-dna-land -mindepth 1 -type f ! -name 'README.md' ! -name '.gitkeep' -print -quit)"
          if [[ -n "$candidate_record" ]]; then
            echo "::error::A People/DNA/Land candidate record surfaced at $candidate_record. Replace this hold with an independently reviewed domain dry-run path; this workflow intentionally does not open the record."
            exit 1
          fi

          if grep -Eq '^(people-dna-land-release-dry-run|release-dry-run-people-dna-land):' Makefile; then
            echo "::error::A People/DNA/Land release dry-run target now exists. Wire the accepted fail-closed command instead of retaining this hold."
            exit 1
          fi

          echo "WORKFLOW_SKIPPED_EXPLICIT: publish-dry-run-people-dna-land"
          echo "WORKFLOW_HOLD: no accepted People/DNA/Land release dry-run command or candidate manifest contract"

      - name: Record People DNA Land release dry-run hold
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### People/DNA/Land release dry-run status

          `WORKFLOW_SKIPPED_EXPLICIT`

          `WORKFLOW_HOLD: no accepted People/DNA/Land release dry-run command or candidate manifest contract`

          This lane performs no source access, identity resolution, consent or
          revocation operation, public-safe transform, release, promotion, manifest
          assembly, deployment, publication, or write to lifecycle, proof, receipt,
          release, cache, graph, search, vector, AI, or published stores.

          Graduate it only after candidate identity, immutable artifact pointer,
          source and EvidenceBundle closure, rights, consent and revocation state,
          privacy and sensitivity review, public-safe transformation, validation
          receipts, independent approval, correction, withdrawal, downstream cache
          invalidation, and rollback targets are accepted.

          A green held result does not mean People/DNA/Land material is accurate,
          legally sufficient, consented, privacy-safe, title-correct, approved,
          released, or published.
          EOF

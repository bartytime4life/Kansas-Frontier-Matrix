name: release-dry-run-binding-diagnostic

"on":
  pull_request:
    paths:
      - ".github/workflows/release-dry-run-binding-diagnostic.yml"
      - "data/receipts/generated/genrec-publication-deny-dry-run-current-20260815.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute-current-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out inspected revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Emit current successor and staged final workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          workflow = Path(".github/workflows/release-dry-run.yml").read_text(encoding="utf-8")
          workflow = workflow.replace(
              "genrec-publication-deny-dry-run-current-20260814.json",
              "genrec-publication-deny-dry-run-current-20260815.json",
          ).replace(
              "genrec-publication-deny-receipt-repair-20260814.json",
              "genrec-publication-deny-receipt-repair-current-20260815.json",
          )
          payload = workflow.encode("utf-8")
          successor = Path("data/receipts/generated/genrec-publication-deny-dry-run-current-20260815.json").read_bytes()
          print("STAGED_WORKFLOW_SHA256=" + hashlib.sha256(payload).hexdigest())
          print("SUCCESSOR_SHA256=" + hashlib.sha256(successor).hexdigest())
          print("STAGED_WORKFLOW_BASE64_BEGIN")
          print(base64.b64encode(payload).decode("ascii"))
          print("STAGED_WORKFLOW_BASE64_END")
          PY

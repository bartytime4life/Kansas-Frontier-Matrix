# Validate the projection-only KFM Domain Lane Register.
name: domain-lane-register

"on":
  pull_request:
    paths:
      - ".github/workflows/domain-lane-register.yml"
      - "control_plane/domain_lane_register.yaml"
      - "control_plane/root_registry.yaml"
      - "docs/adr/ADR-0029-adopt-directory-governance-standard-v2.md"
      - "docs/doctrine/directory-rules.md"
      - "docs/registers/DOMAIN_LANE.md"
      - "schemas/contracts/v1/governance/domain_lane_register.schema.json"
      - "tools/validators/directory_governance/validate_domain_lane_register.py"
      - "tests/validators/directory_governance/test_validate_domain_lane_register.py"
      - "data/receipts/generated/genrec-domain-lane-register-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/domain-lane-register.yml"
      - "control_plane/domain_lane_register.yaml"
      - "control_plane/root_registry.yaml"
      - "docs/adr/ADR-0029-adopt-directory-governance-standard-v2.md"
      - "docs/doctrine/directory-rules.md"
      - "docs/registers/DOMAIN_LANE.md"
      - "schemas/contracts/v1/governance/domain_lane_register.schema.json"
      - "tools/validators/directory_governance/validate_domain_lane_register.py"
      - "tests/validators/directory_governance/test_validate_domain_lane_register.py"
      - "data/receipts/generated/genrec-domain-lane-register-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-lane-register-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-domain-lane-register:
    name: validate-domain-lane-register
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Run deterministic no-network tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/directory_governance \
            --pattern 'test_validate_domain_lane_register.py' \
            --verbose

      - name: Validate current projection and repository bindings
        run: |
          set -euo pipefail
          python tools/validators/directory_governance/validate_domain_lane_register.py

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-domain-lane-register-20260807.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Domain Lane Register"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: adopted-directory binding, Root Registry and narrative-register byte binding, lane identity, sensitivity/source-role guardrails, and repository path checks."
            echo "- Boundary: projection-only; no domain creation, steward assignment, sensitivity-policy adoption, source activation, lifecycle write, release, deployment, promotion, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

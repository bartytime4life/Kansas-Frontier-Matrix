# Validate the fixture-first biodiversity occurrence retrieval-plan profile.
#
# This workflow is read-only and no-network after installing repository-declared
# test dependencies. It proves local query/sampling/transfer invariants only. It
# performs no eBird or GBIF request, source activation, source admission,
# evidence resolution, policy evaluation, release, deployment, or publication.
name: biodiversity-occurrence-retrieval-plan

"on":
  pull_request:
    paths:
      - ".github/workflows/biodiversity-occurrence-retrieval-plan.yml"
      - "contracts/source/biodiversity_occurrence_retrieval_plan.md"
      - "schemas/contracts/v1/source/biodiversity_occurrence_retrieval_plan.schema.json"
      - "fixtures/contracts/v1/source/biodiversity_occurrence_retrieval_plan/**"
      - "tools/validators/validate_biodiversity_occurrence_retrieval_plan.py"
      - "tests/validators/test_validate_biodiversity_occurrence_retrieval_plan.py"
      - "data/receipts/generated/genrec-biodiversity-occurrence-retrieval-plan-*.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/biodiversity-occurrence-retrieval-plan.yml"
      - "contracts/source/biodiversity_occurrence_retrieval_plan.md"
      - "schemas/contracts/v1/source/biodiversity_occurrence_retrieval_plan.schema.json"
      - "fixtures/contracts/v1/source/biodiversity_occurrence_retrieval_plan/**"
      - "tools/validators/validate_biodiversity_occurrence_retrieval_plan.py"
      - "tests/validators/test_validate_biodiversity_occurrence_retrieval_plan.py"
      - "data/receipts/generated/genrec-biodiversity-occurrence-retrieval-plan-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biodiversity-occurrence-retrieval-plan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-biodiversity-occurrence-retrieval-plan:
    name: validate-biodiversity-occurrence-retrieval-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run focused no-network tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover             --start-directory tests/validators             --pattern 'test_validate_biodiversity_occurrence_retrieval_plan.py'             --verbose

      - name: Replay exact fixture polarity and reviewed findings
        run: python tools/validators/validate_biodiversity_occurrence_retrieval_plan.py --fixtures

      - name: Validate schema and JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path("schemas/contracts/v1/source/biodiversity_occurrence_retrieval_plan.schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          fixture_root = Path("fixtures/contracts/v1/source/biodiversity_occurrence_retrieval_plan")
          files = sorted(fixture_root.rglob("*.json"))
          assert files, "retrieval-plan fixture inventory is empty"
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"CONFIRMED: parsed schema and {len(files)} fixture JSON files.")
          PY

      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-biodiversity-occurrence-retrieval-plan-20260805.json
          --repo-root .

      - name: Record bounded trust result
        if: always()
        shell: bash
        run: |
          {
            echo "### Biodiversity occurrence retrieval-plan status"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: sanitized query snapshot, source-profile compatibility, sampling support, finite transfer state, deterministic hashes, and fixed HOLD posture."
            echo "- Network: no eBird/GBIF request, polling, download, source activation, source admission, or source-byte access."
            echo "- Boundary: green does not prove current endpoint behavior, access, terms, rights, sensitivity, query correctness, download completeness, evidence closure, review, promotion, release, deployment, publication, or public use."
          } >> "$GITHUB_STEP_SUMMARY"

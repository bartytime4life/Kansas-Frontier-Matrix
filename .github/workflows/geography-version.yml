# Validate the fixture-only GeographyVersion candidate.
name: geography-version

"on":
  pull_request:
    paths:
      - ".github/workflows/geography-version.yml"
      - "contracts/common/geography_version.md"
      - "schemas/contracts/v1/common/geography_version.schema.json"
      - "fixtures/contracts/v1/common/geography_version/**"
      - "tools/validators/validate_geography_version.py"
      - "tests/validators/test_validate_geography_version.py"
      - "docs/intake/exploratory/pass-20-geography-version-source-map.md"
      - "contracts/evidence/indicator_definition.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass20-geography-version-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/geography-version.yml"
      - "contracts/common/geography_version.md"
      - "schemas/contracts/v1/common/geography_version.schema.json"
      - "fixtures/contracts/v1/common/geography_version/**"
      - "tools/validators/validate_geography_version.py"
      - "tests/validators/test_validate_geography_version.py"
      - "docs/intake/exploratory/pass-20-geography-version-source-map.md"
      - "contracts/evidence/indicator_definition.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass20-geography-version-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geography-version-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-geography-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to replay the unchanged historical receipt below.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused and adjacent deterministic tests
        run: |
          python -m unittest -v tests.validators.test_validate_geography_version
          python -m unittest -v tests.validators.evidence.test_validate_indicator_definition
          python tools/validators/validate_geography_version.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass20-geography-version-20260810.json \
            --repo-root . \
            --artifact-git-ref db29374a0fdb61058d26f7a5c554a13679a3c64f
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### GeographyVersion"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only geography version, time, reference, lineage, crosswalk, representation, disclosure, and identity validation."
            echo "- Boundary: no geometry resolution, crosswalk resolution, evidence resolution, rights or sensitivity evaluation, policy decision, review approval, promotion, release, public use, publication, or deployment authority."
          } >> "$GITHUB_STEP_SUMMARY"

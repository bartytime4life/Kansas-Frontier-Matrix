# Validate the bounded Pass 3 KFM catalog trust-extension payload.
name: catalog-trust-extension

"on":
  pull_request:
    paths:
      - ".github/workflows/catalog-trust-extension.yml"
      - "contracts/data/catalog_trust_extension.md"
      - "schemas/contracts/v1/data/catalog_trust_extension.schema.json"
      - "tools/validators/catalog_trust_extension/**"
      - "fixtures/data/catalog_trust_extension/**"
      - "tests/validators/test_validate_catalog_trust_extension.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-catalog-trust-extension-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-trust-extension.yml"
      - "contracts/data/catalog_trust_extension.md"
      - "schemas/contracts/v1/data/catalog_trust_extension.schema.json"
      - "tools/validators/catalog_trust_extension/**"
      - "fixtures/data/catalog_trust_extension/**"
      - "tests/validators/test_validate_catalog_trust_extension.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-catalog-trust-extension-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-trust-extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test

      - name: Run focused unit and fixture replay
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_catalog_trust_extension.py' \
            --verbose
          python tools/validators/catalog_trust_extension/validate_catalog_trust_extension.py \
            --fixtures

      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-catalog-trust-extension-20260808.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Catalog trust extension"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed shared payload, RFC 8785 spec_hash, proof-reference consistency, source-role anti-collapse, and exact fixture polarity."
            echo "- Boundary: PASS does not validate a complete STAC/DCAT/PROV host, resolve receipt/proof references, close catalog, apply policy, approve review, promote, release, publish, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"

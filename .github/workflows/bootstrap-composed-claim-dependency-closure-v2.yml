# Temporary branch-only retry workflow. The assembled implementation removes
# this file, the first bootstrap workflow, and every staged archive part.
name: bootstrap-composed-claim-dependency-closure-v2

"on":
  push:
    branches:
      - agent/composed-claim-dependency-closure-20260806
    paths:
      - ".github/workflows/bootstrap-composed-claim-dependency-closure-v2.yml"

permissions:
  contents: write

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify and expand the staged bundle
        shell: bash
        run: |
          set -euo pipefail
          prefix=".kfm-bootstrap/composed-claim-dependency-closure-20260806.tar.gz.b64.part-"
          archive="${RUNNER_TEMP}/composed-claim-dependency-closure-20260806.tar.gz"
          test -f "${prefix}00"
          cat "${prefix}"* | base64 --decode > "$archive"
          echo "bec70240d403305b4444f3a6b0b80ed9518b6617d509c9cafffd73c8218b0de1  $archive" | sha256sum --check --strict -
          python - "$archive" <<'PY'
          from __future__ import annotations
          import sys
          import tarfile
          from pathlib import PurePosixPath

          with tarfile.open(sys.argv[1], "r:gz") as bundle:
              members = bundle.getmembers()
              if len(members) != 36:
                  raise SystemExit(f"unexpected archive member count: {len(members)}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if member.isdir() or member.issym() or member.islnk() or path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive member: {member.name}")
              bundle.extractall(".", filter="data")
          PY
          rm -rf ".kfm-bootstrap"
          rm -f ".github/workflows/bootstrap-composed-claim-dependency-closure.yml"
          rm -f ".github/workflows/bootstrap-composed-claim-dependency-closure-v2.yml"

      - name: Install declared test dependencies
        run: python -m pip install --no-input -e ".[test]"

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider tests/validators/test_validate_composed_claim_dependency_closure.py
          python tools/validators/validate_composed_claim_dependency_closure.py --fixtures
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-composed-claim-dependency-closure-20260806.json --repo-root .
          python -m py_compile tools/validators/validate_composed_claim_dependency_closure.py tests/validators/test_validate_composed_claim_dependency_closure.py
          find tools tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

      - name: Commit the assembled implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kfm-implementation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(evidence): add composed-claim dependency closure"

      - name: Push the assembled implementation
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Validate the fixture-only distribution and coverage assessment candidate.
name: distribution-coverage-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/distribution-coverage-assessment.yml"
      - "contracts/evidence/distribution_coverage_assessment.md"
      - "schemas/contracts/v1/evidence/distribution_coverage_assessment.schema.json"
      - "fixtures/contracts/v1/evidence/distribution_coverage_assessment/**"
      - "tools/validators/evidence/validate_distribution_coverage_assessment.py"
      - "tests/evidence/test_distribution_coverage_assessment.py"
      - "docs/intake/exploratory/distribution-coverage-semantics-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-distribution-coverage-assessment-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/distribution-coverage-assessment.yml"
      - "contracts/evidence/distribution_coverage_assessment.md"
      - "schemas/contracts/v1/evidence/distribution_coverage_assessment.schema.json"
      - "fixtures/contracts/v1/evidence/distribution_coverage_assessment/**"
      - "tools/validators/evidence/validate_distribution_coverage_assessment.py"
      - "tests/evidence/test_distribution_coverage_assessment.py"
      - "docs/intake/exploratory/distribution-coverage-semantics-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-distribution-coverage-assessment-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-coverage-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-distribution-coverage-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          python -m py_compile tools/validators/evidence/validate_distribution_coverage_assessment.py tests/evidence/test_distribution_coverage_assessment.py
          python -m pytest -q tests/evidence/test_distribution_coverage_assessment.py --strict-config --strict-markers
          python tools/validators/evidence/validate_distribution_coverage_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-distribution-coverage-assessment-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Distribution coverage assessment candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only distribution, coverage, geography-binding, missing-row, suppression, dispute, staleness, and scope semantics."
            echo "- Boundary: no network, source activation, distribution fact, geography authority, evidence, policy, review, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

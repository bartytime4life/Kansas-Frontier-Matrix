# Validate fixture-first distribution and coverage assessments.
name: distribution-coverage-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/distribution-coverage-assessment.yml"
      - "contracts/evidence/distribution_coverage_assessment.md"
      - "schemas/contracts/v1/evidence/distribution_coverage_assessment.schema.json"
      - "tools/validators/evidence/validate_distribution_coverage_assessment.py"
      - "fixtures/contracts/v1/evidence/distribution_coverage_assessment/**"
      - "tests/evidence/test_distribution_coverage_assessment.py"
      - "docs/intake/exploratory/new-ideas-4-30-source-map.md"
      - "docs/kfm_full_atlas_seed_cards.md"
      - "data/receipts/generated/genrec-distribution-coverage-assessment-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/distribution-coverage-assessment.yml"
      - "contracts/evidence/distribution_coverage_assessment.md"
      - "schemas/contracts/v1/evidence/distribution_coverage_assessment.schema.json"
      - "tools/validators/evidence/validate_distribution_coverage_assessment.py"
      - "fixtures/contracts/v1/evidence/distribution_coverage_assessment/**"
      - "tests/evidence/test_distribution_coverage_assessment.py"
      - "docs/intake/exploratory/new-ideas-4-30-source-map.md"
      - "docs/kfm_full_atlas_seed_cards.md"
      - "data/receipts/generated/genrec-distribution-coverage-assessment-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-distribution-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run fixture matrix
        run: python tools/validators/evidence/validate_distribution_coverage_assessment.py --fixtures
      - name: Run focused tests
        run: python -m pytest tests/evidence/test_distribution_coverage_assessment.py -q --strict-config --strict-markers
      - name: Validate generated authoring receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-distribution-coverage-assessment-20260810.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Distribution and coverage assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic distribution rows, geography bindings, and local validation only."
            echo "- Boundary: no absence fact, source activation, lifecycle write, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

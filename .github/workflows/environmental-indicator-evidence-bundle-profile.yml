name: environmental-indicator-evidence-bundle-profile

"on":
  pull_request:
    paths:
      - ".github/workflows/environmental-indicator-evidence-bundle-profile.yml"
      - "contracts/evidence/environmental_indicator_evidence_bundle_profile.md"
      - "contracts/evidence/evidence_bundle.md"
      - "schemas/contracts/v1/evidence/environmental_indicator_evidence_bundle_profile.schema.json"
      - "schemas/contracts/v1/evidence/evidence_bundle.schema.json"
      - "schemas/contracts/v1/evidence/evidence_ref.schema.json"
      - "schemas/contracts/v1/policy/sensitivity_label.schema.json"
      - "schemas/contracts/v1/common/spec_hash.schema.json"
      - "fixtures/contracts/v1/evidence/environmental_indicator_evidence_bundle_profile/**"
      - "tools/validators/validate_environmental_indicator_evidence_bundle_profile.py"
      - "tools/validators/environmental_indicator_evidence_bundle_profile_semantics.py"
      - "tools/validators/environmental_indicator_evidence_bundle_profile_support.py"
      - "tools/validators/_common/local_resolver.py"
      - "tests/validators/test_validate_environmental_indicator_evidence_bundle_profile.py"
      - "docs/intake/exploratory/pass-32-environmental-indicator-evidence-bundle-source-map.md"
      - "data/receipts/generated/genrec-pass32-environmental-indicator-evidence-bundle-profile-20260808.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/environmental-indicator-evidence-bundle-profile.yml"
      - "contracts/evidence/environmental_indicator_evidence_bundle_profile.md"
      - "contracts/evidence/evidence_bundle.md"
      - "schemas/contracts/v1/evidence/environmental_indicator_evidence_bundle_profile.schema.json"
      - "schemas/contracts/v1/evidence/evidence_bundle.schema.json"
      - "schemas/contracts/v1/evidence/evidence_ref.schema.json"
      - "schemas/contracts/v1/policy/sensitivity_label.schema.json"
      - "schemas/contracts/v1/common/spec_hash.schema.json"
      - "fixtures/contracts/v1/evidence/environmental_indicator_evidence_bundle_profile/**"
      - "tools/validators/validate_environmental_indicator_evidence_bundle_profile.py"
      - "tools/validators/environmental_indicator_evidence_bundle_profile_semantics.py"
      - "tools/validators/environmental_indicator_evidence_bundle_profile_support.py"
      - "tools/validators/_common/local_resolver.py"
      - "tests/validators/test_validate_environmental_indicator_evidence_bundle_profile.py"
      - "docs/intake/exploratory/pass-32-environmental-indicator-evidence-bundle-source-map.md"
      - "data/receipts/generated/genrec-pass32-environmental-indicator-evidence-bundle-profile-20260808.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: environmental-indicator-evidence-bundle-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-environmental-indicator-evidence-bundle-profile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema, hashing, and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic no-network tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_environmental_indicator_evidence_bundle_profile.py' \
            --verbose

      - name: Replay exact fixture outcomes and findings
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_environmental_indicator_evidence_bundle_profile.py \
            --fixtures

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass32-environmental-indicator-evidence-bundle-profile-20260808.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Environmental indicator EvidenceBundle profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only derived-analysis profile over the existing EvidenceBundle contract."
            echo "- Positive states: POPULATED, EMPTY, and NO_DATA."
            echo "- Boundary: PASS proves bounded local schema, hash, identity, ordering, source binding, and reference closure only."
            echo "- Non-effects: no source access, observation authority, evidence resolution claim, policy/review creation, lifecycle write, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

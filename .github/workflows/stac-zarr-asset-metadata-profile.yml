# Validate the fixture-only STAC Zarr asset metadata profile.
# This workflow performs no store access, asset resolution, byte verification, catalog mutation, release, or publication action.
name: stac-zarr-asset-metadata-profile

"on":
  pull_request:
    paths:
      - ".github/workflows/stac-zarr-asset-metadata-profile.yml"
      - "contracts/data/stac_zarr_asset_metadata_profile.md"
      - "schemas/contracts/v1/data/stac_zarr_asset_metadata_profile.schema.json"
      - "fixtures/contracts/v1/data/stac_zarr_asset_metadata_profile/**"
      - "tools/validators/stac/validate_stac_zarr_asset_metadata_profile.py"
      - "tests/validators/stac/test_stac_zarr_asset_metadata_profile.py"
      - "docs/intake/exploratory/pass-30-stac-zarr-asset-metadata-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-stac-zarr-asset-metadata-profile-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/stac-zarr-asset-metadata-profile.yml"
      - "contracts/data/stac_zarr_asset_metadata_profile.md"
      - "schemas/contracts/v1/data/stac_zarr_asset_metadata_profile.schema.json"
      - "fixtures/contracts/v1/data/stac_zarr_asset_metadata_profile/**"
      - "tools/validators/stac/validate_stac_zarr_asset_metadata_profile.py"
      - "tests/validators/stac/test_stac_zarr_asset_metadata_profile.py"
      - "docs/intake/exploratory/pass-30-stac-zarr-asset-metadata-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-stac-zarr-asset-metadata-profile-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stac-zarr-asset-metadata-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-stac-zarr-asset-metadata-profile:
    name: validate-stac-zarr-asset-metadata-profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators/stac \
            --pattern 'test_stac_zarr_asset_metadata_profile.py' \
            --verbose

      - name: Replay exact fixture polarity
        run: python tools/validators/stac/validate_stac_zarr_asset_metadata_profile.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass30-stac-zarr-asset-metadata-profile-20260809.json

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### StacZarrAssetMetadataProfileCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: declared synthetic Zarr metadata shape, rank/chunk consistency, evidence ordering, and deterministic identity."
            echo "- No store access, asset resolution, byte verification, catalog mutation, policy, review, promotion, release, or publication authority is exercised."
          } >> "$GITHUB_STEP_SUMMARY"

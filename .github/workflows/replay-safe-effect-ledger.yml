# Validate the fixture-only replay-safe event/effect ledger candidate.
# This workflow executes no effect and creates no lifecycle, review, release, or publication authority.
name: replay-safe-effect-ledger

"on":
  pull_request:
    paths:
      - ".github/workflows/replay-safe-effect-ledger.yml"
      - "contracts/runtime/replay_safe_effect_ledger.md"
      - "schemas/contracts/v1/runtime/replay_safe_effect_ledger.schema.json"
      - "fixtures/contracts/v1/runtime/replay_safe_effect_ledger/**"
      - "tools/validators/runtime/validate_replay_safe_effect_ledger.py"
      - "tests/validators/test_validate_replay_safe_effect_ledger.py"
      - "data/receipts/generated/genrec-replay-safe-effect-ledger-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/replay-safe-effect-ledger.yml"
      - "contracts/runtime/replay_safe_effect_ledger.md"
      - "schemas/contracts/v1/runtime/replay_safe_effect_ledger.schema.json"
      - "fixtures/contracts/v1/runtime/replay_safe_effect_ledger/**"
      - "tools/validators/runtime/validate_replay_safe_effect_ledger.py"
      - "tests/validators/test_validate_replay_safe_effect_ledger.py"
      - "data/receipts/generated/genrec-replay-safe-effect-ledger-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-safe-effect-ledger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-replay-safe-effect-ledger:
    name: validate-replay-safe-effect-ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e .

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_replay_safe_effect_ledger.py' \
            --verbose

      - name: Replay exact fixture polarity
        run: python tools/validators/runtime/validate_replay_safe_effect_ledger.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-replay-safe-effect-ledger-20260809.json

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### ReplaySafeEffectLedgerCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only event identity, delivery lineage, effect-key binding, reservation coherence, duplicate suppression, effect cardinality, finite results, and non-authority flags."
            echo "- Tests use synthetic repository fixtures and perform no network, queue, broker, database, worker, object-store, policy-engine, signing, registry, or model access."
            echo "- A green result does not execute an effect, claim exactly-once transport, write a lifecycle lane, approve review, promote, release, deploy, publish, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"

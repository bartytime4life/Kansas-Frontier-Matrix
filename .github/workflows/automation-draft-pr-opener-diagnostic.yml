name: automation-draft-pr-opener-diagnostic

"on":
  push:
    branches:
      - "fix/automation-draft-pr-opener-config-20260809"
    paths:
      - ".github/workflows/automation-draft-pr-opener.yml"
      - ".github/workflows/automation-draft-pr-opener-test.yml"
      - ".github/workflows/automation-draft-pr-opener-diagnostic.yml"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download and verify actionlint v1.7.12
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_ARCHIVE_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          install_dir="${RUNNER_TEMP}/actionlint"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          "$install_dir/actionlint" -version

      - name: Lint privileged opener and read-only conformance workflow
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint/actionlint" -color=false \
            .github/workflows/automation-draft-pr-opener.yml \
            .github/workflows/automation-draft-pr-opener-test.yml

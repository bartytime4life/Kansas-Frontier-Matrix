# KFM contract and schema validation workflow.
# This is executable CI evidence, not release or publication authority.
name: contracts-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install repository test dependencies
        run: python -m pip install -e ".[test]"

      - name: Validate manifest-driven contract fixture wave
        run: |
          python tools/validators/validate_contract_fixture_manifest.py \
            tests/contracts/manifests/contract_fixture_families.v1.json \
            --format text

      - name: Validate contract and schema test lane
        run: make test

      - name: Record validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo "## Contracts validation"
            echo
            echo "- Manifest command: python tools/validators/validate_contract_fixture_manifest.py tests/contracts/manifests/contract_fixture_families.v1.json --format text"
            echo "- Repository command: make test"
            echo "- Current Makefile scope: tests/schemas and tests/contracts"
            echo "- Result: ${{ job.status }}"
            echo
            echo "A green manifest result means only that the declared schema and canonical fixture paths exist, both lanes are nonempty, and valid/invalid JSON Schema polarity matches."
            echo "A green make test result means the selected repository-owned tests passed for this revision."
            echo "Neither result proves complete semantic equivalence across every Markdown contract, schema, API, fixture, policy, evidence object, or published projection."
            echo "Neither result authorizes release, deployment, lifecycle promotion, source admission, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

name: Public core repair candidate
on:
  pull_request:
  push:
    branches: [a0-hosted-ai-web-20261017, codex/fix-public-core-visibility-20261014]
permissions:
  contents: read
jobs:
  welcome-performance:
    # Independent from the longer functional suite: retain measurements even
    # when another acceptance step fails. No provider requests or secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Measure isolated welcome performance
        shell: bash
        env:
          KFM_PERFORMANCE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=5182 node server/start.mjs > "$RUNNER_TEMP/welcome-runtime.log" 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5182/ > /dev/null; then break; fi
            sleep 1
          done
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5182 KFM_WELCOME_PERFORMANCE=1 KFM_WELCOME_PERFORMANCE_ARTIFACTS="$RUNNER_TEMP/welcome-performance" node --test --test-name-pattern='welcome performance' tests/explorer-startup.browser.mjs
      - name: Welcome measurements and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: welcome-performance
          path: ${{ runner.temp }}/welcome-performance
          if-no-files-found: warn
          retention-days: 14
  verify-core-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pipeline-mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: kfm-disposable-test-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - "127.0.0.1:13317:3306"
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=kfm-disposable-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
        id: pipeline_dependencies
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Complete standalone Node suite
        run: node --test --test-concurrency=4 tests/*.test.mjs
      - name: Disposable MySQL pipeline migration and transaction checks
        # Collect independent database qualification even if an unrelated UI
        # test fails above. The suite failure still keeps the job failing.
        if: ${{ !cancelled() && steps.pipeline_dependencies.outcome == 'success' }}
        env:
          KFM_PIPELINE_MYSQL_TEST: "1"
          KFM_MYSQL_TEST: "1"
        run: node --test tests/pipeline-mysql.test.mjs tests/hosted-ingestion-mysql.test.mjs
      - name: Fire renderer browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=5182 node server/start.mjs > "$RUNNER_TEMP/fire-runtime.log" 2>&1 &
          fire_pid=$!
          trap 'kill "$fire_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5182/ > /dev/null; then break; fi
            sleep 1
          done
          git fetch --no-tags --depth=1 origin 1000a5c4521bb3055e3863110754e924cdda801e
          git show FETCH_HEAD:app/fire-detection-style.ts > "$RUNNER_TEMP/fire-before.ts"
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5182 KFM_FIRE_BASELINE_FILE="$RUNNER_TEMP/fire-before.ts" KFM_FIRE_SCREENSHOTS="$RUNNER_TEMP/fire-screenshots" node --test tests/fire-display.browser.mjs
      - name: Fire renderer visual comparison artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fire-renderer-visual-comparison
          path: ${{ runner.temp }}/fire-screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Actual Node HTTP boundary
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=5182 node server/start.mjs > "$RUNNER_TEMP/node-runtime.log" 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5182/ > /dev/null; then break; fi
            sleep 1
          done
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5182 node --test tests/godaddy-node-runtime.test.mjs
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5182 node --test tests/pipeline-http.test.mjs
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5182 node --test tests/river-pulse.browser.mjs
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5182 node --test tests/county-search.browser.mjs
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5182 node --test tests/aviation-layout.browser.mjs
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5182 KFM_WORKSPACE_SCREENSHOTS="$RUNNER_TEMP/workspace-screenshots" node --test tests/explorer-startup.browser.mjs
          node --input-type=module - "$RUNNER_TEMP/node-runtime.log" <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const line = readFileSync(process.argv[2], 'utf8').split('\n').find(line => line.startsWith('KFM_NODE_STARTUP '));
          assert.ok(line, 'the real startup process must report its HTTP check');
          const report = JSON.parse(line.slice('KFM_NODE_STARTUP '.length));
          assert.equal(report.production, true);
          assert.equal(report.listenPort, 5182);
          assert.equal(report.outcome, 'LOOPBACK_BUILD_READY');
          assert.equal(report.httpStatus, 200);
          NODE
      - name: Workspace browser acceptance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-browser-acceptance
          path: ${{ runner.temp }}/workspace-screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: GoDaddy preview command uses the assigned production port
        shell: bash
        run: |
          set -euo pipefail
          PORT=5183 npm run dev > "$RUNNER_TEMP/node-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5183/api/ai/status > /dev/null; then break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then cat "$RUNNER_TEMP/node-preview.log"; exit 1; fi
            sleep 1
          done
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5183 node --test --test-name-pattern='anonymous map|hosted AI endpoint' tests/godaddy-node-runtime.test.mjs

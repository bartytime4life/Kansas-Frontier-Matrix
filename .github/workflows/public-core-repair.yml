name: Public core repair candidate
on:
  pull_request:
  push:
    branches: [codex/fix-public-core-visibility-20261014]
permissions:
  contents: read
jobs:
  verify-core-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Map menus, mobile controls and keyboard navigation
        run: >-
          node --test tests/explorer-menu-dismissal.test.mjs
          tests/mobile-compatibility.test.mjs tests/workspace-map-navigation.test.mjs
          tests/workspace-help-navigation.test.mjs
      - name: Core delivery, filtering, geometry and account boundaries
        run: >-
          node --test tests/node-compressed-assets.test.mjs
          tests/subsurface-worker.test.mjs tests/cutaway-model.test.mjs
          tests/area-underlay.test.mjs tests/subsurface-slice.test.mjs
          tests/pc-ai.test.mjs tests/pc-ai-http.test.mjs
      - name: Hosted AI route and evidence discovery boundaries
        run: >-
          node --test tests/assistant-status.test.mjs tests/assistant-context.test.mjs tests/public-ai.test.mjs
          tests/hosted-ai.test.mjs tests/hosted-ai-acceptance.test.mjs
          tests/pc-ai-login-admission.test.mjs tests/public-ai-http.test.mjs
      - name: Zoom detail, source bounds and shared effects controls
        run: >-
          node --test tests/water-flow-motion.test.mjs tests/water-flow-sync.test.mjs
          tests/water-path-analysis.test.mjs tests/water-flow-context.test.mjs tests/water-direction-route.test.mjs tests/scene-studio.test.mjs
          tests/scene-surface-integration.test.mjs tests/cinematic-scene-effects.test.mjs
      - name: Actual Node HTTP boundary
        shell: bash
        run: |
          set -euo pipefail
          PORT=5182 node server/start.mjs > "$RUNNER_TEMP/node-runtime.log" 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5182/ > /dev/null; then break; fi
            sleep 1
          done
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5182 node --test tests/godaddy-node-runtime.test.mjs
      - name: GoDaddy preview command uses the assigned production port
        shell: bash
        run: |
          set -euo pipefail
          PORT=5183 npm run dev > "$RUNNER_TEMP/node-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5183/api/ai/status > /dev/null; then break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then cat "$RUNNER_TEMP/node-preview.log"; exit 1; fi
            sleep 1
          done
          KFM_NODE_TEST_ORIGIN=http://127.0.0.1:5183 node --test --test-name-pattern='anonymous map|hosted AI endpoint' tests/godaddy-node-runtime.test.mjs

# Validate the fixture-only graph invariant artifact profile.
# This workflow performs no graph access, query, migration, evidence admission, release, or publication action.
name: graph-invariant-artifact

"on":
  pull_request:
    paths:
      - ".github/workflows/graph-invariant-artifact.yml"
      - "contracts/evidence/graph_invariant_artifact.md"
      - "schemas/contracts/v1/evidence/graph_invariant_artifact.schema.json"
      - "fixtures/contracts/v1/evidence/graph_invariant_artifact/**"
      - "tools/validators/evidence/validate_graph_invariant_artifact.py"
      - "tests/validators/evidence/test_graph_invariant_artifact.py"
      - "docs/intake/exploratory/pass-31-graph-invariant-artifact-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass31-graph-invariant-artifact-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/graph-invariant-artifact.yml"
      - "contracts/evidence/graph_invariant_artifact.md"
      - "schemas/contracts/v1/evidence/graph_invariant_artifact.schema.json"
      - "fixtures/contracts/v1/evidence/graph_invariant_artifact/**"
      - "tools/validators/evidence/validate_graph_invariant_artifact.py"
      - "tests/validators/evidence/test_graph_invariant_artifact.py"
      - "docs/intake/exploratory/pass-31-graph-invariant-artifact-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass31-graph-invariant-artifact-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph-invariant-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-graph-invariant-artifact:
    name: validate-graph-invariant-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators/evidence \
            --pattern 'test_graph_invariant_artifact.py' \
            --verbose

      - name: Replay exact fixture polarity
        run: python tools/validators/evidence/validate_graph_invariant_artifact.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass31-graph-invariant-artifact-20260809.json

      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### GraphInvariantArtifactCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic before/after counts, constraints, representative query summaries, GDS summaries, comparison closure, and deterministic identity."
            echo "- No graph access, query, migration, evidence admission, policy decision, review approval, promotion, release, or publication authority is exercised."
          } >> "$GITHUB_STEP_SUMMARY"

# Temporary read-only validation harness for the repository-control stream bounds.
# It targets one non-default branch and must be removed after the hosted proof is saved.

name: repository-control-stream-bounds-validation

"on":
  push:
    branches:
      - fix/repository-control-comment-stream-bounds-20260903

permissions:
  contents: read

concurrency:
  group: repository-control-stream-bounds-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  focused-validation:
    name: focused-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Verify syntax and workflow parsing
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/validators/repository_control/validate_control_source_availability.py \
            tools/validators/repository_control/validate_transition_authorization.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_control_stream_bounds.py \
            tests/validators/test_repository_transition_authorization.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              Path('.github/workflows/repository-control.yml'),
              Path('.github/workflows/repository-control-stream-bounds-validation.yml'),
          ):
              value = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise SystemExit(f'{path}: workflow root must be an object')
          PY

      - name: Run focused repository-control tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_control_stream_bounds.py \
            tests/validators/test_repository_transition_authorization.py \
            -q

      - name: Exercise finite workflow source states
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/repository-control.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['authorize-ready-and-merge']['steps']
          for step in steps:
              if step.get('name') == 'Read and bound repository-control issue comments':
                  Path('/tmp/read-and-bound-comments.sh').write_text(step['run'], encoding='utf-8')
                  break
          else:
              raise SystemExit('read-and-bound workflow step not found')
          PY
          bash -n /tmp/read-and-bound-comments.sh

          mkdir -p /tmp/fake-gh-bin
          cat > /tmp/fake-gh-bin/gh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${FAKE_GH_MODE:-success}" in
            success)
              python3 - <<'PY'
          import base64, json
          raw=json.dumps({"id":1,"body":"ok"},separators=(",",":")).encode()
          print(base64.b64encode(raw).decode())
          PY
              ;;
            two)
              python3 - <<'PY'
          import base64, json
          for value in ({"id":1},{"id":2}):
              print(base64.b64encode(json.dumps(value,separators=(",",":")).encode()).decode())
          PY
              ;;
            invalid) printf 'not-base64!\n' ;;
            unavailable) exit 1 ;;
            *) exit 9 ;;
          esac
          SH
          chmod 0555 /tmp/fake-gh-bin/gh

          for spec in success:10000:AVAILABLE invalid:10000:INVALID unavailable:10000:UNAVAILABLE two:1:OVER_LIMIT; do
            IFS=: read -r mode maximum expected <<< "${spec}"
            runtime="$(mktemp -d)"
            cp tools/validators/repository_control/validate_control_source_availability.py \
              "${runtime}/validate-control-source-availability.py"
            PATH="/tmp/fake-gh-bin:${PATH}" \
              FAKE_GH_MODE="${mode}" \
              RUNNER_TEMP="${runtime}" \
              GITHUB_REPOSITORY="bartytime4life/Kansas-Frontier-Matrix" \
              KFM_CONTROL_ISSUE=4024 \
              KFM_CONTROL_SOURCE_MAX_COMMENTS="${maximum}" \
              KFM_CONTROL_SOURCE_MAX_BYTES=16777216 \
              KFM_CONTROL_SOURCE_MAX_ENCODED_RECORD_BYTES=524288 \
              bash /tmp/read-and-bound-comments.sh
            python - "${runtime}/repository-control-source-status.json" "${expected}" <<'PY'
          import json, sys
          from pathlib import Path
          value=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if value['status'] != sys.argv[2]:
              raise SystemExit(f"expected {sys.argv[2]}, observed {value['status']}")
          PY
            rm -rf "${runtime}"
          done

      - name: Check bounded branch diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          python - <<'PY'
          import subprocess

          allowed = {
              '.github/workflows/repository-control.yml',
              '.github/workflows/repository-control-stream-bounds-validation.yml',
              'docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md',
              'tests/validators/test_repository_control_stream_bounds.py',
              'tools/validators/repository_control/validate_control_source_availability.py',
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', 'origin/main...HEAD'],
                  text=True,
              ).splitlines()
          )
          if changed != allowed:
              raise SystemExit(
                  f'branch path set mismatch: missing={sorted(allowed - changed)}, '
                  f'unexpected={sorted(changed - allowed)}'
              )
          print(f'validated exact temporary path set: {len(changed)} files')
          PY

      - name: Record authority boundary
        if: always()
        shell: bash
        run: |
          {
            echo '### Repository-control stream-bounds validation'
            echo
            echo '- Scope: syntax, workflow parsing, focused tests, finite source-state simulations, and exact bounded diff.'
            echo '- Target: one non-default branch; no pull request or main integration.'
            echo '- Permissions: read-only repository contents; no secrets or OIDC.'
            echo '- Non-effects: no ready, merge, ruleset, release, deployment, publication, source-state, Stage 1B, Stage 2, or MapLibre authority.'
            echo '- The temporary workflow must be removed after the run is recorded.'
          } >> "${GITHUB_STEP_SUMMARY}"

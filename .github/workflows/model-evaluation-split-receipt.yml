name: model-evaluation-split-receipt

"on":
  pull_request:
    paths:
      - ".github/workflows/model-evaluation-split-receipt.yml"
      - "contracts/evidence/model_evaluation_split_receipt.md"
      - "schemas/contracts/v1/evidence/model_evaluation_split_receipt.schema.json"
      - "fixtures/contracts/v1/evidence/model_evaluation_split_receipt/**"
      - "tools/validators/evidence/validate_model_evaluation_split_receipt.py"
      - "tests/validators/evidence/test_validate_model_evaluation_split_receipt.py"
      - "docs/intake/exploratory/pass-18-model-evaluation-split-receipt-source-map.md"
      - "data/receipts/generated/genrec-pass18-model-evaluation-split-receipt-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-evaluation-split-receipt.yml"
      - "contracts/evidence/model_evaluation_split_receipt.md"
      - "schemas/contracts/v1/evidence/model_evaluation_split_receipt.schema.json"
      - "fixtures/contracts/v1/evidence/model_evaluation_split_receipt/**"
      - "tools/validators/evidence/validate_model_evaluation_split_receipt.py"
      - "tests/validators/evidence/test_validate_model_evaluation_split_receipt.py"
      - "docs/intake/exploratory/pass-18-model-evaluation-split-receipt-source-map.md"
      - "data/receipts/generated/genrec-pass18-model-evaluation-split-receipt-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-evaluation-split-receipt-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-model-evaluation-split-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/evidence/validate_model_evaluation_split_receipt.py tests/validators/evidence/test_validate_model_evaluation_split_receipt.py
          python -m unittest tests.validators.evidence.test_validate_model_evaluation_split_receipt --verbose
          python tools/validators/evidence/validate_model_evaluation_split_receipt.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-model-evaluation-split-receipt-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Model-evaluation split receipt"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only method, seed, stratification, grouping, partition-count, spatial/temporal holdout, leakage-check, and disclosure coherence."
            echo "- Boundary: no row access, split execution, model execution, metric recomputation, evidence resolution, policy or review decision, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

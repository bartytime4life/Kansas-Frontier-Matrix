name: drone-capture-authorization-metadata

"on":
  pull_request:
    paths:
      - ".github/workflows/drone-capture-authorization-metadata.yml"
      - "contracts/evidence/drone_capture_authorization_metadata.md"
      - "schemas/contracts/v1/evidence/drone_capture_authorization_metadata.schema.json"
      - "fixtures/contracts/v1/evidence/drone_capture_authorization_metadata/**"
      - "tools/validators/evidence/validate_drone_capture_authorization_metadata.py"
      - "tests/validators/evidence/test_validate_drone_capture_authorization_metadata.py"
      - "docs/intake/exploratory/pass-18-drone-capture-authorization-metadata-source-map.md"
      - "data/receipts/generated/genrec-pass18-drone-capture-authorization-metadata-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/drone-capture-authorization-metadata.yml"
      - "contracts/evidence/drone_capture_authorization_metadata.md"
      - "schemas/contracts/v1/evidence/drone_capture_authorization_metadata.schema.json"
      - "fixtures/contracts/v1/evidence/drone_capture_authorization_metadata/**"
      - "tools/validators/evidence/validate_drone_capture_authorization_metadata.py"
      - "tests/validators/evidence/test_validate_drone_capture_authorization_metadata.py"
      - "docs/intake/exploratory/pass-18-drone-capture-authorization-metadata-source-map.md"
      - "data/receipts/generated/genrec-pass18-drone-capture-authorization-metadata-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drone-capture-authorization-metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-drone-capture-authorization-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/evidence/validate_drone_capture_authorization_metadata.py tests/validators/evidence/test_validate_drone_capture_authorization_metadata.py
          python -m unittest tests.validators.evidence.test_validate_drone_capture_authorization_metadata --verbose
          python tools/validators/evidence/validate_drone_capture_authorization_metadata.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-drone-capture-authorization-metadata-20260811.json --repo-root .
      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### Drone capture authorization metadata"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic capture-window, authorization-evidence, area, altitude, airspace-review, safety, evidence, and review declaration coherence."
            echo "- Boundary: no current-law assertion, authority lookup, airspace query, flight permission, evidence/policy/review authority, release, deployment, publication, or public use."
          } >> "$GITHUB_STEP_SUMMARY"

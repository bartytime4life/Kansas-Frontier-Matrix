# Validate fixture-first source-role transition assessments.
name: source-role-transition-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/source-role-transition-assessment.yml"
      - "contracts/source/source_role_transition_assessment.md"
      - "schemas/contracts/v1/source/source_role_transition_assessment.schema.json"
      - "tools/validators/source_role/validate_source_role_transition_assessment.py"
      - "fixtures/contracts/v1/source/source_role_transition_assessment/**"
      - "tests/source/test_source_role_transition_assessment.py"
      - "data/receipts/generated/genrec-source-role-transition-assessment-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-role-transition-assessment.yml"
      - "contracts/source/source_role_transition_assessment.md"
      - "schemas/contracts/v1/source/source_role_transition_assessment.schema.json"
      - "tools/validators/source_role/validate_source_role_transition_assessment.py"
      - "fixtures/contracts/v1/source/source_role_transition_assessment/**"
      - "tests/source/test_source_role_transition_assessment.py"
      - "data/receipts/generated/genrec-source-role-transition-assessment-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-role-transition-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-source-role-transition-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run fixture matrix
        run: python tools/validators/source_role/validate_source_role_transition_assessment.py --fixtures
      - name: Run focused tests
        run: python -m pytest tests/source/test_source_role_transition_assessment.py -q --strict-config --strict-markers
      - name: Validate generated authoring receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-source-role-transition-assessment-20260807.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Source-role transition assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic fixtures and local validation only."
            echo "- Boundary: no source activation, role rewrite, lifecycle promotion, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the fixture-first release-support ProofPack closure profile.
# This workflow is read-only, no-network at runtime, and non-publishing.
name: proof-pack-closure

"on":
  pull_request:
    paths:
      - ".github/workflows/proof-pack-closure.yml"
      - "contracts/evidence/proof_pack.md"
      - "schemas/contracts/v1/evidence/proof_pack.schema.json"
      - "fixtures/contracts/v1/evidence/proof_pack/**"
      - "tools/proof_pack/**"
      - "tests/proof_pack/**"
      - "data/receipts/generated/genrec-proof-pack-closure-*.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/proof-pack-closure.yml"
      - "contracts/evidence/proof_pack.md"
      - "schemas/contracts/v1/evidence/proof_pack.schema.json"
      - "fixtures/contracts/v1/evidence/proof_pack/**"
      - "tools/proof_pack/**"
      - "tests/proof_pack/**"
      - "data/receipts/generated/genrec-proof-pack-closure-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-pack-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-proof-pack-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to replay the unchanged historical receipt below.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Validate exact fixture polarity and local reference closure
        run: python tools/proof_pack/proof_pack_check.py --fixtures

      - name: Run focused builder and checker tests
        run: python -m pytest -q tests/proof_pack

      - name: Run repository schema polarity for the added profile
        run: python -m pytest -q tests/schemas/test_common_contracts.py -k proof_pack

      - name: Rebuild the golden manifest deterministically
        run: |
          python tools/proof_pack/assemble_proof_pack.py \
            --candidate fixtures/contracts/v1/evidence/proof_pack/candidates/release_support_candidate.json \
            --repo-root . \
            --output /tmp/proof-pack.json
          cmp /tmp/proof-pack.json \
            fixtures/contracts/v1/evidence/proof_pack/valid/valid_release_support.json

      - name: Replay superseded receipt at its bound commit
        shell: bash
        run: |
          set -euo pipefail
          # Dependabot 27676fd1 changed this workflow's setup-python pin. The
          # superseded receipt stays immutable and replays at its authoring commit.
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-proof-pack-closure-current-binding-20260815.json \
            --repo-root . \
            --artifact-git-ref 509aea2c889e243604ae28b0c183efd0af39b026

      - name: Verify ProofPack current-binding receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-proof-pack-closure-current-binding-20261126.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Release-support ProofPack closure"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: schema, required support families, release/subject/spec bindings, path safety, local SHA-256 integrity, deterministic assembly, and current workflow-byte binding."
            echo "- Boundary: a passing check does not create evidence, policy approval, review, release, signature, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

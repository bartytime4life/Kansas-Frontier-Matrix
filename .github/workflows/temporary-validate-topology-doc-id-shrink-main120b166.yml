# Temporary read-only exact-head validation harness for the KFM-TOPO-016 strict evidence shrink.
name: temporary-validate-topology-doc-id-shrink-main120b166

"on":
  push:
    branches:
      - validation/topology-doc-id-shrink-a20d1ec-main120b166
    paths:
      - .github/workflows/temporary-validate-topology-doc-id-shrink-main120b166.yml

permissions:
  contents: read

concurrency:
  group: temporary-validate-topology-doc-id-shrink-main120b166
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 120b166c0196153e53c19f24a7563cdf3818ad62
      CANDIDATE_SHA: 0d56424db691b783740056b5159e67369850fa82
      CANDIDATE_BRANCH: review/topology-doc-id-baseline-shrink-a20d1ec-main120b166
      BASELINE_PATH: tools/validators/directory_governance/repository_topology_baseline.json
      BASELINE_BLOB: 79e7450f0764db371aa2bd3be97f0fab48704025
      OLD_FINGERPRINT: sha256:1831dfdc821f0553c6a55336d9e1e6122298db4ad1518232deb5f2b68cec6593
      NEW_FINGERPRINT: sha256:a20d1ec8834c7b3fc105ad3b01063e1ebc73b48fed9e5b7902d03ba1507de13b
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact identity, ancestry, concurrency, and one-path scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p topology-evidence
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA:$BASELINE_PATH")" = "$BASELINE_BLOB"
          live_main="$(git rev-parse origin/main)"
          test "$(git merge-base "$BASE_SHA" "$live_main")" = "$BASE_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$live_main" -- "$BASELINE_PATH")"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$CANDIDATE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$BASELINE_PATH"
          test ! -e .github/workflows/temporary-topology-doc-id-baseline-shrink-main120b166.yml
          python -m json.tool "$BASELINE_PATH" >/dev/null
          git diff --check "$BASE_SHA...$CANDIDATE_SHA"
          printf '{"base_sha":"%s","candidate_sha":"%s","live_main":"%s","changed_path":"%s"}\n' \
            "$BASE_SHA" "$CANDIDATE_SHA" "$live_main" "$BASELINE_PATH" \
            > topology-evidence/identity.json

      - name: Validate strict evidence shrink and finding isolation
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:$BASELINE_PATH" > topology-evidence/baseline-before.json
          cp "$BASELINE_PATH" topology-evidence/baseline-after.json

          set +e
          python tools/validators/directory_governance/validate_repository_topology.py \
            --repo-root . \
            --baseline topology-evidence/baseline-before.json \
            --format json > topology-evidence/report-before.json
          before_rc=$?
          python tools/validators/directory_governance/validate_repository_topology.py \
            --repo-root . \
            --baseline "$BASELINE_PATH" \
            --trusted-baseline-ref "$BASE_SHA" \
            --format json > topology-evidence/report-after.json
          after_rc=$?
          set -e
          test "$before_rc" -eq 1
          test "$after_rc" -eq 1

          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import zlib
          from pathlib import Path

          evidence_dir = Path("topology-evidence")
          before_report = json.loads((evidence_dir / "report-before.json").read_text(encoding="utf-8"))
          after_report = json.loads((evidence_dir / "report-after.json").read_text(encoding="utf-8"))
          before_baseline = json.loads((evidence_dir / "baseline-before.json").read_text(encoding="utf-8"))
          after_baseline = json.loads((evidence_dir / "baseline-after.json").read_text(encoding="utf-8"))
          old_fp = os.environ["OLD_FINGERPRINT"]
          new_fp = os.environ["NEW_FINGERPRINT"]
          rule_id = "KFM-TOPO-016"
          subject = "doc-id:kfm://doc/NEEDS-VERIFICATION"
          expected_members = (
              "data/registry/sources/habitat/README.md",
              "data/registry/sources/habitat/ecoregions/README.md",
              "data/registry/sources/hazards/README.md",
              "data/registry/sources/hydrology/README.md",
              "data/registry/sources/people-dna-land/README.md",
              "data/registry/sources/people-dna-land/land-ownership/README.md",
              "data/registry/sources/people/README.md",
              "docs/atlases/maplibre-master.md",
              "docs/atlases/pipeline-gate-reference.md",
              "docs/atlases/receipt-catalog.md",
              "docs/doctrine/ai-build-operating-contract.md",
              "docs/intake/IDEA_INTAKE.md",
              "docs/intake/carry-forward/README.md",
              "docs/intake/exploratory/README.md",
          )

          def target_entries(payload: dict[str, object]) -> list[dict[str, str]]:
              return [
                  entry for entry in payload["entries"]
                  if entry.get("rule_id") == rule_id and entry.get("subject") == subject
              ]

          old_entries = target_entries(before_baseline)
          new_entries = target_entries(after_baseline)
          if len(old_entries) != 1 or len(new_entries) != 1:
              raise SystemExit("expected exactly one before and after document-identity entry")
          old_entry = old_entries[0]
          new_entry = new_entries[0]
          if old_entry["fingerprint"] != old_fp or new_entry["fingerprint"] != new_fp:
              raise SystemExit("document-identity fingerprints do not match pinned transition")

          old_members = tuple(
              zlib.decompress(base64.b64decode(old_entry["evidence_zlib_base64"]))
              .decode("utf-8")
              .split("\0")
          )
          new_members = tuple(
              zlib.decompress(base64.b64decode(new_entry["evidence_zlib_base64"]))
              .decode("utf-8")
              .split("\0")
          )
          if len(old_members) != 22 or new_members != expected_members:
              raise SystemExit("unexpected document-identity evidence membership")
          if not set(new_members) < set(old_members):
              raise SystemExit("replacement is not a strict subset of prior evidence")

          rendered = "\0".join(new_members)
          evidence_sha = "sha256:" + hashlib.sha256(rendered.encode("utf-8")).hexdigest()
          if new_entry["evidence_sha256"] != evidence_sha:
              raise SystemExit("evidence digest does not match decoded members")
          finding_fp = "sha256:" + hashlib.sha256(
              "\0".join((rule_id, subject, evidence_sha)).encode("utf-8")
          ).hexdigest()
          if finding_fp != new_fp:
              raise SystemExit("finding fingerprint does not match canonical fields")

          protected_keys = tuple(key for key in before_baseline if key != "entries")
          if {key: before_baseline[key] for key in protected_keys} != {
              key: after_baseline[key] for key in protected_keys
          }:
              raise SystemExit("baseline metadata changed")
          before_others = [entry for entry in before_baseline["entries"] if entry != old_entry]
          after_others = [entry for entry in after_baseline["entries"] if entry != new_entry]
          if before_others != after_others or len(before_baseline["entries"]) != len(after_baseline["entries"]):
              raise SystemExit("a non-target baseline entry changed")

          before_by_fp = {item["fingerprint"]: item for item in before_report["findings"]}
          after_by_fp = {item["fingerprint"]: item for item in after_report["findings"]}
          if before_by_fp[new_fp]["disposition"] != "FAIL_NEW_DRIFT":
              raise SystemExit("document identity was not new drift against the prior baseline")
          if after_by_fp[new_fp]["disposition"] != "BASELINED_WARNING":
              raise SystemExit("document identity was not baselined after the strict shrink")
          if old_fp not in before_report["baseline"]["stale_fingerprints"]:
              raise SystemExit("prior document-identity fingerprint was not stale before repair")
          if old_fp in after_report["baseline"]["stale_fingerprints"]:
              raise SystemExit("prior document-identity fingerprint remains stale after repair")
          if before_report["counts"]["fail_new_drift"] != 5 or after_report["counts"]["fail_new_drift"] != 4:
              raise SystemExit("fail-new-drift count did not change exactly 5 -> 4")
          if len(before_report["baseline"]["stale_fingerprints"]) != 5 or len(after_report["baseline"]["stale_fingerprints"]) != 4:
              raise SystemExit("stale-fingerprint count did not change exactly 5 -> 4")
          if after_report["counts"]["fail_invariant"] != before_report["counts"]["fail_invariant"]:
              raise SystemExit("invariant count changed")
          if after_report["tracked_path_count"] != before_report["tracked_path_count"]:
              raise SystemExit("tracked-path count changed")

          remaining_before = {
              item["fingerprint"]: item["disposition"]
              for item in before_report["findings"] if item["fingerprint"] != new_fp
          }
          remaining_after = {
              item["fingerprint"]: item["disposition"]
              for item in after_report["findings"] if item["fingerprint"] != new_fp
          }
          if remaining_before != remaining_after:
              raise SystemExit("an unrelated finding changed disposition")

          remaining_failures = [
              {
                  "rule_id": item["rule_id"],
                  "subject": item["subject"],
                  "fingerprint": item["fingerprint"],
                  "disposition": item["disposition"],
              }
              for item in after_report["findings"]
              if item["disposition"] in {"FAIL_NEW_DRIFT", "FAIL_INVARIANT"}
          ]
          summary = {
              "base_sha": os.environ["BASE_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "candidate_baseline_blob": os.environ["BASELINE_BLOB"],
              "changed_paths": [os.environ["BASELINE_PATH"]],
              "transition": "STRICT_EVIDENCE_SHRINK",
              "resolved_identity": "KFM-TOPO-016:doc-id:kfm://doc/NEEDS-VERIFICATION",
              "old_fingerprint": old_fp,
              "new_fingerprint": new_fp,
              "old_member_count": len(old_members),
              "new_member_count": len(new_members),
              "before": {
                  "exit_code": 1,
                  "outcome": before_report["outcome"],
                  "fail_new_drift": before_report["counts"]["fail_new_drift"],
                  "fail_invariant": before_report["counts"]["fail_invariant"],
                  "stale_fingerprints": len(before_report["baseline"]["stale_fingerprints"]),
              },
              "after": {
                  "exit_code": 1,
                  "outcome": after_report["outcome"],
                  "fail_new_drift": after_report["counts"]["fail_new_drift"],
                  "fail_invariant": after_report["counts"]["fail_invariant"],
                  "stale_fingerprints": len(after_report["baseline"]["stale_fingerprints"]),
              },
              "remaining_failures": remaining_failures,
              "remaining_drift_status": "INHERITED_UNCHANGED_EXCEPT_RESOLVED_IDENTITY",
              "baseline_entry_count_unchanged": True,
              "baseline_growth": False,
          }
          (evidence_dir / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Run focused topology tests and classify closure-coupled assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import importlib.util
          import io
          import json
          import sys
          import unittest
          from contextlib import redirect_stderr, redirect_stdout
          from pathlib import Path

          path = Path("tests/validators/directory_governance/test_validate_repository_topology.py")
          spec = importlib.util.spec_from_file_location("kfm_topology_tests", path)
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load topology test module")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          closure_coupled = {
              "test_cli_json_is_deterministic",
              "test_live_index_matches_baseline_after_reviewed_authority_resolution",
          }
          names = unittest.defaultTestLoader.getTestCaseNames(module.RepositoryTopologyTests)
          focused_names = [name for name in names if name not in closure_coupled]
          focused_suite = unittest.TestSuite(
              module.RepositoryTopologyTests(name) for name in focused_names
          )
          focused = unittest.TextTestRunner(verbosity=2).run(focused_suite)
          if not focused.wasSuccessful():
              raise SystemExit("a non-closure-coupled topology test failed")

          classified: dict[str, str] = {}
          for name in sorted(closure_coupled):
              stream = io.StringIO()
              suite = unittest.TestSuite([module.RepositoryTopologyTests(name)])
              with redirect_stdout(stream), redirect_stderr(stream):
                  result = unittest.TextTestRunner(stream=stream, verbosity=2).run(suite)
              if result.wasSuccessful() or result.errors or len(result.failures) != 1:
                  raise SystemExit(
                      f"closure-coupled test {name} did not fail exactly once as expected: {stream.getvalue()}"
                  )
              classified[name] = "EXPECTED_INHERITED_BASELINE_CLOSURE_FAILURE"

          evidence_path = Path("topology-evidence/test-summary.json")
          summary = {
              "focused_tests_run": focused.testsRun,
              "focused_tests_passed": focused.wasSuccessful(),
              "closure_coupled_tests": classified,
              "closure_coupled_failure_count": len(classified),
              "classification": "PARTIAL_BASELINE_CONVERGENCE_NOT_FULL_TOPOLOGY_CLOSURE",
          }
          evidence_path.write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload exact-head topology evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: topology-doc-id-shrink-a20d1ec-main120b166
          path: topology-evidence/
          if-no-files-found: error
          retention-days: 14

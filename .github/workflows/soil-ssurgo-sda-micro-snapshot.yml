# Exercise the synthetic, no-network SSURGO/SDA micro-snapshot boundary.
name: soil-ssurgo-sda-micro-snapshot

"on":
  pull_request:
    paths:
      - ".github/workflows/soil-ssurgo-sda-micro-snapshot.yml"
      - "contracts/domains/soil/ssurgo_sda_micro_snapshot.md"
      - "schemas/contracts/v1/domains/soil/ssurgo_sda_micro_snapshot_report.schema.json"
      - "tools/ingest/ssurgo_watch/sda_micro_snapshot.py"
      - "tests/ingest/ssurgo_watch/test_sda_micro_snapshot.py"
      - "tests/ingest/ssurgo_watch/fixtures/sda_micro_snapshot/**"
      - "data/receipts/generated/genrec-soil-ssurgo-sda-micro-snapshot-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/soil-ssurgo-sda-micro-snapshot.yml"
      - "contracts/domains/soil/ssurgo_sda_micro_snapshot.md"
      - "schemas/contracts/v1/domains/soil/ssurgo_sda_micro_snapshot_report.schema.json"
      - "tools/ingest/ssurgo_watch/sda_micro_snapshot.py"
      - "tests/ingest/ssurgo_watch/test_sda_micro_snapshot.py"
      - "tests/ingest/ssurgo_watch/fixtures/sda_micro_snapshot/**"
      - "data/receipts/generated/genrec-soil-ssurgo-sda-micro-snapshot-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soil-ssurgo-sda-micro-snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-ssurgo-sda-micro-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Run deterministic SDA micro-snapshot tests
        run: |
          set -euo pipefail
          python -m pytest \
            tests/ingest/ssurgo_watch/test_sda_micro_snapshot.py \
            -q --strict-config --strict-markers

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-soil-ssurgo-sda-micro-snapshot-20260806.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Synthetic SSURGO/SDA micro-snapshot"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: canonical component rows, content/retrieval hashes, percentage/range checks, and field-level fixture diffs."
            echo "- Finite outcomes: NO_MATERIAL_CHANGE, PROPOSED_WORK_RECORD, VALIDATION_HOLD, or ERROR."
            echo "- Boundary: no live NRCS endpoint, SDA query, source activation, lifecycle write, operational signing, policy approval, promotion, release, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

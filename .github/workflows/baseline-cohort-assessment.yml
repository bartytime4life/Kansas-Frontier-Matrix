# Validate the fixture-only baseline cohort assessment candidate.
name: baseline-cohort-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/baseline-cohort-assessment.yml"
      - "contracts/data/baseline_cohort_assessment.md"
      - "schemas/contracts/v1/data/baseline_cohort_assessment.schema.json"
      - "fixtures/contracts/v1/data/baseline_cohort_assessment/**"
      - "tools/validators/data/validate_baseline_cohort_assessment.py"
      - "tests/validators/test_validate_baseline_cohort_assessment.py"
      - "docs/intake/exploratory/baseline-cohort-assessment-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-baseline-cohort-assessment-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/baseline-cohort-assessment.yml"
      - "contracts/data/baseline_cohort_assessment.md"
      - "schemas/contracts/v1/data/baseline_cohort_assessment.schema.json"
      - "fixtures/contracts/v1/data/baseline_cohort_assessment/**"
      - "tools/validators/data/validate_baseline_cohort_assessment.py"
      - "tests/validators/test_validate_baseline_cohort_assessment.py"
      - "docs/intake/exploratory/baseline-cohort-assessment-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-baseline-cohort-assessment-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-cohort-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-baseline-cohort-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_baseline_cohort_assessment.py' \
            --verbose
          python tools/validators/data/validate_baseline_cohort_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-baseline-cohort-assessment-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### BaselineCohortAssessmentCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: baseline window, cohort eligibility, exclusions, holds, method continuity, discontinuities, summary replay, and deterministic identity."
            echo "- Boundary: no source fetch, observation values, baseline calculation or rebuild, anomaly or materiality decision, mutation, policy, review, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

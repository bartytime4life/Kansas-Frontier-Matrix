# Validate fixture-first baseline cohort assessments.
name: baseline-cohort-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/baseline-cohort-assessment.yml"
      - "contracts/data/baseline_cohort_assessment.md"
      - "schemas/contracts/v1/data/baseline_cohort_assessment.schema.json"
      - "tools/validators/data/validate_baseline_cohort_assessment.py"
      - "fixtures/contracts/v1/data/baseline_cohort_assessment/**"
      - "tests/data/test_baseline_cohort_assessment.py"
      - "docs/intake/exploratory/new-ideas-4-16-source-map.md"
      - "docs/kfm_full_atlas_seed_cards.md"
      - "data/receipts/generated/genrec-baseline-cohort-assessment-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/baseline-cohort-assessment.yml"
      - "contracts/data/baseline_cohort_assessment.md"
      - "schemas/contracts/v1/data/baseline_cohort_assessment.schema.json"
      - "tools/validators/data/validate_baseline_cohort_assessment.py"
      - "fixtures/contracts/v1/data/baseline_cohort_assessment/**"
      - "tests/data/test_baseline_cohort_assessment.py"
      - "docs/intake/exploratory/new-ideas-4-16-source-map.md"
      - "docs/kfm_full_atlas_seed_cards.md"
      - "data/receipts/generated/genrec-baseline-cohort-assessment-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-cohort-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-baseline-cohort
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run fixture matrix
        run: python tools/validators/data/validate_baseline_cohort_assessment.py --fixtures
      - name: Run focused tests
        run: python -m pytest tests/data/test_baseline_cohort_assessment.py -q --strict-config --strict-markers
      - name: Validate generated authoring receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-baseline-cohort-assessment-20260810.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Baseline cohort assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic baseline manifests, cohort counts, discontinuities, and local validation only."
            echo "- Boundary: no source activation, threshold, anomaly, lifecycle write, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

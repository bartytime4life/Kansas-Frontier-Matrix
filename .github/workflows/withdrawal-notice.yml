# Validate WithdrawalNotice schema and fixture polarity.
#
# This workflow is deterministic and no-network after installing declared test
# dependencies. A green result proves only the current PROPOSED schema surface,
# parser hardening, and fixture polarity. It does not execute withdrawal,
# invalidate downstream products, authorize review, release, or publication.
name: withdrawal-notice

"on":
  pull_request:
    paths:
      - ".github/workflows/withdrawal-notice.yml"
      - "contracts/release/withdrawal_notice.md"
      - "schemas/contracts/v1/release/withdrawal_notice.schema.json"
      - "fixtures/release/withdrawal_notice/**"
      - "tools/validators/release/validate_withdrawal_notice.py"
      - "tests/validators/test_validate_withdrawal_notice.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/withdrawal-notice.yml"
      - "contracts/release/withdrawal_notice.md"
      - "schemas/contracts/v1/release/withdrawal_notice.schema.json"
      - "fixtures/release/withdrawal_notice/**"
      - "tools/validators/release/validate_withdrawal_notice.py"
      - "tests/validators/test_validate_withdrawal_notice.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: withdrawal-notice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-withdrawal-notice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused no-network tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_withdrawal_notice.py' \
            --verbose
          python tools/validators/release/validate_withdrawal_notice.py --fixtures

      - name: Record validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### WithdrawalNotice validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: the current PROPOSED Draft 2020-12 schema, bounded JSON input, duplicate-key and non-finite-number rejection, and exact valid/invalid fixture polarity."
            echo "- Known gaps: the schema remains thin; correction linkage, rights and sensitivity policy, reviewer authority, downstream invalidation, restoration, live emitters, release, and publication remain unproved."
            echo "- Boundary: a green result does not withdraw, delete, unpublish, hide, invalidate, restore, release, deploy, promote, or publish any object."
          } >> "$GITHUB_STEP_SUMMARY"

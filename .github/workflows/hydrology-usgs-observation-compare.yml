# Offline diagnostics only: no provider acquisition or lifecycle transition.
name: hydrology-usgs-observation-compare

"on":
  pull_request:
    paths:
      - ".github/workflows/hydrology-usgs-observation-compare.yml"
      - "tools/ingest/hydrology_watch/usgs_observation_compare.py"
      - "tools/ingest/hydrology_watch/README.md"
      - "tests/ingest/hydrology_watch/test_usgs_observation_compare.py"
      - "docs/runbooks/hydrology/usgs-api-readiness-20261031.md"
      - "data/receipts/generated/genrec-usgs-offline-comparison-20261031.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hydrology-usgs-observation-compare.yml"
      - "tools/ingest/hydrology_watch/usgs_observation_compare.py"
      - "tools/ingest/hydrology_watch/README.md"
      - "tests/ingest/hydrology_watch/test_usgs_observation_compare.py"
      - "docs/runbooks/hydrology/usgs-api-readiness-20261031.md"
      - "data/receipts/generated/genrec-usgs-offline-comparison-20261031.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydrology-usgs-observation-compare-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  validate:
    name: validate-usgs-observation-compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install declared test dependencies for receipt validation
        run: python tools/ci/install_python_ci.py project-test

      - name: Test captured comparisons and refusal paths
        run: python -m unittest discover -s tests/ingest/hydrology_watch -p test_usgs_observation_compare.py -v

      - name: Verify generated authoring receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-usgs-offline-comparison-20261031.json --repo-root .

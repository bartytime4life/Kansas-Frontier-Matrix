# Validate the fixture-only measurement-support reconciliation candidate.
name: measurement-support-reconciliation

"on":
  pull_request:
    paths:
      - ".github/workflows/measurement-support-reconciliation.yml"
      - "contracts/common/measurement_support_reconciliation.md"
      - "schemas/contracts/v1/common/measurement_support_reconciliation.schema.json"
      - "fixtures/contracts/v1/common/measurement_support_reconciliation/**"
      - "tools/validators/validate_measurement_support_reconciliation.py"
      - "tests/validators/test_validate_measurement_support_reconciliation.py"
      - "docs/intake/exploratory/measurement-support-reconciliation-source-map.md"
      - "contracts/common/condition_relation.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-measurement-support-reconciliation-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/measurement-support-reconciliation.yml"
      - "contracts/common/measurement_support_reconciliation.md"
      - "schemas/contracts/v1/common/measurement_support_reconciliation.schema.json"
      - "fixtures/contracts/v1/common/measurement_support_reconciliation/**"
      - "tools/validators/validate_measurement_support_reconciliation.py"
      - "tests/validators/test_validate_measurement_support_reconciliation.py"
      - "docs/intake/exploratory/measurement-support-reconciliation-source-map.md"
      - "contracts/common/condition_relation.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-measurement-support-reconciliation-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measurement-support-reconciliation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-measurement-support-reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused and adjacent deterministic tests
        run: |
          python -m unittest -v tests.validators.test_validate_measurement_support_reconciliation
          python -m pytest -q tests/validators/test_validate_condition_relation.py
          python tools/validators/validate_measurement_support_reconciliation.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-measurement-support-reconciliation-20260809.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### MeasurementSupportReconciliation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only unit and measurement-support reconciliation."
            echo "- Boundary: no live source, scientific harmonization, evidence or policy authority, review approval, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

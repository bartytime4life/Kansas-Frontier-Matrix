# Validate the fixture-only receipt catalog assessment candidate.
name: receipt-catalog-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/receipt-catalog-assessment.yml"
      - "contracts/governance/receipt_catalog_assessment.md"
      - "schemas/contracts/v1/governance/receipt_catalog_assessment.schema.json"
      - "fixtures/contracts/v1/governance/receipt_catalog_assessment/**"
      - "tools/validators/governance/validate_receipt_catalog_assessment.py"
      - "tests/validators/governance/test_receipt_catalog_assessment.py"
      - "docs/intake/exploratory/receipt-catalog-assessment-source-map.md"
      - "docs/atlases/receipt-catalog.md"
      - "docs/adr/INDEX.md"
      - "contracts/runtime/ai_receipt.md"
      - "contracts/runtime/run_receipt.md"
      - "contracts/release/promotion_receipt.md"
      - "contracts/release/release_manifest.md"
      - "contracts/shared/redaction_receipt.md"
      - "contracts/source/source_descriptor.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-receipt-catalog-assessment-20260811.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/receipt-catalog-assessment.yml"
      - "contracts/governance/receipt_catalog_assessment.md"
      - "schemas/contracts/v1/governance/receipt_catalog_assessment.schema.json"
      - "fixtures/contracts/v1/governance/receipt_catalog_assessment/**"
      - "tools/validators/governance/validate_receipt_catalog_assessment.py"
      - "tests/validators/governance/test_receipt_catalog_assessment.py"
      - "docs/intake/exploratory/receipt-catalog-assessment-source-map.md"
      - "docs/atlases/receipt-catalog.md"
      - "docs/adr/INDEX.md"
      - "contracts/runtime/ai_receipt.md"
      - "contracts/runtime/run_receipt.md"
      - "contracts/release/promotion_receipt.md"
      - "contracts/release/release_manifest.md"
      - "contracts/shared/redaction_receipt.md"
      - "contracts/source/source_descriptor.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-receipt-catalog-assessment-20260811.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receipt-catalog-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-receipt-catalog-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests and fixture replay
        run: |
          python -m unittest -v tests.validators.governance.test_receipt_catalog_assessment
          python tools/validators/governance/validate_receipt_catalog_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-receipt-catalog-assessment-20260811.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### ReceiptCatalogAssessmentCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only receipt-family, object-class, lifecycle, and semantic-contract reference consistency."
            echo "- Boundary: no receipt schema authority, manifest reclassification, catalog write, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

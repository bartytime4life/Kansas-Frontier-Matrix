name: connector-load-budget-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/connector-load-budget-assessment.yml"
      - "contracts/source/connector_load_budget_assessment.md"
      - "schemas/contracts/v1/source/connector_load_budget_assessment.schema.json"
      - "fixtures/contracts/v1/source/connector_load_budget_assessment/**"
      - "tools/validators/source/validate_connector_load_budget_assessment.py"
      - "tests/validators/test_validate_connector_load_budget_assessment.py"
      - "docs/intake/exploratory/pass-18-connector-load-budget-assessment-source-map.md"
      - "contracts/source/web_acquisition_conduct_assessment.md"
      - "docs/standards/connector-rate-limits.md"
      - "data/receipts/generated/genrec-pass18-connector-load-budget-assessment-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/connector-load-budget-assessment.yml"
      - "contracts/source/connector_load_budget_assessment.md"
      - "schemas/contracts/v1/source/connector_load_budget_assessment.schema.json"
      - "fixtures/contracts/v1/source/connector_load_budget_assessment/**"
      - "tools/validators/source/validate_connector_load_budget_assessment.py"
      - "tests/validators/test_validate_connector_load_budget_assessment.py"
      - "docs/intake/exploratory/pass-18-connector-load-budget-assessment-source-map.md"
      - "contracts/source/web_acquisition_conduct_assessment.md"
      - "docs/standards/connector-rate-limits.md"
      - "data/receipts/generated/genrec-pass18-connector-load-budget-assessment-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-load-budget-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-connector-load-budget-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/source/validate_connector_load_budget_assessment.py tests/validators/test_validate_connector_load_budget_assessment.py
          python -m unittest tests.validators.test_validate_connector_load_budget_assessment --verbose
          python tools/validators/source/validate_connector_load_budget_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-connector-load-budget-assessment-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Connector load-budget assessment candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only source-wide concurrency, pacing, retry, coordination, stop-condition, conduct-reference, and review-reference coherence."
            echo "- Boundary: no network request, retry, sleep, scheduling, connector execution, source activation, lifecycle write, evidence or policy decision, review approval, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

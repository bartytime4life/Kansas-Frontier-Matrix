# Validate the MapContextEnvelope to EvidenceDrawerPayload admission boundary.
name: map-context-evidence-drawer-admission

"on":
  pull_request:
    paths:
      - ".github/workflows/map-context-evidence-drawer-admission.yml"
      - "docs/architecture/ui/map-context-evidence-drawer-admission.md"
      - "packages/envelopes/src/envelopes/**"
      - "schemas/contracts/v1/ui/map_context_envelope.schema.json"
      - "schemas/contracts/v1/ui/evidence_drawer_payload.schema.json"
      - "schemas/contracts/v1/runtime/decision_envelope.schema.json"
      - "fixtures/ui/map_context_envelope/**"
      - "fixtures/ui/evidence_drawer_payload/**"
      - "fixtures/ui/map_context_evidence_drawer_admission/**"
      - "tools/validators/ui/validate_map_context_envelope.py"
      - "tools/validators/ui/validate_evidence_drawer_payload.py"
      - "tools/validators/ui/validate_map_context_evidence_drawer_admission.py"
      - "tests/packages/envelopes/test_map_context_evidence_drawer_admission.py"
      - "data/receipts/generated/genrec-map-context-evidence-drawer-admission-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-context-evidence-drawer-admission.yml"
      - "docs/architecture/ui/map-context-evidence-drawer-admission.md"
      - "packages/envelopes/src/envelopes/**"
      - "schemas/contracts/v1/ui/map_context_envelope.schema.json"
      - "schemas/contracts/v1/ui/evidence_drawer_payload.schema.json"
      - "schemas/contracts/v1/runtime/decision_envelope.schema.json"
      - "fixtures/ui/map_context_envelope/**"
      - "fixtures/ui/evidence_drawer_payload/**"
      - "fixtures/ui/map_context_evidence_drawer_admission/**"
      - "tools/validators/ui/validate_map_context_envelope.py"
      - "tools/validators/ui/validate_evidence_drawer_payload.py"
      - "tools/validators/ui/validate_map_context_evidence_drawer_admission.py"
      - "tests/packages/envelopes/test_map_context_evidence_drawer_admission.py"
      - "data/receipts/generated/genrec-map-context-evidence-drawer-admission-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-context-evidence-drawer-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-map-context-evidence-drawer-admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"

      - name: Validate source fixtures with existing authorities
        run: |
          set -euo pipefail
          python tools/validators/ui/validate_map_context_envelope.py             fixtures/ui/map_context_envelope/base_viewport.json
          python tools/validators/ui/validate_map_context_envelope.py             fixtures/ui/map_context_envelope/base_geography.json
          python tools/validators/ui/validate_evidence_drawer_payload.py             fixtures/ui/map_context_evidence_drawer_admission/payloads/answer-aligned.json
          python tools/validators/ui/validate_evidence_drawer_payload.py             fixtures/ui/map_context_evidence_drawer_admission/payloads/answer-wrong-selection.json
          python tools/validators/ui/validate_evidence_drawer_payload.py             fixtures/ui/map_context_evidence_drawer_admission/payloads/abstain-stale-aligned.json
          python tools/validators/ui/validate_evidence_drawer_payload.py             fixtures/ui/evidence_drawer_payload/valid/deny-sensitive.json
          python tools/validators/ui/validate_evidence_drawer_payload.py             fixtures/ui/evidence_drawer_payload/valid/error-upstream.json

      - name: Run deterministic package tests and exact case replay
        env:
          PYTHONPATH: packages/envelopes/src
        run: |
          set -euo pipefail
          python -m pytest             tests/packages/envelopes/test_map_context_evidence_drawer_admission.py             -q --strict-config --strict-markers
          python tools/validators/ui/validate_map_context_evidence_drawer_admission.py             --cases

      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py             data/receipts/generated/genrec-map-context-evidence-drawer-admission-20260807.json             --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Map context to Evidence Drawer admission"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: existing input validators, selected-feature evidence binding, context expiry, declared release alignment, finite outcome propagation, DecisionEnvelope schema conformance, no-leak behavior, and authoring receipt integrity."
            echo "- Boundary: a green result does not resolve evidence, evaluate policy, authenticate review, establish release state, authorize public use, or prove deployed API/UI invocation."
          } >> "$GITHUB_STEP_SUMMARY"

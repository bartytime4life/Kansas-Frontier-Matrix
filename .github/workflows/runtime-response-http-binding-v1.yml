name: runtime-response-http-binding-v1

"on":
  pull_request:
    paths:
      - ".github/workflows/runtime-response-http-binding-v1.yml"
      - "contracts/runtime/runtime_response_http_binding_v1.md"
      - "schemas/contracts/v1/runtime/runtime_response_http_binding_v1.schema.json"
      - "tools/validators/runtime/validate_runtime_response_http_binding_v1.py"
      - "fixtures/contracts/v1/runtime/runtime_response_http_binding_v1/**"
      - "tests/validators/test_validate_runtime_response_http_binding_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-response-http-binding-v1.yml"
      - "contracts/runtime/runtime_response_http_binding_v1.md"
      - "schemas/contracts/v1/runtime/runtime_response_http_binding_v1.schema.json"
      - "tools/validators/runtime/validate_runtime_response_http_binding_v1.py"
      - "fixtures/contracts/v1/runtime/runtime_response_http_binding_v1/**"
      - "tests/validators/test_validate_runtime_response_http_binding_v1.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-runtime-response-http-binding-v1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic tests
        run: |
          set -euo pipefail
          python -m pytest tests/validators/test_validate_runtime_response_http_binding_v1.py -q --strict-config --strict-markers

      - name: Prove valid and anti-collapse fixtures
        run: |
          set -euo pipefail
          python tools/validators/runtime/validate_runtime_response_http_binding_v1.py \
            fixtures/contracts/v1/runtime/runtime_response_http_binding_v1/valid/answer.json
          if python tools/validators/runtime/validate_runtime_response_http_binding_v1.py \
            fixtures/contracts/v1/runtime/runtime_response_http_binding_v1/invalid/abstain_as_deny.json; then
            echo "expected invalid ABSTAIN/DENY collapse to fail" >&2
            exit 1
          fi

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### RuntimeResponseEnvelope HTTP binding v1"
            echo
            echo "- Scope: fixture-only HTTP/outcome coherence for the existing RuntimeResponseEnvelope."
            echo "- Boundary: no API route wiring, policy execution, lifecycle write, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

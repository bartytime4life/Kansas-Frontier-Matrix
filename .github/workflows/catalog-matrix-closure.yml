# Validate local STAC/DCAT/PROV CatalogMatrix closure without network access.
name: catalog-matrix-closure

"on":
  pull_request:
    paths:
      - ".github/workflows/catalog-matrix-closure.yml"
      - "contracts/data/catalog_matrix.md"
      - "schemas/contracts/v1/data/catalog_matrix.schema.json"
      - "fixtures/data/catalog_matrix/**"
      - "tools/validators/validate_catalog_matrix.py"
      - "tests/validators/test_validate_catalog_matrix.py"
      - "data/receipts/generated/genrec-catalog-matrix-closure-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-matrix-closure.yml"
      - "contracts/data/catalog_matrix.md"
      - "schemas/contracts/v1/data/catalog_matrix.schema.json"
      - "fixtures/data/catalog_matrix/**"
      - "tools/validators/validate_catalog_matrix.py"
      - "tests/validators/test_validate_catalog_matrix.py"
      - "data/receipts/generated/genrec-catalog-matrix-closure-*.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-matrix-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC
jobs:
  validate:
    name: validate-catalog-matrix-closure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
      - name: Run focused tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/validators/test_validate_catalog_matrix.py
      - name: Replay exact fixture polarity
        run: |
          set -euo pipefail
          python tools/validators/validate_catalog_matrix.py --fixtures
      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-catalog-matrix-closure-20260809.json --repo-root .
      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### CatalogMatrix closure"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: local STAC/DCAT/PROV identity, digest, release-reference, reference hygiene, and decision/reason alignment."
            echo "- A PASS does not emit catalogs, resolve evidence, decide policy, approve review, release, publish, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"

name: evidence-bundle-projection-aggregate

on:
  pull_request:
    paths:
      - 'schemas/contracts/v1/evidence/evidence_bundle.schema.json'
      - 'schemas/contracts/v1/domains/*/evidence_bundle.schema.json'
      - 'tools/validators/validate_*_evidence_bundle_projection.py'
      - 'tools/validators/domains/*/validate_evidence_bundle.py'
      - 'tests/contracts/test_evidence_bundle_projection_aggregate.py'
      - '.github/workflows/evidence-bundle-projection-aggregate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Compile aggregate projection test
        run: python -m py_compile tests/contracts/test_evidence_bundle_projection_aggregate.py
      - name: Enforce aggregate EvidenceBundle projection invariants
        run: python -m unittest -q tests.contracts.test_evidence_bundle_projection_aggregate

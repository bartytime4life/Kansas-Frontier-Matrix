# Validate the fixture-only evidence custody handoff profile.
#
# Authority boundary:
# - This workflow reads synthetic repository fixtures only.
# - It performs no source fetch, payload transfer, evidence resolution, policy
#   decision, lifecycle write, promotion, release, deployment, or publication.
name: evidence-custody-handoff

"on":
  pull_request:
    paths:
      - ".github/workflows/evidence-custody-handoff.yml"
      - "contracts/evidence/evidence_custody_handoff.md"
      - "schemas/contracts/v1/evidence/evidence_custody_handoff.schema.json"
      - "fixtures/contracts/v1/evidence/evidence_custody_handoff/**"
      - "tools/validators/validate_evidence_custody_handoff.py"
      - "tests/validators/test_validate_evidence_custody_handoff.py"
      - "data/receipts/generated/genrec-evidence-custody-handoff-20260805.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/evidence-custody-handoff.yml"
      - "contracts/evidence/evidence_custody_handoff.md"
      - "schemas/contracts/v1/evidence/evidence_custody_handoff.schema.json"
      - "fixtures/contracts/v1/evidence/evidence_custody_handoff/**"
      - "tools/validators/validate_evidence_custody_handoff.py"
      - "tests/validators/test_validate_evidence_custody_handoff.py"
      - "data/receipts/generated/genrec-evidence-custody-handoff-20260805.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-custody-handoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: evidence-custody-handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out bounded fixture profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install declared test dependencies
        run: python -m pip install --no-input -e ".[test]"

      - name: Run focused semantic tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/validators/test_validate_evidence_custody_handoff.py

      - name: Replay exact fixture polarity
        run: >-
          python tools/validators/validate_evidence_custody_handoff.py
          --fixtures

      - name: Run repository schema polarity for the profile
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/schemas/test_common_contracts.py
          -k evidence_custody_handoff

      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-evidence-custody-handoff-20260805.json
          --repo-root .

      - name: Record bounded trust result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Evidence custody handoff status

          This job validates synthetic sender manifests, receiver dispositions,
          exact accounting, digest equality, quarantine holds, deterministic
          identity, and lifecycle non-escalation.

          A green result does not establish a real transfer, source authority,
          EvidenceBundle closure, policy approval, lifecycle mutation,
          promotion, release, deployment, publication, or public-use authority.
          EOF

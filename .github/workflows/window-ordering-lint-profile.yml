name: window-ordering-lint-profile

"on":
  pull_request:
    paths:
      - ".github/workflows/window-ordering-lint-profile.yml"
      - "contracts/validation/window_ordering_lint_profile.md"
      - "schemas/contracts/v1/validation/window_ordering_lint_profile.schema.json"
      - "fixtures/contracts/v1/validation/window_ordering_lint_profile/**"
      - "tools/validators/validate_window_ordering_lint_profile.py"
      - "tests/validators/test_validate_window_ordering_lint_profile.py"
      - "docs/intake/exploratory/pass-18-window-ordering-lint-source-map.md"
      - "contracts/common/rolling_metric_window_disclosure.md"
      - "data/receipts/generated/genrec-pass18-window-ordering-lint-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/window-ordering-lint-profile.yml"
      - "contracts/validation/window_ordering_lint_profile.md"
      - "schemas/contracts/v1/validation/window_ordering_lint_profile.schema.json"
      - "fixtures/contracts/v1/validation/window_ordering_lint_profile/**"
      - "tools/validators/validate_window_ordering_lint_profile.py"
      - "tests/validators/test_validate_window_ordering_lint_profile.py"
      - "docs/intake/exploratory/pass-18-window-ordering-lint-source-map.md"
      - "contracts/common/rolling_metric_window_disclosure.md"
      - "data/receipts/generated/genrec-pass18-window-ordering-lint-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: window-ordering-lint-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-window-ordering-lint-profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/validate_window_ordering_lint_profile.py tests/validators/test_validate_window_ordering_lint_profile.py
          python -m unittest tests.validators.test_validate_window_ordering_lint_profile --verbose
          python tools/validators/validate_window_ordering_lint_profile.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-window-ordering-lint-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Window-ordering lint candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only static checks for ordinary SQL window-clause ordering, primary-key position, final tie-breaker, duplicate keys, clause counts, and exact query identity."
            echo "- Boundary: no SQL execution, table or column resolution, uniqueness proof, result comparison, analytics, evidence or policy decision, review approval, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

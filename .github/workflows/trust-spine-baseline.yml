# Validate the proposed MRTS-01 trust-spine authority baseline packet.
#
# A green result proves only schema shape, canonical ordering, count and state
# reconciliation, repository path/digest binding, fixture polarity, focused
# tests, and authoring-receipt integrity. It does not create authority, accept
# an ADR, waive drift, activate a source, or authorize release or publication.
name: trust-spine-baseline

"on":
  pull_request:
    paths:
      - ".github/workflows/trust-spine-baseline.yml"
      - "Makefile"
      - "contracts/governance/trust_spine_baseline.md"
      - "control_plane/README.md"
      - "control_plane/trust_spine_baseline.yaml"
      - "schemas/contracts/v1/governance/trust_spine_baseline.schema.json"
      - "fixtures/contracts/v1/governance/trust_spine_baseline/**"
      - "tools/validators/control_plane/validate_trust_spine_baseline.py"
      - "tests/validators/test_validate_trust_spine_baseline.py"
      - "data/receipts/generated/genrec-trust-spine-baseline-*.json"
      - "data/receipts/generated/genrec-control-plane-registry-packet-*.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trust-spine-baseline.yml"
      - "Makefile"
      - "contracts/governance/trust_spine_baseline.md"
      - "control_plane/README.md"
      - "control_plane/trust_spine_baseline.yaml"
      - "schemas/contracts/v1/governance/trust_spine_baseline.schema.json"
      - "fixtures/contracts/v1/governance/trust_spine_baseline/**"
      - "tools/validators/control_plane/validate_trust_spine_baseline.py"
      - "tests/validators/test_validate_trust_spine_baseline.py"
      - "data/receipts/generated/genrec-trust-spine-baseline-*.json"
      - "data/receipts/generated/genrec-control-plane-registry-packet-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-spine-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-trust-spine-baseline:
    name: validate-trust-spine-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run deterministic MRTS-01 profile
        shell: bash
        run: make trust-spine-baseline

      - name: Record validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### MRTS-01 trust-spine authority baseline"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: schema, canonical ordering, count and execution-state reconciliation, repository path/digest binding, fixture polarity, focused unit tests, and authoring-receipt integrity."
            echo "- Known inherited state: the baseline records current repository-topology validation as FAIL with nine unbaselined drift findings; this workflow does not expand or waive that drift baseline."
            echo "- Boundary: this evidence projection cannot create authority, accept an ADR, activate a source, approve policy or review, or release, deploy, promote, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the fixture-only SSURGO/gNATSGO yearly-diff profile.
name: soil-ssurgo-yearly-diff

"on":
  pull_request:
    paths:
      - ".github/workflows/soil-ssurgo-yearly-diff.yml"
      - "contracts/domains/soil/ssurgo_yearly_diff_profile.md"
      - "schemas/contracts/v1/domains/soil/ssurgo_yearly_diff_profile.schema.json"
      - "pipeline_specs/soil/ssurgo_yearly_diff_profile.v1.json"
      - "tools/validators/domains/soil/validate_ssurgo_yearly_diff_profile.py"
      - "fixtures/domains/soil/yearly_diff/**"
      - "tests/validators/domains/soil/test_validate_ssurgo_yearly_diff_profile.py"
      - "docs/intake/exploratory/pass-32-ssurgo-yearly-diff-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass32-ssurgo-yearly-diff-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/soil-ssurgo-yearly-diff.yml"
      - "contracts/domains/soil/ssurgo_yearly_diff_profile.md"
      - "schemas/contracts/v1/domains/soil/ssurgo_yearly_diff_profile.schema.json"
      - "pipeline_specs/soil/ssurgo_yearly_diff_profile.v1.json"
      - "tools/validators/domains/soil/validate_ssurgo_yearly_diff_profile.py"
      - "fixtures/domains/soil/yearly_diff/**"
      - "tests/validators/domains/soil/test_validate_ssurgo_yearly_diff_profile.py"
      - "docs/intake/exploratory/pass-32-ssurgo-yearly-diff-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass32-ssurgo-yearly-diff-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soil-ssurgo-yearly-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-soil-ssurgo-yearly-diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
      - name: Run focused deterministic no-network validation
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/domains/soil \
            --pattern 'test_validate_ssurgo_yearly_diff_profile.py' \
            --verbose
          python tools/validators/domains/soil/validate_ssurgo_yearly_diff_profile.py --fixtures
          python tools/validators/domains/soil/validate_ssurgo_yearly_diff_profile.py \
            pipeline_specs/soil/ssurgo_yearly_diff_profile.v1.json
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass32-ssurgo-yearly-diff-20260808.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### SSURGO and gNATSGO yearly-diff profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only year pinning, snapshot/diff references, source-role anti-collapse, transform-receipt requirements, canonical spec hash, exact negative findings, and all-false authority posture."
            echo "- Boundary: PASS does not fetch NRCS bytes, activate sources, validate real STAC/PROV records, admit RAW, resolve evidence, promote, release, deploy, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

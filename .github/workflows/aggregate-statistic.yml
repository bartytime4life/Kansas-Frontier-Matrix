# Validate the additive, fixture-only AggregateStatistic profile.
name: aggregate-statistic

"on":
  pull_request:
    paths:
      - ".github/workflows/aggregate-statistic.yml"
      - "contracts/common/aggregate_statistic.md"
      - "schemas/contracts/v1/common/aggregate_statistic.schema.json"
      - "fixtures/contracts/v1/common/aggregate_statistic/**"
      - "tools/validators/validate_aggregate_statistic.py"
      - "tests/validators/test_validate_aggregate_statistic.py"
      - "docs/intake/exploratory/briefing-aggregate-statistic-source-map.md"
      - "data/receipts/generated/genrec-briefing-aggregate-statistic-20260810.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/aggregate-statistic.yml"
      - "contracts/common/aggregate_statistic.md"
      - "schemas/contracts/v1/common/aggregate_statistic.schema.json"
      - "fixtures/contracts/v1/common/aggregate_statistic/**"
      - "tools/validators/validate_aggregate_statistic.py"
      - "tests/validators/test_validate_aggregate_statistic.py"
      - "docs/intake/exploratory/briefing-aggregate-statistic-source-map.md"
      - "data/receipts/generated/genrec-briefing-aggregate-statistic-20260810.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aggregate-statistic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-aggregate-statistic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema, hashing, and test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests
        run: python -m unittest tests.validators.test_validate_aggregate_statistic --verbose
      - name: Replay exact fixture outcomes
        run: python tools/validators/validate_aggregate_statistic.py --fixtures
      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-briefing-aggregate-statistic-20260810.json
          --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### AggregateStatistic fixture profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: aggregation geography, weighting, numerator/denominator, missing-data treatment, source release, uncertainty, lineage, and deterministic identity."
            echo "- Boundary: no live source, statistic computation, exact-local truth, evidence/policy/review action, lifecycle write, release, map, API, AI, or publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

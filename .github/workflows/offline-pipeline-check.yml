# Execute existing synthetic pipelines. No provider capture, scheduling or promotion.
name: offline-pipeline-check

"on":
  pull_request:
    paths:
      - ".github/workflows/offline-pipeline-check.yml"
      - "pipelines/**"
      - "pipeline_specs/**"
      - "connectors/**"
      - "packages/**"
      - "schemas/**"
      - "fixtures/**"
      - "tools/validators/**"
      - "tools/ci/**"
      - "tests/pipelines/**"
      - "tests/conftest.py"
      - "data/receipts/generated/genrec-pipeline-ci-completion-20260917.json"
      - "tests/domains/hydrology/test_no_network_proof.py"
      - "Makefile"
      - "pyproject.toml"
  push:
    branches: [main, agent/pipeline-ci-completion-20260917]
    paths:
      - ".github/workflows/offline-pipeline-check.yml"
      - "pipelines/**"
      - "pipeline_specs/**"
      - "connectors/**"
      - "packages/**"
      - "schemas/**"
      - "fixtures/**"
      - "tools/validators/**"
      - "tools/ci/**"
      - "tests/pipelines/**"
      - "tests/conftest.py"
      - "data/receipts/generated/genrec-pipeline-ci-completion-20260917.json"
      - "tests/domains/hydrology/test_no_network_proof.py"
      - "Makefile"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-pipeline-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-pipelines:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            tools/ci/python-test.lock
            tools/ci/python-geo.lock
      - name: Install the repository test profile and pinned geometry wheels
        env:
          PIP_ONLY_BINARY: ":all:"
        run: |
          python tools/ci/install_python_ci.py project-test
          python tools/ci/install_python_ci.py geo-transforms
      - name: Replay the synthetic pipelines with Python and PROJ network denial
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/offline-pipelines.xml
        run: make offline-pipeline-check
      - name: Validate the current authoring receipt
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pipeline-ci-completion-20260917.json \
            --repo-root .
      - name: Retain test diagnostics only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-pipelines-python-${{ matrix.python }}-${{ github.sha }}
          path: ${{ runner.temp }}/offline-pipelines.xml
          if-no-files-found: error
          retention-days: 7
      - name: Describe the bounded result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Offline pipeline checks: ${RESULT}"
            echo "Synthetic KanPlan capture/normalization/replay, WBD candidates, Mesonet normalizer/health, and revocation-assessment adapter tests."
            echo "Python egress guard and PROJ_NETWORK=OFF apply during tests; dependency installation uses the network separately."
            echo "This is CI diagnostic evidence, not source activation, real-data processing, release, deployment or publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

# Execute existing synthetic pipelines. No provider capture, scheduling or promotion.
name: offline-pipeline-check

"on":
  pull_request:
    paths:
      - ".github/workflows/offline-pipeline-check.yml"
      - "pipelines/**"
      - "pipeline_specs/**"
      - "connectors/**"
      - "packages/**"
      - "schemas/**"
      - "fixtures/**"
      - "tools/validators/**"
      - "tools/ci/**"
      - "tests/pipelines/**"
      - "tests/packages/pipelines_core/**"
      - "tests/conftest.py"
      - "data/receipts/generated/genrec-pipeline-ci-completion-20260917.json"
      - "tests/domains/hydrology/test_no_network_proof.py"
      - "Makefile"
      - "pyproject.toml"
  push:
    branches: [main, agent/pipeline-ci-completion-20260917]
    paths:
      - ".github/workflows/offline-pipeline-check.yml"
      - "pipelines/**"
      - "pipeline_specs/**"
      - "connectors/**"
      - "packages/**"
      - "schemas/**"
      - "fixtures/**"
      - "tools/validators/**"
      - "tools/ci/**"
      - "tests/pipelines/**"
      - "tests/packages/pipelines_core/**"
      - "tests/conftest.py"
      - "data/receipts/generated/genrec-pipeline-ci-completion-20260917.json"
      - "tests/domains/hydrology/test_no_network_proof.py"
      - "Makefile"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-pipeline-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-pipelines:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            tools/ci/python-test.lock
            tools/ci/python-geo.lock
      - name: Install the repository test profile and pinned geometry wheels
        env:
          PIP_ONLY_BINARY: ":all:"
        run: |
          python tools/ci/install_python_ci.py project-test
          python tools/ci/install_python_ci.py connectors-core
          python tools/ci/install_python_ci.py geo-transforms
      - name: Build and install the pipeline core without network access
        run: |
          python -m pip wheel --no-index --no-deps --no-build-isolation \
            --wheel-dir "$RUNNER_TEMP/pipeline-wheels" packages/pipelines-core
          python -m venv "$RUNNER_TEMP/pipeline-wheel-smoke"
          "$RUNNER_TEMP/pipeline-wheel-smoke/bin/python" -m pip install \
            --no-index --no-deps --find-links "$RUNNER_TEMP/pipeline-wheels" kfm-pipelines-core
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pipeline-wheel-smoke/bin/python" -c 'from pipelines_core import Stage, run_pipeline; result = run_pipeline([Stage("copy", lambda c: c["input"])], {"fixture": True}, spec_hash="sha256:" + "a" * 64, code_ref="synthetic:wheel-smoke"); assert result["outcome"] == "SUCCESS" and result["artifacts"]["copy"] == {"fixture": True} and result["release_authorized"] is False'
      - name: Replay the synthetic pipelines with Python and PROJ network denial
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/offline-pipelines.xml
        run: make offline-pipeline-check
      - name: Replay the historical authoring receipt at its authored revision
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pipeline-ci-completion-20260917.json \
            --repo-root . \
            --artifact-git-ref d0c4e9a5108c7b0d82372a43f785ae10eeed6895
      - name: Retain test diagnostics only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-pipelines-python-${{ matrix.python }}-${{ github.sha }}
          path: ${{ runner.temp }}/offline-pipelines.xml
          if-no-files-found: error
          retention-days: 7
      - name: Describe the bounded result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Offline pipeline checks: ${RESULT}"
            echo "Synthetic KanPlan capture/normalization/replay, WBD candidates, Mesonet normalizer/health, and revocation-assessment adapter tests."
            echo "Python egress guard and PROJ_NETWORK=OFF apply during tests; dependency installation uses the network separately."
            echo "This is CI diagnostic evidence, not source activation, real-data processing, release, deployment or publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

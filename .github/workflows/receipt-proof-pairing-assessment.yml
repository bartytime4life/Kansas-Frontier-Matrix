name: receipt-proof-pairing-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/receipt-proof-pairing-assessment.yml"
      - "contracts/governance/receipt_proof_pairing_assessment.md"
      - "schemas/contracts/v1/governance/receipt_proof_pairing_assessment.schema.json"
      - "fixtures/contracts/v1/governance/receipt_proof_pairing_assessment/**"
      - "tools/validators/governance/validate_receipt_proof_pairing_assessment.py"
      - "tests/validators/governance/test_validate_receipt_proof_pairing_assessment.py"
      - "docs/intake/exploratory/pass-25-receipt-proof-pairing-source-map.md"
      - "data/receipts/generated/genrec-pass25-receipt-proof-pairing-20260811.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/receipt-proof-pairing-assessment.yml"
      - "contracts/governance/receipt_proof_pairing_assessment.md"
      - "schemas/contracts/v1/governance/receipt_proof_pairing_assessment.schema.json"
      - "fixtures/contracts/v1/governance/receipt_proof_pairing_assessment/**"
      - "tools/validators/governance/validate_receipt_proof_pairing_assessment.py"
      - "tests/validators/governance/test_validate_receipt_proof_pairing_assessment.py"
      - "docs/intake/exploratory/pass-25-receipt-proof-pairing-source-map.md"
      - "data/receipts/generated/genrec-pass25-receipt-proof-pairing-20260811.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receipt-proof-pairing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          python -m py_compile tools/validators/governance/validate_receipt_proof_pairing_assessment.py tests/validators/governance/test_validate_receipt_proof_pairing_assessment.py
          python -m unittest -v tests.validators.governance.test_validate_receipt_proof_pairing_assessment
          python tools/validators/governance/validate_receipt_proof_pairing_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/generc-pass25-receipt-proof-pairing-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Receipt/proof pairing assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only local cardinality, identity, time, resolution, and hash coherence."
            echo "- Boundary: no evidence resolution, proof authentication, policy/review decision, lifecycle transition, promotion, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

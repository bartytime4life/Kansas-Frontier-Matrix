name: gate-outcome-mapping
"on":
  pull_request:
    paths:
      - ".github/workflows/gate-outcome-mapping.yml"
      - "contracts/governance/gate_outcome_mapping.md"
      - "schemas/contracts/v1/governance/gate_outcome_mapping.schema.json"
      - "fixtures/contracts/v1/governance/gate_outcome_mapping/**"
      - "tools/validators/governance/validate_gate_outcome_mapping.py"
      - "tests/validators/test_validate_gate_outcome_mapping.py"
      - "docs/intake/exploratory/gate-outcome-mapping-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-gate-outcome-mapping-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gate-outcome-mapping.yml"
      - "contracts/governance/gate_outcome_mapping.md"
      - "schemas/contracts/v1/governance/gate_outcome_mapping.schema.json"
      - "fixtures/contracts/v1/governance/gate_outcome_mapping/**"
      - "tools/validators/governance/validate_gate_outcome_mapping.py"
      - "tests/validators/test_validate_gate_outcome_mapping.py"
      - "docs/intake/exploratory/gate-outcome-mapping-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-gate-outcome-mapping-*.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "gate-outcome-mapping-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python tools/ci/install_python_ci.py project-test
      - run: |
          python -m py_compile tools/validators/governance/validate_gate_outcome_mapping.py tests/validators/test_validate_gate_outcome_mapping.py
          python -m unittest tests.validators.test_validate_gate_outcome_mapping -v
          python tools/validators/governance/validate_gate_outcome_mapping.py --fixtures
      - run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-gate-outcome-mapping-20260809.json --repo-root .
      - if: always()
        run: echo "Fixture-only gate mapping; no policy evaluation, decision emission, promotion, answer generation, release, deployment, or publication." >> "$GITHUB_STEP_SUMMARY"

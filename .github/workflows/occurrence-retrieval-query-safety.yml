# Enforce credential- and notification-free values in synthetic occurrence queries.
#
# This companion workflow first replays the canonical occurrence-retrieval
# profile, then applies the narrow query-value safety gate. It performs no
# source request, credential lookup, source activation, evidence resolution,
# lifecycle write, release, deployment, or publication.
name: occurrence-retrieval-query-safety

"on":
  pull_request:
    paths:
      - ".github/workflows/occurrence-retrieval-query-safety.yml"
      - "contracts/source/occurrence_retrieval_snapshot.md"
      - "schemas/contracts/v1/source/occurrence_retrieval_snapshot.schema.json"
      - "fixtures/contracts/v1/source/occurrence_retrieval_snapshot/**"
      - "tools/validators/validate_occurrence_retrieval_snapshot.py"
      - "tools/validators/validate_occurrence_retrieval_query_safety.py"
      - "tests/validators/test_validate_occurrence_retrieval_snapshot.py"
      - "tests/validators/test_validate_occurrence_retrieval_query_safety.py"
      - "data/receipts/generated/genrec-occurrence-retrieval-query-safety-20260805.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/occurrence-retrieval-query-safety.yml"
      - "contracts/source/occurrence_retrieval_snapshot.md"
      - "schemas/contracts/v1/source/occurrence_retrieval_snapshot.schema.json"
      - "fixtures/contracts/v1/source/occurrence_retrieval_snapshot/**"
      - "tools/validators/validate_occurrence_retrieval_snapshot.py"
      - "tools/validators/validate_occurrence_retrieval_query_safety.py"
      - "tests/validators/test_validate_occurrence_retrieval_snapshot.py"
      - "tests/validators/test_validate_occurrence_retrieval_query_safety.py"
      - "data/receipts/generated/genrec-occurrence-retrieval-query-safety-20260805.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: occurrence-retrieval-query-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: occurrence-retrieval-query-safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install declared test dependencies
        run: python -m pip install --no-input -e ".[test]"

      - name: Revalidate canonical occurrence-retrieval profile
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/validators/test_validate_occurrence_retrieval_snapshot.py
          python tools/validators/validate_occurrence_retrieval_snapshot.py --fixtures

      - name: Run focused query-value safety tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_occurrence_retrieval_query_safety.py' \
            --verbose
          python tools/validators/validate_occurrence_retrieval_query_safety.py --fixtures

      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-occurrence-retrieval-query-safety-20260805.json
          --repo-root .

      - name: Record bounded trust result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Occurrence retrieval query-value safety

          This job composes with the canonical fixture-only occurrence retrieval
          profile and denies bounded email-address and secret-marker patterns in
          synthetic query predicate fields and values.

          A green result does not inspect real secrets, prove current source
          terms, activate eBird or GBIF, validate source bytes, resolve evidence,
          approve policy, release, deploy, publish, or permit public use.
          EOF

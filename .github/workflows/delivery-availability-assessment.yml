# Validate the fixture-only delivery-availability assessment candidate.
name: delivery-availability-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/delivery-availability-assessment.yml"
      - "contracts/source/delivery_availability_assessment.md"
      - "schemas/contracts/v1/source/delivery_availability_assessment.schema.json"
      - "fixtures/contracts/v1/source/delivery_availability_assessment/**"
      - "tools/validators/source/validate_delivery_availability_assessment.py"
      - "tests/validators/test_validate_delivery_availability_assessment.py"
      - "docs/intake/exploratory/delivery-availability-assessment-source-map.md"
      - "contracts/source/source_descriptor.md"
      - "contracts/source/source_health_assessment.md"
      - "contracts/source/source_availability_watchlist.md"
      - "contracts/source/source_polling_checkpoint.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-delivery-availability-assessment-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/delivery-availability-assessment.yml"
      - "contracts/source/delivery_availability_assessment.md"
      - "schemas/contracts/v1/source/delivery_availability_assessment.schema.json"
      - "fixtures/contracts/v1/source/delivery_availability_assessment/**"
      - "tools/validators/source/validate_delivery_availability_assessment.py"
      - "tests/validators/test_validate_delivery_availability_assessment.py"
      - "docs/intake/exploratory/delivery-availability-assessment-source-map.md"
      - "contracts/source/source_descriptor.md"
      - "contracts/source/source_health_assessment.md"
      - "contracts/source/source_availability_watchlist.md"
      - "contracts/source/source_polling_checkpoint.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-delivery-availability-assessment-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-availability-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-delivery-availability-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused and adjacent deterministic tests
        run: |
          python -m unittest -v tests.validators.test_validate_delivery_availability_assessment
          python -m pytest -q tests/source/test_source_health_assessment.py
          python tools/validators/source/validate_delivery_availability_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-delivery-availability-assessment-20260809.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### DeliveryAvailabilityAssessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only product cadence, delivery latency, availability, freshness, staleness, supersession, and evidenced outage reconciliation."
            echo "- Boundary: no live source, expectation update, policy authority, review approval, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

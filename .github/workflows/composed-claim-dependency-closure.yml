# Validate the fixture-only composed-claim dependency closure profile.
#
# Authority boundary:
# - This workflow reads synthetic repository fixtures only.
# - It performs no live EvidenceRef resolution, policy decision, lifecycle
#   mutation, promotion, release, deployment, publication, or public write.
name: composed-claim-dependency-closure

"on":
  pull_request:
    paths:
      - ".github/workflows/composed-claim-dependency-closure.yml"
      - "contracts/evidence/composed_claim_dependency_closure.md"
      - "schemas/contracts/v1/evidence/composed_claim_dependency_closure.schema.json"
      - "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/**"
      - "tools/validators/validate_composed_claim_dependency_closure.py"
      - "tests/validators/test_validate_composed_claim_dependency_closure.py"
      - "data/receipts/generated/genrec-composed-claim-dependency-closure-20260806.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/composed-claim-dependency-closure.yml"
      - "contracts/evidence/composed_claim_dependency_closure.md"
      - "schemas/contracts/v1/evidence/composed_claim_dependency_closure.schema.json"
      - "fixtures/contracts/v1/evidence/composed_claim_dependency_closure/**"
      - "tools/validators/validate_composed_claim_dependency_closure.py"
      - "tests/validators/test_validate_composed_claim_dependency_closure.py"
      - "data/receipts/generated/genrec-composed-claim-dependency-closure-20260806.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composed-claim-dependency-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: composed-claim-dependency-closure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out bounded fixture profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install declared test dependencies
        run: python -m pip install --no-input -e ".[test]"

      - name: Run focused semantic tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/validators/test_validate_composed_claim_dependency_closure.py

      - name: Replay exact fixture polarity
        run: >-
          python tools/validators/validate_composed_claim_dependency_closure.py
          --fixtures

      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-composed-claim-dependency-closure-20260806.json
          --repo-root .

      - name: Record bounded trust result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Composed-claim dependency closure status

          This job validates a synthetic dependency graph for required, optional,
          alternative, and mutually exclusive evidence roles plus deterministic
          `SUPPORTED`, `QUALIFIED`, `ABSTAIN`, `DENY`, and `ERROR` closure.

          A green result does not establish live EvidenceRef resolution,
          EvidenceBundle sufficiency, policy approval, human review, lifecycle
          mutation, release, deployment, publication, or public-use authority.
          EOF

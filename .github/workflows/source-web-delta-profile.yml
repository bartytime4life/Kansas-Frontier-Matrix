name: source-web-delta-profile

"on":
  pull_request:
    paths:
      - ".github/workflows/source-web-delta-profile.yml"
      - "contracts/source/web_delta_profile.md"
      - "contracts/source/source_event_envelope.md"
      - "schemas/contracts/v1/source/web_delta_profile.schema.json"
      - "schemas/contracts/v1/source/source_event_envelope.schema.json"
      - "fixtures/contracts/v1/source/web_delta_profile/**"
      - "tools/validators/validate_web_delta_profile.py"
      - "tools/validators/replay_web_delta_profile_fixtures.py"
      - "tools/validators/validate_source_event_envelope.py"
      - "tests/validators/test_validate_web_delta_profile.py"
      - "docs/intake/exploratory/new-ideas-12-29-25-web-delta-source-map.md"
      - "data/receipts/generated/genrec-source-web-delta-profile-20260807.json"
      - "packages/hashing/src/hashing/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/source-web-delta-profile.yml"
      - "contracts/source/web_delta_profile.md"
      - "contracts/source/source_event_envelope.md"
      - "schemas/contracts/v1/source/web_delta_profile.schema.json"
      - "schemas/contracts/v1/source/source_event_envelope.schema.json"
      - "fixtures/contracts/v1/source/web_delta_profile/**"
      - "tools/validators/validate_web_delta_profile.py"
      - "tools/validators/replay_web_delta_profile_fixtures.py"
      - "tools/validators/validate_source_event_envelope.py"
      - "tests/validators/test_validate_web_delta_profile.py"
      - "docs/intake/exploratory/new-ideas-12-29-25-web-delta-source-map.md"
      - "data/receipts/generated/genrec-source-web-delta-profile-20260807.json"
      - "packages/hashing/src/hashing/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-web-delta-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-source-web-delta-profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic no-network tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_web_delta_profile.py' \
            --verbose

      - name: Replay effective fixture outcomes and findings
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.validators.replay_web_delta_profile_fixtures

      - name: Record exact receipt artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .github/workflows/source-web-delta-profile.yml \
            contracts/source/web_delta_profile.md \
            docs/intake/exploratory/new-ideas-12-29-25-web-delta-source-map.md \
            fixtures/contracts/v1/source/web_delta_profile/cases-01.json \
            fixtures/contracts/v1/source/web_delta_profile/cases-02.json \
            fixtures/contracts/v1/source/web_delta_profile/cases-03.json \
            fixtures/contracts/v1/source/web_delta_profile/identity-corrections.json \
            schemas/contracts/v1/source/web_delta_profile.schema.json \
            tests/validators/test_validate_web_delta_profile.py \
            tools/validators/replay_web_delta_profile_fixtures.py \
            tools/validators/validate_web_delta_profile.py

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-source-web-delta-profile-20260807.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### License-respectful web delta profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only SourceEventEnvelopeCandidate profile for 200/304 state, append-only digest corrections, canonical schema references, deterministic digests, license-aware contentful/metadata-only behavior, and finite routing."
            echo "- Boundary: PASS is local profile and corrected-fixture consistency only."
            echo "- Non-effects: no network fetch, extraction, source activation, lifecycle write, evidence or policy decision, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

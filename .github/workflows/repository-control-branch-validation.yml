# Temporary validation harness for the repository-control bootstrap.
# It has read-only contents permission, no secrets, no OIDC, and no mutation or
# deployment authority. It targets an isolated non-default validation branch so
# even an unintended PR merge cannot alter main. Remove it after proof is saved.

name: repository-control-branch-validation

"on":
  push:
    branches:
      - fix/repository-control-issue-4024-binding-20260903
  pull_request:
    branches:
      - validation/repository-control-canary-base-20260903

permissions:
  contents: read

concurrency:
  group: repository-control-branch-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  focused-validation:
    name: focused-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Verify syntax and workflow parsing
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/validators/repository_control/validate_control_source_availability.py \
            tools/validators/repository_control/validate_transition_authorization.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              Path('.github/workflows/repository-control.yml'),
              Path('.github/workflows/repository-control-branch-validation.yml'),
          ):
              value = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise SystemExit(f'{path}: workflow root must be an object')
          PY

      - name: Run focused repository-control tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py \
            -q

      - name: Check bounded branch diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          python - <<'PY'
          import subprocess

          allowed = {
              '.github/workflows/repository-control.yml',
              '.github/workflows/repository-control-branch-validation.yml',
              'docs/governance/REPOSITORY_TRANSITION_CONTROL_SOURCE.md',
              'tests/validators/test_repository_control_source.py',
              'tests/validators/test_repository_transition_authorization.py',
              'tools/validators/repository_control/validate_control_source_availability.py',
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', 'origin/main...HEAD'],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected branch paths: {unexpected}')
          required = allowed - {'.github/workflows/repository-control-branch-validation.yml'}
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'missing intended branch paths: {missing}')
          print(f'validated bounded path set: {len(changed)} files including temporary harness')
          PY

      - name: Record authority boundary
        if: always()
        shell: bash
        run: |
          {
            echo '### Repository-control branch validation'
            echo
            echo '- Scope: syntax, workflow parsing, focused tests, and bounded diff only.'
            echo '- Target: isolated non-default validation branch; no main integration.'
            echo '- Permissions: read-only repository contents; no secrets or OIDC.'
            echo '- Non-effects: no ready, main merge, ruleset, release, deployment, publication, or source-state authority.'
            echo '- The temporary workflow must be removed after this run is recorded.'
          } >> "${GITHUB_STEP_SUMMARY}"

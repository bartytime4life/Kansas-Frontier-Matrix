# Deterministic, no-network source-role anti-collapse validation.
name: source-role-anti-collapse

"on":
  pull_request:
    paths:
      - ".github/workflows/source-role-anti-collapse.yml"
      - "contracts/source/source_role_use_request.md"
      - "schemas/contracts/v1/source/source_descriptor.schema.json"
      - "schemas/contracts/v1/source/source_role_use_request.schema.json"
      - "fixtures/contracts/v1/source/source_role_use_request/**"
      - "tools/validators/source_role/**"
      - "tools/validators/sources/validate_source_role.py"
      - "tests/validators/test_validate_source_role.py"
      - "docs/intake/exploratory/source-role-anti-collapse-source-map.md"
      - "data/receipts/generated/genrec-source-role-anti-collapse-20260807.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-role-anti-collapse.yml"
      - "contracts/source/source_role_use_request.md"
      - "schemas/contracts/v1/source/source_descriptor.schema.json"
      - "schemas/contracts/v1/source/source_role_use_request.schema.json"
      - "fixtures/contracts/v1/source/source_role_use_request/**"
      - "tools/validators/source_role/**"
      - "tools/validators/sources/validate_source_role.py"
      - "tests/validators/test_validate_source_role.py"
      - "docs/intake/exploratory/source-role-anti-collapse-source-map.md"
      - "data/receipts/generated/genrec-source-role-anti-collapse-20260807.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-role-anti-collapse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-source-role-anti-collapse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic tests
        run: python -m pytest -q tests/validators/test_validate_source_role.py

      - name: Replay exact finite fixture outcomes
        run: python tools/validators/source_role/validate_source_role.py --fixtures

      - name: Verify plural compatibility entrypoint
        run: python tools/validators/sources/validate_source_role.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-source-role-anti-collapse-20260807.json
          --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Source-role anti-collapse"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: SourceDescriptor-bound role/rank preservation, claim-role compatibility, finite outcomes, and public-surface leakage denial."
            echo "- Boundary: a PASS is compatibility evidence only."
            echo "- Non-effects: no role assignment, descriptor mutation, source activation, evidence, policy, review, promotion, release, publication, or public permission is created."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the deterministic 3D Tiles tree hash manifest primitive.
name: tiles3d-tree-hash-manifest

"on":
  pull_request:
    paths:
      - ".github/workflows/tiles3d-tree-hash-manifest.yml"
      - "contracts/map/tiles3d_tree_hash_manifest.md"
      - "schemas/contracts/v1/map/tiles3d_tree_hash_manifest.schema.json"
      - "tools/validators/map/tiles3d_tree_hash_manifest/**"
      - "fixtures/map/tiles3d_tree_hash_manifest/**"
      - "tests/validators/map/tiles3d_tree_hash_manifest/**"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-tiles3d-tree-hash-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tiles3d-tree-hash-manifest.yml"
      - "contracts/map/tiles3d_tree_hash_manifest.md"
      - "schemas/contracts/v1/map/tiles3d_tree_hash_manifest.schema.json"
      - "tools/validators/map/tiles3d_tree_hash_manifest/**"
      - "fixtures/map/tiles3d_tree_hash_manifest/**"
      - "tests/validators/map/tiles3d_tree_hash_manifest/**"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-tiles3d-tree-hash-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiles3d-tree-hash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
      - name: Run focused tests and deterministic fixtures
        run: |
          set -euo pipefail
          python -m unittest discover --start-directory tests/validators/map/tiles3d_tree_hash_manifest --pattern 'test_*.py' --verbose
          python tools/validators/map/tiles3d_tree_hash_manifest/build_tiles3d_tree_hash_manifest.py --fixtures
          python tools/validators/map/tiles3d_tree_hash_manifest/build_tiles3d_tree_hash_manifest.py verify fixtures/map/tiles3d_tree_hash_manifest/tree fixtures/map/tiles3d_tree_hash_manifest/expected/valid_manifest.json
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-tiles3d-tree-hash-20260808.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### 3D Tiles tree hash manifest"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: bounded sorted-path byte inventory, per-file SHA-256, deterministic tree hash, exact verification, and fixture polarity."
            echo "- Boundary: PASS is not full 3D Tiles conformance, evidence, policy, signature, promotion, release, or publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

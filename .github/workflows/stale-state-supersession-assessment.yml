name: stale-state-supersession-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/stale-state-supersession-assessment.yml"
      - "contracts/common/stale_state_supersession_assessment.md"
      - "schemas/contracts/v1/common/stale_state_supersession_assessment.schema.json"
      - "fixtures/contracts/v1/common/stale_state_supersession_assessment/**"
      - "tools/validators/governance/validate_stale_state_supersession_assessment.py"
      - "tests/validators/governance/test_validate_stale_state_supersession_assessment.py"
      - "docs/intake/exploratory/full-atlas-stale-state-supersession-assessment-source-map.md"
      - "data/receipts/generated/genrec-full-atlas-stale-state-supersession-assessment-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/stale-state-supersession-assessment.yml"
      - "contracts/common/stale_state_supersession_assessment.md"
      - "schemas/contracts/v1/common/stale_state_supersession_assessment.schema.json"
      - "fixtures/contracts/v1/common/stale_state_supersession_assessment/**"
      - "tools/validators/governance/validate_stale_state_supersession_assessment.py"
      - "tests/validators/governance/test_validate_stale_state_supersession_assessment.py"
      - "docs/intake/exploratory/full-atlas-stale-state-supersession-assessment-source-map.md"
      - "data/receipts/generated/genrec-full-atlas-stale-state-supersession-assessment-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stale-state-supersession-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-stale-state-supersession-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/governance/validate_stale_state_supersession_assessment.py tests/validators/governance/test_validate_stale_state_supersession_assessment.py
          python -m unittest tests.validators.governance.test_validate_stale_state_supersession_assessment --verbose
          python tools/validators/governance/validate_stale_state_supersession_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-full-atlas-stale-state-supersession-assessment-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Stale-state and supersession assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only subject, stale marker, lineage, proposed response, review, content-identity, and non-authority coherence."
            echo "- Boundary: no object mutation, correction issuance, cross-lane propagation decision, cache invalidation, policy or review decision, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

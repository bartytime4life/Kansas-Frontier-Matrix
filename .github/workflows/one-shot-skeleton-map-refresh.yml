# Temporary PR-locked reconstruction wrapper.
# The successful reconstruction commit deletes this file and the payload chunks.
name: one-shot-skeleton-map-refresh

"on":
  pull_request:
    paths:
      - .github/workflows/one-shot-skeleton-map-refresh.yml

permissions:
  contents: write

concurrency:
  group: one-shot-skeleton-map-refresh
  cancel-in-progress: false

jobs:
  assemble:
    if: >-
      github.repository == 'bartytime4life/Kansas-Frontier-Matrix' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/update-skeleton-map' &&
      github.actor == 'bartytime4life'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact temporary head with branch credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Decode, verify, install, and commit bounded artifacts
        shell: bash
        env:
          TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git checkout -B agent/update-skeleton-map "$TRIGGER_HEAD_SHA"
          test "$(git branch --show-current)" = "agent/update-skeleton-map"
          test -z "$(git status --porcelain)"

          chunk_dir="artifacts/tmp/skeleton-map-refresh"
          chunks=("$chunk_dir/payload.00" "$chunk_dir/payload.01")
          test -f "${chunks[0]}"
          test -f "${chunks[1]}"
          test "$(git hash-object docs/architecture/SKELETON_MAP.md)" = \
            "09440bbe7ac10e0e7b70eee10f4d50f9022f6c4f"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat "${chunks[@]}" > "$tmp/payload.tar.gz.b64"
          test "$(sha256sum "$tmp/payload.tar.gz.b64" | awk '{print $1}')" = \
            "692e4e87783d15191946f1f778b9cec10e02c0beec8071308a683da143425d2b"
          base64 --decode "$tmp/payload.tar.gz.b64" > "$tmp/payload.tar.gz"
          test "$(sha256sum "$tmp/payload.tar.gz" | awk '{print $1}')" = \
            "832a74ee4f0d655c8edf565c155c0a627260db279a3cafea747fb6e91b3dd26f"

          mapfile -t members < <(tar -tzf "$tmp/payload.tar.gz" | sort)
          test "${#members[@]}" -eq 2
          test "${members[0]}" = "SKELETON_MAP.new.md"
          test "${members[1]}" = "genrec-skeleton-map-e98e8d99.json"

          tar -xzf "$tmp/payload.tar.gz" -C "$tmp"
          test "$(sha256sum "$tmp/SKELETON_MAP.new.md" | awk '{print $1}')" = \
            "e98e8d993dfddfe68db7a08325a66142f09d4e086763430a1ca156234ea59810"
          test "$(sha256sum "$tmp/genrec-skeleton-map-e98e8d99.json" | awk '{print $1}')" = \
            "2d74c22fc3808b6468456f39ddd6de313a9e74b108d951a483139ece37bcd75b"

          install -m 0644 "$tmp/SKELETON_MAP.new.md" \
            docs/architecture/SKELETON_MAP.md
          install -m 0644 "$tmp/genrec-skeleton-map-e98e8d99.json" \
            data/receipts/generated/genrec-skeleton-map-e98e8d99.json
          rm -f "${chunks[@]}" .github/workflows/one-shot-skeleton-map-refresh.yml
          rmdir "$chunk_dir" 2>/dev/null || true

          git diff --check
          git add -A -- \
            docs/architecture/SKELETON_MAP.md \
            data/receipts/generated/genrec-skeleton-map-e98e8d99.json \
            "$chunk_dir" \
            .github/workflows/one-shot-skeleton-map-refresh.yml
          git diff --cached --check

          git config user.name "Andy"
          git config user.email "blackbart555@gmail.com"
          git commit -m "docs(architecture): materialize refreshed skeleton map"
          git push origin HEAD:agent/update-skeleton-map

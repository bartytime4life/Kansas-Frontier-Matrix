# Validate fixture-first representation fitness assessments.
name: representation-fitness-profile

"on":
  pull_request:
    paths:
      - ".github/workflows/representation-fitness-profile.yml"
      - "contracts/evidence/representation_fitness_assessment.md"
      - "schemas/contracts/v1/evidence/representation_fitness_assessment.schema.json"
      - "tools/validators/evidence/validate_representation_fitness_assessment.py"
      - "fixtures/contracts/v1/evidence/representation_fitness_assessment/**"
      - "tests/evidence/test_representation_fitness_assessment.py"
      - "data/receipts/generated/genrec-representation-fitness-profile-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/representation-fitness-profile.yml"
      - "contracts/evidence/representation_fitness_assessment.md"
      - "schemas/contracts/v1/evidence/representation_fitness_assessment.schema.json"
      - "tools/validators/evidence/validate_representation_fitness_assessment.py"
      - "fixtures/contracts/v1/evidence/representation_fitness_assessment/**"
      - "tests/evidence/test_representation_fitness_assessment.py"
      - "data/receipts/generated/genrec-representation-fitness-profile-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: representation-fitness-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-representation-fitness-profile
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Run fixture matrix
        run: python tools/validators/evidence/validate_representation_fitness_assessment.py --fixtures

      - name: Run focused tests
        run: python -m pytest tests/evidence/test_representation_fitness_assessment.py -q --strict-config --strict-markers

      - name: Validate generated authoring receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-representation-fitness-profile-20260807.json --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Representation fitness profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic fixtures and local validation only."
            echo "- Boundary: no source activation, lifecycle write, truth decision, policy approval, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

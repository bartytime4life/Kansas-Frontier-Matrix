name: release-alias-verification
"on":
  pull_request:
    paths:
      - ".github/workflows/release-alias-verification.yml"
      - "contracts/release/release_alias_verification.md"
      - "schemas/contracts/v1/release/release_alias_verification.schema.json"
      - "fixtures/contracts/v1/release/release_alias_verification/**"
      - "tools/validators/release/validate_release_alias_verification.py"
      - "tests/validators/test_validate_release_alias_verification.py"
      - "docs/intake/exploratory/release-alias-verification-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-release-alias-verification-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-alias-verification.yml"
      - "contracts/release/release_alias_verification.md"
      - "schemas/contracts/v1/release/release_alias_verification.schema.json"
      - "fixtures/contracts/v1/release/release_alias_verification/**"
      - "tools/validators/release/validate_release_alias_verification.py"
      - "tests/validators/test_validate_release_alias_verification.py"
      - "docs/intake/exploratory/release-alias-verification-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-release-alias-verification-*.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "release-alias-verification-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python tools/ci/install_python_ci.py project-test
      - run: |
          python -m py_compile tools/validators/release/validate_release_alias_verification.py tests/validators/test_validate_release_alias_verification.py
          python -m unittest tests.validators.test_validate_release_alias_verification -v
          python tools/validators/release/validate_release_alias_verification.py --fixtures
      - run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-release-alias-verification-20260809.json --repo-root .
      - if: always()
        run: echo "Fixture-only alias preflight; no alias mutation, release issue, cache invalidation, deployment, or publication." >> "$GITHUB_STEP_SUMMARY"

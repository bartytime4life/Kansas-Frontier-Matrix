# Validate the adopted Directory Rules root-registry projection.
#
# A green result proves bounded projection consistency only. It does not create
# or activate roots, authorize writes, migrate paths, approve release, deploy,
# promote, or publish.
name: directory-root-registry

"on":
  pull_request:
    paths:
      - ".github/workflows/directory-root-registry.yml"
      - "contracts/governance/root_registry.md"
      - "control_plane/root_registry.yaml"
      - "schemas/contracts/v1/governance/root_registry.schema.json"
      - "fixtures/contracts/v1/governance/root_registry/**"
      - "tools/validators/directory_governance/**"
      - "tests/validators/directory_governance/test_validate_root_registry.py"
      - "data/receipts/generated/genrec-directory-root-registry-*.json"
      - "tests/ci/test_directory_root_registry_workflow.py"
      - "tools/validators/validate_generated_receipt.py"
      - "tools/validators/_common/**"
      - "schemas/contracts/v1/receipts/generated_receipt.schema.json"
      - "tools/ci/install_python_ci.py"
      - "tools/ci/*.lock"
      - "tools/ci/python-dependency-lock-migration.json"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-topology-diagnostic-log-safety-20260911.json"
      - "tests/validators/directory_governance/test_validate_output_security_topology.py"
      - "tests/validators/directory_governance/test_validate_context_binding_topology.py"
      - "data/receipts/generated/genrec-topology-execution-context-20260911.json"
      - "data/receipts/generated/genrec-topology-indexed-context-closure-20260911.json"
  push:
    # Exact writer-branch validation while PR delivery is held under #4024.
    # Retire this extra branch filter with a successor binding after handoff.
    branches: [main, agent/topology-diagnostic-log-safety-20260911]
    paths:
      - ".github/workflows/directory-root-registry.yml"
      - "contracts/governance/root_registry.md"
      - "control_plane/root_registry.yaml"
      - "schemas/contracts/v1/governance/root_registry.schema.json"
      - "fixtures/contracts/v1/governance/root_registry/**"
      - "tools/validators/directory_governance/**"
      - "tests/validators/directory_governance/test_validate_root_registry.py"
      - "data/receipts/generated/genrec-directory-root-registry-*.json"
      - "tests/ci/test_directory_root_registry_workflow.py"
      - "tools/validators/validate_generated_receipt.py"
      - "tools/validators/_common/**"
      - "schemas/contracts/v1/receipts/generated_receipt.schema.json"
      - "tools/ci/install_python_ci.py"
      - "tools/ci/*.lock"
      - "tools/ci/python-dependency-lock-migration.json"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-topology-diagnostic-log-safety-20260911.json"
      - "tests/validators/directory_governance/test_validate_output_security_topology.py"
      - "tests/validators/directory_governance/test_validate_context_binding_topology.py"
      - "data/receipts/generated/genrec-topology-execution-context-20260911.json"
      - "data/receipts/generated/genrec-topology-indexed-context-closure-20260911.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directory-root-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-directory-root-registry:
    name: validate-directory-root-registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historical receipt replay needs an ancestor, not a second checkout.
          fetch-depth: 0

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Record tested checkout identity
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}'
          python --version
          git --version

      - name: Install declared schema and test dependencies
        run: python tools/ci/install_python_ci.py project-test

      # Execute the real module, including scanner and diagnostic regressions.
      # A path watch alone never proves collection or native execution.
      - name: Run native diagnostic regression module
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/directory_governance \
            --pattern 'test_validate_output_security_topology.py' \
            --verbose

      # Context wrapping and display safety are separate native regression suites.
      - name: Run native topology context regression module
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/directory_governance \
            --pattern 'test_validate_context_binding_topology.py' \
            --verbose

      - name: Run focused deterministic no-network tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/directory_governance \
            --pattern 'test_validate_root_registry.py' \
            --verbose

      - name: Test receipt replay workflow boundary
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/ci \
            --pattern 'test_directory_root_registry_workflow.py' \
            --verbose

      - name: Validate fixture polarity
        run: |
          set -euo pipefail
          python tools/validators/directory_governance/validate_root_registry.py --fixtures

      - name: Validate current register against current top-level roots
        run: |
          set -euo pipefail
          python tools/validators/directory_governance/validate_root_registry.py

      # Keep the August receipt immutable. Its name says "current-binding", but
      # it describes its introduction commit, not every future README/workflow.
      # The native validator requires an exact ancestor and regular Git blobs.
      - name: Replay historical root-registry authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-directory-root-registry-current-binding-20260815.json \
            --repo-root . \
            --artifact-git-ref 8d235ebc6e7e80704c0f3f93d7c04e338af6a9a1
          # Preserve the first branch-only repair receipt at its authored bytes.
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-directory-root-registry-replay-20260911.json \
            --repo-root . \
            --artifact-git-ref 392f514401030c5c06bd3498eafbfc9a2eef0fe3

          # #4479 changed the renderer/README after the diagnostic receipt; this
          # workflow correction also supersedes the native-CI artifact binding.
          # Both old receipts remain immutable and replay at the tested ancestor.
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-topology-diagnostic-log-safety-20260911.json \
            --repo-root . \
            --artifact-git-ref 360ae6b0b9eb71ca02abe05564927104d1982343
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-directory-root-registry-native-ci-20260911.json \
            --repo-root . \
            --artifact-git-ref 360ae6b0b9eb71ca02abe05564927104d1982343

          # #4485 introduced indexed context v2. Preserve v1 and the prior
          # workflow binding at their unchanged pre-v2 ancestor, never rehash them.
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-topology-execution-context-20260911.json \
            --repo-root . \
            --artifact-git-ref f9ef504b977dcb6e9601fa774bd8dad27adcf7a9
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-directory-root-registry-context-closure-20260911.json \
            --repo-root . \
            --artifact-git-ref f9ef504b977dcb6e9601fa774bd8dad27adcf7a9

      # One successor binds all five integrated current artifacts: v2 renderer,
      # context tests, README, workflow and workflow tests. No historical override.
      # A historical pass alone must never replace candidate-byte integrity.
      - name: Verify current diagnostic and workflow authoring receipts
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-topology-indexed-context-closure-20260911.json \
            --repo-root .

      - name: Verify tracked worktree stayed unchanged
        run: |
          set -euo pipefail
          git diff --exit-code HEAD

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Directory root registry"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Receipt scope: Six immutable ancestor replays plus one current five-artifact successor binding; execution result is reported above and no receipt is review approval."
            echo "- Scope: schema, adopted-doctrine digest binding, root-class invariants, canonical ordering, and top-level root coverage."
            echo "- Boundary: projection-only; no root creation, activation, write authorization, migration, release, deployment, promotion, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

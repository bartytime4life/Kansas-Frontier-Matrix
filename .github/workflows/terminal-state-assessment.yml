name: terminal-state-assessment
"on":
  pull_request:
    paths:
      - ".github/workflows/terminal-state-assessment.yml"
      - "contracts/governance/terminal_state_assessment.md"
      - "schemas/contracts/v1/governance/terminal_state_assessment.schema.json"
      - "fixtures/contracts/v1/governance/terminal_state_assessment/**"
      - "tools/validators/governance/validate_terminal_state_assessment.py"
      - "tests/validators/test_validate_terminal_state_assessment.py"
      - "docs/intake/exploratory/terminal-state-assessment-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-terminal-state-assessment-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/terminal-state-assessment.yml"
      - "contracts/governance/terminal_state_assessment.md"
      - "schemas/contracts/v1/governance/terminal_state_assessment.schema.json"
      - "fixtures/contracts/v1/governance/terminal_state_assessment/**"
      - "tools/validators/governance/validate_terminal_state_assessment.py"
      - "tests/validators/test_validate_terminal_state_assessment.py"
      - "docs/intake/exploratory/terminal-state-assessment-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-terminal-state-assessment-*.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terminal-state-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: python -m pip install -e ".[test]"
      - run: |
          python -m py_compile tools/validators/governance/validate_terminal_state_assessment.py tests/validators/test_validate_terminal_state_assessment.py
          python -m unittest tests.validators.test_validate_terminal_state_assessment -v
          python tools/validators/governance/validate_terminal_state_assessment.py --fixtures
      - run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-terminal-state-assessment-20260808.json --repo-root .
      - if: always()
        run: echo "Terminal-state assessment is fixture-only incident classification; it performs no PR or settings mutation." >> "$GITHUB_STEP_SUMMARY"

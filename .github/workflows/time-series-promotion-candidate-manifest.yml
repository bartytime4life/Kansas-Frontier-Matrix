# Validate the fixture-only time-series promotion candidate manifest.
# This workflow performs no source access, lifecycle mutation, promotion, release, or publication action.
name: time-series-promotion-candidate-manifest

"on":
  pull_request:
    paths:
      - ".github/workflows/time-series-promotion-candidate-manifest.yml"
      - "contracts/data/time_series_promotion_candidate_manifest.md"
      - "schemas/contracts/v1/data/time_series_promotion_candidate_manifest.schema.json"
      - "fixtures/contracts/v1/data/time_series_promotion_candidate_manifest/**"
      - "tools/validators/data/validate_time_series_promotion_candidate_manifest.py"
      - "tests/validators/test_validate_time_series_promotion_candidate_manifest.py"
      - "docs/intake/exploratory/pass-22-time-series-promotion-candidate-manifest-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass22-time-series-promotion-candidate-manifest-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/time-series-promotion-candidate-manifest.yml"
      - "contracts/data/time_series_promotion_candidate_manifest.md"
      - "schemas/contracts/v1/data/time_series_promotion_candidate_manifest.schema.json"
      - "fixtures/contracts/v1/data/time_series_promotion_candidate_manifest/**"
      - "tools/validators/data/validate_time_series_promotion_candidate_manifest.py"
      - "tests/validators/test_validate_time_series_promotion_candidate_manifest.py"
      - "docs/intake/exploratory/pass-22-time-series-promotion-candidate-manifest-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass22-time-series-promotion-candidate-manifest-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: time-series-promotion-candidate-manifest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-time-series-promotion-candidate-manifest:
    name: validate-time-series-promotion-candidate-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_time_series_promotion_candidate_manifest.py' \
            --verbose

      - name: Replay exact fixture polarity
        run: python tools/validators/data/validate_time_series_promotion_candidate_manifest.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass22-time-series-promotion-candidate-manifest-20260809.json

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### TimeSeriesPromotionCandidateManifest"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic candidate shape, bounded semantics, deterministic identity, and non-authority flags."
            echo "- Tests perform no station-service, network, evidence, policy, signing, registry, release, or publication operation."
            echo "- A green result does not admit observations, approve review, promote, release, deploy, publish, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"


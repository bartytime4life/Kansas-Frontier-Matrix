# Validate the PROPOSED PromotionReceipt contract and synthetic fixtures.
# This workflow is read-only and non-publishing. A pass proves bounded schema,
# finite-outcome, declared-transition, and receipt-digest consistency only.

name: promotion-receipt

"on":
  pull_request:
    paths:
      - ".github/workflows/promotion-receipt.yml"
      - "contracts/release/promotion_receipt.md"
      - "schemas/contracts/v1/release/promotion_receipt.schema.json"
      - "fixtures/release/promotion_receipt/**"
      - "tools/validators/release/validate_promotion_receipt.py"
      - "tests/release/test_promotion_receipt.py"
      - "data/receipts/generated/genrec-promotion-receipt-*.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/promotion-receipt.yml"
      - "contracts/release/promotion_receipt.md"
      - "schemas/contracts/v1/release/promotion_receipt.schema.json"
      - "fixtures/release/promotion_receipt/**"
      - "tools/validators/release/validate_promotion_receipt.py"
      - "tests/release/test_promotion_receipt.py"
      - "data/receipts/generated/genrec-promotion-receipt-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promotion-receipt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  promotion-receipt-contract:
    name: promotion-receipt-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to replay the unchanged historical receipt below.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install declared repository test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Validate PromotionReceipt fixture polarity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/release/validate_promotion_receipt.py --fixtures

      - name: Run PromotionReceipt contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -q tests.release.test_promotion_receipt

      - name: Replay superseded receipt at its bound commit
        shell: bash
        run: |
          set -euo pipefail
          # Dependabot 27676fd1 changed this workflow's setup-python pin. The
          # superseded receipt stays immutable and replays at its authoring commit.
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-promotion-receipt-current-binding-20260815.json \
            --repo-root . \
            --artifact-git-ref 58cb0da4ddb1fc167fb8ef4d28f4b5bc03b3d98c

      - name: Verify PromotionReceipt current-binding receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-promotion-receipt-current-binding-20261126.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### PromotionReceipt contract"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- A pass proves the PROPOSED shape, synthetic fixture polarity, finite-outcome consistency, declared transition prerequisites, canonical receipt digest, and current workflow-byte binding."
            echo "- It does not authenticate evidence, policy, review, attestations, or actor authority and does not emit a PromotionDecision, release manifest, operational receipt, release, deployment, publication, or public permission."
          } >> "$GITHUB_STEP_SUMMARY"

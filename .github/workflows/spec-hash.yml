# Validate the common deterministic spec-hash and structural GeoJSON digest profiles.
name: spec-hash

"on":
  pull_request:
    paths:
      - ".github/workflows/spec-hash.yml"
      - "pyproject.toml"
      - "packages/hashing/**"
      - "tools/spec_hash/**"
      - "tools/validators/validate_spec_hash.py"
      - "contracts/common/spec_hash.md"
      - "schemas/contracts/v1/common/spec_hash.schema.json"
      - "fixtures/contracts/v1/common/spec_hash/**"
      - "tests/validators/test_validate_spec_hash*.py"
      - "data/receipts/generated/genrec-spec-hash-validator-*.json"
      - "data/receipts/generated/genrec-geojson-feature-digests-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/spec-hash.yml"
      - "pyproject.toml"
      - "packages/hashing/**"
      - "tools/spec_hash/**"
      - "tools/validators/validate_spec_hash.py"
      - "contracts/common/spec_hash.md"
      - "schemas/contracts/v1/common/spec_hash.schema.json"
      - "fixtures/contracts/v1/common/spec_hash/**"
      - "tests/validators/test_validate_spec_hash*.py"
      - "data/receipts/generated/genrec-spec-hash-validator-*.json"
      - "data/receipts/generated/genrec-geojson-feature-digests-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-hash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-common-spec-hash
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to replay the unchanged historical receipt below.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/hashing/pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test-hashing-test

      - name: Run deterministic no-network tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_spec_hash*.py' \
            --verbose
          python tools/validators/validate_spec_hash.py --fixtures

      - name: Replay superseded receipt against the tree before the setup-python bump
        shell: bash
        run: |
          set -euo pipefail
          # This receipt's workflow digest was accepted only through the one-time
          # migration ledger, which Dependabot 27676fd1 made stale. Replay the receipt,
          # its artifacts and the ledger exactly as they stood at that commit's parent.
          ref=de7ec1d5aa39b9db46672189986212e5eb0a1026
          receipt=data/receipts/generated/genrec-geojson-feature-digests-ci-repair-20260807.json
          root="$RUNNER_TEMP/receipt-replay-genrec-geojson-feature-digests-ci-repair-20260807"
          rm -rf "$root"
          mkdir -p "$root"
          git show "$ref:$receipt" \
            | python -c 'import json, sys; sys.stdout.write("\0".join(json.load(sys.stdin)["artifact_paths"]))' \
            | xargs -0 git archive "$ref" -- "$receipt" tools/ci/python-dependency-lock-migration.json \
            | tar -x -C "$root"
          python tools/validators/validate_generated_receipt.py "$root/$receipt" --repo-root "$root"

      - name: Verify current generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-geojson-feature-digests-ci-repair-20261126.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Common spec-hash and GeoJSON digest validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: bounded RFC 8785 JCS + SHA-256 computation, current sha256:<hex> shape, structural GeoJSON geometry/record digests, fixture polarity, and authoring-receipt integrity."
            echo "- Boundary: GeoJSON digest equality is structural under a declared CRS/precision profile; it is not topological equivalence and creates no source, evidence, policy, review, promotion, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

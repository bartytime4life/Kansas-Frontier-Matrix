# Validate the proposed Boundary derivation provenance profile.
#
# This workflow is read-only, deterministic, synthetic, and no-network after
# installing repository-declared test dependencies. A green result proves only
# the bounded schema/fixture/validator invariants named below. It grants no
# source, evidence, policy, review, promotion, release, deployment, publication,
# legal, title, boundary, identity, or public-use authority.
name: boundary-derivation-record

"on":
  pull_request:
    paths:
      - ".github/workflows/boundary-derivation-record.yml"
      - "contracts/spatial-foundation/README.md"
      - "contracts/spatial-foundation/boundary_derivation_record.md"
      - "schemas/contracts/v1/spatial-foundation/README.md"
      - "schemas/contracts/v1/spatial-foundation/boundary_derivation_record.schema.json"
      - "fixtures/contracts/v1/spatial-foundation/boundary_derivation_record/**"
      - "tools/validators/validate_boundary_derivation_record.py"
      - "tests/validators/test_validate_boundary_derivation_record.py"
      - "data/receipts/generated/genrec-boundary-derivation-record-*.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/boundary-derivation-record.yml"
      - "contracts/spatial-foundation/README.md"
      - "contracts/spatial-foundation/boundary_derivation_record.md"
      - "schemas/contracts/v1/spatial-foundation/README.md"
      - "schemas/contracts/v1/spatial-foundation/boundary_derivation_record.schema.json"
      - "fixtures/contracts/v1/spatial-foundation/boundary_derivation_record/**"
      - "tools/validators/validate_boundary_derivation_record.py"
      - "tests/validators/test_validate_boundary_derivation_record.py"
      - "data/receipts/generated/genrec-boundary-derivation-record-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boundary-derivation-record-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-boundary-derivation-record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused no-network tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_boundary_derivation_record.py' \
            --verbose

      - name: Validate exact fixture polarity and reviewed finding codes
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_boundary_derivation_record.py --fixtures

      - name: Validate schema and fixture JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path("schemas/contracts/v1/spatial-foundation/boundary_derivation_record.schema.json")
          Draft202012Validator.check_schema(
              json.loads(schema_path.read_text(encoding="utf-8"))
          )
          files = sorted(Path("fixtures/contracts/v1/spatial-foundation/boundary_derivation_record").rglob("*.json"))
          assert files, "fixture inventory is empty"
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"CONFIRMED: parsed schema and {len(files)} fixture JSON files.")
          PY

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-boundary-derivation-record-20260805.json \
            --repo-root .

      - name: Record validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Boundary derivation provenance"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: source-role separation, survey-control closure, adjustment and residual metadata, derived-geometry lineage, analytic-use review, non-title limitations, and deterministic fixture hashing."
            echo "- Network posture: no live sources, external services, evidence stores, policy engines, release systems, or public endpoints."
            echo "- Boundary: a green result does not grant source authority, evidence closure, policy approval, human review, promotion, release, deployment, publication, or public use."
          } >> "$GITHUB_STEP_SUMMARY"

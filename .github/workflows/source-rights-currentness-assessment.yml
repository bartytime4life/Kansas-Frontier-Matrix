name: source-rights-currentness-assessment
"on":
  pull_request:
    paths:
      - ".github/workflows/source-rights-currentness-assessment.yml"
      - "contracts/source/source_rights_currentness_assessment.md"
      - "schemas/contracts/v1/source/source_rights_currentness_assessment.schema.json"
      - "fixtures/contracts/v1/source/source_rights_currentness_assessment/**"
      - "tools/validators/source/validate_source_rights_currentness_assessment.py"
      - "tests/validators/test_validate_source_rights_currentness_assessment.py"
      - "docs/intake/exploratory/source-rights-currentness-assessment-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-source-rights-currentness-assessment-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-rights-currentness-assessment.yml"
      - "contracts/source/source_rights_currentness_assessment.md"
      - "schemas/contracts/v1/source/source_rights_currentness_assessment.schema.json"
      - "fixtures/contracts/v1/source/source_rights_currentness_assessment/**"
      - "tools/validators/source/validate_source_rights_currentness_assessment.py"
      - "tests/validators/test_validate_source_rights_currentness_assessment.py"
      - "docs/intake/exploratory/source-rights-currentness-assessment-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-source-rights-currentness-assessment-*.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "source-rights-currentness-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to replay the unchanged historical receipt below.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python tools/ci/install_python_ci.py project-test
      - run: |
          python -m py_compile tools/validators/source/validate_source_rights_currentness_assessment.py tests/validators/test_validate_source_rights_currentness_assessment.py
          python -m unittest tests.validators.test_validate_source_rights_currentness_assessment -v
          python tools/validators/source/validate_source_rights_currentness_assessment.py --fixtures
      - run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-source-rights-currentness-assessment-20260809.json --repo-root . --artifact-git-ref c4e007fc7c8dbc7c289d84ac7a9dead387edee1b
      - if: always()
        run: echo "Fixture-only dated rights/currentness assessment; no source activation, fetch, RAW write, release, or publication." >> "$GITHUB_STEP_SUMMARY"

name: map-iiif-historic-overlay-readiness

"on":
  pull_request:
    paths:
      - ".github/workflows/map-iiif-historic-overlay-readiness.yml"
      - "contracts/map/iiif_historic_overlay_readiness.md"
      - "schemas/contracts/v1/map/iiif_historic_overlay_readiness.schema.json"
      - "fixtures/contracts/v1/map/iiif_historic_overlay_readiness/**"
      - "tools/validators/map/validate_iiif_historic_overlay_readiness.py"
      - "tests/map/test_iiif_historic_overlay_readiness.py"
      - "docs/intake/exploratory/iiif-historic-overlay-readiness-source-map.md"
      - "data/receipts/generated/genrec-iiif-historic-overlay-readiness-20260806.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-iiif-historic-overlay-readiness.yml"
      - "contracts/map/iiif_historic_overlay_readiness.md"
      - "schemas/contracts/v1/map/iiif_historic_overlay_readiness.schema.json"
      - "fixtures/contracts/v1/map/iiif_historic_overlay_readiness/**"
      - "tools/validators/map/validate_iiif_historic_overlay_readiness.py"
      - "tests/map/test_iiif_historic_overlay_readiness.py"
      - "docs/intake/exploratory/iiif-historic-overlay-readiness-source-map.md"
      - "data/receipts/generated/genrec-iiif-historic-overlay-readiness-20260806.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-iiif-historic-overlay-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-iiif-historic-overlay-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run focused deterministic tests
        run: python -m pytest -q tests/map/test_iiif_historic_overlay_readiness.py

      - name: Run exact fixture polarity
        run: python tools/validators/map/validate_iiif_historic_overlay_readiness.py --fixtures

      - name: Verify generated authoring receipt
        run: |
          python tools/validators/validate_generated_receipt.py             data/receipts/generated/genrec-iiif-historic-overlay-readiness-20260806.json             --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### IIIF historic-overlay readiness"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: committed fixture metadata, exact annotation-byte digest, GCP/mask coherence, rights/CARE readiness declarations, plugin allowlist declaration, and public-boundary declarations."
            echo "- Boundary: no live IIIF fetch, remote JSON-LD validation, georeference execution, policy evaluation, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

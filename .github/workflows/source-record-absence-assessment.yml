# Validate the proposed source record absence assessment profile.
name: source-record-absence-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/source-record-absence-assessment.yml"
      - "contracts/source/source_record_absence_assessment.md"
      - "docs/intake/exploratory/briefing-integration-source-record-absence-source-map.md"
      - "schemas/contracts/v1/source/source_record_absence_assessment.schema.json"
      - "fixtures/contracts/v1/source/source_record_absence_assessment/**"
      - "tools/validators/validate_source_record_absence_assessment.py"
      - "tests/validators/test_validate_source_record_absence_assessment.py"
      - "data/receipts/generated/genrec-source-record-absence-assessment-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-record-absence-assessment.yml"
      - "contracts/source/source_record_absence_assessment.md"
      - "docs/intake/exploratory/briefing-integration-source-record-absence-source-map.md"
      - "schemas/contracts/v1/source/source_record_absence_assessment.schema.json"
      - "fixtures/contracts/v1/source/source_record_absence_assessment/**"
      - "tools/validators/validate_source_record_absence_assessment.py"
      - "tests/validators/test_validate_source_record_absence_assessment.py"
      - "data/receipts/generated/genrec-source-record-absence-assessment-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-record-absence-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-source-record-absence-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema and test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run deterministic no-network test vectors
        run: |
          set -euo pipefail
          python -m unittest discover             --start-directory tests/validators             --pattern 'test_validate_source_record_absence_assessment.py'             --verbose
          python tools/validators/validate_source_record_absence_assessment.py --fixtures
      - name: Verify generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py             data/receipts/generated/genrec-source-record-absence-assessment-20260806.json             --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Source record absence assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: source-mode declaration, missing-record interpretation, deterministic identity, temporal ordering, exact fixture polarity, and false-clear prevention."
            echo "- Boundary: a green result does not prove source completeness or health, delete history, clear an advisory or event, mutate source state, resolve evidence, evaluate policy, promote, release, deploy, publish, create a public route, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"

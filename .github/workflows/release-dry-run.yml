# KFM release-dry-run readiness workflow.
#
# Responsibility:
#   Exercise five deterministic publication-denial paths over the synthetic
#   promotion packet, run the bounded A-G readiness proof, and verify rollback-
#   card readiness without assembling or writing release records.
#
# Trigger and trust boundary:
#   Pull requests, pushes to main, and explicit dispatch. Pull-request content
#   is untrusted. The workflow has read-only repository permission. Network use
#   is limited to installing dependencies declared by the root pyproject for
#   repository-owned tests; no release, signing, or deployment secret exists.
#
# Outputs and outcomes:
#   Test output and job summaries only. No candidate, decision, receipt, proof,
#   manifest, rollback card, signature, release, or published artifact is emitted.

name: release-dry-run

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  assemble-candidate:
    name: assemble-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out inspected revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up inspection Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install declared repository test dependencies
        shell: bash
        run: python -m pip install -e ".[test]"

      - name: Confirm dry-run inputs remain synthetic and no-write
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          required = [
              Path("Makefile"),
              Path("tools/release/README.md"),
              Path("tools/release/release_dry_run.py"),
              Path("tests/release/test_publication_deny_dry_run.py"),
              Path("fixtures/release/promotion_gate/valid/pass__complete_candidate.json"),
              Path("release/candidates/README.md"),
              Path("data/receipts/generated/genrec-publication-deny-dry-run-20260809.json"),
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          assert not missing, f"required release dry-run evidence is missing: {missing}"

          candidate_files = [
              path for path in Path("release/candidates").rglob("*") if path.is_file()
          ]
          candidate_payloads = [
              path.as_posix() for path in candidate_files
              if path.name not in {"README.md", ".gitkeep"}
          ]
          assert not candidate_payloads, (
              "candidate packet material has appeared; validate its identity, evidence, "
              "rights, sensitivity, policy, review, correction, and rollback support before "
              f"assembling a dry run: {candidate_payloads}"
          )

          makefile = Path("Makefile").read_text(encoding="utf-8")
          target = re.search(r"(?m)^release-dry-run:\n(?P<body>(?:\t[^\n]*\n)+)", makefile)
          assert target, "Makefile release-dry-run target is missing"
          body = target.group("body")
          assert "python tools/release/release_dry_run.py" in body
          assert "python -m unittest -q tests.release.test_publication_deny_dry_run" in body
          assert "TODO: tools/release dry-run" not in body

          print(
              f"CONFIRMED: {len(candidate_files)} candidate-lane guidance/placeholder files "
              "exist and no candidate packet payload is present."
          )
          print("CONFIRMED: the Make target invokes the bounded dry run and its no-write tests.")
          PY

      - name: Prove bounded publication-denial behavior
        shell: bash
        run: |
          set -euo pipefail
          make release-dry-run

      - name: Validate generated authoring receipt binding
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-publication-deny-dry-run-20260809.json

      - name: Record candidate assembly outcome
        if: always()
        shell: bash
        run: |
          {
            echo "### Candidate assembly"
            echo
            echo "- The bounded helper exercised evidence-missing, policy-denied, integrity-mismatch, non-public-safe rights/sensitivity, and review-absent cases over the synthetic promotion packet."
            echo "- Every case remained BLOCKED and produced finite gate findings; ABSTAIN also denies publication."
            echo "- **WORKFLOW_HOLD:** no real candidate was assembled, no live policy/evidence/reference authentication ran, and no release decision was created."
            echo "- Result: ${{ job.status }}. No candidate, manifest, receipt, proof, release record, or publication authority was created."
          } >> "$GITHUB_STEP_SUMMARY"

  promotion-gate-check:
    name: promotion-gate-check
    needs:
      - assemble-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install declared repository test dependencies
        shell: bash
        run: python -m pip install -e ".[test]"

      - name: Require non-vacuous PromotionDecision fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          schema_path = Path("schemas/contracts/v1/release/promotion_decision.schema.json")
          fixture_root = Path("fixtures/release/promotion_decision")
          valid = sorted((fixture_root / "valid").glob("*.json"))
          invalid = sorted((fixture_root / "invalid").glob("*.json"))
          assert valid, "PromotionDecision valid fixture set is empty"
          assert invalid, "PromotionDecision invalid fixture set is empty"

          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          assert schema["x-kfm"]["status"] == "PROPOSED"
          assert schema["properties"]["decision"]["enum"] == [
              "APPROVE", "DENY", "ABSTAIN"
          ]
          assert schema["additionalProperties"] is False

          print(
              f"CONFIRMED: {len(valid)} valid and {len(invalid)} invalid "
              "PromotionDecision fixtures are discoverable."
          )
          print("CONFIRMED: the PromotionDecision schema remains PROPOSED.")
          PY

      - name: Validate PromotionDecision shape fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/release/test_promotion_decision_schema.py

      - name: Prove bounded promotion-gate behavior
        shell: bash
        run: |
          set -euo pipefail
          make publish-check

      - name: Record promotion check boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Promotion gate check"
            echo
            echo "- The repository-owned PromotionDecision shape test and bounded A-G promotion-gate proof ran after non-empty fixture checks."
            echo "- PASS means only APPROVE_READY over declared synthetic closure; it never assembles or promotes a release candidate."
            echo "- Gate G checks synthetic declarations for canonical identity syntax, issuance by review time, supplied authority and valid-until intervals covering evaluation, an empty approving-review obligations list, an explicit self-declared supersession marker, scope, and hash binding."
            echo "- **WORKFLOW_HOLD:** this job does not authenticate EvidenceRefs, evaluate promotion policy, verify attestations, authenticate live actors or assignments, execute rollback, or bind another workflow result."
            echo "- Result: ${{ job.status }}. No PromotionDecision, release transition, or publication authority was emitted."
          } >> "$GITHUB_STEP_SUMMARY"

  rollback-card-presence:
    name: rollback-card-presence
    needs:
      - promotion-gate-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out inspected revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up inspection Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install declared repository test dependencies
        shell: bash
        run: python -m pip install -e ".[test]"

      - name: Validate rollback-card fixtures and readiness boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import sys

          schema_path = Path("schemas/contracts/v1/release/rollback_card.schema.json")
          contract_path = Path("contracts/release/rollback_card.md")
          root_validator = Path("tools/validators/validate_rollback_card.py")
          declared_validator = Path("tools/validators/release/validate_rollback_card.py")
          rollback_helper = Path("tools/release/rollback_apply.py")
          fixture_root = Path("fixtures/release/rollback_card")
          required = [
              schema_path,
              contract_path,
              root_validator,
              declared_validator,
              rollback_helper,
              Path("release/rollback_cards/README.md"),
              Path("release/rollback_cards/agri-county-crop-progress-2026Q2-001.json"),
              Path("release/rollback_cards/rel-atmosphere-pm25-2026-001.card.json"),
              fixture_root / "README.md",
              fixture_root / "valid/valid_prior_release_candidate.json",
              fixture_root / "valid/valid_withdrawal_candidate.json",
              fixture_root / "valid/valid_hold.json",
              fixture_root / "invalid/expected_findings_manifest.json",
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          assert not missing, f"required rollback readiness evidence is missing: {missing}"

          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          assert schema["x-kfm"] == {
              "contract_doc": "contracts/release/rollback_card.md",
              "fixtures_root": "fixtures/release/rollback_card/",
              "validator": "tools/validators/release/validate_rollback_card.py",
              "policy": "policy/release/",
              "status": "PROPOSED",
              "authority": "candidate_shape_and_local_consistency_only",
              "non_effects": [
                  "does_not_execute_rollback",
                  "does_not_authorize_release_mutation",
                  "does_not_erase_history",
                  "does_not_publish",
              ],
          }, "RollbackCard schema metadata changed; reconcile the readiness boundary"
          assert "id" in schema["required"]
          assert schema["additionalProperties"] is False
          assert Path(schema["x-kfm"]["fixtures_root"]).is_dir(), (
              "RollbackCard fixtures are missing; fixture-first validation is required"
          )
          assert Path(schema["x-kfm"]["validator"]).is_file(), (
              "the schema-declared RollbackCard validator must exist"
          )

          assert 'raise NotImplementedError("Greenfield placeholder")' in (
              root_validator.read_text(encoding="utf-8")
          ), "the root rollback-card entrypoint is no longer the confirmed placeholder shim"
          assert rollback_helper.read_text(encoding="utf-8").strip() == (
              "# Apply a signed rollback_card — greenfield placeholder"
          ), "rollback_apply.py changed; review its authority and tests before execution"

          fixture_result = subprocess.run(
              [sys.executable, declared_validator.as_posix(), "--fixtures"],
              check=False,
              capture_output=True,
              text=True,
          )
          assert fixture_result.returncode == 0, fixture_result.stdout + fixture_result.stderr
          assert '"outcome":"PASS"' in fixture_result.stdout
          assert "FIXTURE_POLARITY_ERROR" not in fixture_result.stdout

          root_cards = sorted(Path("release/rollback_cards").glob("*.json"))
          assert [path.name for path in root_cards] == [
              "agri-county-crop-progress-2026Q2-001.json",
              "rel-atmosphere-pm25-2026-001.card.json",
          ], (
              "root rollback-card JSON inventory changed; validate every new record's target, "
              "invalidation, correction, review, signature, and restoration posture"
          )
          for path in root_cards:
              card = json.loads(path.read_text(encoding="utf-8"))
              assert card == {
                  "status": "PROPOSED",
                  "path": path.as_posix(),
                  "source_docs": [
                      "docs/domains/agriculture/RELEASE_INDEX.md"
                      if path.name.startswith("agri-")
                      else "docs/domains/atmosphere/RELEASE_INDEX.md"
                  ],
                  "notes": [
                      "Placeholder created from the current docs/domains markdown inventory."
                  ],
              }, f"rollback-card placeholder changed: {path}"
              assert "id" not in card, (
                  f"{path} unexpectedly looks schema-admissible; review whether it has crossed "
                  "from documentation inventory into governed rollback authority"
              )

          print("CONFIRMED: RollbackCard schema remains PROPOSED while pointing to a bounded local validator and fixture lane.")
          print("CONFIRMED: rollback-card valid/invalid fixtures passed the implemented bounded validator profile.")
          print("CONFIRMED: two root JSON cards remain PROPOSED documentation placeholders without id.")
          print("WORKFLOW_SKIPPED_EXPLICIT: no rollback helper was executed.")
          print("No rollback, release mutation, or publication authority was created.")
          PY

      - name: Record rollback-card outcome
        if: always()
        shell: bash
        run: |
          {
            echo "### Rollback-card presence"
            echo
            echo "- RollbackCard remains PROPOSED while declaring a bounded local validator and fixture lane; this job proves the implemented fixture profile still passes without executing rollback."
            echo "- The root validator entrypoint and rollback helper remain placeholders, so no rollback execution or release mutation authority is created here."
            echo "- The two root JSON cards remain PROPOSED documentation-inventory placeholders without the schema-required id; they are inventory evidence, not executable rollback authority."
            echo "- Result: ${{ job.status }}. No rollback, mutation, release decision, or publication authority was created."
            echo "- **NEEDS VERIFICATION:** documentation that describes this workflow or release tooling as TODO-only must be reconciled separately."
          } >> "$GITHUB_STEP_SUMMARY"

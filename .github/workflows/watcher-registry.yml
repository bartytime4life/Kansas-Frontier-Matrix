# Validate the fixture-first governed watcher registry.
name: watcher-registry

"on":
  pull_request:
    paths:
      - ".github/workflows/watcher-registry.yml"
      - "contracts/source/watcher_registry.md"
      - "control_plane/watcher_registry.json"
      - "schemas/contracts/v1/source/watcher_registry.schema.json"
      - "fixtures/contracts/v1/source/watcher_registry/**"
      - "tools/validators/validate_watcher_registry.py"
      - "tests/validators/test_validate_watcher_registry.py"
      - "pipeline_specs/watchers/**"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-watcher-registry-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/watcher-registry.yml"
      - "contracts/source/watcher_registry.md"
      - "control_plane/watcher_registry.json"
      - "schemas/contracts/v1/source/watcher_registry.schema.json"
      - "fixtures/contracts/v1/source/watcher_registry/**"
      - "tools/validators/validate_watcher_registry.py"
      - "tests/validators/test_validate_watcher_registry.py"
      - "pipeline_specs/watchers/**"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-watcher-registry-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watcher-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
      - name: Validate registry and fixtures
        run: |
          set -euo pipefail
          python -m unittest discover --start-directory tests/validators --pattern 'test_validate_watcher_registry.py' --verbose
          python tools/validators/validate_watcher_registry.py control_plane/watcher_registry.json
          python tools/validators/validate_watcher_registry.py --fixtures
      - name: Validate current registry-extension receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-watcher-registry-soil-extension-20260808.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Watcher registry"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed schema, canonical identity/order, exact declarative-spec byte binding, and fixture polarity."
            echo "- Boundary: registry presence and PASS do not activate, execute, admit, promote, release, publish, or notify."
          } >> "$GITHUB_STEP_SUMMARY"

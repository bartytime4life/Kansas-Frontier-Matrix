# Validate the proposed KFM STAC Item catalog-health profile.
#
# This workflow is read-only, deterministic, synthetic, and no-network after
# installing repository-declared test dependencies. A green result proves only
# bounded record-local health; it creates no evidence, policy, review, release,
# publication, or public-use authority.
name: catalog-health

"on":
  pull_request:
    paths:
      - ".github/workflows/catalog-health.yml"
      - "contracts/data/catalog_health_report.md"
      - "schemas/contracts/v1/data/catalog_health_report.schema.json"
      - "fixtures/data/catalog_health/**"
      - "tools/validators/catalog/README.md"
      - "tools/validators/catalog/catalog_health_core.py"
      - "tools/validators/catalog/catalog_health_rules.py"
      - "tools/validators/catalog/validate_catalog_health.py"
      - "tests/validators/test_validate_catalog_health.py"
      - "data/receipts/generated/genrec-catalog-health-20260807.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-health.yml"
      - "contracts/data/catalog_health_report.md"
      - "schemas/contracts/v1/data/catalog_health_report.schema.json"
      - "fixtures/data/catalog_health/**"
      - "tools/validators/catalog/README.md"
      - "tools/validators/catalog/catalog_health_core.py"
      - "tools/validators/catalog/catalog_health_rules.py"
      - "tools/validators/catalog/validate_catalog_health.py"
      - "tests/validators/test_validate_catalog_health.py"
      - "data/receipts/generated/genrec-catalog-health-20260807.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-catalog-health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused no-network tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_catalog_health.py' \
            --verbose

      - name: Replay finite fixture outcomes and exact findings
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/catalog/validate_catalog_health.py --fixtures

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-catalog-health-20260807.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Catalog health"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: one proposed KFM STAC Item profile, provenance-link presence, asset descriptors, local byte integrity, embargoed-access metadata, and network-denied remote HOLD behavior."
            echo "- Boundary: PASS is record-local health evidence only."
            echo "- Non-effects: no EvidenceBundle, policy decision, review approval, promotion, release, publication, public-use authority, or live-source activation is created."
          } >> "$GITHUB_STEP_SUMMARY"

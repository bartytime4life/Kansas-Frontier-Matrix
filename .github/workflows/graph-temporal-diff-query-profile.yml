# Validate the fixture-only graph temporal-diff query declaration profile.
# This workflow performs no graph access, query, migration, release, or publication action.
name: graph-temporal-diff-query-profile

"on":
  pull_request:
    paths:
      - ".github/workflows/graph-temporal-diff-query-profile.yml"
      - "contracts/governance/graph_temporal_diff_query_profile.md"
      - "schemas/contracts/v1/governance/graph_temporal_diff_query_profile.schema.json"
      - "fixtures/contracts/v1/governance/graph_temporal_diff_query_profile/**"
      - "tools/validators/governance/validate_graph_temporal_diff_query_profile.py"
      - "tests/validators/governance/test_graph_temporal_diff_query_profile.py"
      - "docs/intake/exploratory/pass-30-graph-temporal-diff-query-profile-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-graph-temporal-diff-query-profile-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/graph-temporal-diff-query-profile.yml"
      - "contracts/governance/graph_temporal_diff_query_profile.md"
      - "schemas/contracts/v1/governance/graph_temporal_diff_query_profile.schema.json"
      - "fixtures/contracts/v1/governance/graph_temporal_diff_query_profile/**"
      - "tools/validators/governance/validate_graph_temporal_diff_query_profile.py"
      - "tests/validators/governance/test_graph_temporal_diff_query_profile.py"
      - "docs/intake/exploratory/pass-30-graph-temporal-diff-query-profile-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-graph-temporal-diff-query-profile-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph-temporal-diff-query-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-graph-temporal-diff-query-profile:
    name: validate-graph-temporal-diff-query-profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators/governance \
            --pattern 'test_graph_temporal_diff_query_profile.py' \
            --verbose

      - name: Replay exact fixture polarity
        run: python tools/validators/governance/validate_graph_temporal_diff_query_profile.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass30-graph-temporal-diff-query-profile-20260809.json

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### GraphTemporalDiffQueryProfileCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic query declaration shape, conservative read-only checks, exact fixture polarity, and deterministic identity."
            echo "- Tests perform no graph access, query, migration, policy, review, release, or publication operation."
            echo "- A green result does not prove Cypher runtime safety, execute a comparison, approve a migration, release, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

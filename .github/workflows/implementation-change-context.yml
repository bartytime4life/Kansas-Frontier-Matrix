name: implementation-change-context

"on":
  pull_request:
    paths:
      - ".github/workflows/implementation-change-context.yml"
      - "contracts/governance/implementation_change_context.md"
      - "schemas/contracts/v1/governance/implementation_change_context.schema.json"
      - "fixtures/contracts/v1/governance/implementation_change_context/**"
      - "tools/validators/governance/validate_implementation_change_context.py"
      - "tools/validators/governance/implementation_change_context_model.py"
      - "tools/validators/governance/implementation_change_context_git.py"
      - "tools/validators/governance/README.md"
      - "tests/validators/governance/test_implementation_change_context.py"
      - "docs/intake/exploratory/fluencyloop-change-context-source-map.md"
      - "data/receipts/generated/genrec-implementation-change-context-20260806.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/implementation-change-context.yml"
      - "contracts/governance/implementation_change_context.md"
      - "schemas/contracts/v1/governance/implementation_change_context.schema.json"
      - "fixtures/contracts/v1/governance/implementation_change_context/**"
      - "tools/validators/governance/validate_implementation_change_context.py"
      - "tools/validators/governance/implementation_change_context_model.py"
      - "tools/validators/governance/implementation_change_context_git.py"
      - "tools/validators/governance/README.md"
      - "tests/validators/governance/test_implementation_change_context.py"
      - "docs/intake/exploratory/fluencyloop-change-context-source-map.md"
      - "data/receipts/generated/genrec-implementation-change-context-20260806.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: implementation-change-context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-implementation-change-context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run focused deterministic tests
        run: >-
          python -m pytest -q
          tests/validators/governance/test_implementation_change_context.py

      - name: Run exact fixture polarity
        run: >-
          python
          tools/validators/governance/validate_implementation_change_context.py
          --cases

      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-implementation-change-context-20260806.json
          --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Implementation change context"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: local committed Git path/status/count metadata, deterministic summary, and fixture validation only."
            echo "- Boundary: no raw diff or file content is emitted; no evidence, policy, review approval, repository mutation, promotion, release, deployment, publication, or public-use authority is created."
          } >> "$GITHUB_STEP_SUMMARY"

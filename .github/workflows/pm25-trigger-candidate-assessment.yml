name: pm25-trigger-candidate-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/pm25-trigger-candidate-assessment.yml"
      - ".github/workflows/domain-atmosphere.yml"
      - "contracts/domains/atmosphere/pm25_trigger_candidate_assessment.md"
      - "schemas/contracts/v1/domains/atmosphere/pm25_trigger_candidate_assessment.schema.json"
      - "fixtures/contracts/v1/domains/atmosphere/pm25_trigger_candidate_assessment/**"
      - "tools/validators/domains/atmosphere/validate_pm25_trigger_candidate_assessment.py"
      - "tests/domains/atmosphere/test_pm25_trigger_candidate_assessment.py"
      - "docs/intake/exploratory/pass-32-pm25-trigger-candidate-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass32-pm25-trigger-candidate-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pm25-trigger-candidate-assessment.yml"
      - ".github/workflows/domain-atmosphere.yml"
      - "contracts/domains/atmosphere/pm25_trigger_candidate_assessment.md"
      - "schemas/contracts/v1/domains/atmosphere/pm25_trigger_candidate_assessment.schema.json"
      - "fixtures/contracts/v1/domains/atmosphere/pm25_trigger_candidate_assessment/**"
      - "tools/validators/domains/atmosphere/validate_pm25_trigger_candidate_assessment.py"
      - "tests/domains/atmosphere/test_pm25_trigger_candidate_assessment.py"
      - "docs/intake/exploratory/pass-32-pm25-trigger-candidate-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass32-pm25-trigger-candidate-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm25-trigger-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: python -m pytest -q tests/domains/atmosphere/test_pm25_trigger_candidate_assessment.py
      - name: Verify generated receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass32-pm25-trigger-candidate-20260809.json --repo-root .
      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### PM2.5 trigger candidate assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic categorical candidate/hold validation only."
            echo "- Boundary: no live source, numeric threshold, AQI, health advice, regulatory decision, detector mutation, policy, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

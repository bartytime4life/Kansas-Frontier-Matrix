name: station-spatial-assignment-assessment
"on":
  pull_request:
    paths:
      - ".github/workflows/station-spatial-assignment-assessment.yml"
      - "contracts/common/station_spatial_assignment_assessment.md"
      - "schemas/contracts/v1/common/station_spatial_assignment_assessment.schema.json"
      - "fixtures/contracts/v1/common/station_spatial_assignment_assessment/**"
      - "tools/validators/common/validate_station_spatial_assignment_assessment.py"
      - "tests/validators/common/test_validate_station_spatial_assignment_assessment.py"
      - "docs/intake/exploratory/pass-25-station-spatial-assignment-source-map.md"
      - "data/receipts/generated/genrec-pass25-station-spatial-assignment-20260811.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/station-spatial-assignment-assessment.yml"
      - "contracts/common/station_spatial_assignment_assessment.md"
      - "schemas/contracts/v1/common/station_spatial_assignment_assessment.schema.json"
      - "fixtures/contracts/v1/common/station_spatial_assignment_assessment/**"
      - "tools/validators/common/validate_station_spatial_assignment_assessment.py"
      - "tests/validators/common/test_validate_station_spatial_assignment_assessment.py"
      - "docs/intake/exploratory/pass-25-station-spatial-assignment-source-map.md"
      - "data/receipts/generated/genrec-pass25-station-spatial-assignment-20260811.json"
      - "pyproject.toml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: station-spatial-assignment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          python -m py_compile tools/validators/common/validate_station_spatial_assignment_assessment.py tests/validators/common/test_validate_station_spatial_assignment_assessment.py
          python -m unittest -v tests.validators.common.test_validate_station_spatial_assignment_assessment
          python tools/validators/common/validate_station_spatial_assignment_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass25-station-spatial-assignment-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Station spatial assignment assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic EPSG:4326 point and simple state/county/HUC12 polygon rings."
            echo "- Boundary: no live boundary access, source activation, canonical geography write, location publication, lifecycle transition, promotion, release, publication, or public use."
          } >> "$GITHUB_STEP_SUMMARY"

name: nws-alerts-offline
on:
  pull_request:
    paths:
      - 'connectors/noaa/src/noaa/nws_alerts.py'
      - 'connectors/noaa/tests/test_nws_alerts.py'
      - '.github/workflows/nws-alerts-offline.yml'
  push:
    branches: [main]
    paths:
      - 'connectors/noaa/src/noaa/nws_alerts.py'
      - 'connectors/noaa/tests/test_nws_alerts.py'
      - '.github/workflows/nws-alerts-offline.yml'
permissions:
  contents: read
concurrency:
  group: nws-alerts-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The interpreters tools/ci/python-test.lock declares; the stdlib json decoder's
        # depth behavior (and so parser routing) differs between them.
        python: ['3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Run standard-library-only synthetic tests
        run: python -m unittest discover -s connectors/noaa/tests -p 'test_nws_alerts.py' -v
      - name: Record evidence boundary
        if: always()
        run: |
          echo 'Offline synthetic NWS alert-collection parser checks only. KFM is not an alerting system. No provider fetch, source activation, alert relay, notification, life-safety determination, source admission, capture completeness, active Site integration, release, or deployment proof.' >> "$GITHUB_STEP_SUMMARY"

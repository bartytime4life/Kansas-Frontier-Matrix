# Validate the fixture-only CountyYearPanel candidate.
name: county-year-panel

"on":
  pull_request:
    paths:
      - ".github/workflows/county-year-panel.yml"
      - "contracts/data/county_year_panel.md"
      - "schemas/contracts/v1/data/county_year_panel.schema.json"
      - "fixtures/contracts/v1/data/county_year_panel/**"
      - "tools/validators/data/validate_county_year_panel.py"
      - "tests/data/test_county_year_panel.py"
      - "docs/intake/exploratory/pass-20-county-year-panel-source-map.md"
      - "contracts/common/geography_version.md"
      - "contracts/evidence/frontier_definition.md"
      - "contracts/evidence/indicator_definition.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass20-county-year-panel-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/county-year-panel.yml"
      - "contracts/data/county_year_panel.md"
      - "schemas/contracts/v1/data/county_year_panel.schema.json"
      - "fixtures/contracts/v1/data/county_year_panel/**"
      - "tools/validators/data/validate_county_year_panel.py"
      - "tests/data/test_county_year_panel.py"
      - "docs/intake/exploratory/pass-20-county-year-panel-source-map.md"
      - "contracts/common/geography_version.md"
      - "contracts/evidence/frontier_definition.md"
      - "contracts/evidence/indicator_definition.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass20-county-year-panel-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: county-year-panel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-county-year-panel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused and adjacent deterministic tests
        run: |
          python -m unittest -v tests.data.test_county_year_panel
          python -m unittest -v tests.validators.test_validate_geography_version
          python -m unittest -v tests.validators.evidence.test_validate_frontier_definition
          python -m unittest -v tests.validators.evidence.test_validate_indicator_definition
          python tools/validators/data/validate_county_year_panel.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass20-county-year-panel-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### CountyYearPanel"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only county/year, definition-reference, four-slot observation, availability, geography-alignment, uncertainty-reference, disclosure, summary, and identity validation."
            echo "- Boundary: no source access, observation loading, value calculation, aggregation, geography or crosswalk resolution, evidence resolution, frontier classification, policy evaluation, review approval, promotion, release, public use, publication, or deployment authority."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the fixture-only STAC attestation hook.
name: stac-attestation-hook

"on":
  pull_request:
    paths:
      - ".github/workflows/stac-attestation-hook.yml"
      - "contracts/data/stac_attestation_hook.md"
      - "schemas/contracts/v1/data/stac_attestation_hook.schema.json"
      - "fixtures/data/stac_attestation_hook/**"
      - "tools/validators/data/validate_stac_attestation_hook.py"
      - "tests/validators/test_validate_stac_attestation_hook.py"
      - "data/receipts/generated/genrec-pass7-stac-attestation-hook-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/stac-attestation-hook.yml"
      - "contracts/data/stac_attestation_hook.md"
      - "schemas/contracts/v1/data/stac_attestation_hook.schema.json"
      - "fixtures/data/stac_attestation_hook/**"
      - "tools/validators/data/validate_stac_attestation_hook.py"
      - "tests/validators/test_validate_stac_attestation_hook.py"
      - "data/receipts/generated/genrec-pass7-stac-attestation-hook-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stac-attestation-hook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run deterministic no-network validation
        run: |
          set -euo pipefail
          python -m unittest tests.validators.test_validate_stac_attestation_hook --verbose
          python tools/validators/data/validate_stac_attestation_hook.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py             data/receipts/generated/genrec-pass7-stac-attestation-hook-20260808.json             --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### STAC attestation hook"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: explicit attestation relation, target/hash/media-type coherence, canonical links, finite outcomes, and deterministic identity."
            echo "- Boundary: no STAC host or EvidenceBundle is fetched and no evidence, policy, review, catalog, promotion, release, publication, or public-use authority is created."
          } >> "$GITHUB_STEP_SUMMARY"

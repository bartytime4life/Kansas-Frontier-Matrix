# Validate the proposed runtime-verification receipt/proof contract family.
#
# This workflow is deterministic, fixture-first, and no-network after installing
# repository-declared test dependencies. A green result proves bounded shape,
# local receipt/proof separation, digest semantics, and fixture polarity only.
# It does not verify a live artifact or authorize evidence, policy, release,
# deployment, promotion, or publication.
name: runtime-verification-contract

"on":
  pull_request:
    paths:
      - ".github/workflows/runtime-verification-contract.yml"
      - "contracts/runtime/runtime_verification.md"
      - "schemas/contracts/v1/runtime/runtime_verification/**"
      - "fixtures/contracts/v1/runtime/runtime_verification/**"
      - "tools/validators/runtime_verification/**"
      - "tests/validators/test_validate_runtime_verification.py"
      - "data/receipts/generated/genrec-runtime-verification-contract-*.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/runtime-verification-contract.yml"
      - "contracts/runtime/runtime_verification.md"
      - "schemas/contracts/v1/runtime/runtime_verification/**"
      - "fixtures/contracts/v1/runtime/runtime_verification/**"
      - "tools/validators/runtime_verification/**"
      - "tests/validators/test_validate_runtime_verification.py"
      - "data/receipts/generated/genrec-runtime-verification-contract-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-verification-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-runtime-verification-contract:
    name: validate-runtime-verification-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        shell: bash
        run: python -m pip install -e ".[test]"

      - name: Run focused no-network validator tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_runtime_verification.py' \
            --verbose

      - name: Validate exact fixture polarity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/runtime_verification/validate_runtime_verification.py \
            --fixtures

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-runtime-verification-contract-20260806.json \
            --repo-root .

      - name: Record validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Runtime verification contract"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: static receipt/proof schemas, finite outcomes, digest decoding, declaration binding, exact negative cases, and non-echoing diagnostics."
            echo "- Network posture: no live artifact, source, runtime worker, evidence service, policy engine, registry, release, deployment, or publication access."
            echo "- Boundary: a green result does not prove bytes were fetched or verified and does not authorize promotion, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

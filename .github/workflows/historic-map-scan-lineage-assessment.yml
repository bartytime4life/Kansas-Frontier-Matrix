# Validate the fixture-only historic-map scan-lineage assessment candidate.
name: historic-map-scan-lineage-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/historic-map-scan-lineage-assessment.yml"
      - "contracts/evidence/historic_map_scan_lineage_assessment.md"
      - "schemas/contracts/v1/evidence/historic_map_scan_lineage_assessment.schema.json"
      - "fixtures/contracts/v1/evidence/historic_map_scan_lineage_assessment/**"
      - "tools/validators/evidence/validate_historic_map_scan_lineage_assessment.py"
      - "tests/validators/evidence/test_validate_historic_map_scan_lineage_assessment.py"
      - "docs/intake/exploratory/pass-18-historic-map-scan-lineage-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass18-historic-map-scan-lineage-20260811.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/historic-map-scan-lineage-assessment.yml"
      - "contracts/evidence/historic_map_scan_lineage_assessment.md"
      - "schemas/contracts/v1/evidence/historic_map_scan_lineage_assessment.schema.json"
      - "fixtures/contracts/v1/evidence/historic_map_scan_lineage_assessment/**"
      - "tools/validators/evidence/validate_historic_map_scan_lineage_assessment.py"
      - "tests/validators/evidence/test_validate_historic_map_scan_lineage_assessment.py"
      - "docs/intake/exploratory/pass-18-historic-map-scan-lineage-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass18-historic-map-scan-lineage-20260811.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historic-map-scan-lineage-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-historic-map-scan-lineage-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests and fixture replay
        run: |
          python -m unittest -v tests.validators.evidence.test_validate_historic_map_scan_lineage_assessment
          python tools/validators/evidence/validate_historic_map_scan_lineage_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass18-historic-map-scan-lineage-20260811.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### HistoricMapScanLineageAssessmentCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only original-map, scan, georeference, evidence-reference, and derivative-use declarations."
            echo "- Boundary: no source activation, byte access, rights decision, georeference execution, evidence admission, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

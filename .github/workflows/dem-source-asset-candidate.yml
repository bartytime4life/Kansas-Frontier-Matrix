name: DEM Source Asset Candidate

"on":
  pull_request:
    paths:
      - ".github/workflows/dem-source-asset-candidate.yml"
      - "contracts/spatial-foundation/dem_source_asset_candidate.md"
      - "schemas/contracts/v1/spatial-foundation/dem_source_asset_candidate.schema.json"
      - "fixtures/contracts/v1/spatial-foundation/dem_source_asset_candidate/**"
      - "tools/validators/validate_dem_source_asset_candidate.py"
      - "tests/validators/test_validate_dem_source_asset_candidate.py"
      - "packages/hashing/**"
      - "packages/maplibre/src/index.ts"
      - "packages/maplibre/src/map-runtime-terrain-fallback.ts"
      - "packages/maplibre/src/terrain-elevation-sample.ts"
      - "packages/maplibre/tests/map-runtime-terrain-fallback.test.ts"
      - "packages/maplibre/tests/terrain-elevation-sample.test.ts"
      - "tests/maplibre/test_package_exports.py"
      - "apps/explorer-web/src/features/living_atlas/connections.ts"
      - "apps/explorer-web/src/site/mount-terrain-source-ledger.ts"
      - "apps/explorer-web/src/site/terrain-source-registry.ts"
      - "apps/explorer-web/tests/living-atlas.test.ts"
      - "apps/explorer-web/tests/terrain-source-registry.test.ts"
      - "data/receipts/generated/genrec-dem-source-asset-candidate-20260909.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/dem-source-asset-candidate.yml"
      - "contracts/spatial-foundation/dem_source_asset_candidate.md"
      - "schemas/contracts/v1/spatial-foundation/dem_source_asset_candidate.schema.json"
      - "fixtures/contracts/v1/spatial-foundation/dem_source_asset_candidate/**"
      - "tools/validators/validate_dem_source_asset_candidate.py"
      - "tests/validators/test_validate_dem_source_asset_candidate.py"
      - "packages/hashing/**"
      - "packages/maplibre/src/index.ts"
      - "packages/maplibre/src/map-runtime-terrain-fallback.ts"
      - "packages/maplibre/src/terrain-elevation-sample.ts"
      - "packages/maplibre/tests/map-runtime-terrain-fallback.test.ts"
      - "packages/maplibre/tests/terrain-elevation-sample.test.ts"
      - "tests/maplibre/test_package_exports.py"
      - "apps/explorer-web/src/features/living_atlas/connections.ts"
      - "apps/explorer-web/src/site/mount-terrain-source-ledger.ts"
      - "apps/explorer-web/src/site/terrain-source-registry.ts"
      - "apps/explorer-web/tests/living-atlas.test.ts"
      - "apps/explorer-web/tests/terrain-source-registry.test.ts"
      - "data/receipts/generated/genrec-dem-source-asset-candidate-20260909.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dem-source-asset-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out candidate packet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deterministic Python test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Validate exact inactive DEM candidate
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/ci/kfm_no_network:${{ github.workspace }}
        run: python -m pytest -q tests/validators/test_validate_dem_source_asset_candidate.py

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install locked MapLibre package dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --filter @kfm/maplibre... --filter explorer-web...

      - name: Verify fixture-only terrain sampling
        run: pnpm --filter @kfm/maplibre test

      - name: Verify Living Atlas held readback
        run: >-
          pnpm --filter explorer-web exec vitest run
          tests/living-atlas.test.ts
          tests/terrain-source-registry.test.ts

      - name: Type-check held Explorer integration
        run: pnpm --filter explorer-web exec tsc --noEmit -p tsconfig.json

      - name: Verify renderer-neutral package exports
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/ci/kfm_no_network:${{ github.workspace }}
        run: python -m pytest -q tests/maplibre/test_package_exports.py

      - name: Replay immutable authoring receipt at the PR 4452 merge
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/ci/kfm_no_network:${{ github.workspace }}
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-dem-source-asset-candidate-20260909.json
          --repo-root .
          --artifact-git-ref 0d0dbf355370fa7271feabba8f5b6c9f35fdb3a8

      - name: Record authority boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Exact DEM source asset candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: one hash-bound USGS 3DEP tile, authoritative metadata, closed fixture validation, and pure offline numeric sampling."
            echo "- Receipt boundary: the immutable authoring receipt is replayed against PR #4452 merge commit 0d0dbf355370fa7271feabba8f5b6c9f35fdb3a8."
            echo "- Disposition: HOLD pending delivered-tile geoid, applicable vertical accuracy, and human review."
            echo "- Boundary: no source descriptor, activation, admission, remote raster request, runtime terrain, EvidenceBundle, lifecycle write, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

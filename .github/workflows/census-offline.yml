name: census-offline
on:
  pull_request:
    paths:
      - 'connectors/census/src/census/tiger_package.py'
      - 'connectors/census/src/census/acs_api.py'
      - 'connectors/census/tests/test_tiger_package.py'
      - 'connectors/census/tests/test_acs_api.py'
      - 'connectors/census/src/census/fetch.py'
      - 'connectors/census/src/census/admit.py'
      - 'connectors/census/src/census/descriptor.yaml'
      - 'connectors/census/tests/test_fetch_admit.py'
      - 'packages/connectors-core/src/connectors_core/**'
      - 'connectors/census/tiger-line-2025-kansas-core.source-reference.json'
      - '.github/workflows/census-offline.yml'
  push:
    branches: [main]
    paths:
      - 'connectors/census/src/census/tiger_package.py'
      - 'connectors/census/src/census/acs_api.py'
      - 'connectors/census/tests/test_tiger_package.py'
      - 'connectors/census/tests/test_acs_api.py'
      - 'connectors/census/src/census/fetch.py'
      - 'connectors/census/src/census/admit.py'
      - 'connectors/census/src/census/descriptor.yaml'
      - 'connectors/census/tests/test_fetch_admit.py'
      - 'packages/connectors-core/src/connectors_core/**'
      - 'connectors/census/tiger-line-2025-kansas-core.source-reference.json'
      - '.github/workflows/census-offline.yml'
permissions:
  contents: read
concurrency:
  group: census-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KFM_NO_NETWORK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Run standard-library synthetic tests (connectors-core imported from source)
        run: python -m unittest discover -s connectors/census/tests -p 'test_*.py' -v
      - name: Record evidence boundary
        if: always()
        run: |
          echo 'Offline synthetic TIGER/Line package inspection, ACS API parser, injected-transport retrieval-episode, and routing checks only; routes stay HOLD while descriptor role/rights are unresolved. No Census fetch, source activation, feature-class approval, disclosure review, source admission, capture completeness, active Site integration, release, or deployment proof.' >> "$GITHUB_STEP_SUMMARY"

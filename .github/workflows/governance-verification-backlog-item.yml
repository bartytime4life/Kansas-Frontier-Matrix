# Validate the fixture-only VerificationBacklogItem profile.
# This workflow performs no live research, source activation, governance decision,
# repository mutation, promotion, release, deployment, or publication.
name: governance-verification-backlog-item

"on":
  pull_request:
    paths:
      - ".github/workflows/governance-verification-backlog-item.yml"
      - "contracts/governance/verification_backlog_item.md"
      - "schemas/contracts/v1/governance/verification_backlog_item.schema.json"
      - "fixtures/contracts/v1/governance/verification_backlog_item/**"
      - "tools/validators/governance/_verification_backlog_item_*.py"
      - "tools/validators/governance/validate_verification_backlog_item.py"
      - "tools/validators/governance/README.md"
      - "tests/validators/governance/test_verification_backlog_item.py"
      - "docs/intake/exploratory/research-verification-backlog-item-source-map.md"
      - "data/receipts/generated/genrec-verification-backlog-item-20260806.json"
      - "packages/hashing/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/governance-verification-backlog-item.yml"
      - "contracts/governance/verification_backlog_item.md"
      - "schemas/contracts/v1/governance/verification_backlog_item.schema.json"
      - "fixtures/contracts/v1/governance/verification_backlog_item/**"
      - "tools/validators/governance/_verification_backlog_item_*.py"
      - "tools/validators/governance/validate_verification_backlog_item.py"
      - "tools/validators/governance/README.md"
      - "tests/validators/governance/test_verification_backlog_item.py"
      - "docs/intake/exploratory/research-verification-backlog-item-source-map.md"
      - "data/receipts/generated/genrec-verification-backlog-item-20260806.json"
      - "packages/hashing/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-verification-backlog-item-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-verification-backlog-item
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic tests
        run: |
          python -m pytest -q \
            tests/validators/governance/test_verification_backlog_item.py

      - name: Replay exact fixture outcomes
        run: |
          python tools/validators/governance/validate_verification_backlog_item.py \
            --cases

      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-verification-backlog-item-20260806.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### VerificationBacklogItem"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only uncertainty, evidence-mode, constraint, acceptance, lineage, and deterministic-identity validation."
            echo "- The result does not authenticate evidence, perform research, activate a source, make a governance or steward decision, mutate a repository register, promote, release, deploy, publish, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"

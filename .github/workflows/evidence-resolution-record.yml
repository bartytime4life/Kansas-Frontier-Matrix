name: evidence-resolution-record

on:
  pull_request:
    paths:
      - 'contracts/governance/evidence_resolution_record.md'
      - 'schemas/contracts/v1/governance/evidence_resolution_record.schema.json'
      - 'fixtures/contracts/v1/governance/evidence_resolution_record/**'
      - 'tools/validators/governance/validate_evidence_resolution_record.py'
      - 'tests/validators/governance/test_evidence_resolution_record.py'
      - '.github/workflows/evidence-resolution-record.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/governance/evidence_resolution_record.md'
      - 'schemas/contracts/v1/governance/evidence_resolution_record.schema.json'
      - 'fixtures/contracts/v1/governance/evidence_resolution_record/**'
      - 'tools/validators/governance/validate_evidence_resolution_record.py'
      - 'tests/validators/governance/test_evidence_resolution_record.py'
      - '.github/workflows/evidence-resolution-record.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-evidence-resolution-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile validator and tests
        run: python -m py_compile tools/validators/governance/validate_evidence_resolution_record.py tests/validators/governance/test_evidence_resolution_record.py
      - name: Run focused tests
        run: python -m pytest -q tests/validators/governance/test_evidence_resolution_record.py
      - name: Replay exact fixture matrix
        run: python tools/validators/governance/validate_evidence_resolution_record.py --cases

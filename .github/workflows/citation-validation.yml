# CitationValidationReport declaration-profile checks.
#
# This workflow executes only repository-owned synthetic fixtures. It performs
# no source lookup, evidence resolution, policy/review/release decision,
# lifecycle write, public-answer authorization, deployment, or publication.
name: citation-validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citation-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  citation-resolves:
    name: Citation declaration profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e ".[test]"

      - name: Run focused validator tests
        run: python -m pytest -q tests/validators/test_validate_citation_validation_report.py

      - name: Replay exact synthetic fixtures
        run: python tools/validators/citation/validate_citation_validation_report.py --fixtures

      - name: Verify compatibility entrypoint
        run: python tools/validators/validate_citation_validation.py --fixtures

      - name: Record boundary
        if: always()
        run: |
          {
            echo "## Citation validation — declaration profile"
            echo
            echo "This job validates only the closed CitationValidationReport schema,"
            echo "deterministic declaration logic, and synthetic fixture expectations."
            echo "It does not contact or resolve a cited source and grants no authority."
          } >> "${GITHUB_STEP_SUMMARY}"

  abstain-on-missing-evidence:
    name: Cite-or-abstain negative paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e ".[test]"

      - name: Prove missing and governed evidence cannot become PASS
        run: >-
          python -m pytest -q
          tests/validators/test_validate_citation_validation_report.py
          -k "missing_evidence_abstains or
          public_candidate_requires_policy_review_and_release or
          rights_and_withdrawal_denials"

      - name: Validate generated receipt hashes
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-citation-validation-report-closure-20260810.json

      - name: Record boundary
        if: always()
        run: |
          {
            echo "## Citation validation — cite or abstain"
            echo
            echo "Synthetic negative paths preserve ABSTAIN, DENY, and ERROR states."
            echo "This job does not approve evidence, an answer, release, or publication."
          } >> "${GITHUB_STEP_SUMMARY}"

name: source-stac-head-prefilter

"on":
  pull_request:
    paths:
      - ".github/workflows/source-stac-head-prefilter.yml"
      - "contracts/source/stac_asset_head_prefilter.md"
      - "contracts/source/source_event_envelope.md"
      - "schemas/contracts/v1/source/stac_asset_head_prefilter.schema.json"
      - "schemas/contracts/v1/source/source_event_envelope.schema.json"
      - "fixtures/contracts/v1/source/stac_asset_head_prefilter/**"
      - "tools/validators/validate_stac_asset_head_prefilter.py"
      - "tools/validators/validate_source_event_envelope.py"
      - "tests/validators/test_validate_stac_asset_head_prefilter.py"
      - "docs/intake/exploratory/pass-32-stac-head-prefilter-source-map.md"
      - "data/receipts/generated/genrec-source-stac-head-prefilter-20260808.json"
      - "packages/hashing/src/hashing/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/source-stac-head-prefilter.yml"
      - "contracts/source/stac_asset_head_prefilter.md"
      - "contracts/source/source_event_envelope.md"
      - "schemas/contracts/v1/source/stac_asset_head_prefilter.schema.json"
      - "schemas/contracts/v1/source/source_event_envelope.schema.json"
      - "fixtures/contracts/v1/source/stac_asset_head_prefilter/**"
      - "tools/validators/validate_stac_asset_head_prefilter.py"
      - "tools/validators/validate_source_event_envelope.py"
      - "tests/validators/test_validate_stac_asset_head_prefilter.py"
      - "docs/intake/exploratory/pass-32-stac-head-prefilter-source-map.md"
      - "data/receipts/generated/genrec-source-stac-head-prefilter-20260808.json"
      - "packages/hashing/src/hashing/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-stac-head-prefilter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-source-stac-head-prefilter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic no-network tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_stac_asset_head_prefilter.py' \
            --verbose

      - name: Replay exact fixture outcomes and findings
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_stac_asset_head_prefilter.py --fixtures

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-source-stac-head-prefilter-20260808.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### STAC asset HEAD prefilter"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only classification of recorded HEAD metadata for an already-known STAC asset."
            echo "- Boundary: PASS is local profile consistency only."
            echo "- Non-effects: no network request, asset download, source activation, lifecycle write, evidence or policy decision, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

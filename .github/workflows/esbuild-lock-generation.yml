# TEMPORARY task-owned candidate generator. Remove before delivery.
# The isolated writer stores blobs only; never refs, PRs, settings or releases.
name: esbuild-alert-63-branch-validation
on:
  push:
    branches: [agent/esbuild-alert-63-20260905]
    paths: [.github/workflows/esbuild-lock-generation.yml]
permissions: {}
concurrency:
  group: esbuild-alert-63-branch-generation
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'bartytime4life/Kansas-Frontier-Matrix' && github.ref == 'refs/heads/agent/esbuild-alert-63-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Freeze inputs and generate parent-scoped lock candidates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object pnpm-lock.yaml)" = 02e273ebacfa0a4bc89a275204d67c027c4695bb
          test "$(git hash-object pnpm-workspace.yaml)" = 3eece3b536797f3bee593b2ce286964b62cc5391
          test "$(git hash-object apps/kansas-frontier-matrix-explorer/package.json)" = 17fc4e47f73967678965a2ed59f7fe830c07bacf
          test "$(git hash-object apps/kansas-frontier-matrix-explorer/package-lock.json)" = 7e4935f204b9c802327b20b28814a4c2ae5284b4
          mkdir -p "$RUNNER_TEMP/before" "$RUNNER_TEMP/npm-candidate" "$RUNNER_TEMP/output"
          cp pnpm-lock.yaml "$RUNNER_TEMP/before/"
          cp apps/kansas-frontier-matrix-explorer/package-lock.json "$RUNNER_TEMP/before/"
          python3 - <<'PY'
          import json, pathlib
          w = pathlib.Path('pnpm-workspace.yaml')
          w.write_text(w.read_text() + 'overrides:\n  "@esbuild-kit/core-utils@3.3.2>esbuild": "0.28.2"\n')
          p = pathlib.Path('apps/kansas-frontier-matrix-explorer/package.json')
          d = json.loads(p.read_text())
          assert 'overrides' not in d
          d['overrides'] = {'@esbuild-kit/core-utils@3.3.2': {'esbuild': '0.28.2'}}
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY
          corepack enable
          test "$(pnpm --version)" = 11.17.0
          node --version
          npm --version
          pnpm install --lockfile-only
          cp apps/kansas-frontier-matrix-explorer/{package.json,package-lock.json} "$RUNNER_TEMP/npm-candidate/"
          (cd "$RUNNER_TEMP/npm-candidate" && npm install --package-lock-only --loglevel=error)
      - name: Preserve unrelated metadata and reject dependency-identity drift
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          original = json.loads((temp/'before/package-lock.json').read_text())
          candidate = json.loads((temp/'npm-candidate/package-lock.json').read_text())
          a, b = original['packages'], candidate['packages']
          binary = re.compile(r'(?:^|/)node_modules/(?:esbuild|@esbuild/[^/]+)$')
          identity = ['version','resolved','integrity','dependencies','optionalDependencies','peerDependencies','peerDependenciesMeta','hasInstallScript','bin']
          for key in sorted(a.keys() | b.keys()):
              if a.get(key) != b.get(key) and not binary.search(key):
                  assert key in a and key in b, ('unrelated package added/removed', key)
                  differences = {f: [a[key].get(f), b[key].get(f)] for f in a[key].keys() | b[key].keys() if a[key].get(f) != b[key].get(f)}
                  print('Unrelated metadata NOT SHIPPED:', key, json.dumps(differences))
                  assert all(a[key].get(f) == b[key].get(f) for f in identity), ('unrelated dependency identity drift', key)
                  b[key] = a[key]
          assert {k:v for k,v in original.items() if k != 'packages'} == {k:v for k,v in candidate.items() if k != 'packages'}
          (temp/'npm-candidate/package-lock.json').write_text(json.dumps(candidate, indent=2)+'\n')
          pathlib.Path('apps/kansas-frontier-matrix-explorer/package-lock.json').write_text(json.dumps(candidate, indent=2)+'\n')
          assert all(a.get(k) == b.get(k) for k in a.keys() | b.keys() if not binary.search(k))
          def sections(text):
              parts = re.split(r'^([A-Za-z][A-Za-z0-9]*):[ \t]*\n', text, flags=re.M)
              return dict(zip(['header']+parts[1::2], [parts[0]]+parts[2::2]))
          x = sections((temp/'before/pnpm-lock.yaml').read_text())
          y = sections(pathlib.Path('pnpm-lock.yaml').read_text())
          for key in x.keys() | y.keys():
              if key not in ('packages','snapshots','overrides'):
                  assert x.get(key, '').strip() == y.get(key, '').strip(), ('unrelated pnpm section drift', key)
          assert 'overrides' not in x
          assert '@esbuild-kit/core-utils@3.3.2>esbuild: 0.28.2' in y['overrides'].replace("'", '').replace('"', '')
          def stanzas(text):
              result = {}
              for block in re.split(r'(?=^  \S)', text, flags=re.M):
                  if not block.strip(): continue
                  first, _, rest = block.partition('\n')
                  match = re.fullmatch(r'  (.+?):(.*)', first)
                  assert match, first
                  result[match[1].strip("'\"")] = (match[2]+'\n'+rest).strip()
              return result
          for section in ('packages','snapshots'):
              old, new = stanzas(x[section]), stanzas(y[section])
              for key in old.keys() | new.keys():
                  if old.get(key) != new.get(key):
                      if key == '@esbuild-kit/core-utils@3.3.2':
                          assert new[key] == old[key].replace('esbuild: 0.18.20','esbuild: 0.28.2')
                      else:
                          assert re.match(r'^(esbuild|@esbuild/[^@]+)@',key), ('unrelated pnpm drift',key,old.get(key),new.get(key))
          print('Scoped lockfile comparison PASS')
          print('BEFORE esbuild:',[(k,v['version']) for k,v in a.items() if k.endswith('/esbuild')])
          print('AFTER esbuild:',[(k,v['version']) for k,v in b.items() if k.endswith('/esbuild')])
          PY
          (cd "$RUNNER_TEMP/npm-candidate" && npm ci --dry-run --loglevel=error > "$RUNNER_TEMP/npm-dry-run.txt")
          node --test apps/kansas-frontier-matrix-explorer/tests/esbuild-security.test.mjs
          git diff --check
          git diff --stat
      - name: Check targeted advisory without suppressing unrelated audit findings
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd "$RUNNER_TEMP/npm-candidate" && npm audit --json) > "$RUNNER_TEMP/npm-audit.json"
          code=$?
          set -e
          test "$code" -le 1
          python3 - <<'PY'
          import json, os, pathlib
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'npm-audit.json').read_text())
          assert 'error' not in d, d.get('error')
          assert isinstance(d.get('vulnerabilities'),dict)
          assert 'GHSA-67mh-4wv8-2f99' not in json.dumps(d)
          print('Target GHSA absent. Remaining audit counts:',d['metadata']['vulnerabilities'])
          for name,item in d['vulnerabilities'].items():
              print(name,item.get('severity'),[v.get('url') for v in item.get('via',[]) if isinstance(v,dict)])
          PY
      - name: Frozen pnpm install with unchanged build-script policy
        shell: bash
        run: |
          set -euo pipefail
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/lock.sha256"
          pnpm install --frozen-lockfile
          sha256sum -c "$RUNNER_TEMP/lock.sha256"
      - name: Actual esbuild loopback and synthetic Drizzle probes
        shell: bash
        env:
          KFM_ESBUILD_RUNTIME_PROBE: '1'
        run: node --test apps/kansas-frontier-matrix-explorer/tests/esbuild-security.test.mjs
      - name: Canonical Explorer build and tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter explorer-web build
          pnpm --filter explorer-web test
      - name: Stage four validated files with independent integrity hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          paths=['pnpm-workspace.yaml','pnpm-lock.yaml','apps/kansas-frontier-matrix-explorer/package.json','apps/kansas-frontier-matrix-explorer/package-lock.json']
          assert sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) == sorted(paths)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'output'
          record={'tested_commit':os.environ['GITHUB_SHA'],'files':[],'authority':'CANDIDATE_ONLY; NO_REF_OR_PR_MUTATION; NO_MERGE_OR_DEPLOYMENT'}
          for i,p in enumerate(paths):
              data=pathlib.Path(p).read_bytes()
              data.decode('utf-8')
              name=f'candidate-{i}.txt'
              (out/name).write_bytes(data)
              record['files'].append({'path':p,'artifact':name,'sha256':hashlib.sha256(data).hexdigest(),'git_blob':hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()})
          (out/'record.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: esbuild-validated-candidates
          path: ${{ runner.temp }}/output/
          retention-days: 7
          if-no-files-found: error
  store-blobs:
    needs: generate
    if: github.repository == 'bartytime4life/Kansas-Frontier-Matrix' && github.ref == 'refs/heads/agent/esbuild-alert-63-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Fresh runner; no checkout, package installation, repository code, or ref writes.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: esbuild-validated-candidates
          path: candidate
      - name: Store integrity-verified blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path('candidate')
          record=json.loads((root/'record.json').read_text())
          expected=['pnpm-workspace.yaml','pnpm-lock.yaml','apps/kansas-frontier-matrix-explorer/package.json','apps/kansas-frontier-matrix-explorer/package-lock.json']
          assert record['tested_commit']==os.environ['GITHUB_SHA']
          assert [f['path'] for f in record['files']]==expected
          for i,item in enumerate(record['files']):
              assert item['artifact']==f'candidate-{i}.txt'
              data=(root/item['artifact']).read_bytes()
              assert len(data)<2000000
              assert hashlib.sha256(data).hexdigest()==item['sha256']
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==item['git_blob']
              body=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/bartytime4life/Kansas-Frontier-Matrix/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
              assert result['sha']==item['git_blob']
              print(json.dumps({'path':item['path'],'blob':result['sha'],'sha256':item['sha256']}))
          PY

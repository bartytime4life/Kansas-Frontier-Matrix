name: official-source-snapshot-lineage-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/official-source-snapshot-lineage-assessment.yml"
      - "contracts/source/official_source_snapshot_lineage_assessment.md"
      - "schemas/contracts/v1/source/official_source_snapshot_lineage_assessment.schema.json"
      - "fixtures/contracts/v1/source/official_source_snapshot_lineage_assessment/**"
      - "tools/validators/source/validate_official_source_snapshot_lineage_assessment.py"
      - "tests/validators/test_validate_official_source_snapshot_lineage_assessment.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/official-source-snapshot-lineage-assessment.yml"
      - "contracts/source/official_source_snapshot_lineage_assessment.md"
      - "schemas/contracts/v1/source/official_source_snapshot_lineage_assessment.schema.json"
      - "fixtures/contracts/v1/source/official_source_snapshot_lineage_assessment/**"
      - "tools/validators/source/validate_official_source_snapshot_lineage_assessment.py"
      - "tests/validators/test_validate_official_source_snapshot_lineage_assessment.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-official-source-snapshot-lineage-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run focused deterministic tests
        run: |
          set -euo pipefail
          python -m pytest tests/validators/test_validate_official_source_snapshot_lineage_assessment.py -q --strict-config --strict-markers

      - name: Prove lineage fixtures
        run: |
          set -euo pipefail
          for fixture in \
            fixtures/contracts/v1/source/official_source_snapshot_lineage_assessment/superseded.json \
            fixtures/contracts/v1/source/official_source_snapshot_lineage_assessment/corrected.json \
            fixtures/contracts/v1/source/official_source_snapshot_lineage_assessment/conflicted.json
          do
            python tools/validators/source/validate_official_source_snapshot_lineage_assessment.py "$fixture"
          done

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Official source snapshot lineage assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: deterministic fixture-only source-snapshot lineage semantics."
            echo "- Boundary: no source activation, network retrieval, EvidenceBundle emission, lifecycle write, policy/review decision, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

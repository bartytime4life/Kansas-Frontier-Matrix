# KFM full Python suite.
#
# Executes every tests/**/test_*.py file once on every pull request and push to
# main. Domain and lane workflows run bounded, often path-filtered slices; this
# workflow has no path filter, so a source-only change still runs every test
# that exercises it. Moved here from python-dependency-lock.yml, whose path
# filters let source-only changes skip the suite. It is test evidence only; it
# grants no readiness, release, or publication authority.
name: full-python-suite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-python-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  # Executes every tests/**/test_*.py file once. Domain and lane workflows run
  # bounded slices; this job closes the gap for files that no slice names.
  # It omits tools/ci/kfm_no_network from PYTHONPATH because serving tests bind
  # loopback HTTP servers and that guard denies socket.getfqdn; KFM_NO_NETWORK
  # and PROJ_NETWORK still apply. Full history is required because the
  # installer migration tests replay historical commits. It is test evidence only.
  test-full-local:
    name: run full Python suite (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the complete bundle's pinned interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/ci/python-test.lock
            tools/ci/python-cli.lock
            tools/ci/python-geo.lock
            tools/ci/python-nwm.lock
            tools/ci/geoparquet-pyarrow-25.lock

      - name: Install the full bundle in a fresh virtual environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/kfm-full-local-venv"
          "$RUNNER_TEMP/kfm-full-local-venv/bin/python" tools/ci/install_full_local_test.py

      - name: Install checksum-pinned OPA 1.19.0
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/opa" \
            https://github.com/open-policy-agent/opa/releases/download/v1.19.0/opa_linux_amd64_static
          echo "1dd5c5591ff856f5e20a1d66bafae9511ddf3c5552ed3b5070c70b2b6580ee3f  $RUNNER_TEMP/opa" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/opa"
          "$RUNNER_TEMP/opa" version

      - name: Run the Python suite
        env:
          KFM_NO_NETWORK: "1"
          PROJ_NETWORK: "OFF"
        run: |
          set -euo pipefail
          # Activate the bundle on PATH: some tests run repository scripts that
          # call `python`/`python3` or use a `#!/usr/bin/env python3` shebang,
          # and the runner's own interpreter lacks the bundle's packages.
          export VIRTUAL_ENV="$RUNNER_TEMP/kfm-full-local-venv"
          export PATH="$VIRTUAL_ENV/bin:$PATH"
          OPA_BIN="$RUNNER_TEMP/opa" python -m pytest \
            -q -p no:cacheprovider -rs tests

      - name: Confirm the suite left the checkout unchanged
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/full-suite-status.txt"
          if [ -s "$RUNNER_TEMP/full-suite-status.txt" ]; then
            cat "$RUNNER_TEMP/full-suite-status.txt"
            echo "the full suite wrote into the checkout" >&2
            exit 1
          fi

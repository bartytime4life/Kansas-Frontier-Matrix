# Validate the proposed Municipality / CensusPlace identity-separation profile.
#
# This workflow is read-only, deterministic, synthetic, and no-network after
# installing repository-declared test dependencies. A green result proves only
# the bounded schema/fixture/validator invariants named below. It grants no
# legal status, census status, feature identity truth, source admission,
# EvidenceBundle closure, policy approval, release, deployment, or publication authority.
name: place-identity

"on":
  pull_request:
    paths:
      - ".github/workflows/place-identity.yml"
      - "contracts/domains/settlements-infrastructure/place-identity.md"
      - "schemas/contracts/v1/domains/settlements-infrastructure/place-identity.schema.json"
      - "fixtures/contracts/v1/domains/settlements-infrastructure/place_identity/**"
      - "tools/validators/validate_place_identity.py"
      - "tests/validators/test_validate_place_identity.py"
      - "data/receipts/generated/genrec-place-identity-separation-*.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/place-identity.yml"
      - "contracts/domains/settlements-infrastructure/place-identity.md"
      - "schemas/contracts/v1/domains/settlements-infrastructure/place-identity.schema.json"
      - "fixtures/contracts/v1/domains/settlements-infrastructure/place_identity/**"
      - "tools/validators/validate_place_identity.py"
      - "tests/validators/test_validate_place_identity.py"
      - "data/receipts/generated/genrec-place-identity-separation-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: place-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-place-identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused no-network tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_place_identity.py' \
            --verbose

      - name: Validate exact fixture polarity and reviewed finding codes
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_place_identity.py --fixtures

      - name: Validate schema and fixture JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path(
              "schemas/contracts/v1/domains/settlements-infrastructure/"
              "place-identity.schema.json"
          )
          Draft202012Validator.check_schema(
              json.loads(schema_path.read_text(encoding="utf-8"))
          )
          files = sorted(
              Path(
                  "fixtures/contracts/v1/domains/settlements-infrastructure/"
                  "place_identity"
              ).rglob("*.json")
          )
          assert files, "fixture inventory is empty"
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"CONFIRMED: parsed schema and {len(files)} fixture JSON files.")
          PY

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-place-identity-separation-20260814.json \
            --repo-root .

      - name: Record validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Place identity separation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic Municipality, CensusPlace, and non-specialized settlement identity records; temporal-order checks; and release-reference closure checks."
            echo "- Network posture: no live legal record, census source, evidence store, policy engine, release system, or public endpoint."
            echo "- Boundary: a green result does not prove real-world identity, legal status, census status, geometry, source admission, evidence closure, policy approval, release, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

name: kgs-m118-source-descriptor

"on":
  pull_request:
    paths:
      - ".github/workflows/kgs-m118-source-descriptor.yml"
      - "data/registry/sources/geology/kgs-m118-surficial-geology.source.json"
      - "tests/schemas/test_kgs_m118_source_descriptor.py"
      - "docs/intake/exploratory/kgs-m118-source-descriptor-source-map.md"
      - "data/receipts/generated/genrec-kgs-m118-source-descriptor-*.json"
      - "schemas/contracts/v1/source/source_descriptor.schema.json"
      - "schemas/contracts/v1/sources/source_descriptor.schema.json"
      - "tools/validators/sources/validate_source_descriptor.py"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/kgs-m118-source-descriptor.yml"
      - "data/registry/sources/geology/kgs-m118-surficial-geology.source.json"
      - "tests/schemas/test_kgs_m118_source_descriptor.py"
      - "docs/intake/exploratory/kgs-m118-source-descriptor-source-map.md"
      - "data/receipts/generated/genrec-kgs-m118-source-descriptor-*.json"
      - "schemas/contracts/v1/source/source_descriptor.schema.json"
      - "schemas/contracts/v1/sources/source_descriptor.schema.json"
      - "tools/validators/sources/validate_source_descriptor.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kgs-m118-source-descriptor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-kgs-m118-source-descriptor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Validate source descriptor candidate
        run: |
          set -euo pipefail
          python tools/validators/sources/validate_source_descriptor.py             data/registry/sources/geology/kgs-m118-surficial-geology.source.json
          python -m pytest -q tests/schemas/test_kgs_m118_source_descriptor.py
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py             data/receipts/generated/genrec-kgs-m118-source-descriptor-20260814.json             --repo-root .
      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### KGS M-118 SourceDescriptor candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: schema and declaration checks for one proposed inactive KGS Map M-118 registry record."
            echo "- Boundary: no source activation, live retrieval, content admission, rights approval, policy/review decision, lifecycle transition, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

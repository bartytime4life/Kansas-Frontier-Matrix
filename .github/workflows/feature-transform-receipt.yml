name: feature-transform-receipt

"on":
  pull_request:
    paths:
      - ".github/workflows/feature-transform-receipt.yml"
      - "contracts/evidence/feature_transform_receipt.md"
      - "schemas/contracts/v1/evidence/feature_transform_receipt.schema.json"
      - "fixtures/contracts/v1/evidence/feature_transform_receipt/**"
      - "tools/validators/evidence/validate_feature_transform_receipt.py"
      - "tests/validators/evidence/test_validate_feature_transform_receipt.py"
      - "docs/intake/exploratory/pass-18-feature-transform-receipt-source-map.md"
      - "data/receipts/generated/genrec-pass18-feature-transform-receipt-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/feature-transform-receipt.yml"
      - "contracts/evidence/feature_transform_receipt.md"
      - "schemas/contracts/v1/evidence/feature_transform_receipt.schema.json"
      - "fixtures/contracts/v1/evidence/feature_transform_receipt/**"
      - "tools/validators/evidence/validate_feature_transform_receipt.py"
      - "tests/validators/evidence/test_validate_feature_transform_receipt.py"
      - "docs/intake/exploratory/pass-18-feature-transform-receipt-source-map.md"
      - "data/receipts/generated/genrec-pass18-feature-transform-receipt-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-transform-receipt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-feature-transform-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/evidence/validate_feature_transform_receipt.py tests/validators/evidence/test_validate_feature_transform_receipt.py
          python -m unittest tests.validators.evidence.test_validate_feature_transform_receipt --verbose
          python tools/validators/evidence/validate_feature_transform_receipt.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-feature-transform-receipt-20260810.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Feature transform receipt candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only ordered feature references, transform families, method/parameter declarations, fit scope, review hold, and deterministic identity."
            echo "- Boundary: no feature values, transform or model execution, evidence resolution, scientific endorsement, policy or review decision, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

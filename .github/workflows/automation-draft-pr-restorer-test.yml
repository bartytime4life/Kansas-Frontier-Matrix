name: automation-draft-pr-restorer-test

"on":
  pull_request:
    paths:
      - ".github/workflows/automation-draft-pr-restorer.yml"
      - ".github/workflows/automation-draft-pr-restorer-test.yml"
      - "contracts/governance/automation_draft_restoration.md"
      - "schemas/contracts/v1/governance/automation_draft_restoration.schema.json"
      - "tools/validators/governance/validate_automation_draft_restoration.py"
      - "tests/validators/test_validate_automation_draft_restoration.py"
  push:
    branches:
      - main
      - "automation/draft-delivery/**"
    paths:
      - ".github/workflows/automation-draft-pr-restorer.yml"
      - ".github/workflows/automation-draft-pr-restorer-test.yml"
      - "contracts/governance/automation_draft_restoration.md"
      - "schemas/contracts/v1/governance/automation_draft_restoration.schema.json"
      - "tools/validators/governance/validate_automation_draft_restoration.py"
      - "tests/validators/test_validate_automation_draft_restoration.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Parse workflow and schema files
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/automation-draft-pr-restorer.yml \
            .github/workflows/automation-draft-pr-restorer-test.yml
          python -m json.tool \
            schemas/contracts/v1/governance/automation_draft_restoration.schema.json \
            >/dev/null

      - name: Compile and run focused no-network regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/validators/governance/validate_automation_draft_restoration.py \
            tests/validators/test_validate_automation_draft_restoration.py
          python -m unittest -q \
            tests.validators.test_validate_automation_draft_restoration

      - name: Run repository workflow-security rules on the new workflows
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/governance/validate_workflow_security.py \
            --repo-root . \
            --workflow .github/workflows/automation-draft-pr-restorer.yml \
            --workflow .github/workflows/automation-draft-pr-restorer-test.yml

      - name: Guard privileged restoration trigger and permissions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/automation-draft-pr-restorer.yml")
          text = path.read_text(encoding="utf-8")
          active_lines = tuple(
              line.strip()
              for line in text.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          )
          active_text = "\n".join(active_lines)

          required = (
              "repository_dispatch:",
              "automation-draft-restoration-v1",
              "workflow_dispatch:",
              "proposal_json:",
              "contents: read",
              "issues: read",
              "pull-requests: write",
              "validate_automation_draft_restoration.py",
              "github.event.client_payload.proposal",
              "inputs.proposal_json",
              "convertPullRequestToDraft",
              "-f state=closed",
              "--verify-state draft",
              "--verify-state closed",
              "AUTOMATION_DRAFT_RESTORATION_RECHECK_DENIED",
              "AUTOMATION_DRAFT_RESTORATION_FAILED_CLOSED_UNMERGED",
          )
          for marker in required:
              if marker not in active_text:
                  raise SystemExit(f"missing restoration guard marker: {marker}")

          forbidden = (
              "pull_request:",
              "pull_request_target:",
              "push:",
              "schedule:",
              "workflow_call:",
              "workflow_run:",
              "contents: write",
              "issues: write",
              "actions: write",
              "deployments: write",
              "packages: write",
              "id-token: write",
              "actions/checkout@",
              "gh pr ready",
              "gh pr merge",
              "gh release create",
              "git push",
          )
          for marker in forbidden:
              if marker in active_text:
                  raise SystemExit(f"forbidden restoration workflow marker surfaced: {marker}")

          if active_lines.count("repository_dispatch:") != 1:
              raise SystemExit("repository_dispatch must occur exactly once")
          if active_lines.count("pull-requests: write") != 1:
              raise SystemExit("pull-request write permission must occur exactly once")
          PY

      - name: Record test boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Automation draft PR restorer test"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- This workflow is read-only and uses deterministic synthetic data only."
            echo "- It checks YAML, JSON shape, exact-event binding, post-state verification, CLI abbreviation denial, and privileged-workflow guardrails."
            echo "- It does not dispatch restoration, mutate a PR, alter a branch, merge, release, deploy, publish, or change repository settings."
          } >> "${GITHUB_STEP_SUMMARY}"

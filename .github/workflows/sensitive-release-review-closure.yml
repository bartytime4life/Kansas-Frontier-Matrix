name: sensitive-release-review-closure

"on":
  pull_request:
    paths:
      - ".github/workflows/sensitive-release-review-closure.yml"
      - "contracts/governance/sensitive_release_review_closure.md"
      - "schemas/contracts/v1/governance/sensitive_release_review_closure.schema.json"
      - "fixtures/contracts/v1/governance/sensitive_release_review_closure/**"
      - "tools/validators/governance/validate_sensitive_release_review_closure.py"
      - "tests/validators/governance/test_sensitive_release_review_closure.py"
      - "docs/intake/exploratory/full-atlas-sensitive-release-review-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-full-atlas-sensitive-release-review-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sensitive-release-review-closure.yml"
      - "contracts/governance/sensitive_release_review_closure.md"
      - "schemas/contracts/v1/governance/sensitive_release_review_closure.schema.json"
      - "fixtures/contracts/v1/governance/sensitive_release_review_closure/**"
      - "tools/validators/governance/validate_sensitive_release_review_closure.py"
      - "tests/validators/governance/test_sensitive_release_review_closure.py"
      - "docs/intake/exploratory/full-atlas-sensitive-release-review-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-full-atlas-sensitive-release-review-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sensitive-release-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: python -m pytest -q tests/validators/governance/test_sensitive_release_review_closure.py
      - name: Verify generated receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-full-atlas-sensitive-release-review-20260809.json --repo-root .
      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### Sensitive release review closure"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic T3/T4 review-binding closure only."
            echo "- Boundary: no actor authentication, policy override, promotion, release, deployment, publication, or sensitive-data exposure."
          } >> "$GITHUB_STEP_SUMMARY"

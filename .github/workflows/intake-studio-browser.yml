# KFM Studio browser acceptance.
#
# Runs the opt-in Chromium check in tests/local_data/test_intake_studio_browser.py,
# which the full suite skips. Files and extraction are synthetic, the Studio
# listens on loopback only, and the test fails on any non-loopback request.
# Playwright's Python driver comes from a hash-locked, binary-only profile; the
# browser is the runner's preinstalled Chrome, so nothing is downloaded at run
# time. It is test evidence only; it grants no readiness, release, or
# publication authority.
name: intake-studio-browser

on:
  pull_request:
    paths:
      - ".github/workflows/intake-studio-browser.yml"
      - "tools/local_data/intake_studio/**"
      - "tests/local_data/test_intake_studio*.py"
      - "tests/local_data/studio_auth.py"
      - "tools/ci/python-browser.lock"
      - "tools/ci/python-test.lock"
      - "tools/ci/install_python_ci.py"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/intake-studio-browser.yml"
      - "tools/local_data/intake_studio/**"
      - "tests/local_data/test_intake_studio*.py"
      - "tests/local_data/studio_auth.py"
      - "tools/ci/python-browser.lock"
      - "tools/ci/python-test.lock"
      - "tools/ci/install_python_ci.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intake-studio-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  TZ: UTC

jobs:
  browser:
    name: Studio browser acceptance (Python 3.12, Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/ci/python-test.lock
            tools/ci/python-browser.lock

      - name: Install the test profile and the locked Playwright driver
        run: |
          python tools/ci/install_python_ci.py project-test
          python tools/ci/install_python_ci.py intake-browser
          python -m pip check

      - name: Run the Studio browser acceptance test
        env:
          KFM_INTAKE_BROWSER_TESTS: "1"
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome)"
          "$chrome" --version
          KFM_INTAKE_TEST_CHROMIUM="$chrome" python -m pytest -q -p no:cacheprovider \
            tests/local_data/test_intake_studio_browser.py

      - name: Confirm the test left the checkout unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=all)"

name: water-pilot
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: water-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  water-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked water dependencies
        run: python tools/ci/install_python_ci.py water-pilot
      - name: Execute synthetic acquisition, serving, denial and recovery tests
        run: python -m pytest -q tests/connectors/usgs/water_data tests/domains/hydrology/test_usgs_water_normalizer.py tests/packages/release tests/packages/connectors_core apps/governed-api/tests tests/tools/test_water_job.py tests/tools/test_water_release.py tests/tools/test_water_readiness.py tests/qa/test_site_mirror.py
      - name: Regenerate isolated synthetic conformance fixtures
        run: python tools/fixtures/regenerate.py
      # A successful job records synthetic conformance and content parity only.
      # Review acceptance and hosted equivalence are independent dimensions.
      - name: Check recorded mirror content parity and report review state
        shell: bash
        run: python tools/qa/site_mirror.py --check --format markdown | tee -a "$GITHUB_STEP_SUMMARY"

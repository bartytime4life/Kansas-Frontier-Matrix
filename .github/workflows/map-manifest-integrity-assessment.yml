# Validate fixture-only map manifest integrity assessments.
name: map-manifest-integrity-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/map-manifest-integrity-assessment.yml"
      - "contracts/map/map_manifest_integrity_assessment.md"
      - "schemas/contracts/v1/map/map_manifest_integrity_assessment.schema.json"
      - "tools/validators/map/map_manifest_integrity_assessment/**"
      - "fixtures/map/map_manifest_integrity_assessment/**"
      - "tests/validators/map/map_manifest_integrity_assessment/**"
      - "data/receipts/generated/genrec-map-manifest-integrity-assessment-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-manifest-integrity-assessment.yml"
      - "contracts/map/map_manifest_integrity_assessment.md"
      - "schemas/contracts/v1/map/map_manifest_integrity_assessment.schema.json"
      - "tools/validators/map/map_manifest_integrity_assessment/**"
      - "fixtures/map/map_manifest_integrity_assessment/**"
      - "tests/validators/map/map_manifest_integrity_assessment/**"
      - "data/receipts/generated/genrec-map-manifest-integrity-assessment-*.json"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: map-manifest-integrity-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC
jobs:
  validate:
    name: validate-map-manifest-integrity-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run deterministic integrity-assessment tests
        run: |
          set -euo pipefail
          python -m pytest tests/validators/map/map_manifest_integrity_assessment/test_validate_map_manifest_integrity_assessment.py -q --strict-config --strict-markers
      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-map-manifest-integrity-assessment-20260806.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Fixture-only map manifest integrity assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: canonical manifest hash, carried signature verdict, evidence/proof state, selected-asset verification, and finite outcome checks."
            echo "- Boundary: no network fetch, cryptographic verification, MapLibre wiring, promotion, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

name: choropleth-classification-disclosure

"on":
  pull_request:
    paths:
      - ".github/workflows/choropleth-classification-disclosure.yml"
      - "contracts/evidence/choropleth_classification_disclosure.md"
      - "schemas/contracts/v1/evidence/choropleth_classification_disclosure.schema.json"
      - "fixtures/contracts/v1/evidence/choropleth_classification_disclosure/**"
      - "tools/validators/evidence/validate_choropleth_classification_disclosure.py"
      - "tests/validators/evidence/test_validate_choropleth_classification_disclosure.py"
      - "docs/intake/exploratory/pass-18-choropleth-classification-disclosure-source-map.md"
      - "data/receipts/generated/genrec-pass18-choropleth-classification-disclosure-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/choropleth-classification-disclosure.yml"
      - "contracts/evidence/choropleth_classification_disclosure.md"
      - "schemas/contracts/v1/evidence/choropleth_classification_disclosure.schema.json"
      - "fixtures/contracts/v1/evidence/choropleth_classification_disclosure/**"
      - "tools/validators/evidence/validate_choropleth_classification_disclosure.py"
      - "tests/validators/evidence/test_validate_choropleth_classification_disclosure.py"
      - "docs/intake/exploratory/pass-18-choropleth-classification-disclosure-source-map.md"
      - "data/receipts/generated/genrec-pass18-choropleth-classification-disclosure-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choropleth-classification-disclosure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-choropleth-classification-disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/evidence/validate_choropleth_classification_disclosure.py tests/validators/evidence/test_validate_choropleth_classification_disclosure.py
          python -m unittest tests.validators.evidence.test_validate_choropleth_classification_disclosure --verbose
          python tools/validators/evidence/validate_choropleth_classification_disclosure.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-choropleth-classification-disclosure-20260810.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Choropleth classification disclosure"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only method, class-count, break, range, geography, null, outlier, and review-disclosure coherence."
            echo "- Boundary: no value inspection, classification computation, legend rendering, evidence resolution, policy or review decision, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

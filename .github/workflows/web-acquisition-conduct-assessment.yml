name: web-acquisition-conduct-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/web-acquisition-conduct-assessment.yml"
      - "contracts/source/web_acquisition_conduct_assessment.md"
      - "schemas/contracts/v1/source/web_acquisition_conduct_assessment.schema.json"
      - "fixtures/contracts/v1/source/web_acquisition_conduct_assessment/**"
      - "tools/validators/source/validate_web_acquisition_conduct_assessment.py"
      - "tests/validators/test_validate_web_acquisition_conduct_assessment.py"
      - "docs/intake/exploratory/pass-18-web-acquisition-conduct-source-map.md"
      - "data/receipts/generated/genrec-pass18-web-acquisition-conduct-assessment-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/web-acquisition-conduct-assessment.yml"
      - "contracts/source/web_acquisition_conduct_assessment.md"
      - "schemas/contracts/v1/source/web_acquisition_conduct_assessment.schema.json"
      - "fixtures/contracts/v1/source/web_acquisition_conduct_assessment/**"
      - "tools/validators/source/validate_web_acquisition_conduct_assessment.py"
      - "tests/validators/test_validate_web_acquisition_conduct_assessment.py"
      - "docs/intake/exploratory/pass-18-web-acquisition-conduct-source-map.md"
      - "data/receipts/generated/genrec-pass18-web-acquisition-conduct-assessment-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-acquisition-conduct-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-web-acquisition-conduct-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/source/validate_web_acquisition_conduct_assessment.py tests/validators/test_validate_web_acquisition_conduct_assessment.py
          python -m unittest tests.validators.test_validate_web_acquisition_conduct_assessment --verbose
          python tools/validators/source/validate_web_acquisition_conduct_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-web-acquisition-conduct-assessment-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Web acquisition conduct assessment candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only route, terms, robots, rate, identity, proxy, distribution, agreement-reference, and review-reference coherence."
            echo "- Boundary: no live terms or robots retrieval, legal or permission decision, fetch, connector or scheduler activation, credential or proxy mutation, lifecycle write, evidence or policy decision, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

name: Public hosted AI qualification
on:
  push:
    branches: [a0-hosted-ai-360m-qualification-20261016]
permissions:
  contents: read
jobs:
  qualify-public-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
      - run: npm ci
      - run: node --test tests/embedded-ai-probe.test.mjs tests/hosted-ai.test.mjs
      - name: Private pinned-model installation and synthetic inference
        run: |
          node --input-type=module <<'JS'
          import {qualifyEmbeddedAi} from './server/embedded-ai-probe.mjs';
          const installed=await qualifyEmbeddedAi({root:process.env.RUNNER_TEMP});
          console.log('KFM_INSTALL_RECEIPT '+JSON.stringify(installed));
          if(installed.status!=='SYNTHETIC_INFERENCE_PASS')throw Error('INSTALL_UNQUALIFIED');
          JS
      - name: Compare fixed discussion profiles in separate processes
        run: |
          for KFM_QUALIFICATION_PROFILE in baseline concise-sampled-v1 concise-greedy-v1; do
            export KFM_QUALIFICATION_PROFILE
            node --input-type=module <<'JS'
          import {qualifyHostedChat} from './server/hosted-ai-acceptance.mjs';
          import {writeFile} from 'node:fs/promises';
          import {join} from 'node:path';
          const discussionProfile=process.env.KFM_QUALIFICATION_PROFILE;
          const receipt=await qualifyHostedChat({root:process.env.RUNNER_TEMP,discussionProfile});
          console.log('KFM_PROFILE_RECEIPT '+JSON.stringify(receipt));
          await writeFile(join(process.env.RUNNER_TEMP,'quality-'+discussionProfile+'.json'),JSON.stringify(receipt),{flag:'wx',mode:0o600});
          JS
          done
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {join} from 'node:path';
          const profiles=['concise-sampled-v1','concise-greedy-v1'];
          const results=await Promise.all(profiles.map(async profile=>JSON.parse(await readFile(join(process.env.RUNNER_TEMP,'quality-'+profile+'.json'),'utf8'))));
          const qualified=results.filter(r=>r.status==='HOSTED_DISCUSSION_PASS').map(r=>r.discussionProfile);
          console.log('KFM_QUALIFIED_PROFILES '+JSON.stringify(qualified));
          if(!qualified.length)process.exitCode=1;
          JS

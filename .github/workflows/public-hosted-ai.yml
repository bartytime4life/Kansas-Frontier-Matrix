name: Public hosted AI qualification
on:
  push:
    branches: [a0-public-hosted-ai-20261016]
permissions:
  contents: read
jobs:
  qualify-public-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
      - run: npm ci
      - run: node --test tests/public-ai.test.mjs tests/hosted-ai.test.mjs tests/pc-ai.test.mjs tests/pc-ai-login-admission.test.mjs tests/inspection-panel.test.mjs
      - run: npm run build
      - run: npx tsc --noEmit
      - run: node --test tests/public-ai-http.test.mjs tests/pc-ai-http.test.mjs
      - name: Private pinned-model installation and actual selector checks
        run: |
          node --input-type=module <<'JS'
          import {qualifyEmbeddedAi} from './server/embedded-ai-probe.mjs';
          import {qualifyHostedChat} from './server/hosted-ai-acceptance.mjs';
          const installed=await qualifyEmbeddedAi({root:process.env.RUNNER_TEMP});
          console.log('KFM_INSTALL_RECEIPT '+JSON.stringify(installed));
          if(installed.status!=='SYNTHETIC_INFERENCE_PASS')throw Error('INSTALL_UNQUALIFIED');
          const receipt=await qualifyHostedChat({root:process.env.RUNNER_TEMP});
          console.log('KFM_PUBLIC_CHAT_RECEIPT '+JSON.stringify(receipt));
          if(receipt.status!=='HOSTED_SELECTION_PASS')process.exitCode=1;
          JS

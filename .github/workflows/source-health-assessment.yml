# Validate the offline SourceHealthAssessment contract packet.
name: source-health-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/source-health-assessment.yml"
      - "contracts/source/source_health_assessment.md"
      - "schemas/contracts/v1/source/source_health_assessment.schema.json"
      - "fixtures/contracts/v1/source/source_health_assessment/**"
      - "tools/validators/source/validate_source_health_assessment.py"
      - "tests/source/test_source_health_assessment.py"
      - "data/receipts/generated/genrec-source-health-assessment-hardening-20260814.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-health-assessment.yml"
      - "contracts/source/source_health_assessment.md"
      - "schemas/contracts/v1/source/source_health_assessment.schema.json"
      - "fixtures/contracts/v1/source/source_health_assessment/**"
      - "tools/validators/source/validate_source_health_assessment.py"
      - "tests/source/test_source_health_assessment.py"
      - "data/receipts/generated/genrec-source-health-assessment-hardening-20260814.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-health-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-source-health-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test

      - name: Compile validator and tests
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/source/validate_source_health_assessment.py
          python -m py_compile tests/source/test_source_health_assessment.py

      - name: Run focused deterministic no-network validation
        run: |
          set -euo pipefail
          python -m unittest tests.source.test_source_health_assessment -v

      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-source-health-assessment-hardening-20260814.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### SourceHealthAssessment offline validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic fixtures and deterministic local consistency checks only."
            echo "- Boundary: PASS does not mean HEALTHY and does not probe, activate, admit, promote, release, deploy, publish, or establish source or scientific truth."
          } >> "$GITHUB_STEP_SUMMARY"

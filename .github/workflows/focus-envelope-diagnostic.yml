# Temporary bounded diagnostic for the inherited finite-envelope failure.
# Removed before the repair pull request. It reports unittest IDs only.
name: focus-envelope-diagnostic

"on":
  push:
    branches:
      - agent/pass1-focus-envelope-baseline-repair-20260808

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Enumerate and isolate complete module suite
        shell: bash
        run: |
          set +e
          mapfile -t test_ids < <(
            python - <<'PY'
          import unittest

          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item

          suite = unittest.defaultTestLoader.loadTestsFromName(
              "tests.runtime_proof.test_envelope_finite_outcomes"
          )
          for test in flatten(suite):
              print(test.id())
          PY
          )
          failed=0
          for test_id in "${test_ids[@]}"; do
            if python -m unittest "$test_id" >/dev/null 2>&1; then
              echo "::notice file=tests/runtime_proof/test_envelope_finite_outcomes.py::$test_id PASS"
            else
              echo "::error file=tests/runtime_proof/test_envelope_finite_outcomes.py::$test_id FAIL"
              failed=1
            fi
          done
          exit "$failed"

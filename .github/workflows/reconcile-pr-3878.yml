name: Temporary reconcile PR 3878

on:
  push:
    branches:
      - docs/soil-no-network-runbook-20260829
    paths:
      - .github/workflows/reconcile-pr-3878.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'bartytime4life/Kansas-Frontier-Matrix'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: docs/soil-no-network-runbook-20260829
          persist-credentials: true

      - name: Reconcile current main and preserve both grounded runbooks
        shell: bash
        run: |
          set -euo pipefail
          branch='docs/soil-no-network-runbook-20260829'
          workflow='.github/workflows/reconcile-pr-3878.yml'
          readme='docs/runbooks/soil/README.md'

          git config user.name 'kfm-reconciliation-bot'
          git config user.email '203533328+bartytime4life@users.noreply.github.com'
          git fetch origin main

          merge_status=0
          git merge --no-commit --no-ff origin/main || merge_status=$?
          if (( merge_status != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ ${#conflicts[@]} -ne 1 || "${conflicts[0]}" != "$readme" ]]; then
              printf 'Unexpected merge conflicts:\n' >&2
              printf ' - %s\n' "${conflicts[@]}" >&2
              exit 1
            fi
            git checkout --theirs -- "$readme"
            git add "$readme"
          fi

          python <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path('docs/runbooks/soil/README.md')
          text = path.read_text(encoding='utf-8')
          main_sha = subprocess.check_output(
              ['git', 'rev-parse', 'origin/main'], text=True
          ).strip()
          main_readme_blob = subprocess.check_output(
              ['git', 'rev-parse', 'origin/main:docs/runbooks/soil/README.md'], text=True
          ).strip()
          no_network_blob = subprocess.check_output(
              ['git', 'hash-object', 'docs/runbooks/soil/NO_NETWORK_TEST_RUNBOOK.md'], text=True
          ).strip()

          text = text.replace('version: v1.1\n', 'version: v1.2\nprior_version: v1.1\n', 1)
          text = re.sub(
              r'^status: .*$',
              'status: draft; repository-grounded; bounded synthetic validation executable; no-network procedure and rollback-readiness assessment repository-grounded; live source operation, proof, policy activation, rollback execution, promotion, release, deployment, and publication held',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r'^  base_commit: [0-9a-f]+$',
              f'  base_commit: {main_sha}',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          prior_line = '  no_network_runbook_blob: d42e18386911dcc008a9045c38e052ce673bfda4\n'
          replacement = (
              '  no_network_runbook_prior_blob: d42e18386911dcc008a9045c38e052ce673bfda4\n'
              f'  no_network_runbook_head_blob: {no_network_blob}\n'
              f'  reconciliation_base_readme_blob: {main_readme_blob}\n'
          )
          if prior_line not in text:
              raise SystemExit('no-network metadata anchor not found')
          text = text.replace(prior_line, replacement, 1)
          text = text.replace(
              '  repository_grounded_child_procedures: 1\n',
              '  repository_grounded_child_procedures: 2\n',
              1,
          )
          text = text.replace(
              '  proposal_or_stale_child_procedures: 3\n',
              '  proposal_or_stale_child_procedures: 2\n',
              1,
          )
          text = text.replace(
              '  - "NO_NETWORK_TEST_RUNBOOK.md, PROMOTION_RUNBOOK.md, and SOURCE_REFRESH_RUNBOOK.md remain proposal-heavy or stale and must not be treated as current live procedures."',
              '  - "NO_NETWORK_TEST_RUNBOOK.md is now a repository-grounded, fixture-only procedure; PROMOTION_RUNBOOK.md and SOURCE_REFRESH_RUNBOOK.md remain proposal-heavy or stale."',
              1,
          )
          rollback_note = (
              '  - "ROLLBACK_RUNBOOK.md is now a repository-grounded candidate-assessment and handoff procedure; it still provides no operational rollback authority."\n'
          )
          no_network_note = (
              rollback_note
              + '  - "NO_NETWORK_TEST_RUNBOOK.md now records the four workflow-bound commands, fixture polarity, Python test-level egress guards, finite outcomes, and explicit proof/release holds."\n'
          )
          if rollback_note not in text:
              raise SystemExit('rollback note anchor not found')
          text = text.replace(rollback_note, no_network_note, 1)

          ssurgo_row = (
              '| SSURGO package-drift comparison | The workflow invokes `python -m unittest tests.ingest.ssurgo_watch.test_ssurgo_watch --verbose` | Fixture-only comparator proof; no live SSURGO retrieval, currentness, rights, identity, or admission is established |\n'
          )
          no_network_rows = (
              ssurgo_row
              + '| No-network procedure | [`NO_NETWORK_TEST_RUNBOOK.md`](./NO_NETWORK_TEST_RUNBOOK.md) reproduces the four commands bound by the active Soil workflow and records exact fixture polarity and hold semantics | Repository-grounded fixture-only procedure; no source retrieval, proof production, release action, or public operation is established |\n'
              + '| No-network isolation | The named suites install targeted Python test-level socket, DNS, or URL-open guards and set `KFM_NO_NETWORK=1` | Bounded to the APIs and process paths explicitly tested; runner-wide, dependency-install, operating-system, container, namespace, and non-Python egress denial remain unproved |\n'
          )
          if ssurgo_row not in text:
              raise SystemExit('SSURGO status-row anchor not found')
          text = text.replace(ssurgo_row, no_network_rows, 1)
          text = text.replace(
              '| Remaining child procedures | Three long-form child runbooks retain proposal-era assumptions, unverified commands, or live-operation concepts | Planning and review context only; length is not operational maturity |',
              '| Remaining child procedures | Two long-form child runbooks retain proposal-era assumptions, unverified commands, or live-operation concepts | Planning and review context only; length is not operational maturity |',
              1,
          )

          bounded_heading = '<a id="current-bounded-checks"></a>\n\n## Current bounded checks\n\n'
          bounded_intro = (
              bounded_heading
              + 'Use the repository-grounded [`NO_NETWORK_TEST_RUNBOOK.md`](./NO_NETWORK_TEST_RUNBOOK.md)\n'
              + 'for preflight, execution, fixture-polarity interpretation, failure classification,\n'
              + 'and result recording. It remains bounded to the four active fixture-only suites.\n\n'
          )
          if bounded_heading not in text:
              raise SystemExit('current-bounded-checks anchor not found')
          text = text.replace(bounded_heading, bounded_intro, 1)

          stale_child = (
              '| [`NO_NETWORK_TEST_RUNBOOK.md`](./NO_NETWORK_TEST_RUNBOOK.md) | **Proposal-heavy and stale** | Planning reference only. Its proposed make, pytest, environment, probe, and receipt surfaces are not the active command inventory. Use [Current bounded checks](#current-bounded-checks). |'
          )
          grounded_child = (
              '| [`NO_NETWORK_TEST_RUNBOOK.md`](./NO_NETWORK_TEST_RUNBOOK.md) | **Repository-grounded bounded procedure** | Reproduce the four active synthetic fixture suites, interpret exact positive/negative fixture polarity and SSURGO comparator outcomes, and record the limits of the test-level Python network guards. It does not establish runner-wide isolation, Soil truth, proof, release, or publication. |'
          )
          if stale_child not in text:
              raise SystemExit('stale no-network child row not found')
          text = text.replace(stale_child, grounded_child, 1)
          text = text.replace(
              '| Run current bounded offline checks | [Current bounded checks](#current-bounded-checks) and the active Soil workflow | Stop if paths, SHA, fixture inventory, expected-negative polarity, or no-network posture differs |',
              '| Run current bounded no-network checks | [`NO_NETWORK_TEST_RUNBOOK.md`](./NO_NETWORK_TEST_RUNBOOK.md) and the active Soil workflow | Stop if paths, SHA, fixture inventory, expected-negative polarity, or no-network posture differs |',
              1,
          )

          required = [
              'version: v1.2',
              'repository_grounded_child_procedures: 2',
              'proposal_or_stale_child_procedures: 2',
              '**Repository-grounded bounded procedure**',
              '| No-network isolation |',
              '| Rollback readiness |',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing reconciled marker: {marker}')
          forbidden = [
              '**Proposal-heavy and stale**',
              'NO_NETWORK_TEST_RUNBOOK.md, PROMOTION_RUNBOOK.md, and SOURCE_REFRESH_RUNBOOK.md remain proposal-heavy',
              '<<<<<<<',
              '=======',
              '>>>>>>>',
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f'forbidden stale/conflict marker remains: {marker}')

          text = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
          path.write_text(text, encoding='utf-8')
          PY

          rm "$workflow"
          git add -A
          git diff --cached --check
          git commit -m 'docs(soil): reconcile grounded no-network and rollback boundaries'
          git push origin "HEAD:$branch"

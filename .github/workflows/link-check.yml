# KFM bounded local documentation link check.
#
# The stable workflow name and job id are preserved. The job checks only local
# inline and defined reference-style Markdown file, directory, image, and
# fragment targets in Markdown files
# changed by the triggering revision. It classifies external URLs as unverified
# and never requests them. A green result is documentation QA, not evidence,
# policy, review, release, deployment, or publication authority.
name: link-check

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  docs-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out documentation QA boundaries
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run deterministic no-network link-check tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators/docs/link-check \
            --pattern 'test_*.py' \
            --verbose

      - name: Validate local targets in changed Markdown
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi

          python tools/validators/docs/link-check/check_links.py \
            --repo-root . \
            --git-diff "${base_sha}...HEAD" \
            --format text

      - name: Record bounded link-check result
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Documentation link check"
            echo "- Outcome: DOC_LINK_CHECK_PASS"
            echo "- Scope: local inline and defined reference-style Markdown targets in files changed by the triggering revision."
            echo "- Network: external targets were classified as EXTERNAL_TARGET_UNVERIFIED and were not requested."
            echo "- Coverage hold: multiline or nested-label reference definitions, undefined reference-like citations, inline HTML links, redirects, ignore rules, and historical unchanged documents remain outside this bounded check."
            echo "- Authority: link resolution is QA only, not truth, evidence, policy, review, release, deployment, or publication approval."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the fixture-only object-family/domain reference profile candidate.
name: object-family-domain-reference-profile

"on":
  pull_request:
    paths:
      - ".github/workflows/object-family-domain-reference-profile.yml"
      - "contracts/governance/object_family_domain_reference_profile.md"
      - "schemas/contracts/v1/governance/object_family_domain_reference_profile.schema.json"
      - "fixtures/contracts/v1/governance/object_family_domain_reference_profile/**"
      - "tools/validators/governance/validate_object_family_domain_reference_profile.py"
      - "tests/validators/governance/test_object_family_domain_reference_profile.py"
      - "docs/intake/exploratory/object-family-domain-reference-profile-source-map.md"
      - "control_plane/domain_lane_register.yaml"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-object-family-domain-reference-profile-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/object-family-domain-reference-profile.yml"
      - "contracts/governance/object_family_domain_reference_profile.md"
      - "schemas/contracts/v1/governance/object_family_domain_reference_profile.schema.json"
      - "fixtures/contracts/v1/governance/object_family_domain_reference_profile/**"
      - "tools/validators/governance/validate_object_family_domain_reference_profile.py"
      - "tests/validators/governance/test_object_family_domain_reference_profile.py"
      - "docs/intake/exploratory/object-family-domain-reference-profile-source-map.md"
      - "control_plane/domain_lane_register.yaml"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-object-family-domain-reference-profile-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: object-family-domain-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-object-family-domain-reference-profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests and fixture replay
        run: |
          python -m unittest -v \
            tests.validators.governance.test_object_family_domain_reference_profile
          python tools/validators/governance/validate_object_family_domain_reference_profile.py \
            --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-object-family-domain-reference-profile-20260809.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### ObjectFamilyDomainReferenceProfileCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only owner/citing-domain/sensitivity-default reference consistency."
            echo "- Boundary: no owner assignment, register write, cross-domain mutation, sensitivity-policy decision, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

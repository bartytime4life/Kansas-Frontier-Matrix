# Validate the fixture-only verifier capability portability candidate.
name: verifier-capability-portability

"on":
  pull_request:
    paths:
      - ".github/workflows/verifier-capability-portability.yml"
      - "contracts/evidence/verifier_capability_portability.md"
      - "schemas/contracts/v1/evidence/verifier_capability_portability.schema.json"
      - "fixtures/contracts/v1/evidence/verifier_capability_portability/**"
      - "tools/validators/validate_verifier_capability_portability.py"
      - "tests/validators/test_validate_verifier_capability_portability.py"
      - "docs/intake/exploratory/verifier-capability-portability-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-verifier-capability-portability-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/verifier-capability-portability.yml"
      - "contracts/evidence/verifier_capability_portability.md"
      - "schemas/contracts/v1/evidence/verifier_capability_portability.schema.json"
      - "fixtures/contracts/v1/evidence/verifier_capability_portability/**"
      - "tools/validators/validate_verifier_capability_portability.py"
      - "tests/validators/test_validate_verifier_capability_portability.py"
      - "docs/intake/exploratory/verifier-capability-portability-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-verifier-capability-portability-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifier-capability-portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-verifier-capability-portability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_verifier_capability_portability.py' \
            --verbose
          python tools/validators/validate_verifier_capability_portability.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-verifier-capability-portability-20260809.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### VerifierCapabilityPortabilityAssessmentCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic verifier profiles, declared capabilities, environment limits, deterministic comparison, and finite portability outcomes."
            echo "- Boundary: no artifact resolution, cryptography, trust loading, revocation service, policy, review, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

name: after-image-reconstruction-record

"on":
  pull_request:
    paths:
      - ".github/workflows/after-image-reconstruction-record.yml"
      - "contracts/evidence/after_image_reconstruction_record.md"
      - "schemas/contracts/v1/evidence/after_image_reconstruction_record.schema.json"
      - "fixtures/contracts/v1/evidence/after_image_reconstruction_record/**"
      - "tools/validators/evidence/validate_after_image_reconstruction_record.py"
      - "tests/validators/evidence/test_validate_after_image_reconstruction_record.py"
      - "docs/intake/exploratory/pass-18-after-image-reconstruction-record-source-map.md"
      - "data/receipts/generated/genrec-pass18-after-image-reconstruction-record-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/after-image-reconstruction-record.yml"
      - "contracts/evidence/after_image_reconstruction_record.md"
      - "schemas/contracts/v1/evidence/after_image_reconstruction_record.schema.json"
      - "fixtures/contracts/v1/evidence/after_image_reconstruction_record/**"
      - "tools/validators/evidence/validate_after_image_reconstruction_record.py"
      - "tests/validators/evidence/test_validate_after_image_reconstruction_record.py"
      - "docs/intake/exploratory/pass-18-after-image-reconstruction-record-source-map.md"
      - "data/receipts/generated/genrec-pass18-after-image-reconstruction-record-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: after-image-reconstruction-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-after-image-reconstruction-record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/evidence/validate_after_image_reconstruction_record.py tests/validators/evidence/test_validate_after_image_reconstruction_record.py
          python -m unittest tests.validators.evidence.test_validate_after_image_reconstruction_record --verbose
          python tools/validators/evidence/validate_after_image_reconstruction_record.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-after-image-reconstruction-record-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### After-image reconstruction record"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only tracking-log binding, temporal ordering, reference-only after-image mode, reconstruction support, retention, minimization, sensitivity, review, and content-hash coherence."
            echo "- Boundary: no state payload, temporal reconstruction, tracking-log write, correction or lifecycle mutation, evidence or policy decision, review approval, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

name: open-ended-temporal-semantics-disclosure

"on":
  pull_request:
    paths:
      - ".github/workflows/open-ended-temporal-semantics-disclosure.yml"
      - "contracts/common/open_ended_temporal_semantics_disclosure.md"
      - "schemas/contracts/v1/common/open_ended_temporal_semantics_disclosure.schema.json"
      - "fixtures/contracts/v1/common/open_ended_temporal_semantics_disclosure/**"
      - "tools/validators/validate_open_ended_temporal_semantics_disclosure.py"
      - "tests/validators/test_validate_open_ended_temporal_semantics_disclosure.py"
      - "docs/intake/exploratory/pass-18-open-ended-temporal-semantics-disclosure-source-map.md"
      - "data/receipts/generated/genrec-pass18-open-ended-temporal-semantics-disclosure-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/open-ended-temporal-semantics-disclosure.yml"
      - "contracts/common/open_ended_temporal_semantics_disclosure.md"
      - "schemas/contracts/v1/common/open_ended_temporal_semantics_disclosure.schema.json"
      - "fixtures/contracts/v1/common/open_ended_temporal_semantics_disclosure/**"
      - "tools/validators/validate_open_ended_temporal_semantics_disclosure.py"
      - "tests/validators/test_validate_open_ended_temporal_semantics_disclosure.py"
      - "docs/intake/exploratory/pass-18-open-ended-temporal-semantics-disclosure-source-map.md"
      - "data/receipts/generated/genrec-pass18-open-ended-temporal-semantics-disclosure-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-ended-temporal-semantics-disclosure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-open-ended-temporal-semantics-disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to replay the unchanged historical receipt below.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/validate_open_ended_temporal_semantics_disclosure.py tests/validators/test_validate_open_ended_temporal_semantics_disclosure.py
          python -m unittest tests.validators.test_validate_open_ended_temporal_semantics_disclosure --verbose
          python tools/validators/validate_open_ended_temporal_semantics_disclosure.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-open-ended-temporal-semantics-disclosure-20260811.json --repo-root . --artifact-git-ref 6f69e1eb13fd04df3fd4cc9869333f6d398f829b
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Open-ended temporal semantics disclosure candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only identity, UTC/order, end-semantics, as-of, now-basis, sentinel, obligation, review-reference, and canonical-order validation."
            echo "- Boundary: no claim or evidence resolution; temporal truth, policy, or review decision; promotion; release; deployment; publication; or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

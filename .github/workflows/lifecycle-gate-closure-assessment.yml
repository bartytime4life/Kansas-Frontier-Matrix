# Validate the fixture-only lifecycle-gate closure assessment candidate.
name: lifecycle-gate-closure-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/lifecycle-gate-closure-assessment.yml"
      - "contracts/governance/lifecycle_gate_closure_assessment.md"
      - "schemas/contracts/v1/governance/lifecycle_gate_closure_assessment.schema.json"
      - "fixtures/contracts/v1/governance/lifecycle_gate_closure_assessment/**"
      - "tools/validators/governance/validate_lifecycle_gate_closure_assessment.py"
      - "tests/validators/governance/test_validate_lifecycle_gate_closure_assessment.py"
      - "docs/intake/exploratory/lifecycle-gate-closure-assessment-source-map.md"
      - "docs/atlases/pipeline-gate-reference.md"
      - "contracts/governance/gate_outcome_mapping.md"
      - "contracts/release/promotion_decision.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-lifecycle-gate-closure-assessment-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lifecycle-gate-closure-assessment.yml"
      - "contracts/governance/lifecycle_gate_closure_assessment.md"
      - "schemas/contracts/v1/governance/lifecycle_gate_closure_assessment.schema.json"
      - "fixtures/contracts/v1/governance/lifecycle_gate_closure_assessment/**"
      - "tools/validators/governance/validate_lifecycle_gate_closure_assessment.py"
      - "tests/validators/governance/test_validate_lifecycle_gate_closure_assessment.py"
      - "docs/intake/exploratory/lifecycle-gate-closure-assessment-source-map.md"
      - "docs/atlases/pipeline-gate-reference.md"
      - "contracts/governance/gate_outcome_mapping.md"
      - "contracts/release/promotion_decision.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-lifecycle-gate-closure-assessment-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifecycle-gate-closure-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-lifecycle-gate-closure-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to replay the unchanged historical receipt below.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused and adjacent deterministic tests
        run: |
          python -m unittest -v tests.validators.governance.test_validate_lifecycle_gate_closure_assessment
          python -m unittest -v tests.validators.test_validate_gate_outcome_mapping
          python tools/validators/governance/validate_lifecycle_gate_closure_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-lifecycle-gate-closure-assessment-20260809.json \
            --repo-root . \
            --artifact-git-ref c52d347520f23196d2f6e3d210d186922e51ca25
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### LifecycleGateClosureAssessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only seven-gate artifact, dependency, PolicyDecision, and failure-disposition closure assessment."
            echo "- Boundary: no reference resolution, policy evaluation, lifecycle write, promotion, release, correction, rollback, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

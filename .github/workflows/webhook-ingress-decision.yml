# Validate the proposed webhook ingress decision profile.
name: webhook-ingress-decision

"on":
  pull_request:
    paths:
      - ".github/workflows/webhook-ingress-decision.yml"
      - "contracts/source/webhook_ingress_decision.md"
      - "docs/intake/exploratory/new-ideas-3-16-26-webhook-ingress-source-map.md"
      - "schemas/contracts/v1/source/webhook_ingress_decision.schema.json"
      - "fixtures/contracts/v1/source/webhook_ingress_decision/**"
      - "tools/validators/validate_webhook_ingress_decision.py"
      - "tests/validators/test_validate_webhook_ingress_decision.py"
      - "data/receipts/generated/genrec-webhook-ingress-decision-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/webhook-ingress-decision.yml"
      - "contracts/source/webhook_ingress_decision.md"
      - "docs/intake/exploratory/new-ideas-3-16-26-webhook-ingress-source-map.md"
      - "schemas/contracts/v1/source/webhook_ingress_decision.schema.json"
      - "fixtures/contracts/v1/source/webhook_ingress_decision/**"
      - "tools/validators/validate_webhook_ingress_decision.py"
      - "tests/validators/test_validate_webhook_ingress_decision.py"
      - "data/receipts/generated/genrec-webhook-ingress-decision-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webhook-ingress-decision-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-webhook-ingress-decision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run deterministic no-network test vectors
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_webhook_ingress_decision.py' \
            --verbose
          python tools/validators/validate_webhook_ingress_decision.py --fixtures
      - name: Verify generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-webhook-ingress-decision-20260805.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Webhook ingress decision"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic signature/timestamp/nonce posture, replay-safe idempotency, conditional-poll fallback, finite routing, and no-secret/no-public-authority invariants."
            echo "- Boundary: a green result does not verify a provider signature, activate a source, persist an event, write RAW, operate a queue or DLQ, evaluate policy, attest materialization, promote, release, deploy, publish, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"

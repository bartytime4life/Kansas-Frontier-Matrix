# Exercise the synthetic, no-network Kansas Mesonet Soil normalizer boundary.
name: soil-mesonet-fixture-normalizer

"on":
  pull_request:
    paths:
      - ".github/workflows/soil-mesonet-fixture-normalizer.yml"
      - "pipelines/domains/soil/mesonet_normalizer/fixture_normalizer.py"
      - "fixtures/domains/soil/mesonet_normalizer/**"
      - "tests/pipelines/domains/soil/mesonet_normalizer/**"
      - "data/receipts/generated/genrec-soil-mesonet-fixture-normalizer-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/soil-mesonet-fixture-normalizer.yml"
      - "pipelines/domains/soil/mesonet_normalizer/fixture_normalizer.py"
      - "fixtures/domains/soil/mesonet_normalizer/**"
      - "tests/pipelines/domains/soil/mesonet_normalizer/**"
      - "data/receipts/generated/genrec-soil-mesonet-fixture-normalizer-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soil-mesonet-fixture-normalizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-mesonet-fixture-normalizer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic fixture-normalizer tests
        run: |
          set -euo pipefail
          python -m pytest \
            tests/pipelines/domains/soil/mesonet_normalizer/test_fixture_normalizer.py \
            -q --strict-config --strict-markers

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-soil-mesonet-fixture-normalizer-20260805.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Synthetic Kansas Mesonet Soil normalizer"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: one fixture-only station observation and deterministic negative mutations."
            echo "- Preserved: station identity, depth, native/output cadence, station health, source timezone, rights/consent posture, QC flags, generalized county support, and provenance refs."
            echo "- Boundary: no source activation, network access, lifecycle write, evidence resolution, policy decision, promotion, release, publication, alert, or agronomic advice."
          } >> "$GITHUB_STEP_SUMMARY"

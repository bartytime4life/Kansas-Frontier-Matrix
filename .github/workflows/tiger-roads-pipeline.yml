name: tiger-roads-pipeline
"on":
  pull_request:
    paths:
      - ".github/workflows/tiger-roads-pipeline.yml"
      - "pipelines/domains/roads-rail-trade/ingest_tiger_roads.py"
      - "pipeline_specs/roads-rail-trade/tiger_roads.yaml"
      - "connectors/census/src/census/tiger_package.py"
      - "connectors/census/tiger-line-2025-kansas-core.source-reference.json"
      - "connectors/census/tests/test_tiger_package.py"
      - "packages/connectors-core/**"
      - "contracts/domains/roads-rail-trade/tiger_roads_ingest_candidate.md"
      - "contracts/domains/roads-rail-trade/road_segment.md"
      - "schemas/contracts/v1/domains/roads-rail-trade/tiger_roads_ingest_candidate.schema.json"
      - "data/registry/roads-rail-trade/sources/census_tiger_roads.yaml"
      - "fixtures/domains/roads-rail-trade/tiger_roads_ingest/**"
      - "tests/pipelines/domains/roads_rail_trade/**"
      - "tools/local_data/file_io.py"
      - "tools/ci/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tiger-roads-pipeline.yml"
      - "pipelines/domains/roads-rail-trade/ingest_tiger_roads.py"
      - "pipeline_specs/roads-rail-trade/tiger_roads.yaml"
      - "connectors/census/src/census/tiger_package.py"
      - "connectors/census/tiger-line-2025-kansas-core.source-reference.json"
      - "connectors/census/tests/test_tiger_package.py"
      - "packages/connectors-core/**"
      - "contracts/domains/roads-rail-trade/tiger_roads_ingest_candidate.md"
      - "contracts/domains/roads-rail-trade/road_segment.md"
      - "schemas/contracts/v1/domains/roads-rail-trade/tiger_roads_ingest_candidate.schema.json"
      - "data/registry/roads-rail-trade/sources/census_tiger_roads.yaml"
      - "fixtures/domains/roads-rail-trade/tiger_roads_ingest/**"
      - "tests/pipelines/domains/roads_rail_trade/**"
      - "tools/local_data/file_io.py"
      - "tools/ci/**"
      - "pyproject.toml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiger-roads-pipeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    name: tiger-roads-fixture-replay (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/ci/python-test.lock
      - name: Install locked test and capture dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test
          python tools/ci/install_python_ci.py connectors-core
      - name: Validate and replay without network access
        env:
          KFM_NO_NETWORK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/tools/ci/kfm_no_network:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -B tools/validators/validate_pipeline_spec_declarations.py
          python -B -m pytest tests/pipelines/domains/roads_rail_trade/test_tiger_roads_ingest.py connectors/census/tests/test_tiger_package.py -q --strict-config --strict-markers
          python -B -m pipelines.domains.roads-rail-trade.ingest_tiger_roads clean
          python -B -m pipelines.domains.roads-rail-trade.ingest_tiger_roads duplicate-identity

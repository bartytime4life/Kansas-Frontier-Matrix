name: analytical-view-manifest

"on":
  pull_request:
    paths:
      - ".github/workflows/analytical-view-manifest.yml"
      - "contracts/data/analytical_view_manifest.md"
      - "schemas/contracts/v1/data/analytical_view_manifest.schema.json"
      - "fixtures/contracts/v1/data/analytical_view_manifest/**"
      - "tools/validators/data/validate_analytical_view_manifest.py"
      - "tests/validators/data/test_validate_analytical_view_manifest.py"
      - "docs/intake/exploratory/pass-18-analytical-view-manifest-source-map.md"
      - "data/receipts/generated/genrec-pass18-analytical-view-manifest-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/analytical-view-manifest.yml"
      - "contracts/data/analytical_view_manifest.md"
      - "schemas/contracts/v1/data/analytical_view_manifest.schema.json"
      - "fixtures/contracts/v1/data/analytical_view_manifest/**"
      - "tools/validators/data/validate_analytical_view_manifest.py"
      - "tests/validators/data/test_validate_analytical_view_manifest.py"
      - "docs/intake/exploratory/pass-18-analytical-view-manifest-source-map.md"
      - "data/receipts/generated/genrec-pass18-analytical-view-manifest-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytical-view-manifest-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-analytical-view-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to replay the unchanged historical receipt below.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/data/validate_analytical_view_manifest.py tests/validators/data/test_validate_analytical_view_manifest.py
          python -m unittest tests.validators.data.test_validate_analytical_view_manifest --verbose
          python tools/validators/data/validate_analytical_view_manifest.py --fixtures
      - name: Validate generated authoring receipt
        shell: bash
        run: |
          set -euo pipefail
          # This receipt's workflow digest was accepted only through the one-time
          # migration ledger, which Dependabot 27676fd1 made stale. Replay the receipt,
          # its artifacts and the ledger exactly as they stood at that commit's parent.
          ref=de7ec1d5aa39b9db46672189986212e5eb0a1026
          receipt=data/receipts/generated/genrec-pass18-analytical-view-manifest-20260811.json
          root="$RUNNER_TEMP/receipt-replay-genrec-pass18-analytical-view-manifest-20260811"
          rm -rf "$root"
          mkdir -p "$root"
          git show "$ref:$receipt" \
            | python -c 'import json, sys; sys.stdout.write("\0".join(json.load(sys.stdin)["artifact_paths"]))' \
            | xargs -0 git archive "$ref" -- "$receipt" tools/ci/python-dependency-lock-migration.json \
            | tar -x -C "$root"
          python tools/validators/validate_generated_receipt.py "$root/$receipt" --repo-root "$root"
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Analytical view manifest"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only definition, upstream, semantic-dependency, validation, refresh, mutation-guard, review, rollback, and identity coherence."
            echo "- Boundary: no raw SQL or database endpoints, view creation, query execution, data mutation, refresh, evidence or policy decision, review approval, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the fixture-only analytic-output disclosure assessment candidate.
name: analytic-output-disclosure-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/analytic-output-disclosure-assessment.yml"
      - "contracts/evidence/analytic_output_disclosure_assessment.md"
      - "schemas/contracts/v1/evidence/analytic_output_disclosure_assessment.schema.json"
      - "fixtures/contracts/v1/evidence/analytic_output_disclosure_assessment/**"
      - "tools/validators/evidence/validate_analytic_output_disclosure_assessment.py"
      - "tests/validators/evidence/test_validate_analytic_output_disclosure_assessment.py"
      - "docs/intake/exploratory/analytic-output-disclosure-assessment-source-map.md"
      - "contracts/evidence/evidence_bundle.md"
      - "contracts/governance/model_card_envelope.md"
      - "contracts/runtime/run_receipt.md"
      - "contracts/data/validation_report.md"
      - "contracts/source/source_role_transition_assessment.md"
      - "contracts/evidence/representation_fitness_assessment.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-analytic-output-disclosure-assessment-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/analytic-output-disclosure-assessment.yml"
      - "contracts/evidence/analytic_output_disclosure_assessment.md"
      - "schemas/contracts/v1/evidence/analytic_output_disclosure_assessment.schema.json"
      - "fixtures/contracts/v1/evidence/analytic_output_disclosure_assessment/**"
      - "tools/validators/evidence/validate_analytic_output_disclosure_assessment.py"
      - "tests/validators/evidence/test_validate_analytic_output_disclosure_assessment.py"
      - "docs/intake/exploratory/analytic-output-disclosure-assessment-source-map.md"
      - "contracts/evidence/evidence_bundle.md"
      - "contracts/governance/model_card_envelope.md"
      - "contracts/runtime/run_receipt.md"
      - "contracts/data/validation_report.md"
      - "contracts/source/source_role_transition_assessment.md"
      - "contracts/evidence/representation_fitness_assessment.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-analytic-output-disclosure-assessment-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytic-output-disclosure-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-analytic-output-disclosure-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused and adjacent deterministic tests
        run: |
          python -m unittest -v tests.validators.evidence.test_validate_analytic_output_disclosure_assessment
          python -m unittest -v tests.validators.governance.test_validate_model_card_envelope
          python -m pytest -q \
            tests/source/test_source_role_transition_assessment.py \
            tests/evidence/test_representation_fitness_assessment.py
          python tools/validators/evidence/validate_analytic_output_disclosure_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-analytic-output-disclosure-assessment-20260809.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### AnalyticOutputDisclosureAssessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only output-level evidence, method, assumptions, uncertainty, validation, confidence, citation, and interpretation-limit disclosure assessment."
            echo "- Boundary: no reference resolution, analysis execution, evidence creation, policy evaluation, review approval, promotion, release, public use, publication, or deployment authority."
          } >> "$GITHUB_STEP_SUMMARY"

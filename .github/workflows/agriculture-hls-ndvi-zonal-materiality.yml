# Validate fixture-only HLS NDVI zonal materiality assessments.
name: agriculture-hls-ndvi-zonal-materiality

"on":
  pull_request:
    paths:
      - ".github/workflows/agriculture-hls-ndvi-zonal-materiality.yml"
      - "contracts/domains/agriculture/hls_ndvi_zonal_materiality.md"
      - "schemas/contracts/v1/domains/agriculture/hls_ndvi_zonal_materiality_assessment.schema.json"
      - "tools/validators/domains/agriculture/hls_ndvi_zonal_materiality/**"
      - "fixtures/domains/agriculture/hls_ndvi_zonal_materiality/**"
      - "tests/validators/domains/agriculture/hls_ndvi_zonal_materiality/**"
      - "data/receipts/generated/genrec-agriculture-hls-ndvi-zonal-materiality-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agriculture-hls-ndvi-zonal-materiality.yml"
      - "contracts/domains/agriculture/hls_ndvi_zonal_materiality.md"
      - "schemas/contracts/v1/domains/agriculture/hls_ndvi_zonal_materiality_assessment.schema.json"
      - "tools/validators/domains/agriculture/hls_ndvi_zonal_materiality/**"
      - "fixtures/domains/agriculture/hls_ndvi_zonal_materiality/**"
      - "tests/validators/domains/agriculture/hls_ndvi_zonal_materiality/**"
      - "data/receipts/generated/genrec-agriculture-hls-ndvi-zonal-materiality-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agriculture-hls-ndvi-zonal-materiality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-hls-ndvi-zonal-materiality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic zonal materiality tests
        run: |
          set -euo pipefail
          python -m pytest \
            tests/validators/domains/agriculture/hls_ndvi_zonal_materiality/test_validate_hls_ndvi_zonal_materiality.py \
            -q --strict-config --strict-markers

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-agriculture-hls-ndvi-zonal-materiality-20260806.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Fixture-only HLS NDVI zonal materiality"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: precomputed equal-area grid, mask-count closure, source-change, signal-change, and valid-coverage semantics."
            echo "- Boundary: no STAC access, raster processing, NDVI calculation, COG creation, alerting, promotion, release, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

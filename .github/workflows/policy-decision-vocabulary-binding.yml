name: policy-decision-vocabulary-binding

"on":
  pull_request:
    paths:
      - ".github/workflows/policy-decision-vocabulary-binding.yml"
      - "contracts/policy/policy_decision.md"
      - "schemas/contracts/v1/policy/policy_decision.schema.json"
      - "policy/decision/vocabulary.v1.json"
      - "tools/validators/policy/validate_policy_decision_vocabulary_binding.py"
      - "fixtures/contracts/v1/policy/policy_decision/vocabulary_binding/**"
      - "tests/validators/test_validate_policy_decision_vocabulary_binding.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/policy-decision-vocabulary-binding.yml"
      - "contracts/policy/policy_decision.md"
      - "schemas/contracts/v1/policy/policy_decision.schema.json"
      - "policy/decision/vocabulary.v1.json"
      - "tools/validators/policy/validate_policy_decision_vocabulary_binding.py"
      - "fixtures/contracts/v1/policy/policy_decision/vocabulary_binding/**"
      - "tests/validators/test_validate_policy_decision_vocabulary_binding.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-policy-decision-vocabulary-binding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run focused deterministic tests
        run: |
          set -euo pipefail
          python -m pytest tests/validators/test_validate_policy_decision_vocabulary_binding.py -q --strict-config --strict-markers

      - name: Prove valid bindings through CLI
        run: |
          set -euo pipefail
          python tools/validators/policy/validate_policy_decision_vocabulary_binding.py \
            fixtures/contracts/v1/policy/policy_decision/vocabulary_binding/valid/answer_render.json
          python tools/validators/policy/validate_policy_decision_vocabulary_binding.py \
            fixtures/contracts/v1/policy/policy_decision/vocabulary_binding/valid/deny_rights.json

      - name: Prove invalid bindings fail closed
        run: |
          set -euo pipefail
          for fixture in \
            fixtures/contracts/v1/policy/policy_decision/vocabulary_binding/invalid/unknown_reason.json \
            fixtures/contracts/v1/policy/policy_decision/vocabulary_binding/invalid/outcome_mismatch.json
          do
            if python tools/validators/policy/validate_policy_decision_vocabulary_binding.py "$fixture"; then
              echo "expected denial for $fixture" >&2
              exit 1
            fi
          done

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### PolicyDecision vocabulary binding v1"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: schema-valid PolicyDecision reason/obligation codes checked against the PROPOSED_INACTIVE v1 registry."
            echo "- Boundary: no Rego evaluation, no PolicyDecision emission, no actor authentication, no promotion/release/publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

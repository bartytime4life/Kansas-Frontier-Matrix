name: sites-runtime-repair-validation

on:
  push:
    branches: [agent/sites-runtime-privacy-deeplink-20260912]
    paths:
      - .github/workflows/sites-runtime-repair-validation.yml
      - apps/kansas-frontier-matrix-explorer/**
      - packages/ui/src/**

permissions:
  contents: read

concurrency:
  group: sites-runtime-repair-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DO_NOT_TRACK: "1"
  CLOUDFLARE_SEND_METRICS: "false"
  WRANGLER_SEND_METRICS: "false"

jobs:
  native-sites-explorer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install exact frozen workspace
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build the Sites-derived Explorer
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter kansas-frontier-matrix-explorer build

      - name: Run the complete Sites-derived Node regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/kansas-frontier-matrix-explorer/tests/*.test.mjs

      - name: Typecheck the complete Sites-derived application
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter kansas-frontier-matrix-explorer exec tsc --noEmit

      - name: Install locked Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium

      - name: Verify the repaired flow in the actual HTTP composition
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter kansas-frontier-matrix-explorer exec vite --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/sites-runtime-repair-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:4173/ > /dev/null; then
              ready=1
              break
            fi
            kill -0 "$server_pid"
            sleep 2
          done
          test "$ready" = 1

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const consoleErrors = [];
          const pageErrors = [];
          page.on("console", (message) => {
            if (message.type() === "error") consoleErrors.push(message.text());
          });
          page.on("pageerror", (error) => pageErrors.push(error.message));

          const staleUrl = new URL("http://127.0.0.1:4173/");
          staleUrl.searchParams.set("ctx", "census-counties,nws-radar");
          staleUrl.searchParams.set("ctxo", "census-counties:0.72,nws-alerts:0.34,nws-radar:0.68");
          staleUrl.searchParams.set("ws", "trust");
          staleUrl.searchParams.set("f", "missing-feature");
          staleUrl.searchParams.set("panel", "evidence");
          staleUrl.searchParams.set("drawer", "open");
          staleUrl.searchParams.set("focusStage", "outcome");
          staleUrl.searchParams.set("focusIntent", "explain");
          await page.goto(staleUrl.toString(), { waitUntil: "networkidle" });
          await page.locator(".runtime-degraded-banner").waitFor();
          await page.locator('[aria-label="Open degraded-runtime guide"]').waitFor();

          const repairedUrl = new URL(page.url());
          assert.equal(repairedUrl.searchParams.get("ws"), "explore");
          assert.equal(repairedUrl.searchParams.has("f"), false);
          assert.equal(repairedUrl.searchParams.has("panel"), false);
          assert.equal(repairedUrl.searchParams.has("drawer"), false);
          assert.equal(page.url().includes("nws-alerts"), false);

          await page.locator('[aria-label="Open degraded-runtime guide"]').click();
          const dialog = page.getByRole("dialog", { name: "Explore trust states while the renderer is held" });
          await dialog.waitFor();
          assert.equal(await page.locator('[aria-label="Close degraded-runtime guide"]').evaluate((node) => node === document.activeElement), true);
          assert.match(await dialog.textContent(), /supported/i);
          assert.match(await dialog.textContent(), /corrected/i);
          assert.match(await dialog.textContent(), /protected context/i);
          await page.keyboard.press("Escape");
          await dialog.waitFor({ state: "detached" });

          const privacyUrl = new URL("http://127.0.0.1:4173/");
          privacyUrl.searchParams.set("privacy", "location-camera-redacted");
          privacyUrl.searchParams.set("c", "-97.78363,38.36655");
          privacyUrl.searchParams.set("z", "12.92");
          await page.goto(privacyUrl.toString(), { waitUntil: "networkidle" });
          await page.locator(".runtime-degraded-banner").waitFor();
          await page.waitForFunction(() => document.querySelector(".status-bar > span:nth-child(2)")?.textContent?.includes("coordinates redacted"));
          const visibleStatus = await page.locator(".status-bar > span:nth-child(2)").textContent();
          const assistiveStatus = await page.locator(".screenreader-status").textContent();
          assert.match(visibleStatus ?? "", /Private camera · coordinates redacted/);
          assert.doesNotMatch(visibleStatus ?? "", /38\.36655|97\.78363/);
          assert.match(assistiveStatus ?? "", /private camera, coordinates redacted/i);
          assert.doesNotMatch(assistiveStatus ?? "", /38\.36655|97\.78363/);

          assert.deepEqual(pageErrors, []);
          assert.deepEqual(consoleErrors, []);
          await browser.close();
          NODE

      - name: Verify the validation run did not mutate tracked files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short --untracked-files=no
          test -z "$(git status --short --untracked-files=no)"

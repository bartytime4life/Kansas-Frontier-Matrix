name: flora-evidence-bundle-convergence

on:
  pull_request:
    paths:
      - 'schemas/contracts/v1/evidence/evidence_bundle.schema.json'
      - 'schemas/contracts/v1/domains/flora/evidence_bundle.schema.json'
      - 'fixtures/contracts/v1/evidence/evidence_bundle/**'
      - 'tools/validators/domains/flora/validate_evidence_bundle.py'
      - 'tests/validators/domains/flora/test_evidence_bundle_schema_convergence.py'
      - '.github/workflows/flora-evidence-bundle-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install repository validation dependencies
        # This lane imports repository modules directly; installing the local
        # project would execute pull-request-controlled build metadata.
        run: python tools/ci/install_python_ci.py test-dependencies
      - name: Compile focused validator and tests
        run: >-
          python -m py_compile
          tools/validators/domains/flora/validate_evidence_bundle.py
          tests/validators/domains/flora/test_evidence_bundle_schema_convergence.py
      - name: Run deterministic convergence tests
        run: >-
          python -m unittest -q
          tests.validators.domains.flora.test_evidence_bundle_schema_convergence
      - name: Validate shared fixtures through the Flora projection
        run: python tools/validators/domains/flora/validate_evidence_bundle.py --fixtures

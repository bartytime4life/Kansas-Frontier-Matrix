name: map-georeference-control-point-set

"on":
  pull_request:
    paths:
      - ".github/workflows/map-georeference-control-point-set.yml"
      - "contracts/map/georeference_control_point_set.md"
      - "schemas/contracts/v1/map/georeference_control_point_set.schema.json"
      - "fixtures/contracts/v1/map/georeference_control_point_set/**"
      - "tools/validators/map/validate_georeference_control_point_set.py"
      - "tests/map/test_georeference_control_point_set.py"
      - "docs/intake/exploratory/georeference-control-point-set-source-map.md"
      - "data/receipts/generated/genrec-georeference-control-point-set-20260806.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-georeference-control-point-set.yml"
      - "contracts/map/georeference_control_point_set.md"
      - "schemas/contracts/v1/map/georeference_control_point_set.schema.json"
      - "fixtures/contracts/v1/map/georeference_control_point_set/**"
      - "tools/validators/map/validate_georeference_control_point_set.py"
      - "tests/map/test_georeference_control_point_set.py"
      - "docs/intake/exploratory/georeference-control-point-set-source-map.md"
      - "data/receipts/generated/genrec-georeference-control-point-set-20260806.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-georeference-control-point-set
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic tests
        run: python -m pytest -q tests/map/test_georeference_control_point_set.py
      - name: Run exact fixture polarity
        run: python tools/validators/map/validate_georeference_control_point_set.py --fixtures
      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-georeference-control-point-set-20260806.json
          --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Georeference control-point-set identity"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: canonical fixture GCP ordering, coordinate normalization, resource/target/full-set identity, and authoring-receipt integrity."
            echo "- Boundary: a green result does not authenticate GCPs, evaluate georeference quality or policy, or authorize release/publication."
          } >> "$GITHUB_STEP_SUMMARY"

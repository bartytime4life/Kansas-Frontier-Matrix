# Supplemental repository security checks.
#
# Existing companion workflows remain authoritative for their bounded lanes:
# - codeql.yml: CodeQL analysis for Python and JavaScript/TypeScript.
# - dependency-scan.yml: full Python and pnpm dependency audits.
#
# This workflow adds pull-request dependency-diff review, repository secret /
# misconfiguration scanning, container-image scanning, and default-branch OpenSSF
# Scorecard analysis. Scorecard SARIF is retained briefly for diagnostics and sent
# to code scanning; this workflow is a review signal, not proof that vulnerabilities
# are absent and not release or publication authority.
name: security

"on":
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review newly introduced dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          vulnerability-check: true
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: false
          warn-only: false

  repository-scan:
    name: repository-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce the deterministic workflow-security ratchet
        env:
          KFM_NO_NETWORK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          TZ: UTC
        run: python3 tools/validators/governance/validate_workflow_security.py

      - name: Scan repository dependencies, configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          timeout: 15m
          skip-dirs: .git,data/raw,data/work,data/quarantine
          cache: true

  container-scan:
    name: container-scan (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: explorer-web
            dockerfile: infra/docker/Dockerfile.explorer-web
            image: kfm/explorer-web:security-scan
          - component: governed-api
            dockerfile: infra/docker/Dockerfile.governed-api
            image: kfm/governed-api:security-scan
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the review image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker build \
            --file "${DOCKERFILE}" \
            --tag "${IMAGE}" \
            infra/docker

      - name: Scan the review image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.73.0
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          timeout: 15m
          cache: true

  scorecard:
    name: scorecard
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze supply-chain posture
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Retain Scorecard SARIF for diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5
          if-no-files-found: error

      - name: Upload Scorecard SARIF to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: scorecard-results.sarif

  security-result:
    name: security-result
    if: always()
    needs:
      - dependency-review
      - repository-scan
      - container-scan
      - scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarize finite security outcomes
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          REPOSITORY_SCAN_RESULT: ${{ needs.repository-scan.result }}
          CONTAINER_SCAN_RESULT: ${{ needs.container-scan.result }}
          SCORECARD_RESULT: ${{ needs.scorecard.result }}
        run: |
          set -euo pipefail

          {
            echo "### Security workflow"
            echo
            echo "- Dependency review: ${DEPENDENCY_REVIEW_RESULT}"
            echo "- Repository scan: ${REPOSITORY_SCAN_RESULT}"
            echo "- Container scan: ${CONTAINER_SCAN_RESULT}"
            echo "- OpenSSF Scorecard: ${SCORECARD_RESULT}"
            echo
            echo "Companion checks remain in codeql.yml and dependency-scan.yml."
            echo "This result is a review signal, not vulnerability-absence, release, or publication authority."
          } >> "${GITHUB_STEP_SUMMARY}"

          for result in \
            "${REPOSITORY_SCAN_RESULT}" \
            "${CONTAINER_SCAN_RESULT}"
          do
            case "${result}" in
              success) ;;
              *) exit 1 ;;
            esac
          done

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            [[ "${DEPENDENCY_REVIEW_RESULT}" == "success" ]]
          else
            [[ "${DEPENDENCY_REVIEW_RESULT}" == "skipped" ]]
          fi

          if [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "schedule" ]]; then
            [[ "${SCORECARD_RESULT}" == "success" ]]
          else
            [[ "${SCORECARD_RESULT}" == "skipped" ]]
          fi

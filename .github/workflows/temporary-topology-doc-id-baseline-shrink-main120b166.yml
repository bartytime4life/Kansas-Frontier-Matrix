# Temporary one-shot branch writer for the reviewed KFM-TOPO-016 strict evidence shrink.
# This workflow is removed from the review branch after it writes the baseline update.
name: temporary-topology-doc-id-baseline-shrink-main120b166

"on":
  push:
    branches:
      - review/topology-doc-id-baseline-shrink-a20d1ec-main120b166
    paths:
      - .github/workflows/temporary-topology-doc-id-baseline-shrink-main120b166.yml

permissions:
  contents: write

concurrency:
  group: temporary-topology-doc-id-baseline-shrink-main120b166
  cancel-in-progress: false

jobs:
  write:
    if: "${{ github.event.head_commit.message == 'chore(ci): stage current-main document-id baseline shrink' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 120b166c0196153e53c19f24a7563cdf3818ad62
      BASELINE_BLOB: cb654a1b89e83cedc681a7b66d05ecaa0da3517a
      BRANCH_NAME: review/topology-doc-id-baseline-shrink-a20d1ec-main120b166
      BASELINE_PATH: tools/validators/directory_governance/repository_topology_baseline.json
      OLD_FINGERPRINT: sha256:1831dfdc821f0553c6a55336d9e1e6122298db4ad1518232deb5f2b68cec6593
      NEW_FINGERPRINT: sha256:a20d1ec8834c7b3fc105ad3b01063e1ebc73b48fed9e5b7902d03ba1507de13b
    steps:
      - name: Check out exact writer head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify immutable base and concurrent-main boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA:$BASELINE_PATH")" = "$BASELINE_BLOB"
          live_main="$(git rev-parse origin/main)"
          test "$(git merge-base "$BASE_SHA" "$live_main")" = "$BASE_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$live_main" -- "$BASELINE_PATH")"
          printf 'BASE_SHA=%s\nLIVE_MAIN=%s\n' "$BASE_SHA" "$live_main"

      - name: Replace only the document-identity baseline evidence with a strict subset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import zlib
          from pathlib import Path

          path = Path(os.environ["BASELINE_PATH"])
          raw_before = path.read_text(encoding="utf-8")
          data = json.loads(raw_before)
          rule_id = "KFM-TOPO-016"
          subject = "doc-id:kfm://doc/NEEDS-VERIFICATION"

          old_members = (
              "data/registry/sources/habitat/README.md",
              "data/registry/sources/habitat/ecoregions/README.md",
              "data/registry/sources/hazards/README.md",
              "data/registry/sources/hydrology/README.md",
              "data/registry/sources/people-dna-land/README.md",
              "data/registry/sources/people-dna-land/land-ownership/README.md",
              "data/registry/sources/people/README.md",
              "docs/atlases/KFM_Domains_Culmination_Atlas_v1_1.md",
              "docs/atlases/KFM_Domains_v1_1_plus_Pass23_Pass32_Consolidated_Atlas.md",
              "docs/atlases/domains-atlas-v1.1.md",
              "docs/atlases/domains-v1.1-ch14.md",
              "docs/atlases/domains-v1.1.md",
              "docs/atlases/kfm-domains-v1.1-pass23-32-consolidated-atlas.md",
              "docs/atlases/maplibre-master.md",
              "docs/atlases/master-atlas-v1.1/24.1-source-role-anti-collapse.md",
              "docs/atlases/master-atlas-v1.1/24.2-receipt-lifecycle-mapping.md",
              "docs/atlases/pipeline-gate-reference.md",
              "docs/atlases/receipt-catalog.md",
              "docs/doctrine/ai-build-operating-contract.md",
              "docs/intake/IDEA_INTAKE.md",
              "docs/intake/carry-forward/README.md",
              "docs/intake/exploratory/README.md",
          )
          new_members = (
              "data/registry/sources/habitat/README.md",
              "data/registry/sources/habitat/ecoregions/README.md",
              "data/registry/sources/hazards/README.md",
              "data/registry/sources/hydrology/README.md",
              "data/registry/sources/people-dna-land/README.md",
              "data/registry/sources/people-dna-land/land-ownership/README.md",
              "data/registry/sources/people/README.md",
              "docs/atlases/maplibre-master.md",
              "docs/atlases/pipeline-gate-reference.md",
              "docs/atlases/receipt-catalog.md",
              "docs/doctrine/ai-build-operating-contract.md",
              "docs/intake/IDEA_INTAKE.md",
              "docs/intake/carry-forward/README.md",
              "docs/intake/exploratory/README.md",
          )
          if old_members != tuple(sorted(old_members)) or new_members != tuple(sorted(new_members)):
              raise SystemExit("evidence members are not canonical")
          if not set(new_members) < set(old_members):
              raise SystemExit("replacement is not a strict evidence subset")

          def digest(value: str) -> str:
              return "sha256:" + hashlib.sha256(value.encode("utf-8")).hexdigest()

          def entry(members: tuple[str, ...]) -> dict[str, str]:
              rendered = "\0".join(members)
              evidence_sha = digest(rendered)
              return {
                  "evidence_sha256": evidence_sha,
                  "evidence_zlib_base64": base64.b64encode(
                      zlib.compress(rendered.encode("utf-8"), level=9)
                  ).decode("ascii"),
                  "fingerprint": digest("\0".join((rule_id, subject, evidence_sha))),
                  "rule_id": rule_id,
                  "subject": subject,
              }

          old = entry(old_members)
          new = entry(new_members)
          if old["fingerprint"] != os.environ["OLD_FINGERPRINT"]:
              raise SystemExit("computed old fingerprint does not match pinned preimage")
          if new != {
              "evidence_sha256": "sha256:047f5ccbbdacead1da1f3ae97997bb9ea5b11c9cbcc80efd535ecf404d30311d",
              "evidence_zlib_base64": "eNqVkctqAzEMRftDqr9hILMIpV2U7ovGvpmIOpaRFdLp19eBEkIC7XSjzTkXvRI7B8MszW0JTY8W0cKeJ3H28DoOm+fx8ZAe0q8eop6ZlrYi8sWWVnhLMs06L3+aFVozKBWmzCX92z8X0lOBtb3UlfFrTWML7JlbpweuWSYDHbg57I5XqchSQDM7yLCDoUTceYYIqU6xz9CvcOG9uPV8YKHpKLlPXmHsUmaKWtw4+kWW4vyBsN2Mw/v25W14Gm9RZLOFdmqn/pTbnX4cfNasvYXa1S++AawFzlk=",
              "fingerprint": os.environ["NEW_FINGERPRINT"],
              "rule_id": rule_id,
              "subject": subject,
          }:
              raise SystemExit(f"computed replacement mismatch: {new!r}")

          matches = [
              index for index, candidate in enumerate(data["entries"])
              if candidate.get("rule_id") == rule_id and candidate.get("subject") == subject
          ]
          if len(matches) != 1 or data["entries"][matches[0]] != old:
              raise SystemExit("trusted document-identity entry does not match pinned preimage")

          protected_keys = (
              "authority",
              "closure_ref",
              "expires_on",
              "generated_from_ref",
              "non_effects",
              "owner",
              "schema_version",
          )
          protected = {key: data[key] for key in protected_keys}
          data["entries"][matches[0]] = new
          data["entries"].sort(key=lambda candidate: candidate["fingerprint"])
          if protected != {key: data[key] for key in protected_keys}:
              raise SystemExit("protected baseline metadata changed")

          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          if path.read_text(encoding="utf-8") == raw_before:
              raise SystemExit("baseline did not change")
          PY

      - name: Prove the strict transition and isolate remaining inherited drift
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:$BASELINE_PATH" > "$RUNNER_TEMP/baseline-before.json"

          set +e
          python tools/validators/directory_governance/validate_repository_topology.py \
            --repo-root . \
            --baseline "$RUNNER_TEMP/baseline-before.json" \
            --format json > "$RUNNER_TEMP/report-before.json"
          before_rc=$?
          python tools/validators/directory_governance/validate_repository_topology.py \
            --repo-root . \
            --baseline "$BASELINE_PATH" \
            --trusted-baseline-ref "$BASE_SHA" \
            --format json > "$RUNNER_TEMP/report-after.json"
          after_rc=$?
          set -e
          test "$before_rc" -eq 1
          test "$after_rc" -eq 1

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          before = json.loads((tmp / "report-before.json").read_text(encoding="utf-8"))
          after = json.loads((tmp / "report-after.json").read_text(encoding="utf-8"))
          old_fp = os.environ["OLD_FINGERPRINT"]
          new_fp = os.environ["NEW_FINGERPRINT"]
          before_by_fp = {item["fingerprint"]: item for item in before["findings"]}
          after_by_fp = {item["fingerprint"]: item for item in after["findings"]}

          if before_by_fp.get(new_fp, {}).get("disposition") != "FAIL_NEW_DRIFT":
              raise SystemExit("document identity was not new drift before repair")
          if after_by_fp.get(new_fp, {}).get("disposition") != "BASELINED_WARNING":
              raise SystemExit("document identity was not baselined after strict shrink")
          if old_fp not in before["baseline"]["stale_fingerprints"]:
              raise SystemExit("prior document-identity fingerprint was not stale before repair")
          if old_fp in after["baseline"]["stale_fingerprints"]:
              raise SystemExit("prior document-identity fingerprint remains stale after repair")
          if before["counts"]["fail_new_drift"] != 5 or after["counts"]["fail_new_drift"] != 4:
              raise SystemExit("new-drift count did not change exactly 5 -> 4")
          if len(before["baseline"]["stale_fingerprints"]) != 5 or len(after["baseline"]["stale_fingerprints"]) != 4:
              raise SystemExit("stale-fingerprint count did not change exactly 5 -> 4")
          if after["counts"]["fail_invariant"] != before["counts"]["fail_invariant"]:
              raise SystemExit("invariant count changed")
          if after["tracked_path_count"] != before["tracked_path_count"]:
              raise SystemExit("tracked-path count changed")

          remaining_before = {
              item["fingerprint"]: item["disposition"]
              for item in before["findings"] if item["fingerprint"] != new_fp
          }
          remaining_after = {
              item["fingerprint"]: item["disposition"]
              for item in after["findings"] if item["fingerprint"] != new_fp
          }
          if remaining_before != remaining_after:
              raise SystemExit("an unrelated finding changed disposition")
          print(json.dumps({
              "before_fail_new_drift": before["counts"]["fail_new_drift"],
              "after_fail_new_drift": after["counts"]["fail_new_drift"],
              "before_stale": len(before["baseline"]["stale_fingerprints"]),
              "after_stale": len(after["baseline"]["stale_fingerprints"]),
              "resolved_identity": "KFM-TOPO-016:doc-id:kfm://doc/NEEDS-VERIFICATION",
              "transition": "STRICT_EVIDENCE_SHRINK",
          }, sort_keys=True))
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$BASELINE_PATH"

      - name: Run focused topology tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import importlib.util
          import sys
          import unittest
          from pathlib import Path

          path = Path("tests/validators/directory_governance/test_validate_repository_topology.py")
          spec = importlib.util.spec_from_file_location("kfm_topology_tests", path)
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load topology test module")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          excluded = {
              "test_cli_json_is_deterministic",
              "test_live_index_matches_baseline_after_reviewed_authority_resolution",
          }
          names = [
              name for name in unittest.defaultTestLoader.getTestCaseNames(module.RepositoryTopologyTests)
              if name not in excluded
          ]
          suite = unittest.TestSuite(module.RepositoryTopologyTests(name) for name in names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print(f"PASS focused_topology_tests={result.testsRun} excluded={sorted(excluded)!r}")
          PY

      - name: Commit the exact baseline-only repair to the review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BASELINE_PATH"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$BASELINE_PATH"
          git commit -m "fix(topology): reconcile document identity baseline shrink"
          git push origin "HEAD:$BRANCH_NAME"

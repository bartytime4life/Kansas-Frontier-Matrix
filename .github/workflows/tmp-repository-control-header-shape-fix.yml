name: temporary-repository-control-header-shape-fix

"on":
  push:
    branches:
      - fix/repository-control-content-length-completeness-20260903

permissions:
  contents: write

concurrency:
  group: temporary-repository-control-header-shape-fix
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  patch-and-validate:
    if: >-
      github.ref == 'refs/heads/fix/repository-control-content-length-completeness-20260903' &&
      github.event.head_commit.message == 'ci(control): install pinned pytest for review fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact guarded branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Apply exact review correction
        shell: bash
        run: |
          set -euo pipefail

          expected_parent='a9b6f926a317530d2b37f511e00948f390824299'
          expected_helper_blob='9047c59d2ba91618078713ebffc2989ac282ab9b'
          expected_test_blob='174733cb47d00ed688c168d3deee5015ba316e3e'
          workflow_path='.github/workflows/tmp-repository-control-header-shape-fix.yml'

          test "$(git rev-parse HEAD^)" = "${expected_parent}"
          test "$(git rev-parse HEAD:tools/validators/repository_control/fetch_bounded_issue_comments.py)" = "${expected_helper_blob}"
          test "$(git rev-parse HEAD:tests/validators/test_repository_control_content_length.py)" = "${expected_test_blob}"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)" = "${workflow_path}"

          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          helper_path = Path(
              "tools/validators/repository_control/fetch_bounded_issue_comments.py"
          )
          helper_text = helper_path.read_text(encoding="utf-8")
          start_marker = "def _header_values(response: Any, name: str) -> list[str]:\n"
          end_marker = "\n\ndef _declared_content_length("
          if helper_text.count(start_marker) != 1:
              raise SystemExit("expected exactly one _header_values start marker")
          start = helper_text.index(start_marker)
          end = helper_text.index(end_marker, start)
          new_block = dedent(
              '''\
              def _header_text(value: object) -> str:
                  """Return one textual header value or reject the response shape."""

                  if not isinstance(value, str):
                      raise CaptureError("CONTROL_SOURCE_CONTENT_LENGTH_INVALID")
                  return value


              def _header_values(response: Any, name: str) -> list[str]:
                  """Return all visible textual values for one response header."""

                  headers = getattr(response, "headers", None)
                  if headers is not None:
                      get_all = getattr(headers, "get_all", None)
                      if callable(get_all):
                          values = get_all(name)
                          if values is not None:
                              if isinstance(values, str):
                                  return [values]
                              if not isinstance(values, (list, tuple)):
                                  raise CaptureError(
                                      "CONTROL_SOURCE_CONTENT_LENGTH_INVALID"
                                  )
                              return [_header_text(value) for value in values]

                      get = getattr(headers, "get", None)
                      if callable(get):
                          value = get(name)
                          if value is not None:
                              return [_header_text(value)]

                  getheader = getattr(response, "getheader", None)
                  if callable(getheader):
                      value = getheader(name)
                      if value is not None:
                          return [_header_text(value)]

                  return []
              '''
          )
          helper_path.write_text(
              helper_text[:start] + new_block.rstrip("\n") + helper_text[end:],
              encoding="utf-8",
              newline="\n",
          )

          test_path = Path("tests/validators/test_repository_control_content_length.py")
          test_text = test_path.read_text(encoding="utf-8")
          marker = "test_scalar_get_all_string_is_one_header_value"
          if marker in test_text:
              raise SystemExit("review regression block already present")
          additions = dedent(
              r'''
              class ScalarGetAllHeaders:
                  def __init__(self, value: object) -> None:
                      self.value = value

                  def get_all(self, name: str):
                      assert name == "Content-Length"
                      return self.value

                  def get(self, _name: str):
                      raise AssertionError(
                          "get fallback must not run after get_all result"
                      )


              class GetOnlyHeaders:
                  def __init__(self, value: object) -> None:
                      self.value = value

                  def get_all(self, name: str):
                      assert name == "Content-Length"
                      return None

                  def get(self, name: str):
                      assert name == "Content-Length"
                      return self.value


              class GetHeaderOnlyResponse:
                  headers = None

                  def __init__(self, value: object) -> None:
                      self.value = value

                  def getheader(self, name: str):
                      assert name == "Content-Length"
                      return self.value


              def assert_invalid_header_shape(response: object) -> None:
                  try:
                      helper._header_values(response, "Content-Length")
                  except helper.CaptureError as exc:
                      assert (
                          exc.reason_code
                          == "CONTROL_SOURCE_CONTENT_LENGTH_INVALID"
                      )
                  else:
                      raise AssertionError(
                          "non-text or unsupported header shape was accepted"
                      )


              def test_scalar_get_all_string_is_one_header_value() -> None:
                  response = type(
                      "Response",
                      (),
                      {"headers": ScalarGetAllHeaders("2, 2")},
                  )()

                  assert helper._header_values(response, "Content-Length") == ["2, 2"]
                  assert helper._declared_content_length(response) == 2


              def test_get_all_rejects_non_text_and_unsupported_shapes() -> None:
                  for value in (2, b"2", {"2"}, ["2", 2]):
                      response = type(
                          "Response",
                          (),
                          {"headers": ScalarGetAllHeaders(value)},
                      )()
                      assert_invalid_header_shape(response)


              def test_get_fallback_rejects_non_text_value() -> None:
                  response = type(
                      "Response",
                      (),
                      {"headers": GetOnlyHeaders(2)},
                  )()
                  assert_invalid_header_shape(response)


              def test_getheader_fallback_rejects_non_text_value() -> None:
                  assert_invalid_header_shape(GetHeaderOnlyResponse(2))
              '''
          )
          test_path.write_text(
              test_text.rstrip() + "\n\n\n" + additions.strip() + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Install pinned focused-test runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'pytest==8.2.2'

      - name: Validate focused repository-control surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          for path in (
              Path("tools/validators/repository_control/fetch_bounded_issue_comments.py"),
              Path("tests/validators/test_repository_control_content_length.py"),
          ):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          python3 -m pytest -p no:cacheprovider \
            tests/validators/test_repository_control_content_length.py \
            tests/validators/test_repository_control_input_bounds.py \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py

      - name: Commit exact two-file repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          workflow_path='.github/workflows/tmp-repository-control-header-shape-fix.yml'
          rm -- "${workflow_path}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual_paths="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/tmp-repository-control-header-shape-fix.yml' \
            'tests/validators/test_repository_control_content_length.py' \
            'tools/validators/repository_control/fetch_bounded_issue_comments.py' \
            | LC_ALL=C sort)"
          test "${actual_paths}" = "${expected_paths}"
          git commit -m 'fix(control): validate header value shapes'
          git push origin "HEAD:${GITHUB_REF_NAME}"

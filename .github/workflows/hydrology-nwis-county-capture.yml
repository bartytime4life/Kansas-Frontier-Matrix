# Validate captured-input-only USGS Water Data county normalization.
name: hydrology-nwis-county-capture

"on":
  pull_request:
    paths:
      - ".github/workflows/hydrology-nwis-county-capture.yml"
      - "connectors/usgs/water_data/nwis_county_capture.py"
      - "connectors/usgs/water_data/README.md"
      - "contracts/domains/hydrology/nwis_county_capture.md"
      - "schemas/contracts/v1/domains/hydrology/nwis_county_capture_manifest.schema.json"
      - "fixtures/connectors/usgs/water_data/nwis_county_capture/**"
      - "tests/connectors/usgs/water_data/test_nwis_county_capture.py"
      - "docs/intake/exploratory/pass-32-nwis-county-capture-source-map.md"
      - "data/receipts/generated/genrec-pass32-nwis-county-capture-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hydrology-nwis-county-capture.yml"
      - "connectors/usgs/water_data/nwis_county_capture.py"
      - "connectors/usgs/water_data/README.md"
      - "contracts/domains/hydrology/nwis_county_capture.md"
      - "schemas/contracts/v1/domains/hydrology/nwis_county_capture_manifest.schema.json"
      - "fixtures/connectors/usgs/water_data/nwis_county_capture/**"
      - "tests/connectors/usgs/water_data/test_nwis_county_capture.py"
      - "docs/intake/exploratory/pass-32-nwis-county-capture-source-map.md"
      - "data/receipts/generated/genrec-pass32-nwis-county-capture-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydrology-nwis-county-capture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-nwis-county-capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run captured-input normalizer tests
        run: python -m pytest tests/connectors/usgs/water_data/test_nwis_county_capture.py -q --strict-config --strict-markers

      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-pass32-nwis-county-capture-20260810.json
          --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### USGS Water Data county capture"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: credential-free request planning, complete captured pagination, source-role separation, field preservation, page digests, and strict local normalization."
            echo "- Boundary: no transport, credentials, source activation, RAW write, evidence resolution, hydrologic interpretation, promotion, release, warning, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

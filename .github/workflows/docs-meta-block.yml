# Validate bounded KFM documentation metadata blocks and emit a review-only
# machine document-registry delta. A green result is documentation QA only; it
# is not doctrine, evidence, policy, human review, release, or publication.
name: docs-meta-block

"on":
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - "control_plane/document_registry.yaml"
      - ".github/workflows/docs-meta-block.yml"
      - "tools/validators/docs/meta-block/**"
      - "tests/validators/docs/meta-block/**"
      - "data/receipts/generated/genrec-docs-meta-block-*.json"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - "control_plane/document_registry.yaml"
      - ".github/workflows/docs-meta-block.yml"
      - "tools/validators/docs/meta-block/**"
      - "tests/validators/docs/meta-block/**"
      - "data/receipts/generated/genrec-docs-meta-block-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-meta-block-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-docs-meta-block:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out documentation QA boundaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic no-network metadata tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/docs/meta-block \
            --pattern 'test_*.py' \
            --verbose

      - name: Validate changed documentation metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi

          python tools/validators/docs/meta-block/check_meta_blocks.py \
            --repo-root . \
            --profile present \
            --registry control_plane/document_registry.yaml \
            --git-diff "${base_sha}...HEAD" \
            --format markdown \
            --output "$RUNNER_TEMP/docs-meta-block.md" \
            --registry-delta-output "$RUNNER_TEMP/document-registry-delta.json" \
            README.md docs tools/validators/docs

          cat "$RUNNER_TEMP/docs-meta-block.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize review-only registry delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("document-registry-delta.json")
              .read_text(encoding="utf-8")
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("\n### Review-only machine document-registry delta\n")
              stream.write(f"- Entries: {len(payload['entries'])}.\n")
              stream.write(f"- Digest: `{payload['delta_digest']}`.\n")
              stream.write("- Mutation: none; authority remains unresolved until review.\n")
          PY

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-docs-meta-block-20260806.json \
            --repo-root .

      - name: Record metadata trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Documentation metadata trust boundary"
            echo "- Scope: bounded top-level KFM_META_BLOCK_V2 structure, duplicate identity, responsibility-root agreement, dates, related-path hygiene, and machine-register comparison."
            echo "- Ratchet: current changed-path failures remain blocking; unchanged failures are historical warnings."
            echo "- Registry: emitted delta is review-only and never applied by this workflow."
            echo "- Network: validator and focused tests make no external request."
            echo "- Non-effects: no documentation edit, registry mutation, doctrine decision, evidence decision, policy approval, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

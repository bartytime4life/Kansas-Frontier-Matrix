name: land-records
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: land-records-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  land-intake-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install existing hash-locked test dependencies
        run: python tools/ci/install_python_ci.py water-pilot
      - name: Verify synthetic land source, integrity, access and rollback guards
        run: python -m pytest -q tests/domains/people-dna-land/test_land_records.py

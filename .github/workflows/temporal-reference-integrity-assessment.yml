name: temporal-reference-integrity-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/temporal-reference-integrity-assessment.yml"
      - "contracts/common/temporal_reference_integrity_assessment.md"
      - "schemas/contracts/v1/common/temporal_reference_integrity_assessment.schema.json"
      - "fixtures/contracts/v1/common/temporal_reference_integrity_assessment/**"
      - "tools/validators/validate_temporal_reference_integrity_assessment.py"
      - "tests/validators/test_validate_temporal_reference_integrity_assessment.py"
      - "docs/intake/exploratory/pass-18-temporal-reference-integrity-source-map.md"
      - "contracts/common/temporal_window.md"
      - "contracts/common/period_boundary_predicate_disclosure.md"
      - "contracts/common/temporal_authority_envelope.md"
      - "contracts/data/temporal_slice.md"
      - "data/receipts/generated/genrec-pass18-temporal-reference-integrity-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporal-reference-integrity-assessment.yml"
      - "contracts/common/temporal_reference_integrity_assessment.md"
      - "schemas/contracts/v1/common/temporal_reference_integrity_assessment.schema.json"
      - "fixtures/contracts/v1/common/temporal_reference_integrity_assessment/**"
      - "tools/validators/validate_temporal_reference_integrity_assessment.py"
      - "tests/validators/test_validate_temporal_reference_integrity_assessment.py"
      - "docs/intake/exploratory/pass-18-temporal-reference-integrity-source-map.md"
      - "contracts/common/temporal_window.md"
      - "contracts/common/period_boundary_predicate_disclosure.md"
      - "contracts/common/temporal_authority_envelope.md"
      - "contracts/data/temporal_slice.md"
      - "data/receipts/generated/genrec-pass18-temporal-reference-integrity-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-reference-integrity-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-temporal-reference-integrity-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/validate_temporal_reference_integrity_assessment.py tests/validators/test_validate_temporal_reference_integrity_assessment.py
          python -m unittest tests.validators.test_validate_temporal_reference_integrity_assessment --verbose
          python tools/validators/validate_temporal_reference_integrity_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-temporal-reference-integrity-20260810.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Temporal reference-integrity assessment candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only record-presence, role, valid-time, transaction-time, bitemporal-axis, interval-boundary, and reference declaration coherence."
            echo "- Boundary: no reference resolution, database inspection or mutation, constraint execution, quarantine, evidence resolution, policy or review decision, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

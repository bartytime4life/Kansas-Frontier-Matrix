# Validate the fixture-only deterministic PolicyObligationReduction profile.
name: policy-obligation-reduction

"on":
  pull_request:
    paths:
      - ".github/workflows/policy-obligation-reduction.yml"
      - "contracts/policy/policy_obligation_reduction.md"
      - "schemas/contracts/v1/policy/policy_obligation_reduction.schema.json"
      - "fixtures/contracts/v1/policy/policy_obligation_reduction/**"
      - "tools/validators/policy/validate_policy_obligation_reduction.py"
      - "tests/validators/test_validate_policy_obligation_reduction.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-policy-obligation-reduction-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/policy-obligation-reduction.yml"
      - "contracts/policy/policy_obligation_reduction.md"
      - "schemas/contracts/v1/policy/policy_obligation_reduction.schema.json"
      - "fixtures/contracts/v1/policy/policy_obligation_reduction/**"
      - "tools/validators/policy/validate_policy_obligation_reduction.py"
      - "tests/validators/test_validate_policy_obligation_reduction.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-policy-obligation-reduction-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-obligation-reduction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-policy-obligation-reduction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic no-network tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_policy_obligation_reduction.py' \
            --verbose
          python tools/validators/policy/validate_policy_obligation_reduction.py \
            --fixtures

      - name: Verify repository-wide schema fixture naming boundary
        run: |
          set -euo pipefail
          python -m pytest tests/schemas/test_common_contracts.py \
            -q -k policy_obligation_reduction

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-policy-obligation-reduction-20260806.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Policy obligation reduction"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed fixture profile, RFC 8785 identity, maximum-severity reduction, exact semantic polarity, schema-negative naming, and authoring-receipt integrity."
            echo "- Reduction: strongest transform, maximum geometry distance, maximum date fuzz, any geometry suppression, and latest embargo date."
            echo "- Boundary: a green result does not evaluate policy, authenticate a policy decision, apply a transform, mutate data, promote, release, deploy, publish, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"

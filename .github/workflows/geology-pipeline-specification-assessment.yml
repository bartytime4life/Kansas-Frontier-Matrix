name: geology-pipeline-specification-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/geology-pipeline-specification-assessment.yml"
      - "contracts/domains/geology/geology_pipeline_specification_assessment.md"
      - "schemas/contracts/v1/domains/geology/geology_pipeline_specification_assessment.schema.json"
      - "fixtures/contracts/v1/domains/geology/geology_pipeline_specification_assessment/**"
      - "tools/validators/domains/geology/validate_geology_pipeline_specification_assessment.py"
      - "tests/validators/domains/geology/test_validate_geology_pipeline_specification_assessment.py"
      - "docs/intake/exploratory/geology-pipeline-specification-assessment-source-map.md"
      - "data/receipts/generated/genrec-geology-pipeline-specification-assessment-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/geology-pipeline-specification-assessment.yml"
      - "contracts/domains/geology/geology_pipeline_specification_assessment.md"
      - "schemas/contracts/v1/domains/geology/geology_pipeline_specification_assessment.schema.json"
      - "fixtures/contracts/v1/domains/geology/geology_pipeline_specification_assessment/**"
      - "tools/validators/domains/geology/validate_geology_pipeline_specification_assessment.py"
      - "tests/validators/domains/geology/test_validate_geology_pipeline_specification_assessment.py"
      - "docs/intake/exploratory/geology-pipeline-specification-assessment-source-map.md"
      - "data/receipts/generated/genrec-geology-pipeline-specification-assessment-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geology-pipeline-specification-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-geology-pipeline-specification-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/domains/geology/validate_geology_pipeline_specification_assessment.py tests/validators/domains/geology/test_validate_geology_pipeline_specification_assessment.py
          python -m unittest tests.validators.domains.geology.test_validate_geology_pipeline_specification_assessment --verbose
          python tools/validators/domains/geology/validate_geology_pipeline_specification_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-geology-pipeline-specification-assessment-20260814.json --repo-root .
      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### GeologyPipelineSpecificationAssessmentCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic inactive specification identity, source/object role, knowledge character, scale/depth/datum, sensitivity, lifecycle, review, and anti-collapse declaration coherence."
            echo "- Boundary: no source contact or activation, pipeline execution, geometry inspection, geologic or resource truth, evidence/policy/review decision, lifecycle mutation, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

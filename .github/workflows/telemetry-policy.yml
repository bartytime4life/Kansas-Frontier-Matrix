# KFM telemetry-policy readiness workflow.
#
# Responsibility:
#   Enforce the current telemetry safety boundary without treating fixture-only
#   trace/receipt linkage, the inactive OpenLineage and remote-sensing lineage
#   profiles, or the inactive map-build sustainability profile as
#   operational telemetry, policy, evidence, or release authority. The workflow
#   validates every admitted fixture-only telemetry profile and keeps raw-evidence,
#   prompt, restricted-coordinate, emitter, sink, and receipt-instance enforcement
#   on an explicit fail-closed hold.
#
# Trust boundary:
#   Pull-request content is untrusted. Jobs have read-only repository permission,
#   use repository fixtures only, receive no operational telemetry or secrets,
#   and connect to no collector, exporter, sink, registry, dashboard, or public
#   API. A green result proves repository-local contract checks only.
#
# Compatibility:
#   Preserve workflow name `telemetry-policy` and job ids/check names
#   `no-raw-evidence`, `no-prompts`, and `no-restricted-coords`; repository rules
#   may refer to those names.
#
# Rollback:
#   Revert this file. Do not restore an absence-only hold that fails merely because
#   a bounded fixture-first profile exists, and do not run allow-by-default policy
#   stubs as though they prevent telemetry disclosure.

name: telemetry-policy

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  no-raw-evidence:
    name: no-raw-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out inspected revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up inspection Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install declared schema and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Validate admitted fixture-only telemetry profiles and raw-evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_trace_receipt_link.py' \
            --verbose
          python tools/validators/validate_trace_receipt_link.py --fixtures
          python -m unittest discover \
            --start-directory tests/validators/telemetry \
            --pattern 'test_openlineage_run_event_projection.py' \
            --verbose
          python tools/validators/telemetry/validate_openlineage_run_event_projection.py \
            --fixtures
          python -m unittest discover \
            --start-directory tests/validators/telemetry \
            --pattern 'test_remote_sensing_lineage_activity.py' \
            --verbose
          python tools/validators/telemetry/validate_remote_sensing_lineage_activity.py \
            --fixtures
          python -m unittest discover \
            --start-directory tests/validators/telemetry \
            --pattern 'test_map_build_sustainability.py' \
            --verbose
          python tools/validators/telemetry/validate_map_build_sustainability.py \
            --fixtures
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          telemetry_fixture_root = Path("fixtures/contracts/v1/telemetry")
          trace_profile_root = telemetry_fixture_root / "trace_receipt_link"
          openlineage_profile_root = (
              telemetry_fixture_root / "openlineage_run_event_projection"
          )
          map_build_profile_root = telemetry_fixture_root / "map_build_sustainability"
          remote_sensing_profile_root = (
              telemetry_fixture_root / "remote_sensing_lineage_activity"
          )
          schema_root = Path("schemas/contracts/v1/telemetry")
          receipt_root = Path("data/receipts/telemetry")
          required = [
              Path("contracts/telemetry/README.md"),
              Path("contracts/telemetry/trace_receipt_link.md"),
              Path("contracts/telemetry/openlineage_run_event_projection.md"),
              Path("contracts/telemetry/map_build_sustainability.md"),
              Path("contracts/telemetry/remote_sensing_lineage_activity.md"),
              Path("docs/standards/TELEMETRY_MINIMUMS.md"),
              Path("docs/adr/ADR-0016-telemetry-redaction-posture.md"),
              Path("policy/ui/no_raw_in_telemetry.rego"),
              Path("tools/validators/validate_telemetry_safety.py"),
              Path("tools/validators/validate_trace_receipt_link.py"),
              Path("tests/validators/test_validate_trace_receipt_link.py"),
              Path(
                  "tools/generators/telemetry/"
                  "build_openlineage_run_event_projection.py"
              ),
              Path(
                  "tools/validators/telemetry/"
                  "validate_openlineage_run_event_projection.py"
              ),
              Path(
                  "tests/validators/telemetry/"
                  "test_openlineage_run_event_projection.py"
              ),
              Path(
                  "tools/validators/telemetry/"
                  "validate_map_build_sustainability.py"
              ),
              Path(
                  "tests/validators/telemetry/"
                  "test_map_build_sustainability.py"
              ),
              Path(
                  "tools/validators/telemetry/"
                  "validate_remote_sensing_lineage_activity.py"
              ),
              Path(
                  "tests/validators/telemetry/"
                  "test_remote_sensing_lineage_activity.py"
              ),
              Path(".github/workflows/openlineage-run-event-projection.yml"),
              Path(".github/workflows/map-build-sustainability-telemetry.yml"),
              Path(".github/workflows/remote-sensing-lineage-activity.yml"),
              schema_root / "README.md",
              schema_root / "trace_receipt_link.schema.json",
              schema_root / "openlineage_run_event_projection.schema.json",
              schema_root / "map_build_sustainability.schema.json",
              schema_root / "remote_sensing_lineage_activity.schema.json",
              trace_profile_root / "valid/valid_linked.json",
              trace_profile_root / "valid/valid_linked_restricted.json",
              trace_profile_root / "invalid/expected_findings_manifest.json",
              openlineage_profile_root / "README.md",
              openlineage_profile_root / "cases.json",
              map_build_profile_root / "README.md",
              map_build_profile_root / "cases.json",
              remote_sensing_profile_root / "README.md",
              remote_sensing_profile_root / "cases.json",
              receipt_root / "README.md",
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          assert not missing, f"required telemetry boundary evidence is missing: {missing}"

          schema_files = sorted(
              path.relative_to(schema_root).as_posix()
              for path in schema_root.rglob("*")
              if path.is_file()
          )
          assert schema_files == [
              "README.md",
              "map_build_sustainability.schema.json",
              "openlineage_run_event_projection.schema.json",
              "remote_sensing_lineage_activity.schema.json",
              "trace_receipt_link.schema.json",
          ], (
              "telemetry schema inventory changed; classify each profile and update "
              f"policy/negative-test coverage deliberately: {schema_files}"
          )
          fixture_profiles = sorted(
              path.name for path in telemetry_fixture_root.iterdir() if path.is_dir()
          )
          assert fixture_profiles == [
              "map_build_sustainability",
              "openlineage_run_event_projection",
              "remote_sensing_lineage_activity",
              "trace_receipt_link",
          ], (
              "telemetry fixture profile inventory changed without this safety review: "
              f"{fixture_profiles}"
          )

          forbidden_raw_keys = {
              "payload",
              "raw",
              "raw_payload",
              "rawPayload",
              "source_payload",
              "sourcePayload",
              "evidence_payload",
              "evidencePayload",
              "raw_record",
              "rawRecord",
              "source_record",
              "sourceRecord",
          }

          def walk(value, path="/"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      assert key not in forbidden_raw_keys, (
                          "raw payload-bearing key is forbidden in telemetry fixtures "
                          f"or schemas: {path}{key}"
                      )
                      walk(child, f"{path}{key}/")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{path}{index}/")

          for path in sorted(telemetry_fixture_root.rglob("*.json")):
              walk(json.loads(path.read_text(encoding="utf-8")))
          for path in sorted(schema_root.glob("*.schema.json")):
              walk(json.loads(path.read_text(encoding="utf-8")))

          openlineage_schema = json.loads(
              (schema_root / "openlineage_run_event_projection.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          assert openlineage_schema["additionalProperties"] is False
          assert (
              openlineage_schema["properties"]["profile_status"]["const"]
              == "PROPOSED_INACTIVE"
          )
          assert (
              openlineage_schema["properties"]["execution_mode"]["const"]
              == "FIXTURE_ONLY_NO_NETWORK"
          )
          assert openlineage_schema["properties"]["authority"]["const"] == "NONE"

          map_build_schema = json.loads(
              (schema_root / "map_build_sustainability.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          assert map_build_schema["additionalProperties"] is False
          assert (
              map_build_schema["properties"]["profile_status"]["const"]
              == "PROPOSED_INACTIVE_FIXTURE_ONLY"
          )
          assert (
              map_build_schema["properties"]["execution_mode"]["const"]
              == "FIXTURE_ONLY_NO_NETWORK"
          )
          assert (
              map_build_schema["properties"]["review_posture"]["properties"]
              ["purpose"]["const"]
              == "REVIEW_SIGNAL_ONLY"
          )
          assert all(
              claim["const"] is False
              for claim in map_build_schema["properties"]["authority_claims"]
              ["properties"].values()
          )
          assert (
              map_build_schema["properties"]["sensitivity"]["properties"]
              ["public_rollup_authorized"]["const"]
              is False
          )

          remote_sensing_schema = json.loads(
              (schema_root / "remote_sensing_lineage_activity.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          assert remote_sensing_schema["additionalProperties"] is False
          assert (
              remote_sensing_schema["properties"]["profile_status"]["const"]
              == "PROPOSED_INACTIVE"
          )
          assert (
              remote_sensing_schema["properties"]["execution_mode"]["const"]
              == "FIXTURE_ONLY_NO_NETWORK"
          )
          assert remote_sensing_schema["properties"]["authority"]["const"] == "NONE"

          validator_path = Path("tools/validators/validate_telemetry_safety.py")
          validator = validator_path.read_text(encoding="utf-8")
          assert "# Greenfield validator stub: telemetry_safety" in validator
          assert 'raise NotImplementedError("Greenfield placeholder")' in validator

          policy = Path("policy/ui/no_raw_in_telemetry.rego").read_text(
              encoding="utf-8"
          )
          assert "Status: PROPOSED greenfield stub. No real rules yet." in policy
          assert "package kfm.no_raw_in_telemetry" in policy
          assert "default deny := false" in policy

          receipt_payloads = sorted(
              path.as_posix()
              for path in receipt_root.rglob("*")
              if path.is_file() and path.name != "README.md"
          )
          assert not receipt_payloads, (
              "operational telemetry receipt instances have appeared; validate schema, "
              f"policy, identity, redaction, integrity, and release linkage: {receipt_payloads}"
          )

          code_pattern = re.compile(
              r"\b(opentelemetry|otlp|start_span|set_attribute|meter)\b",
              re.IGNORECASE,
          )
          surfaced_code = []
          for root in [Path("runtime"), Path("apps"), Path("packages"), Path("pipelines")]:
              for path in root.rglob("*"):
                  if path.is_file() and path.suffix in {".py", ".ts", ".tsx", ".js"}:
                      if code_pattern.search(
                          path.read_text(encoding="utf-8", errors="ignore")
                      ):
                          surfaced_code.append(path.as_posix())
          assert not surfaced_code, (
              "operational telemetry instrumentation surfaced; wire accepted event "
              "shapes, allowlists, redaction, policy, negative tests, receipts, and "
              f"sink controls: {sorted(surfaced_code)}"
          )

          contract = Path("contracts/telemetry/README.md").read_text(
              encoding="utf-8"
          )
          openlineage_contract = Path(
              "contracts/telemetry/openlineage_run_event_projection.md"
          ).read_text(encoding="utf-8").lower()
          standard = Path("docs/standards/TELEMETRY_MINIMUMS.md").read_text(
              encoding="utf-8"
          )
          adr = Path(
              "docs/adr/ADR-0016-telemetry-redaction-posture.md"
          ).read_text(encoding="utf-8")
          assert "status: draft; PROPOSED" in contract
          assert (
              "status: draft; proposed; fixture-first; local-only; no-network; "
              "non-authoritative"
          ) in openlineage_contract
          assert "does not post the event" in openlineage_contract
          assert "status: draft" in standard
          assert "status: proposed" in adr
          assert "payload fragments" in contract.lower()
          assert "no raw payload echo" in adr.lower()

          print(
              "CONFIRMED: TraceReceiptLink plus inactive OpenLineage, remote-sensing "
              "lineage, and map-build sustainability tests and exact fixture polarity "
              "passed."
          )
          print(
              "CONFIRMED: admitted telemetry fixtures and schemas contain no raw "
              "payload-bearing fields and create no operational telemetry authority."
          )
          print(
              "WORKFLOW_HOLD: operational raw-evidence telemetry policy, redactor, "
              "emitter, receipt flow, and sink controls remain unimplemented."
          )
          PY

      - name: Record raw-evidence telemetry boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Raw evidence in telemetry"
            echo
            echo "- Admitted fixture-only telemetry profile checks: ${{ job.status }}."
            echo "- Operational boundary remains **WORKFLOW_HOLD**: the named raw-evidence Rego policy and general telemetry safety validator remain proposed placeholders; no emitter, sink, or operational telemetry receipt was evaluated."
            echo "- No telemetry, redaction, policy decision, receipt instance, proof, release record, promotion, deployment, or publication authority was emitted."
          } >> "$GITHUB_STEP_SUMMARY"

  no-prompts:
    name: no-prompts
    needs:
      - no-raw-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out inspected revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up inspection Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify admitted fixture-only telemetry profiles are prompt-free while operational enforcement stays held
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          telemetry_fixture_root = Path("fixtures/contracts/v1/telemetry")
          required = [
              Path("policy/ui/no_prompt_in_telemetry.rego"),
              Path("contracts/telemetry/README.md"),
              Path("docs/standards/TELEMETRY_MINIMUMS.md"),
              Path("docs/adr/ADR-0016-telemetry-redaction-posture.md"),
              telemetry_fixture_root / "trace_receipt_link",
              telemetry_fixture_root / "openlineage_run_event_projection",
              telemetry_fixture_root / "map_build_sustainability",
              telemetry_fixture_root / "remote_sensing_lineage_activity",
          ]
          missing = [path.as_posix() for path in required if not path.exists()]
          assert not missing, f"required prompt-telemetry boundary evidence is missing: {missing}"

          fixture_profiles = sorted(
              path.name for path in telemetry_fixture_root.iterdir() if path.is_dir()
          )
          assert fixture_profiles == [
              "map_build_sustainability",
              "openlineage_run_event_projection",
              "remote_sensing_lineage_activity",
              "trace_receipt_link",
          ], (
              "telemetry fixture profile inventory changed without prompt-safety "
              f"classification: {fixture_profiles}"
          )

          policy = Path("policy/ui/no_prompt_in_telemetry.rego").read_text(
              encoding="utf-8"
          )
          assert "Status: PROPOSED greenfield stub. No real rules yet." in policy
          assert "package kfm.no_prompt_in_telemetry" in policy
          assert "default deny := false" in policy

          forbidden = {
              "prompt",
              "prompts",
              "messages",
              "input_text",
              "inputText",
              "output_text",
              "outputText",
              "chain_of_thought",
              "chainOfThought",
              "reasoning_content",
              "reasoningContent",
          }

          def walk(value, path="/"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      assert key not in forbidden, (
                          f"prompt-bearing key is forbidden: {path}{key}"
                      )
                      walk(child, f"{path}{key}/")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{path}{index}/")

          for path in sorted(telemetry_fixture_root.rglob("*.json")):
              walk(json.loads(path.read_text(encoding="utf-8")))

          contract = Path("contracts/telemetry/README.md").read_text(
              encoding="utf-8"
          ).lower()
          standard = Path("docs/standards/TELEMETRY_MINIMUMS.md").read_text(
              encoding="utf-8"
          ).lower()
          adr = Path(
              "docs/adr/ADR-0016-telemetry-redaction-posture.md"
          ).read_text(encoding="utf-8").lower()
          assert "raw prompts" in contract
          assert "no prompt content" in adr
          assert "status: proposed" in adr
          assert "status: draft" in standard

          print(
              "CONFIRMED: admitted fixture-only telemetry profiles contain no "
              "prompt, message, output-text, or reasoning-content fields."
          )
          print(
              "WORKFLOW_HOLD: general prompt telemetry allowlists, redaction, "
              "policy implementation, and emitter controls remain unimplemented."
          )
          PY

      - name: Record prompt telemetry boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Prompts in telemetry"
            echo
            echo "- Admitted fixture-only telemetry prompt-free check: ${{ job.status }}."
            echo "- Operational boundary remains **WORKFLOW_HOLD**: prompt exclusion is documented, but the named Rego policy is a proposed placeholder and no general emitter/redactor enforcement was evaluated."
            echo "- No telemetry, redaction, policy decision, receipt instance, proof, release record, or publication authority was emitted."
          } >> "$GITHUB_STEP_SUMMARY"

  no-restricted-coords:
    name: no-restricted-coords
    needs:
      - no-prompts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out inspected revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up inspection Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify admitted fixture-only telemetry profiles contain no restricted coordinates while operational enforcement stays held
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          telemetry_fixture_root = Path("fixtures/contracts/v1/telemetry")
          required = [
              Path("policy/telemetry/no_restricted_coords.rego"),
              Path("contracts/telemetry/README.md"),
              Path("docs/standards/TELEMETRY_MINIMUMS.md"),
              Path("docs/adr/ADR-0016-telemetry-redaction-posture.md"),
              telemetry_fixture_root / "trace_receipt_link",
              telemetry_fixture_root / "openlineage_run_event_projection",
              telemetry_fixture_root / "map_build_sustainability",
              telemetry_fixture_root / "remote_sensing_lineage_activity",
          ]
          missing = [path.as_posix() for path in required if not path.exists()]
          assert not missing, f"required coordinate-telemetry boundary evidence is missing: {missing}"

          fixture_profiles = sorted(
              path.name for path in telemetry_fixture_root.iterdir() if path.is_dir()
          )
          assert fixture_profiles == [
              "map_build_sustainability",
              "openlineage_run_event_projection",
              "remote_sensing_lineage_activity",
              "trace_receipt_link",
          ], (
              "telemetry fixture profile inventory changed without coordinate-safety "
              f"classification: {fixture_profiles}"
          )

          policy = Path("policy/telemetry/no_restricted_coords.rego").read_text(
              encoding="utf-8"
          )
          assert "Status: PROPOSED greenfield stub. No real rules yet." in policy
          assert "package kfm.no_restricted_coords" in policy
          assert "default deny := false" in policy

          forbidden = {
              "lat",
              "lon",
              "latitude",
              "longitude",
              "coordinates",
              "geometry",
              "bbox",
              "wkt",
          }

          def walk(value, path="/"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      assert key not in forbidden, (
                          f"coordinate-bearing key is forbidden: {path}{key}"
                      )
                      walk(child, f"{path}{key}/")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{path}{index}/")

          for path in sorted(telemetry_fixture_root.rglob("*.json")):
              walk(json.loads(path.read_text(encoding="utf-8")))

          contract = Path("contracts/telemetry/README.md").read_text(
              encoding="utf-8"
          ).lower()
          standard = Path("docs/standards/TELEMETRY_MINIMUMS.md").read_text(
              encoding="utf-8"
          ).lower()
          adr = Path(
              "docs/adr/ADR-0016-telemetry-redaction-posture.md"
          ).read_text(encoding="utf-8").lower()
          assert "exact restricted coordinates" in contract
          assert "replaces precise `lat` / `lon`" in adr
          assert "status: proposed" in adr
          assert "status: draft" in standard

          print(
              "CONFIRMED: admitted fixture-only telemetry profiles contain no "
              "coordinates, geometry, bbox, or WKT fields."
          )
          print(
              "WORKFLOW_HOLD: general geometry allowlists, sensitivity binding, "
              "redaction/generalization, policy implementation, and emitter controls "
              "remain unimplemented."
          )
          PY

      - name: Record restricted-coordinate telemetry boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Restricted coordinates in telemetry"
            echo
            echo "- Admitted fixture-only telemetry coordinate-free check: ${{ job.status }}."
            echo "- Operational boundary remains **WORKFLOW_HOLD**: exact-coordinate exclusion is documented, but the named Rego policy is a proposed placeholder and no general emitter/redactor enforcement was evaluated."
            echo "- No telemetry, redaction, policy decision, receipt instance, proof, release record, or publication authority was emitted."
          } >> "$GITHUB_STEP_SUMMARY"

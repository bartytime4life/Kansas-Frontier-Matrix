# KFM telemetry-policy readiness workflow.
#
# Responsibility:
#   Inspect the repository's telemetry validator, schema, fixture, test, emitter,
#   receipt, and three named policy surfaces without executing allow-by-default
#   placeholders or presenting documentation as enforcement.
#
# Trigger and trust boundary:
#   Pull requests, pushes to main, and explicit dispatch. Pull-request content
#   is untrusted. The workflow has read-only repository permission, performs no
#   dependency installation, receives no operational telemetry or secrets, and
#   does not connect to a collector, exporter, sink, dashboard, or public API.
#
# Inputs:
#   Telemetry contract/standard/ADR documentation, the bounded linkage-only
#   TraceReceiptLink schema and fixtures, the telemetry validator placeholder,
#   the three named Rego placeholders, telemetry receipt inventory, and a
#   bounded scan of implementation-code roots for surfaced instrumentation.
#
# Outputs and outcomes:
#   Inspection output and job summaries only. The linkage-only profile may
#   exist without being mistaken for an operational telemetry event or payload
#   lane. Jobs keep raw-evidence, prompt, and restricted-coordinate enforcement
#   on explicit hold until accepted policy, redaction, emitter, sink, receipt,
#   and negative-test wiring exists.
#
# Compatibility:
#   Preserve workflow name `telemetry-policy` and job ids/check names
#   `no-raw-evidence`, `no-prompts`, and `no-restricted-coords`; repository rules
#   may refer to those names.
#
# Rollback:
#   Revert this file. Do not restore a blanket absence assertion that rejects
#   the linkage-only profile, and do not run allow-by-default policy stubs as
#   though they prevent telemetry disclosure.
#
# Placement:
#   Directory Rules §5 assigns workflows and governance hooks to `.github/`.
#   Telemetry meaning, shapes, policy, validator code, tests, fixtures, runtime
#   implementation, receipts, and operational infrastructure remain in their
#   separate responsibility roots.

name: telemetry-policy

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  no-raw-evidence:
    name: no-raw-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out inspected revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up inspection Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Confirm raw-evidence telemetry enforcement remains an explicit hold
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          validator_path = Path("tools/validators/validate_telemetry_safety.py")
          policy_path = Path("policy/ui/no_raw_in_telemetry.rego")
          schema_root = Path("schemas/contracts/v1/telemetry")
          link_schema_path = schema_root / "trace_receipt_link.schema.json"
          link_fixture_root = Path(
              "fixtures/contracts/v1/telemetry/trace_receipt_link"
          )
          link_validator_path = Path(
              "tools/validators/validate_trace_receipt_link.py"
          )
          link_test_path = Path(
              "tests/validators/test_validate_trace_receipt_link.py"
          )
          receipt_root = Path("data/receipts/telemetry")
          required = [
              validator_path,
              policy_path,
              receipt_root / "README.md",
              Path("contracts/telemetry/README.md"),
              Path("docs/standards/TELEMETRY_MINIMUMS.md"),
              Path("docs/adr/ADR-0016-telemetry-redaction-posture.md"),
              schema_root / "README.md",
              link_schema_path,
              link_validator_path,
              link_test_path,
              link_fixture_root / "valid" / "valid_linked.json",
              link_fixture_root / "valid" / "valid_linked_restricted.json",
              link_fixture_root / "invalid" / "expected_findings_manifest.json",
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          assert not missing, (
              f"required telemetry readiness evidence is missing: {missing}"
          )

          validator = validator_path.read_text(encoding="utf-8")
          assert "# Greenfield validator stub: telemetry_safety" in validator
          assert 'raise NotImplementedError("Greenfield placeholder")' in validator

          policy = policy_path.read_text(encoding="utf-8")
          assert "Status: PROPOSED greenfield stub. No real rules yet." in policy
          assert "package kfm.no_raw_in_telemetry" in policy
          assert "default deny := false" in policy

          allowed_schema_files = {
              "schemas/contracts/v1/telemetry/README.md",
              "schemas/contracts/v1/telemetry/trace_receipt_link.schema.json",
          }
          actual_schema_files = {
              path.as_posix()
              for path in schema_root.rglob("*")
              if path.is_file()
          }
          assert actual_schema_files == allowed_schema_files, (
              "telemetry schema inventory changed; classify every new shape as "
              "linkage metadata versus operational event/payload telemetry before "
              f"updating this hold: {sorted(actual_schema_files)}"
          )

          fixture_root = Path("fixtures/contracts/v1/telemetry")
          unexpected_fixture_files = sorted(
              path.as_posix()
              for path in fixture_root.rglob("*")
              if path.is_file() and link_fixture_root not in path.parents
          )
          assert not unexpected_fixture_files, (
              "an unclassified telemetry fixture lane has appeared; wire accepted "
              "event shapes, allowlists, redaction, policy, and negative tests: "
              f"{unexpected_fixture_files}"
          )
          for root in [
              Path("fixtures/telemetry"),
              Path("tests/telemetry"),
              Path("tools/validators/telemetry"),
          ]:
              assert not root.exists(), (
                  f"{root} has appeared; replace this readiness hold with executable, "
                  "fail-closed operational telemetry coverage"
              )

          def declared_properties(value):
              fields = set()
              if isinstance(value, dict):
                  properties = value.get("properties")
                  if isinstance(properties, dict):
                      fields.update(properties)
                  for item in value.values():
                      fields.update(declared_properties(item))
              elif isinstance(value, list):
                  for item in value:
                      fields.update(declared_properties(item))
              return fields

          def actual_keys(value):
              fields = set()
              if isinstance(value, dict):
                  fields.update(value)
                  for item in value.values():
                      fields.update(actual_keys(item))
              elif isinstance(value, list):
                  for item in value:
                      fields.update(actual_keys(item))
              return fields

          raw_fields = {
              "raw",
              "raw_payload",
              "raw_evidence",
              "payload",
              "payload_body",
              "payload_fragment",
              "body",
              "content",
              "source_bytes",
              "evidence_excerpt",
              "evidence_text",
              "document_text",
          }
          schema = json.loads(link_schema_path.read_text(encoding="utf-8"))
          assert schema.get("title") == "TraceReceiptLink"
          assert schema.get("additionalProperties") is False
          declared_raw = declared_properties(schema) & raw_fields
          assert not declared_raw, (
              "the linkage-only schema declares raw content fields: "
              f"{sorted(declared_raw)}"
          )

          fixture_files = sorted(link_fixture_root.rglob("*.json"))
          assert fixture_files, "the linkage-only fixture inventory is empty"
          for path in fixture_files:
              value = json.loads(path.read_text(encoding="utf-8"))
              present_raw = actual_keys(value) & raw_fields
              assert not present_raw, (
                  f"{path.as_posix()} contains raw content fields: "
                  f"{sorted(present_raw)}"
              )
              if isinstance(value, dict):
                  governance = value.get("governance")
                  if isinstance(governance, dict):
                      assert governance.get("sensitive_payload_included") is False, (
                          f"{path.as_posix()} claims a sensitive payload is included"
                      )

          receipt_payloads = sorted(
              path.as_posix()
              for path in receipt_root.rglob("*")
              if path.is_file() and path.name != "README.md"
          )
          assert not receipt_payloads, (
              "telemetry receipt instances have appeared; validate their schema, policy, "
              f"identity, redaction, integrity, and release linkage: {receipt_payloads}"
          )

          code_pattern = re.compile(
              r"\b(telemetry|opentelemetry|otlp|start_span|set_attribute|meter)\b",
              re.IGNORECASE,
          )
          surfaced_code = []
          for root in [Path("runtime"), Path("apps"), Path("packages"), Path("pipelines")]:
              for path in root.rglob("*"):
                  if path.is_file() and path.suffix in {".py", ".ts", ".tsx", ".js"}:
                      if code_pattern.search(
                          path.read_text(encoding="utf-8", errors="ignore")
                      ):
                          surfaced_code.append(path.as_posix())
          assert not surfaced_code, (
              "telemetry implementation code has surfaced; wire accepted event shapes, "
              "allowlists, redaction, policy, negative tests, receipts, and sink controls "
              f"before retaining this readiness audit: {sorted(surfaced_code)}"
          )

          contract = Path("contracts/telemetry/README.md").read_text(encoding="utf-8")
          standard = Path("docs/standards/TELEMETRY_MINIMUMS.md").read_text(
              encoding="utf-8"
          )
          adr = Path(
              "docs/adr/ADR-0016-telemetry-redaction-posture.md"
          ).read_text(encoding="utf-8")
          assert "status: draft; PROPOSED" in contract
          assert "status: draft" in standard
          assert "status: proposed" in adr
          assert "payload fragments" in contract.lower()
          assert "no raw payload echo" in adr.lower()

          print(
              "CONFIRMED: the only telemetry schema/fixture lane is the "
              "TraceReceiptLink linkage-only profile, and it declares no raw-content fields."
          )
          print(
              "CONFIRMED: no_raw_in_telemetry remains an allow-by-default PROPOSED "
              "Rego stub and the operational telemetry validator remains unimplemented."
          )
          print(
              "WORKFLOW_SKIPPED_EXPLICIT: no operational telemetry event or "
              "raw-evidence payload was evaluated."
          )
          print(
              "WORKFLOW_HOLD: no accepted operational event/payload schema, allowlist, "
              "redactor, policy bundle, emitter, telemetry receipt flow, or sink control exists."
          )
          print(
              "Linkage metadata is readiness evidence only; it is not proof that "
              "operational telemetry cannot disclose raw evidence."
          )
          PY

      - name: Record raw-evidence telemetry boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Raw evidence in telemetry"
            echo
            echo "- **WORKFLOW_SKIPPED_EXPLICIT / WORKFLOW_HOLD:** the bounded TraceReceiptLink profile is linkage metadata and contains no raw-content fields, but the named Rego policy is allow-by-default scaffolding and the operational telemetry validator remains unimplemented."
            echo "- Result: ${{ job.status }}. No operational telemetry event was evaluated; linkage metadata is not proof that operational telemetry cannot disclose raw evidence."
            echo "- No telemetry, redaction, policy decision, receipt, proof, release record, or publication authority was emitted."
          } >> "$GITHUB_STEP_SUMMARY"

  no-prompts:
    name: no-prompts
    needs:
      - no-raw-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out inspected revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up inspection Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Confirm prompt telemetry enforcement remains an explicit hold
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          policy_path = Path("policy/ui/no_prompt_in_telemetry.rego")
          contract_path = Path("contracts/telemetry/README.md")
          standard_path = Path("docs/standards/TELEMETRY_MINIMUMS.md")
          adr_path = Path("docs/adr/ADR-0016-telemetry-redaction-posture.md")
          link_schema_path = Path(
              "schemas/contracts/v1/telemetry/trace_receipt_link.schema.json"
          )
          link_fixture_root = Path(
              "fixtures/contracts/v1/telemetry/trace_receipt_link"
          )
          required = [
              policy_path,
              contract_path,
              standard_path,
              adr_path,
              link_schema_path,
              link_fixture_root / "valid" / "valid_linked.json",
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          assert not missing, (
              f"required prompt-telemetry evidence is missing: {missing}"
          )

          policy = policy_path.read_text(encoding="utf-8")
          assert "Status: PROPOSED greenfield stub. No real rules yet." in policy
          assert "package kfm.no_prompt_in_telemetry" in policy
          assert "default deny := false" in policy

          contract = contract_path.read_text(encoding="utf-8").lower()
          standard = standard_path.read_text(encoding="utf-8").lower()
          adr = adr_path.read_text(encoding="utf-8").lower()
          assert "raw prompts" in contract
          assert "no prompt content" in adr
          assert "status: proposed" in adr
          assert "status: draft" in standard

          for root in [
              Path("fixtures/telemetry"),
              Path("tests/telemetry"),
          ]:
              assert not root.exists(), (
                  f"{root} has appeared; wire prompt-free positive and prompt-bearing "
                  "negative cases to the accepted policy/validator"
              )

          def declared_properties(value):
              fields = set()
              if isinstance(value, dict):
                  properties = value.get("properties")
                  if isinstance(properties, dict):
                      fields.update(properties)
                  for item in value.values():
                      fields.update(declared_properties(item))
              elif isinstance(value, list):
                  for item in value:
                      fields.update(declared_properties(item))
              return fields

          def actual_keys(value):
              fields = set()
              if isinstance(value, dict):
                  fields.update(value)
                  for item in value.values():
                      fields.update(actual_keys(item))
              elif isinstance(value, list):
                  for item in value:
                      fields.update(actual_keys(item))
              return fields

          prompt_fields = {
              "prompt",
              "system_prompt",
              "user_prompt",
              "messages",
              "completion",
              "response_text",
              "model_input",
              "model_output",
          }
          schema = json.loads(link_schema_path.read_text(encoding="utf-8"))
          declared_prompt = declared_properties(schema) & prompt_fields
          assert not declared_prompt, (
              "the linkage-only schema declares prompt fields: "
              f"{sorted(declared_prompt)}"
          )
          for path in sorted(link_fixture_root.rglob("*.json")):
              value = json.loads(path.read_text(encoding="utf-8"))
              present_prompt = actual_keys(value) & prompt_fields
              assert not present_prompt, (
                  f"{path.as_posix()} contains prompt fields: "
                  f"{sorted(present_prompt)}"
              )

          print(
              "CONFIRMED: no_prompt_in_telemetry remains an allow-by-default "
              "PROPOSED Rego stub."
          )
          print(
              "CONFIRMED: the linkage-only TraceReceiptLink profile declares no "
              "prompt fields; telemetry docs forbid raw prompt content."
          )
          print(
              "WORKFLOW_SKIPPED_EXPLICIT: no operational telemetry event or "
              "prompt-bearing negative payload was evaluated."
          )
          print(
              "WORKFLOW_HOLD: no accepted operational event/payload schema, "
              "prompt-field allowlist, redactor, policy implementation, or emitter exists."
          )
          print(
              "Linkage metadata and documentation are not proof that operational "
              "telemetry cannot disclose prompts."
          )
          PY

      - name: Record prompt telemetry boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Prompts in telemetry"
            echo
            echo "- **WORKFLOW_SKIPPED_EXPLICIT / WORKFLOW_HOLD:** the linkage-only TraceReceiptLink profile contains no prompt fields, but prompt exclusion remains documentation plus allow-by-default policy scaffolding without an operational event/payload redactor or executable prompt-bearing telemetry case."
            echo "- Result: ${{ job.status }}. No operational event or prompt-bearing payload was evaluated; linkage metadata and documentation are not operational proof."
            echo "- No telemetry, redaction, policy decision, receipt, proof, release record, or publication authority was emitted."
          } >> "$GITHUB_STEP_SUMMARY"

  no-restricted-coords:
    name: no-restricted-coords
    needs:
      - no-prompts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out inspected revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up inspection Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Confirm restricted-coordinate telemetry enforcement remains an explicit hold
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          policy_path = Path("policy/telemetry/no_restricted_coords.rego")
          contract_path = Path("contracts/telemetry/README.md")
          standard_path = Path("docs/standards/TELEMETRY_MINIMUMS.md")
          adr_path = Path("docs/adr/ADR-0016-telemetry-redaction-posture.md")
          link_schema_path = Path(
              "schemas/contracts/v1/telemetry/trace_receipt_link.schema.json"
          )
          link_fixture_root = Path(
              "fixtures/contracts/v1/telemetry/trace_receipt_link"
          )
          required = [
              policy_path,
              contract_path,
              standard_path,
              adr_path,
              link_schema_path,
              link_fixture_root / "valid" / "valid_linked.json",
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          assert not missing, (
              f"required coordinate-telemetry evidence is missing: {missing}"
          )

          policy = policy_path.read_text(encoding="utf-8")
          assert "Status: PROPOSED greenfield stub. No real rules yet." in policy
          assert "package kfm.no_restricted_coords" in policy
          assert "default deny := false" in policy

          contract = contract_path.read_text(encoding="utf-8").lower()
          standard = standard_path.read_text(encoding="utf-8").lower()
          adr = adr_path.read_text(encoding="utf-8").lower()
          assert "exact restricted coordinates" in contract
          assert "replaces precise `lat` / `lon`" in adr
          assert "status: proposed" in adr
          assert "status: draft" in standard

          for root in [
              Path("fixtures/telemetry"),
              Path("tests/telemetry"),
          ]:
              assert not root.exists(), (
                  f"{root} has appeared; wire generalized/redacted positive cases and "
                  "exact-coordinate negative cases to the accepted policy/validator"
              )

          def declared_properties(value):
              fields = set()
              if isinstance(value, dict):
                  properties = value.get("properties")
                  if isinstance(properties, dict):
                      fields.update(properties)
                  for item in value.values():
                      fields.update(declared_properties(item))
              elif isinstance(value, list):
                  for item in value:
                      fields.update(declared_properties(item))
              return fields

          def actual_keys(value):
              fields = set()
              if isinstance(value, dict):
                  fields.update(value)
                  for item in value.values():
                      fields.update(actual_keys(item))
              elif isinstance(value, list):
                  for item in value:
                      fields.update(actual_keys(item))
              return fields

          coordinate_fields = {
              "lat",
              "lon",
              "latitude",
              "longitude",
              "coordinates",
              "geometry",
              "bbox",
              "point",
              "location",
          }
          schema = json.loads(link_schema_path.read_text(encoding="utf-8"))
          declared_coords = declared_properties(schema) & coordinate_fields
          assert not declared_coords, (
              "the linkage-only schema declares coordinate fields: "
              f"{sorted(declared_coords)}"
          )
          for path in sorted(link_fixture_root.rglob("*.json")):
              value = json.loads(path.read_text(encoding="utf-8"))
              present_coords = actual_keys(value) & coordinate_fields
              assert not present_coords, (
                  f"{path.as_posix()} contains coordinate fields: "
                  f"{sorted(present_coords)}"
              )

          print(
              "CONFIRMED: no_restricted_coords remains an allow-by-default "
              "PROPOSED Rego stub."
          )
          print(
              "CONFIRMED: the linkage-only TraceReceiptLink profile declares no "
              "coordinate fields; telemetry docs forbid exact restricted coordinates."
          )
          print(
              "WORKFLOW_SKIPPED_EXPLICIT: no operational telemetry event or "
              "exact-coordinate negative payload was evaluated."
          )
          print(
              "WORKFLOW_HOLD: no accepted operational geometry field schema, "
              "sensitivity binding, redactor/generalizer, policy implementation, or emitter exists."
          )
          print(
              "Linkage metadata and documentation are not proof that operational "
              "telemetry cannot disclose restricted coordinates."
          )
          PY

      - name: Record restricted-coordinate telemetry boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Restricted coordinates in telemetry"
            echo
            echo "- **WORKFLOW_SKIPPED_EXPLICIT / WORKFLOW_HOLD:** the linkage-only TraceReceiptLink profile contains no coordinate fields, but coordinate exclusion remains documentation plus allow-by-default policy scaffolding without an operational geometry schema, sensitivity binding, redactor/generalizer, or exact-coordinate telemetry case."
            echo "- Result: ${{ job.status }}. No operational event or exact-coordinate payload was evaluated; linkage metadata and documentation are not operational proof."
            echo "- No telemetry, redaction, policy decision, receipt, proof, release record, or publication authority was emitted."
          } >> "$GITHUB_STEP_SUMMARY"

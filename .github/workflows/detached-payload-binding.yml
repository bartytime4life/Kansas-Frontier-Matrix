# Validate the fixture-only DetachedPayloadBinding contract family.
name: detached-payload-binding

"on":
  pull_request:
    paths:
      - ".github/workflows/detached-payload-binding.yml"
      - "contracts/evidence/detached_payload_binding.md"
      - "schemas/contracts/v1/evidence/detached_payload_binding.schema.json"
      - "fixtures/contracts/v1/evidence/detached_payload_binding/**"
      - "tools/validators/evidence/validate_detached_payload_binding.py"
      - "tests/validators/evidence/test_validate_detached_payload_binding.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-detached-payload-binding-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/detached-payload-binding.yml"
      - "contracts/evidence/detached_payload_binding.md"
      - "schemas/contracts/v1/evidence/detached_payload_binding.schema.json"
      - "fixtures/contracts/v1/evidence/detached_payload_binding/**"
      - "tools/validators/evidence/validate_detached_payload_binding.py"
      - "tests/validators/evidence/test_validate_detached_payload_binding.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-detached-payload-binding-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detached-payload-binding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
      - name: Validate metadata, fixtures, and detached bytes
        run: |
          set -euo pipefail
          python -m unittest \
            tests.validators.evidence.test_validate_detached_payload_binding \
            --verbose
          python tools/validators/evidence/validate_detached_payload_binding.py --fixtures
          python tools/validators/evidence/validate_detached_payload_binding.py \
            fixtures/contracts/v1/evidence/detached_payload_binding/valid/valid_binding.json \
            --payload-file \
            fixtures/contracts/v1/evidence/detached_payload_binding/payload/synthetic_payload.bin
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-detached-payload-binding-20260808.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### DetachedPayloadBinding"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed metadata, safe/canonical HTTPS mirrors, deterministic identity, and exact local fixture byte binding."
            echo "- Boundary: no URL is fetched and PASS does not resolve evidence, verify a bundle signature, establish rights or policy, promote, release, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the fixture-only asynchronous-transfer assessment candidate.
name: asynchronous-transfer-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/asynchronous-transfer-assessment.yml"
      - "contracts/source/asynchronous_transfer_assessment.md"
      - "schemas/contracts/v1/source/asynchronous_transfer_assessment.schema.json"
      - "fixtures/contracts/v1/source/asynchronous_transfer_assessment/**"
      - "tools/validators/source/validate_asynchronous_transfer_assessment.py"
      - "tests/validators/test_validate_asynchronous_transfer_assessment.py"
      - "docs/intake/exploratory/asynchronous-transfer-assessment-source-map.md"
      - "contracts/source/source_descriptor.md"
      - "contracts/source/source_polling_checkpoint.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-asynchronous-transfer-assessment-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/asynchronous-transfer-assessment.yml"
      - "contracts/source/asynchronous_transfer_assessment.md"
      - "schemas/contracts/v1/source/asynchronous_transfer_assessment.schema.json"
      - "fixtures/contracts/v1/source/asynchronous_transfer_assessment/**"
      - "tools/validators/source/validate_asynchronous_transfer_assessment.py"
      - "tests/validators/test_validate_asynchronous_transfer_assessment.py"
      - "docs/intake/exploratory/asynchronous-transfer-assessment-source-map.md"
      - "contracts/source/source_descriptor.md"
      - "contracts/source/source_polling_checkpoint.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-asynchronous-transfer-assessment-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asynchronous-transfer-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-asynchronous-transfer-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic tests
        run: |
          python -m unittest -v tests.validators.test_validate_asynchronous_transfer_assessment
          python tools/validators/source/validate_asynchronous_transfer_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-asynchronous-transfer-assessment-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### AsynchronousTransferAssessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only provider-job, partial-transfer, checkpoint, digest, retry, and ingest-candidate reconciliation."
            echo "- Boundary: no request, download, RAW write, ingest, promotion, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

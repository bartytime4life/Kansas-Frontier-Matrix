# KFM Agriculture domain CI readiness workflow.
# Status: one bounded fixture-only CDL watcher proof is executable in this lane;
# three dedicated Agriculture validator suites are separately governed; broader
# domain validation, proof, and release-dry-run producers remain held.
#
# Authority boundary:
# - This workflow proves one synthetic ingest-adjacent review-signal helper and
#   reports whether broader Agriculture CI lanes are ready to graduate from
#   documentation-backed scaffolds.
# - It does not validate Agriculture truth, build an EvidenceBundle or ProofPack,
#   admit sources, apply policy, promote lifecycle artifacts, approve release,
#   write published data, deploy, or publish.
name: domain-agriculture

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-agriculture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  validate-agriculture:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Agriculture boundaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Evaluate Agriculture validation readiness
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "docs/domains/agriculture/DOMAIN.md"
            "contracts/domains/agriculture/README.md"
            "schemas/contracts/v1/domains/agriculture/README.md"
            "fixtures/domains/agriculture/README.md"
            "policy/domains/agriculture/README.md"
            "tests/domains/agriculture/README.md"
            "tests/ingest/cdl_watch/test_cdl_watch.py"
            "tests/ingest/cdl_watch/fixtures/no_material_change/prior_sidecar.json"
            "tests/ingest/cdl_watch/fixtures/no_material_change/current_sidecar.json"
            "tests/validators/domains/agriculture/hls_ndvi_zonal_materiality/test_validate_hls_ndvi_zonal_materiality.py"
            "tests/validators/domains/agriculture/ndvi_readiness/test_validate_ndvi_readiness.py"
            "tests/validators/domains/agriculture/vegetation_connectivity_gate/test_validate_connectivity_gate.py"
            "tools/ingest/cdl_watch/cdl_watch.py"
            "tools/validators/agriculture/README.md"
            "tools/validators/domains/agriculture/README.md"
            "tools/validators/domains/agriculture/vegetation_connectivity_gate/validate_connectivity_gate.py"
            ".github/workflows/agriculture-hls-ndvi-zonal-materiality.yml"
            ".github/workflows/agriculture-ndvi-readiness.yml"
            ".github/workflows/agriculture-vegetation-connectivity-gate.yml"
            "contracts/domains/agriculture/vegetation_connectivity_gate.md"
            "fixtures/domains/agriculture/vegetation_connectivity_gate/cases.json"
            "schemas/contracts/v1/domains/agriculture/vegetation_connectivity_gate.schema.json"
            "release/agriculture/README.md"
          )

          for required_path in "${required_paths[@]}"; do
            if [[ ! -e "$required_path" ]]; then
              echo "::error::Required Agriculture boundary is missing: $required_path"
              exit 1
            fi
          done

          python - <<'PY'
          from pathlib import Path

          from tools.validators.ci_readiness import (
              PLACEHOLDER_DOCUMENT_NAMES,
              PLACEHOLDER_DOCUMENT_SUFFIXES,
              classify_test_source,
              classify_validator_source,
          )


          def assert_no_symlinks(root: Path, label: str) -> None:
              symlinks = sorted(path.as_posix() for path in root.rglob("*") if path.is_symlink())
              if symlinks:
                  raise SystemExit(f"{label} inventory contains symlinks: {symlinks}.")


          test_root = Path("tests/domains/agriculture")
          assert_no_symlinks(test_root, "Agriculture test")
          test_inventory = sorted(path for path in test_root.rglob("*") if path.is_file())
          unexpected_test_sources = sorted(
              path.as_posix()
              for path in test_inventory
              if path.suffix != ".py"
              and path.name not in PLACEHOLDER_DOCUMENT_NAMES
              and path.suffix.lower() not in PLACEHOLDER_DOCUMENT_SUFFIXES
          )
          if unexpected_test_sources:
              raise SystemExit(
                  "Agriculture test inventory contains unexpected non-document sources: "
                  f"{unexpected_test_sources}."
              )
          test_paths = [path for path in test_inventory if path.suffix == ".py"]
          if not test_paths:
              raise SystemExit("Agriculture test inventory contains no Python modules.")
          for path in test_paths:
              classification = classify_test_source(path.read_text(encoding="utf-8"))
              if not classification.placeholder:
                  raise SystemExit(
                      f"Agriculture test placeholder changed at {path}; "
                      "review and wire it deliberately."
                  )

          direct_validator_root = Path("tools/validators/agriculture")
          assert_no_symlinks(direct_validator_root, "Agriculture direct validator")
          expected_direct_inventory = {".gitkeep", "README.md"}
          observed_direct_inventory = {
              path.relative_to(direct_validator_root).as_posix()
              for path in direct_validator_root.rglob("*")
              if path.is_file()
          }
          if observed_direct_inventory != expected_direct_inventory:
              raise SystemExit(
                  "Agriculture direct validator inventory changed; "
                  f"expected={sorted(expected_direct_inventory)}; "
                  f"observed={sorted(observed_direct_inventory)}."
              )

          domain_validator_root = Path("tools/validators/domains/agriculture")
          assert_no_symlinks(domain_validator_root, "Agriculture domain validator")
          expected_placeholder_validators = {
              "validate_catalog_matrix.py",
              "validate_evidence_bundle.py",
              "validate_schema.py",
              "validate_source_descriptor.py",
          }
          expected_dedicated_validator_files = {
              "hls_ndvi_zonal_materiality/README.md",
              "hls_ndvi_zonal_materiality/validate_hls_ndvi_zonal_materiality.py",
              "ndvi_readiness/README.md",
              "ndvi_readiness/validate_ndvi_readiness.py",
              "vegetation_connectivity_gate/validate_connectivity_gate.py",
          }
          expected_domain_inventory = {
              "README.md",
              "soil-join/.gitkeep",
              "soil-join/README.md",
              *expected_placeholder_validators,
              *expected_dedicated_validator_files,
          }
          observed_domain_inventory = {
              path.relative_to(domain_validator_root).as_posix(): path
              for path in domain_validator_root.rglob("*")
              if path.is_file()
          }
          if set(observed_domain_inventory) != expected_domain_inventory:
              raise SystemExit(
                  "Agriculture domain validator inventory changed; "
                  f"expected={sorted(expected_domain_inventory)}; "
                  f"observed={sorted(observed_domain_inventory)}."
              )

          for name in sorted(expected_placeholder_validators):
              classification = classify_validator_source(
                  observed_domain_inventory[name].read_text(encoding="utf-8")
              )
              if (
                  not classification.placeholder
                  or classification.detail != "exact validator placeholder"
              ):
                  raise SystemExit(
                      f"Agriculture validator scaffold changed at "
                      f"{observed_domain_inventory[name]}; review and wire it deliberately."
                  )

          dedicated_validator_paths = sorted(
              name
              for name in expected_dedicated_validator_files
              if name.endswith(".py")
          )
          for name in dedicated_validator_paths:
              classification = classify_validator_source(
                  observed_domain_inventory[name].read_text(encoding="utf-8")
              )
              if (
                  classification.placeholder
                  or classification.reason != "substantive_validator_module"
              ):
                  raise SystemExit(
                      "Dedicated Agriculture validator is not a substantive Python module: "
                      f"{observed_domain_inventory[name]} "
                      f"({classification.reason}: {classification.detail})."
                  )

          print(
              "READINESS_OK label=agriculture "
              f"tests={len(test_paths)} "
              f"placeholder_validators={len(expected_placeholder_validators)} "
              f"dedicated_validators={len(dedicated_validator_paths)}"
          )
          print(
              "Dedicated HLS NDVI materiality, NDVI readiness, and vegetation "
              "connectivity suites remain owned by their path-filtered workflows."
          )
          PY

          echo "WORKFLOW_SKIPPED_EXPLICIT: validate-agriculture"
          echo "WORKFLOW_HOLD: broader Agriculture executable validation is not established"

      - name: Run bounded CDL material-change watcher proof
        env:
          KFM_NO_NETWORK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest tests.ingest.cdl_watch.test_cdl_watch --verbose

      - name: Record Agriculture validation hold
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Agriculture validation status

          `WORKFLOW_SKIPPED_EXPLICIT`

          `WORKFLOW_HOLD: broader Agriculture executable validation is not established`

          Recognized placeholder inventory is not domain validation. This job
          separately executes the synthetic, fixture-only CDL material-change
          watcher proof; that helper is ingest-adjacent and review-signal-only.

          The direct Agriculture validator lane remains documentation-only. The
          canonical domain lane contains four recognized greenfield validator
          stubs plus three substantive, fixture-only validators. The HLS NDVI zonal
          materiality, smoke-aware NDVI readiness, and vegetation connectivity
          suites remain executed by their own path-filtered workflows rather than
          this broad readiness lane.

          The CDL helper compares bounded local sidecars with networking denied.
          It cannot admit a source, decide canonical materiality policy, create
          a receipt or proof, promote lifecycle state, release, or publish.

          This result confirms only that the known boundaries still match that
          maturity posture. It does not validate Agriculture contracts, schemas,
          source roles, rights, sensitivity, evidence, policy, lifecycle state,
          cross-domain joins, public aggregation, or release readiness.
          EOF

  build-proof-agriculture:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Agriculture proof boundaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate Agriculture proof readiness
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "data/proofs/README.md"
            "release/agriculture/README.md"
            "release/candidates/agriculture/county_year_panel_v0/README.md"
            "tests/domains/agriculture/README.md"
          )

          for required_path in "${required_paths[@]}"; do
            if [[ ! -e "$required_path" ]]; then
              echo "::error::Required Agriculture proof boundary is missing: $required_path"
              exit 1
            fi
          done

          if ! grep -Fq "BLOCKED_FOR_EVIDENCE_AND_VALIDATION" "release/agriculture/README.md"; then
            echo "::error::The documented Agriculture candidate posture changed. Review proof and release gates before accepting this workflow."
            exit 1
          fi

          if ! grep -Fq 'Candidate status:** `PROPOSED`' "release/candidates/agriculture/county_year_panel_v0/README.md"; then
            echo "::error::The Agriculture candidate is no longer documented as PROPOSED. Replace this hold with the governed proof path before proceeding."
            exit 1
          fi

          if grep -Eq '^(agriculture-proof|proof-agriculture):' Makefile; then
            echo "::error::An Agriculture proof target now exists. Wire and validate it deliberately instead of retaining this hold."
            exit 1
          fi

          proof_implementation="$(find . -path './.git' -prune -o -type f \( -iname '*agriculture*proof*.py' -o -iname '*proof*agriculture*.py' -o -iname '*agriculture*proof*.mjs' -o -iname '*proof*agriculture*.mjs' \) -print -quit)"
          if [[ -n "$proof_implementation" ]]; then
            echo "::error::Potential Agriculture proof implementation surfaced at $proof_implementation. Establish its contract, tests, receipts, and rollback before wiring CI."
            exit 1
          fi

          echo "WORKFLOW_SKIPPED_EXPLICIT: build-proof-agriculture"
          echo "WORKFLOW_HOLD: no accepted Agriculture proof producer or deterministic proof command"

      - name: Record Agriculture proof hold
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Agriculture proof status

          `WORKFLOW_SKIPPED_EXPLICIT`

          `WORKFLOW_HOLD: no accepted Agriculture proof producer or deterministic proof command`

          The inspected county-year candidate remains proposed and blocked for
          evidence and validation. No accepted Agriculture proof builder,
          deterministic fixture-backed command, EvidenceRef-to-EvidenceBundle
          closure, proof manifest, or rollback-tested proof path is established.

          A green held result is readiness evidence only. It is not a ProofPack,
          EvidenceBundle, validation receipt, promotion decision, release
          approval, scientific endorsement, or publication authority.
          EOF

  publish-dry-run-agriculture:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Agriculture release boundaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate Agriculture release dry-run readiness
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "release/agriculture/README.md"
            "release/candidates/agriculture/county_year_panel_v0/README.md"
            "data/published/agriculture/README.md"
            ".github/workflows/release-dry-run.yml"
          )

          for required_path in "${required_paths[@]}"; do
            if [[ ! -e "$required_path" ]]; then
              echo "::error::Required Agriculture release boundary is missing: $required_path"
              exit 1
            fi
          done

          if ! grep -Fq "BLOCKED_FOR_EVIDENCE_AND_VALIDATION" "release/agriculture/README.md"; then
            echo "::error::The documented Agriculture release posture changed. Re-evaluate candidate, manifest, policy, evidence, review, correction, and rollback gates."
            exit 1
          fi

          if ! grep -Fq "No concrete Agriculture release approval" "release/agriculture/README.md"; then
            echo "::error::Concrete Agriculture release evidence may now exist. Replace this hold with an independently reviewed dry-run implementation."
            exit 1
          fi

          if grep -Eq '^(agriculture-release-dry-run|release-dry-run-agriculture):' Makefile; then
            echo "::error::An Agriculture release dry-run target now exists. Wire the accepted fail-closed command instead of retaining this hold."
            exit 1
          fi

          echo "WORKFLOW_SKIPPED_EXPLICIT: publish-dry-run-agriculture"
          echo "WORKFLOW_HOLD: no accepted Agriculture release dry-run command or manifest assembly contract"

      - name: Record Agriculture release dry-run hold
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Agriculture release dry-run status

          `WORKFLOW_SKIPPED_EXPLICIT`

          `WORKFLOW_HOLD: no accepted Agriculture release dry-run command or manifest assembly contract`

          This lane performs no release, promotion, publication, deployment,
          manifest generation, source access, network acquisition, or write to
          processed, catalog, proof, receipt, release, or published stores.

          Graduate it only after an accepted candidate identity, immutable
          artifact pointer, evidence closure, rights and sensitivity review,
          policy result, validation receipts, release manifest contract,
          separation of duties, correction path, and rollback target exist.

          A green held result does not mean Agriculture data is safe, approved,
          released, published, or suitable for operational or agronomic use.
          EOF

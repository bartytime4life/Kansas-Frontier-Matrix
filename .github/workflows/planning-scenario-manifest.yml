# Validate the synthetic, generalized PlanningScenarioManifest pilot.
name: planning-scenario-manifest

"on":
  pull_request:
    paths:
      - ".github/workflows/planning-scenario-manifest.yml"
      - "contracts/domains/water_planning/planning_scenario_manifest.md"
      - "schemas/contracts/v1/domains/water_planning/planning_scenario_manifest.schema.json"
      - "fixtures/domains/water_planning/planning_scenario_manifest/**"
      - "tools/validators/domains/water_planning/validate_planning_scenario_manifest.py"
      - "tests/validators/test_validate_planning_scenario_manifest.py"
      - "docs/intake/exploratory/planning-scenario-manifest-source-map.md"
      - "data/receipts/generated/genrec-planning-scenario-manifest-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/planning-scenario-manifest.yml"
      - "contracts/domains/water_planning/planning_scenario_manifest.md"
      - "schemas/contracts/v1/domains/water_planning/planning_scenario_manifest.schema.json"
      - "fixtures/domains/water_planning/planning_scenario_manifest/**"
      - "tools/validators/domains/water_planning/validate_planning_scenario_manifest.py"
      - "tests/validators/test_validate_planning_scenario_manifest.py"
      - "docs/intake/exploratory/planning-scenario-manifest-source-map.md"
      - "data/receipts/generated/genrec-planning-scenario-manifest-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planning-scenario-manifest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-planning-scenario-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test

      - name: Run focused tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/validators/test_validate_planning_scenario_manifest.py

      - name: Replay exact fixture polarity
        run: |
          set -euo pipefail
          python tools/validators/domains/water_planning/validate_planning_scenario_manifest.py --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-planning-scenario-manifest-20260809.json \
            --repo-root .

      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### PlanningScenarioManifest validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic shape, RFC 8785 body binding, temporal order, canonical references, surface/drawer parity, and false authority flags."
            echo "- A green result is not a prediction, alert, regulatory determination, evidence closure, participation approval, policy decision, review, release, rendering proof, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

name: temporal-authority-envelope
on:
  pull_request:
    paths:
      - 'contracts/evidence/temporal_authority_envelope.md'
      - 'schemas/contracts/v1/evidence/temporal_authority_envelope.schema.json'
      - 'fixtures/contracts/v1/evidence/temporal_authority_envelope/**'
      - 'tools/validators/evidence/validate_temporal_authority_envelope.py'
      - 'tests/evidence/test_temporal_authority_envelope.py'
      - '.github/workflows/temporal-authority-envelope.yml'
permissions:
  contents: read
jobs:
  validate-temporal-authority-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema pytest
      - run: python tools/validators/evidence/validate_temporal_authority_envelope.py fixtures/contracts/v1/evidence/temporal_authority_envelope/valid/current_observation.json
      - run: |
          for f in fixtures/contracts/v1/evidence/temporal_authority_envelope/invalid/*.json; do
            if python tools/validators/evidence/validate_temporal_authority_envelope.py "$f"; then exit 1; fi
          done
      - run: python -m pytest -q tests/evidence/test_temporal_authority_envelope.py

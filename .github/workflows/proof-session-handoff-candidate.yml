# Validate the fixture-only proof-session handoff candidate.
name: proof-session-handoff-candidate

"on":
  pull_request:
    paths:
      - ".github/workflows/proof-session-handoff-candidate.yml"
      - "contracts/governance/proof_session_handoff.md"
      - "schemas/contracts/v1/governance/proof_session_handoff.schema.json"
      - "fixtures/contracts/v1/governance/proof_session_handoff/**"
      - "tools/validators/governance/validate_proof_session_handoff.py"
      - "tests/validators/governance/test_validate_proof_session_handoff.py"
      - "docs/intake/exploratory/proof-session-handoff-source-map.md"
      - "docs/intake/exploratory/kfm-living-compass-working-edition-1-0-source-map.md"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-proof-session-handoff-20260811.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/proof-session-handoff-candidate.yml"
      - "contracts/governance/proof_session_handoff.md"
      - "schemas/contracts/v1/governance/proof_session_handoff.schema.json"
      - "fixtures/contracts/v1/governance/proof_session_handoff/**"
      - "tools/validators/governance/validate_proof_session_handoff.py"
      - "tests/validators/governance/test_validate_proof_session_handoff.py"
      - "docs/intake/exploratory/proof-session-handoff-source-map.md"
      - "docs/intake/exploratory/kfm-living-compass-working-edition-1-0-source-map.md"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-proof-session-handoff-20260811.json"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: proof-session-handoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC
jobs:
  validate:
    name: validate-proof-session-handoff-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic tests and fixture replay
        run: |
          python -m unittest -v tests.validators.governance.test_validate_proof_session_handoff
          python tools/validators/governance/validate_proof_session_handoff.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-proof-session-handoff-20260811.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### ProofSessionHandoffCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only bounded contributor experiment handoff."
            echo "- Boundary: no evidence, policy, review, proof, promotion, release, deployment, publication, lifecycle-write, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

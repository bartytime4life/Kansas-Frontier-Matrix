# Validate fixture-first SQL and synthetic spatial-temporal join assessments.
name: cross-lane-join-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/cross-lane-join-assessment.yml"
      - "contracts/joins/cross_lane_join_assessment.md"
      - "schemas/contracts/v1/joins/cross_lane_join_assessment.schema.json"
      - "tools/joins/join_candidates.py"
      - "fixtures/joins/cross_lane_join_assessment/**"
      - "tests/joins/**"
      - "docs/intake/exploratory/full-atlas-crosswalk-validator-source-map.md"
      - "data/receipts/generated/genrec-full-atlas-crosswalk-validator-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cross-lane-join-assessment.yml"
      - "contracts/joins/cross_lane_join_assessment.md"
      - "schemas/contracts/v1/joins/cross_lane_join_assessment.schema.json"
      - "tools/joins/join_candidates.py"
      - "fixtures/joins/cross_lane_join_assessment/**"
      - "tests/joins/**"
      - "docs/intake/exploratory/full-atlas-crosswalk-validator-source-map.md"
      - "data/receipts/generated/genrec-full-atlas-crosswalk-validator-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-lane-join-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-cross-lane-join-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run fixture matrix
        run: python tools/joins/join_candidates.py --fixtures
      - name: Run focused tests
        run: python -m pytest tests/joins/test_join_candidates.py -q --strict-config --strict-markers
      - name: Validate generated authoring receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-full-atlas-crosswalk-validator-20260809.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Cross-lane join assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: parameterized in-memory exact-key SQL and synthetic spatial-temporal fixtures only."
            echo "- Boundary: ALLOW emits only a candidate report; no identity, evidence, policy, lifecycle, release, or publication effect."
          } >> "$GITHUB_STEP_SUMMARY"

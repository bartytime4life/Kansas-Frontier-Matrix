name: soil-component-profile

on:
  pull_request:
    paths:
      - 'schemas/contracts/v1/domains/soil/soil_component.schema.json'
      - 'fixtures/domains/soil/soil_component/**'
      - 'tools/validators/domains/soil/validate_soil_component.py'
      - 'tests/validators/domains/soil/test_soil_component.py'
      - '.github/workflows/soil-component-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Compile focused code
        run: |
          python -m py_compile tools/validators/domains/soil/validate_soil_component.py
          python -m py_compile tests/validators/domains/soil/test_soil_component.py
      - name: Replay exact fixtures
        run: python tools/validators/domains/soil/validate_soil_component.py --fixtures
      - name: Run deterministic tests
        run: python -m unittest -q tests.validators.domains.soil.test_soil_component
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo '### SoilComponent candidate profile'
            echo
            echo '- Fixture-only and no-network.'
            echo '- A PASS does not make the component a map unit, horizon, current field measurement, release, publication, or public-use decision.'
          } >> "$GITHUB_STEP_SUMMARY"

name: people-dna-land-evidence-bundle-convergence

on:
  pull_request:
    paths:
      - 'schemas/contracts/v1/evidence/evidence_bundle.schema.json'
      - 'schemas/contracts/v1/domains/people-dna-land/evidence_bundle.schema.json'
      - 'fixtures/contracts/v1/evidence/evidence_bundle/**'
      - 'tools/validators/validate_people_dna_land_evidence_bundle_projection.py'
      - 'tests/validators/domains/people-dna-land/test_people_dna_land_evidence_bundle_schema_convergence.py'
      - '.github/workflows/people-dna-land-evidence-bundle-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install repository validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Compile focused validator and tests
        run: >-
          python -m py_compile
          tools/validators/validate_people_dna_land_evidence_bundle_projection.py
          tests/validators/domains/people-dna-land/test_people_dna_land_evidence_bundle_schema_convergence.py
      - name: Run deterministic convergence tests
        run: >-
          python -m unittest discover
          --start-directory tests/validators/domains/people-dna-land
          --pattern 'test_people_dna_land_evidence_bundle_schema_convergence.py'
          --verbose
      - name: Validate shared fixtures through the People/DNA/Land projection
        run: python tools/validators/validate_people_dna_land_evidence_bundle_projection.py --fixtures

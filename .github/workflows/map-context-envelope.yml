# Validate renderer-neutral MapContextEnvelope candidates.
name: map-context-envelope

"on":
  pull_request:
    paths:
      - ".github/workflows/map-context-envelope.yml"
      - "contracts/ui/map_context_envelope.md"
      - "contracts/ui/map_context_envelope/README.md"
      - "schemas/contracts/v1/ui/map_context_envelope.schema.json"
      - "fixtures/ui/map_context_envelope/**"
      - "tools/validators/ui/validate_map_context_envelope.py"
      - "tests/validators/test_validate_map_context_envelope.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-map-context-envelope-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-context-envelope.yml"
      - "contracts/ui/map_context_envelope.md"
      - "contracts/ui/map_context_envelope/README.md"
      - "schemas/contracts/v1/ui/map_context_envelope.schema.json"
      - "fixtures/ui/map_context_envelope/**"
      - "tools/validators/ui/validate_map_context_envelope.py"
      - "tests/validators/test_validate_map_context_envelope.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-map-context-envelope-*.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-context-envelope-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test
      - name: Run deterministic no-network validation
        run: |
          set -euo pipefail
          python -m unittest discover --start-directory tests/validators --pattern 'test_validate_map_context_envelope.py' --verbose
          python tools/validators/ui/validate_map_context_envelope.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-map-context-envelope-20260806.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### MapContextEnvelope"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: closed renderer-neutral request-context shape, release/evidence unions, selection/layer closure, time/viewport/filter rules, identity, fixture polarity, and authoring receipt integrity."
            echo "- Boundary: a green result does not resolve evidence, evaluate policy, authorize release/public use, or prove a deployed map/API/Focus Mode path."
          } >> "$GITHUB_STEP_SUMMARY"

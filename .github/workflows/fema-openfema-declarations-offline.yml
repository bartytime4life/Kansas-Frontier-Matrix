name: fema-openfema-declarations-offline
on:
  pull_request:
    paths:
      - 'connectors/fema/src/fema/openfema_declarations.py'
      - 'connectors/fema/tests/test_openfema_declarations.py'
      - '.github/workflows/fema-openfema-declarations-offline.yml'
  push:
    branches: [main]
    paths:
      - 'connectors/fema/src/fema/openfema_declarations.py'
      - 'connectors/fema/tests/test_openfema_declarations.py'
      - '.github/workflows/fema-openfema-declarations-offline.yml'
permissions:
  contents: read
concurrency:
  group: fema-openfema-declarations-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Run standard-library-only synthetic tests
        run: python -m unittest discover -s connectors/fema/tests -p 'test_openfema_declarations.py' -v
      - name: Record evidence boundary
        if: always()
        run: |
          echo 'Offline synthetic OpenFEMA Disaster Declarations Summaries planner/parser checks only. Administrative records, not observed hazards. No provider fetch, table activation, rights review, source admission, capture completeness, active Site integration, release, or deployment proof.' >> "$GITHUB_STEP_SUMMARY"

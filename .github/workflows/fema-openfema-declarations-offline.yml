name: fema-openfema-declarations-offline
on:
  pull_request:
    paths:
      - 'connectors/fema/src/fema/openfema_declarations.py'
      - 'connectors/fema/src/fema/fetch.py'
      - 'connectors/fema/src/fema/admit.py'
      - 'connectors/fema/src/fema/descriptor.yaml'
      - 'connectors/fema/tests/test_openfema_declarations.py'
      - 'connectors/fema/tests/test_fetch_admit.py'
      - 'packages/connectors-core/src/connectors_core/**'
      - '.github/workflows/fema-openfema-declarations-offline.yml'
  push:
    branches: [main]
    paths:
      - 'connectors/fema/src/fema/openfema_declarations.py'
      - 'connectors/fema/src/fema/fetch.py'
      - 'connectors/fema/src/fema/admit.py'
      - 'connectors/fema/src/fema/descriptor.yaml'
      - 'connectors/fema/tests/test_openfema_declarations.py'
      - 'connectors/fema/tests/test_fetch_admit.py'
      - 'packages/connectors-core/src/connectors_core/**'
      - '.github/workflows/fema-openfema-declarations-offline.yml'
permissions:
  contents: read
concurrency:
  group: fema-openfema-declarations-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The interpreters tools/ci/python-test.lock declares; the stdlib json decoder's
        # depth behavior (and so parser routing) differs between them.
        python: ['3.11', '3.12']
    env:
      KFM_NO_NETWORK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Run standard-library synthetic tests (connectors-core imported from source)
        run: |
          python -m unittest discover -s connectors/fema/tests -p 'test_openfema_declarations.py' -v
          python -m unittest discover -s connectors/fema/tests -p 'test_fetch_admit.py' -v
      - name: Record evidence boundary
        if: always()
        run: |
          echo 'Offline synthetic OpenFEMA Disaster Declarations Summaries planner/parser, injected-transport retrieval-episode, and page-routing checks only; the checked-in descriptor (role/rights set 2026-09-28) releases RAW/QUARANTINE candidate routes, still without any write or admission. Administrative records, not observed hazards. No provider fetch, table activation, rights review, source admission, capture completeness, active Site integration, release, or deployment proof.' >> "$GITHUB_STEP_SUMMARY"

# Temporary PR-locked wrapper for the pinned one-shot repair definition.
# The successful repair tree contains neither this file nor the executor it invokes.
name: repository-topology-one-shot-wrapper

"on":
  pull_request:
    paths:
      - .github/workflows/repository-topology-one-shot-wrapper.yml

permissions:
  contents: write

concurrency:
  group: repository-topology-one-shot-wrapper-2998
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC
  KFM_TRUSTED_BASE_REF: 808fdb5b61443e850cac840a594d558b92ec608d

jobs:
  repair:
    if: >-
      github.repository == 'bartytime4life/Kansas-Frontier-Matrix' &&
      github.event.pull_request.number == 2998 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/repair-current-topology-20260817' &&
      github.actor == 'bartytime4life'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trigger head with branch credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Execute only the pinned repair and validation steps
        shell: bash
        env:
          TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_HEAD_SHA"
          git checkout -B agent/repair-current-topology-20260817 \
            304d53acbdcbf3ba99de4368453ff01ef671c60e
          test "$(git hash-object .github/workflows/repository-topology-one-shot-repair.yml)" = \
            "b589bef8dea9d2eb8d04c6002f564bbe92f9646f"

          python - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          import yaml

          workflow = yaml.safe_load(
              Path(
                  ".github/workflows/repository-topology-one-shot-repair.yml"
              ).read_text(encoding="utf-8")
          )
          wanted = (
              "Verify exact branch parent and protected preimages",
              "Apply deterministic source-path and validator repair",
              "Regenerate and prove the strict-shrink baseline",
              "Run focused no-network validation",
          )
          scripts = {
              step.get("name"): step.get("run")
              for step in workflow["jobs"]["repair"]["steps"]
              if isinstance(step, dict)
          }
          if tuple(name for name in wanted if name in scripts) != wanted:
              raise SystemExit("pinned repair step inventory changed")

          environment = os.environ.copy()
          for name in wanted:
              script = scripts[name]
              if not isinstance(script, str) or not script.strip():
                  raise SystemExit(f"missing script for {name}")
              print(f"::group::{name}")
              subprocess.run(
                  ["bash", "-lc", script],
                  check=True,
                  env=environment,
              )
              print("::endgroup::")
          PY

          git config user.name "Andy"
          git config user.email "blackbart555@gmail.com"
          git commit -m "fix(repo): reconcile topology transition"
          git merge --no-ff -s ours "$TRIGGER_HEAD_SHA" \
            -m "chore(repo): retain one-shot trigger ancestry"
          git merge-base --is-ancestor "$TRIGGER_HEAD_SHA" HEAD
          git push origin HEAD:agent/repair-current-topology-20260817

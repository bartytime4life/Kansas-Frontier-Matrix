# Diagnostic only; do not merge. Source-under-test is the explicit product SHA.
name: m18-temporal-review-receipt-validation
"on":
  push:
    branches: [agent/m18-temporal-validation-20260905]
    paths: [.github/workflows/m18-temporal-review-receipt-validation.yml]
permissions:
  contents: read

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-reviewed-head:
    name: validate-reviewed-head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed product head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fd2ca4b2d51ec9f0840a6c635591b956d96851bb
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fd2ca4b2d51ec9f0840a6c635591b956d96851bb
          git log -1 --format='%H %T'
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared hashed validation dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test
      - name: Validate generated receipt and approved-review claim
        shell: bash
        run: |
          set -euo pipefail
          receipt=data/receipts/generated/genrec-m18-temporal-ci-closure-20260905.json
          python tools/validators/validate_generated_receipt.py "$receipt"
          python tools/validators/validate_generated_receipt.py --require-review-claim "$receipt"
      - name: Recheck workflow source contract at reviewed head
        shell: bash
        run: python -m pytest -q tests/ci/test_temporal_view_state_workflow.py
      - name: Recheck temporal schema and compatibility lanes
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover --start-directory tests/validators --pattern 'test_validate_temporal_view_state*.py' --verbose
          python tools/validators/validate_temporal_view_state.py --fixtures
          python -m pytest -q tests/schemas/test_common_contracts.py -k temporal_view_state
          python -m unittest discover --start-directory tests/evidence --pattern 'test_evidence_temporal_posture_assessment.py' --verbose
      - name: Preserve tracked source
        if: ${{ !cancelled() }}
        shell: bash
        run: git diff --exit-code

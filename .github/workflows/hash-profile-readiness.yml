name: hash-profile-readiness

"on":
  pull_request:
    paths:
      - ".github/workflows/hash-profile-readiness.yml"
      - "contracts/common/hash_profile_readiness_matrix.md"
      - "schemas/contracts/v1/common/hash_profile_readiness_matrix.schema.json"
      - "control_plane/hash_profile_readiness_matrix.json"
      - "fixtures/contracts/v1/common/hash_profile_readiness_matrix/**"
      - "tools/validators/validate_hash_profile_readiness_matrix.py"
      - "tests/validators/test_validate_hash_profile_readiness_matrix.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass4-hash-profile-readiness-20260808.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hash-profile-readiness.yml"
      - "contracts/common/hash_profile_readiness_matrix.md"
      - "schemas/contracts/v1/common/hash_profile_readiness_matrix.schema.json"
      - "control_plane/hash_profile_readiness_matrix.json"
      - "fixtures/contracts/v1/common/hash_profile_readiness_matrix/**"
      - "tools/validators/validate_hash_profile_readiness_matrix.py"
      - "tests/validators/test_validate_hash_profile_readiness_matrix.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass4-hash-profile-readiness-20260808.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hash-profile-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m unittest tests.validators.test_validate_hash_profile_readiness_matrix -v
          python tools/validators/validate_hash_profile_readiness_matrix.py --fixtures
          python tools/validators/validate_hash_profile_readiness_matrix.py control_plane/hash_profile_readiness_matrix.json
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass4-hash-profile-readiness-20260808.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Hash profile readiness"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: inactive object-family role tuples, exact spec_hash baseline, canonical ordering, and fixture polarity."
            echo "- Boundary: PASS does not adopt policy, activate BLAKE3/Bao, authorize signatures, migrate digests, release, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

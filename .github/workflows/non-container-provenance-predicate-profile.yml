# Validate the fixture-only non-container provenance predicate profile.
# This workflow performs no artifact access, signature, transparency, policy, release, or publication action.
name: non-container-provenance-predicate-profile

"on":
  pull_request:
    paths:
      - ".github/workflows/non-container-provenance-predicate-profile.yml"
      - "contracts/evidence/non_container_provenance_predicate_profile.md"
      - "schemas/contracts/v1/evidence/non_container_provenance_predicate_profile.schema.json"
      - "fixtures/contracts/v1/evidence/non_container_provenance_predicate_profile/**"
      - "tools/validators/evidence/validate_non_container_provenance_predicate_profile.py"
      - "tests/validators/evidence/test_non_container_provenance_predicate_profile.py"
      - "docs/intake/exploratory/pass-30-non-container-provenance-predicate-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-non-container-provenance-predicate-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/non-container-provenance-predicate-profile.yml"
      - "contracts/evidence/non_container_provenance_predicate_profile.md"
      - "schemas/contracts/v1/evidence/non_container_provenance_predicate_profile.schema.json"
      - "fixtures/contracts/v1/evidence/non_container_provenance_predicate_profile/**"
      - "tools/validators/evidence/validate_non_container_provenance_predicate_profile.py"
      - "tests/validators/evidence/test_non_container_provenance_predicate_profile.py"
      - "docs/intake/exploratory/pass-30-non-container-provenance-predicate-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-non-container-provenance-predicate-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: non-container-provenance-predicate-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-non-container-provenance-predicate-profile:
    name: validate-non-container-provenance-predicate-profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e .

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators/evidence \
            --pattern 'test_non_container_provenance_predicate_profile.py' \
            --verbose

      - name: Replay exact fixture polarity
        run: python tools/validators/evidence/validate_non_container_provenance_predicate_profile.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass30-non-container-provenance-predicate-20260809.json

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### NonContainerProvenancePredicateCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic predicate shape, binding closure, exact fixture polarity, and deterministic identity."
            echo "- Tests perform no artifact access, signature or transparency verification, policy evaluation, evidence admission, review, release, or publication."
            echo "- A green result is not SLSA conformance, provenance authenticity, OPA trust, release approval, or publication proof."
          } >> "$GITHUB_STEP_SUMMARY"

name: Temporary reconcile PR 3891

on:
  push:
    branches:
      - automation/markdown-hardening-checklist-evidence-scope-20260829-2144
    paths:
      - .github/workflows/reconcile-pr-3891.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'bartytime4life/Kansas-Frontier-Matrix'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: automation/markdown-hardening-checklist-evidence-scope-20260829-2144
          persist-credentials: true

      - name: Reconcile current main and close review findings
        shell: bash
        run: |
          set -euo pipefail
          branch='automation/markdown-hardening-checklist-evidence-scope-20260829-2144'
          workflow='.github/workflows/reconcile-pr-3891.yml'

          git config user.name 'kfm-reconciliation-bot'
          git config user.email '203533328+bartytime4life@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main

          python <<'PY'
          from pathlib import Path
          import re

          path = Path('infra/hardening/CHECKLIST.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace('version: v2\n', 'version: v2.1\n', 1)
          text = text.replace(
              'Select every scope actually reviewed:',
              'Select exactly one evidence scope. Leave the other two choices unchecked:',
              1,
          )
          scope_anchor = (
              '- [ ] **Mixed** — repository evidence and environment observations were both\n'
              '      inspected and kept distinguishable below.\n\n'
          )
          scope_note = (
              scope_anchor
              + 'A completed worksheet must contain exactly one checked scope. `Mixed` is the\n'
              + 'single choice for a review that used both evidence kinds; do not also check the\n'
              + 'two component choices.\n\n'
          )
          if scope_anchor not in text:
              raise SystemExit('evidence-scope anchor not found')
          text = text.replace(scope_anchor, scope_note, 1)

          instruction = (
              'Mark a checkbox only after recording its state and evidence reference. A green\n'
              'workflow supports only the assertions that workflow actually checks.\n'
          )
          replacement = (
              'Mark a checkbox only after recording its state and evidence reference. Every\n'
              'checkbox in sections 4–10 has a stable assertion ID and exactly one required row\n'
              'in the adjacent assertion register. Do not aggregate several assertion IDs into a\n'
              'single state. A green workflow supports only the assertions that workflow actually\n'
              'checks.\n'
          )
          if instruction not in text:
              raise SystemExit('state-record instruction anchor not found')
          text = text.replace(instruction, replacement, 1)

          prefixes = {
              4: ('PLACE', 5),
              5: ('SECRET', 5),
              6: ('EDGE', 6),
              7: ('ISOLATION', 6),
              8: ('DATA', 5),
              9: ('AUTH', 6),
              10: ('RECOVERY', 6),
          }
          all_ids = []
          checkbox_pattern = re.compile(r'(?m)^- \[ \] (?P<body>[^\n]*(?:\n[ \t]{6,}[^\n]*)*)')
          table_pattern = re.compile(
              r'\*\*State and evidence\*\*\n\n'
              r'\| Item \| State \| Evidence reference or `N/A` reason \|\n'
              r'\|---\|---\|---\|\n'
              r'(?:\|[^\n]*\|\n)+'
          )

          for number in range(10, 3, -1):
              start = text.index(f'## {number}.')
              next_heading = f'## {number + 1}.' if number < 10 else '## 11.'
              end = text.index(next_heading, start)
              section = text[start:end]
              prefix, expected = prefixes[number]
              matches = list(checkbox_pattern.finditer(section))
              if len(matches) != expected:
                  raise SystemExit(
                      f'section {number}: expected {expected} assertions, found {len(matches)}'
                  )

              rows = []
              for ordinal, match in enumerate(matches, 1):
                  assertion_id = f'{prefix}-{ordinal:02d}'
                  all_ids.append(assertion_id)
                  body = match.group('body')
                  plain = re.sub(r'\s+', ' ', body).strip().replace('|', '\\|')
                  rows.append(
                      f'| `{assertion_id}` | {plain} | `<state>` | '
                      f'`<immutable path, test, redacted observation, or N/A reason>` |'
                  )

              for ordinal, match in reversed(list(enumerate(matches, 1))):
                  assertion_id = f'{prefix}-{ordinal:02d}'
                  body = match.group('body')
                  section = section[:match.start()] + (
                      f'- [ ] **{assertion_id}** — {body}'
                  ) + section[match.end():]

              register = (
                  '**Assertion state and evidence (required)**\n\n'
                  'Complete exactly one row for every assertion ID above. A row may use `N/A`\n'
                  'only with a specific scope reason; blank or aggregate rows cannot support an\n'
                  '`EVIDENCE_COMPLETE` outcome.\n\n'
                  '| Assertion ID | Assertion | State | Evidence reference or `N/A` reason |\n'
                  '|---|---|---|---|\n'
                  + '\n'.join(rows)
                  + '\n'
              )
              section, substitutions = table_pattern.subn(register, section, count=1)
              if substitutions != 1:
                  raise SystemExit(f'section {number}: assertion table not replaced')
              text = text[:start] + section + text[end:]

          outcome_anchor = '### Review outcome\n\n'
          outcome_note = (
              '### Review outcome\n\n'
              'Before recording an outcome, verify that exactly one evidence scope is selected\n'
              'and that all 39 assertion IDs in sections 4–10 have a state and an evidence\n'
              'reference or specific `N/A` reason. Any missing, ambiguous, or aggregated row\n'
              'requires `HOLD`.\n\n'
          )
          if outcome_anchor not in text:
              raise SystemExit('review-outcome anchor not found')
          text = text.replace(outcome_anchor, outcome_note, 1)
          text = text.replace(
              '| `EVIDENCE_COMPLETE` | Every applicable item has bounded evidence and no checklist blocker remains. |',
              '| `EVIDENCE_COMPLETE` | Exactly one evidence scope is selected; every applicable assertion ID has its own bounded evidence row; and no checklist blocker remains. |',
              1,
          )
          text = text.replace(
              '| `EVIDENCE_COMPLETE_WITH_FOLLOW_UP` | Bounded review evidence is complete; explicitly non-blocking follow-up remains tracked. |',
              '| `EVIDENCE_COMPLETE_WITH_FOLLOW_UP` | The same per-assertion evidence closure is complete; explicitly non-blocking follow-up remains tracked. |',
              1,
          )

          if len(all_ids) != 39:
              raise SystemExit(f'expected 39 assertion IDs, produced {len(all_ids)}')
          if 'Select every scope actually reviewed' in text:
              raise SystemExit('ambiguous evidence-scope instruction remains')
          checkbox_ids = re.findall(
              r'(?m)^- \[ \] \*\*((?:PLACE|SECRET|EDGE|ISOLATION|DATA|AUTH|RECOVERY)-\d{2})\*\*',
              text,
          )
          if sorted(checkbox_ids) != sorted(all_ids):
              raise SystemExit('checkbox assertion-ID set is incomplete')
          for assertion_id in all_ids:
              if text.count(assertion_id) != 2:
                  raise SystemExit(
                      f'{assertion_id} must occur once in a checkbox and once in its row; '
                      f'found {text.count(assertion_id)}'
                  )

          path.write_text(text, encoding='utf-8')
          PY

          rm "$workflow"
          git add -A
          git diff --cached --check
          git commit -m 'docs(hardening): bind each assertion to evidence state'
          git push origin "HEAD:$branch"

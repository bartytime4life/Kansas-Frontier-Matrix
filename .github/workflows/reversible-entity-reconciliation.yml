# Validate the proposed reversible entity reconciliation profile.
name: reversible-entity-reconciliation

"on":
  pull_request:
    paths:
      - ".github/workflows/reversible-entity-reconciliation.yml"
      - "contracts/common/reversible_entity_reconciliation.md"
      - "fixtures/contracts/v1/common/reversible_entity_reconciliation/**"
      - "schemas/contracts/v1/common/reversible_entity_reconciliation.schema.json"
      - "tools/validators/validate_reversible_entity_reconciliation.py"
      - "tests/validators/test_validate_reversible_entity_reconciliation.py"
      - "data/receipts/generated/genrec-reversible-entity-reconciliation-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reversible-entity-reconciliation.yml"
      - "contracts/common/reversible_entity_reconciliation.md"
      - "fixtures/contracts/v1/common/reversible_entity_reconciliation/**"
      - "schemas/contracts/v1/common/reversible_entity_reconciliation.schema.json"
      - "tools/validators/validate_reversible_entity_reconciliation.py"
      - "tests/validators/test_validate_reversible_entity_reconciliation.py"
      - "data/receipts/generated/genrec-reversible-entity-reconciliation-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reversible-entity-reconciliation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-reversible-entity-reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema and test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run deterministic no-network fixture validation
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_reversible_entity_reconciliation.py' \
            --verbose
          python tools/validators/validate_reversible_entity_reconciliation.py --fixtures
      - name: Verify generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-reversible-entity-reconciliation-20260805.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Reversible entity reconciliation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: source-assertion preservation, proposal/decision separation, cluster support, split partitioning, and deterministic fixture identity."
            echo "- Boundary: a green result does not grant source, evidence, policy, review, merge, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

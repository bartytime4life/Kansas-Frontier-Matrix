# Validate the fixture-only SourceRetrievalEpisode candidate.
name: source-retrieval-episode

"on":
  pull_request:
    paths:
      - ".github/workflows/source-retrieval-episode.yml"
      - "contracts/source/source_retrieval_episode.md"
      - "schemas/contracts/v1/source/source_retrieval_episode.schema.json"
      - "fixtures/contracts/v1/source/source_retrieval_episode/**"
      - "tools/validators/source/validate_source_retrieval_episode.py"
      - "tests/validators/test_validate_source_retrieval_episode.py"
      - "docs/intake/exploratory/source-retrieval-episode-source-map.md"
      - "packages/connectors-core/**"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-source-retrieval-episode-20260811.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-retrieval-episode.yml"
      - "contracts/source/source_retrieval_episode.md"
      - "schemas/contracts/v1/source/source_retrieval_episode.schema.json"
      - "fixtures/contracts/v1/source/source_retrieval_episode/**"
      - "tools/validators/source/validate_source_retrieval_episode.py"
      - "tests/validators/test_validate_source_retrieval_episode.py"
      - "docs/intake/exploratory/source-retrieval-episode-source-map.md"
      - "packages/connectors-core/**"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-source-retrieval-episode-20260811.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-retrieval-episode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-source-retrieval-episode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic tests and fixture replay
        run: |
          python -m unittest -v tests.validators.test_validate_source_retrieval_episode
          python tools/validators/source/validate_source_retrieval_episode.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-source-retrieval-episode-20260811.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### SourceRetrievalEpisode"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only source retrieval process observations, including failed and HEAD-only attempts."
            echo "- Boundary: no network request, source activation, SourceArtifact, receipt, evidence, lifecycle write, current-data claim, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

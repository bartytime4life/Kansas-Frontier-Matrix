# Exercise the synthetic, no-network seasonal streamflow tail boundary.
name: hydrology-streamflow-tail-event

"on":
  pull_request:
    paths:
      - ".github/workflows/hydrology-streamflow-tail-event.yml"
      - "contracts/domains/hydrology/streamflow_tail_event.md"
      - "schemas/contracts/v1/domains/hydrology/streamflow_tail_event.schema.json"
      - "pipelines/domains/hydrology/streamflow_tail_event/**"
      - "fixtures/domains/hydrology/streamflow_tail_event/**"
      - "tests/pipelines/domains/hydrology/streamflow_tail_event/**"
      - "data/receipts/generated/genrec-hydrology-streamflow-tail-event-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hydrology-streamflow-tail-event.yml"
      - "contracts/domains/hydrology/streamflow_tail_event.md"
      - "schemas/contracts/v1/domains/hydrology/streamflow_tail_event.schema.json"
      - "pipelines/domains/hydrology/streamflow_tail_event/**"
      - "fixtures/domains/hydrology/streamflow_tail_event/**"
      - "tests/pipelines/domains/hydrology/streamflow_tail_event/**"
      - "data/receipts/generated/genrec-hydrology-streamflow-tail-event-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydrology-streamflow-tail-event-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-streamflow-tail-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic streamflow-tail tests
        run: |
          set -euo pipefail
          python -m pytest \
            tests/pipelines/domains/hydrology/streamflow_tail_event/test_evaluate_fixture.py \
            -q --strict-config --strict-markers

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-hydrology-streamflow-tail-event-20260806.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Seasonal streamflow tail fixture evaluator"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: approved fixture percentiles, recency, persistence, qualifiers, and regulated-context abstention."
            echo "- Boundary: no USGS/NWS source access, operational alert, emergency advice, lifecycle write, evidence resolution, policy decision, promotion, release, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

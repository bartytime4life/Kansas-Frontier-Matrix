name: representation-fitness-assessment

on:
  pull_request:
    paths:
      - 'contracts/map/representation_fitness_assessment.md'
      - 'schemas/contracts/v1/map/representation_fitness_assessment.schema.json'
      - 'fixtures/contracts/v1/map/representation_fitness_assessment/**'
      - 'tools/validators/map/validate_representation_fitness_assessment.py'
      - 'tests/validators/map/test_representation_fitness_assessment.py'
      - '.github/workflows/representation-fitness-assessment.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/map/representation_fitness_assessment.md'
      - 'schemas/contracts/v1/map/representation_fitness_assessment.schema.json'
      - 'fixtures/contracts/v1/map/representation_fitness_assessment/**'
      - 'tools/validators/map/validate_representation_fitness_assessment.py'
      - 'tests/validators/map/test_representation_fitness_assessment.py'
      - '.github/workflows/representation-fitness-assessment.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile tools/validators/map/validate_representation_fitness_assessment.py tests/validators/map/test_representation_fitness_assessment.py
      - name: Replay fixtures
        run: python tools/validators/map/validate_representation_fitness_assessment.py --fixtures
      - name: Run focused tests
        run: python -m pytest -q tests/validators/map/test_representation_fitness_assessment.py --strict-config --strict-markers

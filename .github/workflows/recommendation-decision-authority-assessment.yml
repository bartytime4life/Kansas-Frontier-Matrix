# Validate the additive, fixture-only recommendation-decision authority assessment.
name: recommendation-decision-authority-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/recommendation-decision-authority-assessment.yml"
      - "contracts/governance/recommendation_decision_authority_assessment.md"
      - "schemas/contracts/v1/governance/recommendation_decision_authority_assessment.schema.json"
      - "fixtures/contracts/v1/governance/recommendation_decision_authority_assessment/**"
      - "tools/validators/validate_recommendation_decision_authority_assessment.py"
      - "tests/validators/test_validate_recommendation_decision_authority_assessment.py"
      - "docs/intake/exploratory/briefing-recommendation-decision-authority-source-map.md"
      - "data/receipts/generated/genrec-recommendation-decision-authority-assessment-20260810.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recommendation-decision-authority-assessment.yml"
      - "contracts/governance/recommendation_decision_authority_assessment.md"
      - "schemas/contracts/v1/governance/recommendation_decision_authority_assessment.schema.json"
      - "fixtures/contracts/v1/governance/recommendation_decision_authority_assessment/**"
      - "tools/validators/validate_recommendation_decision_authority_assessment.py"
      - "tests/validators/test_validate_recommendation_decision_authority_assessment.py"
      - "docs/intake/exploratory/briefing-recommendation-decision-authority-source-map.md"
      - "data/receipts/generated/genrec-recommendation-decision-authority-assessment-20260810.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommendation-decision-authority-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-recommendation-decision-authority-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema, hashing, and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.validators.test_validate_recommendation_decision_authority_assessment --verbose

      - name: Replay exact fixture outcomes
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_recommendation_decision_authority_assessment.py --fixtures

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-recommendation-decision-authority-assessment-20260810.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Recommendation-decision authority assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: local recommendation, decision, comparison, downstream-reference, deterministic-identity, and authority non-effect checks."
            echo "- Boundary: no policy evaluation, recommendation creation, decision creation, authority authentication, implementation write, outcome measurement, release, publication, API, or UI authority."
          } >> "$GITHUB_STEP_SUMMARY"

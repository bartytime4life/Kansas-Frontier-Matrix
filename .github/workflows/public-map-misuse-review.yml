name: public-map-misuse-review

"on":
  pull_request:
    paths:
      - ".github/workflows/public-map-misuse-review.yml"
      - "contracts/data/public_map_misuse_review.md"
      - "schemas/contracts/v1/data/public_map_misuse_review.schema.json"
      - "fixtures/contracts/v1/data/public_map_misuse_review/**"
      - "tools/validators/data/validate_public_map_misuse_review.py"
      - "tests/validators/test_validate_public_map_misuse_review.py"
      - "docs/intake/exploratory/pass-18-public-map-misuse-review-source-map.md"
      - "data/receipts/generated/genrec-pass18-public-map-misuse-review-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-map-misuse-review.yml"
      - "contracts/data/public_map_misuse_review.md"
      - "schemas/contracts/v1/data/public_map_misuse_review.schema.json"
      - "fixtures/contracts/v1/data/public_map_misuse_review/**"
      - "tools/validators/data/validate_public_map_misuse_review.py"
      - "tests/validators/test_validate_public_map_misuse_review.py"
      - "docs/intake/exploratory/pass-18-public-map-misuse-review-source-map.md"
      - "data/receipts/generated/genrec-pass18-public-map-misuse-review-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-map-misuse-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-public-map-misuse-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/data/validate_public_map_misuse_review.py tests/validators/test_validate_public_map_misuse_review.py
          python -m unittest tests.validators.test_validate_public_map_misuse_review --verbose
          python tools/validators/data/validate_public_map_misuse_review.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-public-map-misuse-review-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Public map misuse review candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only identity, prerequisite, five-dimension coverage, canonical ordering, and declaration coherence."
            echo "- Boundary: no reference resolution, map inspection or mutation, materiality decision, policy or review decision, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

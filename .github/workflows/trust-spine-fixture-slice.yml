# Validate the MRTS-05 synthetic cross-family fixture without network or writes.
name: trust-spine-fixture-slice

"on":
  pull_request:
    paths:
      - ".github/workflows/trust-spine-fixture-slice.yml"
      - "Makefile"
      - "contracts/governance/trust_spine_fixture_slice.md"
      - "control_plane/object_family_register.yaml"
      - "docs/doctrine/directory-rules.md"
      - "fixtures/contracts/v1/governance/trust_spine_fixture_slice/**"
      - "fixtures/contracts/v1/evidence/proof_pack/artifacts/**"
      - "fixtures/release/promotion_verification_execution/**"
      - "schemas/contracts/v1/governance/trust_spine_fixture_slice.schema.json"
      - "tests/validators/governance/test_validate_trust_spine_fixture_slice.py"
      - "tools/release/release_dry_run.py"
      - "tools/validators/governance/validate_trust_spine_fixture_slice.py"
      - "tools/validators/validator_registry.json"
      - "data/receipts/generated/genrec-trust-spine-fixture-slice-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/trust-spine-fixture-slice.yml"
      - "Makefile"
      - "contracts/governance/trust_spine_fixture_slice.md"
      - "control_plane/object_family_register.yaml"
      - "fixtures/contracts/v1/governance/trust_spine_fixture_slice/**"
      - "fixtures/contracts/v1/evidence/proof_pack/artifacts/**"
      - "fixtures/release/promotion_verification_execution/**"
      - "schemas/contracts/v1/governance/trust_spine_fixture_slice.schema.json"
      - "tests/validators/governance/test_validate_trust_spine_fixture_slice.py"
      - "tools/release/release_dry_run.py"
      - "tools/validators/governance/validate_trust_spine_fixture_slice.py"
      - "tools/validators/validator_registry.json"
      - "data/receipts/generated/genrec-trust-spine-fixture-slice-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-spine-fixture-slice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-trust-spine-fixture-slice:
    name: validate-trust-spine-fixture-slice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Run deterministic MRTS-05 fixture slice
        run: make trust-spine-fixture-slice

      - name: Record non-authority boundary
        if: always()
        run: |
          {
            echo "### MRTS-05 trust-spine fixture slice"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Green scope: synthetic fixture shape, local SHA-256 closure, candidate-schema validation, cross-family references, negative-case polarity, and offline dry-run behavior."
            echo "- Publication outcome: NOT_ATTEMPTED."
            echo "- Boundary: no source activation, policy/review approval, lifecycle write, release, deployment, promotion, publication, public route, or canonical-family selection."
          } >> "$GITHUB_STEP_SUMMARY"

# Prove parity between the reusable package and the existing validator-local resolver.
name: schema-registry-parity

"on":
  pull_request:
    paths:
      - ".github/workflows/schema-registry-parity.yml"
      - "packages/schema-registry/**"
      - "schemas/contracts/v1/**"
      - "tools/validators/_common/local_resolver.py"
      - "tools/validators/schema_registry/**"
      - "tests/validators/schema_registry/**"
      - "data/receipts/generated/genrec-schema-registry-parity-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/schema-registry-parity.yml"
      - "packages/schema-registry/**"
      - "schemas/contracts/v1/**"
      - "tools/validators/_common/local_resolver.py"
      - "tools/validators/schema_registry/**"
      - "tests/validators/schema_registry/**"
      - "data/receipts/generated/genrec-schema-registry-parity-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-registry-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-schema-registry-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/schema-registry/pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]" -e "./packages/schema-registry[test]"

      - name: Run deterministic parity tests and current-tree validation
        run: |
          set -euo pipefail
          python -m pytest -q tests/validators/schema_registry
          python tools/validators/schema_registry/validate_schema_registry_parity.py --pretty

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-schema-registry-parity-20260809.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Schema-registry parity validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: current canonical-tree id-set and decoded-document parity between the package and validator-local resolver, plus deterministic negative tests and authoring-receipt integrity."
            echo "- Boundary: this check performs no consumer migration and creates no schema admission, contract, policy, evidence, review, promotion, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

name: responsibility-layer-impact-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/responsibility-layer-impact-assessment.yml"
      - "contracts/governance/responsibility_layer_impact_assessment.md"
      - "schemas/contracts/v1/governance/responsibility_layer_impact_assessment.schema.json"
      - "fixtures/contracts/v1/governance/responsibility_layer_impact_assessment/**"
      - "tools/validators/governance/validate_responsibility_layer_impact_assessment.py"
      - "tests/validators/governance/test_validate_responsibility_layer_impact_assessment.py"
      - "docs/intake/exploratory/pass-18-responsibility-layer-impact-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass18-responsibility-layer-impact-assessment-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/responsibility-layer-impact-assessment.yml"
      - "contracts/governance/responsibility_layer_impact_assessment.md"
      - "schemas/contracts/v1/governance/responsibility_layer_impact_assessment.schema.json"
      - "fixtures/contracts/v1/governance/responsibility_layer_impact_assessment/**"
      - "tools/validators/governance/validate_responsibility_layer_impact_assessment.py"
      - "tests/validators/governance/test_validate_responsibility_layer_impact_assessment.py"
      - "docs/intake/exploratory/pass-18-responsibility-layer-impact-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass18-responsibility-layer-impact-assessment-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsibility-layer-impact-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-responsibility-layer-impact-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/governance/validate_responsibility_layer_impact_assessment.py tests/validators/governance/test_validate_responsibility_layer_impact_assessment.py
          python -m unittest tests.validators.governance.test_validate_responsibility_layer_impact_assessment --verbose
          python tools/validators/governance/validate_responsibility_layer_impact_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-responsibility-layer-impact-assessment-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Responsibility-layer impact assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only artifact-root, responsibility-layer, seam, decision-ref, validation-ref, rollback-ref, review, and content-identity coherence."
            echo "- Boundary: no placement or ownership assignment, layer-model adoption, policy or review decision, data or runtime mutation, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

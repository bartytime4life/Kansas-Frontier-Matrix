name: archaeology-evidence-bundle-convergence

on:
  pull_request:
    paths:
      - 'schemas/contracts/v1/evidence/evidence_bundle.schema.json'
      - 'schemas/contracts/v1/domains/archaeology/evidence_bundle.schema.json'
      - 'fixtures/contracts/v1/evidence/evidence_bundle/**'
      - 'tools/ci/kfm_no_network/README.md'
      - 'tools/ci/kfm_no_network/sitecustomize.py'
      - 'tools/validators/validate_archaeology_evidence_bundle_projection.py'
      - 'tests/domains/archaeology/test_no_network_fixtures.py'
      - 'tests/validators/domains/archaeology/test_evidence_bundle_schema_convergence.py'
      - '.github/workflows/archaeology-evidence-bundle-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install repository validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Compile focused validator and tests
        run: >-
          python -m py_compile
          tools/validators/validate_archaeology_evidence_bundle_projection.py
          tests/domains/archaeology/test_no_network_fixtures.py
          tests/validators/domains/archaeology/test_evidence_bundle_schema_convergence.py
      - name: Verify Python no-network startup guard
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/ci/kfm_no_network:${{ github.workspace }}
        run: python -c 'import sitecustomize; assert sitecustomize.GUARD_ACTIVE'
      - name: Run deterministic convergence tests
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/ci/kfm_no_network:${{ github.workspace }}
        run: >-
          python -m unittest -q
          tests.domains.archaeology.test_no_network_fixtures
          tests.validators.domains.archaeology.test_evidence_bundle_schema_convergence
      - name: Validate shared fixtures through the Archaeology projection
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/ci/kfm_no_network:${{ github.workspace }}
        run: python tools/validators/validate_archaeology_evidence_bundle_projection.py --fixtures

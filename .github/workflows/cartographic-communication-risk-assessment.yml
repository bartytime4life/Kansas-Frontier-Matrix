name: cartographic-communication-risk-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/cartographic-communication-risk-assessment.yml"
      - "contracts/map/cartographic_communication_risk_assessment.md"
      - "schemas/contracts/v1/map/cartographic_communication_risk_assessment.schema.json"
      - "fixtures/contracts/v1/map/cartographic_communication_risk_assessment/**"
      - "tools/validators/map/validate_cartographic_communication_risk_assessment.py"
      - "tests/validators/map/test_validate_cartographic_communication_risk_assessment.py"
      - "docs/intake/exploratory/pass-18-cartographic-communication-risk-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass18-cartographic-communication-risk-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cartographic-communication-risk-assessment.yml"
      - "contracts/map/cartographic_communication_risk_assessment.md"
      - "schemas/contracts/v1/map/cartographic_communication_risk_assessment.schema.json"
      - "fixtures/contracts/v1/map/cartographic_communication_risk_assessment/**"
      - "tools/validators/map/validate_cartographic_communication_risk_assessment.py"
      - "tests/validators/map/test_validate_cartographic_communication_risk_assessment.py"
      - "docs/intake/exploratory/pass-18-cartographic-communication-risk-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass18-cartographic-communication-risk-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartographic-communication-risk-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-cartographic-communication-risk-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/map/validate_cartographic_communication_risk_assessment.py tests/validators/map/test_validate_cartographic_communication_risk_assessment.py
          python -m unittest tests.validators.map.test_validate_cartographic_communication_risk_assessment --verbose
          python tools/validators/map/validate_cartographic_communication_risk_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-cartographic-communication-risk-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Cartographic communication-risk assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only selection, framing, scale, symbology, omission, adjacent-reference, review-declaration, and content-hash coherence."
            echo "- Boundary: no map rendering or style inspection, geometry or tile access, evidence or policy decision, review approval, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the bounded remote-sensing lineage companion profile.
# A green result proves fixture/schema/semantic conformance only. It does not
# contact imagery sources, export telemetry, or grant operational authority.
name: remote-sensing-lineage-activity

"on":
  pull_request:
    paths:
      - ".github/workflows/remote-sensing-lineage-activity.yml"
      - "contracts/telemetry/remote_sensing_lineage_activity.md"
      - "schemas/contracts/v1/telemetry/**"
      - "schemas/contracts/v1/runtime/run_receipt.schema.json"
      - "fixtures/contracts/v1/telemetry/remote_sensing_lineage_activity/**"
      - "tools/generators/telemetry/**"
      - "tools/validators/telemetry/**"
      - "tests/validators/telemetry/**"
      - "packages/hashing/**"
      - "docs/intake/exploratory/pass-32-remote-sensing-lineage-activity-source-map.md"
      - "data/receipts/generated/genrec-pass32-remote-sensing-lineage-activity-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/remote-sensing-lineage-activity.yml"
      - "contracts/telemetry/remote_sensing_lineage_activity.md"
      - "schemas/contracts/v1/telemetry/**"
      - "schemas/contracts/v1/runtime/run_receipt.schema.json"
      - "fixtures/contracts/v1/telemetry/remote_sensing_lineage_activity/**"
      - "tools/generators/telemetry/**"
      - "tools/validators/telemetry/**"
      - "tests/validators/telemetry/**"
      - "packages/hashing/**"
      - "docs/intake/exploratory/pass-32-remote-sensing-lineage-activity-source-map.md"
      - "data/receipts/generated/genrec-pass32-remote-sensing-lineage-activity-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-sensing-lineage-activity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-remote-sensing-lineage-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out activity boundaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic no-network activity tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/telemetry \
            --pattern 'test_remote_sensing_lineage_activity.py' \
            --verbose

      - name: Run exact fixture polarity validator
        run: |
          set -euo pipefail
          python tools/validators/telemetry/validate_remote_sensing_lineage_activity.py \
            --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass32-remote-sensing-lineage-activity-20260810.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Remote-sensing lineage trust boundary"
            echo "- Scope: deterministic scene metrics and PROV activity bound to a governed terminal OpenLineage projection."
            echo "- Effects: fixture-only and no-network; no source contact, event export, signing, registry, or canonical write."
            echo "- Authority: none; this telemetry companion cannot admit evidence or authorize review, release, deployment, publication, or public use."
          } >> "$GITHUB_STEP_SUMMARY"

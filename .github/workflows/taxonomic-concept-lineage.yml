# Validate the proposed taxonomic concept lineage profile.
name: taxonomic-concept-lineage

"on":
  pull_request:
    paths:
      - ".github/workflows/taxonomic-concept-lineage.yml"
      - "contracts/crosswalks/taxonomy/taxonomic_concept_lineage.md"
      - "schemas/contracts/v1/crosswalks/taxonomy/taxonomic_concept_lineage.schema.json"
      - "tools/validators/validate_taxonomic_concept_lineage.py"
      - "tests/validators/test_validate_taxonomic_concept_lineage.py"
      - "data/receipts/generated/genrec-taxonomic-concept-lineage-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/taxonomic-concept-lineage.yml"
      - "contracts/crosswalks/taxonomy/taxonomic_concept_lineage.md"
      - "schemas/contracts/v1/crosswalks/taxonomy/taxonomic_concept_lineage.schema.json"
      - "tools/validators/validate_taxonomic_concept_lineage.py"
      - "tests/validators/test_validate_taxonomic_concept_lineage.py"
      - "data/receipts/generated/genrec-taxonomic-concept-lineage-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomic-concept-lineage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-taxonomic-concept-lineage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run deterministic no-network test vectors
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_taxonomic_concept_lineage.py' \
            --verbose
      - name: Verify generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-taxonomic-concept-lineage-20260805.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Taxonomic concept lineage"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: source-native name preservation, taxon concept identity, typed concept relations, finite reconciliation outcomes, and deterministic fixture identity."
            echo "- Boundary: a green result does not grant source, evidence, policy, review, merge, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

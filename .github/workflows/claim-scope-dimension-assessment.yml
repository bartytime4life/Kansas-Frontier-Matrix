name: claim-scope-dimension-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/claim-scope-dimension-assessment.yml"
      - "contracts/evidence/claim_scope_dimension_assessment.md"
      - "schemas/contracts/v1/evidence/claim_scope_dimension_assessment.schema.json"
      - "fixtures/contracts/v1/evidence/claim_scope_dimension_assessment/**"
      - "tools/validators/evidence/validate_claim_scope_dimension_assessment.py"
      - "tests/validators/evidence/test_validate_claim_scope_dimension_assessment.py"
      - "docs/intake/exploratory/pass-18-claim-scope-dimension-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass18-claim-scope-dimension-assessment-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/claim-scope-dimension-assessment.yml"
      - "contracts/evidence/claim_scope_dimension_assessment.md"
      - "schemas/contracts/v1/evidence/claim_scope_dimension_assessment.schema.json"
      - "fixtures/contracts/v1/evidence/claim_scope_dimension_assessment/**"
      - "tools/validators/evidence/validate_claim_scope_dimension_assessment.py"
      - "tests/validators/evidence/test_validate_claim_scope_dimension_assessment.py"
      - "docs/intake/exploratory/pass-18-claim-scope-dimension-assessment-source-map.md"
      - "data/receipts/generated/genrec-pass18-claim-scope-dimension-assessment-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claim-scope-dimension-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-claim-scope-dimension-assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/evidence/validate_claim_scope_dimension_assessment.py tests/validators/evidence/test_validate_claim_scope_dimension_assessment.py
          python -m unittest tests.validators.evidence.test_validate_claim_scope_dimension_assessment --verbose
          python tools/validators/evidence/validate_claim_scope_dimension_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-claim-scope-dimension-assessment-validator-hardening-20260811.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Claim scope dimension assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only time, space, and attribute role, reference, interpretation, limitation, identity, and malformed-Unicode handling."
            echo "- Boundary: no claim inspection, EvidenceBundle resolution, geographic inference, policy or review decision, promotion, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

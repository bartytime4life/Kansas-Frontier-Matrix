# Validate fixture-only worker-integrity launch readiness candidates.
name: worker-integrity-launch-readiness

"on":
  pull_request:
    paths:
      - ".github/workflows/worker-integrity-launch-readiness.yml"
      - "contracts/runtime/worker_integrity_launch_readiness.md"
      - "schemas/contracts/v1/runtime/worker_integrity_launch_readiness.schema.json"
      - "fixtures/contracts/v1/runtime/worker_integrity_launch_readiness/**"
      - "tools/validators/runtime/validate_worker_integrity_launch_readiness.py"
      - "tests/validators/test_worker_integrity_launch_readiness.py"
      - "docs/intake/exploratory/worker-integrity-launch-readiness-source-map.md"
      - "contracts/runtime/runtime_verification.md"
      - "schemas/contracts/v1/runtime/runtime_verification/**"
      - "contracts/runtime/verified_rendering_resource_envelope.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-worker-integrity-launch-readiness-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/worker-integrity-launch-readiness.yml"
      - "contracts/runtime/worker_integrity_launch_readiness.md"
      - "schemas/contracts/v1/runtime/worker_integrity_launch_readiness.schema.json"
      - "fixtures/contracts/v1/runtime/worker_integrity_launch_readiness/**"
      - "tools/validators/runtime/validate_worker_integrity_launch_readiness.py"
      - "tests/validators/test_worker_integrity_launch_readiness.py"
      - "docs/intake/exploratory/worker-integrity-launch-readiness-source-map.md"
      - "contracts/runtime/runtime_verification.md"
      - "schemas/contracts/v1/runtime/runtime_verification/**"
      - "contracts/runtime/verified_rendering_resource_envelope.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-worker-integrity-launch-readiness-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-integrity-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-worker-integrity-launch-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic tests and fixture replay
        run: |
          python -m unittest -v tests.validators.test_worker_integrity_launch_readiness
          python tools/validators/runtime/validate_worker_integrity_launch_readiness.py \
            --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-worker-integrity-launch-readiness-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### WorkerIntegrityLaunchReadinessCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only pre-launch composition of worker identity, declared RuntimeVerificationProof outcome, and runtime capabilities."
            echo "- Boundary: no worker start, byte read, hash, proof resolution/emission, header change, policy decision, release, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

# Validate the fixture-only typed receipt aggregation profile.
# This workflow performs no receipt resolution, artifact read, Rekor query, signature verification, release, or publication action.
name: typed-receipt-aggregation

"on":
  pull_request:
    paths:
      - ".github/workflows/typed-receipt-aggregation.yml"
      - "contracts/data/typed_receipt_aggregation.md"
      - "schemas/contracts/v1/data/typed_receipt_aggregation.schema.json"
      - "fixtures/contracts/v1/data/typed_receipt_aggregation/**"
      - "tools/validators/receipts/validate_typed_receipt_aggregation.py"
      - "tests/validators/receipts/test_typed_receipt_aggregation.py"
      - "docs/intake/exploratory/pass-31-typed-receipt-aggregation-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass31-typed-receipt-aggregation-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/typed-receipt-aggregation.yml"
      - "contracts/data/typed_receipt_aggregation.md"
      - "schemas/contracts/v1/data/typed_receipt_aggregation.schema.json"
      - "fixtures/contracts/v1/data/typed_receipt_aggregation/**"
      - "tools/validators/receipts/validate_typed_receipt_aggregation.py"
      - "tests/validators/receipts/test_typed_receipt_aggregation.py"
      - "docs/intake/exploratory/pass-31-typed-receipt-aggregation-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass31-typed-receipt-aggregation-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typed-receipt-aggregation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-typed-receipt-aggregation:
    name: validate-typed-receipt-aggregation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e .

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators/receipts \
            --pattern 'test_typed_receipt_aggregation.py' \
            --verbose

      - name: Replay exact fixture polarity
        run: python tools/validators/receipts/validate_typed_receipt_aggregation.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass31-typed-receipt-aggregation-20260809.json

      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### TypedReceiptAggregationCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic typed receipt references, input and artifact digests, materiality declarations, summary closure, and deterministic identity."
            echo "- No receipt resolution, artifact read, Rekor query, signature verification, source admission, policy decision, review approval, promotion, release, or publication authority is exercised."
          } >> "$GITHUB_STEP_SUMMARY"

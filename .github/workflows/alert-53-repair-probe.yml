# Temporary branch-only diagnosis for code-scanning alert 53.
# Owning root: .github/; Directory Rules sections 7.2 and 8.2; ADR-0029.
# No dependency edits, alert updates, repository writes, PR transitions, or deployment.
# Remove this probe from the final dependency-repair tree; logs remain run evidence.
name: alert-53-repair-probe
on:
  push:
    branches: [agent/security-alert-53-20260905]
    paths: [.github/workflows/alert-53-repair-probe.yml]
permissions: {}
concurrency:
  group: alert-53-repair-probe
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  alert-metadata:
    if: github.repository == 'bartytime4life/Kansas-Frontier-Matrix' && github.ref == 'refs/heads/agent/security-alert-53-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      security-events: read
      contents: read
    steps:
      - name: Read alert without publishing source snippets or credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime, hashlib, json, os, re, urllib.request
          url = 'https://api.github.com/repos/bartytime4life/Kansas-Frontier-Matrix/code-scanning/alerts/53'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = response.read(4_000_001)
              if len(payload) > 4_000_000:
                  raise ValueError('Alert response exceeds bound')
              alert = json.loads(payload)
          if alert.get('number') != 53:
              raise ValueError('Unexpected alert identity')
          instance = alert.get('most_recent_instance') or {}
          record = {
              'retrieved_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'endpoint': url,
              'payload_sha256': hashlib.sha256(payload).hexdigest(),
              'number': alert['number'], 'state': alert.get('state'),
              'created_at': alert.get('created_at'), 'updated_at': alert.get('updated_at'),
              'rule': {key: alert.get('rule', {}).get(key) for key in (
                  'id', 'name', 'severity', 'security_severity_level', 'description')},
              'tool': {key: alert.get('tool', {}).get(key) for key in ('name', 'version', 'guid')},
              'instance': {key: instance.get(key) for key in ('ref', 'commit_sha', 'analysis_key', 'category', 'state')},
              'advisory_ids': sorted(set(re.findall(r'GHSA-[23456789cfghjmpqrvwx]{4}-[23456789cfghjmpqrvwx]{4}-[23456789cfghjmpqrvwx]{4}', payload.decode('utf-8')))),
          }
          print('ALERT_53_METADATA=' + json.dumps(record, sort_keys=True))
          PY

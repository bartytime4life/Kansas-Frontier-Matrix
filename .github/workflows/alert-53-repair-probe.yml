# TEMPORARY isolated candidate generation for alert 53. Remove before PR delivery.
# Generated blobs are not commits, refs, approvals, releases or alert dispositions.
name: alert-53-repair-probe
on:
  push:
    branches: [agent/security-alert-53-20260905]
    paths: [.github/workflows/alert-53-repair-probe.yml]
permissions: {}
concurrency:
  group: alert-53-repair-probe
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  generate:
    if: github.repository == 'bartytime4life/Kansas-Frontier-Matrix' && github.ref == 'refs/heads/agent/security-alert-53-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Freeze current-main inputs and reproduce baseline failures
        run: |
          set -euo pipefail
          test "$(git hash-object pnpm-lock.yaml)" = 02e273ebacfa0a4bc89a275204d67c027c4695bb
          test "$(git hash-object pnpm-workspace.yaml)" = 3eece3b536797f3bee593b2ce286964b62cc5391
          test "$(git hash-object apps/kansas-frontier-matrix-explorer/package.json)" = 17fc4e47f73967678965a2ed59f7fe830c07bacf
          test "$(git hash-object apps/kansas-frontier-matrix-explorer/package-lock.json)" = 8749a714532831a07bcc97b172ee1401f31d41f4
          corepack enable
          test "$(pnpm --version)" = 11.17.0
          test "$(npm --version)" = 10.9.8
          mkdir -p "$RUNNER_TEMP/alert53-logs" "$RUNNER_TEMP/before" "$RUNNER_TEMP/npm-candidate" "$RUNNER_TEMP/output"
          cp pnpm-lock.yaml "$RUNNER_TEMP/before/"
          cp apps/kansas-frontier-matrix-explorer/package-lock.json "$RUNNER_TEMP/before/"
          cat > "$RUNNER_TEMP/check.sh" <<'SH'
          run_check() {
            label="$1"; shift
            set +e
            "$@" > "$RUNNER_TEMP/alert53-logs/$label.log" 2>&1
            code=$?
            set -e
            printf '%s\t%s\n' "$label" "$code" | tee -a "$RUNNER_TEMP/alert53-logs/status.tsv"
            tail -n 20 "$RUNNER_TEMP/alert53-logs/$label.log"
          }
          SH
          source "$RUNNER_TEMP/check.sh"
          run_check baseline-static node --test apps/kansas-frontier-matrix-explorer/tests/esbuild-security.test.mjs apps/kansas-frontier-matrix-explorer/tests/fflate-security.test.mjs
          test "$(tail -1 "$RUNNER_TEMP/alert53-logs/status.tsv" | cut -f2)" = 1
          cp -a apps/kansas-frontier-matrix-explorer "$RUNNER_TEMP/npm-base"
          (cd "$RUNNER_TEMP/npm-base" && npm ci --no-fund --loglevel=error)
          (cd "$RUNNER_TEMP/npm-base" && run_check baseline-npm-runtime env KFM_ESBUILD_RUNTIME_PROBE=1 node --test tests/esbuild-security.test.mjs tests/fflate-security.test.mjs)
          test "$(tail -1 "$RUNNER_TEMP/alert53-logs/status.tsv" | cut -f2)" = 1
          grep -q ETIMEDOUT "$RUNNER_TEMP/alert53-logs/baseline-npm-runtime.log"
          (cd "$RUNNER_TEMP/npm-base" && run_check baseline-app-build npm run build)
      - name: Generate compatible fflate backport and tested parent-scoped esbuild resolution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('pnpm-workspace.yaml')
          assert 'overrides:' not in p.read_text()
          p.write_text(p.read_text()+'overrides:\n  "@esbuild-kit/core-utils@3.3.2>esbuild": "0.28.2"\n')
          p=pathlib.Path('apps/kansas-frontier-matrix-explorer/package.json')
          d=json.loads(p.read_text()); assert 'overrides' not in d
          d['overrides']={'@esbuild-kit/core-utils@3.3.2': {'esbuild':'0.28.2'}}
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          pnpm install --lockfile-only
          cp apps/kansas-frontier-matrix-explorer/{package.json,package-lock.json} "$RUNNER_TEMP/npm-candidate/"
          (cd "$RUNNER_TEMP/npm-candidate" && npm update fflate --package-lock-only --loglevel=error)
          python3 - <<'PY'
          import json, pathlib, os, re
          t=pathlib.Path(os.environ['RUNNER_TEMP'])
          original=json.loads((t/'before/package-lock.json').read_text())
          candidate=json.loads((t/'npm-candidate/package-lock.json').read_text())
          a,b=original['packages'],candidate['packages']
          target=re.compile(r'(?:^|/)node_modules/(?:fflate|esbuild|@esbuild/[^/]+)$')
          identity=['version','resolved','integrity','dependencies','optionalDependencies','peerDependencies','peerDependenciesMeta','hasInstallScript','bin']
          for key in a.keys() | b.keys():
              if a.get(key)!=b.get(key) and not target.search(key):
                  assert key in a and key in b, ('unrelated addition/removal',key)
                  assert all(a[key].get(f)==b[key].get(f) for f in identity), ('unrelated identity drift',key)
                  print('Preserving original unrelated metadata:',key)
                  b[key]=a[key]
          assert {k:v for k,v in original.items() if k!='packages'}=={k:v for k,v in candidate.items() if k!='packages'}
          assert b['node_modules/fflate']['version']=='0.7.5'
          assert b['node_modules/@babel/core']['version']=='7.29.7'
          assert b['node_modules/browserslist']['version']=='4.28.8'
          assert all(a.get(k)==b.get(k) for k in a.keys() | b.keys() if not target.search(k))
          pathlib.Path('apps/kansas-frontier-matrix-explorer/package-lock.json').write_text(json.dumps(candidate,indent=2)+'\n')
          def sections(text):
              p=re.split(r'^([A-Za-z][A-Za-z0-9]*):[ \t]*\n',text,flags=re.M)
              return dict(zip(['header']+p[1::2],[p[0]]+p[2::2]))
          old=sections((t/'before/pnpm-lock.yaml').read_text())
          new=sections(pathlib.Path('pnpm-lock.yaml').read_text())
          for key in old.keys() | new.keys():
              if key not in ('packages','snapshots','overrides'):
                  assert old.get(key,'').strip()==new.get(key,'').strip(), ('pnpm section drift',key)
          assert 'overrides' not in old
          assert '@esbuild-kit/core-utils@3.3.2>esbuild: 0.28.2' in new['overrides'].replace("'",'').replace('"','')
          def stanzas(text):
              out={}
              for block in re.split(r'(?=^  \S)',text,flags=re.M):
                  if not block.strip(): continue
                  first,_,rest=block.partition('\n')
                  m=re.fullmatch(r'  (.+?):(.*)',first); assert m,first
                  out[m[1].strip("'\"")]=(m[2]+'\n'+rest).strip()
              return out
          for section in ('packages','snapshots'):
              a,b=stanzas(old[section]),stanzas(new[section])
              for key in a.keys() | b.keys():
                  if a.get(key)!=b.get(key):
                      if key=='@esbuild-kit/core-utils@3.3.2':
                          assert b[key]==a[key].replace('esbuild: 0.18.20','esbuild: 0.28.2')
                      else: assert re.match(r'^(esbuild|@esbuild/[^@]+)@',key),('unrelated pnpm drift',key)
          print('SCOPED_LOCK_DIFF_PASS: only esbuild closure and npm fflate backport changed')
          PY
          git diff --check
          git diff --stat
      - name: Frozen pnpm install and actual package regressions
        env:
          KFM_ESBUILD_REQUIRE_WORKSPACE: '1'
          KFM_ESBUILD_RUNTIME_PROBE: '1'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/check.sh"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/pnpm.sha256"
          pnpm install --frozen-lockfile
          sha256sum -c "$RUNNER_TEMP/pnpm.sha256"
          run_check candidate-pnpm-runtime node --test apps/kansas-frontier-matrix-explorer/tests/esbuild-security.test.mjs apps/kansas-frontier-matrix-explorer/tests/fflate-security.test.mjs
          test "$(tail -1 "$RUNNER_TEMP/alert53-logs/status.tsv" | cut -f2)" = 0
          run_check candidate-canonical-build pnpm --filter explorer-web build
          run_check candidate-canonical-tests pnpm --filter explorer-web test
          pnpm audit --json > "$RUNNER_TEMP/alert53-logs/candidate-pnpm-audit.json"
      - name: Real npm install, actual package regressions and app build/tests
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/check.sh"
          # Copy tracked app files only, not workspace node_modules or build outputs.
          git ls-files -z apps/kansas-frontier-matrix-explorer | tar --null -T - -cf "$RUNNER_TEMP/app.tar"
          mkdir -p "$RUNNER_TEMP/npm-after"
          tar -xf "$RUNNER_TEMP/app.tar" -C "$RUNNER_TEMP/npm-after" --strip-components=2
          cd "$RUNNER_TEMP/npm-after"
          sha256sum package-lock.json > "$RUNNER_TEMP/npm.sha256"
          npm ci --no-fund --loglevel=error
          sha256sum -c "$RUNNER_TEMP/npm.sha256"
          run_check candidate-npm-runtime env KFM_ESBUILD_RUNTIME_PROBE=1 node --test tests/esbuild-security.test.mjs tests/fflate-security.test.mjs
          test "$(tail -1 "$RUNNER_TEMP/alert53-logs/status.tsv" | cut -f2)" = 0
          run_check candidate-app-build npm run build
          run_check candidate-app-tests node --test tests/*.test.mjs
          npm audit --json > "$RUNNER_TEMP/alert53-logs/candidate-npm-audit.json"
      - name: Validate final-tree workflow guardrails and stage integrity-bound candidates
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/check.sh"
          cp .github/workflows/alert-53-repair-probe.yml "$RUNNER_TEMP/probe.yml"
          rm .github/workflows/alert-53-repair-probe.yml
          run_check candidate-workflow-security make workflow-security
          cp "$RUNNER_TEMP/probe.yml" .github/workflows/alert-53-repair-probe.yml
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'output'
          paths=['pnpm-workspace.yaml','pnpm-lock.yaml','apps/kansas-frontier-matrix-explorer/package.json','apps/kansas-frontier-matrix-explorer/package-lock.json']
          assert sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==sorted(paths)
          record={'base_commit':'3d6b8a6e81ed65a726156feae67fa73875b5b069','tested_commit':os.environ['GITHUB_SHA'],'files':[],'checks':{},'authority':'VALIDATED_CANDIDATE_ONLY; NO_REF_PR_ALERT_OR_DEPLOYMENT_MUTATION'}
          for line in (root/'alert53-logs/status.tsv').read_text().splitlines():
              key,value=line.split('\t'); record['checks'][key]=int(value)
          for name in ('pnpm','npm'):
              audit=json.loads((root/f'alert53-logs/candidate-{name}-audit.json').read_text())
              assert 'error' not in audit
              assert 'GHSA-67mh-4wv8-2f99' not in json.dumps(audit)
              assert 'GHSA-px8p-9vwx-vf98' not in json.dumps(audit)
              assert not any(audit['metadata']['vulnerabilities'].values())
              record['checks'][f'candidate-{name}-audit']=0
          for i,p in enumerate(paths):
              data=pathlib.Path(p).read_bytes(); data.decode('utf-8')
              artifact=f'candidate-{i}.txt'; (out/artifact).write_bytes(data)
              record['files'].append({'path':p,'artifact':artifact,'sha256':hashlib.sha256(data).hexdigest(),'git_blob':hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()})
          (out/'record.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; candidate-only, explicit files
        with:
          name: alert-53-validated-candidates
          path: ${{ runner.temp }}/output/
          retention-days: 5
          if-no-files-found: error
      - name: Retain successful and failing checks without claiming they passed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alert-53-validation-logs
          path: ${{ runner.temp }}/alert53-logs/
          retention-days: 5
          if-no-files-found: error
  store-blobs:
    needs: generate
    if: github.repository == 'bartytime4life/Kansas-Frontier-Matrix' && github.ref == 'refs/heads/agent/security-alert-53-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Fresh runner: no checkout, package install, repo code, or ref/PR writes.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: alert-53-validated-candidates
          path: candidate
      - name: Store only four allowlisted integrity-verified candidate blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path('candidate'); record=json.loads((root/'record.json').read_text())
          expected=['pnpm-workspace.yaml','pnpm-lock.yaml','apps/kansas-frontier-matrix-explorer/package.json','apps/kansas-frontier-matrix-explorer/package-lock.json']
          assert record['tested_commit']==os.environ['GITHUB_SHA']
          assert record['base_commit']=='3d6b8a6e81ed65a726156feae67fa73875b5b069'
          assert [f['path'] for f in record['files']]==expected
          for key in ['candidate-pnpm-runtime','candidate-npm-runtime','candidate-pnpm-audit','candidate-npm-audit']:
              assert record['checks'][key]==0, key
          for i,item in enumerate(record['files']):
              assert item['artifact']==f'candidate-{i}.txt'
              data=(root/item['artifact']).read_bytes(); assert len(data)<2000000
              assert hashlib.sha256(data).hexdigest()==item['sha256']
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==item['git_blob']
              request=urllib.request.Request('https://api.github.com/repos/bartytime4life/Kansas-Frontier-Matrix/git/blobs',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
              assert result['sha']==item['git_blob']
              print(json.dumps({'path':item['path'],'blob':result['sha'],'sha256':item['sha256']}))
          PY

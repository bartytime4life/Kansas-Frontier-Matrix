# Temporary read-only base/head attribution and receipt verification. Remove before PR.
name: alert-53-repair-probe
on:
  push:
    branches: [agent/security-alert-53-20260905]
    paths: [.github/workflows/alert-53-repair-probe.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    if: github.repository == 'bartytime4life/Kansas-Frontier-Matrix' && github.ref == 'refs/heads/agent/security-alert-53-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target: [base, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.target == 'base' && '3d6b8a6e81ed65a726156feae67fa73875b5b069' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Run unchanged-base or candidate commands in their complete workspace
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/comparison"
          git rev-parse HEAD > "$RUNNER_TEMP/comparison/commit.txt"
          corepack enable
          test "$(pnpm --version)" = 11.17.0
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/pnpm.sha256"
          pnpm install --frozen-lockfile
          sha256sum -c "$RUNNER_TEMP/pnpm.sha256"
          check() {
            label="$1"; shift
            set +e
            "$@" > "$RUNNER_TEMP/comparison/$label.log" 2>&1
            code=$?
            set -e
            printf '%s\t%s\n' "$label" "$code" | tee -a "$RUNNER_TEMP/comparison/status.tsv"
            tail -n 20 "$RUNNER_TEMP/comparison/$label.log"
          }
          check canonical-build pnpm --filter explorer-web build
          check embedded-app-build pnpm --filter kansas-frontier-matrix-explorer build
          check embedded-app-tests bash -c 'cd apps/kansas-frontier-matrix-explorer && node --test tests/*.test.mjs'
          if [[ "$TARGET" == candidate ]]; then
            check generated-receipt python3 tools/validators/validate_generated_receipt.py data/receipts/generated/code-scanning-alert-53-20260905.json
            test "$(tail -1 "$RUNNER_TEMP/comparison/status.tsv" | cut -f2)" = 0
            python3 - <<'PY'
          import hashlib,json,pathlib,os
          receipt=json.loads(pathlib.Path('data/receipts/generated/code-scanning-alert-53-20260905.json').read_text())
          for path, expected in receipt['artifact_hashes'].items():
              got='sha256:'+hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              assert got==expected, path
          print('ALL_FINAL_ARTIFACT_HASHES_MATCH')
          PY
          fi
          git diff --exit-code
      - name: Preserve exact comparison, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alert-53-${{ matrix.target }}-comparison
          path: ${{ runner.temp }}/comparison/
          retention-days: 5
          if-no-files-found: error

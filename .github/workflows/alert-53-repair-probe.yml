# Temporary branch-only diagnosis for code-scanning alert 53.
# Owning root: .github/; Directory Rules sections 7.2 and 8.2; ADR-0029.
# Read-only tokens. No ref, PR, alert, deployment, or settings mutations.
# Remove this probe from the final repair tree; its runs remain lineage.
name: alert-53-repair-probe
on:
  push:
    branches: [agent/security-alert-53-20260905]
    paths: [.github/workflows/alert-53-repair-probe.yml]
permissions: {}
concurrency:
  group: alert-53-repair-probe
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  dependency-evidence:
    if: github.repository == 'bartytime4life/Kansas-Frontier-Matrix' && github.ref == 'refs/heads/agent/security-alert-53-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3d6b8a6e81ed65a726156feae67fa73875b5b069
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Capture manifests, exact graph evidence and upstream parent choices
        run: |
          set -euo pipefail
          corepack enable
          node --version
          npm --version
          pnpm --version
          mkdir -p "$RUNNER_TEMP/alert53-evidence"
          git rev-parse HEAD
          git ls-files '*package.json' '*package-lock.json' '*pnpm-lock.yaml' '*yarn.lock' '*AGENTS.md'
          cat pnpm-workspace.yaml
          grep -n -B 8 -A 8 'fflate\|@esbuild-kit/core-utils@3.3.2' pnpm-lock.yaml
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'apps/kansas-frontier-matrix-explorer/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(p, 'utf8'));
          for (const [name, entry] of Object.entries(lock.packages)) {
            if (/(?:^|\/)node_modules\/(?:fflate|esbuild|@babel\/core|browserslist|drizzle-kit|@esbuild-kit\/(?:core-utils|esm-loader))$/.test(name) || entry.dependencies?.fflate) {
              console.log('NPM_GRAPH=' + JSON.stringify({path:name, version:entry.version, dependencies:entry.dependencies}));
            }
          }
          NODE
          npm view drizzle-kit@latest version dependencies --json
          npm view @esbuild-kit/core-utils@latest version dependencies --json
          npm view @esbuild-kit/esm-loader@latest version dependencies --json
          npm view fflate@0.7.5 version dist.integrity --json
          set +e
          pnpm audit --json > "$RUNNER_TEMP/alert53-evidence/pnpm-audit.json"
          echo "PNPM_BASE_AUDIT_EXIT=$?"
          npm --prefix apps/kansas-frontier-matrix-explorer audit --package-lock-only --workspaces=false --json > "$RUNNER_TEMP/alert53-evidence/npm-audit.json"
          echo "NPM_BASE_AUDIT_EXIT=$?"
          set -e
          python3 - <<'PY'
          import json, os, pathlib, re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'alert53-evidence'
          for file in root.glob('*audit.json'):
              obj=json.loads(file.read_text())
              print('AUDIT_SUMMARY='+json.dumps({'file':file.name,'metadata':obj.get('metadata'), 'error':obj.get('error'), 'advisory_ids':sorted(set(re.findall(r'GHSA-[a-z0-9-]+', file.read_text())))}))
          PY
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml "$RUNNER_TEMP/alert53-evidence/"
          cp apps/kansas-frontier-matrix-explorer/package-lock.json "$RUNNER_TEMP/alert53-evidence/explorer-package-lock.json"
          cp apps/kansas-frontier-matrix-explorer/package.json "$RUNNER_TEMP/alert53-evidence/explorer-package.json"
          git diff --exit-code
      - name: Preserve bounded diagnostic files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alert-53-baseline-evidence
          path: ${{ runner.temp }}/alert53-evidence/
          retention-days: 5
          if-no-files-found: error

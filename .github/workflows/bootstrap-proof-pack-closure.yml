# Temporary branch-only assembler for the connector-delivered ProofPack slice.
# It verifies the staged archive, expands final repository paths, runs focused
# validation, removes its own bootstrap inputs, and commits only to the named
# non-default task branch. It grants no release or publication authority.
name: bootstrap-proof-pack-closure

"on":
  push:
    branches:
      - agent/proof-pack-closure-20260805
    paths:
      - ".github/kfm-bootstrap/**"
      - ".github/workflows/bootstrap-proof-pack-closure.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-proof-pack-closure-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/proof-pack-closure-20260805
          fetch-depth: 0

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify and expand the staged bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/kfm-bootstrap -maxdepth 1 -name 'proof-pack-part*.b64' | wc -l)" -eq 4
          cat .github/kfm-bootstrap/proof-pack-part*.b64 | base64 --decode > /tmp/proofpack-slice.tar.xz
          echo "c303ca3278e91a47d000fdd546c34ea50570cf0961664408d6cc0bcf78c8b666  /tmp/proofpack-slice.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/proofpack-slice.tar.xz
          rm -rf .github/kfm-bootstrap
          rm -f .github/workflows/bootstrap-proof-pack-closure.yml

      - name: Install declared test dependencies
        shell: bash
        run: python -m pip install -e ".[test]"

      - name: Run focused validation before committing
        shell: bash
        run: |
          set -euo pipefail
          python tools/proof_pack/proof_pack_check.py --fixtures
          python -m pytest -q tests/proof_pack
          python -m pytest -q tests/schemas/test_common_contracts.py -k proof_pack
          python tools/proof_pack/assemble_proof_pack.py \
            --candidate fixtures/contracts/v1/evidence/proof_pack/candidates/release_support_candidate.json \
            --repo-root . \
            --output /tmp/proof-pack.json
          cmp /tmp/proof-pack.json \
            fixtures/contracts/v1/evidence/proof_pack/valid/valid_release_support.json
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-proof-pack-closure-20260805.json \
            --repo-root .

      - name: Commit the assembled implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kfm-implementation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No assembled change found" >&2; exit 1; }
          git commit -m "feat(evidence): add release-support ProofPack closure"
          git push origin HEAD:agent/proof-pack-closure-20260805

# KFM Studio native extraction.
#
# Runs the opt-in native cases in tests/local_data/test_intake_studio.py, which
# every other job skips: real bubblewrap sandboxing, prlimit bounds, Pillow,
# Poppler PDF tools and English Tesseract OCR. Inputs are synthetic images and
# PDFs generated by the test. Tools come from the signed Ubuntu archive;
# Tesseract is copied into the private runtime layout the Studio documents
# (docs/runbooks/local-intake-studio.md). It is test evidence only; it grants no
# readiness, release, or publication authority.
name: intake-studio-native

on:
  pull_request:
    paths:
      - ".github/workflows/intake-studio-native.yml"
      - "tools/local_data/intake_studio/**"
      - "tests/local_data/test_intake_studio.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/intake-studio-native.yml"
      - "tools/local_data/intake_studio/**"
      - "tests/local_data/test_intake_studio.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intake-studio-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  native:
    name: Studio native extraction (system Python, bubblewrap, Tesseract)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the sandbox, PDF, image and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap poppler-utils python3-pil tesseract-ocr tesseract-ocr-eng

      # Ubuntu 24.04 can restrict unprivileged user namespaces through AppArmor;
      # bubblewrap needs them to build the extraction sandbox.
      - name: Allow the unprivileged user namespaces bubblewrap needs
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --die-with-parent --unshare-all --new-session --cap-drop ALL \
            --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp /usr/bin/true

      - name: Lay out the private OCR runtime
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/kfm-intake-runtime/root"
          mkdir -p "$runtime/usr/bin" "$runtime/usr/lib/x86_64-linux-gnu" \
            "$runtime/usr/share/tesseract-ocr/5/tessdata"
          cp /usr/bin/tesseract "$runtime/usr/bin/"
          ldd /usr/bin/tesseract | awk '/=> \//{print $3}' | while read -r library; do
            cp -L "$library" "$runtime/usr/lib/x86_64-linux-gnu/"
          done
          cp /usr/share/tesseract-ocr/5/tessdata/eng.traineddata \
            "$runtime/usr/share/tesseract-ocr/5/tessdata/"
          "$runtime/usr/bin/tesseract" --version | head -n 1

      - name: Run the native extraction tests
        env:
          KFM_INTAKE_NATIVE_TESTS: "1"
        run: |
          set -euo pipefail
          KFM_INTAKE_TEST_RUNTIME="$RUNNER_TEMP/kfm-intake-runtime" \
            /usr/bin/python3 -m unittest tests.local_data.test_intake_studio -v

      - name: Confirm the tests left the checkout unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=all)"

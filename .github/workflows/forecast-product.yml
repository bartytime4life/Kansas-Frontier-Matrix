# Validate the additive, fixture-only ForecastProduct profile.
name: forecast-product

"on":
  pull_request:
    paths:
      - ".github/workflows/forecast-product.yml"
      - "contracts/common/forecast_product.md"
      - "schemas/contracts/v1/common/forecast_product.schema.json"
      - "fixtures/contracts/v1/common/forecast_product/**"
      - "tools/validators/validate_forecast_product.py"
      - "tests/validators/test_validate_forecast_product.py"
      - "docs/intake/exploratory/briefing-forecast-product-source-map.md"
      - "data/receipts/generated/genrec-briefing-forecast-product-20260808.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/forecast-product.yml"
      - "contracts/common/forecast_product.md"
      - "schemas/contracts/v1/common/forecast_product.schema.json"
      - "fixtures/contracts/v1/common/forecast_product/**"
      - "tools/validators/validate_forecast_product.py"
      - "tests/validators/test_validate_forecast_product.py"
      - "docs/intake/exploratory/briefing-forecast-product-source-map.md"
      - "data/receipts/generated/genrec-briefing-forecast-product-20260808.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forecast-product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-forecast-product
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema, hashing, and test dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.validators.test_validate_forecast_product --verbose

      - name: Replay exact fixture outcomes
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_forecast_product.py --fixtures

      - name: Verify generated authoring receipt integrity
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-briefing-forecast-product-20260808.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### ForecastProduct fixture profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: local forecast role, issue/valid/retrieval time, method, uncertainty, geometry, lineage, deterministic identity, and authority non-effects."
            echo "- Boundary: no live forecast fetch, source activation, model execution, evidence resolution, policy/review execution, lifecycle write, advisory, promotion, release, publication, map, API, or AI authority."
          } >> "$GITHUB_STEP_SUMMARY"

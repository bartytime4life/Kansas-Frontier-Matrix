name: implementation-decision-review

"on":
  pull_request:
    paths:
      - ".github/workflows/implementation-decision-review.yml"
      - "contracts/governance/implementation_decision_record.md"
      - "schemas/contracts/v1/governance/implementation_decision_record.schema.json"
      - "fixtures/contracts/v1/governance/implementation_decision_record/**"
      - "tools/validators/governance/validate_implementation_decision_record.py"
      - "tools/validators/governance/README.md"
      - "tests/validators/governance/test_implementation_decision_record.py"
      - "docs/intake/exploratory/fluencyloop-implementation-decision-source-map.md"
      - "data/receipts/generated/genrec-implementation-decision-review-20260806.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/implementation-decision-review.yml"
      - "contracts/governance/implementation_decision_record.md"
      - "schemas/contracts/v1/governance/implementation_decision_record.schema.json"
      - "fixtures/contracts/v1/governance/implementation_decision_record/**"
      - "tools/validators/governance/validate_implementation_decision_record.py"
      - "tools/validators/governance/README.md"
      - "tests/validators/governance/test_implementation_decision_record.py"
      - "docs/intake/exploratory/fluencyloop-implementation-decision-source-map.md"
      - "data/receipts/generated/genrec-implementation-decision-review-20260806.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: implementation-decision-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-implementation-decision-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic tests
        run: python -m pytest -q tests/validators/governance/test_implementation_decision_record.py
      - name: Run exact fixture polarity
        run: python tools/validators/governance/validate_implementation_decision_record.py --cases
      - name: Verify generated authoring receipt integrity
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-implementation-decision-review-20260806.json --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Implementation decision review"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only ImplementationDecisionRecord contract, validator, and deterministic reviewer renderer."
            echo "- Boundary: no model call, diff inference, evidence resolution, policy decision, human approval, repository mutation, promotion, release, deployment, publication, or person profile is created."
          } >> "$GITHUB_STEP_SUMMARY"

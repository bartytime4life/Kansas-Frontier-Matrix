# Validate the additive, fixture-only ModeledSurface profile.
name: modeled-surface

"on":
  pull_request:
    paths:
      - ".github/workflows/modeled-surface.yml"
      - "contracts/common/modeled_surface.md"
      - "schemas/contracts/v1/common/modeled_surface.schema.json"
      - "fixtures/contracts/v1/common/modeled_surface/**"
      - "tools/validators/validate_modeled_surface.py"
      - "tests/validators/test_validate_modeled_surface.py"
      - "docs/intake/exploratory/briefing-modeled-surface-source-map.md"
      - "data/receipts/generated/genrec-briefing-modeled-surface-20260810.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/modeled-surface.yml"
      - "contracts/common/modeled_surface.md"
      - "schemas/contracts/v1/common/modeled_surface.schema.json"
      - "fixtures/contracts/v1/common/modeled_surface/**"
      - "tools/validators/validate_modeled_surface.py"
      - "tests/validators/test_validate_modeled_surface.py"
      - "docs/intake/exploratory/briefing-modeled-surface-source-map.md"
      - "data/receipts/generated/genrec-briefing-modeled-surface-20260810.json"
      - "packages/hashing/src/hashing/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modeled-surface-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-modeled-surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema, hashing, and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused deterministic tests
        run: python -m unittest tests.validators.test_validate_modeled_surface --verbose
      - name: Replay exact fixture outcomes
        run: python tools/validators/validate_modeled_surface.py --fixtures
      - name: Verify generated authoring receipt integrity
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-briefing-modeled-surface-20260810.json
          --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### ModeledSurface fixture profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: model version, training/support limits, resolution, uncertainty, lineage, deterministic identity, and derived-only non-effects."
            echo "- Boundary: no live source, model execution, field truth, evidence/policy/review action, lifecycle write, release, map, API, AI, or publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

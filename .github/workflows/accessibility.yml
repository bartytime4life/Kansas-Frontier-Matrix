# TEMPORARY BRANCH-ONLY receipt validation transport. Restore canonical bytes after evidence capture.
name: accessibility

on:
  pull_request:
  push:
    branches:
      - main
      - agent/explorer-baseline-ts7-worker-types-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorer-repair-receipt:
    if: ${{ github.ref == 'refs/heads/agent/explorer-baseline-ts7-worker-types-20260905' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out receipt-bearing branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact head and preserved product ancestor
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/explorer-repair-receipt"
          mkdir -p "$out"
          git rev-parse HEAD | tee "$out/head.txt"
          git merge-base --is-ancestor 673a0fd60dfca321e3c2fbe8a889a3bcafb4a1c8 HEAD
          git merge-base --is-ancestor 8b9c52d88687986879c8f87d7e3835f6a58bbacd HEAD
          git diff --check 8b9c52d88687986879c8f87d7e3835f6a58bbacd...HEAD 2>&1 | tee "$out/diff-check.log"

      - name: Install repository hash-locked Python validation profile
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test 2>&1 | tee "$RUNNER_TEMP/explorer-repair-receipt/python-bootstrap.log"

      - name: Validate immutable six-file receipt bindings
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-explorer-ts7-worker-baseline-repair-673a0fd6.json \
            --repo-root . \
            --artifact-git-ref 673a0fd60dfca321e3c2fbe8a889a3bcafb4a1c8 \
            2>&1 | tee "$RUNNER_TEMP/explorer-repair-receipt/receipt.log"

      - name: Verify no tracked mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short --untracked-files=no | tee "$RUNNER_TEMP/explorer-repair-receipt/worktree-after.txt"
          test -z "$(git status --short --untracked-files=no)"

      - name: Upload receipt validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-repair-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/explorer-repair-receipt/
          retention-days: 14
          if-no-files-found: error

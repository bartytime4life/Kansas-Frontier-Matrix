# TEMPORARY BRANCH-ONLY validation transport. Restore canonical bytes after evidence capture.
name: accessibility

on:
  pull_request:
  push:
    branches:
      - main
      - agent/explorer-baseline-ts7-worker-types-20260905
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explorer-baseline-repair:
    if: ${{ github.ref == 'refs/heads/agent/explorer-baseline-ts7-worker-types-20260905' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: candidate
            ref: 673a0fd60dfca321e3c2fbe8a889a3bcafb4a1c8
          - kind: pinned-main
            ref: 8b9c52d88687986879c8f87d7e3835f6a58bbacd
    env:
      CI: "true"
      DO_NOT_TRACK: "1"
      CLOUDFLARE_SEND_METRICS: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out exact matrix source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact source and immutable inputs
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/explorer-baseline-repair"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"
          git rev-parse HEAD | tee "$out/head.txt"
          if test "$KIND" = candidate; then
            test "$(git merge-base 8b9c52d88687986879c8f87d7e3835f6a58bbacd HEAD)" = 8b9c52d88687986879c8f87d7e3835f6a58bbacd
            git diff --name-status 8b9c52d88687986879c8f87d7e3835f6a58bbacd...HEAD | tee "$out/diff-name-status.txt"
            git diff --check 8b9c52d88687986879c8f87d7e3835f6a58bbacd...HEAD 2>&1 | tee "$out/diff-check.log"
          fi
          sha256sum package.json pnpm-workspace.yaml pnpm-lock.yaml apps/kansas-frontier-matrix-explorer/package.json apps/kansas-frontier-matrix-explorer/package-lock.json | tee "$out/locks.sha256"

      - name: Record raw topology disposition
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/explorer-baseline-repair"
          python tools/validators/directory_governance/validate_repository_topology.py --format text >"$out/topology.log" 2>&1
          topology_status=$?
          cat "$out/topology.log"
          printf '%s\n' "$topology_status" > "$out/topology-status.txt"
          exit 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Install exact frozen workspace
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          sha256sum -c "$RUNNER_TEMP/explorer-baseline-repair/locks.sha256"

      - name: Run complete Explorer app gates
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set +e
          out="$RUNNER_TEMP/explorer-baseline-repair"

          pnpm --filter kansas-frontier-matrix-explorer exec tsc --version >"$out/tsc-version.log" 2>&1
          tsc_version_status=$?
          cat "$out/tsc-version.log"
          pnpm --filter kansas-frontier-matrix-explorer exec node -e 'import("typescript").then((m) => console.log(m.version ?? m.default?.version ?? "NO_VERSION"))' >"$out/typescript-api-version.log" 2>&1
          api_version_status=$?
          cat "$out/typescript-api-version.log"

          pnpm --filter kansas-frontier-matrix-explorer build >"$out/build.log" 2>&1
          build_status=$?
          cat "$out/build.log"

          node --test apps/kansas-frontier-matrix-explorer/tests/*.test.mjs >"$out/app-node.log" 2>&1
          node_status=$?
          cat "$out/app-node.log"

          pnpm --filter kansas-frontier-matrix-explorer exec tsc --noEmit >"$out/typecheck.log" 2>&1
          type_status=$?
          cat "$out/typecheck.log"

          pnpm --filter kansas-frontier-matrix-explorer lint >"$out/lint.log" 2>&1
          lint_status=$?
          cat "$out/lint.log"

          printf 'tsc_version=%s\napi_version=%s\nbuild=%s\nnode=%s\ntypecheck=%s\nlint=%s\n' \
            "$tsc_version_status" "$api_version_status" "$build_status" "$node_status" "$type_status" "$lint_status" | tee "$out/gate-status.txt"

          if test "$KIND" = candidate; then
            test "$tsc_version_status" -eq 0
            grep -Fx 'Version 7.0.2' "$out/tsc-version.log"
            test "$api_version_status" -eq 0
            grep -E '^6\.0\.' "$out/typescript-api-version.log"
            test "$build_status" -eq 0
            test "$node_status" -eq 0
            test "$type_status" -eq 0
            test "$lint_status" -eq 0
          else
            test "$build_status" -eq 0
            test "$node_status" -ne 0
            test "$type_status" -ne 0
            test "$lint_status" -ne 0
          fi

      - name: Verify immutable inputs and tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/explorer-baseline-repair/locks.sha256"
          git status --short --untracked-files=no | tee "$RUNNER_TEMP/explorer-baseline-repair/worktree-after.txt"
          test -z "$(git status --short --untracked-files=no)"

      - name: Upload exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-baseline-repair-${{ matrix.kind }}-${{ matrix.ref }}
          path: ${{ runner.temp }}/explorer-baseline-repair/
          retention-days: 14
          if-no-files-found: error

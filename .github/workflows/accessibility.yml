# TEMPORARY BRANCH-ONLY provenance hash capture. Restore canonical bytes after evidence capture.
name: accessibility

on:
  pull_request:
  push:
    branches:
      - main
      - agent/explorer-baseline-ts7-worker-types-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorer-repair-hash-capture:
    if: ${{ github.ref == 'refs/heads/agent/explorer-baseline-ts7-worker-types-20260905' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact product repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 673a0fd60dfca321e3c2fbe8a889a3bcafb4a1c8
          fetch-depth: 0
          persist-credentials: false

      - name: Capture exact six-artifact bindings
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/explorer-repair-hashes"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = 673a0fd60dfca321e3c2fbe8a889a3bcafb4a1c8
          git rev-parse HEAD | tee "$out/head.txt"
          cat > "$out/artifact-paths.txt" <<'EOF'
          apps/kansas-frontier-matrix-explorer/db/index.ts
          apps/kansas-frontier-matrix-explorer/package-lock.json
          apps/kansas-frontier-matrix-explorer/package.json
          apps/kansas-frontier-matrix-explorer/worker-configuration.d.ts
          apps/kansas-frontier-matrix-explorer/worker/index.ts
          pnpm-lock.yaml
          EOF
          while IFS= read -r path; do
            test -f "$path"
            sha256sum "$path"
          done < "$out/artifact-paths.txt" | tee "$out/artifact-sha256.txt"
          git diff --check 8b9c52d88687986879c8f87d7e3835f6a58bbacd...HEAD 2>&1 | tee "$out/diff-check.log"
          git diff --name-status 8b9c52d88687986879c8f87d7e3835f6a58bbacd...HEAD | tee "$out/diff-name-status.txt"
          test "$(git diff --name-only 8b9c52d88687986879c8f87d7e3835f6a58bbacd...HEAD | sort)" = "$(sort "$out/artifact-paths.txt")"

      - name: Upload exact repair bindings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-repair-hashes-673a0fd60dfca321e3c2fbe8a889a3bcafb4a1c8
          path: ${{ runner.temp }}/explorer-repair-hashes/
          retention-days: 14
          if-no-files-found: error

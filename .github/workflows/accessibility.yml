# TEMPORARY BRANCH-ONLY validation transport. Restore from main after evidence capture.
name: accessibility

on:
  pull_request:
  push:
    branches:
      - main
      - agent/explorer-baseline-ts7-worker-types-20260905
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-workflow-held-on-repair-branch:
    if: ${{ github.ref != 'refs/heads/agent/explorer-baseline-ts7-worker-types-20260905' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Temporary branch transport is never intended for main; canonical bytes are restored before handoff.'

  explorer-lock-synthesis:
    if: ${{ github.ref == 'refs/heads/agent/explorer-baseline-ts7-worker-types-20260905' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      DO_NOT_TRACK: "1"
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Synthesize lockfiles without installing or running package scripts
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/explorer-lock-synthesis"
          mkdir -p "$out/generated"
          git rev-parse HEAD | tee "$out/head.txt"
          git diff --check 8b9c52d88687986879c8f87d7e3835f6a58bbacd...HEAD 2>&1 | tee "$out/diff-check.log"
          cp pnpm-lock.yaml "$out/pnpm-lock.before.yaml"
          cp apps/kansas-frontier-matrix-explorer/package-lock.json "$out/package-lock.before.json"

          corepack enable
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          npm --prefix apps/kansas-frontier-matrix-explorer install \
            --package-lock-only --ignore-scripts --workspaces=false

          cp pnpm-lock.yaml "$out/generated/pnpm-lock.yaml"
          cp apps/kansas-frontier-matrix-explorer/package-lock.json "$out/generated/package-lock.json"
          sha256sum "$out/generated/pnpm-lock.yaml" "$out/generated/package-lock.json" | tee "$out/generated.sha256"
          git diff -- pnpm-lock.yaml apps/kansas-frontier-matrix-explorer/package-lock.json > "$out/lock-diff.patch"

      - name: Upload generated lock candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-ts7-ts6-locks-${{ github.sha }}
          path: ${{ runner.temp }}/explorer-lock-synthesis/
          retention-days: 14
          if-no-files-found: error

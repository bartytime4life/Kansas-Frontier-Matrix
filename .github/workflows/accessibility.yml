# Diagnostic transport only. NEVER merge this branch or substitute this run for accessibility proof.
# Product, prerequisite, and current main are separate literal checkouts. No writes or deployment.
name: accessibility
on:
  push:
    branches: [agent/explorer-eslint10-context-validation-20260905]
    paths: [.github/workflows/accessibility.yml]
permissions:
  contents: read
concurrency:
  group: explorer-eslint10-context-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lint-context-evidence:
    name: lint-context-${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: candidate
            source: bf1335ad7250dec6334f62ad86d1032f0df7ef61
          - lane: repaired-baseline
            source: 343a516812596f0b29fdb1a56b3a549edbe43490
          - lane: current-main
            source: 94e976ff281ff5033c1c91ada417ab1d0c445f7b
    env:
      CI: 'true'
      COREPACK_ENABLE_STRICT: '1'
      KFM_NO_NETWORK: '1'
      TZ: UTC
    steps:
      - name: Check out literal evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Pin source and frozen installation
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lint-evidence"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/head.txt"
          test "$(git rev-parse HEAD)" = '${{ matrix.source }}'
          git diff --check > "$out/diff-check.log"
          sha256sum package.json pnpm-workspace.yaml pnpm-lock.yaml apps/kansas-frontier-matrix-explorer/package-lock.json > "$out/locks-before.sha256"
          git diff --name-status 343a516812596f0b29fdb1a56b3a549edbe43490 HEAD > "$out/diff-from-repaired-baseline.txt"
          git diff --name-status 8b9c52d88687986879c8f87d7e3835f6a58bbacd 94e976ff281ff5033c1c91ada417ab1d0c445f7b > "$out/main-advance-paths.txt"
          git diff --exit-code 8b9c52d88687986879c8f87d7e3835f6a58bbacd 94e976ff281ff5033c1c91ada417ab1d0c445f7b -- apps/kansas-frontier-matrix-explorer package.json pnpm-workspace.yaml pnpm-lock.yaml > "$out/main-app-lock-equivalence.log"
          if [ '${{ matrix.lane }}' = candidate ]; then
            git diff --name-only -z 343a516812596f0b29fdb1a56b3a549edbe43490 HEAD | xargs -0 sha256sum > "$out/product-source.sha256"
            git diff --binary 343a516812596f0b29fdb1a56b3a549edbe43490 HEAD > "$out/product.patch"
            git diff --name-only 343a516812596f0b29fdb1a56b3a549edbe43490 HEAD > "$out/product-paths.txt"
            tar -czf "$out/product-source.tgz" -T "$out/product-paths.txt"
            cp data/receipts/generated/genrec-explorer-eslint10-context-a1203619.json "$out/receipt.json"
            test "$(git rev-parse HEAD:.github/workflows/accessibility.yml)" = 1b3137905c441d5f5fab52afe33599fdda2ced88
            git diff --exit-code a120361953ae574c4c1df8ea805a69677c9fab78 HEAD -- apps docs tests > "$out/receipt-only-source-parity.log"
          fi
          node --version > "$out/node-version.txt"
          corepack enable
          pnpm --version > "$out/pnpm-version.txt"
          pnpm install --frozen-lockfile > "$out/install.log" 2>&1
      - name: Collect gates without converting failures into passes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lint-evidence"
          : > "$out/gate-status.tsv"
          run_gate() {
            local name="$1"
            shift
            set +e
            "$@" > "$out/$name.log" 2>&1
            local status=$?
            set -e
            printf '%s\t%s\n' "$name" "$status" | tee -a "$out/gate-status.tsv"
          }
          run_gate build pnpm --filter kansas-frontier-matrix-explorer run build
          run_gate app-node node --test apps/kansas-frontier-matrix-explorer/tests/*.test.mjs
          run_gate typecheck pnpm --filter kansas-frontier-matrix-explorer exec tsc --noEmit
          run_gate lint pnpm --filter kansas-frontier-matrix-explorer run lint
          run_gate lint-json bash apps/kansas-frontier-matrix-explorer/scripts/sites-env.sh -- "$GITHUB_WORKSPACE/apps/kansas-frontier-matrix-explorer/node_modules/.bin/eslint" . --ignore-pattern dist --ignore-pattern .next --ignore-pattern public/maplibre --format json
          if [ '${{ matrix.lane }}' = candidate ]; then
            run_gate lint-contract pnpm --filter kansas-frontier-matrix-explorer run test:lint
            run_gate posttest pnpm --filter kansas-frontier-matrix-explorer run posttest
            run_gate compat-source-syntax node --check apps/kansas-frontier-matrix-explorer/eslint-react-context.mjs
            run_gate python-bootstrap python3 tools/ci/install_python_ci.py project-test
            run_gate generated-receipt python3 tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-explorer-eslint10-context-a1203619.json --repo-root . --artifact-git-ref a120361953ae574c4c1df8ea805a69677c9fab78
          fi
          run_gate topology python3 tools/validators/directory_governance/validate_repository_topology.py --repo-root . --trusted-baseline-ref 94e976ff281ff5033c1c91ada417ab1d0c445f7b --format json
          run_gate immutable git diff --exit-code
          sha256sum -c "$out/locks-before.sha256" > "$out/locks-check.log"
          git status --porcelain --untracked-files=no > "$out/tracked-after.txt"
          git ls-files apps/kansas-frontier-matrix-explorer | while IFS= read -r path; do sha256sum "$path"; done > "$out/app-source.sha256"
          cat "$out/gate-status.tsv" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: explorer-eslint10-${{ matrix.lane }}-${{ matrix.source }}
          path: ${{ runner.temp }}/lint-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Enforce all collected outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/lint-evidence/gate-status.tsv"
          test -s "$file"
          awk -F '\t' '$2 != 0 { failed = 1 } END { exit failed }' "$file"
          test ! -s "$RUNNER_TEMP/lint-evidence/tracked-after.txt"

# Validate the fixture-only EPA AQS site-metadata semantic delta profile.
name: atmosphere-aqs-site-delta

"on":
  pull_request:
    paths:
      - ".github/workflows/atmosphere-aqs-site-delta.yml"
      - "contracts/domains/atmosphere/aqs_site_metadata_delta.md"
      - "contracts/source/source_record_absence_assessment.md"
      - "schemas/contracts/v1/domains/atmosphere/aqs_site_metadata_delta_report.schema.json"
      - "schemas/contracts/v1/source/source_record_absence_assessment.schema.json"
      - "tools/ingest/aqs_watch/**"
      - "tools/validators/validate_source_record_absence_assessment.py"
      - "tests/ingest/aqs_watch/**"
      - "fixtures/contracts/v1/source/source_record_absence_assessment/**"
      - "data/receipts/generated/genrec-atmosphere-aqs-site-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/atmosphere-aqs-site-delta.yml"
      - "contracts/domains/atmosphere/aqs_site_metadata_delta.md"
      - "contracts/source/source_record_absence_assessment.md"
      - "schemas/contracts/v1/domains/atmosphere/aqs_site_metadata_delta_report.schema.json"
      - "schemas/contracts/v1/source/source_record_absence_assessment.schema.json"
      - "tools/ingest/aqs_watch/**"
      - "tools/validators/validate_source_record_absence_assessment.py"
      - "tests/ingest/aqs_watch/**"
      - "fixtures/contracts/v1/source/source_record_absence_assessment/**"
      - "data/receipts/generated/genrec-atmosphere-aqs-site-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atmosphere-aqs-site-delta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-aqs-site-delta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic AQS site-delta tests
        run: |
          set -euo pipefail
          python -m pytest \
            tests/ingest/aqs_watch/test_aqs_site_delta.py \
            -q --strict-config --strict-markers

      - name: Verify common missing-record semantics remain fail closed
        run: |
          set -euo pipefail
          python tools/validators/validate_source_record_absence_assessment.py --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-atmosphere-aqs-site-absence-binding-20260807.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Synthetic EPA AQS site-metadata delta"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only lifecycle, location, method, parameter, POC, metadata, and missing-record signal classification."
            echo "- Missing-record rule: current-snapshot absence is not removal; SourceRecordAbsenceAssessment is required before any transition candidate."
            echo "- Boundary: no live AQS/KDHE access, source admission, lifecycle write, evidence resolution, source-state mutation, clearance, policy decision, air-quality guidance, promotion, release, publication, or public use."
          } >> "$GITHUB_STEP_SUMMARY"

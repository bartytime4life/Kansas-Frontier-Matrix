name: blm-connector-offline
on:
  pull_request:
    paths:
      - 'connectors/blm/src/blm/fetch.py'
      - 'connectors/blm/src/blm/admit.py'
      - 'connectors/blm/src/blm/descriptor.yaml'
      - 'connectors/blm/src/blm/plss_cadnsdi.py'
      - 'connectors/blm/tests/test_*.py'
      - 'packages/connectors-core/src/connectors_core/**'
      - '.github/workflows/blm-connector-offline.yml'
  push:
    branches: [main]
    paths:
      - 'connectors/blm/src/blm/fetch.py'
      - 'connectors/blm/src/blm/admit.py'
      - 'connectors/blm/src/blm/descriptor.yaml'
      - 'connectors/blm/src/blm/plss_cadnsdi.py'
      - 'connectors/blm/tests/test_*.py'
      - 'packages/connectors-core/src/connectors_core/**'
      - '.github/workflows/blm-connector-offline.yml'
permissions:
  contents: read
concurrency:
  group: blm-connector-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The interpreters tools/ci/python-test.lock declares; the stdlib json decoder's
        # depth behavior (and so parser routing) differs between them.
        python: ['3.11', '3.12']
    env:
      KFM_NO_NETWORK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Run standard-library synthetic tests (connectors-core imported from source)
        run: python -m unittest discover -s connectors/blm/tests -p 'test_*.py' -v
      - name: Record evidence boundary
        if: always()
        run: |
          echo 'Offline synthetic BLM PLSS (CadNSDI) query planner, GeoJSON parser, injected-transport retrieval-episode, and routing checks only; routes stay HOLD while descriptor role/rights are unresolved. Service path, layer ids and attribute names are NEEDS VERIFICATION. PLSS geometry is survey reference context, not parcel, title, deed or access authority. No BLM fetch, source activation, survey review, source admission, capture completeness, active Site integration, release, or deployment proof.' >> "$GITHUB_STEP_SUMMARY"

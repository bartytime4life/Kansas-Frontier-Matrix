name: map-georeference-spatial-projection

"on":
  pull_request:
    paths:
      - ".github/workflows/map-georeference-spatial-projection.yml"
      - "contracts/map/georeference_control_point_set.md"
      - "contracts/map/georeference_spatial_distribution.md"
      - "schemas/contracts/v1/map/georeference_control_point_set.schema.json"
      - "schemas/contracts/v1/map/georeference_spatial_distribution.schema.json"
      - "fixtures/contracts/v1/map/georeference_control_point_set/**"
      - "fixtures/contracts/v1/map/georeference_spatial_distribution/**"
      - "tools/validators/map/validate_georeference_control_point_set.py"
      - "tools/validators/map/validate_georeference_spatial_distribution.py"
      - "tools/generators/project_georeference_spatial_distribution.py"
      - "tests/generators/test_project_georeference_spatial_distribution.py"
      - "docs/intake/exploratory/georeference-control-point-set-source-map.md"
      - "docs/intake/exploratory/pass-18-georeference-control-point-evidence-source-map.md"
      - "data/receipts/generated/genrec-georeference-spatial-identity-projection-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-georeference-spatial-projection.yml"
      - "contracts/map/georeference_control_point_set.md"
      - "contracts/map/georeference_spatial_distribution.md"
      - "schemas/contracts/v1/map/georeference_control_point_set.schema.json"
      - "schemas/contracts/v1/map/georeference_spatial_distribution.schema.json"
      - "fixtures/contracts/v1/map/georeference_control_point_set/**"
      - "fixtures/contracts/v1/map/georeference_spatial_distribution/**"
      - "tools/validators/map/validate_georeference_control_point_set.py"
      - "tools/validators/map/validate_georeference_spatial_distribution.py"
      - "tools/generators/project_georeference_spatial_distribution.py"
      - "tests/generators/test_project_georeference_spatial_distribution.py"
      - "docs/intake/exploratory/georeference-control-point-set-source-map.md"
      - "docs/intake/exploratory/pass-18-georeference-control-point-evidence-source-map.md"
      - "data/receipts/generated/genrec-georeference-spatial-identity-projection-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-georeference-spatial-projection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-georeference-spatial-projection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run projection and adjacent validator suites
        run: |
          set -euo pipefail
          python -m unittest \
            tests.generators.test_project_georeference_spatial_distribution \
            --verbose
          python -m pytest -q \
            tests/map/test_georeference_control_point_set.py \
            tests/map/test_georeference_spatial_distribution.py
          python tools/generators/project_georeference_spatial_distribution.py \
            fixtures/contracts/v1/map/georeference_control_point_set/valid.json \
            fixtures/contracts/v1/map/georeference_spatial_distribution/projection_request.json \
            > /tmp/georeference-spatial-projection.json
      - name: Validate current authoring receipt
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-georeference-spatial-identity-projection-20260814.json
          --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Georeference spatial identity projection"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: accepted fixture resource-space GCP identity, exact ordered projection, deterministic distribution metrics, finite READY/HOLD output, and current-byte receipt integrity."
            echo "- Boundary: a green result does not authenticate GCPs, establish georeference truth, evaluate policy, or authorize promotion, release, publication, or public use."
          } >> "$GITHUB_STEP_SUMMARY"

name: release-dry-run-binding-probe

"on":
  push:
    paths:
      - ".github/workflows/release-dry-run-binding-probe.yml"
      - ".github/workflows/release-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-binding-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out inspected revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Emit exact current-binding digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .github/workflows/release-dry-run.yml \
            data/receipts/generated/genrec-publication-deny-dry-run-current-20260816.json

# Temporary, read-only branch probe used to bind the documentation artifact's
# exact SHA-256 before emitting its GENERATED_RECEIPT. This file is removed
# before the final review head and has no release, deployment, or publication
# effect.
name: tmp-documentation-drift-hash

"on":
  pull_request:
    paths:
      - "docs/dashboards/governance/DOCUMENTATION_DRIFT.md"
      - ".github/workflows/tmp-documentation-drift-hash.yml"

permissions:
  contents: read

jobs:
  hash-final-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Emit exact artifact digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path("docs/dashboards/governance/DOCUMENTATION_DRIFT.md")
          payload = path.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          print(f"DOCUMENTATION_DRIFT_SHA256={digest}")
          print(f"DOCUMENTATION_DRIFT_BYTES={len(payload)}")
          print(f"DOCUMENTATION_DRIFT_LINES={payload.count(bytes([10]))}")
          PY

# Temporary branch-local materializer; replaced by the final validation workflow.
name: temporary-materialize-prompt-authorization-envelope

"on":
  push:
    branches:
      - "agent/pass8-signed-prompt-envelope-20260808"

permissions:
  contents: write

concurrency:
  group: temporary-materialize-prompt-authorization-envelope-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out bounded feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          encoded = """"""
          payload = base64.b64decode(encoded)
          if hashlib.sha256(payload).hexdigest() != "cd8225cfd4c9df5fd8e936a21fd06296aa62d5a84f47d8b4e9711b5be8385d96":
              raise SystemExit("materialization archive digest mismatch")
          Path("/tmp/prompt-authorization-envelope.tar.gz").write_bytes(payload)
          PY
          tar -xzf /tmp/prompt-authorization-envelope.tar.gz -C .

      - name: Commit bounded source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KFM bounded materialization automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            contracts/governance/prompt_authorization_envelope.md \
            schemas/contracts/v1/governance/prompt_authorization_envelope.schema.json \
            fixtures/contracts/v1/governance/prompt_authorization_envelope \
            tools/generators/prompt_authorization_envelope \
            tools/validators/governance/validate_prompt_authorization_envelope.py \
            tests/validators/governance/test_prompt_authorization_envelope.py \
            data/receipts/generated/genrec-pass8-prompt-authorization-envelope-20260808.json
          if git diff --cached --quiet; then
            echo "Source files are already current."
            exit 0
          fi
          git commit -m "feat(governance): add fixture-first prompt authorization envelope"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Validate the reusable, read-only KFM local schema-registry helper package.
name: schema-registry-package

"on":
  pull_request:
    paths:
      - ".github/workflows/schema-registry-package.yml"
      - "packages/schema-registry/**"
      - "fixtures/packages/schema-registry/**"
      - "tests/packages/schema_registry/**"
      - "data/receipts/generated/genrec-schema-registry-package-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/schema-registry-package.yml"
      - "packages/schema-registry/**"
      - "fixtures/packages/schema-registry/**"
      - "tests/packages/schema_registry/**"
      - "data/receipts/generated/genrec-schema-registry-package-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-registry-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-local-schema-registry-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/schema-registry/pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]" -e "./packages/schema-registry[test]"

      - name: Run deterministic package tests and fixture snapshot
        run: |
          set -euo pipefail
          python -m pytest -q tests/packages/schema_registry
          kfm-schema-registry fixtures/packages/schema-registry/valid > /tmp/schema-registry-snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/schema-registry-snapshot.json").read_text())
          assert payload["outcome"] == "RESOLVED"
          assert payload["snapshot"]["record_count"] == 2
          assert payload["snapshot"]["skipped_count"] == 1
          PY

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-schema-registry-package-20260809.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Local schema-registry package validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: explicit-root, deterministic, no-network schema indexing; strict JSON parsing; duplicate-id and symlink denial; fixture polarity; authoring-receipt integrity."
            echo "- Boundary: registry resolution is helper mechanics only. It creates no schema, contract, policy, evidence, review, promotion, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

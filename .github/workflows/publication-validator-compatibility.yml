# Compatibility-entrypoint checks for existing manifest validators.
#
# The root entrypoints delegate to canonical validator implementations. This
# workflow is read-only, fixture-only, and creates no release or publication
# authority.
name: publication-validator-compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/publication-validator-compatibility.yml"
      - "schemas/contracts/v1/data/layer_manifest.schema.json"
      - "schemas/contracts/v1/release/release_manifest.schema.json"
      - "fixtures/data/layer_manifest/**"
      - "fixtures/release/release_manifest/**"
      - "tests/validators/test_publication_validator_compatibility.py"
      - "tools/validators/data/validate_layer_manifest.py"
      - "tools/validators/release/validate_release_manifest.py"
      - "tools/validators/validate_layer_manifest.py"
      - "tools/validators/validate_release_manifest.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publication-validator-compatibility.yml"
      - "schemas/contracts/v1/data/layer_manifest.schema.json"
      - "schemas/contracts/v1/release/release_manifest.schema.json"
      - "fixtures/data/layer_manifest/**"
      - "fixtures/release/release_manifest/**"
      - "tests/validators/test_publication_validator_compatibility.py"
      - "tools/validators/data/validate_layer_manifest.py"
      - "tools/validators/release/validate_release_manifest.py"
      - "tools/validators/validate_layer_manifest.py"
      - "tools/validators/validate_release_manifest.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-validator-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  compatibility:
    name: Publication manifest validator compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Verify delegation and fixture replay
        run: python -m pytest -q tests/validators/test_publication_validator_compatibility.py

      - name: Replay root compatibility entrypoints
        run: |
          python tools/validators/validate_layer_manifest.py --fixtures
          python tools/validators/validate_release_manifest.py --fixtures

      - name: Validate generated authoring receipt
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-publication-validator-compatibility-20260810.json

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "## Publication manifest validator compatibility"
            echo
            echo "This job proves that two legacy root entrypoints delegate to the"
            echo "existing canonical fixture-only validators. It does not approve a"
            echo "manifest, release, lifecycle transition, or publication."
            echo "RollbackCard remains under its existing explicit hold and is not changed here."
          } >> "${GITHUB_STEP_SUMMARY}"

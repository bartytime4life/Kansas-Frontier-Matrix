name: streamflow-qc-context

"on":
  pull_request:
    paths:
      - ".github/workflows/streamflow-qc-context.yml"
      - "contracts/domains/hydrology/streamflow_qc_context_assessment.md"
      - "schemas/contracts/v1/domains/hydrology/streamflow_qc_context_assessment.schema.json"
      - "fixtures/contracts/v1/domains/hydrology/streamflow_qc_context_assessment/**"
      - "tools/validators/domains/hydrology/validate_streamflow_qc_context_assessment.py"
      - "tests/domains/hydrology/test_streamflow_qc_context_assessment.py"
      - "docs/intake/exploratory/pass-32-streamflow-qc-context-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass32-streamflow-qc-context-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/streamflow-qc-context.yml"
      - "contracts/domains/hydrology/streamflow_qc_context_assessment.md"
      - "schemas/contracts/v1/domains/hydrology/streamflow_qc_context_assessment.schema.json"
      - "fixtures/contracts/v1/domains/hydrology/streamflow_qc_context_assessment/**"
      - "tools/validators/domains/hydrology/validate_streamflow_qc_context_assessment.py"
      - "tests/domains/hydrology/test_streamflow_qc_context_assessment.py"
      - "docs/intake/exploratory/pass-32-streamflow-qc-context-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-pass32-streamflow-qc-context-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamflow-qc-context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: python -m pytest -q tests/domains/hydrology/test_streamflow_qc_context_assessment.py
      - name: Verify generated receipt
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass32-streamflow-qc-context-20260809.json --repo-root .
      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### Streamflow QC context"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only relationship and review-priority validation over declared context."
            echo "- Boundary: no fetch, percentile computation, sensor invalidation, event declaration, detector mutation, policy, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

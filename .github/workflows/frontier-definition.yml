# Validate the fixture-only FrontierDefinition candidate.
name: frontier-definition

"on":
  pull_request:
    paths:
      - ".github/workflows/frontier-definition.yml"
      - "contracts/evidence/frontier_definition.md"
      - "schemas/contracts/v1/evidence/frontier_definition.schema.json"
      - "fixtures/contracts/v1/evidence/frontier_definition/**"
      - "tools/validators/evidence/validate_frontier_definition.py"
      - "tests/validators/evidence/test_validate_frontier_definition.py"
      - "docs/intake/exploratory/pass-20-frontier-definition-source-map.md"
      - "contracts/evidence/indicator_definition.md"
      - "contracts/common/geography_version.md"
      - "schemas/contracts/v1/evidence/indicator_definition.schema.json"
      - "schemas/contracts/v1/common/geography_version.schema.json"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass20-frontier-definition-20260810.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontier-definition.yml"
      - "contracts/evidence/frontier_definition.md"
      - "schemas/contracts/v1/evidence/frontier_definition.schema.json"
      - "fixtures/contracts/v1/evidence/frontier_definition/**"
      - "tools/validators/evidence/validate_frontier_definition.py"
      - "tests/validators/evidence/test_validate_frontier_definition.py"
      - "docs/intake/exploratory/pass-20-frontier-definition-source-map.md"
      - "contracts/evidence/indicator_definition.md"
      - "contracts/common/geography_version.md"
      - "schemas/contracts/v1/evidence/indicator_definition.schema.json"
      - "schemas/contracts/v1/common/geography_version.schema.json"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass20-frontier-definition-20260810.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-definition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-frontier-definition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused and adjacent deterministic tests
        run: |
          python -m unittest -v tests.validators.evidence.test_validate_frontier_definition
          python -m unittest -v tests.validators.test_validate_geography_version
          python -m unittest -v tests.validators.evidence.test_validate_indicator_definition
          python tools/validators/evidence/validate_frontier_definition.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass20-frontier-definition-20260810.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### FrontierDefinition"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only county frontier definition, calendar-year support, digest-bound dependencies, criteria, uncertainty, disclosure, and identity validation."
            echo "- Boundary: no source access, geography or indicator resolution, threshold resolution, rule execution, county classification, evidence resolution, policy evaluation, review approval, promotion, release, public use, publication, or deployment authority."
          } >> "$GITHUB_STEP_SUMMARY"

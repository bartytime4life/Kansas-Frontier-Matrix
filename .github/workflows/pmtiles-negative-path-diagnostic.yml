# Temporary read-only diagnostic for the merged PMTiles negative-path packet.
# Removed before the repair PR. It reports canonical fixture hashes only.
name: pmtiles-negative-path-diagnostic

"on":
  push:
    branches:
      - agent/fix-pass1-pmtiles-negative-path-20260808

permissions:
  contents: read

env:
  KFM_NO_NETWORK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report canonical semantic fixture hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from tools.validators.validate_pmtiles_delta_manifest import (
              FIXTURES_ROOT,
              canonical_spec_hash,
              validate_document,
          )

          invalid_root = FIXTURES_ROOT / "invalid"
          for path in sorted(invalid_root.glob("invalid_*.json")):
              if path.name in {"invalid_schema.json", "invalid_spec_hash_mismatch.json"}:
                  continue
              candidate = json.loads(path.read_text(encoding="utf-8"))
              digest = canonical_spec_hash(candidate)
              candidate["spec_hash"] = digest
              findings = [
                  f"{finding.code}@{finding.path}"
                  for finding in validate_document(candidate)
              ]
              print(f"CANONICAL {path.name} {digest}")
              print(f"FINDINGS {path.name} {'|'.join(findings)}")
          PY

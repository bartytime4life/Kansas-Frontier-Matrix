# Temporary read-only diagnostic for the merged PMTiles negative-path packet.
# Removed before the repair PR. It validates the focused packet and reports
# exact artifact hashes needed to correct the generated receipt.
name: pmtiles-negative-path-diagnostic

"on":
  push:
    branches:
      - agent/fix-pass1-pmtiles-negative-path-20260808

permissions:
  contents: read

env:
  KFM_NO_NETWORK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install repository test dependencies
        run: python -m pip install --no-input -e ".[test]"

      - name: Run focused PMTiles tests and fixture replay
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/validators/test_pmtiles_delta_manifest.py
          python tools/validators/validate_pmtiles_delta_manifest.py --fixtures

      - name: Report exact receipt artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receipt = json.loads(
              Path(
                  "data/receipts/generated/"
                  "genrec-pass1-pmtiles-negative-path-proof-20260808.json"
              ).read_text(encoding="utf-8")
          )
          for value in receipt["artifact_paths"]:
              path = Path(value)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"ARTIFACT {value} sha256:{digest}")
          PY

name: three-d-documentation-paradata

"on":
  pull_request:
    paths:
      - ".github/workflows/three-d-documentation-paradata.yml"
      - "contracts/domains/archaeology/three_d_documentation.md"
      - "schemas/contracts/v1/domains/archaeology/three_d_documentation.schema.json"
      - "fixtures/contracts/v1/domains/archaeology/three_d_documentation/**"
      - "tools/validators/domains/archaeology/validate_three_d_documentation.py"
      - "tests/validators/domains/archaeology/test_validate_three_d_documentation.py"
      - "docs/intake/exploratory/pass-18-three-d-documentation-paradata-source-map.md"
      - "data/receipts/generated/genrec-pass18-three-d-documentation-paradata-*.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/three-d-documentation-paradata.yml"
      - "contracts/domains/archaeology/three_d_documentation.md"
      - "schemas/contracts/v1/domains/archaeology/three_d_documentation.schema.json"
      - "fixtures/contracts/v1/domains/archaeology/three_d_documentation/**"
      - "tools/validators/domains/archaeology/validate_three_d_documentation.py"
      - "tests/validators/domains/archaeology/test_validate_three_d_documentation.py"
      - "docs/intake/exploratory/pass-18-three-d-documentation-paradata-source-map.md"
      - "data/receipts/generated/genrec-pass18-three-d-documentation-paradata-*.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-d-documentation-paradata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    name: validate-three-d-documentation-paradata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile tools/validators/domains/archaeology/validate_three_d_documentation.py tests/validators/domains/archaeology/test_validate_three_d_documentation.py
          python -m unittest tests.validators.domains.archaeology.test_validate_three_d_documentation --verbose
          python tools/validators/domains/archaeology/validate_three_d_documentation.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass18-three-d-documentation-paradata-20260811.json --repo-root .
      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### ThreeDDocumentation paradata"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic acquisition, processing, scale, georeference, interpretation, representation, asset-lineage, and governance declaration coherence."
            echo "- Boundary: no asset access or mutation, evidence/interpretation authority, policy/review decision, release, deployment, publication, precise-location exposure, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

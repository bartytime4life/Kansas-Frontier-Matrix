# Read-only CI proof for the merged esbuild remediation.
# This workflow does not merge, release, deploy, publish, or dismiss alerts.
name: esbuild-security
on:
  pull_request:
    paths:
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - apps/kansas-frontier-matrix-explorer/package.json
      - apps/kansas-frontier-matrix-explorer/package-lock.json
      - apps/kansas-frontier-matrix-explorer/tests/esbuild-security.test.mjs
      - apps/kansas-frontier-matrix-explorer/docs/esbuild-security-remediation.md
      - data/receipts/generated/esbuild-security-*.json
      - .github/workflows/esbuild-security.yml
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - apps/kansas-frontier-matrix-explorer/package.json
      - apps/kansas-frontier-matrix-explorer/package-lock.json
      - apps/kansas-frontier-matrix-explorer/tests/esbuild-security.test.mjs
      - apps/kansas-frontier-matrix-explorer/docs/esbuild-security-remediation.md
      - data/receipts/generated/esbuild-security-*.json
      - .github/workflows/esbuild-security.yml
permissions:
  contents: read
concurrency:
  group: esbuild-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pnpm:
    name: pnpm-esbuild-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run static lock and policy guards
        env:
          KFM_ESBUILD_REQUIRE_WORKSPACE: '1'
        run: node --test apps/kansas-frontier-matrix-explorer/tests/esbuild-security.test.mjs
      - name: Install frozen pnpm workspace under existing build-script policy
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version
          sha256sum pnpm-lock.yaml pnpm-workspace.yaml package.json apps/kansas-frontier-matrix-explorer/package.json apps/kansas-frontier-matrix-explorer/package-lock.json > "$RUNNER_TEMP/esbuild-pnpm.sha256"
          pnpm install --frozen-lockfile
          sha256sum -c "$RUNNER_TEMP/esbuild-pnpm.sha256"
      - name: Run runtime resolver and migration probes
        env:
          KFM_ESBUILD_REQUIRE_WORKSPACE: '1'
          KFM_ESBUILD_RUNTIME_PROBE: '1'
        run: node --test apps/kansas-frontier-matrix-explorer/tests/esbuild-security.test.mjs
  npm:
    name: npm-esbuild-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run static lock and policy guards
        env:
          KFM_ESBUILD_REQUIRE_WORKSPACE: '1'
        run: node --test apps/kansas-frontier-matrix-explorer/tests/esbuild-security.test.mjs
      - name: Install and probe the standalone npm application
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/kfm-esbuild-standalone"
          mkdir -p "$app/tests"
          cp apps/kansas-frontier-matrix-explorer/{package.json,package-lock.json} "$app/"
          cp apps/kansas-frontier-matrix-explorer/tests/esbuild-security.test.mjs "$app/tests/"
          cd "$app"
          sha256sum package-lock.json > "$RUNNER_TEMP/esbuild-npm.sha256"
          npm ci --no-fund --loglevel=error
          sha256sum -c "$RUNNER_TEMP/esbuild-npm.sha256"
          KFM_ESBUILD_RUNTIME_PROBE=1 node --test tests/esbuild-security.test.mjs

# Validate the projection-only KFM cross-domain Context Map.
name: cross-domain-seam-register

"on":
  pull_request:
    paths:
      - ".github/workflows/cross-domain-seam-register.yml"
      - "contracts/governance/cross_domain_seam_register.md"
      - "control_plane/cross_domain_seam_register.yaml"
      - "control_plane/domain_lane_register.yaml"
      - "docs/adr/ADR-0029-adopt-directory-governance-standard-v2.md"
      - "docs/doctrine/directory-rules.md"
      - "schemas/contracts/v1/governance/cross_domain_seam_register.schema.json"
      - "fixtures/contracts/v1/governance/cross_domain_seam_register/**"
      - "tools/validators/directory_governance/validate_cross_domain_seam_register.py"
      - "tests/validators/directory_governance/test_validate_cross_domain_seam_register.py"
      - "data/receipts/generated/genrec-cross-domain-seam-register-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cross-domain-seam-register.yml"
      - "contracts/governance/cross_domain_seam_register.md"
      - "control_plane/cross_domain_seam_register.yaml"
      - "control_plane/domain_lane_register.yaml"
      - "docs/adr/ADR-0029-adopt-directory-governance-standard-v2.md"
      - "docs/doctrine/directory-rules.md"
      - "schemas/contracts/v1/governance/cross_domain_seam_register.schema.json"
      - "fixtures/contracts/v1/governance/cross_domain_seam_register/**"
      - "tools/validators/directory_governance/validate_cross_domain_seam_register.py"
      - "tests/validators/directory_governance/test_validate_cross_domain_seam_register.py"
      - "data/receipts/generated/genrec-cross-domain-seam-register-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-domain-seam-register-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-cross-domain-seam-register:
    name: validate-cross-domain-seam-register
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared schema and test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run deterministic no-network tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/directory_governance \
            --pattern 'test_validate_cross_domain_seam_register.py' \
            --verbose
      - name: Validate current projection and repository bindings
        run: |
          set -euo pipefail
          python tools/validators/directory_governance/validate_cross_domain_seam_register.py
      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-cross-domain-seam-register-20260808.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Cross-Domain Seam Register"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: Context Map identity, bounded-context ownership, evidence/source-role/policy/sensitivity/release constraints, and repository bindings."
            echo "- Boundary: projection-only; no join, source activation, domain mutation, lifecycle write, release, deployment, promotion, or publication authority."
          } >> "$GITHUB_STEP_SUMMARY"

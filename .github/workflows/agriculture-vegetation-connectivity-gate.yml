# Validate fixture-only vegetation connectivity gate assessments.
name: agriculture-vegetation-connectivity-gate

"on":
  pull_request:
    paths:
      - ".github/workflows/agriculture-vegetation-connectivity-gate.yml"
      - "contracts/domains/agriculture/vegetation_connectivity_gate.md"
      - "schemas/contracts/v1/domains/agriculture/vegetation_connectivity_gate.schema.json"
      - "tools/validators/domains/agriculture/vegetation_connectivity_gate/**"
      - "fixtures/domains/agriculture/vegetation_connectivity_gate/**"
      - "tests/validators/domains/agriculture/vegetation_connectivity_gate/**"
      - "docs/intake/exploratory/pass-32-vegetation-connectivity-gate-source-map.md"
      - "data/receipts/generated/genrec-pass32-vegetation-connectivity-gate-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agriculture-vegetation-connectivity-gate.yml"
      - "contracts/domains/agriculture/vegetation_connectivity_gate.md"
      - "schemas/contracts/v1/domains/agriculture/vegetation_connectivity_gate.schema.json"
      - "tools/validators/domains/agriculture/vegetation_connectivity_gate/**"
      - "fixtures/domains/agriculture/vegetation_connectivity_gate/**"
      - "tests/validators/domains/agriculture/vegetation_connectivity_gate/**"
      - "docs/intake/exploratory/pass-32-vegetation-connectivity-gate-source-map.md"
      - "data/receipts/generated/genrec-pass32-vegetation-connectivity-gate-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agriculture-vegetation-connectivity-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-vegetation-connectivity-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic gate tests
        run: |
          set -euo pipefail
          python -m pytest \
            tests/validators/domains/agriculture/vegetation_connectivity_gate/test_validate_connectivity_gate.py \
            -q --strict-config --strict-markers

      - name: Replay exact fixture polarity
        run: |
          set -euo pipefail
          python tools/validators/domains/agriculture/vegetation_connectivity_gate/validate_connectivity_gate.py \
            --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass32-vegetation-connectivity-gate-20260808.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Vegetation connectivity gate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: strict fixture shape, deterministic JCS identity, component area/persistence closure, exact finite findings, and all-false authority posture."
            echo "- Boundary: no source access, raster reads, NDVI calculation, connected-pixel labeling, geometry operation, evidence or policy decision, promotion, release, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

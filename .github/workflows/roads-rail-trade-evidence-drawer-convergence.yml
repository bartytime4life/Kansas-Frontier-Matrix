name: roads-rail-trade-evidence-drawer-convergence

on:
  pull_request:
    paths:
      - "apps/explorer-web/src/features/domains/roads_rail_trade/EvidenceDrawer.tsx"
      - "apps/explorer-web/src/features/evidence_drawer/index.tsx"
      - "schemas/contracts/v1/domains/roads-rail-trade/evidence_drawer_payload.schema.json"
      - "schemas/contracts/v1/ui/evidence_drawer_payload.schema.json"
      - "tests/validators/domains/roads_rail_trade/test_evidence_drawer_convergence.py"
      - ".github/workflows/roads-rail-trade-evidence-drawer-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  KFM_NO_NETWORK: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Compile focused test
        run: python -m py_compile tests/validators/domains/roads_rail_trade/test_evidence_drawer_convergence.py
      - name: Run deterministic convergence tests
        run: python -m unittest -q tests.validators.domains.roads_rail_trade.test_evidence_drawer_convergence

# Validate the proposed common IdentityToken machine shape against public-safe fixtures.
name: identity-token-validation

"on":
  pull_request:
    paths:
      - ".github/workflows/identity-token-validation.yml"
      - "pyproject.toml"
      - "schemas/contracts/v1/common/identity_token.schema.json"
      - "contracts/common/identity_token.md"
      - "tools/validators/_common/jsonschema_runner.py"
      - "tools/validators/validate_identity_token.py"
      - "tests/validators/test_jsonschema_runner.py"
      - "fixtures/contracts/v1/common/identity_token/**"
      - "data/receipts/generated/genrec-identity-token-validator-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/identity-token-validation.yml"
      - "pyproject.toml"
      - "schemas/contracts/v1/common/identity_token.schema.json"
      - "contracts/common/identity_token.md"
      - "tools/validators/_common/jsonschema_runner.py"
      - "tools/validators/validate_identity_token.py"
      - "tests/validators/test_jsonschema_runner.py"
      - "fixtures/contracts/v1/common/identity_token/**"
      - "data/receipts/generated/genrec-identity-token-validator-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-token-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-identity-token-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test

      - name: Verify shared-runner format opt-in compatibility
        run: |
          set -euo pipefail
          python -m pytest -q tests/validators/test_jsonschema_runner.py

      - name: Validate IdentityToken fixture polarity and date-time format
        run: |
          set -euo pipefail
          python tools/validators/validate_identity_token.py --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-identity-token-validator-format-checking-20260809.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### IdentityToken fixture validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: existing proposed IdentityToken JSON Schema, explicit format-check opt-in, non-vacuous synthetic fixture polarity, shared-runner compatibility, and authoring-receipt integrity."
            echo "- Boundary: schema and format validity prove machine shape only. They create no identity, authentication, evidence, policy, review, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

# Bounded TemporalViewState contract, package, and Explorer conformance checks.

name: temporal-view-state-validation

"on":
  pull_request:
    paths:
      - ".github/workflows/temporal-view-state-validation.yml"
      - "contracts/common/temporal_view_state.md"
      - "schemas/contracts/v1/common/temporal_view_state.schema.json"
      - "fixtures/contracts/v1/common/temporal_view_state/**"
      - "packages/temporal/**"
      - "tools/validators/validate_temporal_view_state.py"
      - "tests/validators/test_validate_temporal_view_state.py"
      - "tests/schemas/test_common_contracts.py"
      - "apps/explorer-web/src/features/temporal/**"
      - "apps/explorer-web/src/site/workspace-context.ts"
      - "apps/explorer-web/tests/temporal-kernel.test.ts"
      - "apps/explorer-web/package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporal-view-state-validation.yml"
      - "contracts/common/temporal_view_state.md"
      - "schemas/contracts/v1/common/temporal_view_state.schema.json"
      - "fixtures/contracts/v1/common/temporal_view_state/**"
      - "packages/temporal/**"
      - "tools/validators/validate_temporal_view_state.py"
      - "tests/validators/test_validate_temporal_view_state.py"
      - "tests/schemas/test_common_contracts.py"
      - "apps/explorer-web/src/features/temporal/**"
      - "apps/explorer-web/src/site/workspace-context.ts"
      - "apps/explorer-web/tests/temporal-kernel.test.ts"
      - "apps/explorer-web/package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-view-state-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-temporal-view-state:
    name: validate-temporal-view-state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused TemporalViewState validator tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators \
            --pattern 'test_validate_temporal_view_state.py' \
            --verbose

      - name: Run non-vacuous TemporalViewState fixture profile
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/validate_temporal_view_state.py --fixtures

      - name: Prove generic common-schema discovery
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/schemas/test_common_contracts.py -k temporal_view_state

  explorer-temporal-conformance:
    name: explorer-temporal-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.1"
          package-manager-cache: false

      - name: Install the repository-declared pnpm version
        shell: bash
        run: npm install --global --no-audit --no-fund pnpm@11.17.0

      - name: Install locked Explorer dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --filter explorer-web...

      - name: Run temporal adapter tests
        shell: bash
        working-directory: apps/explorer-web
        run: pnpm exec vitest run tests/temporal-kernel.test.ts

      - name: Record validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### TemporalViewState validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- The profile is proposed, fixture-first, no-network, and non-authoritative."
            echo "- Passing checks prove closed shape, local temporal semantics, deterministic identity, frame metadata hygiene, and generation guards only."
            echo "- The checks do not prove source truth, evidence closure, policy/release approval, GPU/source/hosting readiness, Site editing, or publication."
            echo "- No source was activated and no lifecycle, evidence, policy, release, deployment, or public artifact was emitted."
          } >> "$GITHUB_STEP_SUMMARY"

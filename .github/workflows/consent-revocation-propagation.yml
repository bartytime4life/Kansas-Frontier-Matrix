name: consent-revocation-propagation

"on":
  pull_request:
    paths:
      - ".github/workflows/consent-revocation-propagation.yml"
      - "contracts/domains/people-dna-land/consent_revocation_propagation_assessment.md"
      - "schemas/contracts/v1/domains/people-dna-land/consent_revocation_propagation_assessment.schema.json"
      - "fixtures/domains/people-dna-land/consent_revocation_propagation/**"
      - "tools/validators/domains/people-dna-land/validate_consent_revocation_propagation_assessment.py"
      - "tests/domains/people-dna-land/consent/revocation/test_consent_revocation_propagation_assessment.py"
      - "docs/intake/exploratory/full-atlas-consent-revocation-propagation-source-map.md"
      - "data/receipts/generated/genrec-full-atlas-consent-revocation-propagation-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/consent-revocation-propagation.yml"
      - "contracts/domains/people-dna-land/consent_revocation_propagation_assessment.md"
      - "schemas/contracts/v1/domains/people-dna-land/consent_revocation_propagation_assessment.schema.json"
      - "fixtures/domains/people-dna-land/consent_revocation_propagation/**"
      - "tools/validators/domains/people-dna-land/validate_consent_revocation_propagation_assessment.py"
      - "tests/domains/people-dna-land/consent/revocation/test_consent_revocation_propagation_assessment.py"
      - "docs/intake/exploratory/full-atlas-consent-revocation-propagation-source-map.md"
      - "data/receipts/generated/genrec-full-atlas-consent-revocation-propagation-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consent-revocation-propagation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
      - name: Run focused deterministic validation
        run: |
          set -euo pipefail
          python tests/domains/people-dna-land/consent/revocation/test_consent_revocation_propagation_assessment.py --verbose
          python tools/validators/domains/people-dna-land/validate_consent_revocation_propagation_assessment.py --fixtures
      - name: Validate generated authoring receipt
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-full-atlas-consent-revocation-propagation-20260811.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Consent revocation propagation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic current-status, seven-surface dependency coverage, receipt declarations, and fail-closed fixture polarity."
            echo "- Boundary: PASS does not issue consent, prove cleanup, resolve evidence, evaluate policy, release, or publish."
          } >> "$GITHUB_STEP_SUMMARY"

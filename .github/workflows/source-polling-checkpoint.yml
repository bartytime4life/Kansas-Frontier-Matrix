name: source-polling-checkpoint
"on":
  pull_request:
    paths: [".github/workflows/source-polling-checkpoint.yml","contracts/source/source_polling_checkpoint.md","schemas/contracts/v1/source/source_polling_checkpoint.schema.json","fixtures/contracts/v1/source/source_polling_checkpoint/**","tools/validators/source/validate_source_polling_checkpoint.py","tests/validators/test_validate_source_polling_checkpoint.py","docs/intake/exploratory/pass-32-source-polling-checkpoint-source-map.md","packages/hashing/**","data/receipts/generated/genrec-source-polling-checkpoint-*.json"]
  push:
    branches: [main]
    paths: [".github/workflows/source-polling-checkpoint.yml","contracts/source/source_polling_checkpoint.md","schemas/contracts/v1/source/source_polling_checkpoint.schema.json","fixtures/contracts/v1/source/source_polling_checkpoint/**","tools/validators/source/validate_source_polling_checkpoint.py","tests/validators/test_validate_source_polling_checkpoint.py","docs/intake/exploratory/pass-32-source-polling-checkpoint-source-map.md","packages/hashing/**","data/receipts/generated/genrec-source-polling-checkpoint-*.json"]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: "source-polling-checkpoint-${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true}
env: {KFM_NO_NETWORK: "1", PIP_DISABLE_PIP_VERSION_CHECK: "1", PIP_NO_INPUT: "1", PYTHONDONTWRITEBYTECODE: "1", PYTHONHASHSEED: "0", TZ: UTC}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: python tools/ci/install_python_ci.py project-test
      - run: |
          python -m py_compile tools/validators/source/validate_source_polling_checkpoint.py tests/validators/test_validate_source_polling_checkpoint.py
          python -m unittest tests.validators.test_validate_source_polling_checkpoint -v
          python tools/validators/source/validate_source_polling_checkpoint.py --fixtures
      - run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-source-polling-checkpoint-20260808.json --repo-root .
      - if: always()
        run: echo "Fixture-only conditional-validator state; no network request, fetch, RAW write, release, or publication." >> "$GITHUB_STEP_SUMMARY"

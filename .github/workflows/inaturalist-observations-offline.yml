name: inaturalist-observations-offline
on:
  pull_request:
    paths:
      - 'connectors/inaturalist/src/inaturalist/observations_api.py'
      - 'connectors/inaturalist/src/inaturalist/fetch.py'
      - 'connectors/inaturalist/src/inaturalist/admit.py'
      - 'connectors/inaturalist/src/inaturalist/descriptor.yaml'
      - 'connectors/inaturalist/tests/test_fetch_admit.py'
      - 'packages/connectors-core/src/connectors_core/**'
      - 'connectors/inaturalist/tests/test_observations_api.py'
      - '.github/workflows/inaturalist-observations-offline.yml'
  push:
    branches: [main]
    paths:
      - 'connectors/inaturalist/src/inaturalist/observations_api.py'
      - 'connectors/inaturalist/src/inaturalist/fetch.py'
      - 'connectors/inaturalist/src/inaturalist/admit.py'
      - 'connectors/inaturalist/src/inaturalist/descriptor.yaml'
      - 'connectors/inaturalist/tests/test_fetch_admit.py'
      - 'packages/connectors-core/src/connectors_core/**'
      - 'connectors/inaturalist/tests/test_observations_api.py'
      - '.github/workflows/inaturalist-observations-offline.yml'
permissions:
  contents: read
concurrency:
  group: inaturalist-observations-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KFM_NO_NETWORK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Run standard-library synthetic tests (connectors-core imported from source)
        run: |
          python -m unittest discover -s connectors/inaturalist/tests -p 'test_observations_api.py' -v
          python -m unittest discover -s connectors/inaturalist/tests -p 'test_fetch_admit.py' -v
      - name: Record evidence boundary
        if: always()
        run: |
          echo 'Offline synthetic iNaturalist observation cursor planner/parser checks only. No provider fetch, source activation, rights review, KFM sensitivity ranking, redaction, source admission, capture completeness, active Site integration, release, or deployment proof.' >> "$GITHUB_STEP_SUMMARY"

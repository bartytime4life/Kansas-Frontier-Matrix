# Validate one deterministic, synthetic-only STAC/DCAT/PROV release closure.
name: synthetic-release-catalog-closure

"on":
  pull_request:
    paths:
      - ".github/workflows/synthetic-release-catalog-closure.yml"
      - "contracts/data/synthetic_release_catalog_closure_profile.md"
      - "schemas/contracts/v1/data/synthetic_release_catalog_closure_profile.schema.json"
      - "fixtures/contracts/v1/data/synthetic_release_catalog_closure_profile/**"
      - "tools/validators/catalog_closure/validate_synthetic_release_catalog_closure.py"
      - "tests/validators/catalog_closure/test_synthetic_release_catalog_closure.py"
      - "contracts/data/catalog_matrix_closure_profile.md"
      - "contracts/data/catalog_distribution_mapping_profile.md"
      - "contracts/release/release_manifest.md"
      - "contracts/release/release_proof_pack_closure.md"
      - "tools/validators/validate_catalog_matrix_closure.py"
      - "tools/validators/catalog_closure/validate_catalog_distribution_mapping_profile.py"
      - "tools/validators/release/validate_release_manifest.py"
      - "tools/validators/release/validate_release_proof_pack_closure.py"
      - "packages/hashing/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/synthetic-release-catalog-closure.yml"
      - "contracts/data/synthetic_release_catalog_closure_profile.md"
      - "schemas/contracts/v1/data/synthetic_release_catalog_closure_profile.schema.json"
      - "fixtures/contracts/v1/data/synthetic_release_catalog_closure_profile/**"
      - "tools/validators/catalog_closure/validate_synthetic_release_catalog_closure.py"
      - "tests/validators/catalog_closure/test_synthetic_release_catalog_closure.py"
      - "contracts/data/catalog_matrix_closure_profile.md"
      - "contracts/data/catalog_distribution_mapping_profile.md"
      - "contracts/release/release_manifest.md"
      - "contracts/release/release_proof_pack_closure.md"
      - "tools/validators/validate_catalog_matrix_closure.py"
      - "tools/validators/catalog_closure/validate_catalog_distribution_mapping_profile.py"
      - "tools/validators/release/validate_release_manifest.py"
      - "tools/validators/release/validate_release_proof_pack_closure.py"
      - "packages/hashing/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-release-catalog-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-synthetic-release-catalog-closure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Run focused deterministic closure proof
        run: |
          python -m pytest -q tests/validators/catalog_closure/test_synthetic_release_catalog_closure.py
          python tools/validators/catalog_closure/validate_synthetic_release_catalog_closure.py --fixtures

      - name: Run adjacent catalog and release validation
        run: |
          python tools/validators/validate_catalog_matrix_closure.py --fixtures
          python tools/validators/catalog_closure/validate_catalog_distribution_mapping_profile.py --fixtures
          python tools/validators/release/validate_release_manifest.py --fixtures
          python tools/validators/release/validate_release_proof_pack_closure.py --fixtures
          python tools/validate_all.py --profile release-dry-run

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Synthetic release catalog closure"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: one deterministic, synthetic-only, no-network STAC/DCAT/PROV projection packet and withdrawal successor."
            echo "- Boundary: no live source, evidence resolution, policy decision, review approval, lifecycle write, promotion, release, serving, deployment, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

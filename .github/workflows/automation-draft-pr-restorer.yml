name: automation-draft-pr-restorer

"on":
  repository_dispatch:
    types:
      - automation-draft-restoration-v1
  workflow_dispatch:
    inputs:
      proposal_json:
        description: Exact AutomationDraftRestoration JSON object
        required: true
        type: string

# Trusted-base incident writer boundary:
# - repository_dispatch executes this workflow from the default branch;
# - no pull-request, target, push, schedule, workflow-run, or reusable caller can
#   invoke the writer;
# - the workflow never checks out or executes pull-request code;
# - the only write permission is pull-requests: write in one bounded job;
# - restoration is exact-event/head-bound and fallback closure is allowed only
#   while the same PR remains open, unmerged, non-draft, and marker-bound.
permissions:
  contents: read

concurrency:
  group: automation-draft-pr-restorer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  restore-or-contain:
    if: ${{ github.event.repository.default_branch == 'main' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: write

    steps:
      - name: Fetch trusted-base restoration validator
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TRUSTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          validator="${RUNNER_TEMP}/validate-automation-draft-restoration.py"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "/repos/${GITHUB_REPOSITORY}/contents/tools/validators/governance/validate_automation_draft_restoration.py?ref=${TRUSTED_SHA}" \
            > "${validator}"
          chmod 0555 "${validator}"

      - name: Materialize dispatch proposal without logging payload
        env:
          DISPATCH_PROPOSAL_JSON: ${{ toJson(github.event.client_payload.proposal) }}
          MANUAL_PROPOSAL_JSON: ${{ inputs.proposal_json }}
          TRIGGER_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          trigger = os.environ["TRIGGER_NAME"]
          if trigger == "repository_dispatch":
              raw = os.environ["DISPATCH_PROPOSAL_JSON"]
          elif trigger == "workflow_dispatch":
              raw = os.environ["MANUAL_PROPOSAL_JSON"]
          else:
              raise SystemExit("AUTOMATION_DRAFT_RESTORATION_TRIGGER_INVALID")
          payload = json.loads(raw)
          Path(os.environ["RUNNER_TEMP"], "draft-restoration-proposal.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Require structurally fetch-eligible proposal
        id: proposal
        shell: bash
        run: |
          set -euo pipefail
          validator="${RUNNER_TEMP}/validate-automation-draft-restoration.py"
          proposal="${RUNNER_TEMP}/draft-restoration-proposal.json"
          result="${RUNNER_TEMP}/draft-restoration-proposal-result.json"
          python3 "${validator}" "${proposal}" > "${result}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RUNNER_TEMP"], "draft-restoration-proposal-result.json").read_text(encoding="utf-8"))
          if result.get("outcome") != "PASS" or result.get("fetch_eligible") is not True:
              raise SystemExit("AUTOMATION_DRAFT_RESTORATION_PROPOSAL_DENIED")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"pr_number={result['pr_number']}\n")
          PY

      - name: Fetch live pull request and exact event evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.proposal.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > "${RUNNER_TEMP}/draft-restoration-live-pr.json"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
            > "${RUNNER_TEMP}/draft-restoration-events.json"

      - name: Bind the live ready event before mutation
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          validator="${RUNNER_TEMP}/validate-automation-draft-restoration.py"
          proposal="${RUNNER_TEMP}/draft-restoration-proposal.json"
          result="${RUNNER_TEMP}/draft-restoration-live-result.json"
          python3 "${validator}" "${proposal}" \
            --live-pr "${RUNNER_TEMP}/draft-restoration-live-pr.json" \
            --events "${RUNNER_TEMP}/draft-restoration-events.json" \
            > "${result}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RUNNER_TEMP"], "draft-restoration-live-result.json").read_text(encoding="utf-8"))
          outcome = result.get("outcome")
          eligible = outcome == "PASS" and result.get("write_eligible") is True
          if outcome not in {"PASS", "NO_ACTION"}:
              raise SystemExit("AUTOMATION_DRAFT_RESTORATION_LIVE_BINDING_DENIED")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"write_eligible={'true' if eligible else 'false'}\n")
              handle.write(f"reason_code={result.get('reason_codes', ['UNKNOWN'])[0]}\n")
          PY

      - name: Recheck exact binding immediately before mutation
        if: ${{ steps.binding.outputs.write_eligible == 'true' }}
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.proposal.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          validator="${RUNNER_TEMP}/validate-automation-draft-restoration.py"
          proposal="${RUNNER_TEMP}/draft-restoration-proposal.json"
          gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > "${RUNNER_TEMP}/draft-restoration-live-pr-recheck.json"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
            > "${RUNNER_TEMP}/draft-restoration-events-recheck.json"
          python3 "${validator}" "${proposal}" \
            --live-pr "${RUNNER_TEMP}/draft-restoration-live-pr-recheck.json" \
            --events "${RUNNER_TEMP}/draft-restoration-events-recheck.json" \
            > "${RUNNER_TEMP}/draft-restoration-recheck-result.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RUNNER_TEMP"], "draft-restoration-recheck-result.json").read_text(encoding="utf-8"))
          if result.get("outcome") != "PASS" or result.get("write_eligible") is not True:
              raise SystemExit("AUTOMATION_DRAFT_RESTORATION_RECHECK_DENIED")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"pr_node_id={result['pr_node_id']}\n")
              handle.write(f"expected_base_sha={result['expected_base_sha']}\n")
              handle.write(f"expected_head_sha={result['expected_head_sha']}\n")
          PY

      - name: Restore draft or close the exact PR unmerged
        if: ${{ steps.binding.outputs.write_eligible == 'true' }}
        id: mutation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.proposal.outputs.pr_number }}
          PR_NODE_ID: ${{ steps.recheck.outputs.pr_node_id }}
        shell: bash
        run: |
          set -euo pipefail
          validator="${RUNNER_TEMP}/validate-automation-draft-restoration.py"
          proposal="${RUNNER_TEMP}/draft-restoration-proposal.json"
          query='mutation($pullRequestId: ID!) { convertPullRequestToDraft(input: {pullRequestId: $pullRequestId}) { pullRequest { number isDraft state } } }'

          set +e
          gh api graphql -f query="${query}" -F pullRequestId="${PR_NODE_ID}" \
            > "${RUNNER_TEMP}/draft-restoration-graphql-result.json" 2>/dev/null
          restore_status=$?
          set -e

          gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > "${RUNNER_TEMP}/draft-restoration-live-pr-after.json"
          if python3 "${validator}" "${proposal}" \
            --live-pr "${RUNNER_TEMP}/draft-restoration-live-pr-after.json" \
            --verify-state draft \
            > "${RUNNER_TEMP}/draft-restoration-post-draft-result.json"; then
            echo "restored=true" >> "${GITHUB_OUTPUT}"
            echo "contained=false" >> "${GITHUB_OUTPUT}"
            echo "AUTOMATION_DRAFT_RESTORATION_VERIFIED"
            exit 0
          fi

          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
            > "${RUNNER_TEMP}/draft-restoration-events-after.json"
          if ! python3 "${validator}" "${proposal}" \
            --live-pr "${RUNNER_TEMP}/draft-restoration-live-pr-after.json" \
            --events "${RUNNER_TEMP}/draft-restoration-events-after.json" \
            > "${RUNNER_TEMP}/draft-restoration-fallback-binding.json"; then
            echo "::error::AUTOMATION_DRAFT_RESTORATION_STATE_CHANGED; no fallback mutation performed"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RUNNER_TEMP"], "draft-restoration-fallback-binding.json").read_text(encoding="utf-8"))
          if result.get("outcome") != "PASS" or result.get("write_eligible") is not True:
              raise SystemExit("AUTOMATION_DRAFT_RESTORATION_FALLBACK_NOT_ELIGIBLE")
          PY

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            -f state=closed \
            > "${RUNNER_TEMP}/draft-restoration-live-pr-closed.json"
          python3 "${validator}" "${proposal}" \
            --live-pr "${RUNNER_TEMP}/draft-restoration-live-pr-closed.json" \
            --verify-state closed \
            > "${RUNNER_TEMP}/draft-restoration-post-close-result.json"
          echo "restored=false" >> "${GITHUB_OUTPUT}"
          echo "contained=true" >> "${GITHUB_OUTPUT}"
          echo "::error::AUTOMATION_DRAFT_RESTORATION_FAILED_CLOSED_UNMERGED; graphql_status=${restore_status}"
          exit 1

      - name: Record bounded restoration result
        if: always()
        shell: bash
        run: |
          {
            echo "### Automation draft PR restoration"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Preflight reason: ${{ steps.binding.outputs.reason_code || 'not-reached' }}."
            echo "- Draft restoration verified: ${{ steps.mutation.outputs.restored || 'false' }}."
            echo "- Fallback close verified: ${{ steps.mutation.outputs.contained || 'false' }}."
            echo "- Candidate branch/head bytes were never checked out, executed, deleted, force-pushed, or rewritten."
            echo "- Authority ceiling: one exact draft restoration attempt or exact open-unmerged fallback close; no ready, approval, merge, release, deployment, publication, source, or settings authority."
          } >> "${GITHUB_STEP_SUMMARY}"

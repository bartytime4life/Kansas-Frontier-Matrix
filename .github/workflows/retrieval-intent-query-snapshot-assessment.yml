# Validate the fixture-only retrieval intent/query snapshot assessment.
name: retrieval-intent-query-snapshot-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/retrieval-intent-query-snapshot-assessment.yml"
      - "contracts/source/retrieval_intent_query_snapshot_assessment.md"
      - "schemas/contracts/v1/source/retrieval_intent_query_snapshot_assessment.schema.json"
      - "fixtures/contracts/v1/source/retrieval_intent_query_snapshot_assessment/**"
      - "tools/validators/source/validate_retrieval_intent_query_snapshot_assessment.py"
      - "tests/source/test_retrieval_intent_query_snapshot_assessment.py"
      - "docs/intake/exploratory/full-atlas-retrieval-intent-query-snapshot-source-map.md"
      - "contracts/source/occurrence_retrieval_snapshot.md"
      - "contracts/source/source_artifact.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-full-atlas-retrieval-intent-query-snapshot-20260811.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrieval-intent-query-snapshot-assessment.yml"
      - "contracts/source/retrieval_intent_query_snapshot_assessment.md"
      - "schemas/contracts/v1/source/retrieval_intent_query_snapshot_assessment.schema.json"
      - "fixtures/contracts/v1/source/retrieval_intent_query_snapshot_assessment/**"
      - "tools/validators/source/validate_retrieval_intent_query_snapshot_assessment.py"
      - "tests/source/test_retrieval_intent_query_snapshot_assessment.py"
      - "docs/intake/exploratory/full-atlas-retrieval-intent-query-snapshot-source-map.md"
      - "contracts/source/occurrence_retrieval_snapshot.md"
      - "contracts/source/source_artifact.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-full-atlas-retrieval-intent-query-snapshot-20260811.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-intent-query-snapshot-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-retrieval-intent-query-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused and adjacent deterministic tests
        run: |
          python -m pytest -q -p no:cacheprovider tests/source/test_retrieval_intent_query_snapshot_assessment.py
          python -m pytest -q -p no:cacheprovider tests/validators/test_validate_occurrence_retrieval_snapshot.py
          python tools/validators/source/validate_retrieval_intent_query_snapshot_assessment.py --fixtures
      - name: Validate generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-full-atlas-retrieval-intent-query-snapshot-20260811.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### RetrievalIntentQuerySnapshotAssessmentCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only declared-versus-executed query reconciliation and pagination closure."
            echo "- Boundary: no network, secrets, source admission, response authentication, completeness proof, evidence, lifecycle, policy, release, publication, or public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

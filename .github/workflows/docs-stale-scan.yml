# Run bounded documentation freshness QA. A green result is a review signal only;
# it is not truth, evidence, policy, human review, release, or publication.
name: docs-stale-scan

"on":
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - ".github/workflows/docs-stale-scan.yml"
      - "tools/validators/docs/stale-scan/**"
      - "tests/validators/docs/stale-scan/**"
      - "data/receipts/generated/genrec-docs-stale-scan-*.json"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - ".github/workflows/docs-stale-scan.yml"
      - "tools/validators/docs/stale-scan/**"
      - "tests/validators/docs/stale-scan/**"
      - "data/receipts/generated/genrec-docs-stale-scan-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-stale-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-docs-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out documentation QA boundaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic no-network freshness tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/docs/stale-scan \
            --pattern 'test_*.py' \
            --verbose

      - name: Build changed-file freshness workbench
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi

          as_of="$(date -u +%F)"
          python tools/validators/docs/stale-scan/check_stale_docs.py \
            --repo-root . \
            --as-of "$as_of" \
            --profile advisory \
            --review-window-days 365 \
            --placeholder-grace-days 90 \
            --git-diff "${base_sha}...HEAD" \
            --format markdown \
            --output "$RUNNER_TEMP/docs-stale-scan.md" \
            README.md docs tools/validators/docs

          cat "$RUNNER_TEMP/docs-stale-scan.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-docs-stale-scan-20260807.json \
            --repo-root .

      - name: Record freshness trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Documentation freshness trust boundary"
            echo "- Scope: explicit-as-of review age, placeholder-owner age, temporary markers, verification debt, and implementation-claim review signals."
            echo "- Profile: advisory; warnings are not promoted to failures by default."
            echo "- Ratchet: changed-path findings remain current; inherited warnings are omitted and inherited failures are historical warnings."
            echo "- Network: validator and focused tests make no external request."
            echo "- Non-effects: no documentation edit, owner assignment, registry mutation, doctrine decision, policy approval, review record, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

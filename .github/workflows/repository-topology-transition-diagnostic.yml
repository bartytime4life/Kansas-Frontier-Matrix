# Temporary exact-head validation for the bounded repository-topology repair.
# It must be removed before review handoff.
name: repository-topology-transition-diagnostic

"on":
  push:
    branches:
      - fix/repository-topology-convergence-20260902

permissions:
  contents: read

env:
  CI: "true"
  COREPACK_ENABLE_STRICT: "1"
  NODE_VERSION: "22"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run focused topology regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/directory_governance \
            --pattern 'test_validate_*topology.py' \
            --verbose 2>&1 | tee /tmp/repository_topology_unit_tests.log

      - name: Verify the exact remaining topology hold
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/directory_governance/validate_repository_topology.py \
            --emit-baseline > /tmp/repository_topology_baseline_candidate.json
          set +e
          python tools/validators/directory_governance/validate_repository_topology.py \
            --trusted-baseline-ref df45bbaea90c210ec485dd85562a314ed0c9ccf4 \
            --format json > /tmp/repository_topology_exact_head_report.json
          validator_status=$?
          set -e
          echo "VALIDATOR_STATUS=${validator_status}"
          test "${validator_status}" -eq 1
          python - <<'PY'
          import base64
          import json
          import zlib
          from pathlib import Path

          baseline = json.loads(
              Path(
                  "tools/validators/directory_governance/repository_topology_baseline.json"
              ).read_text(encoding="utf-8")
          )
          candidate = json.loads(
              Path("/tmp/repository_topology_baseline_candidate.json").read_text(
                  encoding="utf-8"
              )
          )
          report = json.loads(
              Path("/tmp/repository_topology_exact_head_report.json").read_text(
                  encoding="utf-8"
              )
          )

          def index(payload):
              return {
                  (entry["rule_id"], entry["subject"]): entry
                  for entry in payload["entries"]
              }

          def members(entry):
              decoded = zlib.decompress(
                  base64.b64decode(entry["evidence_zlib_base64"])
              ).decode("utf-8")
              return set() if decoded == "" else set(decoded.split("\0"))

          old = index(baseline)
          new = index(candidate)
          changed = {
              identity
              for identity in old.keys() & new.keys()
              if old[identity]["fingerprint"] != new[identity]["fingerprint"]
          }
          assert changed == {("KFM-TOPO-004", "catalog/")}, changed
          assert not (set(old) - set(new)), set(old) - set(new)
          assert not (set(new) - set(old)), set(new) - set(old)
          before = members(old[("KFM-TOPO-004", "catalog/")])
          after = members(new[("KFM-TOPO-004", "catalog/")])
          assert before - after == {
              "catalog/domain/agriculture/README.md@bf1a333573c6d068fbb0b695356346003842aceb"
          }
          assert after - before == {
              "catalog/domain/agriculture/README.md@4be1711bfa011636ac1c5cd13e7c98e5002ff9c0"
          }
          assert report["outcome"] == "FAIL_INVARIANT", report["outcome"]
          assert report["counts"] == {
              "baselined_warning": 126,
              "fail_invariant": 0,
              "fail_new_drift": 1,
              "finding": 127,
          }, report["counts"]
          assert report["baseline"]["applicable_count"] == 127
          assert report["baseline"]["stale_fingerprints"] == [
              "sha256:521388927153c91a67ca8cead55af9d688a6064517d109aa556cffca91505006"
          ]
          introduced = [
              finding
              for finding in report["findings"]
              if finding["disposition"] == "FAIL_NEW_DRIFT"
          ]
          assert introduced == [
              {
                  "disposition": "FAIL_NEW_DRIFT",
                  "evidence_sha256": "sha256:2ee2ee5e1bb3e87b8b796a81c29729ceb0822e16427246f92e2d40072726ddbc",
                  "fingerprint": "sha256:0ad45247555960029c34d1222365cbe17a5cabec278bf9f6b8f3e9572ea33e8f",
                  "rule_id": "KFM-TOPO-004",
                  "subject": "catalog/",
              }
          ], introduced
          print(
              "CONFIRMED: exact head has no uppercase-path growth, has accepted "
              "strict shrinkage for KFM-TOPO-009 and KFM-TOPO-016, and retains "
              "only the frozen catalog README replacement as an explicit hold."
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install locked workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Explorer Web unit tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter explorer-web test:unit 2>&1 | tee /tmp/explorer_web_unit_tests.log

      - name: Build Explorer Web
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter explorer-web build 2>&1 | tee /tmp/explorer_web_build.log

      - name: Verify the portable adapter path and clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/explorer-web/src/adapters/map-runtime-evidence-adapter.ts
          test ! -e apps/explorer-web/src/adapters/MapRuntimeEvidenceAdapter.ts
          if git grep -n 'MapRuntimeEvidenceAdapter'; then
            echo "legacy uppercase adapter reference remains" >&2
            exit 1
          fi
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload exact-head validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-topology-exact-head-validation
          path: |
            /tmp/repository_topology_baseline_candidate.json
            /tmp/repository_topology_exact_head_report.json
            /tmp/repository_topology_unit_tests.log
            /tmp/explorer_web_unit_tests.log
            /tmp/explorer_web_build.log
          if-no-files-found: error
          retention-days: 1

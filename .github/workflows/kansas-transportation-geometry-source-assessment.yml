name: kansas-transportation-geometry-source-assessment

"on":
  pull_request:
    paths:
      - ".github/workflows/kansas-transportation-geometry-source-assessment.yml"
      - "contracts/source/kansas_transportation_geometry_source_assessment.md"
      - "schemas/contracts/v1/source/kansas_transportation_geometry_source_assessment.schema.json"
      - "fixtures/contracts/v1/source/kansas_transportation_geometry_source_assessment/**"
      - "tools/validators/source/validate_kansas_transportation_geometry_source_assessment.py"
      - "tests/source/test_kansas_transportation_geometry_source_assessment.py"
      - "data/receipts/generated/genrec-kansas-transportation-geometry-source-assessment-20260815.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/kansas-transportation-geometry-source-assessment.yml"
      - "contracts/source/kansas_transportation_geometry_source_assessment.md"
      - "schemas/contracts/v1/source/kansas_transportation_geometry_source_assessment.schema.json"
      - "fixtures/contracts/v1/source/kansas_transportation_geometry_source_assessment/**"
      - "tools/validators/source/validate_kansas_transportation_geometry_source_assessment.py"
      - "tests/source/test_kansas_transportation_geometry_source_assessment.py"
      - "data/receipts/generated/genrec-kansas-transportation-geometry-source-assessment-20260815.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kansas-transportation-geometry-source-assessment-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Compile focused validator and tests
        run: |
          python -m py_compile \
            tools/validators/source/validate_kansas_transportation_geometry_source_assessment.py \
            tests/source/test_kansas_transportation_geometry_source_assessment.py
      - name: Run focused tests
        run: python -m pytest -q tests/source/test_kansas_transportation_geometry_source_assessment.py
      - name: Run exact synthetic case polarity
        run: python tools/validators/source/validate_kansas_transportation_geometry_source_assessment.py --cases
      - name: Verify generated authoring receipt integrity
        run: |
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-kansas-transportation-geometry-source-assessment-20260815.json \
            --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Kansas transportation geometry source assessment"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: deterministic four-lane endpoint, role, CRS, pagination, identifier, rights, sensitivity, and crosswalk fixture assessment."
            echo "- Boundary: no live endpoint, payload, credential, SourceDescriptor admission, connector, schedule, lifecycle write, canonical road/crosswalk decision, release, deployment, publication, or public-use authorization."
          } >> "$GITHUB_STEP_SUMMARY"

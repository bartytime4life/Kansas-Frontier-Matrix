# Validate the fixture-only PM2.5 sensor co-location manifest candidate.
# This workflow performs no live source access, scientific approval, promotion, release, publication, or health action.
name: pm25-sensor-colocation-manifest

"on":
  pull_request:
    paths:
      - ".github/workflows/domain-atmosphere.yml"
      - ".github/workflows/pm25-sensor-colocation-manifest.yml"
      - "contracts/domains/atmosphere/pm25_sensor_colocation_manifest.md"
      - "schemas/contracts/v1/domains/atmosphere/pm25_sensor_colocation_manifest.schema.json"
      - "fixtures/contracts/v1/domains/atmosphere/pm25_sensor_colocation_manifest/**"
      - "tools/validators/domains/atmosphere/validate_pm25_sensor_colocation_manifest.py"
      - "tests/validators/domains/atmosphere/test_pm25_sensor_colocation_manifest.py"
      - "docs/intake/exploratory/pass-30-pm25-sensor-colocation-manifest-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-pm25-sensor-colocation-manifest-20260809.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/domain-atmosphere.yml"
      - ".github/workflows/pm25-sensor-colocation-manifest.yml"
      - "contracts/domains/atmosphere/pm25_sensor_colocation_manifest.md"
      - "schemas/contracts/v1/domains/atmosphere/pm25_sensor_colocation_manifest.schema.json"
      - "fixtures/contracts/v1/domains/atmosphere/pm25_sensor_colocation_manifest/**"
      - "tools/validators/domains/atmosphere/validate_pm25_sensor_colocation_manifest.py"
      - "tests/validators/domains/atmosphere/test_pm25_sensor_colocation_manifest.py"
      - "docs/intake/exploratory/pass-30-pm25-sensor-colocation-manifest-source-map.md"
      - "packages/hashing/**"
      - "pyproject.toml"
      - "data/receipts/generated/genrec-pass30-pm25-sensor-colocation-manifest-20260809.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm25-sensor-colocation-manifest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-pm25-sensor-colocation-manifest:
    name: validate-pm25-sensor-colocation-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover \
            --start-directory tests/validators/domains/atmosphere \
            --pattern 'test_pm25_sensor_colocation_manifest.py' \
            --verbose

      - name: Replay exact fixture polarity
        run: python tools/validators/domains/atmosphere/validate_pm25_sensor_colocation_manifest.py --fixtures

      - name: Validate generated authoring receipt integrity
        run: python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-pass30-pm25-sensor-colocation-manifest-20260809.json

      - name: Record authority boundary
        if: always()
        run: |
          {
            echo "### PM2.5SensorColocationManifestCandidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic manifest shape, arithmetic, split consistency, evidence closure, and deterministic identity."
            echo "- No live data, scientific validity, reference equivalence, source admission, policy, review, promotion, release, publication, or health authority is exercised."
          } >> "$GITHUB_STEP_SUMMARY"

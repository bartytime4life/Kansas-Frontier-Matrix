# Validate the fixture-only Fauna-Habitat public-safe assignment candidate profile.
name: fauna-habitat-public-safe-assignment

"on":
  pull_request:
    paths:
      - ".github/workflows/fauna-habitat-public-safe-assignment.yml"
      - "contracts/cross_domain/fauna_habitat/**"
      - "fixtures/contracts/v1/joins/fauna_habitat_public_safe_assignment/**"
      - "tests/cross_domain/fauna_habitat/**"
      - "tools/validators/cross_domain/fauna_habitat/**"
      - "data/receipts/generated/genrec-fauna-habitat-public-safe-assignment-*.json"
      - "contracts/joins/cross_lane_join_assessment.md"
      - "schemas/contracts/v1/joins/cross_lane_join_assessment.schema.json"
      - "tools/joins/join_candidates.py"
      - "fixtures/contracts/v1/joins/cross_lane_join_assessment/**"
      - "tests/joins/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fauna-habitat-public-safe-assignment.yml"
      - "contracts/cross_domain/fauna_habitat/**"
      - "fixtures/contracts/v1/joins/fauna_habitat_public_safe_assignment/**"
      - "tests/cross_domain/fauna_habitat/**"
      - "tools/validators/cross_domain/fauna_habitat/**"
      - "data/receipts/generated/genrec-fauna-habitat-public-safe-assignment-*.json"
      - "contracts/joins/cross_lane_join_assessment.md"
      - "schemas/contracts/v1/joins/cross_lane_join_assessment.schema.json"
      - "tools/joins/join_candidates.py"
      - "fixtures/contracts/v1/joins/cross_lane_join_assessment/**"
      - "tests/joins/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fauna-habitat-public-safe-assignment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-fauna-habitat-public-safe-assignment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test
      - name: Run generic cross-lane fixture matrix
        run: python tools/joins/join_candidates.py --fixtures
      - name: Run Fauna-Habitat pair fixture matrix
        run: python tools/validators/cross_domain/fauna_habitat/validate_public_safe_assignment.py --fixtures
      - name: Run focused regression tests
        run: >-
          python -m pytest
          tests/joins/test_join_candidates.py
          tests/cross_domain/fauna_habitat/test_public_safe_assignment.py
          -q --strict-config --strict-markers
      - name: Validate generated authoring receipt
        run: >-
          python tools/validators/validate_generated_receipt.py
          data/receipts/generated/genrec-fauna-habitat-public-safe-assignment-20260814.json
          --repo-root .
      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Fauna-Habitat public-safe assignment candidate profile"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: synthetic references and metadata only; no coordinate or geometry bytes, live source, network, or lifecycle write."
            echo "- Boundary: ALLOW remains a reviewable CANDIDATE_RELATION; no evidence, policy, review, release, publication, or public-use authority is created."
          } >> "$GITHUB_STEP_SUMMARY"

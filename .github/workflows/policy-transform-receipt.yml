# Validate fixture-only policy transform receipt candidates.
name: policy-transform-receipt

"on":
  pull_request:
    paths:
      - ".github/workflows/policy-transform-receipt.yml"
      - "contracts/receipts/policy_transform_receipt.md"
      - "schemas/contracts/v1/receipts/policy_transform_receipt.schema.json"
      - "fixtures/contracts/v1/receipts/policy_transform_receipt/**"
      - "fixtures/contracts/v1/policy/policy_transform_plan_simulation/valid/**"
      - "tools/validators/validate_policy_transform_receipt.py"
      - "tools/validators/policy/validate_policy_transform_plan_simulation.py"
      - "tests/validators/test_validate_policy_transform_receipt.py"
      - "tests/validators/test_validate_policy_transform_plan_simulation.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-policy-transform-receipt-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/policy-transform-receipt.yml"
      - "contracts/receipts/policy_transform_receipt.md"
      - "schemas/contracts/v1/receipts/policy_transform_receipt.schema.json"
      - "fixtures/contracts/v1/receipts/policy_transform_receipt/**"
      - "fixtures/contracts/v1/policy/policy_transform_plan_simulation/valid/**"
      - "tools/validators/validate_policy_transform_receipt.py"
      - "tools/validators/policy/validate_policy_transform_plan_simulation.py"
      - "tests/validators/test_validate_policy_transform_receipt.py"
      - "tests/validators/test_validate_policy_transform_plan_simulation.py"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-policy-transform-receipt-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-transform-receipt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-policy-transform-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared schema and test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test

      - name: Revalidate upstream transform-plan simulation
        run: |
          set -euo pipefail
          python -m unittest discover             --start-directory tests/validators             --pattern 'test_validate_policy_transform_plan_simulation.py'             --verbose
          python tools/validators/policy/validate_policy_transform_plan_simulation.py --fixtures

      - name: Run focused deterministic no-network receipt tests
        run: |
          set -euo pipefail
          python -m unittest discover             --start-directory tests/validators             --pattern 'test_validate_policy_transform_receipt.py'             --verbose
          python tools/validators/validate_policy_transform_receipt.py --fixtures

      - name: Verify repository-wide schema fixture naming boundary
        run: |
          set -euo pipefail
          python -m pytest tests/schemas/test_common_contracts.py -q -k policy_transform_receipt

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py             data/receipts/generated/genrec-policy-transform-receipt-20260806.json             --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Policy transform receipt candidate"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: satisfying source-simulation binding, deterministic operation declarations and hashes, obligation closure, snapshot/rollback declarations, receipt identity, fixture polarity, and authoring-receipt integrity."
            echo "- Boundary: a green result does not execute or verify transforms, inspect runtime bytes, re-evaluate policy, verify signatures, complete review, mutate lifecycle data, authorize release, publish, or permit public use."
          } >> "$GITHUB_STEP_SUMMARY"

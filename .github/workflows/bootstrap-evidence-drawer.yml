# Temporary branch-only assembler for the connector-delivered implementation bundle.
# The job verifies the staged archive, expands and validates the final repository
# paths, and commits only non-workflow implementation bytes to the named task
# branch. Workflow-file installation and bootstrap cleanup are performed through
# the authenticated connector after this run. It grants no release authority.
name: bootstrap-evidence-drawer

"on":
  push:
    branches:
      - agent/evidence-drawer-history-contract-20260805
    paths:
      - ".github/kfm-bootstrap/**"
      - ".github/workflows/bootstrap-evidence-drawer.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-evidence-drawer-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/evidence-drawer-history-contract-20260805
          fetch-depth: 0

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify and expand the staged bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/kfm-bootstrap -maxdepth 1 -name 'evidence-drawer-part*.b64' | wc -l)" -eq 5
          cat .github/kfm-bootstrap/evidence-drawer-part*.b64 | base64 --decode > /tmp/evidence-drawer.tar.xz
          echo "9a67dfad0bd8adfc87c0e59be496b185ba53155356aabe3f4d252ec1ff693eea  /tmp/evidence-drawer.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/evidence-drawer.tar.xz
          rm -rf tests/fixtures/ui/evidence_drawer

      - name: Install declared test dependencies
        shell: bash
        run: python -m pip install -e ".[test]"

      - name: Run focused validation before committing
        shell: bash
        run: |
          set -euo pipefail
          python tools/validators/ui/validate_evidence_drawer_payload.py --fixtures
          python -m unittest -q tests.validators.test_validate_evidence_drawer_payload
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-evidence-drawer-payload-20260805.json \
            --repo-root .

      - name: Commit the assembled non-workflow implementation
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's workflow token cannot create or replace workflow definitions.
          # The connector installs this already-validated file after the push.
          rm -f .github/workflows/evidence-drawer-payload.yml
          git config user.name "kfm-implementation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No assembled change found" >&2; exit 1; }
          git commit -m "feat(ui): close Evidence Drawer history projection"
          git push origin HEAD:agent/evidence-drawer-history-contract-20260805

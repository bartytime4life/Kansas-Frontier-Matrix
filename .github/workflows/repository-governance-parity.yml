# Validate MRTS-04 composition and inherited-versus-introduced classification.
# A green result proves profile integrity only. The job summary keeps the
# repository conformance result explicit and cannot waive topology drift.
name: repository-governance-parity

"on":
  pull_request:
    paths:
      - ".github/workflows/repository-governance-parity.yml"
      - "Makefile"
      - "apps/governed-api/tests/test_boundary_guards.py"
      - "contracts/governance/repository_governance_parity.md"
      - "control_plane/contradiction_register.yaml"
      - "control_plane/deprecation_register.yaml"
      - "control_plane/document_registry.yaml"
      - "control_plane/object_family_register.yaml"
      - "control_plane/path_alias_register.yaml"
      - "control_plane/policy_gate_register.yaml"
      - "control_plane/release_state_register.yaml"
      - "control_plane/repository_governance_parity.yaml"
      - "control_plane/root_registry.yaml"
      - "control_plane/source_authority_register.yaml"
      - "control_plane/verification_backlog.yaml"
      - "schemas/contracts/v1/governance/repository_governance_parity.schema.json"
      - "fixtures/contracts/v1/governance/repository_governance_parity/**"
      - "tests/policy/test_control_plane_register_meta_contract.py"
      - "tests/policy/test_explorer_web_adapter_boundary.py"
      - "tests/policy/test_pipeline_connector_non_publisher.py"
      - "tests/validators/directory_governance/test_validate_repository_governance_parity.py"
      - "tools/validators/control_plane/**"
      - "tools/validators/directory_governance/**"
      - "tools/validators/validator_registry.json"
      - "data/receipts/generated/genrec-repository-governance-parity-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-governance-parity.yml"
      - "Makefile"
      - "contracts/governance/repository_governance_parity.md"
      - "control_plane/**"
      - "schemas/contracts/v1/governance/repository_governance_parity.schema.json"
      - "fixtures/contracts/v1/governance/repository_governance_parity/**"
      - "tests/validators/directory_governance/test_validate_repository_governance_parity.py"
      - "tools/validators/control_plane/**"
      - "tools/validators/directory_governance/**"
      - "tools/validators/validator_registry.json"
      - "data/receipts/generated/genrec-repository-governance-parity-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-governance-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate-repository-governance-parity:
    name: validate-repository-governance-parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validation dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Run deterministic MRTS-04 parity profile
        env:
          KFM_TRUSTED_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: make repository-governance-parity

      - name: Record non-authority and inherited-hold boundary
        if: always()
        run: |
          {
            echo "### MRTS-04 repository governance parity"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Green scope: exact profile structure, lane execution, accepted rule ownership, pinned evidence, baseline monotonicity, and introduced-drift classification."
            echo "- Repository conformance: HOLD_INHERITED while any reviewed baseline warnings remain; a green profile does not waive or resolve inherited topology debt."
            echo "- Boundary: no ADR acceptance, baseline expansion, drift waiver, migration, deletion, authority, policy/review approval, release, deployment, promotion, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

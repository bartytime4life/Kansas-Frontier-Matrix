name: temporary-repository-control-content-length-validation

"on":
  push:
    branches:
      - fix/repository-control-content-length-completeness-20260903

permissions:
  contents: read

concurrency:
  group: temporary-repository-control-content-length-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  focused-content-length-proof:
    name: focused-content-length-proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared validator dependencies
        shell: bash
        run: python tools/ci/install_python_ci.py project-runtime

      - name: Compile changed helper and regression
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/validators/repository_control/fetch_bounded_issue_comments.py \
            tests/validators/test_repository_control_content_length.py

      - name: Run focused repository-control regression surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            tests/validators/test_repository_control_content_length.py \
            tests/validators/test_repository_control_input_bounds.py \
            tests/validators/test_repository_control_strict_input.py \
            tests/validators/test_repository_control_source.py \
            tests/validators/test_repository_transition_authorization.py \
            -q --strict-config --strict-markers

      - name: Prove exact two-path permanent scope
        shell: bash
        env:
          KFM_BASE_SHA: 7c5d4125c277536258be6345e366efae59dbe5d6
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git diff --name-only "${KFM_BASE_SHA}"...HEAD \
              | grep -v '^.github/workflows/tmp-repository-control-content-length-validation.yml$' \
              | sort
          )
          expected=(
            tests/validators/test_repository_control_content_length.py
            tools/validators/repository_control/fetch_bounded_issue_comments.py
          )
          [[ "${#changed[@]}" -eq "${#expected[@]}" ]]
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
          git diff --check "${KFM_BASE_SHA}"...HEAD

      - name: Record proof boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Temporary content-length completeness validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Candidate base: \`7c5d4125c277536258be6345e366efae59dbe5d6\`."
            echo "- Permanent scope: one trusted-base capture helper and one direct regression file."
            echo "- This run proves only syntax, focused no-network behavior, and exact permanent path scope for the tested head."
            echo "- It does not authorize readiness, merge, settings mutation, source activation, release, deployment, promotion, or publication."
            echo "- The temporary workflow must be removed before any handoff."
          } >> "$GITHUB_STEP_SUMMARY"

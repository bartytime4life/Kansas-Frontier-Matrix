# KFM bounded evidence-resolver candidate checks.
#
# Responsibility: execute the internal v1alpha1 candidate profile over
# synthetic fixtures. A green job proves only those local checks. It does not
# resolve a live registry record, establish evidence truth or claim scope,
# evaluate policy, approve review/release, emit a public ANSWER, or publish.
#
# Security: pull-request code runs with contents:read, no secrets, no write
# permission, no package installation, and no network-dependent test command.
# Compatibility: workflow name, triggers, and job IDs are preserved from the
# prior readiness audit. Revert this file and the bounded implementation slice
# to restore the prior hold.
name: evidence-resolver

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-resolver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC
  KFM_NO_NETWORK: "1"

jobs:
  resolve-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out bounded candidate inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run bounded candidate profile
        run: make evidence-resolver

      - name: Record bounded authority
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Evidence resolver candidate profile

          This job executes the internal
          `kfm/evidence-ref-bundle-candidate/v1alpha1` profile over synthetic
          fixtures. `RESOLVED` is a non-authoritative candidate result only.

          No registry was queried, no evidence or policy was created, no claim
          scope was inferred, and no review, release, public response, or
          publication action occurred.
          EOF

  denied-bundles-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out bounded negative inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run fail-closed negative profile
        run: make evidence-resolver-deny

      - name: Record negative-boundary result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Evidence resolver negative boundary

          This job requires every synthetic negative fixture to remain
          non-`RESOLVED` with its exact expected status and issue codes. A green
          result is bounded rejection evidence, not evidence closure or release
          authority.
          EOF

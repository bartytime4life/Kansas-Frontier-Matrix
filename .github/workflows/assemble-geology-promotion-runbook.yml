name: assemble-geology-promotion-runbook

on:
  push:
    branches:
      - agent/tmp-assemble-geology-promotion-20260825
    paths:
      - .github/workflows/assemble-geology-promotion-runbook.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Assemble and verify exact runbook bytes
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/geology-promotion/PROMOTION_RUNBOOK.md.gz.b64.part01 \
              .tmp/geology-promotion/PROMOTION_RUNBOOK.md.gz.b64.part02 \
            | base64 --decode > /tmp/PROMOTION_RUNBOOK.md.gz
          gzip -dc /tmp/PROMOTION_RUNBOOK.md.gz \
            > docs/runbooks/geology/PROMOTION_RUNBOOK.md
          echo "06ab43b55d0d0ddbbd026c7de1b728cb07f06f325ca9a4ec469d2513f87363f0  docs/runbooks/geology/PROMOTION_RUNBOOK.md" \
            | sha256sum --check --strict
          test "$(git hash-object docs/runbooks/geology/PROMOTION_RUNBOOK.md)" = \
            "0a737fd92e9be17ffc8d1dfff749356f3b22ba29"

      - name: Commit assembled target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runbooks/geology/PROMOTION_RUNBOOK.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(geology): assemble promotion runbook payload"
          git push origin "HEAD:${GITHUB_REF_NAME}"

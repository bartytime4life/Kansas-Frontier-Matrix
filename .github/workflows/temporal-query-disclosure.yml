# Validate the proposed fixture-only TemporalQueryDisclosure profile.
name: temporal-query-disclosure

"on":
  pull_request:
    paths:
      - ".github/workflows/temporal-query-disclosure.yml"
      - "contracts/governance/temporal_query_disclosure.md"
      - "schemas/contracts/v1/governance/temporal_query_disclosure.schema.json"
      - "schemas/contracts/v1/governance/query_run_record.schema.json"
      - "fixtures/contracts/v1/governance/temporal_query_disclosure/**"
      - "tools/generators/temporal_query_disclosure/**"
      - "tools/validators/governance/validate_temporal_query_disclosure.py"
      - "tests/validators/governance/test_temporal_query_disclosure.py"
      - "data/receipts/generated/genrec-pass9-temporal-query-disclosure-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporal-query-disclosure.yml"
      - "contracts/governance/temporal_query_disclosure.md"
      - "schemas/contracts/v1/governance/temporal_query_disclosure.schema.json"
      - "schemas/contracts/v1/governance/query_run_record.schema.json"
      - "fixtures/contracts/v1/governance/temporal_query_disclosure/**"
      - "tools/generators/temporal_query_disclosure/**"
      - "tools/validators/governance/validate_temporal_query_disclosure.py"
      - "tests/validators/governance/test_temporal_query_disclosure.py"
      - "data/receipts/generated/genrec-pass9-temporal-query-disclosure-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-query-disclosure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-temporal-query-disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"

      - name: Run deterministic temporal disclosure tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/validators/governance \
            --pattern 'test_temporal_query_disclosure.py' \
            --verbose
          python tools/validators/governance/validate_temporal_query_disclosure.py \
            --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py \
            data/receipts/generated/genrec-pass9-temporal-query-disclosure-20260808.json \
            --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### TemporalQueryDisclosure"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: current-state, prior-state, sequenced, nonsequenced, and tracking-log labels; valid/transaction/bitemporal/release clock basis; fixed explanation codes; deterministic identity."
            echo "- Boundary: the profile does not execute queries, read a database, resolve evidence, evaluate policy, approve review, release, deploy, publish, or create public-use authority."
          } >> "$GITHUB_STEP_SUMMARY"

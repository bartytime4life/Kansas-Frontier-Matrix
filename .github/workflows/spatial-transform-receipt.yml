name: spatial-transform-receipt
"on":
  pull_request:
    paths:
      - ".github/workflows/spatial-transform-receipt.yml"
      - "contracts/evidence/spatial_transform_receipt.md"
      - "schemas/contracts/v1/evidence/spatial_transform_receipt.schema.json"
      - "fixtures/contracts/v1/evidence/spatial_transform_receipt/**"
      - "tools/validators/evidence/validate_spatial_transform_receipt.py"
      - "tests/validators/test_validate_spatial_transform_receipt.py"
      - "docs/intake/exploratory/pass9-spatial-transform-receipt-source-map.md"
  workflow_dispatch:
permissions: {contents: read}
env: {KFM_NO_NETWORK: "1", PYTHONDONTWRITEBYTECODE: "1", PYTHONHASHSEED: "0", TZ: UTC}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - run: python -m py_compile tools/validators/evidence/validate_spatial_transform_receipt.py tests/validators/test_validate_spatial_transform_receipt.py
      - run: python -m unittest tests.validators.test_validate_spatial_transform_receipt -v
      - run: python tools/validators/evidence/validate_spatial_transform_receipt.py --fixtures

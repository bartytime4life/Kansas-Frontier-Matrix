# Validate inactive pipeline declarations and fixture polarity without network access.
name: pipeline-spec-declarations

"on":
  pull_request:
    paths:
      - "pipeline_specs/**"
      - "contracts/pipeline_spec_declaration.md"
      - "schemas/contracts/v1/pipeline_spec_declaration.schema.json"
      - "fixtures/contracts/v1/pipeline_spec_declaration/**"
      - "tools/validators/validate_pipeline_spec_declarations.py"
      - "tests/validators/test_validate_pipeline_spec_declarations.py"
      - ".github/workflows/pipeline-spec-declarations.yml"
      - ".github/workflows/domain-hydrology.yml"
  push:
    branches: [main]
    paths:
      - "pipeline_specs/**"
      - "contracts/pipeline_spec_declaration.md"
      - "schemas/contracts/v1/pipeline_spec_declaration.schema.json"
      - "fixtures/contracts/v1/pipeline_spec_declaration/**"
      - "tools/validators/validate_pipeline_spec_declarations.py"
      - "tests/validators/test_validate_pipeline_spec_declarations.py"
      - ".github/workflows/pipeline-spec-declarations.yml"
      - ".github/workflows/domain-hydrology.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-spec-declarations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-inactive-declarations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python tools/ci/install_python_ci.py project-test

      - name: Validate declaration corpus and fixture polarity
        run: |
          set -euo pipefail
          python tools/validators/validate_pipeline_spec_declarations.py
          python tools/validators/validate_pipeline_spec_declarations.py --fixtures
          python -m pytest \
            tests/validators/test_validate_pipeline_spec_declarations.py \
            -q --strict-config --strict-markers

      - name: Record bounded trust posture
        if: always()
        run: |
          {
            echo "### Inactive pipeline declarations"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: declaration shape, identity, references, hashes, alias targets, and fixture polarity."
            echo "- Boundary: no source activation, live network access, lifecycle write, promotion, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

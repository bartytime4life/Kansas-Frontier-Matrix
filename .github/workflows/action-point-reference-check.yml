# Validate the fixture-only action-point dereference boundary.
name: action-point-reference-check

"on":
  pull_request:
    paths:
      - ".github/workflows/action-point-reference-check.yml"
      - "contracts/validation/action_point_reference_check.md"
      - "schemas/contracts/v1/validation/action_point_reference_check.schema.json"
      - "fixtures/contracts/v1/validation/action_point_reference_check/**"
      - "tools/generators/action_point_reference_check/**"
      - "tools/validators/validate_action_point_reference_check.py"
      - "tests/validators/test_validate_action_point_reference_check.py"
      - "docs/intake/exploratory/cairnwake-action-point-reference-check-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-cairnwake-action-point-reference-check-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/action-point-reference-check.yml"
      - "contracts/validation/action_point_reference_check.md"
      - "schemas/contracts/v1/validation/action_point_reference_check.schema.json"
      - "fixtures/contracts/v1/validation/action_point_reference_check/**"
      - "tools/generators/action_point_reference_check/**"
      - "tools/validators/validate_action_point_reference_check.py"
      - "tests/validators/test_validate_action_point_reference_check.py"
      - "docs/intake/exploratory/cairnwake-action-point-reference-check-source-map.md"
      - "packages/hashing/**"
      - "data/receipts/generated/genrec-cairnwake-action-point-reference-check-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-point-reference-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-action-point-reference-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/hashing/pyproject.toml

      - name: Install declared test dependencies
        run: |
          set -euo pipefail
          python tools/ci/install_python_ci.py project-test-hashing-test

      - name: Run deterministic no-network checks
        run: |
          set -euo pipefail
          python -m unittest tests.validators.test_validate_action_point_reference_check --verbose
          python tools/generators/action_point_reference_check/build_action_point_reference_check.py --case valid-match
          python tools/validators/validate_action_point_reference_check.py --fixtures

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-cairnwake-action-point-reference-check-20260825.json --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### ActionPointReferenceCheck validation"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: fixture-only literal equality, abbreviation blocking, pre-action timing, pointer shape, and finite report reproduction."
            echo "- Boundary: a green result does not dereference a live source, execute an action, grant authority, or release, deploy, publish, or authorize public use."
          } >> "$GITHUB_STEP_SUMMARY"

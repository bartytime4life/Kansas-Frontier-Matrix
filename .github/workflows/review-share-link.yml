# Validate fixture-only ReviewShareLink records.
name: review-share-link

"on":
  pull_request:
    paths:
      - ".github/workflows/review-share-link.yml"
      - "contracts/review/review_share_link.md"
      - "schemas/contracts/v1/review/review_share_link.schema.json"
      - "tools/validators/review/review_share_link/**"
      - "fixtures/review/review_share_link/**"
      - "tests/validators/review/review_share_link/**"
      - "data/receipts/generated/genrec-review-share-link-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-share-link.yml"
      - "contracts/review/review_share_link.md"
      - "schemas/contracts/v1/review/review_share_link.schema.json"
      - "tools/validators/review/review_share_link/**"
      - "fixtures/review/review_share_link/**"
      - "tests/validators/review/review_share_link/**"
      - "data/receipts/generated/genrec-review-share-link-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-share-link-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KFM_NO_NETWORK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  validate:
    name: validate-review-share-link
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic share-link tests
        run: |
          set -euo pipefail
          python -m pytest tests/validators/review/review_share_link/test_validate_review_share_link.py -q --strict-config --strict-markers

      - name: Verify generated authoring receipt integrity
        run: |
          set -euo pipefail
          python tools/validators/validate_generated_receipt.py data/receipts/generated/genrec-review-share-link-20260806.json --repo-root .

      - name: Record trust boundary
        if: always()
        run: |
          {
            echo "### Fixture-only ReviewShareLink"
            echo
            echo "- Result: ${{ job.status }}."
            echo "- Scope: token-digest shape, governed context refs, deterministic expiry/revocation, finite decision, and spec-hash checks."
            echo "- Boundary: no plaintext token, access grant, live server, lifecycle write, promotion, release, deployment, or publication."
          } >> "$GITHUB_STEP_SUMMARY"

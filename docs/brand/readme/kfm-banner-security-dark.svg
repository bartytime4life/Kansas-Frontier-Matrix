<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="t d">
  <title id="t">Policy · Security — Report privately. Never in public.</title>
  <desc id="d">Banner: a shield with a lock receives a private report envelope; a public issue is crossed out.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="218" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}
      .rng{transform-box:fill-box;transform-origin:center;animation:rng 3.2s ease-out 1 both}@keyframes rng{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.5);opacity:0}}
      .env{animation:env 4s cubic-bezier(.4,0,.3,1) 1 both}@keyframes env{0%{transform:translate(840px,110px);opacity:0}12%{opacity:1}55%{transform:translate(1008px,118px) scale(.6);opacity:1}62%,100%{transform:translate(1010px,118px) scale(.3);opacity:0}}
      @media (prefers-reduced-motion: reduce){.rng,.env{animation:none!important}.env{transform:translate(840px,110px)}.rng{opacity:.4}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="220" fill="#161B22"/>
<rect width="1280" height="6" fill="#E27B7B"/>
    <text x="48" y="60" class="lbl" fill="#E27B7B">POLICY · SECURITY</text>
    <text x="48" y="112" class="serif" font-size="40" fill="#E6EDF3">Report privately. Never in public.</text>
    <text x="48" y="150" class="sans" font-size="16.5" fill="#B1BAC4">Sensitive locations, credentials and exploit paths stay out of issues, PRs and</text><text x="48" y="172" class="sans" font-size="16.5" fill="#B1BAC4">screenshots.</text>
    <g transform="translate(48,202)" class="sans" font-size="12" fill="#9198A1"><circle cx="5" cy="-4" r="4" fill="#E27B7B"/><text x="16" y="0">Kansas Frontier Matrix</text></g>
    <line x1="776" y1="34" x2="776" y2="186" stroke="#30363D"/>
<g class="rng"><circle cx="1010" cy="110" r="60" fill="none" stroke="#E27B7B" stroke-width="2"/></g>
    <path d="M1010,48 L1058,66 V114 C1058,148 1032,166 1010,176 C988,166 962,148 962,114 V66 Z" fill="#0D1117" stroke="#E27B7B" stroke-width="3"/>
    <rect x="993" y="106" width="34" height="28" rx="5" fill="#E27B7B"/><path d="M1000,106 v-10 a10,10 0 0 1 20,0 v10" fill="none" stroke="#E27B7B" stroke-width="4"/><circle cx="1010" cy="119" r="4" fill="#FFFFFE"/>
    <g class="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#0D1117" stroke="#A8C4EA" stroke-width="1.6"/><path d="M-22,-14 L0,4 L22,-14" fill="none" stroke="#A8C4EA" stroke-width="1.6"/></g>
    <g class="sans" font-size="12.5"><text x="800" y="70" fill="#A8C4EA" font-weight="700">private report</text><text x="1110" y="70" fill="#E27B7B" font-weight="700">public issue ✕</text><line x1="1110" y1="80" x2="1230" y2="80" stroke="#E27B7B" stroke-width="1.5"/></g>
  </g>
  <rect x="1" y="1" width="1278" height="218" rx="18" fill="none" stroke="#30363D" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 44" width="1280" height="44" role="img" aria-label="Section divider: a sunflower on a gold line">
  <style>.glint{animation:glint 7s cubic-bezier(.4,0,.3,1) infinite}@keyframes glint{0%{transform:translateX(80px)}60%,100%{transform:translateX(1300px)}}
      .flower{animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce){.glint,.flower{animation:none}.glint{opacity:0}}</style>
  <defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#C9A227" stop-opacity="0"/><stop offset=".5" stop-color="#C9A227" stop-opacity=".9"/><stop offset="1" stop-color="#C9A227" stop-opacity="0"/></linearGradient>
    <linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#FFF8E6" stop-opacity="0"/><stop offset=".5" stop-color="#FFF8E6" stop-opacity=".95"/><stop offset="1" stop-color="#FFF8E6" stop-opacity="0"/></linearGradient>
    <clipPath id="lc"><rect x="80" y="20" width="510" height="4"/><rect x="690" y="20" width="510" height="4"/></clipPath></defs>
    <rect x="80" y="21" width="510" height="2" fill="url(#ln)"/><rect x="690" y="21" width="510" height="2" fill="url(#ln)"/>
    <g clip-path="url(#lc)"><rect class="glint" x="-120" y="20" width="120" height="4" fill="url(#gl)"/></g>
    <g transform="translate(640,22)"><g class="flower"><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(0)"/><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(30)"/><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(60)"/><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(90)"/><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(120)"/><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(150)"/><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(180)"/><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(210)"/><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(240)"/><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(270)"/><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(300)"/><ellipse cx="0" cy="-9" rx="3.4" ry="7" fill="#C9A227" transform="rotate(330)"/></g><circle r="6.5" fill="#8E5A2A"/><circle r="3" fill="#5E3A1A"/></g>
</svg>

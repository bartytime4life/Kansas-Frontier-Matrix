<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
  <title id="t">Choose what to install</title>
  <desc id="d">Four independent KFM components: local data store (Python 3.11+, standard library, first command doctor.py); validators and fixture API (Python 3.11+, Git, Make, hash-locked test profile, make validate); shared JavaScript and MapLibre packages (Node 22, pnpm 11.17.0, pnpm install --frozen-lockfile); and the Explorer Site (Node 22.13+ on Linux, its own package lock, serve-local.sh).</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="378" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}
      .cc{animation:cc 4s ease-in-out 1 both}@keyframes cc{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .cur{animation:cur 1s steps(1) 1 both}@keyframes cur{50%{opacity:0}}
      @media (prefers-reduced-motion: reduce){.cc,.cur{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="380" fill="#161B22"/>
<text x="40" y="48" class="lbl" fill="#A8C4EA">CHOOSE WHAT TO INSTALL</text><text x="40" y="76" class="sans" font-size="17" fill="#A8C4EA">Four independent components. Each has its own tools, its own lockfile and its own first command.</text>
    <g transform="translate(40,104)"><g class="cc" style="animation-delay:0s"><rect width="286" height="236" rx="16" fill="#0D1117" stroke="#D2A06A" stroke-opacity=".5"/><rect width="286" height="6" rx="3" fill="#D2A06A"/><text x="20" y="90" class="sans" font-size="17" font-weight="700" fill="#E6EDF3">Local data store</text><text x="20" y="118" class="sans" font-size="13" fill="#A8C4EA">Python 3.11+</text><text x="20" y="140" class="sans" font-size="12" fill="#9198A1">standard library · no install</text><rect x="16" y="168" width="254" height="44" rx="10" fill="#0B1F3A"/><text x="30" y="195" class="mono" font-size="12" fill="#B1BAC4">$</text><text x="44" y="195" class="mono" font-size="11.5" fill="#DCE6F3">tools/local_data/doctor.py</text><rect class="cur" x="225" y="185" width="7" height="13" fill="#B1BAC4"/></g></g>
    <g transform="translate(342,104)"><g class="cc" style="animation-delay:-0.467s"><rect width="286" height="236" rx="16" fill="#0D1117" stroke="#62B487" stroke-opacity=".5"/><rect width="286" height="6" rx="3" fill="#62B487"/><text x="20" y="90" class="sans" font-size="17" font-weight="700" fill="#E6EDF3">Validators &amp; fixture API</text><text x="20" y="118" class="sans" font-size="13" fill="#A8C4EA">Python 3.11+ · Git · Make</text><text x="20" y="140" class="sans" font-size="12" fill="#9198A1">hash-locked test profile</text><rect x="16" y="168" width="254" height="44" rx="10" fill="#0B1F3A"/><text x="30" y="195" class="mono" font-size="12" fill="#B1BAC4">$</text><text x="44" y="195" class="mono" font-size="11.5" fill="#DCE6F3">make validate</text><rect class="cur" x="134" y="185" width="7" height="13" fill="#B1BAC4"/></g></g>
    <g transform="translate(644,104)"><g class="cc" style="animation-delay:-0.933s"><rect width="286" height="236" rx="16" fill="#0D1117" stroke="#7FA9E3" stroke-opacity=".5"/><rect width="286" height="6" rx="3" fill="#7FA9E3"/><text x="20" y="90" class="sans" font-size="17" font-weight="700" fill="#E6EDF3">Shared JS &amp; MapLibre</text><text x="20" y="118" class="sans" font-size="13" fill="#A8C4EA">Node 22 · pnpm 11.17.0</text><text x="20" y="140" class="sans" font-size="12" fill="#9198A1">root pnpm-lock.yaml</text><rect x="16" y="168" width="254" height="44" rx="10" fill="#0B1F3A"/><text x="30" y="195" class="mono" font-size="12" fill="#B1BAC4">$</text><text x="44" y="195" class="mono" font-size="11.5" fill="#DCE6F3">pnpm install --frozen-lockfile</text><rect class="cur" x="252" y="185" width="7" height="13" fill="#B1BAC4"/></g></g>
    <g transform="translate(946,104)"><g class="cc" style="animation-delay:-1.4s"><rect width="286" height="236" rx="16" fill="#0D1117" stroke="#A8C4EA" stroke-opacity=".5"/><rect width="286" height="6" rx="3" fill="#A8C4EA"/><text x="20" y="90" class="sans" font-size="17" font-weight="700" fill="#E6EDF3">Explorer Site</text><text x="20" y="118" class="sans" font-size="13" fill="#A8C4EA">Node ≥22.13 on Linux</text><text x="20" y="140" class="sans" font-size="12" fill="#9198A1">its own package-lock.json</text><rect x="16" y="168" width="254" height="44" rx="10" fill="#0B1F3A"/><text x="30" y="195" class="mono" font-size="12" fill="#B1BAC4">$</text><text x="44" y="195" class="mono" font-size="11.5" fill="#DCE6F3">../serve-local.sh</text><rect class="cur" x="162" y="185" width="7" height="13" fill="#B1BAC4"/></g></g>
  </g>
  <rect x="1" y="1" width="1278" height="378" rx="18" fill="none" stroke="#30363D" stroke-width="2"/>
</svg>

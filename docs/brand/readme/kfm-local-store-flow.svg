<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">Local data workflow</title>
  <desc id="d">Six local data commands in order — doctor checks prerequisites, init creates the store, describe drafts a manifest, plan previews actions read-only, sync captures bytes under an exclusive lock, verify proves the store. Below, files from your downloads folder are synced into a private KFM_DATA_ROOT quarantine store addressed by sha256 digest, kept separate from the Git checkout and never served over HTTP.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="468" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}
      .st{opacity:1}@keyframes st{0%{opacity:.35}4%,100%{opacity:1}}
      .fl{animation:fl 4s cubic-bezier(.4,0,.3,1) 1 both;opacity:0}@keyframes fl{0%{transform:translate(170px,346px);opacity:0}12%{opacity:1}70%{transform:translate(420px,346px);opacity:1}85%,100%{transform:translate(470px,346px) scale(.4);opacity:0}}
      @media (prefers-reduced-motion: reduce){.st,.fl{animation:none!important}.fl{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="470" fill="#FAF7F0"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8E5A2A"/></marker></defs>
    <text x="40" y="48" class="lbl" fill="#8E5A2A">LOCAL DATA WORKFLOW</text><text x="40" y="76" class="sans" font-size="17" fill="#1F3A66">Six commands take files you already downloaded into a private, verifiable store.</text>
    <g class="st" style="animation-delay:-4s"><rect x="40" y="104" width="186" height="118" rx="14" fill="#FFFFFF" stroke="#D9CFBD"/><circle cx="68" cy="134" r="16" fill="#8E5A2A"/><text x="68" y="139" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FFFFFE">1</text><text x="94" y="140" class="mono" font-size="16" font-weight="700" fill="#0E1F3A">doctor</text><text x="56" y="176" class="sans" font-size="13.5" font-weight="600" fill="#1F3A66">checks prerequisites</text><text x="56" y="200" class="sans" font-size="11.5" fill="#6B6B6B">writes nothing · no fetch</text></g>
    <path d="M228,163 H240" stroke="#8E5A2A" stroke-width="2" marker-end="url(#ar)"/>
    <g class="st" style="animation-delay:-3.6s"><rect x="242" y="104" width="186" height="118" rx="14" fill="#FFFFFF" stroke="#D9CFBD"/><circle cx="270" cy="134" r="16" fill="#8E5A2A"/><text x="270" y="139" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FFFFFE">2</text><text x="296" y="140" class="mono" font-size="16" font-weight="700" fill="#0E1F3A">init</text><text x="258" y="176" class="sans" font-size="13.5" font-weight="600" fill="#1F3A66">creates the store</text><text x="258" y="200" class="sans" font-size="11.5" fill="#6B6B6B">outside the checkout</text></g>
    <path d="M430,163 H442" stroke="#8E5A2A" stroke-width="2" marker-end="url(#ar)"/>
    <g class="st" style="animation-delay:-3.2s"><rect x="444" y="104" width="186" height="118" rx="14" fill="#FFFFFF" stroke="#D9CFBD"/><circle cx="472" cy="134" r="16" fill="#8E5A2A"/><text x="472" y="139" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FFFFFE">3</text><text x="498" y="140" class="mono" font-size="16" font-weight="700" fill="#0E1F3A">describe</text><text x="460" y="176" class="sans" font-size="13.5" font-weight="600" fill="#1F3A66">drafts a manifest</text><text x="460" y="200" class="sans" font-size="11.5" fill="#6B6B6B">one file · sha256</text></g>
    <path d="M632,163 H644" stroke="#8E5A2A" stroke-width="2" marker-end="url(#ar)"/>
    <g class="st" style="animation-delay:-2.8s"><rect x="646" y="104" width="186" height="118" rx="14" fill="#FFFFFF" stroke="#D9CFBD"/><circle cx="674" cy="134" r="16" fill="#8E5A2A"/><text x="674" y="139" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FFFFFE">4</text><text x="700" y="140" class="mono" font-size="16" font-weight="700" fill="#0E1F3A">plan</text><text x="662" y="176" class="sans" font-size="13.5" font-weight="600" fill="#1F3A66">previews actions</text><text x="662" y="200" class="sans" font-size="11.5" fill="#6B6B6B">read-only · needed space</text></g>
    <path d="M834,163 H846" stroke="#8E5A2A" stroke-width="2" marker-end="url(#ar)"/>
    <g class="st" style="animation-delay:-2.4s"><rect x="848" y="104" width="186" height="118" rx="14" fill="#FFFFFF" stroke="#D9CFBD"/><circle cx="876" cy="134" r="16" fill="#8E5A2A"/><text x="876" y="139" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FFFFFE">5</text><text x="902" y="140" class="mono" font-size="16" font-weight="700" fill="#0E1F3A">sync</text><text x="864" y="176" class="sans" font-size="13.5" font-weight="600" fill="#1F3A66">captures bytes</text><text x="864" y="200" class="sans" font-size="11.5" fill="#6B6B6B">exclusive lock</text></g>
    <path d="M1036,163 H1048" stroke="#8E5A2A" stroke-width="2" marker-end="url(#ar)"/>
    <g class="st" style="animation-delay:-2s"><rect x="1050" y="104" width="186" height="118" rx="14" fill="#FFFFFF" stroke="#D9CFBD"/><circle cx="1078" cy="134" r="16" fill="#8E5A2A"/><text x="1078" y="139" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FFFFFE">6</text><text x="1104" y="140" class="mono" font-size="16" font-weight="700" fill="#0E1F3A">verify</text><text x="1066" y="176" class="sans" font-size="13.5" font-weight="600" fill="#1F3A66">proves the store</text><text x="1066" y="200" class="sans" font-size="11.5" fill="#6B6B6B">bytes · receipts</text></g>
    <g class="sans">
  <path d="M40,272 h70 l14,14 h120 v140 h-204 Z" fill="#F2E6D2" stroke="#8E5A2A"/><text x="58" y="314" font-size="14" font-weight="700" fill="#0E1F3A">Your downloads</text><text x="58" y="336" font-size="12" fill="#4A4A4A">maps · photos · PDFs</text><text x="58" y="356" font-size="12" fill="#4A4A4A">read, never moved</text>
  <rect x="430" y="262" width="470" height="168" rx="16" fill="#FFFFFF" stroke="#8E5A2A" stroke-width="2.5"/>
  <rect x="430" y="262" width="470" height="34" rx="16" fill="#8E5A2A"/><rect x="430" y="280" width="470" height="16" fill="#8E5A2A"/>
  <text x="450" y="285" font-size="13" font-weight="700" fill="#FFFFFE" letter-spacing="1">KFM_DATA_ROOT · private store</text>
  <text x="450" y="322" class="mono" font-size="12" fill="#1F3A66">quarantine/&lt;source&gt;/objects/sha256/&lt;digest&gt;/payload</text>
  <text x="450" y="346" class="mono" font-size="12" fill="#1F3A66">quarantine/&lt;source&gt;/runs/&lt;run&gt;/manifest.json</text>
  <text x="450" y="370" class="mono" font-size="12" fill="#1F3A66">receipts/ingest/local-upload/…/ingest-receipt.json</text>
  <text x="450" y="402" font-size="12" fill="#6B6B6B">opaque payload names · never served over HTTP</text>
  <rect x="980" y="262" width="260" height="168" rx="16" fill="#F6F1E7" stroke="#D9CFBD" stroke-dasharray="6 5"/>
  <text x="1000" y="292" font-size="13" font-weight="700" fill="#0E1F3A">Git checkout</text>
  <text x="1000" y="316" font-size="12" fill="#6B6B6B">code and docs only</text>
  <text x="1000" y="344" font-size="12" fill="#A33A3A">✕ store may not live here</text>
  <text x="1000" y="368" font-size="12" fill="#A33A3A">✕ not in public app assets</text>
  <text x="1000" y="404" font-size="11.5" fill="#6B6B6B">capture ≠ admission or display</text>
</g>
    <path d="M250,346 H430" stroke="#8E5A2A" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><text x="340" y="336" text-anchor="middle" class="mono" font-size="12" fill="#8E5A2A">sync</text>
    <line x1="940" y1="262" x2="940" y2="430" stroke="#A33A3A" stroke-width="2" stroke-dasharray="3 6"/>
    <g class="fl" style="animation-delay:0s"><rect x="-9" y="-11" width="18" height="22" rx="2" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5"/><path d="M-5,-4 h10 M-5,1 h10 M-5,6 h7" stroke="#4A6FA5" stroke-width="1.2"/></g>
    <g class="fl" style="animation-delay:-0.533s"><rect x="-9" y="-11" width="18" height="22" rx="2" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5"/><path d="M-5,-4 h10 M-5,1 h10 M-5,6 h7" stroke="#4A6FA5" stroke-width="1.2"/></g>
    <g class="fl" style="animation-delay:-1.07s"><rect x="-9" y="-11" width="18" height="22" rx="2" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5"/><path d="M-5,-4 h10 M-5,1 h10 M-5,6 h7" stroke="#4A6FA5" stroke-width="1.2"/></g>
  </g>
  <rect x="1" y="1" width="1278" height="468" rx="18" fill="none" stroke="#D9CFBD" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 350" width="1280" height="350" role="img" aria-labelledby="t d">
  <title id="t">KFM data lifecycle</title>
  <desc id="d">Five lifecycle stages left to right: RAW, WORK or QUARANTINE, PROCESSED, CATALOG or TRIPLETS, and PUBLISHED, separated by gates for source and rights, sensitivity and validation, evidence and lineage, and review and release. Static branches show HOLD when rights or sensitivity are unclear, and ABSTAIN or DENY when evidence is not resolved. The illustration records no promotion, release or acceptance.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="348" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="350" fill="#161B22"/>
    <text x="40" y="44" class="sans" font-size="14" letter-spacing="2.5" font-weight="700" fill="#62B487">THE TRUST PATH</text>
    <text x="40" y="70" class="sans" font-size="17" fill="#A8C4EA">Promotion is a governed decision, not a file move</text>
    <line x1="212" y1="168" x2="278" y2="168" stroke="#D2A06A" stroke-width="2" stroke-opacity=".5"/><rect x="240.0" y="146" width="10" height="44" rx="3" fill="#B1BAC4"/><line x1="245.0" y1="108" x2="245.0" y2="144" stroke="#B1BAC4" stroke-width="1.2" stroke-dasharray="2 3"/><text x="245.0" y="102" text-anchor="middle" class="sans" font-size="12.5" fill="#D2A06A">source + rights</text><line x1="462" y1="168" x2="528" y2="168" stroke="#D2A06A" stroke-width="2" stroke-opacity=".5"/><rect x="490.0" y="146" width="10" height="44" rx="3" fill="#B1BAC4"/><line x1="495.0" y1="108" x2="495.0" y2="144" stroke="#B1BAC4" stroke-width="1.2" stroke-dasharray="2 3"/><text x="495.0" y="102" text-anchor="middle" class="sans" font-size="12.5" fill="#D2A06A">sensitivity + validation</text><line x1="712" y1="168" x2="778" y2="168" stroke="#D2A06A" stroke-width="2" stroke-opacity=".5"/><rect x="740.0" y="146" width="10" height="44" rx="3" fill="#B1BAC4"/><line x1="745.0" y1="108" x2="745.0" y2="144" stroke="#B1BAC4" stroke-width="1.2" stroke-dasharray="2 3"/><text x="745.0" y="102" text-anchor="middle" class="sans" font-size="12.5" fill="#D2A06A">evidence + lineage</text><line x1="962" y1="168" x2="1028" y2="168" stroke="#D2A06A" stroke-width="2" stroke-opacity=".5"/><rect x="990.0" y="146" width="10" height="44" rx="3" fill="#B1BAC4"/><line x1="995.0" y1="108" x2="995.0" y2="144" stroke="#B1BAC4" stroke-width="1.2" stroke-dasharray="2 3"/><text x="995.0" y="102" text-anchor="middle" class="sans" font-size="12.5" fill="#D2A06A">review + release</text>
    <rect x="28" y="124" width="184" height="88" rx="14" fill="#0D1117" stroke="#A8C4EA" stroke-width="2"/><text x="120" y="162" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#E6EDF3">RAW</text><text x="120" y="198" text-anchor="middle" class="sans" font-size="12" fill="#9198A1">as captured</text><rect x="278" y="124" width="184" height="88" rx="14" fill="#0D1117" stroke="#A8C4EA" stroke-width="2"/><text x="370" y="152" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#E6EDF3">WORK /</text><text x="370" y="172" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#E6EDF3">QUARANTINE</text><text x="370" y="198" text-anchor="middle" class="sans" font-size="12" fill="#9198A1">checked, held if unclear</text><rect x="528" y="124" width="184" height="88" rx="14" fill="#0D1117" stroke="#A8C4EA" stroke-width="2"/><text x="620" y="162" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#E6EDF3">PROCESSED</text><text x="620" y="198" text-anchor="middle" class="sans" font-size="12" fill="#9198A1">validated + normalized</text><rect x="778" y="124" width="184" height="88" rx="14" fill="#0D1117" stroke="#A8C4EA" stroke-width="2"/><text x="870" y="152" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#E6EDF3">CATALOG /</text><text x="870" y="172" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#E6EDF3">TRIPLETS</text><text x="870" y="198" text-anchor="middle" class="sans" font-size="12" fill="#9198A1">indexed with lineage</text><rect x="1028" y="124" width="184" height="88" rx="14" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2"/><text x="1120" y="162" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#FFFFFE">PUBLISHED</text><text x="1120" y="198" text-anchor="middle" class="sans" font-size="12" fill="#B1BAC4">released, reversible</text>
    <line x1="120" y1="232" x2="1120" y2="232" stroke="#30363D" stroke-width="2"/>
    <g class="sans" font-size="13">
      <path d="M370,232 V284 H470" fill="none" stroke="#B1BAC4" stroke-width="2" stroke-dasharray="5 5"/>
      <rect x="470" y="266" width="260" height="36" rx="18" fill="#0D1117" stroke="#B1BAC4" stroke-width="1.6"/>
      <text x="600" y="289" text-anchor="middle" fill="#B1BAC4">HOLD — rights or sensitivity unclear</text>
      <path d="M870,232 V284 H900" fill="none" stroke="#E27B7B" stroke-width="2" stroke-dasharray="5 5"/>
      <rect x="900" y="266" width="300" height="36" rx="18" fill="#0D1117" stroke="#E27B7B" stroke-width="1.6"/>
      <text x="1050" y="289" text-anchor="middle" fill="#F09A9A">ABSTAIN / DENY — evidence not resolved</text>
    </g>

  </g>
  <rect x="1" y="1" width="1278" height="348" rx="18" fill="none" stroke="#30363D" stroke-width="2"/>
</svg>

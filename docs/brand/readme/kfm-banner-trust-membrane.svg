<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="t d">
  <title id="t">Doctrine · Trust Membrane — Public clients never reach inside.</title>
  <desc id="d">Banner: a public client and a Governed API on one side of a gold membrane, internal stores on the other; an allowed request passes through the gate while a direct read is refused.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="218" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}
      .ok{animation:ok 6s cubic-bezier(.45,.05,.3,1) infinite}@keyframes ok{0%{transform:translate(950px,140px);opacity:0}8%{opacity:1}35%{transform:translate(1010px,140px)}55%{transform:translate(1070px,112px)}75%{transform:translate(1010px,140px)}92%{transform:translate(950px,140px);opacity:1}100%{opacity:0;transform:translate(950px,140px)}}
      .bad{animation:bad 6s cubic-bezier(.5,0,.3,1) infinite;animation-delay:-3s}@keyframes bad{0%{transform:translate(950px,80px);opacity:0}10%{opacity:1}45%{transform:translate(1000px,80px)}65%{transform:translate(960px,96px);opacity:1}80%,100%{transform:translate(960px,96px);opacity:0}}
      @media (prefers-reduced-motion: reduce){.ok,.bad{animation:none!important}.ok{transform:translate(1070px,112px)}.bad{transform:translate(1000px,80px)}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="220" fill="#FAF7F0"/>
<rect width="1280" height="6" fill="#9A7A12"/>
    <text x="48" y="60" class="lbl" fill="#9A7A12">DOCTRINE · TRUST MEMBRANE</text>
    <text x="48" y="112" class="serif" font-size="40" fill="#0E1F3A">Public clients never reach inside.</text>
    <text x="48" y="150" class="sans" font-size="16.5" fill="#4A4A4A">Every public view crosses governed interfaces and released artifacts — never</text><text x="48" y="172" class="sans" font-size="16.5" fill="#4A4A4A">internal stores.</text>
    <g transform="translate(48,202)" class="sans" font-size="12" fill="#6B6B6B"><circle cx="5" cy="-4" r="4" fill="#9A7A12"/><text x="16" y="0">Kansas Frontier Matrix</text></g>
    <line x1="776" y1="34" x2="776" y2="186" stroke="#D9CFBD"/>
<g class="sans" font-size="12.5"><rect x="800" y="60" width="150" height="40" rx="10" fill="#ECF3FA" stroke="#4A6FA5" stroke-opacity=".6"/><text x="816" y="85" fill="#0E1F3A">Public client</text>
    <rect x="800" y="120" width="150" height="40" rx="10" fill="#FFFFFF" stroke="#C9A227" stroke-width="2"/><text x="816" y="145" fill="#0E1F3A">Governed API</text>
    <rect x="1060" y="50" width="170" height="120" rx="12" fill="#F6F1E7" stroke="#D9CFBD"/><text x="1078" y="76" class="mono" font-size="12" fill="#8E5A2A">RAW</text><text x="1078" y="100" class="mono" font-size="12" fill="#8E5A2A">QUARANTINE</text><text x="1078" y="124" class="mono" font-size="12" fill="#8E5A2A">PROCESSED</text><text x="1078" y="148" class="mono" font-size="12" fill="#8E5A2A">CATALOG</text></g>
    <path d="M1010,30 Q1000,40 1010,50 Q1020,60 1010,70 Q1000,80 1010,90 Q1020,100 1010,110 Q1000,120 1010,130 Q1020,140 1010,150 Q1000,160 1010,170 Q1020,180 1010,190" fill="none" stroke="#9A7A12" stroke-width="4" stroke-linecap="round"/>
    <rect x="998" y="124" width="24" height="34" rx="6" fill="#9A7A12"/>
    <circle class="ok" r="7" fill="#3B7A57" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="bad" r="7" fill="#A33A3A" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="1278" height="218" rx="18" fill="none" stroke="#D9CFBD" stroke-width="2"/>
</svg>

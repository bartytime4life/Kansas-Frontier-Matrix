<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
  <title id="t">River Pulse — live streamflow</title>
  <desc id="d">Illustration of the River Pulse view: stylized Kansas rivers with pulsing stream-gauge points and a 24-hour discharge chart that keeps a missing-data gap visible instead of drawing through it.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="598" height="338" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}

      .flow{fill:none;stroke:#161B22;stroke-linecap:round;stroke-dasharray:6 22;animation:flow 2.6s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-56}}
      .ring{fill:none;stroke:#7FA9E3;stroke-width:3;transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 4.2s ease-out infinite}
      @keyframes ring{0%{transform:scale(.5);opacity:.85}100%{transform:scale(3.6);opacity:0}}
      .hydro{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 9s ease-out infinite;animation-delay:-7s}
      .h2{animation-name:draw2}
      @keyframes draw{0%{stroke-dashoffset:700}45%,100%{stroke-dashoffset:0}}
      @keyframes draw2{0%,45%{stroke-dashoffset:700}75%,100%{stroke-dashoffset:0}}
      @media (prefers-reduced-motion: reduce){.flow,.ring{animation:none}.hydro{animation:none;stroke-dashoffset:0}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="340" fill="#161B22"/>
    <rect width="600" height="6" fill="#7FA9E3"/>

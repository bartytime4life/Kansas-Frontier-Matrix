      <path d="M360,300 H580" stroke="#30363D"/>
      <polyline class="hydro" points="360.0,249.7 364.6,253.2 369.2,253.8 373.8,256.8 378.4,260.7 383.0,261.3 387.6,256.8 392.2,253.5 396.8,250.5 401.4,252.9 406.0,252.1 410.6,253.9 415.2,256.8 419.8,260.2 424.4,262.6 429.0,258.1 433.6,254.5 438.2,251.1 442.8,238.8 447.4,232.5 452.0,224.9 456.6,214.3 461.2,202.7 465.8,189.9 470.4,176.8 475.0,187.2 479.6,192.5 484.2,197.2 488.8,203.5 493.4,213.1" fill="none" stroke="#7FA9E3" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

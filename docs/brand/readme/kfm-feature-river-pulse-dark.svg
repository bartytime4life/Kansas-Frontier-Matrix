      <rect x="497.4" y="168" width="19.6" height="132" fill="#21262D" stroke="#6E7681" stroke-dasharray="3 3"/>
      <text x="509.5" y="162" text-anchor="middle" class="sans" font-size="11" fill="#9198A1">gap</text>
    </g>
  </g>
  <rect x="1" y="1" width="598" height="338" rx="18" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="28" y="44" class="lbl" fill="#7FA9E3">RIVER PULSE</text>
  <text x="28" y="72" class="sans" font-size="17" fill="#A8C4EA">Kansas stream gauges, replayed frame by frame</text>
</svg>

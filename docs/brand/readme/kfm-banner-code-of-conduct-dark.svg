    <text x="48" y="112" class="serif" font-size="40" fill="#E6EDF3">Care, evidence and restraint.</text>
    <text x="48" y="150" class="sans" font-size="16.5" fill="#B1BAC4">These materials carry rights, sovereignty and sensitivity weight — treat them,</text><text x="48" y="172" class="sans" font-size="16.5" fill="#B1BAC4">and each other, accordingly.</text>

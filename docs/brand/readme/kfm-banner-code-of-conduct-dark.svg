      .pp{transform-box:fill-box;transform-origin:center;animation:pp 3.6s ease-in-out 1 both}@keyframes pp{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
      @media (prefers-reduced-motion: reduce){.pp{animation:none!important}}
    </style>

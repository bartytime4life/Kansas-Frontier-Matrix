    <line x1="776" y1="34" x2="776" y2="186" stroke="#30363D"/>
<line x1="1020" y1="48" x2="1082" y2="110" stroke="#62B487" stroke-opacity=".25"/><line x1="1051" y1="56" x2="1074" y2="141" stroke="#62B487" stroke-opacity=".25"/><line x1="1074" y1="79" x2="1051" y2="164" stroke="#62B487" stroke-opacity=".25"/><line x1="1082" y1="110" x2="1020" y2="172" stroke="#62B487" stroke-opacity=".25"/><line x1="1074" y1="141" x2="989" y2="164" stroke="#62B487" stroke-opacity=".25"/><line x1="1051" y1="164" x2="966" y2="141" stroke="#62B487" stroke-opacity=".25"/><line x1="1020" y1="172" x2="958" y2="110" stroke="#62B487" stroke-opacity=".25"/><line x1="989" y1="164" x2="966" y2="79" stroke="#62B487" stroke-opacity=".25"/><line x1="966" y1="141" x2="989" y2="56" stroke="#62B487" stroke-opacity=".25"/><line x1="958" y1="110" x2="1020" y2="48" stroke="#62B487" stroke-opacity=".25"/><line x1="966" y1="79" x2="1051" y2="56" stroke="#62B487" stroke-opacity=".25"/><line x1="989" y1="56" x2="1074" y2="79" stroke="#62B487" stroke-opacity=".25"/><circle class="pp" style="animation-delay:0s" cx="1020" cy="48" r="9" fill="#62B487"/><circle class="pp" style="animation-delay:-0.3s" cx="1051" cy="56" r="9" fill="#7FA9E3"/><circle class="pp" style="animation-delay:-0.6s" cx="1074" cy="79" r="9" fill="#D2A06A"/><circle class="pp" style="animation-delay:-0.9s" cx="1082" cy="110" r="9" fill="#B1BAC4"/><circle class="pp" style="animation-delay:-1.2s" cx="1074" cy="141" r="9" fill="#62B487"/><circle class="pp" style="animation-delay:-1.5s" cx="1051" cy="164" r="9" fill="#7FA9E3"/><circle class="pp" style="animation-delay:-1.8s" cx="1020" cy="172" r="9" fill="#D2A06A"/><circle class="pp" style="animation-delay:-2.1s" cx="989" cy="164" r="9" fill="#B1BAC4"/><circle class="pp" style="animation-delay:-2.4s" cx="966" cy="141" r="9" fill="#62B487"/><circle class="pp" style="animation-delay:-2.7s" cx="958" cy="110" r="9" fill="#7FA9E3"/><circle class="pp" style="animation-delay:-3s" cx="966" cy="79" r="9" fill="#D2A06A"/><circle class="pp" style="animation-delay:-3.3s
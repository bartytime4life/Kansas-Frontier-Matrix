  <title id="t">Roads, rails and bridges — 1918 to today</title>
  <desc id="d">Illustration: a stylized Kansas outline where a 1918-style road network draws itself over today's simplified road grid, a train moves along a railroad line and bridges are marked as diamonds. Beside it: KDOT 1918 roads, today's road network, active and abandoned rail, and bridges. Networks are invented for illustration.</desc>

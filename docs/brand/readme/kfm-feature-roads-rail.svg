      .modern{animation:mod 8s ease-in-out infinite}@keyframes mod{0%,30%{opacity:1}45%,80%{opacity:.25}95%,100%{opacity:1}}
      .tpath{offset-rotate:auto;animation:tp 10s linear infinite}@keyframes tp{from{offset-distance:0%}to{offset-distance:100%}}

    <line x1="776" y1="34" x2="776" y2="186" stroke="#D9CFBD"/>
<rect x="800" y="34" width="136" height="152" rx="10" fill="#F6F1E7" stroke="#D9CFBD"/><text x="810" y="48" class="sans" font-size="10.5" font-weight="800" letter-spacing=".8" fill="#5E6E7C">NEEDS</text><text x="810" y="61" class="sans" font-size="10.5" font-weight="800" letter-spacing=".8" fill="#5E6E7C">VERIFICATION</text><rect x="810" y="66" width="116" height="30" rx="6" fill="#FFFFFF" stroke="#5E6E7C" stroke-opacity=".5"/><rect x="818" y="76" width="70" height="5" rx="2" fill="#E3DACB"/><rect x="818" y="86" width="50" height="5" rx="2" fill="#E3DACB"/><rect x="810" y="106" width="116" height="30" rx="6" fill="#FFFFFF" stroke="#5E6E7C" stroke-opacity=".5"/><rect x="818" y="116" width="54" height="5" rx="2" fill="#E3DACB"/><rect x="818" y="126" width="60" height="5" rx="2" fill="#E3DACB"/><rect x="950" y="34" width="136" height="152" rx="10" fill="#F6F1E7" stroke="#D9CFBD"/><text x="960" y="54" class="sans" font-size="10.5" font-weight="800" letter-spacing=".8" fill="#4A6FA5">PROPOSED</text><rect x="960" y="66" width="116" height="30" rx="6" fill="#FFFFFF" stroke="#4A6FA5" stroke-opacity=".5"/><rect x="968" y="76" width="70" height="5" rx="2" fill="#E3DACB"/><rect x="968" y="86" width="50" height="5" rx="2" fill="#E3DACB"/><rect x="960" y="106" width="116" height="30" rx="6" fill="#FFFFFF" stroke="#4A6FA5" stroke-opacity=".5"/><rect x="968" y="116" width="54" height="5" rx="2" fill="#E3DACB"/><rect x="968" y="126" width="60" height="5" rx="2" fill="#E3DACB"/><rect x="1100" y="34" width="136" height="152" rx="10" fill="#F6F1E7" stroke="#D9CFBD"/><text x="1110" y="54" class="sans" font-size="10.5" font-weight="800" letter-spacing=".8" fill="#3B7A57">CONFIRMED</text><rect x="1110" y="66" width="116" height="30" rx="6" fill="#FFFFFF" stroke="#3B7A57" stroke-opacity=".5"/><rect x="1118" y="76" width="70" height="5" rx="2" fill="#E3DACB"/><rect x="1118" y="86" width="50" height="5" rx="2" fill="#E3DACB"/><rect x="1110" y="106" width="116" height="30" rx="6" fill="#FFFFFF" stroke="#3B7A57" stroke-opacity=".5"/><rect x="1118" y="116" width="54" height="5" rx="2" fill="#E3DACB"/><rect x="1118" y="126" width="60" height="5" rx="2" fill="#E3DACB"/>

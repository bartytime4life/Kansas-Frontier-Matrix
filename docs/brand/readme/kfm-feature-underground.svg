      <polygon points="196.0,100.0 325.0,175.0 239.0,225.0 110.0,150.0" fill="#E5F0E0" stroke="#3B7A57" stroke-width="1.2"/>
      <g class="well" style="animation-delay:-0.00s"><rect x="124.2" y="160.0" width="6" height="16" fill="#E5F0E0" stroke="#0E1F3A" stroke-width="0.6"/><rect x="124.2" y="176.0" width="6" height="8" fill="#4A6FA5" stroke="#0E1F3A" stroke-width="0.6"/><rect x="124.2" y="184.0" width="6" height="12" fill="#FAF7F0" stroke="#0E1F3A" stroke-width="0.6"/><rect x="124.2" y="196.0" width="6" height="12" fill="#FAF7F0" stroke="#0E1F3A" stroke-width="0.6"/><rect x="124.2" y="208.0" width="6" height="16" fill="#4A6FA5" stroke="#0E1F3A" stroke-width="0.6"/><rect x="124.2" y="224.0" width="6" height="12" fill="#4A6FA5" stroke="#0E1F3A" stroke-width="0.6"/><rect x="124.2" y="236.0" width="6" height="8" fill="#E5F0E0" stroke="#0E1F3A" stroke-width="0.6"/><rect x="124.2" y="244.0" width="6" height="6" fill="#FAF7F0" stroke="#0E1F3A" stroke-width="0.6"/></g><circle cx="127.2" cy="160.0" r="3.5" fill="#0E1F3A"/><g class="well" style="animation-delay:-0.45s"><rect x="154.3" y="177.5" width="6" height="20" fill="#C9A227" stroke="#0E1F3A" stroke-width="0.6"/><rect x="154.3" y="197.5" width="6" height="12" fill="#4A6FA5" stroke="#0E1F3A" stroke-width="0.6"/><rect x="154.3" y="209.5" width="6" height="12" fill="#FAF7F0" stroke="#0E1F3A" stroke-width="0.6"/><rect x="154.3" y="221.5" width="6" height="12" fill="#E5F0E0" stroke="#0E1F3A" stroke-width="0.6"/><rect x="154.3" y="233.5" width="6" height="20" fill="#DCE6F2" stroke="#0E1F3A" stroke-width="0.6"/><rect x="154.3" y="253.5" width="6" height="2" fill="#FAF7F0" stroke="#0E1F3A" stroke-width="0.6"/></g><circle cx="157.3" cy="177.5" r="3.5" fill="#0E1F3A"/><g class="well" style="animation-delay:-0.90s"><rect x="188.7" y="197.5" width="6" height="12" fill="#DCE6F2" stroke="#0E1F3A" stroke-width="0.6"/><rect x="188.7" y="209.5" width="6" height="12" fill="#DCE6F2" stroke="#0E1F3A" stroke-width="0.6"/><rect x="188.7" y="221.5" width="6" height="16" fill="#C9A227" stroke="#0E1F3A" stroke-width="0.6"/><rect x="188.7" y="237.5" width="6" heigh
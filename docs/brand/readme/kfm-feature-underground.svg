h="6" height="20" fill="#E5F0E0" stroke="#0E1F3A" stroke-width="0.6"/></g><circle cx="273.4" cy="205.0" r="3.5" fill="#0E1F3A"/>
      <polygon class="slice" points="196.0,100.0 325.0,175.0 239.0,225.0 110.0,150.0" fill="#4A6FA5" fill-opacity="0.16" stroke="#4A6FA5" stroke-width="1.5"/>

    </g>
    <g transform="translate(408,122)" class="sans">
      <text x="0" y="0" font-size="30" class="serif" fill="#0E1F3A">314,844</text>
      <text x="0" y="22" font-size="12" fill="#6B6B6B">mapped water-well records</text>
      <text x="0" y="70" font-size="30" class="serif" fill="#0E1F3A">6,598</text>
      <text x="0" y="92" font-size="12" fill="#6B6B6B">core locations</text>
      <text x="0" y="138" font-size="12" fill="#6B6B6B">Recorded columns only —</text>
      <text x="0" y="155" font-size="12" fill="#6B6B6B">no geology invented</text>
      <text x="0" y="172" font-size="12" fill="#6B6B6B">between them</text>

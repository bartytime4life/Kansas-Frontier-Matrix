<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
  <title id="t">Underground — 3D cutaway of recorded columns</title>
  <desc id="d">Illustration of the Underground 3D cutaway: an isometric block of generalized strata with recorded well columns exposed on the cut faces and a moving slice plane. Counts of 314,844 mapped water-well records and 6,598 core locations are shown, with the note that only recorded columns are drawn.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="598" height="338" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}

      .well{transform-box:fill-box;transform-origin:top;animation:grow 10s ease-out infinite}
      @keyframes grow{0%{transform:scaleY(0)}25%,100%{transform:scaleY(1)}}
      .slice{animation:slice 10s ease-in-out infinite;animation-delay:-3s}
      @keyframes slice{0%,15%{transform:translateY(0)}55%{transform:translateY(96px)}100%{transform:translateY(0)}}
      @media (prefers-reduced-motion: reduce){.well,.slice{animation:none}.slice{transform:translateY(48px)}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="340" fill="#FAF7F0"/>
    <rect width="600" height="6" fill="#8E5A2A"/>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="t d">
  <title id="t">Brand · Visual Language — Make trust legible.</title>
  <desc id="d">Banner: seven brand palette swatches — ink, paper, prairie, cottonwood, river, ember and mute — shown as a static palette.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="218" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}

    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="220" fill="#161B22"/>
<rect width="1280" height="6" fill="#D2A06A"/>
    <text x="48" y="60" class="lbl" fill="#D2A06A">BRAND · VISUAL LANGUAGE</text>
    <text x="48" y="112" class="serif" font-size="40" fill="#E6EDF3">Make trust legible.</text>
    <text x="48" y="150" class="sans" font-size="16.5" fill="#B1BAC4">Calm colour, honest motion, and words that show why a claim is allowed, held</text><text x="48" y="172" class="sans" font-size="16.5" fill="#B1BAC4">or withheld.</text>
    <g transform="translate(48,202)" class="sans" font-size="12" fill="#9198A1"><circle cx="5" cy="-4" r="4" fill="#D2A06A"/><text x="16" y="0">Kansas Frontier Matrix</text></g>
    <line x1="776" y1="34" x2="776" y2="186" stroke="#30363D"/>
<g class="sw"><rect x="800" y="50" width="54" height="96" rx="10" fill="#A8C4EA" stroke="#30363D"/></g><text x="827" y="168" text-anchor="middle" class="sans" font-size="11" fill="#9198A1">ink</text><g class="sw"><rect x="863" y="50" width="54" height="96" rx="10" fill="#161B22" stroke="#30363D"/></g><text x="890" y="168" text-anchor="middle" class="sans" font-size="11" fill="#9198A1">paper</text><g class="sw"><rect x="926" y="50" width="54" height="96" rx="10" fill="#D2A06A" stroke="#30363D"/></g><text x="953" y="168" text-anchor="middle" class="sans" font-size="11" fill="#9198A1">prairie</text><g class="sw"><rect x="989" y="50" width="54" height="96" rx="10" fill="#62B487" stroke="#30363D"/></g><text x="1016" y="168" text-anchor="middle" class="sans" font-size="11" fill="#9198A1">cottonwood</text><g class="sw"><rect x="1052" y="50" width="54" height="96" rx="10" fill="#7FA9E3" stroke="#30363D"/></g><text x="1079" y="168" text-anchor="middle" class="sans" font-size="11" fill="#9198A1">river</text><g class="sw"><rect x="1115" y="50" width="54" height="96" rx="10" fill="#E27B7B" stroke="#30363D"/></g><text x="1142" y="168" text-anchor="middle" class="sans" font-size="11" fill="#9198A1">ember</text><g class="sw"><rect x="1178" y="50" width="54" height="96" rx="10" fill="#B1BAC4" stroke="#30363D"/></g><text x="1205" y="168" text-anchor="middle" class="sans" font-size="11" fill="#9198A1">mute</text>
  </g>
  <rect x="1" y="1" width="1278" height="218" rx="18" fill="none" stroke="#30363D" stroke-width="2"/>
</svg>

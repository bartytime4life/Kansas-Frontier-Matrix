<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">KFM domain atlas</title>
  <desc id="d">Thirteen KFM domains arranged around a stylized Kansas, each with the distinction it preserves: geology, soil, hydrology, atmosphere, agriculture, flora, fauna, habitat, hazards, archaeology, people DNA and land, roads rail and trade, and settlements and infrastructure.</desc>

      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}
      .sp{animation:sp 3s linear infinite}@keyframes sp{to{stroke-dashoffset:-26}}
      .nd{animation:nd 7s ease-in-out infinite}@keyframes nd{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @media (prefers-reduced-motion: reduce){.sp,.nd{animation:none!important}}
    </style>
  </defs>

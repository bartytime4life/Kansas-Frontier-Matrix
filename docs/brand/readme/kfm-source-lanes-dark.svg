<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-labelledby="t d">
  <title id="t">KFM source lanes by theme</title>
  <desc id="d">Seven themed clusters of public data providers — water, sky and air, earth and geology, land and agriculture, living things, history and people, and built world and hazards — connect to a gate ring around the KFM hub. The ring represents source, rights, sensitivity, and evidence checks that every source must pass before anything is published. A source lane is work in progress, not an active or admitted source.</desc>
  <defs>
    <radialGradient id="hub"><stop offset="0" stop-color="#A8C4EA"/><stop offset="1" stop-color="#0B1F3A"/></radialGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="698" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .link{stroke-dasharray:4 14;animation:link 2.4s linear infinite}
      @keyframes link{to{stroke-dashoffset:-36}}
      .gate{transform-origin:640px 380px;animation:gate 60s linear infinite}
      @keyframes gate{to{transform:rotate(360deg)}}
      .pulse{transform-origin:640px 380px;animation:pulse 4s ease-out infinite}
      @keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
      @media (prefers-reduced-motion: reduce){.link,.gate,.pulse{animation:none}.pulse{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="700" fill="#161B22"/>
    <text x="40" y="44" class="sans" font-size="14" letter-spacing="2.5" font-weight="700" fill="#A8C4EA">SOURCE LANES</text>
    <text x="40" y="70" class="sans" font-size="17" fill="#A8C4EA">Seven themes, dozens of public providers, one gate</text>
    <path class="link" style="animation-delay:-0.0s" d="M640.0,135.0 Q622.0,211.5 640.0,288.0" fill="none" stroke="#7FA9E3" stroke-width="2.4" stroke-linecap="round"/><path d="M640.0,135.0 Q622.0,211.5 640.0,288.0" fill="none" stroke="#7FA9E3" stroke-opacity=".18" stroke-width="2.4"/><path class="link" style="animation-delay:-0.6s" d="M956.6,227.2 Q823.1,260.9 711.9,322.6" fill="none" stroke="#A8C4EA" stroke-width="2.4" stroke-linecap="round"/><path d="M956.6,227.2 Q823.1,260.9 711.9,322.6" fill="none" stroke="#A8C4EA" stroke-opacity=".18" stroke-width="2.4"/><path class="link" style="animation-delay:-1.2s" d="M1034.8,434.5 Q886.3,399.9 729.7,400.5" fill="none" stroke="#D2A06A" stroke-width="2.4" stroke-linecap="round"/><path d="M1034.8,434.5 Q886.3,399.9 729.7,400.5" fill="none" stroke="#D2A06A" stroke-opacity=".18" stroke-width="2.4"/><path class="link" style="animation-delay:-1.8s" d="M815.7,600.7 Q764.0,524.0 679.9,462.9" fill="none" stroke="#DDBB55" stroke-width="2.4" stroke-linecap="round"/><path d="M815.7,600.7 Q764.0,524.0 679.9,462.9" fill="none" stroke="#DDBB55" stroke-opacity=".18" stroke-width="2.4"/><path class="link" style="animation-delay:-2.4s" d="M464.3,600.7 Q548.4,539.6 600.1,462.9" fill="none" stroke="#62B487" stroke-width="2.4" stroke-linecap="round"/><path d="M464.3,600.7 Q548.4,539.6 600.1,462.9" fill="none" stroke="#62B487" stroke-opacity=".18" stroke-width="2.4"/><path class="link" style="animation-delay:-3.0s" d="M245.2,434.5 Q401.7,435.0 550.3,400.5" fill="none" stroke="#E27B7B" stroke-width="2.4" stroke-linecap="round"/><path d="M245.2,434.5 Q401.7,435.0 550.3,400.5" fill="none" stroke="#E27B7B" stroke-opacity=".18" stroke-width="2.4"/><path class="link" style="animation-delay:-3.6s" d="M323.4,227.2 Q434.5,289.0 568.1,322.6" fill="none" stroke="#9AAABA" stroke-width="2.4" stroke-linecap="round"/><path d="M323.4,227.2 Q434.5,289.0 568.1,322.6" fill="none" stroke="#9AAABA" stroke-opacity=".18" stroke-width="2.4"/>
    <circle class="pulse" cx="640" cy="380" r="70" fill="none" stroke="#D9B440" stroke-width="2"/>
    <g class="gate"><circle cx="640" cy="380" r="92" fill="none" stroke="#D9B440" stroke-width="3" stroke-dasharray="22 10"/></g>
    <circle cx="640" cy="380" r="70" fill="url(#hub)"/>

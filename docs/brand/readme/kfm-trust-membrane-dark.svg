<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-labelledby="t d">
  <title id="t">The KFM trust membrane</title>
  <desc id="d">Diagram: on the public side, the Explorer map, reports and stories, exports and AI explanations read released public-safe artifacts and call a Governed API that applies policy, evidence and release checks and returns ANSWER, ABSTAIN, DENY or ERROR. A membrane separates them from internal stores: RAW, WORK/QUARANTINE, PROCESSED, CATALOG/TRIPLETS and model runtime. Static routes show the governed API path; an X marks a refused direct read of internal stores. No live request or policy decision is asserted.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="498" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}

    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="500" fill="#161B22"/>
<text x="40" y="48" class="lbl" fill="#B1BAC4">THE TRUST MEMBRANE</text><text x="40" y="76" class="sans" font-size="17" fill="#A8C4EA">Public clients only ever cross through governed interfaces. Internal stores stay inside.</text>
    <rect x="40" y="104" width="560" height="356" rx="16" fill="#0D1117" stroke="#30363D"/><text x="64" y="134" class="sans" font-size="12" font-weight="700" letter-spacing="1.6" fill="#62B487">OUTSIDE · PUBLIC</text>
    <rect x="760" y="104" width="480" height="356" rx="16" fill="#1E232B" stroke="#30363D"/><text x="784" y="134" class="sans" font-size="12" font-weight="700" letter-spacing="1.6" fill="#D2A06A">INSIDE · GOVERNED</text>
    <g transform="translate(64,154)"><rect width="200" height="54" rx="12" fill="#16263A" stroke="#7FA9E3" stroke-opacity=".6"/><text x="50" y="33" class="sans" font-size="14.5" font-weight="600" fill="#E6EDF3">Explorer map</text></g>
    <g transform="translate(64,224)"><rect width="200" height="54" rx="12" fill="#16263A" stroke="#7FA9E3" stroke-opacity=".6"/><text x="50" y="33" class="sans" font-size="14.5" font-weight="600" fill="#E6EDF3">Reports &amp; stories</text></g>
    <g transform="translate(64,294)"><rect width="200" height="54" rx="12" fill="#16263A" stroke="#7FA9E3" stroke-opacity=".6"/><text x="18" y="34" class="sans" font-size="18">⬇</text><text x="50" y="33" class="sans" font-size="14.5" font-weight="600" fill="#E6EDF3">Exports</text></g>
    <g transform="translate(64,364)"><rect width="200" height="54" rx="12" fill="#16263A" stroke="#7FA9E3" stroke-opacity=".6"/><text x="50" y="33" class="sans" font-size="14.5" font-weight="600" fill="#E6EDF3">AI explanations</text></g>
    <g transform="translate(316,170)"><rect width="262" height="76" rx="12" fill="#17261C" stroke="#62B487"/><text x="18" y="30" class="sans" font-size="14.5" font-weight="700" fill="#9FD3B0">Released public-safe artifacts</text><text x="18" y="52" class="sans" font-size="12.5" fill="#B1BAC4">tiles · manifests · bundles</text></g>
    <g transform="translate(316,300)"><rect width="262" height="96" rx="12" fill="#0D1117" stroke="#B1BAC4" stroke-width="2"/><text x="18" y="30" class="sans" font-size="14.5" font-weight="700" fill="#E6EDF3">Governed API</text><text x="18" y="52" class="sans" font-size="12.5" fill="#B1BAC4">policy · evidence · release checks</text><text x="18" y="74" class="mono" font-size="12" fill="#B1BAC4">ANSWER · ABSTAIN · DENY · ERROR</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="t d">
  <title id="t">History · Changelog — What changed, and where to prove it.</title>
  <desc id="d">Banner: a timeline of commit points appearing in sequence with illustrative milestone labels.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="218" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}
      .cm{animation:cm 6s ease-out infinite;opacity:0}@keyframes cm{0%{opacity:0}6%,90%{opacity:1}100%{opacity:0}}
      @media (prefers-reduced-motion: reduce){.cm{animation:none!important;opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="220" fill="#FAF7F0"/>
<rect width="1280" height="6" fill="#4A6FA5"/>
    <text x="48" y="60" class="lbl" fill="#4A6FA5">HISTORY · CHANGELOG</text>
    <text x="48" y="112" class="serif" font-size="38" fill="#0E1F3A">What changed, and where to prove it.</text>
    <text x="48" y="150" class="sans" font-size="16.5" fill="#4A4A4A">A human-readable history — not a release, promotion or publication record.</text>
    <g transform="translate(48,202)" class="sans" font-size="12" fill="#6B6B6B"><circle cx="5" cy="-4" r="4" fill="#4A6FA5"/><text x="16" y="0">Kansas Frontier Matrix</text></g>
    <line x1="776" y1="34" x2="776" y2="186" stroke="#D9CFBD"/>
<line x1="800" y1="110" x2="1240" y2="110" stroke="#8E5A2A" stroke-opacity=".5" stroke-width="2"/><circle class="cm" style="animation-delay:0.00s" cx="820" cy="110" r="7" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2.5"/><circle class="cm" style="animation-delay:0.45s" cx="870" cy="110" r="7" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2.5"/><circle class="cm" style="animation-delay:0.90s" cx="920" cy="110" r="7" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2.5"/><circle class="cm" style="animation-delay:1.35s" cx="970" cy="110" r="7" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2.5"/><circle class="cm" style="animation-delay:1.80s" cx="1020" cy="110" r="7" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2.5"/><circle class="cm" style="animation-delay:2.25s" cx="1070" cy="110" r="7" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2.5"/><circle class="cm" style="animation-delay:2.70s" cx="1120" cy="110" r="7" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2.5"/><circle class="cm" style="animation-delay:3.15s" cx="1170" cy="110" r="7" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2.5"/><circle class="cm" style="animation-delay:3.60s" cx="1220" cy="110" r="7" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2.5"/><g class="cm" style="animation-delay:0.00s"><line x1="820" y1="124" x2="820" y2="148" stroke="#4A6FA5"/><text x="820" y="166" text-anchor="middle" class="sans" font-size="12" fill="#1F3A66">seed</text></g><g class="cm" style="animation-delay:0.90s"><line x1="920" y1="96" x2="920" y2="72" stroke="#4A6FA5"/><text x="920" y="64" text-anchor="middle" class="sans" font-size="12" fill="#1F3A66">contracts</text></g><g class="cm" style="animation-delay:1.80s"><line x1="1020" y1="124" x2="1020" y2="148" stroke="#4A6FA5"/><text x="1020" y="166" text-anchor="middle" class="sans" font-size="12" fill="#1F3A66">Explorer</text></g><g class="cm" style="animation-delay:2.70s"><line x1="1120" y1="96" x2="1120" y2="72" stroke="#4A6FA5"/><text x="1120" y="64" text-anchor="middle" class="sans" font-size="12" fill="#1F3A66">local data</text></g><g class="cm" style="animation-delay:3.60s"><line x1="1220" y1="124" x2="1220" y2="148" stroke="#4A6FA5"/><text x="1220" y="166" text-anchor="middle" class="sans" font-size="12" fill="#1F3A66">showcase</text></g><text x="1240" y="190" text-anchor="end" class="sans" font-size="11" fill="#6B6B6B">illustrative milestones</text>
  </g>
  <rect x="1" y="1" width="1278" height="218" rx="18" fill="none" stroke="#D9CFBD" stroke-width="2"/>
</svg>

    <g class="m9"><line x1="1210.0" y1="178" x2="1210.0" y2="202" stroke="#1F3A66" stroke-width="1.5"/><circle cx="1210.0" cy="170" r="7" fill="#FAF7F0" stroke="#1F3A66" stroke-width="2.5"/><text x="1210.0" y="220" text-anchor="end" class="serif" font-size="20" fill="#0E1F3A">Today</text><text x="1210.0" y="240" text-anchor="end" class="sans" font-size="13" fill="#4A4A4A">Live streamflow</text></g>


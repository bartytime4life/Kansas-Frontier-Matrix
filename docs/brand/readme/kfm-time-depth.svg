<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="t d">
  <title id="t">Time depth in the KFM Explorer</title>
  <desc id="d">A timeline from 1800 to today. A playhead moves forward once while every milestone stays visible: 1800 temporal sweep begins, 1895 PRISM monthly climate, 1934 to 1996 USGS mine-map editions, 1940 ERA5 reanalysis, 1972 Landsat MSS, 1985 annual land cover, 1995 radar archive replay, 2005 HMS smoke polygons, 2015 SMAP soil moisture, and today live streamflow. Provider start dates do not promise complete Kansas coverage.</desc>
  <defs>
    <linearGradient id="trail" x1="0" x2="1"><stop offset="0" stop-color="#5E6E7C" stop-opacity="0"/><stop offset="1" stop-color="#5E6E7C" stop-opacity=".9"/></linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="298" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .head{animation:head 4s ease-out 1 both}@keyframes head{from{transform:translateX(0)}to{transform:translateX(1140px)}}
      @media (prefers-reduced-motion: reduce){.head{animation:none!important;transform:translateX(1140px)}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="300" fill="#FAF7F0"/>
    <text x="40" y="44" class="sans" font-size="14" letter-spacing="2.5" font-weight="700" fill="#8E5A2A">TIME DEPTH</text>

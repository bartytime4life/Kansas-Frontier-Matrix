    <g class="m2"><rect x="459.2" y="165" width="427.1" height="10" rx="5" fill="#8E5A2A" fill-opacity=".45"/><line x1="459.2" y1="130" x2="459.2" y2="162" stroke="#1F3A66" stroke-width="1.5"/><circle cx="459.2" cy="170" r="7" fill="#FAF7F0" stroke="#1F3A66" stroke-width="2.5"/><text x="459.2" y="112" text-anchor="middle" class="serif" font-size="20" fill="#0E1F3A">1934–1996</text><text x="459.2" y="132" text-anchor="middle" class="sans" font-size="13" fill="#4A4A4A">USGS mine-map editions</text></g>
    <g class="m3"><line x1="483.7" y1="178" x2="483.7" y2="202" stroke="#1F3A66" stroke-width="1.5"/><circle cx="483.7" cy="170" r="7" fill="#FAF7F0" stroke="#1F3A66" stroke-width="2.5"/><text x="483.7" y="220" text-anchor="middle" class="serif" font-size="20" fill="#0E1F3A">1940</text><text x="483.7" y="240" text-anchor="middle" class="sans" font-size="13" fill="#4A4A4A">ERA5 reanalysis</text></g>
    <g class="m4"><line x1="627.4" y1="130" x2="627.4" y2="162" stroke="#1F3A66" stroke-width="1.5"/><circle cx="627.4" cy="170" r="7" fill="#FAF7F0" stroke="#1F3A66" stroke-width="2.5"/><text x="627.4" y="112" text-anchor="middle" class="serif" font-size="20" fill="#0E1F3A">1972</text><text x="627.4" y="132" text-anchor="middle" class="sans" font-size="13" fill="#4A4A4A">Landsat MSS</text></g>

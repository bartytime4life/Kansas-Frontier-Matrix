<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="t d">
  <title id="t">Doctrine · Trust Membrane — Public clients never reach inside.</title>
  <desc id="d">Banner: a public client and a Governed API on one side of a membrane, internal stores on the other; fixed routes distinguish the governed API path from a refused direct read.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="218" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}

    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="220" fill="#161B22"/>
<rect width="1280" height="6" fill="#B1BAC4"/>
    <text x="48" y="60" class="lbl" fill="#B1BAC4">DOCTRINE · TRUST MEMBRANE</text>
    <text x="48" y="112" class="serif" font-size="40" fill="#E6EDF3">Public clients never reach inside.</text>
    <text x="48" y="150" class="sans" font-size="16.5" fill="#B1BAC4">Every public view crosses governed interfaces and released artifacts — never</text><text x="48" y="172" class="sans" font-size="16.5" fill="#B1BAC4">internal stores.</text>
    <g transform="translate(48,202)" class="sans" font-size="12" fill="#9198A1"><circle cx="5" cy="-4" r="4" fill="#B1BAC4"/><text x="16" y="0">Kansas Frontier Matrix</text></g>
    <line x1="776" y1="34" x2="776" y2="186" stroke="#30363D"/>
<g class="sans" font-size="12.5"><rect x="800" y="60" width="150" height="40" rx="10" fill="#16263A" stroke="#7FA9E3" stroke-opacity=".6"/><text x="816" y="85" fill="#E6EDF3">Public client</text>
    <rect x="800" y="120" width="150" height="40" rx="10" fill="#0D1117" stroke="#B1BAC4" stroke-width="2"/><text x="816" y="145" fill="#E6EDF3">Governed API</text>
    <rect x="1060" y="50" width="170" height="120" rx="12" fill="#1E232B" stroke="#30363D"/><text x="1078" y="76" class="mono" font-size="12" fill="#D2A06A">RAW</text><text x="1078" y="100" class="mono" font-size="12" fill="#D2A06A">QUARANTINE</text><text x="1078" y="124" class="mono" font-size="12" fill="#D2A06A">PROCESSED</text><text x="1078" y="148" class="mono" font-size="12" fill="#D2A06A">CATALOG</text></g>
    <path d="M1010,30 Q1000,40 1010,50 Q1020,60 1010,70 Q1000,80 1010,90 Q1020,100 1010,110 Q1000,120 1010,130 Q1020,140 1010,150 Q1000,160 1010,170 Q1020,180 1010,190" fill="none" stroke="#B1BAC4" stroke-width="4" stroke-linecap="round"/>
    <rect x="998" y="124" width="24" height="34" rx="6" fill="#B1BAC4"/>


    <path d="M950,140 H998 M1022,140 L1054,116 M1046,116 H1054 V124" fill="none" stroke="#7FA9E3" stroke-width="2.5"/>
    <path d="M950,80 H994 M994,74 L1006,86 M1006,74 L994,86" fill="none" stroke="#E27B7B" stroke-width="2.5"/>
    <text x="800" y="194" class="sans" font-size="11.5" fill="#B1BAC4">API only · direct read denied</text>
  </g>
  <rect x="1" y="1" width="1278" height="218" rx="18" fill="none" stroke="#30363D" stroke-width="2"/>
</svg>

  <title id="t">Atmosphere and soil — sky to soil context</title>
  <desc id="d">Illustration of atmosphere and soil context: a Kansas outline filled with crossfading soil-moisture cells and drifting wind wisps, beside a list of layers: NASA SMAP soil moisture, GFS forecast wind, NOAA HMS smoke, and NOAA-20 thermal detections.</desc>

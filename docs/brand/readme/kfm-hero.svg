<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">Kansas Frontier Matrix — place, time, and evidence</title>
  <desc id="d">Illustrative banner. A stylized outline of Kansas with its major rivers, a dot matrix, observation points, and a time sweep moving west to east across eras from 1800 to today. Decorative artwork, not a map product or data display.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#132C50"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#C9A227" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="matrix" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.1" fill="#DCE6F2" fill-opacity="0.22"/>
    </pattern>
    <clipPath id="ks">
      <path d="M0,0 H543 L551,10 548,24 558,36 570,48 566,62 580,74 590,84 600,93 V310 H0 Z"/>
    </clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .river{fill:none;stroke:#7FA6D6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:#DCE6F2;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 15;animation:flow 3.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-36}}
      .sweep{animation:sweep 15s cubic-bezier(.2,.6,.3,1) infinite;animation-delay:-1s}
      @keyframes sweep{0%{transform:translateX(-160px)}100%{transform:translateX(600px)}}
      .ring{fill:none;stroke:#C9A227;stroke-width:1.5;transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 4.5s ease-out infinite}
      @keyframes ring{0%{transform:scale(.4);opacity:.9}70%{opacity:0}100%{transform:scale(3.4);opacity:0}}
      .ring{animation-delay:-.4s}.r2{animation-delay:-1.3s}.r3{animation-delay:-2.2s}.r4{animation-delay:-3.1s}.r5{animation-delay:-4s}
      .yr{opacity:0;animation:yr 15s ease-out infinite}
      @keyframes yr{0%,2%{opacity:0}5%,17%{opacity:1}20%,100%{opacity:0}}
      .yr{animation-delay:-1s}.y2{animation-delay:2s}.y3{animation-delay:5s}.y4{animation-delay:8s}.y5{animation-delay:11s}
      .ystatic{opacity:0}
      @media (prefers-reduced-motion: reduce){
        .flow,.sweep,.ring,.yr{animation:none}
        .sweep{transform:translateX(420px)}
        .yr{opacity:0}.ystatic{opacity:1}
      }
    </style>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <!-- faint graticule -->
  <g stroke="#DCE6F2" stroke-opacity="0.06" stroke-width="1">
    <path d="M0,110 H1280 M0,220 H1280 M0,330 H1280 M320,0 V440 M640,0 V440 M960,0 V440"/>
  </g>

  <!-- left: wordmark and tagline -->
  <g transform="translate(64,0)">
    <text x="0" y="112" class="sans" font-size="15" letter-spacing="4" fill="#C9A227" font-weight="600">KANSAS FRONTIER MATRIX</text>
    <text x="0" y="178" class="serif" font-size="54" fill="#FFFFFF">Place. Time.</text>
    <text x="0" y="238" class="serif" font-size="54" fill="#FFFFFF">Evidence.</text>
    <text x="0" y="284" class="sans" font-size="18" fill="#DCE6F2">A map-first atlas of Kansas where every layer</text>
    <text x="0" y="310" class="sans" font-size="18" fill="#DCE6F2">shows its source, its clock, and its limits.</text>
    <g transform="translate(0,348)" class="sans" font-size="13" fill="#DCE6F2">
      <rect width="98" height="28" rx="14" fill="none" stroke="#C9A227" stroke-opacity="0.7"/>
      <text x="49" y="18.5" text-anchor="middle">map-first</text>
      <rect x="108" width="104" height="28" rx="14" fill="none" stroke="#C9A227" stroke-opacity="0.7"/>
      <text x="160" y="18.5" text-anchor="middle">time-aware</text>
      <rect x="222" width="118" height="28" rx="14" fill="none" stroke="#C9A227" stroke-opacity="0.7"/>
      <text x="281" y="18.5" text-anchor="middle">evidence-first</text>
    </g>
  </g>

  <!-- right: Kansas -->
  <g transform="translate(616,62)">
    <path d="M0,0 H543 L551,10 548,24 558,36 570,48 566,62 580,74 590,84 600,93 V310 H0 Z" fill="#1F3A66" fill-opacity="0.55"/>
    <g clip-path="url(#ks)">
      <rect width="600" height="310" fill="url(#matrix)"/>
      <g class="sweep"><rect x="0" y="0" width="160" height="310" fill="url(#sweep)"/></g>
    </g>
    <path d="M0,0 H543 L551,10 548,24 558,36 570,48 566,62 580,74 590,84 600,93 V310 H0 Z" fill="none" stroke="#C9A227" stroke-width="2" stroke-linejoin="round"/>

    <!-- rivers (stylized) -->
    <g>
      <polyline class="river" points="0,201.5 52.3,206.7 84.6,209.8 124.8,222.2 165.1,232.5 197.3,222.2 221.5,211.8 245.6,186 264.2,169.5 289.9,175.7 310.1,186 334.2,200.5 358.4,217 380.1,238.7 390.6,268.7 403.5,310"/>
      <polyline class="river" points="0,113.7 44.3,115.7 84.6,118.8 140.9,120.9 205.4,118.8 253.7,126.1 277.9,129.2 318.1,126.1 357.6,119.9 390.6,108.5 420.4,100.2 441.3,84.7 471.1,90.9 513,98.2 549.3,106.4 575.8,96.1 598.4,92"/>
      <polyline class="river" stroke-width="1.6" points="326.2,0 346.3,20.7 358.4,41.3 374.5,56.8 390.6,72.3 406.7,87.8 420.4,100.2"/>
      <polyline class="river" stroke-width="1.6" points="414.8,113.7 447,144.7 472.8,165.3 503.4,196.3 527.5,222.2 543.6,248 567.8,284.2 579.9,310"/>
      <polyline class="river" stroke-width="1.6" points="124.8,56.8 181.2,56.8 245.6,62 302,72.3 342.3,93 357.6,119.9"/>
      <polyline class="flow" points="0,201.5 52.3,206.7 84.6,209.8 124.8,222.2 165.1,232.5 197.3,222.2 221.5,211.8 245.6,186 264.2,169.5 289.9,175.7 310.1,186 334.2,200.5 358.4,217 380.1,238.7 390.6,268.7 403.5,310"/>
      <polyline class="flow" points="0,113.7 44.3,115.7 84.6,118.8 140.9,120.9 205.4,118.8 253.7,126.1 277.9,129.2 318.1,126.1 357.6,119.9 390.6,108.5 420.4,100.2 441.3,84.7 471.1,90.9 513,98.2 549.3,106.4 575.8,96.1 598.4,92"/>
    </g>

    <!-- observation points -->
    <g fill="#FAF7F0">
      <circle cx="380.1" cy="238.7" r="3.6"/><circle class="ring" cx="380.1" cy="238.7" r="5"/>
      <circle cx="513" cy="98.2" r="3.6"/><circle class="ring r2" cx="513" cy="98.2" r="5"/>
      <circle cx="163.5" cy="232.5" r="3.6"/><circle class="ring r3" cx="163.5" cy="232.5" r="5"/>
      <circle cx="357.6" cy="119.9" r="3.6"/><circle class="ring r4" cx="357.6" cy="119.9" r="5"/>
      <circle cx="80.5" cy="62" r="3.6"/><circle class="ring r5" cx="80.5" cy="62" r="5"/>
      <circle cx="219.1" cy="115.7" r="2.6"/><circle cx="472.8" cy="165.3" r="2.6"/>
      <circle cx="264.2" cy="169.5" r="2.6"/><circle cx="591.9" cy="267.6" r="2.6"/>
      <circle cx="95" cy="209.8" r="2.6"/><circle cx="441.3" cy="84.7" r="2.6"/>
    </g>

    <!-- era label -->
    <g class="sans" font-size="13" fill="#C9A227" letter-spacing="1.5" font-weight="600">
      <text class="yr" x="600" y="338" text-anchor="end">1800 · TEMPORAL SWEEP BEGINS</text>
      <text class="yr y2" x="600" y="338" text-anchor="end">1895 · CLIMATE HISTORY</text>
      <text class="yr y3" x="600" y="338" text-anchor="end">1995 · RADAR REPLAY</text>
      <text class="yr y4" x="600" y="338" text-anchor="end">2015 · SATELLITE SOIL MOISTURE</text>
      <text class="yr y5" x="600" y="338" text-anchor="end">TODAY · LIVE STREAMFLOW</text>
      <text class="ystatic" x="600" y="338" text-anchor="end">1800 → TODAY</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="t d">
  <title id="t">Register · Verification Backlog — Know it, propose it, or check it.</title>
  <desc id="d">Banner: three columns — needs verification, proposed, confirmed — with separate, fixed cards; no status transition is asserted.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="t d">
  <title id="t">Runbook · Acquisition — Choose exact bytes. Plan first. Stay under the cap.</title>
  <desc id="d">Banner: a local cache meter filling toward a 500 GB cap beside selected source families: PRISM from 1895, Landsat from 1972, NLCD 1985–2025, and a 512 MiB National Water Model capture.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="218" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}
      .fill{transform-box:fill-box;transform-origin:0 50%;animation:fillm 4s cubic-bezier(.3,.6,.3,1) 1 both}@keyframes fillm{0%{transform:scaleX(.08)}60%,90%{transform:scaleX(.62)}100%{transform:scaleX(.08)}}
      .pk{opacity:1}@keyframes pk{0%{opacity:.25}10%,90%{opacity:1}100%{opacity:.25}}
      @media (prefers-reduced-motion: reduce){.fill,.pk{animation:none!important}.fill{transform:scaleX(.62)}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="220" fill="#161B22"/>
<rect width="1280" height="6" fill="#62B487"/>
    <text x="48" y="60" class="lbl" fill="#62B487">RUNBOOK · ACQUISITION</text>
    <text x="48" y="112" class="serif" font-size="27" fill="#E6EDF3">Choose exact bytes. Plan first. Stay under the cap.</text>
    <text x="48" y="150" class="sans" font-size="16.5" fill="#B1BAC4">A 500 GB local cache limit, offline plans, and no paid storage, requester-pays</text><text x="48" y="172" class="sans" font-size="16.5" fill="#B1BAC4">or billing.</text>
    <g transform="translate(48,202)" class="sans" font-size="12" fill="#9198A1"><circle cx="5" cy="-4" r="4" fill="#62B487"/><text x="16" y="0">Kansas Frontier Matrix</text></g>
    <line x1="776" y1="34" x2="776" y2="186" stroke="#30363D"/>
<g class="sans" font-size="12.5"><text x="800" y="60" fill="#A8C4EA" font-weight="700">local cache</text><text x="1240" y="60" text-anchor="end" fill="#9198A1">500 GB cap</text>
    <rect x="800" y="72" width="440" height="26" rx="13" fill="#2B2519"/><g class="fill"><rect x="800" y="72" width="440" height="26" rx="13" fill="#62B487"/></g>
    <line x1="1240" y1="64" x2="1240" y2="106" stroke="#E27B7B" stroke-width="2"/>
    <g class="pk" style="animation-delay:0s"><rect x="800" y="120" width="100" height="56" rx="10" fill="#0D1117" stroke="#30363D"/><text x="812" y="143" class="mono" font-size="11" fill="#E6EDF3">PRISM</text><text x="812" y="162" font-size="11" fill="#9198A1">from 1895</text></g><g class="pk" style="animation-delay:0s"><rect x="912" y="120" width="100" height="56" rx="10" fill="#0D1117" stroke="#30363D"/><text x="924" y="143" class="mono" font-size="11" fill="#E6EDF3">Landsat</text><text x="924" y="162" font-size="11" fill="#9198A1">from 1972</text></g><g class="pk" style="animation-delay:0s"><rect x="1024" y="120" width="100" height="56" rx="10" fill="#0D1117" stroke="#30363D"/><text x="1036" y="143" class="mono" font-size="11" fill="#E6EDF3">NLCD</text><text x="1036" y="162" font-size="11" fill="#9198A1">1985–2025</text></g><g class="pk" style="animation-delay:0s"><rect x="1136" y="120" width="100" height="56" rx="10" fill="#0D1117" stroke="#30363D"/><text x="1148" y="143" class="mono" font-size="11" fill="#E6EDF3">NWM</text><text x="1148" y="162" font-size="11" fill="#9198A1">≤512 MiB</text></g></g>
  </g>
  <rect x="1" y="1" width="1278" height="218" rx="18" fill="none" stroke="#30363D" stroke-width="2"/>
</svg>

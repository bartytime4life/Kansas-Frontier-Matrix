    <text x="48" y="112" class="serif" font-size="33" fill="#0E1F3A">Promotion is a decision, not a file move.</text>
    <text x="48" y="150" class="sans" font-size="16.5" fill="#4A4A4A">RAW → WORK / QUARANTINE → PROCESSED → CATALOG / TRIPLETS → PUBLISHED</text>

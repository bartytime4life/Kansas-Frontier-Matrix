      .pick{animation:pick 9s ease-out infinite}@keyframes pick{0%,40%{opacity:0}48%,88%{opacity:1}96%,100%{opacity:0}}
      @media (prefers-reduced-motion: reduce){.sec,.pick{animation:none!important}}
    </style>

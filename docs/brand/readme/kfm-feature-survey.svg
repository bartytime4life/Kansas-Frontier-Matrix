<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
  <title id="t">Survey and land records — PLSS townships and sections</title>
  <desc id="d">Illustration: a Public Land Survey System township of 36 sections numbered in the standard back-and-forth order from the northeast corner, with one section highlighted. Beside it: PLSS townships, sections, intersected survey identifiers and direct-match oil and gas lease cases, noted as survey reference rather than parcels, title or access.</desc>

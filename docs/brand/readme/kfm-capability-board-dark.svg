<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 512" width="1280" height="512" role="img" aria-labelledby="t d">
  <title id="t">KFM Explorer capability board</title>
  <desc id="d">All 23 features from the Explorer's site-features registry grouped by declared status: 7 LIVE UI (map investigation shell, layer catalog, priority context deck, Evidence Drawer and trust membrane, reports and guided stories, source observatory and intake, data commons and steward desk); 12 ACTIVE CONTEXT (hydrology and River Pulse, earthquakes, smoke and weather, airflow forecast, lightning density, 3DEP terrain, roads rail and bridges, FEMA disaster sources, BLM PLSS survey grid, BLM oil and gas leases, 3D appearance and loading, daily real-data baseline); 2 BOUNDED PROOF (Event Observatory, Focus Mode); 2 HELD (Raspberry Shake waveforms, LiDAR lineage receipts).</desc>

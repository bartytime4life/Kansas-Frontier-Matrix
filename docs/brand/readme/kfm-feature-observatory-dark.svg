<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
  <title id="t">Event Observatory — radar and smoke replay</title>
  <desc id="d">Illustration of the Event Observatory: stylized radar echoes cross a Kansas outline while a playhead moves along an hourly archive timeline from 1995 to the recent hour.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="598" height="338" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}

      .storm{animation:storm 12s linear infinite;opacity:0}
      .s0{animation-delay:-2s}.s1{animation-delay:-6s}.s2{animation-delay:-10s}
      @keyframes storm{0%{transform:translateX(-80px);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateX(560px);opacity:0}}
      .head{animation:head 12s linear infinite;animation-delay:-6s}
      @keyframes head{from{transform:translateX(0)}to{transform:translateX(540px)}}
      @media (prefers-reduced-motion: reduce){.storm,.head{animation:none}.storm{opacity:1}.s1,.s2{opacity:.6}.head{transform:translateX(380px)}}
    </style>
  </defs>

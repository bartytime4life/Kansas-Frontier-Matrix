<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">Find your contributor path</title>
  <desc id="d">Six contributor paths — Explorer developer (apps/site/source), data engineer (connectors and pipelines), historian and archivist (docs/sources), scientist and ecologist (domain atlas and fixtures), cartographer and designer (docs/brand), and accessibility reviewer (accessibility commitments) — flow into one destination: a small draft pull request with one goal, its checks and a rollback.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="468" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}
      .flow{animation:flow 2.4s linear 1 both}@keyframes flow{to{stroke-dashoffset:-32}}
      .card{animation:bob 4s ease-in-out 1 both}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .halo{transform-box:fill-box;transform-origin:center;animation:halo 3s ease-out 1 both}@keyframes halo{0%{transform:scale(1);opacity:.9}100%{transform:scale(5);opacity:0}}
      @media (prefers-reduced-motion: reduce){.flow,.card,.halo{animation:none!important}.halo{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="470" fill="#161B22"/>
<text x="40" y="48" class="lbl" fill="#62B487">FIND YOUR PATH</text><text x="40" y="76" class="sans" font-size="17" fill="#A8C4EA">Every kind of expertise has a place to start. Every path ends in a small, inspectable draft pull request.</text>
    <g transform="translate(47,110)"><g class="card" style="animation-delay:0s"><rect width="186" height="128" rx="14" fill="#0D1117" stroke="#A8C4EA" stroke-opacity=".5"/><rect width="186" height="5" rx="2" fill="#A8C4EA"/><text x="18" y="78" class="sans" font-size="14.5" font-weight="700" fill="#E6EDF3">Explorer developer</text><text x="18" y="100" class="sans" font-size="11.5" fill="#9198A1">start in</text><text x="18" y="116" class="mono" font-size="11" fill="#A8C4EA">apps/site/source/</text></g></g>
    <path d="M140,248 C140,318 640,302 640,362" fill="none" stroke="#A8C4EA" stroke-opacity=".25" stroke-width="2.4"/><path class="flow" style="animation-delay:0s" d="M140,248 C140,318 640,302 640,362" fill="none" stroke="#A8C4EA" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 13"/>
    <g transform="translate(247,110)"><g class="card" style="animation-delay:-0.6s"><rect width="186" height="128" rx="14" fill="#0D1117" stroke="#7FA9E3" stroke-opacity=".5"/><rect width="186" height="5" rx="2" fill="#7FA9E3"/><text x="18" y="78" class="sans" font-size="14.5" font-weight="700" fill="#E6EDF3">Data engineer</text><text x="18" y="100" class="sans" font-size="11.5" fill="#9198A1">start in</text><text x="18" y="116" class="mono" font-size="11" fill="#7FA9E3">connectors/ · pipelines/</text></g></g>
    <path d="M340,248 C340,318 640,302 640,362" fill="none" stroke="#7FA9E3" stroke-opacity=".25" stroke-width="2.4"/><path class="flow" style="animation-delay:-0.3s" d="M340,248 C340,318 640,302 640,362" fill="none" stroke="#7FA9E3" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 13"/>
    <g transform="translate(447,110)"><g class="card" style="animation-delay:-1.2s"><rect width="186" height="128" rx="14" fill="#0D1117" stroke="#E27B7B" stroke-opacity=".5"/><rect width="186" height="5" rx="2" fill="#E27B7B"/><text x="18" y="78" class="sans" font-size="14.5" font-weight="700" fill="#E6EDF3">Historian &amp; archivist</text><text x="18" y="100" class="sans" font-size="11.5" fill="#9198A1">start in</text><text x="18" y="116" class="mono" font-size="11" fill="#E27B7B">docs/sources/</text></g></g>
    <path d="M540,248 C540,318 640,302 640,362" fill="none" stroke="#E27B7B" stroke-opacity=".25" stroke-width="2.4"/><path class="flow" style="animation-delay:-0.6s" d="M540,248 C540,318 640,302 640,362" fill="none" stroke="#E27B7B" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 13"/>
    <g transform="translate(647,110)"><g class="card" style="animation-delay:-1.8s"><rect width="186" height="128" rx="14" fill="#0D1117" stroke="#62B487" stroke-opacity=".5"/><rect width="186" height="5" rx="2" fill="#62B487"/><text x="18" y="78" class="sans" font-size="14.5" font-weight="700" fill="#E6EDF3">Scientist &amp; ecologist</text><text x="18" y="100" class="sans" font-size="11.5" fill="#9198A1">start in</text><text x="18" y="116" class="mono" font-size="11" fill="#62B487">domain atlas · fixtures/</text></g></g>
    <path d="M740,248 C740,318 640,302 640,362" fill="none" stroke="#62B487" stroke-opacity=".25" stroke-width="2.4"/><path class="flow" style="animation-delay:-0.9s" d="M740,248 C740,318 640,302 640,362" fill="none" stroke="#62B487" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 13"/>
    <g transform="translate(847,110)"><g class="card" style="animation-delay:-2.4s"><rect width="186" height="128" rx="14" fill="#0D1117" stroke="#D2A06A" stroke-opacity=".5"/><rect width="186" height="5" rx="2" fill="#D2A06A"/><text x="18" y="78" class="sans" font-size="14.5" font-weight="700" fill="#E6EDF3">Cartographer &amp; designer</text><text x="18" y="100" class="sans" font-size="11.5" fill="#9198A1">start in</text><text x="18" y="116" class="mono" font-size="11" fill="#D2A06A">docs/brand/</text></g></g>
    <path d="M940,248 C940,318 640,302 640,362" fill="none" stroke="#D2A06A" stroke-opacity=".25" stroke-width="2.4"/><path class="flow" style="animation-delay:-1.2s" d="M940,248 C940,318 640,302 640,362" fill="none" stroke="#D2A06A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 13"/>
    <g transform="translate(1047,110)"><g class="card" style="animation-delay:-3s"><rect width="186" height="128" rx="14" fill="#0D1117" stroke="#B1BAC4" stroke-opacity=".5"/><rect width="186" height="5" rx="2" fill="#B1BAC4"/><text x="18" y="78" class="sans" font-size="14.5" font-weight="700" fill="#E6EDF3">Accessibility reviewer</text><text x="18" y="100" class="sans" font-size="11.5" fill="#9198A1">start in</text><text x="18" y="116" class="mono" font-size="11" fill="#B1BAC4">docs/brand/ · a11y</text></g></g>
    <path d="M1140,248 C1140,318 640,302 640,362" fill="none" stroke="#B1BAC4" stroke-opacity=".25" stroke-width="2.4"/><path class="flow" style="animation-delay:-1.5s" d="M1140,248 C1140,318 640,302 640,362" fill="none" stroke="#B1BAC4" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 13"/>
    <g transform="translate(640,392)"><circle class="halo" r="34" fill="#B1BAC4" fill-opacity=".18"/><rect x="-150" y="-28" width="300" height="56" rx="28" fill="#0B1F3A"/><text x="0" y="-3" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#FFFFFE">Draft pull request</text><text x="0" y="16" text-anchor="middle" class="sans" font-size="12" fill="#DCE6F3">one goal · its checks · a rollback</text></g>
  </g>
  <rect x="1" y="1" width="1278" height="468" rx="18" fill="none" stroke="#30363D" stroke-width="2"/>
</svg>

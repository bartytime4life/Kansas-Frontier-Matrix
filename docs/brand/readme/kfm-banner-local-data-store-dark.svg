<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="t d">
  <title id="t">Runbook · Local Pc Data Store — Your files, kept private and verifiable.</title>
  <desc id="d">Banner: files fly from a downloads folder through plan, sync and verify into a private QUARANTINE store outside the Git checkout.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="218" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}
      .f{animation:fly 4s cubic-bezier(.4,0,.3,1) 1 both;opacity:0}.f1{animation-delay:-1.33s}.f2{animation-delay:-2.67s}
      @keyframes fly{0%{transform:translate(860px,115px);opacity:0}10%{opacity:1}45%{transform:translate(1000px,96px) rotate(8deg)}75%{transform:translate(1150px,110px) scale(.5);opacity:1}85%,100%{transform:translate(1150px,110px) scale(.2);opacity:0}}
      @media (prefers-reduced-motion: reduce){.f{animation:none!important}.f0{opacity:1;transform:translate(1000px,96px)}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="220" fill="#161B22"/>
<rect width="1280" height="6" fill="#D2A06A"/>
    <text x="48" y="60" class="lbl" fill="#D2A06A">RUNBOOK · LOCAL PC DATA STORE</text>
    <text x="48" y="112" class="serif" font-size="34" fill="#E6EDF3">Your files, kept private and verifiable.</text>
    <text x="48" y="150" class="sans" font-size="16.5" fill="#B1BAC4">doctor → init → plan → sync → verify, into a quarantine store outside the</text><text x="48" y="172" class="sans" font-size="16.5" fill="#B1BAC4">checkout.</text>
    <g transform="translate(48,202)" class="sans" font-size="12" fill="#9198A1"><circle cx="5" cy="-4" r="4" fill="#D2A06A"/><text x="16" y="0">Kansas Frontier Matrix</text></g>
    <line x1="776" y1="34" x2="776" y2="186" stroke="#30363D"/>
<g class="sans" font-size="12"><path d="M800,70 h46 l10,10 h64 v80 h-120 Z" fill="#2B2519" stroke="#D2A06A"/><text x="810" y="178" fill="#9198A1">your downloads</text>
    <rect x="1090" y="50" width="140" height="120" rx="14" fill="#0D1117" stroke="#D2A06A" stroke-width="2.5"/><rect x="1090" y="50" width="140" height="28" rx="14" fill="#D2A06A"/><rect x="1090" y="64" width="140" height="14" fill="#D2A06A"/><text x="1160" y="69" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#0B1F3A">QUARANTINE</text>
    <text x="1104" y="100" class="mono" font-size="10.5" fill="#9198A1">sha256/9f…/payload</text><text x="1104" y="118" class="mono" font-size="10.5" fill="#9198A1">runs/…/manifest.json</text><text x="1104" y="136" class="mono" font-size="10.5" fill="#9198A1">ingest-receipt.json</text><text x="1104" y="160" font-size="11" fill="#D2A06A">outside the checkout</text></g>
    <g class="sans" font-size="11.5"><g transform="translate(960,60)"><rect width="76" height="22" rx="11" fill="#0D1117" stroke="#30363D"/><text x="38" y="15" text-anchor="middle" class="mono" font-size="11" fill="#A8C4EA">plan</text></g><g transform="translate(960,90)"><rect width="76" height="22" rx="11" fill="#0D1117" stroke="#30363D"/><text x="38" y="15" text-anchor="middle" class="mono" font-size="11" fill="#A8C4EA">sync</text></g><g transform="translate(960,120)"><rect width="76" height="22" rx="11" fill="#0D1117" stroke="#30363D"/><text x="38" y="15" text-anchor="middle" class="mono" font-size="11" fill="#A8C4EA">verify</text></g></g><g class="f f0"><rect x="-9" y="-11" width="18" height="22" rx="2" fill="#0D1117" stroke="#7FA9E3" stroke-width="1.5"/><path d="M-5,-4 h10 M-5,1 h10 M-5,6 h7" stroke="#7FA9E3" stroke-width="1.2"/></g><g class="f f1"><rect x="-9" y="-11" width="18" height="22" rx="2" fill="#0D1117" stroke="#7FA9E3" stroke-width="1.5"/><path d="M-5,-4 h10 M-5,1 h10 M-5,6 h7" stroke="#7FA9E3" stroke-width="1.2"/></g><g class="f f2"><rect x="-9" y="-11" width="18" height="22" rx="2" fill="#0D1117" stroke="#7FA9E3" stroke-width="1.5"/><path d="M-5,-4 h10 M-5,1 h10 M-5,6 h7" stroke="#7FA9E3" stroke-width="1.2"/></g>
  </g>
  <rect x="1" y="1" width="1278" height="218" rx="18" fill="none" stroke="#30363D" stroke-width="2"/>
</svg>

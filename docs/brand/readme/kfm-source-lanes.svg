    <circle class="pulse" cx="640" cy="380" r="70" fill="none" stroke="#C9A227" stroke-width="2"/>
    <g class="gate"><circle cx="640" cy="380" r="92" fill="none" stroke="#C9A227" stroke-width="3" stroke-dasharray="22 10"/></g>
    <circle cx="640" cy="380" r="70" fill="url(#hub)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 350" width="1280" height="350" role="img" aria-labelledby="t d">
  <title id="t">KFM data lifecycle</title>
  <desc id="d">Five lifecycle stages left to right: RAW, WORK or QUARANTINE, PROCESSED, CATALOG or TRIPLETS, and PUBLISHED, separated by gates for source and rights, sensitivity and validation, evidence and lineage, and review and release. Animated tokens show three outcomes: one reaches PUBLISHED, one is held at quarantine because rights or sensitivity are unclear, and one ends in ABSTAIN or DENY because evidence is not resolved.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="348" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .tok{opacity:0}
      .t1{animation:t1 12s cubic-bezier(.4,0,.3,1) infinite}
      .t2{animation:t2 12s cubic-bezier(.4,0,.3,1) infinite;animation-delay:-4s}
      .t3{animation:t3 12s cubic-bezier(.4,0,.3,1) infinite;animation-delay:-8s}
      @keyframes t1{0%{transform:translate(120px,0);opacity:0}4%{opacity:1}20%{transform:translate(370px,0)}40%{transform:translate(620px,0)}60%{transform:translate(870px,0)}80%,92%{transform:translate(1120px,0);opacity:1}100%{transform:translate(1120px,0);opacity:0}}
      @keyframes t2{0%{transform:translate(120px,0);opacity:0}4%{opacity:1}24%{transform:translate(370px,0)}40%{transform:translate(370px,52px)}55%,85%{transform:translate(470px,52px);opacity:1}100%{transform:translate(470px,52px);opacity:0}}
      @keyframes t3{0%{transform:translate(120px,0);opacity:0}4%{opacity:1}20%{transform:translate(370px,0)}40%{transform:translate(620px,0)}60%{transform:translate(870px,0)}72%{transform:translate(870px,52px)}80%,90%{transform:translate(900px,52px);opacity:1}100%{transform:translate(900px,52px);opacity:0}}
      @media (prefers-reduced-motion: reduce){.tok{animation:none!important;opacity:1}.t1{transform:translate(1120px,0)}.t2{transform:translate(456px,52px)}.t3{transform:translate(886px,52px)}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="350" fill="#FAF7F0"/>
    <text x="40" y="44" class="sans" font-size="14" letter-spacing="2.5" font-weight="700" fill="#3B7A57">THE TRUST PATH</text>
    <text x="40" y="70" class="sans" font-size="17" fill="#1F3A66">Promotion is a governed decision, not a file move</text>
    <line x1="212" y1="168" x2="278" y2="168" stroke="#8E5A2A" stroke-width="2" stroke-opacity=".5"/><rect x="240.0" y="146" width="10" height="44" rx="3" fill="#C9A227"/><line x1="245.0" y1="108" x2="245.0" y2="144" stroke="#C9A227" stroke-width="1.2" stroke-dasharray="2 3"/><text x="245.0" y="102" text-anchor="middle" class="sans" font-size="12.5" fill="#8E5A2A">source + rights</text><line x1="462" y1="168" x2="528" y2="168" stroke="#8E5A2A" stroke-width="2" stroke-opacity=".5"/><rect x="490.0" y="146" width="10" height="44" rx="3" fill="#C9A227"/><line x1="495.0" y1="108" x2="495.0" y2="144" stroke="#C9A227" stroke-width="1.2" stroke-dasharray="2 3"/><text x="495.0" y="102" text-anchor="middle" class="sans" font-size="12.5" fill="#8E5A2A">sensitivity + validation</text><line x1="712" y1="168" x2="778" y2="168" stroke="#8E5A2A" stroke-width="2" stroke-opacity=".5"/><rect x="740.0" y="146" width="10" height="44" rx="3" fill="#C9A227"/><line x1="745.0" y1="108" x2="745.0" y2="144" stroke="#C9A227" stroke-width="1.2" stroke-dasharray="2 3"/><text x="745.0" y="102" text-anchor="middle" class="sans" font-size="12.5" fill="#8E5A2A">evidence + lineage</text><line x1="962" y1="168" x2="1028" y2="168" stroke="#8E5A2A" stroke-width="2" stroke-opacity=".5"/><rect x="990.0" y="146" width="10" height="44" rx="3" fill="#C9A227"/><line x1="995.0" y1="108" x2="995.0" y2="144" stroke="#C9A227" stroke-width="1.2" stroke-dasharray="2 3"/><text x="995.0" y="102" text-anchor="middle" class="sans" font-size="12.5" fill="#8E5A2A">review + release</text>
    <rect x="28" y="124" width="184" height="88" rx="14" fill="#FFFFFF" stroke="#1F3A66" stroke-width="2"/><text x="120" y="162" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#0E1F3A">RAW</text><text x="120" y="198" text-anchor="middle" class="sans" font-size="12" fill="#6B6B6B">as captured</text><rect x="278" y="124" width="184" height="88" rx="14" fill="#FFFFFF" stroke="#1F3A66" stroke-width="2"/><text x="370" y="152" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#0E1F3A">WORK /</text><text x="370" y="172" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#0E1F3A">QUARANTINE</text><text x="370" y="198" text-anchor="middle" class="sans" font-size="12" fill="#6B6B6B">checked, held if unclear</text><rect x="528" y="124" width="184" height="88" rx="14" fill="#FFFFFF" stroke="#1F3A66" stroke-width="2"/><text x="620" y="162" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#0E1F3A">PROCESSED</text><text x="620" y="198" text-anchor="middle" class="sans" font-size="12" fill="#6B6B6B">validated + normalized</text><rect x="778" y="124" width="184" height="88" rx="14" fill="#FFFFFF" stroke="#1F3A66" stroke-width="2"/><text x="870" y="152" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#0E1F3A">CATALOG /</text><text x="870" y="172" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#0E1F3A">TRIPLETS</text><text x="870" y="198" text-anchor="middle" class="sans" font-size="12" fill="#6B6B6B">indexed with lineage</text><rect x="1028" y="124" width="184" height="88" rx="14" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2"/><text x="1120" y="162" text-anchor="middle" class="sans" font-size="16" font-weight="700" letter-spacing="1" fill="#FFFFFE">PUBLISHED</text><text x="1120" y="198" text-anchor="middle" class="sans" font-size="12" fill="#C9A227">released, reversible</text>
    <line x1="120" y1="232" x2="1120" y2="232" stroke="#D9CFBD" stroke-width="2"/>
    <g class="sans" font-size="13">
      <path d="M370,232 V284 H470" fill="none" stroke="#C9A227" stroke-width="2" stroke-dasharray="5 5"/>
      <rect x="470" y="266" width="260" height="36" rx="18" fill="#FFFFFF" stroke="#C9A227" stroke-width="1.6"/>
      <text x="600" y="289" text-anchor="middle" fill="#6B5410">HOLD — rights or sensitivity unclear</text>
      <path d="M870,232 V284 H900" fill="none" stroke="#A33A3A" stroke-width="2" stroke-dasharray="5 5"/>
      <rect x="900" y="266" width="300" height="36" rx="18" fill="#FFFFFF" stroke="#A33A3A" stroke-width="1.6"/>
      <text x="1050" y="289" text-anchor="middle" fill="#7A2626">ABSTAIN / DENY — evidence not resolved</text>
    </g>
    <circle class="tok t1" cx="0" cy="232" r="8" fill="#3B7A57" stroke="#FFFFFF" stroke-width="2"/><circle class="tok t2" cx="0" cy="232" r="8" fill="#C9A227" stroke="#FFFFFF" stroke-width="2"/><circle class="tok t3" cx="0" cy="232" r="8" fill="#A33A3A" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="1278" height="348" rx="18" fill="none" stroke="#D9CFBD" stroke-width="2"/>
</svg>

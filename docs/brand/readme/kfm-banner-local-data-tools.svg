<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="t d">
  <title id="t">Tools · Local Data — Capture exact bytes. Prove them later.</title>
  <desc id="d">Banner: a terminal runs the local data tools — doctor, plan, sync and verify — with what each step does.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="218" rx="18"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lbl{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2.5px;font-weight:700}
      .ln{opacity:1}@keyframes ln{0%{opacity:0}2%,92%{opacity:1}100%{opacity:0}}
      .cur{animation:cur 1s steps(1) 1 both}@keyframes cur{50%{opacity:0}}
      @media (prefers-reduced-motion: reduce){.ln,.cur{animation:none!important}.ln{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="220" fill="#FAF7F0"/>
<rect width="1280" height="6" fill="#4A6FA5"/>
    <text x="48" y="60" class="lbl" fill="#4A6FA5">TOOLS · LOCAL DATA</text>
    <text x="48" y="112" class="serif" font-size="36" fill="#0E1F3A">Capture exact bytes. Prove them later.</text>
    <text x="48" y="150" class="sans" font-size="16.5" fill="#4A4A4A">describe · plan · sync · verify — hashes first, a lock while writing, receipts</text><text x="48" y="172" class="sans" font-size="16.5" fill="#4A4A4A">after.</text>
    <g transform="translate(48,202)" class="sans" font-size="12" fill="#6B6B6B"><circle cx="5" cy="-4" r="4" fill="#4A6FA5"/><text x="16" y="0">Kansas Frontier Matrix</text></g>
    <line x1="776" y1="34" x2="776" y2="186" stroke="#D9CFBD"/>
<rect x="800" y="30" width="440" height="160" rx="12" fill="#0B1F3A"/><circle cx="818" cy="46" r="5" fill="#E27B7B"/><circle cx="834" cy="46" r="5" fill="#5E6E7C"/><circle cx="850" cy="46" r="5" fill="#62B487"/><defs><clipPath id="tc"><rect x="814" y="58" width="420" height="128"/></clipPath></defs><g clip-path="url(#tc)"><g class="ln" style="animation-delay:0s"><text x="816" y="76" class="mono" font-size="11.5" fill="#DCE6F3">$ python3 tools/local_data/doctor.py</text><text x="816" y="90" class="mono" font-size="10.5" fill="#62B487">✓ prerequisites only, nothing fetched</text></g><g class="ln" style="animation-delay:0s"><text x="816" y="106" class="mono" font-size="11.5" fill="#DCE6F3">$ manage.py plan --manifest … --downloads …</text><text x="816" y="120" class="mono" font-size="10.5" fill="#62B487">✓ read-only: hashes, space, actions</text></g><g class="ln" style="animation-delay:0s"><text x="816" y="136" class="mono" font-size="11.5" fill="#DCE6F3">$ manage.py sync --manifest … --downloads …</text><text x="816" y="150" class="mono" font-size="10.5" fill="#62B487">✓ exclusive lock, quarantine objects</text></g><g class="ln" style="animation-delay:0s"><text x="816" y="166" class="mono" font-size="11.5" fill="#DCE6F3">$ manage.py verify --manifest …</text><text x="816" y="180" class="mono" font-size="10.5" fill="#62B487">✓ bytes, bindings, receipts</text></g></g><rect class="cur" x="816" y="186" width="8" height="12" fill="#5E6E7C"/>
  </g>
  <rect x="1" y="1" width="1278" height="218" rx="18" fill="none" stroke="#D9CFBD" stroke-width="2"/>
</svg>

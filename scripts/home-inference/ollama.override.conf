# Drop-in for the official Ollama Linux service. Install as
#   /etc/systemd/system/ollama.service.d/kfm.conf
# then: sudo systemctl daemon-reload && sudo systemctl restart ollama
# Verify every value after restart with: systemctl show ollama -p Environment
# See docs/home-inference.md, Phase 1.
[Service]
# Loopback only. Only the KFM gateway talks to Ollama; never tunnel or forward 11434.
Environment="OLLAMA_HOST=127.0.0.1:11434"
# Home compute only: cloud-marked models must not run remotely through this host.
Environment="OLLAMA_NO_CLOUD=1"
# One loaded model and one generation, matching the gateway's admission.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_QUEUE=4"
Environment="OLLAMA_KEEP_ALIVE=30m"
# Pin context explicitly; the gateway profile pins num_ctx per request as well.
Environment="OLLAMA_CONTEXT_LENGTH=8192"
# Hardening that leaves GPU devices and the model store (/usr/share/ollama) usable.
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
Restart=always
RestartSec=5

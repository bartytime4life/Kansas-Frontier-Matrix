# Drop-in for the official Ollama Linux service. Install as
#   /etc/systemd/system/ollama.service.d/kfm.conf
# then: sudo systemctl daemon-reload && sudo systemctl restart ollama
# Verify afterwards with host-check.sh. Ollama has no authentication of its own:
# it must only ever listen on loopback, behind the KFM gateway.
[Service]
Environment=OLLAMA_HOST=127.0.0.1:11434
# Home compute only: refuse cloud-hosted models that would run off this machine.
Environment=OLLAMA_NO_CLOUD=1
# One loaded model and one generation at a time; the gateway queues the rest.
Environment=OLLAMA_MAX_LOADED_MODELS=1
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_MAX_QUEUE=4
# Keep the default model warm between visitors; a cold load can take minutes.
Environment=OLLAMA_KEEP_ALIVE=30m
# Match contextTokens in profiles.json. A request with a different num_ctx
# forces Ollama to reload the model, so give every profile of one model the same value.
Environment=OLLAMA_CONTEXT_LENGTH=8192

Restart=always
RestartSec=5
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectControlGroups=yes
ProtectKernelTunables=yes
RestrictSUIDSGID=yes
LockPersonality=yes
# Left off on purpose: ProtectKernelModules and PrivateDevices break NVIDIA/ROCm
# device setup on some drivers.

# Optional once your approved models are pulled: forbid Ollama all network access
# except loopback. Comment these two lines out again before `ollama pull`.
#IPAddressDeny=any
#IPAddressAllow=localhost

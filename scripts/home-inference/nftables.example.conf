#!/usr/sbin/nft -f
# Example inbound policy for a dedicated inference PC. The tunnel and the
# polling worker are both outbound, so nothing needs to be reachable from the
# internet or the LAN except SSH from your admin subnet. Edit ADMIN_LAN.
# Ubuntu ufw equivalent:
#   sudo ufw default deny incoming && sudo ufw default allow outgoing
#   sudo ufw allow from 192.168.1.0/24 to any port 22 proto tcp && sudo ufw enable
define ADMIN_LAN = 192.168.1.0/24

table inet kfm_inference {
  chain input {
    type filter hook input priority filter; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto ipv6-icmp accept
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
    ip saddr $ADMIN_LAN tcp dport 22 ct state new limit rate 10/minute accept
    # Never add 11434 (Ollama) or 8787 (gateway) here.
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}

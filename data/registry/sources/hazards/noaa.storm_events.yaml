  "title": "NOAA NCEI Storm Events Database: Kansas event-details pilot",
  "description": "Admitted scope: the Kansas (STATE_FIPS 20) rows of one data year's NCEI Storm Events details file (StormEvents_details-ftp_v1.0_dYYYY_cYYYYMMDD.csv.gz), chosen as the newest creation vintage the NCEI csvfiles/ listing names for that year, read by connectors/noaa/src/noaa/storm_events_capture.py. Pipeline records carry the short source_id noaa-storm-events. The fatalities and locations files are out of scope, and episode and event narratives are never copied into a candidate. Admitted by the repository owner on 2026-10-12. Stored as JSON, which is valid YAML, so the shared SourceDescriptor validator reads it directly.",

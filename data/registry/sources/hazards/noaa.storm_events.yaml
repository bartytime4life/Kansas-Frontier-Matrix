  "authority_rank": "authoritative_for_role",
  "authority_notes": "NOAA NCEI publishes the Storm Events Database from reports National Weather Service forecast offices compile under NWS Directive 10-1605. The records are forecaster-compiled historical event reports (the owner set the product role to administrative on 2026-09-28), not instrument measurements, current warnings, disaster declarations or damage surveys. Damage figures are nominal estimates in event-year USD. NCEI reissues a data year's file under a new creation date when reports are corrected; each vintage is a separate source state.",

    "limitations": "Admission covers the Kansas rows of one data year's details file. A record says a National Weather Service office reported an event of that type in that county or zone over that local-time window; it is not a measurement, footprint, inundation extent, warning or declaration. Begin and end coordinates, where present, are report points, not a path or area. Damage is a nominal, unadjusted estimate; blank damage is unreported, never zero. Rows with unreadable damage or casualty values or an end before the begin are withheld and counted. Selection is by NCEI's STATE_FIPS, not a spatial join. The absence of a record does not mean no hazard occurred.",

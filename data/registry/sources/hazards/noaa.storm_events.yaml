  "sensitivity_default": "public",
  "sensitivity_notes": "Event rows carry county or forecast-zone names, begin and end coordinates, and casualty counts, all published by NCEI. Episode and event narratives are unreviewed free text that may describe individuals or private property; the pilot keeps only whether a narrative exists. The fatalities file (age, sex, location of each death) is out of scope.",

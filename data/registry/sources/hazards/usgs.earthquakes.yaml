    "limitations": "Admission covers ComCat earthquakes in the Kansas context envelope for one data year. A record is a catalog solution at retrieval, not a measurement of shaking, damage or felt intensity, and not an attribution of cause. Epicenters are estimates with kilometre-scale uncertainty; coordinates, depth and magnitude are rounded to four decimal places. Records outside a coarse Kansas rectangle carry CONTEXT_MARGIN; inside it is not proof of Kansas. Magnitudes of different types (ml, md, mb_lg, mww) are not interchangeable. Deleted solutions are withheld and counted. A month whose query reaches the 5000-event limit refuses the capture. The catalog's detection threshold varies with time and place, so the absence of a record does not mean no earthquake occurred.",

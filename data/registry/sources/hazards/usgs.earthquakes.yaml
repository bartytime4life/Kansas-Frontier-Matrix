  "title": "USGS ANSS Comprehensive Catalog (ComCat): Kansas earthquake pilot",
  "description": "Admitted scope: earthquakes (FDSN eventtype=earthquake) whose epicenter lies in the Kansas context envelope (-102.1 to -94.5 longitude, 36.9 to 40.1 latitude) in one data year, captured as twelve calendar-month FDSN event queries (format=geojson, limit 5000, orderby=time-asc, nodata=204) by connectors/usgs/src/usgs/earthquake_capture.py. Pipeline records carry the short source_id usgs-earthquakes. The envelope includes margins of Oklahoma, Missouri, Nebraska and Colorado; it is not the state boundary. Admitted by the repository owner on 2026-10-12. Stored as JSON, which is valid YAML, so the shared SourceDescriptor validator reads it directly.",
  "domain_scope": ["hazards"],

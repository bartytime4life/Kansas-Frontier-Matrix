  "authority_rank": "authoritative_for_role",
  "authority_notes": "The USGS National Earthquake Information Center publishes ComCat, the Advanced National Seismic System catalog, merging solutions from contributing networks (for example us, ok, nm). A record is the preferred catalog solution at retrieval: origin time, epicenter, depth and magnitude estimated from seismograph data. Automatic solutions are later reviewed and may change or be deleted; the preferred event id can change when contributing solutions are associated. A solution is not a shaking estimate, damage report or attribution of cause (for example induced seismicity).",

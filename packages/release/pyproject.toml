[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kfm-release"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["kfm-connectors-core", "kfm-hashing", "kfm-policy-runtime", "kfm-evidence-resolver"]

[tool.hatch.build.targets.wheel]
packages = ["src/release"]

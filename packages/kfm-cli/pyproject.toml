[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kfm-cli"
version = "0.1.0"
description = "Small developer CLI utilities for Kansas Frontier Matrix."
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.6,<1.4",
    "rich>=15.0.0,<16",
    "typer>=0.27.2,<0.28",
]

[project.scripts]
kfm = "kfm_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kfm_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/kfm_cli",
]

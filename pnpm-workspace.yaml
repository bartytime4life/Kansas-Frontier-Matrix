# picomatch <=4.0.7 has an unpatched ReDoS (GHSA-fc5q-39xc-vjpf). Until a fixed
# release exists, the upstream fix (micromatch/picomatch#264) is applied to the
# only locked version. The audit classifier accepts the advisory only through
# configs/dependency-patches/audit-exceptions.json, bound to this patch's hash.
patchedDependencies:
  "picomatch@4.0.7": "configs/dependency-patches/picomatch-4.0.7.patch"

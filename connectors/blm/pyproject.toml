# Package metadata for the BLM connector source tree under src/blm.
# Runtime needs only the standard library and the in-repository connectors-core
# package (packages/connectors-core); no distribution or release is implied.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kfm-connector-blm"
version = "0.0.0"
description = "BLM PLSS (CadNSDI) query planning and GeoJSON parsing, injected-transport retrieval episodes, and candidate routing"
requires-python = ">=3.11"
dependencies = ["kfm-connectors-core"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["blm"]

[tool.setuptools.package-data]
blm = ["descriptor.yaml"]

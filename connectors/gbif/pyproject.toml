# Package metadata for the GBIF connector source tree under src/gbif.
# Runtime needs only the standard library and the in-repository connectors-core
# package (packages/connectors-core); no distribution or release is implied.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kfm-connector-gbif"
version = "0.0.0"
description = "GBIF occurrence-search planning, injected-transport retrieval episodes, and candidate routing"
requires-python = ">=3.11"
dependencies = ["kfm-connectors-core"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gbif"]

[tool.setuptools.package-data]
gbif = ["descriptor.yaml"]

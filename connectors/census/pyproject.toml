# Package metadata for the Census connector source tree under src/census.
# Runtime needs only the standard library and the in-repository connectors-core
# package (packages/connectors-core); no distribution or release is implied.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kfm-connector-census"
version = "0.0.0"
description = "Census ACS API and TIGER/Line planning, injected-transport retrieval episodes, and candidate routing"
requires-python = ">=3.11"
dependencies = ["kfm-connectors-core"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["census"]

[tool.setuptools.package-data]
census = ["descriptor.yaml"]

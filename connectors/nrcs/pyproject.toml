# Package metadata for the NRCS connector source tree under src/nrcs.
# Runtime needs only the standard library and the in-repository connectors-core
# package (packages/connectors-core); no distribution or release is implied.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kfm-connector-nrcs"
version = "0.0.0"
description = "NRCS SCAN (AWDB) station-data planning, injected-transport retrieval episodes, and candidate routing"
requires-python = ">=3.11"
dependencies = ["kfm-connectors-core"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nrcs"]

[tool.setuptools.package-data]
nrcs = ["descriptor.yaml"]

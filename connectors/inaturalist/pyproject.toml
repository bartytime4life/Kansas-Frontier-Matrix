# Package metadata for the iNaturalist connector source tree under src/inaturalist.
# Runtime needs only the standard library and the in-repository connectors-core
# package (packages/connectors-core); no distribution or release is implied.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kfm-connector-inaturalist"
version = "0.0.0"
description = "iNaturalist observations cursor planning, injected-transport retrieval episodes, and candidate routing"
requires-python = ">=3.11"
dependencies = ["kfm-connectors-core"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["inaturalist"]

[tool.setuptools.package-data]
inaturalist = ["descriptor.yaml"]
